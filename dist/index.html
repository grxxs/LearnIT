"Przed usunięciem","Po scaleniu rekordów"],e:"after undelete: po przywróceniu rekordu z kosza, używane rzadko (np. do ponownego powiązania danych)."},{id:"w09-14",q:"Czy Trigger.old jest dostępne w before insert?",a:["Nie","Tak","Tylko dla obiektów Custom","Tylko w trybie bulk"],e:"before insert: Trigger.new ✅, Trigger.old ❌, bo nie ma starej wersji nowego rekordu."},{id:"w09-15",q:"W których zdarzeniach dostępne są zarówno Trigger.new, jak i Trigger.old?",a:["before update i after update","before insert i after insert","before delete i after delete","after undelete"],e:"Obie kolekcje są dostępne tylko przy update (before i after)."},{id:"w09-16",q:"Czy Trigger.new jest dostępne w before delete?",a:["Nie, dostępne jest tylko Trigger.old","Tak","Tak, ale jest puste","Tylko w after delete"],e:"before delete: Trigger.new ❌, Trigger.old ✅."},{id:"w09-17",q:"Która kolekcja jest dostępna w after undelete?",a:["Trigger.new","Trigger.old","Obie","Żadna"],e:"after undelete: Trigger.new ✅, Trigger.old ❌."},{id:"w09-18",q:"W jakiej klasie zawarte są zmienne kontekstowe triggera?",a:["System.Trigger","Database.Trigger","Apex.Context","Schema.Trigger"],e:"Zmienne kontekstowe zawarte są w klasie System.Trigger."},{id:"w09-19",q:"Do czego służą zmienne kontekstowe triggera?",a:["Pozwalają sprawdzić kontekst DML, przetwarzane rekordy i czy to before/after, co umożliwia pisanie uniwersalnych triggerów","Do przechowywania danych między transakcjami","Do definiowania pól obiektu","Do konfiguracji uprawnień"],e:"Zmienne kontekstowe pozwalają sprawdzić operację, rekordy, before/after i dodatkowe informacje, co umożliwia uniwersalne triggery."},{id:"w09-20",q:"Która flaga mówi, że trigger działa przed zapisaniem danych?",a:["Trigger.isBefore","Trigger.isInsert","Trigger.isExecuting","Trigger.isAfter"],e:"Trigger.isBefore: przed zapisem. Trigger.isAfter: po zapisie."},{id:"w09-21",q:"Co oznacza flaga Trigger.isExecuting?",a:["Że to trigger wywołał bieżący kod","Że trigger jest w trakcie insert","Że trigger jest wyłączony","Że trigger działa asynchronicznie"],e:"Trigger.isExecuting: czy trigger wywołał ten kod."},{id:"w09-22",q:"Która flaga oznacza, że trigger działa po przywróceniu rekordu z kosza?",a:["Trigger.isUndelete","Trigger.isDelete","Trigger.isRestore","Trigger.isAfter"],e:"Trigger.isUndelete: działa po przywróceniu rekordu z kosza."},{id:"w09-23",q:"Jakiego typu są flagi kontekstowe (isInsert, isBefore…)?",a:["Boolean","Integer","String","Enum"],e:"Wszystkie flagi kontekstowe są typu Boolean."},{id:"w09-24",q:"Trigger ma ustawić Title = 'Nie określono' w nowych kontaktach bez tytułu. Jakie zdarzenie wybrać?",a:["before insert","after insert","before delete","after update"],e:"Modyfikacja pól przed zapisem nowego rekordu to before insert: wystarczy przypisać wartość w Trigger.new, bez DML."},{id:"w09-25",q:"Jak sprawdzić, że pole tekstowe jest puste lub zawiera tylko spacje?",a:["String.isBlank(con.Title)","con.Title == ''","con.Title.isEmpty()","String.isNull(con.Title)"],e:"String.isBlank() zwraca true dla null, pustego i białych znaków. Używane w przykładach z wykładu."},{id:"w09-26",q:"Jak dodać błąd przypisany do konkretnego pola (a nie całego rekordu)?",a:["acc.Name.addError('…')","acc.addFieldError('Name', '…')","Trigger.addError(acc.Name)","throw new FieldException('Name')"],e:"acc.Name.addError('…') przypisuje błąd do pola Name. acc.addError('…') przypisuje go do całego rekordu."},{id:"w09-27",q:"Jaki warunek sprawdza trigger dla Opportunity z wykładu (before update)?",a:["Czy otwarta szansa (IsClosed == false) ma CloseDate w przeszłości","Czy kwota przekracza 1 mld","Czy brak nazwy","Czy Type = 'Customer'"],e:"Jeśli szansa nie jest zamknięta, a CloseDate < Date.today(), to opp.CloseDate.addError(…)."},{id:"w09-28",q:"Jak w triggerze before insert na Lead znormalizować e-mail do małych liter?",a:["leadRecord.Email = leadRecord.Email.trim().toLowerCase();","update leadRecord.Email.toLowerCase();","insert leadRecord.Email.lower();","Trigger.new.Email = lower(Email);"],e:"W before insert wystarczy przypisać wartość: Email = Email.trim().toLowerCase(). Nie potrzeba DML."},{id:"w09-29",q:"Trigger after insert na Account tworzy zadania (Task). Jaki jest poprawny wzorzec?",a:["Zebrać Taski w liście w pętli i wykonać jeden insert po pętli","Wykonać insert Task wewnątrz pętli dla każdego konta","Zmodyfikować Trigger.new, dodając Taski","Użyć before insert, bo konto nie ma jeszcze Id"],e:"Zbieramy w List<Task> i wykonujemy insert raz (bulk). Task.WhatId = acc.Id wymaga after insert."},{id:"w09-30",q:"Którą kolekcję iteruje trigger before delete blokujący usunięcie kont typu 'Customer'?",a:["Trigger.old","Trigger.new","Trigger.newMap","Trigger.size"],e:"W before delete Trigger.new jest niedostępne, więc iteruje się po Trigger.old."},{id:"w09-31",q:"Jakie pole Task łączy zadanie z kontem w przykładzie z wykładu?",a:["WhatId","AccountId","WhoId","ParentId"],e:"W przykładzie: WhatId = acc.Id."},{id:"w09-32",q:"Co zrobi trigger myAccountTrigger (before insert, before update), gdy Industry == null?",a:["Ustawi Industry = 'General'","Zablokuje zapis","Usunie rekord","Nic"],e:"if (acc.Industry == null) acc.Industry = 'General'; addError jest wywoływane tylko, gdy AnnualRevenue > 1 mld."},{id:"w09-33",q:"Ile zdarzeń wyzwalaczy łącznie omówiono (grupy before i after)?",a:["7 (3 before + 4 after)","6 (3 + 3)","8 (4 + 4)","4"],e:"before: insert, update, delete. after: insert, update, delete, undelete. Nie ma 'before undelete'."},{id:"w09-34",q:"Które zdarzenie NIE istnieje?",a:["before undelete","after undelete","before delete","after delete"],e:"Undelete ma tylko wariant after."}],Ry={id:xy,title:Ey,questions:Ny},Iy="w10",Oy="W10 · Podstawy LWC",My=[{id:"w10-01",q:"Czym jest Lightning Web Components (LWC)?",a:["Nowoczesnym frameworkiem Salesforce do budowania UI w aplikacjach Lightning, opartym na natywnych technologiach webowych","Językiem programowania backendu Salesforce","Narzędziem low-code do budowy procesów","Starszym frameworkiem zastąpionym przez Aurę"],e:"LWC to nowoczesny framework Salesforce do budowania interfejsów, bazujący na natywnych standardach webowych."},{id:"w10-02",q:"Na jakich natywnych technologiach webowych bazuje LWC?",a:["HTML Custom Elements, HTML Templates, Shadow DOM, ES6 Modules","jQuery, Bootstrap, AngularJS","Visualforce, Aura, Apex","React, JSX, Redux"],e:"LWC bazuje na Custom Elements (<c-my-component>), HTML Templates, Shadow DOM (izolacja) i ES6 Modules."},{id:"w10-03",q:"Która technologia zapewnia izolację stylów i logiki komponentu LWC?",a:["Shadow DOM","ES6 Modules","HTML Templates","Locker Service"],e:"Shadow DOM zapewnia izolację stylów i logiki."},{id:"w10-04",q:"Jak wygląda znacznik własnego komponentu LWC w HTML (Custom Element)?",a:["<c-my-component>","<lwc:myComponent>","<myComponent/>","<c:myComponent>"],e:"Custom Elements to własne znaczniki HTML, np. <c-my-component> (camelCase zamieniany na kebab-case z prefiksem c-)."},{id:"w10-05",q:"W jakim katalogu projektu tworzy się komponenty LWC?",a:["force-app/main/default/lwc","src/components","force-app/main/default/classes","force-app/lwc/components"],e:"Komponenty tworzy się w force-app/main/default/lwc/<nazwaKomponentu>/."},{id:"w10-06",q:"Skąd pochodzi nazwa komponentu LWC?",a:["Z nazwy katalogu i plików","Z atrybutu name w pliku .js","Z nazwy klasy Apex","Z pliku package.json"],e:"Nazwa katalogu i plików to nazwa komponentu."},{id:"w10-07",q:"Który plik LWC zawiera metadane komponentu?",a:[".js-meta.xml",".html",".css",".svg"],e:".html to szablon, .js to logika, .js-meta.xml to metadane, .css to styl (opcjonalny), .svg to ikona (opcjonalna)."},{id:"w10-08",q:"Które pliki komponentu LWC są opcjonalne?",a:[".css i .svg",".html i .js",".js-meta.xml i .css",".js i .svg"],e:"Styl (.css) i ikona (.svg) są opcjonalne."},{id:"w10-09",q:"Jakim poleceniem instaluje się komponent w Org-u (VS Code)?",a:["SFDX: Deploy This Source To Org","npm publish","git push origin org","SFDX: Retrieve Source from Org"],e:"Zainstalowanie komponentu: SFDX: Deploy This Source To Org."},{id:"w10-10",q:"Za co odpowiada plik .html komponentu LWC?",a:["Definiuje strukturę (layout) i elementy UI; używa dyrektyw jak for:each, lwc:if","Zawiera logikę biznesową i obsługę zdarzeń","Określa, gdzie komponent może być używany","Definiuje ikonę komponentu"],e:"Szablon .html definiuje strukturę i elementy UI. Używa HTML, Lightning Base Components i dyrektyw (for:each, if:true, lwc:if)."},{id:"w10-11",q:"Które z poniższych to dyrektywy szablonu LWC?",a:["for:each, if:true, lwc:if","v-for, v-if","ng-repeat, ng-if","*ngFor, *ngIf"],e:"Dyrektywy LWC: for:each, if:true, lwc:if. Pozostałe to Vue i Angular."},{id:"w10-12",q:"Za co odpowiada plik .js komponentu LWC?",a:["Logikę, właściwości, metody, obsługę zdarzeń, komunikację, pobieranie danych i cykl życia","Wyłącznie wygląd komponentu","Definicję miejsc użycia komponentu","Ikonę komponentu"],e:"Plik .js: logika biznesowa, właściwości i metody, obsługa zdarzeń, komunikacja, dane (Apex, Lightning Data Service) i lifecycle hooks."},{id:"w10-13",q:"Za pomocą czego plik .js komponentu pobiera i aktualizuje dane Salesforce?",a:["Apex oraz Lightning Data Service","Bezpośrednich zapytań SQL","Plików CSV","Visualforce"],e:"Logika .js obsługuje pobieranie i aktualizację modelu danych, np. przez Apex oraz Lightning Data Service."},{id:"w10-14",q:"Co określa plik .js-meta.xml?",a:["Czy komponent jest dostępny w Lightning App Builder i gdzie może być używany (App/Home/Record Page, Flow Screens)","Logikę obsługi zdarzeń","Kolory komponentu","Strukturę HTML"],e:".js-meta.xml określa dostępność w Lightning App Builder, miejsca użycia (targets), Flow Screens oraz etykietę, opis i właściwości konfiguracyjne."},{id:"w10-15",q:"Jak domyślnie działają style z pliku .css komponentu LWC?",a:["Są ograniczone do komponentu (CSS scoping, Shadow DOM)","Są globalne dla całej strony","Nadpisują style SLDS całej aplikacji","Działają tylko w Experience Cloud"],e ement) komponentu","Element <body> strony","Wszystkie komponenty potomne","Element rodzica"],e:":host to selektor głównego elementu komponentu LWC."},{id:"w10-32",q:"Czym jest klasa LightningElement?",a:["Klasą bazową każdego komponentu LWC, zapewniającą renderowanie, reaktywność, zdarzenia i cykl życia","Klasą Apex do obsługi UI","Komponentem bazowym biblioteki SLDS","Klasą testową"],e:"LightningElement to klasa bazowa każdego komponentu: renderowanie HTML, reaktywność (@track, @api), zdarzenia i cykl życia."},{id:"w10-33",q:"Które z poniższych to metody cyklu życia komponentu LWC?",a:["connectedCallback(), disconnectedCallback()","onInit(), onDestroy()","componentDidMount(), componentWillUnmount()","beforeInsert(), afterInsert()"],e:"LightningElement realizuje cykl życia, np. connectedCallback() i disconnectedCallback()."},{id:"w10-34",q:"Gdzie uruchamia się komponent LWC?",a:["Bezpośrednio w przeglądarce użytkownika","Na serwerze Salesforce","W bazie danych Org-a","W kontekście asynchronicznym Apex"],e:"Komponent LWC uruchamia się bezpośrednio w przeglądarce, a z backendem komunikuje się np. przez Apex."},{id:"w10-35",q:"Do czego służy zastosowanie LWC w Utility Bar?",a:["Do tworzenia narzędzi dostępnych z paska narzędzi aplikacji","Do osadzania w zewnętrznych aplikacjach","Do portali społeczności","Do ekranów Flow"],e:"Utility Bar to narzędzia dostępne z paska narzędzi aplikacji."},{id:"w10-36",q:"Co umożliwia Lightning Out?",a:["Osadzanie komponentów Lightning w zewnętrznych aplikacjach internetowych","Wylogowanie z Lightning","Eksport danych z Org-a","Przełączenie do Salesforce Classic"],e:"Lightning Out to osadzanie komponentów Lightning w zewnętrznych aplikacjach internetowych."},{id:"w10-37",q:"Do czego służą Custom Tabs w kontekście LWC?",a:["Udostępnianie komponentów jako samodzielnych kart aplikacji","Tworzenie zakładek w przeglądarce","Definiowanie pól obiektu","Grupowanie rekordów"],e:"Custom Tabs udostępniają komponenty jako samodzielne karty aplikacji."},{id:"w10-38",q:"Gdzie użyć LWC, aby był elementem ekranu procesu automatyzacji?",a:["Flow Screens","Utility Bar","Lightning Out","Home Pages"],e:"Flow Screens: komponenty LWC jako elementy ekranów Salesforce Flow."},{id:"w10-39",q:"Do czego służy LWC w Experience Cloud?",a:["Do tworzenia interfejsów portali i społeczności","Do aplikacji konsolowych","Do aplikacji mobilnej","Do pisania triggerów"],e:"Experience Cloud to interfejsy portali i społeczności dla użytkowników zewnętrznych."},{id:"w10-40",q:"Do czego służą Record Pages?",a:["Do prezentacji i obsługi danych konkretnego rekordu","Do budowania własnych stron aplikacji","Do strony głównej","Do raportów"],e:"Record Pages: prezentacja i obsługa danych konkretnego rekordu. App Pages: własne strony aplikacji."}],Wy={id:Iy,title:Oy,questions:My},Fy="w11",_y="W11 · Komunikacja między komponentami LWC",By=[{id:"w11-01",q:"Jak realizuje się komunikację Rodzic → Dziecko w LWC?",a:["Przez właściwości (properties) dziecka oznaczone @api, ustawiane przez rodzica","Przez CustomEvent wysyłany przez rodzica","Przez Lightning Message Service obowiązkowo","Przez wywołanie Apex"],e:"Rodzic → Dziecko: przekazywanie danych w dół za pomocą właściwości, z użyciem @api."},{id:"w11-02",q:"Jak realizuje się komunikację Dziecko → Rodzic w LWC?",a:["Dziecko wysyła zdarzenie CustomEvent do rodzica","Dziecko ustawia właściwość @api rodzica","Dziecko wywołuje metodę Apex rodzica","Nie jest to możliwe"],e:"Dziecko → Rodzic: komponent dziecka wysyła zdarzenia CustomEvent do rodzica."},{id:"w11-03",q:"Jak komunikują się komponenty rodzeństwa (wspólny rodzic)?",a:["Za pomocą wspólnego rodzica: dziecko 1 wysyła zdarzenie, rodzic aktualizuje dane dziecka 2","Bezpośrednio przez @api","Bezpośrednio przez wywołanie metody drugiego dziecka","Przez wspólną zmienną globalną window"],e:"Rodzeństwo ↔ rodzeństwo: pośrednikiem jest wspólny rodzic. Dziecko 1 → zdarzenie → rodzic → właściwość dziecka 2."},{id:"w11-04",q:"Czym jest Lightning Message Service w kontekście komunikacji?",a:["Globalną komunikacją publikacja–subskrypcja w całej aplikacji, niezależnie od hierarchii","Komunikacją Rodzic → Dziecko","Usługą e-mail Salesforce","Mechanizmem wywołań Apex"],e:"Lightning Message Service to globalna komunikacja typu publish/subscribe, niezależna od hierarchii komponentów."},{id:"w11-05",q:"Który dekorator czyni właściwość dziecka dostępną dla rodzica?",a:["@api","@track","@wire","@public"],e:"@api message; to właściwość dostępna dla rodzica."},{id:"w11-06",q:"Jak rodzic przekazuje wartość 'Witaj' do właściwości message dziecka?",a:['<c-child-component message="Witaj"></c-child-component>','<c-child-component @api.message="Witaj">',"this.child.message = 'Witaj' w Apex",'<c-child-component onmessage="Witaj">'],e:'Rodzic osadza dziecko i ustawia atrybut: <c-child-component message="…">.'},{id:"w11-07",q:"Jak dziecko tworzy zdarzenie o nazwie 'notify' z danymi?",a:["new CustomEvent('notify', { detail: { text: '…' } })","new Event('onnotify', { data: '…' })","fireEvent('notify', '…')","new LightningEvent('notify')"],e:"const myEvent = new CustomEvent('notify', { detail: { … } });"},{id:"w11-08",q:"Jak dziecko wysyła utworzone zdarzenie?",a:["this.dispatchEvent(myEvent)","this.emit(myEvent)","publish(myEvent)","this.fire(myEvent)"],e:"this.dispatchEvent(myEvent);"},{id:"w11-09",q:"Jak rodzic nasłuchuje zdarzenia 'notify' od dziecka?",a:["<c-child-component onnotify={handleNotification}>","<c-child-component notify={handleNotification}>","<c-child-component on-notify={handleNotification}>","<c-child-component @notify={handleNotification}>"],e:"Nazwa atrybutu to 'on' + nazwa zdarzenia: onnotify={handleNotification}."},{id:"w11-10",q:"Gdzie w obiekcie zdarzenia znajdują się dane przesłane przez dziecko?",a:["event.detail","event.target.value","event.payload","event.data"],e:"Dane przekazane w CustomEvent są w event.detail, np. event.detail.text."},{id:"w11-11",q:"Jaki wzorzec komunikacyjny pozwala komponentom niezależnym hierarchicznie wymieniać informacje bez wspólnego rodzica?",a:["Publisher–Subscriber (Pub/Sub)","Model–View–Controller","Singleton","Rodzic–Dziecko"],e:"Publisher–Subscriber: jeden komponent publikuje zdarzenie (publish), inny je subskrybuje (subscribe)."},{id:"w11-12",q:"Jakie minimalne funkcje ma moduł pubsub.js z wykładu?",a:["subscribe, unsubscribe, publish","send, receive","on, off, emit, once","connect, disconnect"],e:"Minimalna funkcjonalność: subscribe, unsubscribe, publish."},{id:"w11-13",q:"Gdzie umieszcza się moduł pubsub.js?",a:["W odrębnym katalogu lwc/pubsub/","W katalogu classes/","W pliku .js-meta.xml","W statycznych zasobach Apex"],e:"pubsub.js w odrębnym katalogu: lwc/pubsub/."},{id:"w11-14",q:"Jak komponent importuje funkcję publish z kanału pubsub?",a:["import { publish } from 'c/pubsub';","import publish from 'lwc/pubsub';","import { publish } from 'lightning/pubsub';","require('pubsub').publish"],e:"import { publish } from 'c/pubsub'. Prefiks c/ to przestrzeń nazw Custom."},{id:"w11-15",q:"Co oznacza prefiks 'c/' w imporcie 'c/pubsub'?",a:["Przestrzeń nazw Custom (własne komponenty/moduły)","Moduł wbudowany Salesforce","Moduł CSS","Moduł z CDN"],e:"c/ to przestrzeń nazw Custom."},{id:"w11-16",q:"Czy nadawca (Publisher) subskrybuje kanał?",a:["Nie, nadawca używa tylko funkcji publish","Tak, zawsze","Tak, w connectedCallback","Tylko jeśli chce odebrać potwierdzenie"],e:"Nadawca nie subskrybuje kanału, tylko używa funkcji publish."},{id:"w11-17",q:"W której metodzie odbiorca (Subscriber) w przykładzie rejestruje subskrypcję?",a:["connectedCallback()","constructor()","renderedCallback()","handleClick()"],e:"connectedCallback to metoda cyklu życia uruchamiana, gdy komponent jest wstawiany do DOM. Tam wywoływane jest subscribe(…)."},{id:"w11-18",q:"Kiedy uruchamia się connectedCallback?",a:["Gdy komponent jest wstawiany do DOM","Gdy komponent jest usuwany z DOM","Po każdym renderowaniu","Przy wywołaniu Apex"],e:"connectedCallback uruchamia się, gdy komponent jest wstawiany do DOM."},{id:"w11-19",q:"Co robi publish('messageEvent', payload) w implementacji z wykładu?",a:["Wywołuje wszystkie callbacki zarejestrowane dla 'messageEvent', przekazując payload","Zapisuje payload w bazie danych","Wysyła payload do serwera Apex","Tworzy nowy komponent"],e:"publish iteruje po events[eventName] i wywołuje każdy callback z payloadem (w try/catch)."},{id:"w11-20",q:"Co robi unsubscribe w implementacji pubsub z wykładu?",a:["Usuwa konkretny callback z listy słuchaczy danego zdarzenia (filter)","Usuwa wszystkie zdarzenia","Zamyka kanał dla wszystkich","Wyrejestrowuje komponent z DOM"],e:"events[eventName] = events[eventName].filter(listener => listener !== callback)."},{id:"w11-21",q:"Jakie są zalety komunikacji Pub/Sub?",a:["Brak zależności hierarchicznej, mniejsze sprzężenie, łatwość testowania i ponownego użycia","Działa między różnymi Org-ami","Działa między różnymi stronami aplikacji","Nie wymaga JavaScriptu"],e:"Zalety: brak zależności hierarchicznej, czysta architektura, mniejsze sprzężenie, łatwe testowanie i reuse."},{id:"w11-22",q:"Jakie jest ograniczenie komunikacji Pub/Sub z wykładu?",a:["Działa tylko w obrębie jednej strony (Lightning App Page)","Działa tylko między rodzicem i dzieckiem","Wymaga Apex","Działa tylko w aplikacji mobilnej"],e:"Ograniczenie: działa tylko w obrębie jednej strony (Lightning App Page)."},{id:"w11-23",q:"Który komponent w przykładzie (account-container) pobiera dane z Apex?",a:["c-account-container (kontener główny)","c-contact-tile","c-account-header","c-activity-timeline"],e:"c-account-container to komponent nadrzędny. Pobiera dane z Apex (np. AccountController.getAccountDetails) i przechowuje stan."},{id:"w11-24",q:"Jaki poziom zagnieżdżenia ma c-contact-tile w przykładzie?",a:["Komponent potomny poziomu 2 (dziecko c-contact-list)","Komponent potomny poziomu 1","Komponent nadrzędny","Komponent rodzeństwa kontenera"],e:"c-contact-tile to poziom 2 i reprezentuje pojedynczy kontakt na liście c-contact-list (poziom 1)."},{id:"w11-25",q:"Za co odpowiada c-activity-timeline w przykładzie?",a:["Wyświetla historię zadań, rozmów i e-maili","Wyświetla informacje o firmie","Zarządza listą kontaktów","Pobiera dane z Apex"],e:"c-activity-timeline (poziom 1) wyświetla historię zadań, rozmów i e-maili."},{id:"w11-26",q:"Za co odpowiada c-account-header?",a:["Wyświetla podstawowe informacje o firmie (nazwa, branża, rating)","Przechowuje stan wybranego kontaktu","Reprezentuje pojedynczy kontakt","Publikuje wiadomości LMS"],e:"c-account-header (poziom 1) wyświetla podstawowe informacje o firmie."},{id:"w11-27",q:"Komponent A na stronie chce powiadomić niezależny komponent B (brak wspólnego rodzica). Co wybrać?",a:["Pub/Sub (Lightning Message Service)","@api","CustomEvent do rodzica","Bezpośrednie wywołanie metody B"],e:"Komponenty niezależne hierarchicznie komunikują się przez Pub/Sub, czyli LMS."},{id:"w11-28",q:"Co umożliwia komunikacja między komponentami LWC wg wykładu?",a:["Budowanie aplikacji modułowych","Omijanie limitów Apex","Zapis do bazy bez DML","Uruchamianie triggerów"],e:"Komunikacja LWC umożliwia budowanie aplikacji modułowych."}],Ky={id:Fy,title:_y,questions:By},Uy="w12",Jy="W12 · LWC w praktyce (LDS, Apex, dobre praktyki)",Hy=[{id:"w12-01",q:"Co umożliwia Lightning Data Service (LDS)?",a:["Dostęp do rekordów bez konieczności pisania kodu Apex","Wykonywanie zapytań SQL z przeglądarki","Tworzenie triggerów w JS","Komunikację Pub/Sub"],e:"LDS daje dostęp do rekordów bez pisania kodu Apex."},{id:"w12-02",q:"Który moduł trzeba zaimportować, aby korzystać z getRecord i updateRecord?",a:["lightning/uiRecordApi","lwc","@salesforce/apex","c/pubsub"],e:"Konieczny jest import modułu lightning/uiRecordApi."},{id:"w12-03",q:"Jakich elementów LDS używa się do odczytu i aktualizacji rekordu?",a:["@wire(getRecord) i updateRecord()","getAccounts() i insert","publish() i subscribe()","fetch() i XMLHttpRequest"],e:"LDS: @wire(getRecord, …) do odczytu i updateRecord() do aktualizacji."},{id:"w12-04",q:"Jak zaimportować referencję do pola Account.Name w LWC?",a:["import NAME_FIELD from '@salesforce/schema/Account.Name';","import NAME_FIELD from 'lightning/uiRecordApi/Account.Name';","import { Name } from 'Account';","const NAME_FIELD = 'SELECT Name FROM Account';"],e:"Pola importuje się ze schematu: '@salesforce/schema/Account.Name'."},{id:"w12-05",q:"Co oznacza '$recordId' w @wire(getRecord, { recordId: '$recordId', … })?",a:["Reaktywny parametr: wartość właściwości recordId; zmiana wywołuje ponowne pobranie","Literał tekstowy '$recordId'","Zmienną środowiskową","Identyfikator Org-a"],e:"Prefiks $ oznacza reaktywną właściwość. Przy zmianie recordId dane są automatycznie pobierane ponownie."},{id:"w12-06",q:"Jak zaimportować metodę Apex getAccounts z klasy AccountController?",a:["import getAccounts from '@salesforce/apex/AccountController.getAccounts';","import { getAccounts } from 'c/AccountController';","import getAccounts from 'lightning/uiRecordApi';","require('AccountController').getAccounts"],e:"import getAccounts from '@salesforce/apex/AccountController.getAccounts';"},{id:"w12-07",q:"Jaką zaletę ma imperatywne wywołanie metod Apex?",a:["Daje pełną kontrolę, np. wywołanie po kliknięciu przycisku, w warunkach, pętlach","Automatycznie odświeża dane przy zmianie parametrów","Nie wymaga importu","Działa bez Apex"],e:"Imperatywne wywołanie daje pełną kontrolę (przyciski, warunki, pętle). Automatyczne odświeżanie daje @wire."},{id:"w12-08",q:"Jak obsługuje się wynik imperatywnego wywołania Apex z LWC?",a:["Jako Promise: .then(result => …).catch(error => …)","Przez callback onsuccess","Synchronicznie: const r = getAccounts()","Przez Trigger.new"],e:"getAccounts({ industry: 'IT' }).then(result => {…}).catch(error => {…})."},{id:"w12-09",q:"Jaki jest przepływ danych przy imperatywnym wywołaniu Apex z LWC?",a:["LWC → Apex → SOQL → Salesforce (Platforma) → LWC","LWC → SOQL → LWC","Apex → LWC → SOQL","LWC → SQL → Baza danych → LWC"],e:"Przepływ: LWC → Apex → SOQL → Salesforce (Platforma) → LWC."},{id:"w12-10",q:"Czym charakteryzuje się reaktywne wywołanie Apex przez @wire?",a:["Automatycznie odświeża dane przy zmianie parametrów","Wymaga ręcznego wywołania w handlerze kliknięcia","Nie może przyjmować parametrów","Działa tylko z LDS"],e:"@wire daje automatyczne odświeżanie danych przy zmianie parametrów (np. '$industry')."},{id:"w12-11",q:"Co otrzymuje funkcja dekorowana @wire, np. wiredAccounts(…)?",a:["Obiekt z polami data i error","Tylko listę rekordów","Obiekt event","Promise"],e:"wiredAccounts({ data, error }) { if (data) …; else if (error) …; }"},{id:"w12-12",q:"Która praktyka dotyczy architektury komponentów?",a:["Jeden cel = jeden komponent","Jak najgłębsze zagnieżdżanie komponentów","Jeden duży komponent na całą stronę","Logika w CSS"],e:"Architektura: komponenty modularne, jeden cel = jeden komponent, unikanie zagnieżdżania."},{id:"w12-13",q:"Dlaczego należy unikać głębokiego zagnieżdżania komponentów?",a:["Zbyt głęboka hierarchia DOM spowalnia renderowanie","Bo LWC nie pozwala na zagnieżdżanie","Bo powoduje błędy Apex","Bo zwiększa limity SOQL"],e:"Utrzymuj płaską strukturę DOM, bo zbyt głęboka hierarchia spowalnia renderowanie."},{id:"w12-14",q:"Dlaczego warto używać LDS tam, gdzie to możliwe?",a:["Jest szybsze i bezpieczniejsze niż Apex","Bo Apex jest przestarzały","Bo LDS nie ma limitów","Bo LDS pozwala na SQL"],e:"Używaj Lightning Data Service tam, gdzie to możliwe, bo jest szybsze i bezpieczniejsze niż Apex."},{id:"w12-15",q:"Co należy zrobić, jeśli trzeba użyć Apex z LWC?",a:["Czyścić dane i walidować wejście","Wyłączyć Locker Service","Używać without sharing","Przekazywać dane wrażliwe w zdarzeniach"],e:"Jeśli musisz użyć Apex, czyść dane i waliduj wejście."},{id:"w12-16",q:"Czego NIE należy przekazywać przez zdarzenia (events) ani Pub/Sub?",a:["Danych wrażliwych","Identyfikatorów rekordów","Komunikatów tekstowych","Nazw pól"],e:"Nie przekazuj danych wrażliwych przez zdarzenia (events) lub Pub/Sub."},{id:"w12-17",q:"Czego używać do komunikacji między stronami wg dobrych praktyk?",a:["Lightning Message Service","@api","CustomEvent","localStorage"],e:"Do komunikacji między stronami używaj Lightning Message Service."},{id:"w12-18",q:"Jak włączyć caching dla @wire?",a:["@wire(..., { cacheable: true })","@wire.cache()","@track(cache)","import cache from 'lwc'"],e:"Wydajność: włącz caching @wire(…, { cacheable: true })."},{id:"w12-19",q:"Co oznacza 'minimalizuj DOM reflow' w praktyce?",a:["Nie aktualizuj UI w pętli","Nie używaj CSS","Nie używaj @wire","Zawsze przeładowuj stronę"],e:"Minimalizuj DOM reflow, czyli nie aktualizuj UI w pętli."},{id:"w12-20",q:"Kiedy stosować @track lub reaktywne właściwości $?",a:["Tylko tam, gdzie to konieczne","Zawsze, dla każdej właściwości","Nigdy","Tylko w Apex"],e:"Używaj @track lub reaktywnych właściwości $ tylko tam, gdzie to konieczne."},{id:"w12-21",q:"Co stosować dla dużych danych lub komponentów (wydajność)?",a:["Lazy loading","Eager loading wszystkiego na starcie","Synchroniczne pętle","eval()"],e:"Stosuj lazy loading dla dużych danych lub komponentów."},{id:"w12-22",q:"Jaka konwencja nazewnictwa obowiązuje dla klas i zmiennych?",a:["PascalCase dla klas, camelCase dla zmiennych","camelCase dla klas, PascalCase dla zmiennych","snake_case dla wszystkiego","UPPER_CASE dla klas"],e:"PascalCase dla klas, camelCase dla zmiennych."},{id:"w12-23",q:"Których słów kluczowych do deklaracji zmiennych używać w JS LWC?",a:["const i let, nigdy var","Tylko var","var i let","Dowolnych"],e:"Używaj const i let, nigdy var."},{id:"w12-24",q:"Czego używać do dokumentowania funkcji w LWC?",a:["JSDoc","Javadoc","ApexDoc","Markdown w HTML"],e:"Używaj JSDoc do opisu funkcji w LWC. Metody Apex też dokumentuj."},{id:"w12-25",q:"Czego nigdy nie używać w LWC ze względów bezpieczeństwa?",a:["eval() ani dynamicznego HTML-a","const","@wire","SLDS"],e:"Nigdy nie używaj eval() ani dynamicznego HTML-a."},{id:"w12-26",q:"Co należy zrobić z Lightning Locker / Lightning Web Security?",a:["Nie wyłączać (jest automatycznie włączone)","Wyłączyć dla wydajności","Włączyć ręcznie w każdym komponencie","Zastąpić własnym mechanizmem"],e:"Korzystaj z Lightning Locker / LWS, czyli w praktyce nie wyłączaj (automatycznie włączone)."},{id:"w12-27",q:"Co oznacza FLS?",a:["Field-Level Security","Flow Logic Service","Full Lightning Support","Filtered List Selection"],e:"Przestrzegaj zasad CRUD/FLS (Field-Level Security)."},{id:"w12-28",q:"Jak należy obsługiwać błędy w kodzie LWC/Apex wg dobrych praktyk?",a:["Zawsze: try/catch oraz .catch(error => …)","Ignorować, platforma je obsłuży","Tylko console.log","Tylko w Apex"],e:"Zawsze obsługuj błędy: try/catch, .catch(error => …)."}],Vy={id:Uy,title:Jy,questions:Hy},Qy="w13",$y="W13 · Wybrane zagadnienia platformy Salesforce",Gy=[{id:"w13-01",q:"Czym jest aplikacja Lightning (Lightning App)?",a:["Zbiorem komponentów i stron wraz z konfiguracją, tworzącym spójne środowisko pracy użytkownika w Org-u","Pojedynczym komponentem LWC","Aplikacją mobilną instalowaną z App Store","Klasą Apex z interfejsem"],e:"Lightning App to zbiór komponentów i stron www wraz z konfiguracją, tworzący spójne środowisko pracy użytkownika."},{id:"w13-02",q:"W jakim modelu można tworzyć aplikacje Lightning?",a:["No-code, low-code lub pro-code","Tylko pro-code","Tylko no-code","Tylko przez AppExchange"],e:"Aplikacja Lightning jest tworzona w modelu no-code, low-code lub pro-code."},{id:"w13-03",q:"Jakie są główne typy aplikacji Lightning?",a:["Standardowe, niestandardowe (Custom), Console App","Publiczne, prywatne, chronione","Mobilne, desktopowe, webowe","Classic, Aura, LWC"],e:"Główne typy: standardowe (np. Sales, Service), niestandardowe (Custom) i Console App."},{id:"w13-04",q:"Co wyróżnia Console App?",a:["Umożliwia pracę na wielu rekordach jednocześnie","Działa tylko w terminalu","Jest dostępna tylko dla administratorów","Nie ma interfejsu graficznego"],e:"Console App umożliwia pracę na wielu rekordach jednocześnie."},{id:"w13-05",q:"Która warstwa aplikacji Lightning obejmuje pasek aplikacji, ikonę i nazwę widoczną dla użytkownika?",a:["Nawigacja (App Launcher / Menu)","Strony (Lightning Pages)","Komponenty","Kontrola dostępu"],e:"Nawigacja (App Launcher / Menu) to pasek aplikacji, ikona i nazwa aplikacji."},{id:"w13-06",q:"Która warstwa aplikacji Lightning obejmuje widoki, np. strony obiektów i strony główne?",a:["Strony (Lightning Pages)","Dane (Salesforce Objects)","Nawigacja","Komponenty"],e:"Strony (Lightning Pages) to widoki składające się na aplikację."},{id:"w13-07",q:"Która warstwa określa, kto może korzystać z aplikacji i jakie obiekty i rekordy są dostępne?",a:["Kontrola dostępu","Nawigacja","Strony","Komponenty"],e:"Kontrola dostępu: kto może korzystać z aplikacji oraz jakie obiekty i rekordy są dostępne."},{id:"w13-08",q:"Ile warstw aplikacji Lightning wymieniono na wykładzie?",a:["5: nawigacja, strony, komponenty, dane, kontrola dostępu","3: model, widok, kontroler","4: UI, logika, dane, integracja","2: frontend i backend"],e:"Warstwy: Nawigacja, Strony, Komponenty, Dane, Kontrola dostępu."},{id:"w13-09",q:"Jaki jest starszy interfejs platformy Salesforce?",a:["Salesforce Classic","Lightning Experience","Experience Cloud","Agentforce Vibes"],e:"Salesforce Classic to starszy interfejs z tradycyjnym układem zakładek i list rekordów oraz ograniczoną personalizacją."},{id:"w13-10",q:"Która cecha dotyczy Lightning Experience, a nie Classic?",a:["Obsługa LWC i dostęp do nowoczesnych funkcji, w tym Agentforce","Tradycyjny układ oparty na zakładkach","Ograniczone możliwości personalizacji","Brak konfigurowalnych stron"],e:"Lightning Experience: dynamiczny układ z komponentów, konfigurowalne strony, obsługa LWC, Agentforce."},{id:"w13-11",q:"Czy można przełączać się między Lightning Experience a Classic?",a:["Tak","Nie, Classic został usunięty","Tylko w Sandboxie","Tylko przez CLI"],e:"Na slajdach pokazano przełączanie Lightning Experience ⇄ Classic."},{id:"w13-12",q:"Jakie są sposoby pracy z Org-iem?",a:["Zdalny (interfejs webowy) i lokalny (Salesforce CLI, VS Code z Salesforce Extension Pack)","Tylko zdalny","Tylko przez aplikację mobilną","Tylko przez SSH"],e:"Zdalny: interfejs webowy Org-a. Lokalny: Salesforce CLI oraz VS Code z Salesforce Extension Pack."},{id:"w13-13",q:"Jaki plugin VS Code służy do pracy z Salesforce?",a:["Salesforce Extension Pack","Apex Runner","Lightning Studio","Force IDE"],e:"VS Code z pluginem Salesforce Extension Pack."},{id:"w13-14",q:"Czego NIE można zrobić lokalnie przy użyciu Salesforce CLI?",a:["Uruchamiać kodu Apex i uzyskać bezpośredniego dostępu do bazy danych","Edytować plików","Podglądać zasobów statycznych","Podglądać komponentów frontendowych (z serwerem deweloperskim)"],e:"Lokalnie nie można uruchamiać Apex ani mieć bezpośredniego dostępu do bazy, bo kod działa w Org-u."},{id:"w13-15",q:"Co jest możliwe lokalnie z Salesforce CLI?",a:["Edycja plików i podgląd komponentów frontendowych (po instalacji serwera deweloperskiego)","Uruchamianie triggerów","Wykonywanie DML na produkcji bez deployu","Bezpośrednie zapytania SQL do bazy Org-a"],e:"Lokalnie: edycja plików, podgląd zasobów statycznych i komponentów frontendowych (z serwerem deweloperskim)."},{id:"w13-16",q:"Które narzędzia interfejsu webowego Org-a pokazano na wykładzie?",a:["Setup, Developer Console, Lightning App Builder, Agentforce Vibes","Eclipse, IntelliJ, NetBeans","Workbench, Data Loader, Postman","Jenkins, Git, Docker"],e:"Narzędzia webowe: Setup, Developer Console, Lightning App Builder, Agentforce Vibes."},{id:"w13-17",q:"Czym jest Salesforce CLI?",a:["Aplikacją wiersza poleceń instalowaną na komputerze użytkownika","Interfejsem webowym Org-a","Językiem programowania","Typem Org-a"],e:"Salesforce CLI to aplikacja CLI instalowana na komputerze użytkownika (lokalny sposób pracy)."},{id:"w13-18",q:"Która warstwa aplikacji Lightning to elementy interfejsu, standardowe lub niestandardowe (np. LWC)?",a:["Komponenty (Lightning Components)","Strony","Dane","Nawigacja"],e:"Komponenty (Lightning Components) to elementy interfejsu, standardowe (Salesforce) lub niestandardowe (np. LWC)."},{id:"w13-19",q:"Który przykład to standardowa aplikacja Lightning?",a:["Sales lub Service","Aplikacja utworzona przez dewelopera","Komponent LWC","Trigger Apex"],e:"Standardowe to gotowe aplikacje Salesforce, np. Sales, Service."}],Zy={id:Qy,title:$y,questions:Gy},Xy="w14",Yy="W14 · Automatyzacja i analityka modelu danych",ep=[{id:"w14-01",q:"Co obejmuje automatyka biznesowa na poziomie bazy danych (Database-Level Business Automation)?",a:["Mechanizmy automatycznej kontroli poprawności, wyliczania wartości, utrzymania spójności i reagowania na zmiany w rekordach","Budowanie ekranów i formularzy","Administrację serwerem bazy danych","Tworzenie triggerów SQL"],e:"Obejmuje mechanizmy kontroli poprawności, wyliczania wartości, utrzymania spójności i reagowania na zmiany rekordów."},{id:"w14-02",q:"Czy reguły automatyki modelu danych działają, gdy dane są modyfikowane przez API lub import?",a:["Tak, działają niezależnie od sposobu wprowadzania danych","Nie, tylko przy formularzu","Tylko przy imporcie","Tylko gdy włączony jest Flow"],e:"Reguły działają niezależnie od tego, czy dane są wprowadzane przez formularz, API, import czy inny proces."},{id:"w14-03",q:"Do czego służy pole External ID?",a:["Do identyfikowania rekordów na podstawie zewnętrznych identyfikatorów, np. przy integracji i imporcie","Do szyfrowania danych","Do relacji Master-Detail","Do wyświetlania danych zewnętrznych bez kopii"],e:"External ID pozwala identyfikować rekordy na podstawie zewnętrznych identyfikatorów, np. podczas integracji i importu."},{id:"w14-04",q:"Co wymusza atrybut Unique pola?",a:["Unikatowość wartości w obrębie danego obiektu","Podanie wartości","Unikatowość w całym Org-u","Szyfrowanie wartości"],e:"Unique wymusza unikatowość wartości w obrębie danego obiektu. Required wymusza podanie wartości."},{id:"w14-05",q:"Jak zagwarantować, że każda sala (Room__c) ma numer i żadne dwie sale nie mają tego samego numeru?",a:["Ustawić pole Number__c jako Required i Unique","Utworzyć pole Formula","Utworzyć Roll-Up Summary","Utworzyć Record-Triggered Flow"],e:"Przykład z wykładu: pole Number__c wymagane (Required) i unikatowe (Unique)."},{id:"w14-06",q:"Czym są Validation Rules?",a:["Warunkami, które muszą być spełnione, aby rekord mógł zostać zapisany","Polami wyliczanymi","Regułami wykrywania duplikatów","Uprawnieniami użytkowników"],e:"Reguły walidacyjne określają warunki, które muszą być spełnione, aby rekord mógł zostać zapisany."},{id:"w14-07",q:"Czego NIE robią Validation Rules?",a:["Nie wyliczają i nie zapisują wartości pól","Nie kontrolują zakresów wartości","Nie blokują zapisu niepoprawnych rekordów","Nie wyświetlają komunikatów o błędach"],e:"Validation Rules wymuszają informacje, kontrolują zakresy, daty i zależności, blokują zapis i pokazują komunikaty. Wyliczanie to Formula Fields."},{id:"w14-08",q:"Gdzie definiuje się Validation Rules?",a:["Setup → Object Manager → Validation Rules","Setup → Data → Duplicate Management","Developer Console → Triggers","App Launcher → Rules"],e:"Setup → Object Manager → (obiekt) → Validation Rules."},{id:"w14-09",q:"Który mechanizm wybrać, by sprawdzić, że koniec rezerwacji jest po jej rozpoczęciu?",a:["Validation Rule","Roll-Up Summary","Formula Field","Duplicate Rule"],e:"Tabela porównawcza: Validation Rules → kontrola poprawności, np. koniec rezerwacji po jej rozpoczęciu."},{id:"w14-10",q:"Do czego służą Formula Fields?",a:["Do automatycznego wyliczania wartości na podstawie innych pól","Do agregowania danych rekordów podrzędnych","Do blokowania zapisu","Do wykrywania duplikatów"],e:"Pola formuł automatycznie wyliczają wartości na podstawie innych pól."},{id:"w14-11",q:"Który mechanizm wybrać, by wyliczyć czas trwania rezerwacji?",a:["Formula Field","Roll-Up Summary","Validation Rule","Apex Trigger obowiązkowo"],e:"Formula Fields: automatyczne wyliczanie wartości, np. czasu trwania rezerwacji."},{id:"w14-12",q:"Co robią Roll-Up Summary Fields?",a:["Automatycznie aktualizują wartość w rekordzie nadrzędnym na podstawie rekordów podrzędnych","Wyliczają wartość z pól tego samego rekordu","Blokują duplikaty","Wysyłają powiadomienia"],e:"Roll-Up Summary automatycznie aktualizuje wartości w rekordzie nadrzędnym na podstawie powiązanych rekordów podrzędnych."},{id:"w14-13",q:"Dla jakiej relacji działa Roll-Up Summary?",a:["Tylko Master-Detail","Tylko Lookup","Master-Detail i Lookup","External Lookup"],e:"Mechanizm działa tylko dla relacji Master-Detail."},{id:"w14-14",q:"Jakie operacje oferuje Roll-Up Summary?",a:["COUNT, SUM, MIN, MAX","COUNT, SUM, AVG, MEDIAN","SUM, AVG","COUNT_DISTINCT, AVG"],e:"Dostępne operacje: COUNT, SUM, MIN, MAX. AVG nie ma na liście!"},{id:"w14-15",q:"Który mechanizm wybrać, by w Room__c automatycznie zliczać powiązane rezerwacje Event__c?",a:["Roll-Up Summary (COUNT) – Number_of_Events__c","Formula Field","Validation Rule","Duplicate Rule"],e:"Przykład: Room__c.Number_of_Events__c zlicza powiązane rezerwacje Event__c (Roll-Up Summary)."},{id:"w14-16",q:"Z jakich elementów korzysta Duplicate Management?",a:["Matching Rules (kryterium tożsamości) i Duplicate Rules (sposób reakcji)","Validation Rules i Formula Fields","Triggers i Flows","Unique i Required"],e:"Matching Rules to kryterium tożsamości, Duplicate Rules to sposób reakcji."},{id:"w14-17",q:"Co określają Matching Rules?",a:["Kryterium tożsamości (kiedy rekordy uznać za duplikaty)","Sposób reakcji na duplikat","Warunek zapisu rekordu","Formułę wyliczania"],e:"Matching Rules określają kryterium tożsamości. Duplicate Rules określają reakcję."},{id:"w14-18",q:"Które działanie NIE jest dostępną reakcją Duplicate Rules?",a:["Automatyczne scalenie rekordów","Zablokowanie utworzenia duplikatu","Wyświetlenie ostrzeżenia","Dopuszczenie zapisu i zarejestrowanie zdarzenia"],e:"Możliwe działania: blokada, ostrzeżenie, dopuszczenie zapisu z rejestracją zdarzenia."},{id:"w14-19",q:"Gdzie konfiguruje się zarządzanie duplikatami?",a:["Setup → Data → Duplicate Management","Setup → Object Manager → Validation Rules","Setup → Object Manager → Fields & Relationships","Developer Console"],e:"Setup → Data → Duplicate Management."},{id:"w14-20",q:"Który mechanizm wybrać, by system nie pozwalał na dwóch klientów o tym samym NIP?",a:["Duplicate Rules (wykrywanie duplikatów)","Roll-Up Summary","Formula Field","Record-Triggered Flow"],e:"Przykład z wykładu: powtarzający się NIP obsługują Duplicate Rules."},{id:"w14-21",q:"Kiedy warto użyć Apex Trigger zamiast narzędzi deklaratywnych?",a:["Przy regułach obejmujących wiele rekordów, złożonych zależnościach i operacjach trudnych do wykonania w Flow","Do prostego wymuszenia wartości pola","Do wyliczenia czasu trwania z dwóch pól","Do zliczania rekordów Master-Detail"],e:"Triggery służą do reguł obejmujących wiele rekordów, złożonych walidacji między obiektami i niestandardowych operacji niewygodnych w Flow."},{id:"w14-22",q:"Który mechanizm wybrać do kontroli kolizji czasowych rezerwacji tej samej sali?",a:["Apex Trigger","Formula Field","Unique Field","Roll-Up Summary"],e:"Przykład: system rezerwacji sal sprawdza kolizje czasowe, a to realizuje Apex Trigger."},{id:"w14-23",q:"Kiedy może uruchamiać się Record-Triggered Flow?",a:["Przy Create, Update, Create or Update oraz (w odpowiednich konfiguracjach) Delete","Tylko przy Create","Tylko według harmonogramu","Tylko po kliknięciu przycisku"],e:"Record-Triggered Flow: Create, Update, Create or Update, Delete (tylko w odpowiednich konfiguracjach)."},{id:"w14-24",q:"Co może robić Record-Triggered Flow?",a:["Aktualizować i tworzyć rekordy, wysyłać powiadomienia, operować na powiązanych danych","Tylko blokować zapis","Tylko wyliczać formuły","Tworzyć triggery SQL"],e:"Flow może aktualizować inne rekordy, tworzyć nowe, wysyłać powiadomienia i operować na powiązanych danych."},{id:"w14-25",q:"Czy Record-Triggered Flow jest mechanizmem relacyjnej bazy danych?",a:["Nie, to narzędzie automatyzacji platformy Salesforce","Tak, to trigger SQL","Tak, to procedura składowana","Tak, to widok bazy danych"],e:"Ważne: Record-Triggered Flow jest narzędziem automatyzacji platformy, a nie mechanizmem relacyjnej bazy danych."},{id:"w14-26",q:"Czy Salesforce pozwala definiować własne triggery SQL w fizycznej bazie danych?",a:["Nie, mechanizmy działają na poziomie platformy Salesforce","Tak, przez Developer Console","Tak, w Sandboxie","Tak, przez Salesforce CLI"],e:"Salesforce nie udostępnia bezpośredniego dostępu do fizycznej bazy ani triggerów SQL."},{id:"w14-27",q:"Które mechanizmy zaliczono do 'kontroli i integralności danych'?",a:["Required, Unique, Validation Rules, Duplicate Rules","Formula Fields, Roll-Up Summary","Apex Triggers, Record-Triggered Flow","LWC, Aura"],e:"Kontrola i integralność: Required, Unique, Validation Rules, Duplicate Rules."},{id:"w14-28",q:"Które mechanizmy zaliczono do 'automatycznego przetwarzania danych'?",a:["Formula Fields i Roll-Up Summary Fields","Validation Rules i Duplicate Rules","Apex Triggers i Flow","Required i Unique"],e:"Automatyczne przetwarzanie danych: Formula Fields, Roll-Up Summary Fields."},{id:"w14-29",q:"Które mechanizmy zaliczono do 'automatyzacji procesów związanych z danymi'?",a:["Apex Triggers i Record-Triggered Flow","Formula Fields i Roll-Up Summary","Required i Unique","Matching Rules"],e:"Automatyzacja procesów: Apex Triggers, Record-Triggered Flow."},{id:"w14-30",q:"Który mechanizm wybrać, by po utworzeniu rezerwacji automatycznie zaktualizować rekord sali (bez kodu)?",a:["Record-Triggered Flow","Validation Rule","Formula Field","Unique Field"],e:"Tabela: Record-Triggered Flow to automatyczne wykonywanie działań, np. aktualizacja powiązanych rekordów."},{id:"w14-31",q:"Gdzie tworzy się pola formuł i Roll-Up Summary?",a:["Setup → Object Manager → Fields & Relationships","Setup → Data → Duplicate Management","Setup → Process Automation","Developer Console → Fields"],e:"Oba typy pól tworzy się w Setup → Object Manager → Fields & Relationships."}],ap={id:Xy,title:Yy,questions:ep},op="w15",np="W15 · Flow & Flow Builder",ip=[{id:"w15-01",q:"Czym jest Salesforce Flow (jako ogólne pojęcie)?",a:["Ogólnym określeniem mechanizmów do tworzenia i uruchamiania automatyzacji metodą deklaratywną (bez kodu)","Językiem programowania automatyzacji","Rodzajem triggera Apex","Biblioteką JS dla LWC"],e:"Salesforce Flow to ogólne określenie mechanizmów deklaratywnej automatyzacji. Obejmuje też m.in. Flow Orchestration i Flow Integration."},{id:"w15-02",q:"Czym jest Flow Builder?",a:["Graficznym narzędziem typu Web IDE do tworzenia i konfigurowania Flow-ów","Kompilatorem Apex","Narzędziem CLI","Aplikacją mobilną"],e:"Flow Builder to graficzne narzędzie Web IDE (Web-based Integrated Development Environment)."},{id:"w15-03",q:"Czego struktura przypomina pojedynczy Flow?",a:["Schemat blokowy","Tabelę bazy danych","Klasę obiektową","Arkusz kalkulacyjny"],e:"Flow to konfiguracja automatyzacji o strukturze przypominającej schemat blokowy."},{id:"w15-04",q:"Czy Flow może oddziaływać na systemy zewnętrzne?",a:["Tak, umożliwia integrację z systemami zewnętrznymi","Nie, tylko na dane w Org-u","Tylko przez Apex","Tylko w Experience Cloud"],e:"Flow może oddziaływać na dane w Org-u i w systemach zewnętrznych."},{id:"w15-05",q:"Jak może być uruchamiany Flow?",a:["Manualnie przez użytkownika lub automatycznie przez zmianę danych, zdarzenie lub harmonogram","Tylko manualnie","Tylko przez Apex","Tylko przez harmonogram"],e:"Flow może być uruchamiany manualnie lub automatycznie: przez zmianę danych, zdarzenie lub harmonogram."},{id:"w15-06",q:"Jaka była ewolucja narzędzi automatyzacji Salesforce?",a:["Workflow Rules → Process Builder → Flow Builder","Flow Builder → Process Builder → Workflow Rules","Process Builder → Workflow Rules → Flow Builder","Apex → Flow → Workflow"],e:"Ewolucja: Workflow Rules → Process Builder → Flow Builder."},{id:"w15-07",q:"Czym były Workflow Rules?",a:["Prostymi regułami typu IF–THEN (e-mail, aktualizacja pól, zadania)","Graficznym narzędziem do złożonych procesów z rozgałęzieniami","Mechanizmem wieloetapowych akceptacji","Językiem skryptowym"],e:"Workflow Rules to proste reguły IF–THEN. Process Builder to graficzne, bardziej złożone procesy."},{id:"w15-08",q:"Do czego służą Approval Processes?",a:["Do obsługi wieloetapowych procesów akceptacji (np. rabatów, wydatków)","Do wykrywania duplikatów","Do harmonogramowania zadań","Do tworzenia ekranów"],e:"Approval Processes obsługują wieloetapowe procesy akceptacji, np. zatwierdzanie rabatów, wydatków czy ofert."},{id:"w15-09",q:"Do czego służy aplikacja Automation (Automation Lightning App)?",a:["Do centralnego zarządzania, monitorowania i kontrolowania procesów automatyzacji w Org-u","Do pisania kodu Apex","Do tworzenia obiektów","Do zarządzania użytkownikami"],e:"Automation to aplikacja do centralnego zarządzania, monitorowania i kontrolowania automatyzacji (Flows, Flow Logs, Monitor)."},{id:"w15-10",q:"Jaka jest ścieżka do listy Flow-ów w Setup?",a:["Setup → PLATFORM TOOLS → Process Automation → Flows","Setup → Object Manager → Flows","Setup → Data → Flows","Setup → Users → Flows"],e:"Setup → PLATFORM TOOLS → Process Automation → Flows, a New Flow otwiera Flow Builder."},{id:"w15-11",q:"Który rodzaj Flow umożliwia interaktywne procesy z udziałem użytkownika (formularze)?",a:["Screen Flow","Autolaunched Flow","Schedule-Triggered Flow","Platform Event-Triggered Flow"],e:"Screen Flow to interaktywne procesy z formularzami, polami i listami wyboru, obsługiwane przez człowieka lub agenta."},{id:"w15-12",q:"Jakie są przykładowe zastosowania Screen Flow?",a:["Rejestracja klienta, zgłoszenie serwisowe","Nocna aktualizacja statusów","Przetwarzanie płatności z systemu zewnętrznego","Reakcja na zmiany w Data Cloud"],e:"Screen Flow: rejestracja klienta, zgłoszenie serwisowe."},{id:"w15-13",q:"Kiedy może wykonywać działania Record-Triggered Flow względem zapisu?",a:["Przed zapisem (Before-Save) lub po zapisie (After-Save)","Tylko po zapisie","Tylko przed zapisem","Tylko po usunięciu"],e:"Record-Triggered Flow pozwala wykonywać działania przed zapisem (Before-Save) lub po zapisie (After-Save)."},{id:"w15-14",q:"Który rodzaj Flow uruchamia się według harmonogramu i przetwarza grupę rekordów?",a:["Schedule-Triggered Flow","Record-Triggered Flow","Screen Flow","Autolaunched Flow"],e:"Schedule-Triggered Flow uruchamia się w określonym terminie i według harmonogramu, bez interakcji użytkownika."},{id:"w15-15",q:"Który Flow nadaje się do okresowego generowania zadań dla pracowników?",a:["Schedule-Triggered Flow","Screen Flow","Platform Event-Triggered Flow","Data Cloud-Triggered Flow"],e:"Schedule-Triggered Flow: przypomnienia o terminach, aktualizacja nieaktywnych rekordów, okresowe zadania."},{id:"w15-16",q:"Jak działa Platform Event-Triggered Flow?",a:["Uruchamia się po odebraniu Platform Event i działa asynchronicznie","Uruchamia się po kliknięciu przycisku","Działa synchronicznie z procesem, który wygenerował zdarzenie","Uruchamia się według harmonogramu"],e:"Uruchamia się po odebraniu zdarzenia platformowego. Działa asynchronicznie, niezależnie od procesu, który wygenerował zdarzenie."},{id:"w15-17",q:"Który Flow nie obsługuje ekranów i nie ma własnego mechanizmu wyzwalającego?",a:["Autolaunched Flow","Screen Flow","Record-Triggered Flow","Schedule-Triggered Flow"],e:"Autolaunched Flow działa bez interakcji użytkownika, bez ekranów i bez własnego triggera."},{id:"w15-18",q:"Czym może być uruchamiany Autolaunched Flow?",a:["Innym Flow, kodem Apex, REST API, przyciskiem lub akcją","Tylko zmianą rekordu","Tylko harmonogramem","Tylko Platform Event"],e:"Autolaunched Flow uruchamia inny Flow, Apex, REST API, przycisk lub akcja użytkownika."},{id:"w15-19",q:"Który rodzaj Flow służy do budowania wielokrotnie wykorzystywanych fragmentów logiki?",a:["Autolaunched Flow (wywoływany jako Subflow)","Screen Flow","Schedule-Triggered Flow","Data Cloud-Triggered Flow"],e:"Autolaunched Flow umożliwia budowanie wielokrotnie wykorzystywanej logiki, wywoływanej np. przez Subflow."},{id:"w15-20",q:"Na co reaguje Data Cloud-Triggered Flow?",a:["Na zmiany danych w Salesforce Data 360 (Data Cloud)","Na kliknięcia w UI","Na zmiany w kodzie Apex","Na Platform Events"],e:"Data Cloud-Triggered Flow reaguje na zmiany danych w Data 360 (DMO, CIO)."},{id:"w15-21",q:"Co oznacza skrót DMO w Data Cloud?",a:["Data Model Objects – obiekty ujednoliconego modelu danych","Dynamic Metadata Objects","Data Migration Operations","Default Model Output"],e:"DMO = Data Model Objects (ujednolicony model danych). CIO = Calculated Insight Objects (wyniki obliczeń i analiz)."},{id:"w15-22",q:"Co przechowują Calculated Insight Objects (CIO)?",a:["Wyniki obliczeń i analiz danych","Ujednolicony model danych","Definicje ekranów","Logi Flow"],e:"CIO przechowują wyniki obliczeń i analiz danych."},{id:"w15-23",q:"Który Flow wybrać, by utworzyć Lead po osiągnięciu określonego poziomu zaangażowania klienta (dane z Data 360)?",a:["Data Cloud-Triggered Flow","Screen Flow","Schedule-Triggered Flow","Autolaunched Flow"],e:"Przykład z wykładu dla Data Cloud-Triggered Flow."},{id:"w15-24",q:"Jakie są trzy obszary interfejsu Flow Builder?",a:["Toolbox, Canvas, Button Bar","Editor, Console, Debugger","Palette, Properties, Outline","Header, Body, Footer"],e:"① Toolbox (przybornik), ② Canvas (obszar roboczy), ③ Button Bar (pasek przycisków)."},{id:"w15-25",q:"Co pokazuje Button Bar w Flow Builder?",a:["Czy Flow jest aktywny, znacznik czasu zapisu, wersję, ostrzeżenia i błędy","Listę zmiennych i formuł","Diagram Flow","Listę rekordów"],e:"Button Bar pokazuje informacje o Flow: aktywność, czas zapisu, wersję, ostrzeżenia i błędy."},{id:"w15-26",q:"Co zawiera Toolbox w Flow Builder?",a:["Listę elementów i zasobów utworzonych we Flow (zmienne, formuły, opcje wyboru)","Diagram Flow","Przyciski Save i Activate","Logi błędów"],e:"Toolbox to lista elementów i zasobów utworzonych we Flow."},{id:"w15-27",q:"Jakie są trzy główne składniki Flow?",a:["Elementy, łączniki (Connectors), zasoby (Resources)","Klasy, metody, pola","Obiekty, pola, rekordy","Ekrany, przyciski, formularze"],e:"Elementy (węzły), łączniki (przebieg) i zasoby (dane, niewidoczne na diagramie)."},{id:"w15-28",q:"Które składniki Flow nie są widoczne na diagramie?",a:["Zasoby (Resources)","Elementy","Łączniki","Decyzje"],e:"Zasoby (zmienne, stałe, formuły, szablony, opcje wyboru) nie są widoczne na diagramie."},{id:"w15-29",q:"Jakie są trzy typy elementów Flow?",a:["Interaction, Logic, Data","Input, Process, Output","Screen, Action, Loop","Before, After, Async"],e:"Interaction to interakcja z użytkownikiem, Logic to interakcja Flow z samym sobą, Data to interakcja z modelem danych."},{id:"w15-30",q:"Do którego typu elementów należą Screen, Action i Subflow?",a:["Interaction","Logic","Data","Resource"],e:"Elementy interakcji: Screen, Action, Subflow."},{id:"w15-31",q:"Do czego służy element Action?",a:["Do wykonania operacji lub wywołania zewnętrznej funkcjonalności, np. wysłania e-maila lub kodu Apex","Do przypisania wartości zmiennej","Do podziału kolekcji","Do pobierania rekordów"],e:"Action wykonuje gotowe akcje Salesforce (e-mail, powiadomienia), kod Apex i akcje z pakietów."},{id:"w15-32",q:"Do czego służy element Subflow?",a:["Do wywołania innego Flow z poziomu bieżącego przepływu (z przekazaniem danych)","Do zagnieżdżenia pętli","Do wywołania triggera","Do podziału ekranu"],e:"Subflow wywołuje inny Flow, przekazuje dane wejściowe i odbiera wyniki, co ułatwia modularyzację."},{id:"w15-33",q:"Który element Flow jest odpowiednikiem if-else / switch?",a:["Decision","Assignment","Loop","Transform"],e:"Decision to odpowiednik if-else albo switch, z wieloma ścieżkami wykonania."},{id:"w15-34",q:"Który element Flow jest odpowiednikiem for / while?",a:["Loop","Decision","Collection Sort","Subflow"],e:"Loop to odpowiednik for albo while ","Tworzy rekordy","Filtruje kolekcję w pamięci","Usuwa rekordy"],e:"Get Records pobiera jeden rekord lub kolekcję i zapisuje je w zmiennych."},{id:"w15-43",q:"Który konektor przekierowuje proces w przypadku błędu?",a:["Fault Connector","Standard Connector","Go To Connector","Wait Connector"],e:"Fault Connector to przekierowanie procesu w przypadku błędu elementu."},{id:"w15-44",q:"Który konektor kontynuuje proces po zdarzeniu lub upływie czasu?",a:["Wait Connector","Loop Connector","Fault Connector","Decision Outcome Connector"],e:"Wait Connector kontynuuje proces po wystąpieniu zdarzenia lub upływie czasu."},{id:"w15-45",q:"Który konektor pozwala przejść do wskazanego elementu, również w innej części diagramu?",a:["Go To Connector","Standard Connector","Loop Connector","Wait Connector"],e:"Go To Connector to przejście do wskazanego elementu w dowolnym miejscu diagramu."},{id:"w15-46",q:"Który konektor wybiera ścieżkę na podstawie wyniku warunku (True/False)?",a:["Decision Outcome Connector","Standard Connector","Fault Connector","Go To Connector"],e:"Decision Outcome Connector wybiera ścieżkę na podstawie wyniku warunku."},{id:"w15-47",q:"Jaki charakter mają zasoby (Resources) Flow?",a:["Tymczasowy – wartości przechowywane w pamięci na czas wykonywania instancji Flow","Trwały – zapisywane w bazie danych","Globalny dla całego Org-a","Przechowywane w ciasteczkach"],e:"Zasoby są tymczasowe: wartości przechowywane w pamięci na czas wykonywania danej instancji Flow."},{id:"w15-48",q:"Jak dodać nowy zasób we Flow Builder?",a:["Toolbox → New Resource","Canvas → ⨁ → Resource","Setup → Resources","Button Bar → Add"],e:"Toolbox → New Resource. Zarządzanie zasobami odbywa się w Toolbox → Manager."},{id:"w15-49",q:"Który zasób przechowuje niezmienną wartość używaną w całym Flow?",a:["Constant","Variable","Formula","Stage"],e:"Constant to niezmienna wartość, np. minimalna pojemność sali."},{id:"w15-50",q:"Który zasób służy do przygotowania treści wiadomości e-mail ze zmiennymi?",a:["Text Template","Formula","Choice","Constant"],e:"Text Template to szablon tekstowy zawierający zmienne i inne zasoby."},{id:"w15-51",q:"Który zasób definiuje etap procesu wieloetapowego?",a:["Stage","Choice","Record","Loop"],e:"Stage definiuje etap procesu, np. postęp obsługi zamówienia."},{id:"w15-52",q:"Który zasób udostępnia wartości listy wyboru z pola Salesforce?",a:["Picklist Choice Set","Record Choice Set","Collection Choice Set","Choice"],e:"Picklist Choice Set udostępnia wartości picklisty z pola, np. statusy rezerwacji."},{id:"w15-53",q:"Który zasób tworzy opcje wyboru na podstawie rekordów modelu danych?",a:["Record Choice Set","Picklist Choice Set","Record Collection","Choice"],e:"Record Choice Set to opcje z rekordów, np. wybór pokoju z istniejących pomieszczeń."},{id:"w15-54",q:"Która zmienna globalna zawiera dane rekordu, który wyzwolił Record-Triggered Flow?",a:["$Record","$Record__Prior","$Flow","$User"],e:"$Record to rekord wyzwalający. $Record__Prior to wartości sprzed aktualizacji."},{id:"w15-55",q:"Co zawiera $Record__Prior?",a:["Wartości rekordu sprzed aktualizacji","Poprzedni Flow","Rekord nadrzędny","Poprzedniego użytkownika"],e:"$Record__Prior zawiera wartości rekordu sprzed aktualizacji."},{id:"w15-56",q:"Która zmienna globalna daje dostęp do etykiet niestandardowych (Custom Labels)?",a:["$Label","$System","$Organization","$Permission"],e:"$Label daje dostęp do Custom Labels."},{id:"w15-57",q:"Co zawiera zmienna globalna $Flow?",a:["Informacje o aktualnie wykonywanym przepływie, np. data uruchomienia, komunikat błędu","Listę wszystkich Flow w Org-u","Dane zalogowanego użytkownika","Dane organizacji"],e:"$Flow zawiera informacje o bieżącym przepływie: data uruchomienia, czas wykonania, komunikat błędu."},{id:"w15-58",q:"Która stała globalna reprezentuje pusty ciąg znaków?",a:["$GlobalConstant.EmptyString","$GlobalConstant.Null","$GlobalConstant.False","$System.Empty"],e:"Stałe globalne: True, False, EmptyString, Null."},{id:"w15-59",q:"Jaki zasób automatycznie udostępnia element Loop?",a:["Bieżący rekord przetwarzany w iteracji","Wybraną ścieżkę (Outcome)","Wartości z formularza","Kolekcję pobranych rekordów"],e:"Loop udostępnia bieżący rekord. Decision udostępnia Outcome, Screen wartości z formularza, a Get Records Record lub Record Collection."},{id:"w15-60",q:"Czy zmienne globalne Flow można zwykle modyfikować?",a:["Zasadniczo są tylko do odczytu; niektóre, np. $Flow.CurrentStage, można modyfikować","Tak, wszystkie","Nie, żadnej nie można ani odczytać","Tylko w Debug"],e:"Zmienne globalne są zasadniczo tylko do odczytu. Niektóre, np. $Flow.CurrentStage, można modyfikować w określony sposób."},{id:"w15-61",q:"Czym różni się Save od Activate w Flow Builder?",a:["Save zapisuje Flow (nie można go uruchomić), Activate uaktywnia go (można uruchomić)","To samo","Activate zapisuje, Save uruchamia","Save uruchamia w trybie debug"],e:"Save zapisuje Flow, ale nie można go uruchomić. Activate go uaktywnia. Run uruchamia, Debug uruchamia w trybie debugowania."},{id:"w15-62",q:"Gdzie NIE wymieniono możliwości osadzenia/uruchomienia Flow?",a:["W triggerze SQL bazy danych","Lightning Record Page","Quick Action","List View"],e:"Flow uruchomisz na Record Page, App Page, przez Quick Action, przyciski i linki, w Experience Cloud, Utility Bar, List View i Navigation Tab."},{id:"w15-63",q:"Czego NIE należy umieszczać wewnątrz elementu Loop wg dobrych praktyk?",a:["Get/Create/Update/Delete Records","Assignment","Decision","Zmiennych"],e:"Nie umieszczaj operacji na danych w pętli. Gromadź dane w kolekcjach i wykonuj operacje zbiorczo poza pętlą."},{id:"w15-64",q:"Jak należy wydzielać powtarzalną logikę we Flow?",a:["Do Autolaunched Flow wywoływanego przez Subflow","Kopiować do każdego Flow","Do Screen Flow","Do Schedule-Triggered Flow"],e:"Powtarzalną logikę wydzielaj do Autolaunched Flow i wywołuj przez Subflow."},{id:"w15-65",q:"Które narzędzie służy do analizy kolejności uruchamiania Record-Triggered Flow dla obiektu?",a:["Flow Trigger Explorer","Developer Console","Schema Builder","Debug Log"],e:"Flow Trigger Explorer analizuje i zarządza kolejnością uruchamiania przepływów."},{id:"w15-66",q:"Jak obsługiwać błędy we Flow wg dobrych praktyk?",a:["Definiować Fault Paths, pokazywać zrozumiałe komunikaty i rejestrować błędy","Ignorować błędy","Zawsze przerywać Flow bez komunikatu","Przekazywać błędy do Apex"],e:"Fault Paths, kontrola danych, walidacja wejścia, zrozumiałe komunikaty, rejestrowanie błędów i powiadomienia administratora."},{id:"w15-67",q:"Jak postępować z aktywną wersją Flow przy zmianach?",a:["Tworzyć nowe wersje zamiast modyfikować bezpośrednio aktywną wersję","Modyfikować aktywną wersję na produkcji","Usuwać starą i tworzyć od nowa","Wyłączyć kontrolę wersji"],e:"Kontrola wersji: twórz nowe wersje Flow zamiast modyfikować aktywną wersję. Testuj w Sandboxie."},{id:"w15-68",q:"Kiedy preferować Flow, a kiedy Apex?",a:["Flow dla standardowych procesów i operacji na rekordach; Apex przy złożonej logice lub precyzyjnej kontroli","Zawsze Apex","Zawsze Flow, nawet kosztem bardzo skomplikowanych konstrukcji","Flow tylko dla UI"],e:"Flow dla standardowych procesów. Apex dla złożonej logiki. Nie buduj rozbudowanego Flow tylko po to, by uniknąć kilku linijek kodu."},{id:"w15-69",q:"Co pozwala łączyć możliwości Flow z kodem Apex?",a:["Invocable Apex","Trigger Apex","Anonymous Apex","Batch Apex"],e:"Invocable Apex łączy Flow z Apex, gdy standardowe możliwości Flow są niewystarczające."},{id:"w15-70",q:"Który przykład nazwy technicznej jest zgodny z dobrymi praktykami?",a:["Create_Room_Flow, varRoomName, Get_Available_Rooms","flow1, x, temp","MÓJ FLOW!!!, zmienna 1","a_b_c, Flow-New"],e:"Czytelne nazwy API: Create_Room_Flow, varRoomName, Get_Available_Rooms."},{id:"w15-71",q:"Co oznacza dobra praktyka 'mechanizm pomijania' (bypass)?",a:["Przewidywanie możliwości czasowego wyłączenia wybranych automatyzacji","Omijanie limitów Governor","Pomijanie walidacji danych","Omijanie uprawnień użytkownika"],e:"Mechanizm pomijania (bypass) to możliwość czasowego wyłączenia wybranych automatyzacji."},{id:"w15-72",q:"Który zasób przechowuje kolekcję rekordów modelu danych?",a:["Record Collection","Record","Collection Choice Set","Variable"],e:"Record to pojedynczy rekord, Record Collection to kolekcja rekordów (np. lista dostępnych pokoi)."}],tp={id:op,title:np,questions:ip},rp="w01",lp="W1 · C# i platforma .NET",sp=[{id:"w01-01",q:"W jakiej formie odbywa się zaliczenie przedmiotu wg pierwszego wykładu?",a:["Podchwytliwy test jednokrotnego wyboru","Projekt zaliczeniowy","Egzamin ustny","Test wielokrotnego wyboru z punktami ujemnymi"],e:"Slajd 'Metody oraz kryteria oceny': zaliczenie w postaci podchwytliwego testu jednokrotnego wyboru. Wykładowca uprzedza też o możliwych intencjonalnych „kłamstwach”."},{id:"w01-02",q:"Z czego składa się platforma .NET wg wykładu?",a:["CLR, BCL, kompilatory (Roslyn), JIT (RyuJIT), MSBuild, frameworki i narzędzia (np. NuGet)","JVM, JDK i Maven","Tylko z kompilatora C#","CLR i Visual Studio"],e:".NET to „umbrella term”: CLR (runtime), BCL, kompilatory (Roslyn), JIT (RyuJIT), system budowania (MSBuild), frameworki (ASP.NET, ML.NET, WPF) i narzędzia (NuGet)."},{id:"w01-03",q:"Co oznacza skrót CLR?",a:["Common Language Runtime","Common Library Repository","Compiled Language Runtime","Core Language Resolver"],e:"CLR = Common Language Runtime, czyli środowisko uruchomieniowe .NET (odpowiednik JVM)."},{id:"w01-04",q:"Jak nazywa się kompilator JIT platformy .NET?",a:["RyuJIT","Roslyn","MSBuild","HotSpot"],e:"RyuJIT to kompilator JIT. Roslyn to kompilator C# do kodu pośredniego, MSBuild to system budowania, HotSpot to JVM Javy."},{id:"w01-05",q:"Czym jest Roslyn?",a:["Kompilatorem (C#/VB) platformy .NET","Kompilatorem JIT","Menedżerem pakietów","Środowiskiem uruchomieniowym"],e:"Roslyn to kompilatory platformy. JIT to RyuJIT, pakiety obsługuje NuGet, runtime to CLR."},{id:"w01-06",q:"Do jakiej postaci kompilowany jest kod C#?",a:["Do kodu pośredniego MSIL/CIL, który przy starcie jest kompilowany JIT","Bezpośrednio do kodu maszynowego zawsze","Do bajtkodu JVM","Do JavaScriptu"],e:"Kod jest kompilowany do MSIL/CIL (assembly, zwykle DLL), a przy starcie aplikacji kompiluje go JIT. Do uruchomienia niezbędny jest CLR."},{id:"w01-07",q:"Jakie rozszerzenie mają najczęściej pliki assembly .NET?",a:[".dll",".jar",".so",".class"],e:"Kod jest kompilowany do assembly, najczęściej plików DLL."},{id:"w01-08",q:"Czym jest self-contained deployment?",a:["Dostarczeniem CLR razem z aplikacją (także jako pojedynczy plik wykonywalny)","Wdrożeniem aplikacji wyłącznie na IIS","Kompilacją do WebAssembly","Wdrożeniem bez plików DLL"],e:"CLR może być dostarczony razem z aplikacją (self-contained). Wykładowca uważa to podejście za wskazane."},{id:"w01-09",q:"Od której wersji .NET kompilacja AOT rozwija się coraz bardziej wg wykładu?",a:[".NET 8",".NET 5",".NET Core 3.1",".NET Framework 4.8"],e:"AOT (ahead-of-time) rozwija się coraz bardziej od .NET 8. Wcześniej istniały m.in. .NET Native (UWP) i IL2CPP (Unity)."},{id:"w01-10",q:"Która implementacja .NET działa tylko na Windows i osiągnęła wersję 4.8.1?",a:[".NET Framework",".NET Core",".NET 5","Mono"],e:".NET Framework jest tylko dla Windows (4.8.1). .NET Core jest wieloplatformowy (do 3.1), a .NET 5 to „połączenie”."},{id:"w01-11",q:"Do jakiej wersji dotarł .NET Core, zanim zastąpił go .NET 5?",a:["3.1","4.8.1","2.2","4.0"],e:".NET Core osiągnął wersję 3.1. Potem przyszło .NET 5.0 jako „połączenie”, bez numeru 4, żeby nie mylić z .NET Framework 4.x."},{id:"w01-12",q:"Które wersje .NET mają wsparcie LTS (long-term support)?",a:["Parzyste","Nieparzyste","Wszystkie","Tylko wersje z końcówką .1"],e:"Parzyste to LTS, nieparzyste to STS (short-term support). Aktualna jest .NET 10 (LTS)."},{id:"w01-13",q:"Jaka jest aktualna wersja .NET i C# wg wykładu (2026)?",a:[".NET 10 i C# 14",".NET 9 i C# 13",".NET 8 i C# 12",".NET 11 i C# 15"],e:"Slajd '.NET w roku 2026': .NET 10.0, C# 14.0, .NET Standard 2.1, .NET Framework 4.8.1."},{id:"w01-14",q:"Kto jest twórcą języka C#?",a:["Anders Hejlsberg (autor Delphi i TypeScript)","James Gosling","Bjarne Stroustrup","Guido van Rossum"],e:"Anders Hejlsberg, autor również Delphi oraz TypeScript."},{id:"w01-15",q:"Kiedy ukazała się pierwsza publiczna wersja C#?",a:["W styczniu 2002 (język powstał w 2000)","W 1995","W 2005","W 2010"],e:"C# powstał w 2000 roku, ale pierwsza publiczna wersja pojawiła się w styczniu 2002."},{id:"w01-16",q:"Jakim językiem jest C# wg wykładu?",a:["Wieloparadygmatowym o silnej kontroli typów: głównie obiektowym, ze zdarzeniami i elementami funkcyjnymi","Czysto funkcyjnym","Dynamicznie typowanym skryptowym","Proceduralnym bez klas"],e:"C# jest wieloparadygmatowy, silnie typowany, głównie obiektowy, ze zintegrowanym programowaniem zdarzeniowym i dodatkami funkcyjnymi. Ma GC i jest memory safe."},{id:"w01-17",q:"W której wersji C# pojawiły się LINQ, wyrażenia lambda i metody rozszerzające?",a:["3.0","2.0","5.0","7.0"],e:"C# 3.0 (2007): LINQ, lokalna inferencja typów (var), typy anonimowe, lambdy, metody rozszerzające, automatyczne właściwości."},{id:"w01-18",q:"W której wersji C# pojawiły się typy generyczne?",a:["2.0","3.0","1.0","4.0"],e:"C# 2.0 (2005): klasy statyczne, typy generyczne, metody anonimowe."},{id:"w01-19",q:"W której wersji C# wprowadzono async/await?",a:["5.0","4.0","6.0","7.0"],e:"C# 5.0 (2012): async/await. W 4.0 był typ dynamic, w 6.0 nameof i interpolacja."},{id:"w01-20",q:"W której wersji C# pojawił się typ dynamic?",a:["4.0","3.0","5.0","2.0"],e:"C# 4.0 (2010): dynamic, generyczna ko- i kontrawariancja, argumenty opcjonalne."},{id:"w01-21",q:"W której wersji C# pojawiły się nameof i interpolacja łańcuchów?",a:["6.0","5.0","7.0","8.0"],e:"C# 6.0 (2015): nameof, interpolacja łańcuchów, exception filters."},{id:"w01-22",q:"W której wersji C# pojawiły się domyślne implementacje w interfejsach i switch expressions?",a:["8.0","7.0","9.0","6.0"],e:"C# 8.0 (2019): domyślne implementacje interfejsów, switch expressions, async streams, indeksy i zakresy."},{id:"w01-23",q:"W której wersji C# pojawiły się rekordy i top-level statements?",a:["9.0","8.0","10.0","7.0"],e:"C# 9.0 (2020): rekordy, top-level statements, rozszerzenia pattern matching."},{id:"w01-24",q:"Co wprowadził C# 10?",a:["record struct, globalne using i file-scoped namespace","Rekordy i top-level statements","Primary constructors","async/await"],e:"C# 10 (2021): record structs, global using, file-scoped namespace, stałe interpolowane łańcuchy."},{id:"w01-25",q:"W której wersji C# pojawiły się primary constructors i collection expressions?",a:["12","11","10","14"],e:"C# 12 (2023): primary constructors, collection expressions, opcjonalne parametry lambd."},{id:"w01-26",q:"Co wprowadził C# 11?",a:["Raw string literals, required, wzorce list","Słowo kluczowe field","Primary constructors","Domyślne implementacje interfejsów"],e:"C# 11 (2022): raw string literals, atrybuty generyczne, literały UTF-8, wzorce list, składniki required."},{id:"w01-27",q:"Co wprowadził C# 14 (2025)?",a:["Extension members i słowo kluczowe field","Rekordy","Partial properties","Collection expressions"],e:"C# 14: extension members, słowo kluczowe field, niejawne konwersje dla Span<T>. Partial properties i indeksatory to C# 13."},{id:"w01-28",q:"Co robią top-level statements (C# 9+)?",a:["Automatycznie generują klasę Program i metodę Main(), ograniczając „ceremonię”","Wymuszają statyczne klasy","Pozwalają pisać kod poza assembly","Usuwają potrzebę CLR"],e:"Top-level statements generują klasę Program i Main(). Spotkasz je w Minimal APIs i punktach wejścia dużych aplikacji."},{id:"w01-29",q:"Co jest prawdą o typach wartościowych w C# (np. int)?",a:["Są przekazywane przez wartość, ale nadal są obiektami – dziedziczą po System.ValueType","Nie są obiektami, jak prymitywy w Javie","Są przekazywane przez referencję","Zawsze są przechowywane na stercie"],e:"Typy wartościowe są przekazywane przez wartość, ale to nadal obiekty, bo dziedziczą po System.ValueType."},{id:"w01-30",q:"Czym jest struct w C#?",a:["Złożoną strukturą podobną do klasy, ale typem wartościowym (na stosie)","Typem referencyjnym jak klasa","Aliasem dla record","Typem wskaźnikowym"],e:"struct jest podobny do klasy, ale jest typem wartościowym przechowywanym na stosie."},{id:"w01-31",q:"Jaki zakres ma typ byte w C#?",a:["0 do 255","–128 do 127","–32 768 do 32 767","0 do 65 535"],e:"byte: 0..255 (bez znaku). sbyte: –128..127. Pułapka: inaczej niż w Javie, gdzie byte ma znak."},{id:"w01-32",q:"Jak kodowany jest pojedynczy znak typu char w C#?",a:["UTF-16","ASCII","UTF-8","UTF-32"],e:"char to pojedynczy znak UTF-16. string też przechowuje znaki UTF-16."},{id:"w01-33",q:"Co jest prawdą o słowie kluczowym var?",a:["Działa tylko dla zmiennych lokalnych i zmienna nie może zmienić typu","Tworzy zmienną dynamicznie typowaną","Może być używane dla pól klasy","Ma niemutowalny odpowiednik val"],e:"var: typ z wyrażenia po prawej, tylko zmienne lokalne, typ się nie zmienia (jak auto w C++). Nie ma niemutowalnego odpowiednika."},{id:"w01-34",q:"Który zapis się NIE skompiluje?",a:["var x; x = 5;","var x = 5;","List<int> l = new();","var l = new List<int>();"],e:"var wymaga inicjalizatora, bo typ jest wnioskowany z prawej strony. new() (target-typed) działa, gdy typ jest znany."},{id:"w01-35",q:'Kod: var a = 3; a = "test"; Co się stanie?',a:["Błąd kompilacji – zmienna var nie może zmienić typu","a zmieni typ na string","Wyjątek w czasie wykonania","a będzie typu object"],e:"var to statyczne wnioskowanie typu (int). Przypisanie stringa do int to błąd kompilacji. Zachowanie dynamiczne daje tylko dynamic."},{id:"w01-36",q:"Czym jest string w C#?",a:["Aliasem System.String; łańcuchy są niemutowalne (UTF-16)","Typem wartościowym mutowalnym","Tablicą bajtów","Typem, którego nie można zapisać jako String"],e:"string to skrót do System.String. Można pisać String, ale to niezalecane. Łańcuchy są niemutowalne."},{id:"w01-37",q:'Kod: int? c = null; int d = c ?? -1; Console.WriteLine($"d to {d}"); Co zostanie wypisane?',a:["d to -1","d to ","d to null","Wyjątek NullReferenceException"],e:"Operator ?? (null coalescing) zwraca prawą stronę, gdy lewa jest null."},{id:"w01-38",q:'Co robi _logger?.LogCritical("foo"); gdy _logger jest null?',a:["Nic – wywołanie jest pomijane","Rzuca NullReferenceException","Tworzy nowy logger","Błąd kompilacji"],e:"Operator ?. uruchamia metodę tylko, jeśli obiekt nie jest null."},{id:"w01-39",q:"Który modyfikator parametru oznacza parametr wejściowy, którego nie można zmodyfikować?",a:["in","ref","out","params"],e:"ref to przekazanie przez referencję (z możliwością modyfikacji), out to parametr wyjściowy, in to parametr wejściowy bez modyfikacji."},{id:"w01-40",q:"Co oznacza modyfikator out przy parametrze?",a:["Parametr wyjściowy – metoda zapisuje do niego wynik","Parametr tylko do odczytu","Parametr opcjonalny","Parametr przekazywany przez wartość"],e:"out określa parametr wyjściowy, do którego zostanie zapisany wynik. Można go zadeklarować w wywołaniu: Example(out int a)."},{id:"w01-41",q:"Jaka jest domyślna widoczność metody i pola klasy, gdy nie podano modyfikatora?",a:["private","internal","public","protected"],e:"Domyślnie metody i pola są private, a całe klasy internal."},{id:"w01-42",q:"Jaka jest domyślna widoczność klasy (najwyższego poziomu) bez modyfikatora?",a:["internal","private","public","protected internal"],e:"Klasa bez modyfikatora jest internal, czyli widoczna w obrębie assembly."},{id:"w01-43",q:"Co oznacza modyfikator internal?",a:["Widoczność w obrębie assembly (najczęściej pojedynczego DLL)","Widoczność tylko w klasie","Widoczność w klasach pochodnych","Widoczność w tej samej przestrzeni nazw"],e:"internal oznacza widoczność na poziomie assembly. Pułapka: nie chodzi o przestrzeń nazw ani pakiet jak w Javie."},{id:"w01-44",q:"Co oznacza private protected?",a:["Dostęp w klasach pochodnych, ale tylko w tym samym assembly","Dostęp w klasach pochodnych lub w tym samym assembly","Dostęp tylko w tej klasie","Dostęp publiczny w assembly"],e:"private protected (od C# 7.2): klasy pochodne, ale tylko w tym samym assembly. Dla porównania protected internal to klasy pochodne LUB to samo assembly."},{id:"w01-45",q:"Kod: class SomeClass { void Test3() {} }. Jaka jest widoczność klasy i metody Test3?",a:["Klasa internal, metoda private","Klasa public, metoda public","Klasa private, metoda internal","Klasa internal, metoda internal"],e:"Przykład ze slajdu: klasa bez modyfikatora jest internal, metoda private."},{id:"w01-46",q:"Czy dwie metody o tej samej nazwie mogą różnić się wyłącznie typem zwracanym?",a:["Nie – muszą różnić się listą argumentów","Tak","Tak, jeśli jedna jest statyczna","Tak, jeśli są w różnych plikach partial"],e:"Przeciążanie wymaga różnej listy argumentów. Nie mogą różnić się tylko typem zwracanym."},{id:"w01-47",q:"Co musi spełniać klasa statyczna?",a:["Wszystkie jej składowe muszą być statyczne","Musi dziedziczyć po klasie bazowej","Musi mieć publiczny konstruktor","Musi implementować interfejs"],e:"Klasy statyczne muszą mieć wszystkie składowe statyczne. Odwołuje się do nich przez nazwę klasy."},{id:"w01-48",q:"Jak w C# zapisuje się dziedziczenie i implementację interfejsów?",a:["Dwukropkiem dla obu: class A : Base, IFoo","extends i implements","inherits i implements","Dwukropek dla klasy, implements dla interfejsów"],e:"Używa się znaku : zarówno do dziedziczenia, jak i implementacji. Klasa bazowa może być tylko jedna, interfejsów wiele."},{id:"w01-49",q:"Czego wymaga polimorfizm w C#?",a:["Oznaczenia metody bazowej jako virtual, a w klasie pochodnej override","Niczego – wszystkie metody są wirtualne jak w Javie","Tylko słowa override","Interfejsu dla każdej metody"],e:"Polimorfizm wymaga jawnego virtual w bazie i override w pochodnej. Pułapka: w Javie metody są domyślnie wirtualne, w C# nie."},{id:"w01-50",q:"Co oznacza klasa sealed?",a:["Nie można po niej dziedziczyć","Nie można utworzyć jej obiektu","Wszystkie jej metody są abstrakcyjne","Jest niemutowalna"],e:"sealed to przeciwieństwo abstract: po takiej klasie nie można dziedziczyć."},{id:"w01-51",q:"Co jest prawdą o klasie abstrakcyjnej w C#?",a:["Nie można utworzyć jej obiektu, ale może zawierać składowe nieabstrakcyjne","Może zawierać wyłącznie metody abstrakcyjne","Nie można po niej dziedziczyć","Musi być statyczna"],e:"Metoda abstract wymusza klasę abstract. Takiej klasy nie można instancjonować, można po niej dziedziczyć i może mieć składowe nieabstrakcyjne."},{id:"w01-52",q:"Od której wersji C# interfejsy mogą mieć domyślne implementacje metod?",a:["C# 8.0","C# 6.0","C# 9.0","Od zawsze"],e:"Metody interfejsów są zazwyczaj abstrakcyjne, ale od C# 8.0 dostępne są domyślne implementacje."},{id:"w01-53",q:"Czym jest właściwość (property) w C#?",a:["Składową działającą jak pole, ale de facto metodą (get/set)","Publicznym polem","Atrybutem metadanych","Zmienną statyczną"],e:"Właściwość działa jak pole, ale jest metodą. To alternatywa dla getFoo()/setFoo(), zwykle generowana przez get; set;."},{id:"w01-54",q:"Co oznacza akcesor init zamiast set we właściwości?",a:["Wartość można ustawić tylko podczas tworzenia obiektu","Właściwość jest tylko do zapisu","Właściwość jest statyczna","Właściwość jest leniwie inicjalizowana"],e:"init pozwala ustawić wartość tylko podczas tworzenia obiektu."},{id:"w01-55",q:"Czy get i set właściwości mogą mieć różną widoczność?",a:["Tak","Nie","Tylko w rekordach","Tylko w klasach statycznych"],e:"Widoczność get i set może być inna. Mogą też istnieć właściwości tylko z get albo tylko z set."},{id:"w01-56",q:"Na czym opiera się zdarzenie (event) w C#?",a:["Na delegacie – typie funkcji będącej odbiorcą; odbiorców dodaje się operatorem +=","Na interfejsie IEvent","Na wątkach","Na atrybutach"],e:"Zdarzenie opiera się o delegat. Wiele funkcji odbiorców przypina się przez +=."},{id:"w01-57",q:"Dzięki czemu atrybuty (np. [PrimaryKey]) są wykorzystywane przez biblioteki?",a:["Są dostępne przez mechanizm refleksji (i source generators)","Są kompilowane do osobnego DLL","Są wykonywane jako metody","Są przechowywane w bazie danych"],e:"Atrybuty opisują metadane i są dostępne przez refleksję. Korzystają z nich biblioteki, np. sqlite-net-pcl do mapowania ORM."},{id:"w01-58",q:"Jakie słowo kluczowe jest kluczowe w definicji metody rozszerzającej?",a:["this przed pierwszym parametrem","extends","static przed typem zwracanym (wystarczy)","partial"],e:'static int ToInt(this string s) pozwala wywołać "23".ToInt(). Metoda rozszerzająca dodaje metody do istniejących typów bez dziedziczenia.'},{id:"w01-59",q:"Od którego .NET kompilator domyślnie ostrzega o możliwym użyciu wartości null (nullable)?",a:[".NET 6",".NET 5",".NET Core 3.1",".NET 8"],e:"Od .NET 6 kompilator domyślnie ostrzega o danych, które mogą być null. Typy oznacza się przez ? (np. string?)."},{id:"w01-60",q:"Czym jest record w C#?",a:["Typem referencyjnym z wbudowaną enkapsulacją danych, przeznaczonym jako niemutowalny pojemnik","Typem wartościowym","Tablicą krotek","Klasą statyczną"],e:"record to typ referencyjny, a record struct to typ wartościowy. Rekordy to niemutowalne pojemniki na dane."},{id:"w01-61",q:"Czym jest record struct?",a:["Typem wartościowym działającym jak rekord","Typem referencyjnym","Strukturą bez właściwości","Aliasem dla klasy"],e:"record struct to typ wartościowy działający tak samo jak record (C# 10)."},{id:"w01-62",q:'Kod: string category = p.Age switch { < 13 => "Child", >= 13 and < 20 => "Teen", >= 20 and < 65 => "Adult", _ => "Senior" }; Jaki wynik dla Age = 19?',a:["Teen","Adult","Child","Senior"],e:'19 spełnia >= 13 and < 20, więc wynik to "Teen".'},{id:"w01-63",q:"Ten sam switch (Child <13, Teen 13–19, Adult 20–64, Senior). Jaki wynik dla Age = 65?",a:["Senior","Adult","Teen","Wyjątek – brak dopasowania"],e:'65 nie spełnia < 65, więc trafia do _ (discard), czyli "Senior".'},{id:"w01-64",q:"Kod: static Point Transform(Point p) => p switch { {X:0,Y:0}
