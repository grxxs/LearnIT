ettings/sekretach.","Pliki statyczne to wwwroot/."]},{id:"w02-15",q:"Do czego służy appsettings.json?",a:["Do konfiguracji aplikacji (może być kilka plików dla różnych środowisk)","Do definiowania routingu","Do przechowywania widoków","Do listy pakietów NuGet"],e:"appsettings.json to konfiguracja aplikacji. Może być ich kilka (np. dla środowisk), często obok secrets.json.",w:["Routing definiuje Program.cs i atrybuty.","Widoki są w .cshtml.","Pakiety są w .csproj."]},{id:"w02-16",q:"Co robi Program.cs w aplikacji ASP.NET Core?",a:["Jest punktem wejścia: dołącza biblioteki, mapuje routing i uruchamia aplikację","Zawiera tylko widoki","Definiuje modele","Przechowuje sekrety"],e:"Program.cs to punkt wejścia: kontroluje biblioteki (serwisy), mapuje routing i uruchamia aplikację.",w:["Widoki to .cshtml.","Modele to klasy w Models/.","Sekrety to secrets.json lub user secrets."]},{id:"w02-17",q:"Jakie polecenie konsoli uruchamia aplikację z hot reloadem?",a:["dotnet watch run","dotnet run --hot","dotnet reload","dotnet build --watch"],e:"W konsoli: dotnet watch run.",w:["Nie ma flagi --hot.","Takiej komendy nie ma.","dotnet build nie ma trybu watch."]},{id:"w02-18",q:"Które publiczne metody kontrolera NIE są akcjami?",a:["Te z atrybutem [NonAction]","Te zwracające void","Te z parametrami","Te z atrybutem [HttpPost]"],e:"Publiczne metody kontrolera to akcje, poza tymi oznaczonymi [NonAction].",w:["Akcja może zwracać void.","Parametry nie wykluczają akcji.","[HttpPost] nadal oznacza akcję – tylko dla POST."]},{id:"w02-19",q:"Jak parametry akcji są wiązane z danymi żądania HTTP?",a:["Przez model binding (z walidacją)","Ręcznie przez Request.Form zawsze","Przez ViewBag","Przez routing tylko dla stringów"],e:"Parametry akcji są wiązane z danymi żądania i walidowane mechanizmem model binding.",w:["Request.Form to ręczny dostęp – binding robi to automatycznie.","ViewBag przekazuje dane do widoku, nie z żądania.","Routing wiąże też inne typy proste (np. int)."]},{id:"w02-20",q:"Co rację dwóch serwisów","Błąd – singletony nie przyjmują lambd"],e:"Do DI można przekazać metodę fabrykującą (albo obiekt utworzony przez new). Singleton wywoła ją raz.",w:["Singleton tworzony jest raz.","Rejestruje jeden serwis.","Lambdy (fabryki) są dozwolone."]},{id:"w03-28",q:"Czy ILogger<T> trzeba jawnie rejestrować w Program.cs, aby był wstrzykiwany?",a:["Nie – konfiguracja jest niejawna","Tak, przez AddLogger<T>()","Tak, przez AddSingleton<ILogger>()","Nie można go wstrzykiwać"],e:"ILogger jest wstrzykiwany przez DI, a jego konfiguracja w Program.cs jest niejawna.",w:["Nie ma AddLogger<T>.","Nie trzeba – logowanie jest domyślnie skonfigurowane.","Można go wstrzykiwać."]},{id:"w03-29",q:"Jak wygląda wstrzyknięcie loggera z użyciem primary constructor (C# 12)?",a:["public class DiPrimaryModel(ILogger<DiPrimaryModel> logger) : PageModel { … logger.LogInformation(…) }","public class DiPrimaryModel : PageModel(ILogger logger)","[Inject] ILogger logger;","public DiPrimaryModel() => logger = new Logger();"],e:"Primary constructor: parametr w nagłówku klasy jest dostępny w całej klasie, bez jawnego pola.",w:["Parametr idzie w nagłówku klasy, nie przy klasie bazowej.","[Inject] to Blazor.","new Logger() to nie DI."]},{id:"w03-30",q:"Czym jest builder.Services.AddRazorPages()?",a:["Metodą rozszerzającą rejestrującą biblioteki Razor Pages","Wbudowaną metodą klasy WebApplication","Middleware obsługującym routing","Metodą generującą strony"],e:"Builder może posiadać metody rozszerzające (np. AddRazorPages()) dodawane przez zaimportowane biblioteki.",w:["To metoda rozszerzająca, a nie wbudowana.","To nie middleware.","Niczego nie generuje."]},{id:"w03-31",q:"Która linia mapuje strony Razor Pages w potoku aplikacji?",a:["app.MapRazorPages();","builder.Services.AddRazorPages();","app.UseRouting();","app.MapControllerRoute(...);"],e:"AddRazorPages() rejestruje serwisy (DI), a app.MapRazorPages() mapuje endpointy stron.",w:["To rejestracja w DI, nie mapowanie.","UseRouting to mi ni w appsettings.json (mogą być w VCS). Należy użyć mechanizmu sekretów, zmiennych środowiskowych lub Key Vault.",w:["User secrets to właściwe miejsce.","Zmienne środowiskowe są OK.","Key Vault jest OK."]},{id:"w03-38",q:"Gdzie przechowywany jest plik sekretów (user secrets)?",a:["W katalogu domowym użytkownika (~/.microsoft lub %APPDATA%)","W folderze projektu obok appsettings.json","W wwwroot","W bazie danych"],e:"Plik sekretów to JSON w katalogu domowym użytkownika, poza repozytorium projektu.",w:["Nie w projekcie – dzięki temu nie trafia do repozytorium.","wwwroot jest publiczny!","Nie w bazie."]},{id:"w03-39",q:"Jakie polecenie CLI zarządza sekretami aplikacji?",a:["dotnet user-secrets","dotnet secrets add","dotnet ef secrets","nuget secrets"],e:"dotnet user-secrets, odpowiednik „Manage user secrets” w Visual Studio.",w:["Nie ma takiej komendy.","dotnet ef służy do migracji.","nuget to pakiety."]},{id:"w03-40",q:"Co jest używane przy wdrożeniu do przekazywania sekretów wg wykładu?",a:["Zmienne środowiskowe lub Azure Key Vault / Hashicorp Vault","Plik secrets.json kopiowany na serwer","appsettings.Production.json w repozytorium","Komentarze w kodzie"],e:"Przy wdrożeniu sekrety przekazuje się jako zmienne środowiskowe lub przez rozwiązania typu Key Vault / Vault.",w:["Plik secrets.json jest do developmentu.","appsettings w repozytorium to wyciek.","Komentarze w kodzie to wyciek."]},{id:"w03-41",q:"Jak nazywa się system zarządzania zależnościami w .NET?",a:["NuGet","npm","Maven","pip"],e:"NuGet to zarówno narzędzie (część .NET SDK), jak i serwis nuget.org.",w:["npm to JavaScript.","Maven to Java.","pip to Python."]},{id:"w03-42",q:"Czym jest podejście Code First w EF Core?",a:["Model definiuje się klasami C# (adnotacje/konwencje/fluent), a baza powstaje z nich (migracje)","Klasy generuje się z istniejącej bazy","Pisanie SQL przed kodem","Brak bazy danych"],e:"Code First: klasy z adnotacjami, konwencjami lub fluent API. Database First: generowanie klas z istniejącej bazy (dotnet ef scaffold).",w:["To podejście Database First.","Nie chodzi o pisanie SQL.","Baza jest."]},{id:"w03-43",q:"Jakim poleceniem w podejściu Database First generuje się klasy z istniejącej bazy?",a:["dotnet ef scaffold","dotnet ef migrations add","dotnet ef database update","dotnet new efcore"],e:"Database First korzysta z dotnet ef scaffold (dbcontext scaffold).",w:["migrations add tworzy migrację (Code First).","database update aplikuje migracje.","Nie ma szablonu dotnet new efcore."]},{id:"w03-44",q:"Które właściwości klasy encji domyślnie mają odpowiednik w bazie?",a:["Wszystkie publiczne właściwości z getterem i setterem","Tylko oznaczone [Column]","Tylko pola prywatne","Tylko właściwości typu string"],e:"Domyślnie mapowane są publiczne właściwości z get i set. Można to zmienić atrybutem [NotMapped].",w:["[Column] jest opcjonalny.","Pola prywatne nie są mapowane domyślnie.","Mapowane są różne typy."]},{id:"w03-45",q:"Który atrybut wyłącza mapowanie właściwości na kolumnę bazy?",a:["[NotMapped]","[Ignore]","[Column(false)]","[Transient]"],e:"[NotMapped] wyłącza mapowanie właściwości.",w:["Nie ma atrybutu [Ignore] w EF Core (adnotacje).","[Column(false)] nie istnieje.","transient to modyfikator Apex, nie EF."]},{id:"w03-46",q:'Do czego służy [Column("quote_id")] lub [Column(TypeName = "varchar(200)")]?',a:["Do zmiany nazwy kolumny lub ręcznego ustawienia typu w bazie","Do walidacji długości w formularzu","Do ustawienia klucza obcego","Do wyłączenia mapowania"],e:"Domyślnie nazwa tabeli to nazwa klasy, a kolumny to nazwa właściwości. [Column] pozwala to zmienić i ustawić typ.",w:["Walidacja to [StringLength].","Klucz obcy to [ForeignKey].","Wyłączenie mapowania to [NotMapped]."]},{id:"w03-47",q:"Jak domyślnie (konwencją) EF Core rozpoznaje klucz główny?",a:["Właściwość o nazwie Id lub <NazwaKlasy>Id","Pierwsza właściwość w klasie","Właściwość typu Guid","Musi być atrybut [Key]"],e:"Konwencja: Id lub <Klasa>Id (np. AuthorId). Notatka wykładowcy: „coś z id w nazwie będzie kluczem głównym”.",w:["Kolejność właściwości nie decyduje.","Typ Guid nie jest wymagany.","[Key] jest opcjonalny dzięki konwencji."]},{id:"w03-48",q:"Po jakiej klasie dziedziczy kontekst danych EF Core?",a:["DbContext","DbSet","PageModel","Controller"],e:"Tworzy się klasę dziedziczącą po DbContext, która implementuje wzorzec repozytorium.",w:["DbSet to tabela w kontekście.","PageModel to Razor Pages.","Controller to MVC."]},{id:"w03-49",q:"Jaki typ mają właściwości DbContext reprezentujące tabele (encje)?",a:["DbSet<T>","List<T>","IEnumerable<T>","DbTable<T>"],e:"DbContext zawiera właściwości DbSet<T>, np. public DbSet<Quote> Quotes { get; set; }.",w:["List<T> nie zapewnia dostępu do bazy.","IEnumerable – to nie typ właściwości w kontekście.","DbTable nie istnieje."]},{id:"w03-50",q:"Jak zarejestrować DbContext z SQLite w Program.cs?",a:['builder.Services.AddDbContext<QuotesDbContext>(o => o.UseSqlite(builder.Configuration.GetConnectionString("QuotesDatabase")));',"app.UseDbContext<QuotesDbContext>();",'new QuotesDbContext("Data Source=quotes.db") w kontrolerze',"builder.Services.AddSingleton<SqliteConnection>();"],e:"AddDbContext rejestruje kontekst w DI (przed builder.Build()), a connection string pochodzi z konfiguracji lub sekretów.",w:["Nie ma UseDbContext.","new w kontrolerze łamie DI.","Rejestracja samego połączenia to nie DbContext."]},{id:"w03-51",q:"Kiedy w Program.cs należy zarejestrować DbContext?",a:["Przed builder.Build()","Po app.Run()","Po builder.Build()","W dowolnym momencie"],e:"Rejestracja serwisów musi nastąpić przed builder.Build().",w:["Po Run() kod się nie wykona.","Po Build() kontener jest już zamknięty.","Kolejność ma znaczenie."]},{id:"w03-52",q:"Co oznacza skrót LINQ?",a:["Language INtegrated Query","Linked Query","Lightweight Integrated Query","List Iteration Query"],e:"LINQ = Language INtegrated Query, oparte o IEnumerable i IQueryable.",w:["Nie Linked.","Nie Lightweight.","Nie List Iteration."]},{id:"w03-53",q:"Od której wersji .NET Framework dostępny jest LINQ?",a:["3.5","2.0","4.0","4.5"],e:"LINQ jest dostępny od .NET Framework 3.5 (język C# 3.0).",w:["2.0 to generyki.","4.0 to dynamic.","4.5 – za późno, LINQ był wcześniej."]},{id:"w03-54",q:"Na czym zbudowany jest LINQ, co pozwala obliczać zapytania w czasie wykonywania (np. tłumaczyć na SQL)?",a:["Na drzewach wyrażeń (expression trees)","Na refleksji atrybutów","Na wątkach","Na dynamic"],e:"LINQ zbudowany jest w oparciu o drzewa wyrażeń i intensywnie korzysta z lambd, metod i typów anonimowych.",w:["Atrybuty to nie podstawa LINQ.","Wątki nie są podstawą.","dynamic nie jest podstawą."]},{id:"w03-55",q:"Która operacja LINQ odpowiada „map” (projekcja)?",a:["Select()","Where()","Take()","OrderBy()"],e:"Select() to projekcja (map), a Where() to filtr.",w:["Where to filter.","Take ogranicza liczbę.","OrderBy sortuje."]},{id:"w03-56",q:"Która operacja LINQ odpowiada „filter”?",a:["Where()","Select()","Skip()","Count()"],e:"Where() zwraca tylko elementy spełniające predykat.",w:["Select to map.","Skip pomija.","Count liczy."]},{id:"w03-57",q:"Co robi Single(), gdy kolekcja zawiera więcej niż jeden element?",a:["Rzuca wyjątek","Zwraca pierwszy","Zwraca null","Zwraca ostatni"],e:"Single/SingleOrDefault wybiera jedyny element, a gdy jest ich więcej, rzuca wyjątek.",w:["To zachowanie First.","SingleOrDefault zwraca null tylko dla pustej kolekcji – dla wielu też rzuca.","Nie zwraca ostatniego."]},{id:"w03-58",q:"Co robi First(), gdy kolekcja jest pusta?",a:["Rzuca wyjątek","Zwraca null","Zwraca default(T)","Zwraca pustą listę"],e:"First() rzuca wyjątek, a FirstOrDefault() zwraca null (default).",w:["null zwraca FirstOrDefault.","default(T) zwraca FirstOrDefault.","Pusta lista to Where()."]},{id:"w03-59",q:"Kod: var p = new[]{1,2,3,4,5}; var r = p.Skip(1).Take(3).Sum(); Jaka jest wartość r?",a:["9","6","12","15"],e:"Skip(1) daje 2,3,4,5, Take(3) daje 2,3,4, a suma to 9.",w:["6 to suma 1+2+3 (bez Skip).","12 to 3+4+5 (Skip 2).","15 to suma wszystkich."]},{id:"w03-60",q:"Jak obliczane są zapytania LINQ zwracające IEnumerable?",a:["Leniwie (lazy evaluation) – do momentu materializacji","Natychmiast przy definicji","Równolegle zawsze","Tylko po stronie klienta"],e:"LINQ jest leniwy. Aby faktycznie wykonać zapytanie, trzeba je zmaterializować: ToList(), ToArray().",w:["Nie natychmiast – leniwie.","Nie zawsze równolegle (to PLINQ).","Dla EF zapytanie wykonuje baza."]},{id:"w03-61",q:"Kod: var query = _context.Quotes.Where(x => x.Id > 0); (bez ToList). Czy zapytanie SQL zostało już wykonane?",a:["Nie – zostanie wykonane dopiero przy materializacji/iteracji","Tak, natychmiast","Tak, ale bez WHERE","Nie, nigdy nie zostanie wykonane"],e:"Notatka wykładowcy: nie ma ToList(), więc zapytanie nie zostanie zmaterializowane. Wykona się przy iteracji (np. w widoku).",w:["Nie natychmiast – jest leniwe.","WHERE zostanie przetłumaczone na SQL.","Wykona się przy iteracji."]},{id:"w03-62",q:"Która metoda materializuje zapytanie LINQ?",a:["ToList()","Where()","Select()","OrderBy()"],e:"Konwersje materializujące: ToArray(), ToList(). Wymienione są też AsEnumerable() i AsQueryable().",w:["Where nie materializuje.","Select nie materializuje.","OrderBy nie materializuje."]},{id:"w03-63",q:"Gdzie obliczane są wyrażenia LINQ dla SZBD w EF Core?",a:["Na serwerze bazodanowym; jeśli operacji nie da się przetłumaczyć – wyjątek","Zawsze w pamięci aplikacji","W przeglądarce","Losowo"],e:"Wyrażenia są ewaluowane na serwerze bazy. Gdyby operacja miała być wykonana po stronie aplikacji, EF rzuci wyjątek (wydajność).",w:["Nie w pamięci – na serwerze bazy.","Nie w przeglądarce.","Nie losowo."]},{id:"w03-64",q:"Gdzie konfiguruje się mapowanie za pomocą Fluent API?",a:["W metodzie OnModelCreating(ModelBuilder) DbContextu","W Program.cs w AddDbContext","W atrybutach klasy","W appsettings.json"],e:"Fluent API to wzorzec builder w OnModelCreating, np. modelBuilder.Entity<Quote>().HasKey(…).",w:["AddDbContext to rejestracja.","Atrybuty to alternatywa dla fluent.","appsettings nie konfiguruje mapowania."]},{id:"w03-65",q:"Co robi modelBuilder.Entity<Quote>().HasKey(c => new { c.Id, c.Date });?",a:["Definiuje złożony klucz główny z Id i Date","Tworzy indeks na Date","Definiuje relację 1:n","Tworzy dwie tabele"],e:"HasKey z typem anonimowym definiuje klucz złożony.",w:["To nie indeks.","Relację opisują HasOne/WithMany.","Tworzy jedną tabelę."]},{id:"w03-66",q:"Co robi mechanizm migracji EF Core?",a:["Porównuje bieżący stan modelu z poprzednim i generuje operacje CREATE/ALTER/DROP","Przenosi dane między serwerami","Kopiuje bazę do chmury","Generuje klasy z bazy"],e:"Migracje porównują stan modelu z poprzednim i przygotowują operacje na schemacie. Pozwalają też zasiać dane.",w:["Nie przenosi danych między serwerami.","Nie kopiuje do chmury.","Generowanie klas z bazy to scaffold."]},{id:"w03-67",q:"Które polecenie aplikuje migracje do bazy danych?",a:["dotnet ef database update","dotnet ef migrations add","dotnet ef scaffold","dotnet build"],e:"dotnet ef migrations add tworzy migrację, a dotnet ef database update aplikuje ją do bazy.",w:["migrations add tylko tworzy migrację.","scaffold to Database First.","build nie dotyka bazy."]},{id:"w03-68",q:"Jaką pułapkę migracji z SQLite zanotował wykładowca?",a:["SQLite nie ma ALTER TABLE DROP COLUMN","SQLite nie obsługuje kluczy głównych","SQLite nie wspiera migracji w ogóle","SQLite wymaga hasła"],e:"Notatka: SQLite nie ma ALTER TABLE DROP COLUMN (wymaga przebudowy tabeli).",w:["Ma klucze główne.","Migracje są wspierane.","SQLite nie wymaga hasła."]},{id:"w03-69",q:"Czym jest navigation property w EF Core?",a:["Właściwością wskazującą na powiązaną encję/kolekcję (nie typ skalarny)","Kluczem głównym","Właściwością [NotMapped]","Właściwością typu string"],e:"Navigation property to właściwość, której nie da się zmapować na typ skalarny (np. Author Author, List<Quote> Quotes). Na jej podstawie powstają relacje.",w:["Klucz główny to Id.","[NotMapped] wyłącza mapowanie."," :"w04-29",q:'Rate limiter: AddFixedWindowLimiter("fixed", PermitLimit = 4, Window = 12 s, QueueLimit = 0). Co stanie się z 5. żądaniem w tym samym oknie 12 s?',a:["Zostanie odrzucone z kodem 429","Trafi do kolejki","Zostanie obsłużone normalnie","Zwróci 503"],e:"Limit to 4 żądania na okno, a kolejka ma 0 miejsc, więc 5. żądanie jest odrzucane. Ustawiono RejectionStatusCode = 429.",w:["QueueLimit = 0, więc kolejka jest pusta.","Limit 4 jest już wyczerpany.","Kod ustawiono na 429, nie 503."]},{id:"w04-30",q:"Co oznacza kod HTTP 429?",a:["Too Many Requests","Unauthorized","Forbidden","Service Unavailable"],e:"429 = Too Many Requests, typowy kod dla rate limitingu.",w:["Unauthorized to 401.","Forbidden to 403.","Service Unavailable to 503."]},{id:"w04-31",q:'Jak przypisać politykę rate limitingu "fixed" do endpointu?',a:['app.MapGet("/", …).RequireRateLimiting("fixed")','[RateLimit("fixed")] na Program','app.UseRateLimiter("fixed") wystarczy','builder.Services.AddRateLimit("/")'],e:'Polityka jest definiowana w AddRateLimiter, middleware włącza app.UseRateLimiter(), a endpoint wybiera politykę przez RequireRateLimiting("fixed").',w:["Nie ma atrybutu [RateLimit] na Program.","UseRateLimiter nie przypisuje polityki.","Nie ma AddRateLimit."]},{id:"w04-32",q:"Co jest wymagane oprócz AddRateLimiter, aby limiter działał?",a:["app.UseRateLimiter() w potoku","app.UseCors()","app.UseAuthentication()","Nic więcej"],e:"Serwis trzeba dodać i włączyć middleware app.UseRateLimiter().",w:["CORS nie jest powiązany.","Uwierzytelnianie nie jest powiązane.","Middleware jest wymagany."]},{id:"w04-33",q:"Co oznacza AutoReplenishment = true w FixedWindowLimiter?",a:["Limit odnawia się automatycznie po upływie okna","Kolejka rośnie automatycznie","Limit rośnie z każdym żądaniem","Odrzucone żądania są ponawiane"],e:"Okno automatycznie się odnawia co Window (12 s) i przywraca PermitLimit.",w:["Kolejka się nie powiększa.","Limit jest stały.","Odrzucone żądania nie są ponawiane."]},{id:"w04-34",q: ,"Synchronizację zegara z serwerem NTP"],e:"Domyślnie jest kilkuminutowa tolerancja. Zero oznacza ścisłe sprawdzanie czasu wygaśnięcia.",w:["Token wygasa normalnie.","Podpis nadal jest walidowany.","To nie synchronizacja NTP."]},{id:"w04-39",q:"Których elementów tokenu NIE weryfikuje konfiguracja JWT z przykładu?",a:["Wystawcy (issuer) i odbiorcy (audience)","Czasu ważności","Klucza podpisu","Podpisu tokenu"],e:"ValidateIssuer = false i ValidateAudience = false. Walidowane są czas (ValidateLifetime) oraz klucz podpisu (ValidateIssuerSigningKey).",w:["Czas ważności jest walidowany.","Klucz podpisu jest walidowany.","Podpis jest walidowany."]},{id:"w04-40",q:"Jakiego algorytmu podpisu używa TokenController?",a:["HMAC SHA-256 z kluczem symetrycznym","RSA z kluczem publicznym","ECDSA","Brak podpisu"],e:"SymmetricSecurityKey + SecurityAlgorithms.HmacSha256, czyli ten sam sekret do podpisu i weryfikacji.",w:["RSA to klucz asymetryczny – tu jest symetryczny.","ECDSA nie jest użyte.","Podpis jest."]},{id:"w04-41",q:"Co jest problemem bezpieczeństwa w przykładzie JWT (zgodnie z wykładem o sekretach)?",a:["Sekret klucza jest zapisany na sztywno w kodzie źródłowym","Token ma 30 minut ważności","Użyto HMAC","Token zawiera claim Jti"],e:'Klucz "to jest bardzo, bardzo tajny sekret" jest w kodzie. Sekrety powinny być w user secrets, zmiennych środowiskowych lub Key Vault.',w:["30 min to rozsądny czas.","HMAC jest w porządku.","Jti to dobra praktyka."]},{id:"w04-42",q:"Do czego służy claim Jti w tokenie (new Claim(JwtRegisteredClaimNames.Jti, Guid.NewGuid().ToString()))?",a:["Unikalny identyfikator tokenu","Identyfikator użytkownika","Czas wygaśnięcia","Adres e-mail"],e:"jti (JWT ID) to unikalny identyfikator tokenu. sub to podmiot (użytkownik), email to e-mail.",w:["Użytkownik to sub.","Czas wygaśnięcia to exp.","E-mail to email."]},{id:"w04-43",q:"Jak klient przesyła token JWT do API chronionego schematem JwtBearer?",a:["Nagłówek Authorization: Bearer <token>","W query string ?to strel w każdym przypadku, także dla curl"],e:"CORS to mechanizm przeglądarki. Narzędzia jak curl czy Postman nie podlegają CORS.",w:["Serwer nie blokuje – wysyła nagłówki.","Firewall nie ma z tym związku.","curl ignoruje CORS."]},{id:"w04-48",q:"Co robi builder.Services.AddEndpointsApiExplorer()?",a:["Udostępnia metadane endpointów (m.in. Minimal APIs) dla generatora OpenAPI/Swagger","Wyświetla listę endpointów w przeglądarce","Włącza wersjonowanie","Włącza CORS"],e:"API Explorer zbiera metadane endpointów, z których korzysta Swashbuckle (AddSwaggerGen).",w:["Nie wyświetla listy.","Wersjonowanie to AddApiVersioning.","CORS to AddCors."]},{id:"w04-49",q:"Która linia w Program.cs Web API mapuje kontrolery z routingiem atrybutowym?",a:["app.MapControllers();",'app.MapControllerRoute("default", …);',"app.MapRazorPages();","app.UseEndpoints();"],e:"W API z [Route] używa się app.MapControllers(), a MapControllerRoute to routing konwencyjny MVC.",w:["MapControllerRoute to routing konwencyjny MVC.","MapRazorPages to strony.","UseEndpoints to starszy sposób."]},{id:"w04-50",q:'W TokenController: [Route("[controller]")] i [HttpPost("/token")]. Pod jakim adresem wystawiany jest token?',a:["POST /token","POST /Token/token","GET /token","POST /api/token"],e:`Szablon "/token" zaczyna się od '/', więc jest bezwzględny. Akcja ma [HttpPost], więc tylko POST.`,w:["Wiodący / ignoruje [controller].","Metoda to POST, nie GET.","Prefiksu api nie ma."]}],Dp={id:vp,title:Tp,questions:Ap},Pp="w05",Np="W5 · Identity, role, polityki i uwierzytelnianie (na podstawie kodu)",Lp=[{id:"w05-01",q:"Co rejestruje builder.Services.AddDefaultIdentity<ApplicationUser>(…).AddEntityFrameworkStores<ApplicationDbContext>()?",a:["System ASP.NET Core Identity z domyślnym UI, przechowujący użytkowników w bazie przez EF Core","Uwierzytelnianie JWT","Tylko tabelę ról","Polityki autoryzacji"],e:"AddDefaultIdentity dodaje Identity (z UI w Razor Pages, Areas/Identity), a AddEntityFrameworkStores zapisuje dane w baz
