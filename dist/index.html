.getValue(1)"],e:"Wartości odczytuje się metodą get z nazwą pola/aliasu: ar.get('Industry'), ar.get('totalAccounts')."},{id:"w08-32",q:"Jaka jest maksymalna długość jednego zapytania SOQL?",a:["100 000 znaków","10 000 znaków","1 000 000 znaków","32 768 znaków"],e:"Długość jednego zapytania ≤ 100 000 znaków."},{id:"w08-33",q:"Ile maksymalnie pól można umieścić w SELECT?",a:["200","100","500","50"],e:"Liczba pól w SELECT ≤ 200."},{id:"w08-34",q:"Ile maksymalnie rekordów zwraca SOQL?",a:["50 000","10 000","100 000","2 000"],e:"Liczba zwracanych rekordów ≤ 50 000. (10 000 to limit rekordów DML.)"},{id:"w08-35",q:"Ile maksymalnie zapytań SOQL można wykonać w pojedynczej transakcji (wg slajdu ograniczeń)?",a:["100","150","200","50"],e:"Liczba zapytań w pojedynczej transakcji ≤ 100 (kontekst synchroniczny; asynchroniczny 200)."},{id:"w08-36",q:"Ile poziomów relacji w dół i w górę obsługuje SOQL wg wykładu?",a:["5 w dół i 1 w górę","1 w dół i 5 w górę","5 w obie strony","Bez ograniczeń"],e:"Dostęp do 5 relacji w dół i 1 w górę."},{id:"w08-37",q:"Które stwierdzenie o SOQL jest prawdziwe wg slajdu ograniczeń?",a:["Nie można agregować po podzapytaniu","Można używać wildcards (*)","Brak limitu zwracanych rekordów","Można stosować dowolny JOIN"],e:"Ograniczenia: brak wildcards, brak aliasów, nie można agregować po podzapytaniu."},{id:"w08-38",q:"Który łańcuch obiektów pokazano jako przykład zagnieżdżonych podzapytań na 4 poziomach?",a:["Account → Contact → Asset → WorkOrder → WorkOrderLineItem","Account → Opportunity → Quote → Order → Invoice","User → Role → Profile → Permission → Object","Lead → Contact → Account → Case → Task"],e:"Przykład: Account 1:N Contact 1:N Asset 1:N WorkOrder 1:N WorkOrderLineItem."},{id:"w08-39",q:"Jak brzmi podstawowa struktura zapytania SOQL?",a:["SELECT pola FROM obiekt WHERE warunki (opcjonalnie ORDER BY)","FROM obiekt SELECT pola","GET pola IN obiekt","QUERY obiekt FILTER warunki"],e:"SELECT one or more fields FROM an object WHERE filter statements, opcjonalnie z sortowaniem."},{id:"w08-40",q:"Która klauzula SOQL filtruje rekordy analogicznie do SQL?",a:["WHERE","WITH","USING","HAVING"],e:"WHERE filtruje rekordy analogicznie do SQL, np. WHERE Industry = 'Technology' AND AnnualRevenue > 1000000."}],Ap={id:Lp,title:Ep,questions:Tp},Np="w09",Op="W9 · Wyzwalacze (triggery) Apex",Pp=[{id:"w09-01",q:"Czym jest trigger (wyzwalacz) Apex?",a:["Kodem Apex uruchamianym przez środowisko pod wpływem zdarzenia na obiektach (w bazie danych)","Przyciskiem w interfejsie użytkownika","Zapytaniem SOQL wykonywanym cyklicznie","Deklaratywną regułą walidacji"],e:"Trigger to kod Apex uruchamiany przez środowisko pod wpływem zdarzenia na obiektach w bazie danych."},{id:"w09-02",q:"Co dzieje się ze zmianami wykonanymi w triggerze w przypadku błędu?",a:["Wszystkie zmiany wykonane w obrębie triggera są wycofywane","Zmiany są zachowywane","Wycofywany jest tylko ostatni rekord","Zmiany trafiają do Recycle Bin"],e:"Przy błędzie wszystkie zmiany wykonane w obrębie triggera są wycofywane."},{id:"w09-03",q:"Jaka jest poprawna składnia definicji triggera?",a:["trigger TriggerName on ObjectName (trigger_events) { … }","trigger ObjectName for TriggerName { … }","on ObjectName trigger TriggerName (events) { … }","public trigger TriggerName extends ObjectName { … }"],e:"Składnia: trigger TriggerName on ObjectName (trigger_events) { //code_block }."},{id:"w09-04",q:"Co robi acc.addError('…') w triggerze?",a:["Zatrzymuje zapis danego rekordu i wyświetla komunikat użytkownikowi","Zapisuje błąd w logu, ale rekord jest zapisywany","Usuwa rekord","Rzuca DmlException, którego nie można obsłużyć"],e:"addError() zatrzymuje zapis danego rekordu i wyświetla komunikat użytkownikowi."},{id:"w09-05",q:"Czym jest Trigger.new?",a:["Kolekcją (List<SObject>) nowych wersji rekordów, na których działa trigger","Mapą starych rekordów","Liczbą rekordów","Flagą operacji insert"],e:"Trigger.new: List<SObject>, czyli nowe wersje rekordów."},{id:"w09-06",q:"Jaki typ ma Trigger.newMap?",a:["Map<Id, SObject>","List<SObject>","Set<Id>","Map<String, Object>"],e:"Trigger.newMap i Trigger.oldMap to Map<Id, SObject>, czyli mapowanie rekordów po Id."},{id:"w09-07",q:"Co zwraca Trigger.size?",a:["Liczbę rekordów w triggerze (Integer)","Rozmiar triggera w bajtach","Liczbę zdarzeń obsługiwanych przez trigger","Liczbę pól obiektu"],e:"Trigger.size: Integer, czyli liczba rekordów w triggerze."},{id:"w09-08",q:"W którym zdarzeniu można modyfikować dane rekordu przed zapisem (bez dodatkowego DML)?",a:["before insert / before update","after insert","after update","after delete"],e:"W before insert i before update można modyfikować dane przed zapisem. W after update dane są już zapisane i nie można zmieniać pól."},{id:"w09-09",q:"Do czego typowo używa się zdarzenia before delete?",a:["Do zablokowania usunięcia, np. przez addError()","Do przywracania rekordu","Do nadawania Id","Do modyfikacji pól przed wstawieniem"],e:"before delete: przed usunięciem, można zablokować usunięcie przez addError()."},{id:"w09-10",q:"Dlaczego after insert stosuje się do tworzenia powiązanych rekordów?",a:["Bo rekord ma już Id, którego można użyć w rekordach powiązanych","Bo w after insert można zmieniać pola rekordu","Bo after insert nie ma limitów","Bo before insert nie widzi Trigger.new"],e:"after insert: rekord ma już Id, używane np. do tworzenia powiązanych rekordów."},{id:"w09-11",q:"Co jest prawdą o after update?",a:["Dane są już zapisane w bazie; nie można zmieniać pól (rekordów z Trigger.new)","Można dowolnie modyfikować Trigger.new","Trigger.old jest niedostępne","Rekord nie ma jeszcze Id"],e:"after update: dane są już zapisane, nie można zmieniać pól."},{id:"w09-12",q:"Która kolekcja jest dostępna w after delete?",a:["Tylko Trigger.old","Tylko Trigger.new","Obie","Żadna"],e:"after delete: dane są już usunięte, dostępne tylko Trigger.old."},{id:"w09-13",q:"Kiedy uruchamia się after undelete?",a:["Po przywróceniu rekordu z kosza","Po trwałym usunięciu rekordu","Przed usunięciem","Po scaleniu rekordów"],e:"after undelete: po przywróceniu rekordu z kosza, używane rzadko (np. do ponownego powiązania danych)."},{id:"w09-14",q:"Czy Trigger.old jest dostępne w before insert?",a:["Nie","Tak","Tylko dla obiektów Custom","Tylko w trybie bulk"],e:"before insert: Trigger.new ✅, Trigger.old ❌, bo nie ma starej wersji nowego rekordu."},{id:"w09-15",q:"W których zdarzeniach dostępne są zarówno Trigger.new, jak i Trigger.old?",a:["before update i after update","before insert i after insert","before delete i after delete","after undelete"],e:"Obie kolekcje są dostępne tylko przy update (before i after)."},{id:"w09-16",q:"Czy Trigger.new jest dostępne w before delete?",a:["Nie, dostępne jest tylko Trigger.old","Tak","Tak, ale jest puste","Tylko w after delete"],e:"before delete: Trigger.new ❌, Trigger.old ✅."},{id:"w09-17",q:"Która kolekcja jest dostępna w after undelete?",a:["Trigger.new","Trigger.old","Obie","Żadna"],e:"after undelete: Trigger.new ✅, Trigger.old ❌."},{id:"w09-18",q:"W jakiej klasie zawarte są zmienne kontekstowe triggera?",a:["System.Trigger","Database.Trigger","Apex.Context","Schema.Trigger"],e:"Zmienne kontekstowe zawarte są w klasie System.Trigger."},{id:"w09-19",q:"Do czego służą zmienne kontekstowe triggera?",a:["Pozwalają sprawdzić kontekst DML, przetwarzane rekordy i czy to before/after, co umożliwia pisanie uniwersalnych triggerów","Do przechowywania danych między transakcjami","Do definiowania pól obiektu","Do konfiguracji uprawnień"],e:"Zmienne kontekstowe pozwalają sprawdzić operację, rekordy, before/after i dodatkowe informacje, co umożliwia uniwersalne triggery."},{id:"w09-20",q:"Która flaga mówi, że trigger działa przed zapisaniem danych?",a:["Trigger.isBefore","Trigger.isInsert","Trigger.isExecuting","Trigger.isAfter"],e:"Trigger.isBefore: przed zapisem. Trigger.isAfter: po zapisie."},{id:"w09-21",q:"Co oznacza flaga Trigger.isExecuting?",a:["Że to trigger wywołał bieżący kod","Że trigger jest w trakcie insert","Że trigger jest wyłączony","Że trigger działa asynchronicznie"],e:"Trigger.isExecuting: czy trigger wywołał ten kod."},{id:"w09-22",q:"Która flaga oznacza, że trigger działa po przywróceniu rekordu z kosza?",a:["Trigger.isUndelete","Trigger.isDelete","Trigger.isRestore","Trigger.isAfter"],e:"Trigger.isUndelete: działa po przywróceniu rekordu z kosza."},{id:"w09-23",q:"Jakiego typu są flagi kontekstowe (isInsert, isBefore…)?",a:["Boolean","Integer","String","Enum"],e:"Wszystkie flagi kontekstowe są typu Boolean."},{id:"w09-24",q:"Trigger ma ustawić Title = 'Nie określono' w nowych kontaktach bez tytułu. Jakie zdarzenie wybrać?",a:["before insert","after insert","before delete","after update"],e:"Modyfikacja pól przed zapisem nowego rekordu to before insert: wystarczy przypisać wartość w Trigger.new, bez DML."},{id:"w09-25",q:"Jak sprawdzić, że pole tekstowe jest puste lub zawiera tylko spacje?",a:["String.isBlank(con.Title)","con.Title == ''","con.Title.isEmpty()","String.isNull(con.Title)"],e:"String.isBlank() zwraca true dla null, pustego i białych znaków. Używane w przykładach z wykładu."},{id:"w09-26",q:"Jak dodać błąd przypisany do konkretnego pola (a nie całego rekordu)?",a:["acc.Name.addError('…')","acc.addFieldError('Name', '…')","Trigger.addError(acc.Name)","throw new FieldException('Name')"],e:"acc.Name.addError('…') przypisuje błąd do pola Name. acc.addError('…') przypisuje go do całego rekordu."},{id:"w09-27",q:"Jaki warunek sprawdza trigger dla Opportunity z wykładu (before update)?",a:["Czy otwarta szansa (IsClosed == false) ma CloseDate w przeszłości","Czy kwota przekracza 1 mld","Czy brak nazwy","Czy Type = 'Customer'"],e:"Jeśli szansa nie jest zamknięta, a CloseDate < Date.today(), to opp.CloseDate.addError(…)."},{id:"w09-28",q:"Jak w triggerze before insert na Lead znormalizować e-mail do małych liter?",a:["leadRecord.Email = leadRecord.Email.trim().toLowerCase();","update leadRecord.Email.toLowerCase();","insert leadRecord.Email.lower();","Trigger.new.Email = lower(Email);"],e:"W before insert wystarczy przypisać wartość: Email = Email.trim().toLowerCase(). Nie potrzeba DML."},{id:"w09-29",q:"Trigger after insert na Account tworzy zadania (Task). Jaki jest poprawny wzorzec?",a:["Zebrać Taski w liście w pętli i wykonać jeden insert po pętli","Wykonać insert Task wewnątrz pętli dla każdego konta","Zmodyfikować Trigger.new, dodając Taski","Użyć before insert, bo konto nie ma jeszcze Id"],e:"Zbieramy w List<Task> i wykonujemy insert raz (bulk). Task.WhatId = acc.Id wymaga after insert."},{id:"w09-30",q:"Którą kolekcję iteruje trigger before delete blokujący usunięcie kont typu 'Customer'?",a:["Trigger.old","Trigger.new","Trigger.newMap","Trigger.size"],e:"W before delete Trigger.new jest niedostępne, więc iteruje się po Trigger.old."},{id:"w09-31",q:"Jakie pole Task łączy zadanie z kontem w przykładzie z wykładu?",a:["WhatId","AccountId","WhoId","ParentId"],e:"W przykładzie: WhatId = acc.Id."},{id:"w09-32",q:"Co zrobi trigger myAccountTrigger (before insert, before update), gdy Industry == null?",a:["Ustawi Industry = 'General'","Zablokuje zapis","Usunie rekord","Nic"],e:"if (acc.Industry == null) acc.Industry = 'General'; addError jest wywoływane tylko, gdy AnnualRevenue > 1 mld."},{id:"w09-33",q:"Ile zdarzeń wyzwalaczy łącznie omówiono (grupy before i after)?",a:["7 (3 before + 4 after)","6 (3 + 3)","8 (4 + 4)","4"],e:"before: insert, update, delete. after: insert, update, delete, undelete. Nie ma 'before undelete'."},{id:"w09-34",q:"Które zdarzenie NIE istnieje?",a:["before undelete","after undelete","before delete","after delete"],e:"Undelete ma tylko wariant after."}],qp={id:Np,title:Op,questions:Pp},Rp="w10",Mp="W10 · Podstawy LWC",_p=[{id:"w10-01",q:"Czym jest Lightning Web Components (LWC)?",a:["Nowoczesnym frameworkiem Salesforce do budowania UI w aplikacjach Lightning, opartym na natywnych technologiach webowych","Językiem programowania backendu Salesforce","Narzędziem low-code do budowy procesów","Starszym frameworkiem zastąpionym przez Aurę"],e:"LWC to nowoczesny framework Salesforce do budowania interfejsów, bazujący na natywnych standardach webowych."},{id:"w10-02",q:"Na jakich natywnych technologiach webowych bazuje LWC?",a:["HTML Custom Elements, HTML Templates, Shadow DOM, ES6 Modules","jQuery, Bootstrap, AngularJS","Visualforce, Aura, Apex","React, JSX, Redux"],e:"LWC bazuje na Custom Elements (<c-my-component>), HTML Templates, Shadow DOM (izolacja) i ES6 Modules."},{id:"w10-03",q:"Która technologia zapewnia izolację stylów i logiki komponentu LWC?",a:["Shadow DOM","ES6 Modules","HTML Templates","Locker Service"],e:"Shadow DOM zapewnia izolację stylów i logiki."},{id:"w10-04",q:"Jak wygląda znacznik własnego komponentu LWC w HTML (Custom Element)?",a:["<c-my-component>","<lwc:myComponent>","<myComponent/>","<c:myComponent>"],e:"Custom Elements to własne znaczniki HTML, np. <c-my-component> (camelCase zamieniany na kebab-case z prefiksem c-)."},{id:"w10-05",q:"W jakim katalogu projektu tworzy się komponenty LWC?",a:["force-app/main/default/lwc","src/components","force-app/main/default/classes","force-app/lwc/components"],e:"Komponenty tworzy się w force-app/main/default/lwc/<nazwaKomponentu>/."},{id:"w10-06",q:"Skąd pochodzi nazwa komponentu LWC?",a:["Z nazwy katalogu i plików","Z atrybutu name w pliku .js","Z nazwy klasy Apex","Z pliku package.json"],e:"Nazwa katalogu i plików to nazwa komponentu."},{id:"w10-07",q:"Który plik LWC zawiera metadane komponentu?",a:[".js-meta.xml",".html",".css",".svg"],e:".html to szablon, .js to logika, .js-meta.xml to metadane, .css to styl (opcjonalny), .svg to ikona (opcjonalna)."},{id:"w10-08",q:"Które pliki komponentu LWC są opcjonalne?",a:[".css i .svg",".html i .js",".js-meta.xml i .css",".js i .svg"],e:"Styl (.css) i ikona (.svg) są opcjonalne."},{id:"w10-09",q:"Jakim poleceniem instaluje się komponent w Org-u (VS Code)?",a:["SFDX: Deploy This Source To Org","npm publish","git push origin org","SFDX: Retrieve Source from Org"],e:"Zainstalowanie komponentu: SFDX: Deploy This Source To Org."},{id:"w10-10",q:"Za co odpowiada plik .html komponentu LWC?",a:["Definiuje strukturę (layout) i elementy UI; używa dyrektyw jak for:each, lwc:if","Zawiera logikę biznesową i obsługę zdarzeń","Określa, gdzie komponent może być używany","Definiuje ikonę komponentu"],e:"Szablon .html definiuje strukturę i elementy UI. Używa HTML, Lightning Base Components i dyrektyw (for:each, if:true, lwc:if)."},{id:"w10-11",q:"Które z poniższych to dyrektywy szablonu LWC?",a:["for:each, if:true, lwc:if","v-for, v-if","ng-repeat, ng-if","*ngFor, *ngIf"],e:"Dyrektywy LWC: for:each, if:true, lwc:if. Pozostałe to Vue i Angular."},{id:"w10-12",q:"Za co odpowiada plik .js komponentu LWC?",a:["Logikę, właściwości, metody, obsługę zdarzeń, komunikację, pobieranie danych i cykl życia","Wyłącznie wygląd komponentu","Definicję miejsc użycia komponentu","Ikonę komponentu"],e:"Plik .js: logika biznesowa, właściwości i metody, obsługa zdarzeń, komunikacja, dane (Apex, Lightning Data Service) i lifecycle hooks."},{id:"w10-13",q:"Za pomocą czego plik .js komponentu pobiera i aktualizuje dane Salesforce?",a:["Apex oraz Lightning Data Service","Bezpośrednich zapytań SQL","Plików CSV","Visualforce"],e:"Logika .js obsługuje pobieranie i aktualizację modelu danych, np. przez Apex oraz Lightning Data Service."},{id:"w10-14",q:"Co określa plik .js-meta.xml?",a:["Czy komponent jest dostępny w Lightning App Builder i gdzie może być używany (App/Home/Record Page, Flow Screens)","Logikę obsługi zdarzeń","Kolory komponentu","Strukturę HTML"],e:".js-meta.xml określa dostępność w Lightning App Builder, miejsca użycia (targets), Flow Screens oraz etykietę, opis i właściwości konfiguracyjne."},{id:"w10-15",q:"Jak domyślnie działają style z pliku .css komponentu LWC?",a:["Są ograniczone do komponentu (CSS scoping, Shadow DOM)","Są globalne dla całej strony","Nadpisują style SLDS całej aplikacji","Działają tylko w Experience Cloud"],e > to komponent z biblioteki Salesforce."},{id:"w10-24",q:"Co robi atrybut onchange={handleChange} w szablonie?",a:["Wywołuje metodę handleChange zdefiniowaną w pliku .js przy zmianie wartości","Wywołuje metodę Apex handleChange","Zmienia styl elementu","Wysyła zdarzenie do LMS"],e:"onchange={handleChange} wywołuje funkcję handleChange z pliku .js."},{id:"w10-25",q:"Z jakiego modułu importuje się LightningElement?",a:["'lwc'","'lightning'","'c/base'","'salesforce'"],e:"import { LightningElement, track } from 'lwc';"},{id:"w10-26",q:"Co oznacza 'export default' w klasie komponentu?",a:["Udostępnienie klasy komponentu platformie","Ustawienie domyślnych wartości pól","Eksport do Apex","Udostępnienie komponentu publicznie w Internecie"],e:"export default udostępnia klasę komponentu platformie."},{id:"w10-27",q:"Do czego służy dekorator @track w przykładzie Hello World?",a:["Gwarantuje automatyczną zmianę w szablonie przy zmianie wartości","Udostępnia właściwość rodzicowi","Wywołuje metodę Apex","Śledzi zmiany w bazie danych"],e:"@track gwarantuje automatyczną zmianę w szablonie (reaktywność). @api udostępnia właściwość rodzicowi."},{id:"w10-28",q:"Jak w handleChange(event) odczytać nową wartość pola?",a:["event.target.value","event.value","this.value","event.detail.text"],e:"this.name = event.target.value;"},{id:"w10-29",q:"Co oznacza <isExposed>true</isExposed> w .js-meta.xml?",a:["Komponent jest widoczny w UI (np. w Lightning App Builder)","Komponent jest publiczny w Internecie","Komponent ma dostęp do wszystkich danych","Komponent jest eksportowany do pakietu"],e:"<isExposed> określa, czy komponent jest widoczny w UI."},{id:"w10-30",q:"Który target pozwala dodać komponent do strony rekordu?",a:["lightning__RecordPage","lightning__AppPage","lightning__HomePage","lightning__FlowScreen"],e:"AppPage – strona aplikacji, RecordPage – strona rekordu, HomePage – strona główna."},{id:"w10-31",q:"Co reprezentuje selektor CSS :host w komponencie LWC?",a:["Główny element (host element) komponentu","Element <body> strony","Wszystkie komponenty potomne","Element rodzica"],e:":host to selektor głównego elementu komponentu LWC."},{id:"w10-32",q:"Czym jest klasa LightningElement?",a:["Klasą bazową każdego komponentu LWC, zapewniającą renderowanie, reaktywność, zdarzenia i cykl życia","Klasą Apex do obsługi UI","Komponentem bazowym biblioteki SLDS","Klasą testową"],e:"LightningElement to klasa bazowa każdego komponentu: renderowanie HTML, reaktywność (@track, @api), zdarzenia i cykl życia."},{id:"w10-33",q:"Które z poniższych to metody cyklu życia komponentu LWC?",a:["connectedCallback(), disconnectedCallback()","onInit(), onDestroy()","componentDidMount(), componentWillUnmount()","beforeInsert(), afterInsert()"],e:"LightningElement realizuje cykl życia, np. connectedCallback() i disconnectedCallback()."},{id:"w10-34",q:"Gdzie uruchamia się komponent LWC?",a:["Bezpośrednio w przeglądarce użytkownika","Na serwerze Salesforce","W bazie danych Org-a","W kontekście asynchronicznym Apex"],e:"Komponent LWC uruchamia się bezpośrednio w przeglądarce, a z backendem komunikuje się np. przez Apex."},{id:"w10-35",q:"Do czego służy zastosowanie LWC w Utility Bar?",a:["Do tworzenia narzędzi dostępnych z paska narzędzi aplikacji","Do osadzania w zewnętrznych aplikacjach","Do portali społeczności","Do ekranów Flow"],e:"Utility Bar to narzędzia dostępne z paska narzędzi aplikacji."},{id:"w10-36",q:"Co umożliwia Lightning Out?",a:["Osadzanie komponentów Lightning w zewnętrznych aplikacjach internetowych","Wylogowanie z Lightning","Eksport danych z Org-a","Przełączenie do Salesforce Classic"],e:"Lightning Out to osadzanie komponentów Lightning w zewnętrznych aplikacjach internetowych."},{id:"w10-37",q:"Do czego służą Custom Tabs w kontekście LWC?",a:["Udostępnianie komponentów jako samodzielnych kart aplikacji","Tworzenie zakładek w przeglądarce","Definiowanie pól obiektu","Grupowanie rekordów"],e:"Custom Tabs udostępniają komponenty jako samodzielne karty aplikacji."},{id:"w10-38",q:"Gdzie użyć LWC, aby był elementem ekranu procesu automatyzacji?",a:["Flow Screens","Utility Bar","Lightning Out","Home Pages"],e:"Flow Screens: komponenty LWC jako elementy ekranów Salesforce Flow."},{id:"w10-39",q:"Do czego służy LWC w Experience Cloud?",a:["Do tworzenia interfejsów portali i społeczności","Do aplikacji konsolowych","Do aplikacji mobilnej","Do pisania triggerów"],e:"Experience Cloud to interfejsy portali i społeczności dla użytkowników zewnętrznych."},{id:"w10-40",q:"Do czego służą Record Pages?",a:["Do prezentacji i obsługi danych konkretnego rekordu","Do budowania własnych stron aplikacji","Do strony głównej","Do raportów"],e:"Record Pages: prezentacja i obsługa danych konkretnego rekordu. App Pages: własne strony aplikacji."}],Ip={id:Rp,title:Mp,questions:_p},Fp="w11",Wp="W11 · Komunikacja między komponentami LWC",Up=[{id:"w11-01",q:"Jak realizuje się komunikację Rodzic → Dziecko w LWC?",a:["Przez właściwości (properties) dziecka oznaczone @api, ustawiane przez rodzica","Przez CustomEvent wysyłany przez rodzica","Przez Lightning Message Service obowiązkowo","Przez wywołanie Apex"],e:"Rodzic → Dziecko: przekazywanie danych w dół za pomocą właściwości, z użyciem @api."},{id:"w11-02",q:"Jak realizuje się komunikację Dziecko → Rodzic w LWC?",a:["Dziecko wysyła zdarzenie CustomEvent do rodzica","Dziecko ustawia właściwość @api rodzica","Dziecko wywołuje metodę Apex rodzica","Nie jest to możliwe"],e:"Dziecko → Rodzic: komponent dziecka wysyła zdarzenia CustomEvent do rodzica."},{id:"w11-03",q:"Jak komunikują się komponenty rodzeństwa (wspólny rodzic)?",a:["Za pomocą wspólnego rodzica: dziecko 1 wysyła zdarzenie, rodzic aktualizuje dane dziecka 2","Bezpośrednio przez @api","Bezpośrednio przez wywołanie metody drugiego dziecka","Przez wspólną zmienną globalną window"],e:"Rodzeństwo ↔ rodzeństwo: pośrednikiem jest wspólny rodzic. Dziecko 1 → zdarzenie → rodzic → właściwość dziecka 2."},{id:"w11-04",q:"Czym jest Lightning Message Service w kontekście komunikacji?",a:["Globalną komunikacją publikacja–subskrypcja w całej aplikacji, niezależnie od hierarchii","Komunikacją Rodzic → Dziecko","Usługą e-mail Salesforce","Mechanizmem wywołań Apex"],e:"Lightning Message Service to globalna komunikacja typu publish/subscribe, niezależna od hierarchii komponentów."},{id:"w11-05",q:"Który dekorator czyni właściwość dziecka dostępną dla rodzica?",a:["@api","@track","@wire","@public"],e:"@api message; to właściwość dostępna dla rodzica."},{id:"w11-06",q:"Jak rodzic przekazuje wartość 'Witaj' do właściwości message dziecka?",a:['<c-child-component message="Witaj"></c-child-component>','<c-child-component @api.message="Witaj">',"this.child.message = 'Witaj' w Apex",'<c-child-component onmessage="Witaj">'],e:'Rodzic osadza dziecko i ustawia atrybut: <c-child-component message="…">.'},{id:"w11-07",q:"Jak dziecko tworzy zdarzenie o nazwie 'notify' z danymi?",a:["new CustomEvent('notify', { detail: { text: '…' } })","new Event('onnotify', { data: '…' })","fireEvent('notify', '…')","new LightningEvent('notify')"],e:"const myEvent = new CustomEvent('notify', { detail: { … } });"},{id:"w11-08",q:"Jak dziecko wysyła utworzone zdarzenie?",a:["this.dispatchEvent(myEvent)","this.emit(myEvent)","publish(myEvent)","this.fire(myEvent)"],e:"this.dispatchEvent(myEvent);"},{id:"w11-09",q:"Jak rodzic nasłuchuje zdarzenia 'notify' od dziecka?",a:["<c-child-component onnotify={handleNotification}>","<c-child-component notify={handleNotification}>","<c-child-component on-notify={handleNotification}>","<c-child-component @notify={handleNotification}>"],e:"Nazwa atrybutu to 'on' + nazwa zdarzenia: onnotify={handleNotification}."},{id:"w11-10",q:"Gdzie w obiekcie zdarzenia znajdują się dane przesłane przez dziecko?",a:["event.detail","event.target.value","event.payload","event.data"],e:"Dane przekazane w CustomEvent są w event.detail, np. event.detail.text."},{id:"w11-11",q:"Jaki wzorzec komunikacyjny pozwala komponentom niezależnym hierarchicznie wymieniać informacje bez wspólnego rodzica?",a:["Publisher–Subscriber (Pub/Sub)","Model–View–Controller","Singleton","Rodzic–Dziecko"],e:"Publisher–Subscriber: jeden komponent publikuje zdarzenie (publish), inny je subskrybuje (subscribe)."},{id:"w11-12",q:"Jakie minimalne funkcje ma moduł pubsub.js z wykładu?",a:["subscribe, unsubscribe, publish","send, receive","on, off, emit, once","connect, disconnect"],e:"Minimalna funkcjonalność: subscribe, unsubscribe, publish."},{id:"w11-13",q:"Gdzie umieszcza się moduł pubsub.js?",a:["W odrębnym katalogu lwc/pubsub/","W katalogu classes/","W pliku .js-meta.xml","W statycznych zasobach Apex"],e:"pubsub.js w odrębnym katalogu: lwc/pubsub/."},{id:"w11-14",q:"Jak komponent importuje funkcję publish z kanału pubsub?",a:["import { publish } from 'c/pubsub';","import publish from 'lwc/pubsub';","import { publish } from 'lightning/pubsub';","require('pubsub').publish"],e:"import { publish } from 'c/pubsub'. Prefiks c/ to przestrzeń nazw Custom."},{id:"w11-15",q:"Co oznacza prefiks 'c/' w imporcie 'c/pubsub'?",a:["Przestrzeń nazw Custom (własne komponenty/moduły)","Moduł wbudowany Salesforce","Moduł CSS","Moduł z CDN"],e:"c/ to przestrzeń nazw Custom."},{id:"w11-16",q:"Czy nadawca (Publisher) subskrybuje kanał?",a:["Nie, nadawca używa tylko funkcji publish","Tak, zawsze","Tak, w connectedCallback","Tylko jeśli chce odebrać potwierdzenie"],e:"Nadawca nie subskrybuje kanału, tylko używa funkcji publish."},{id:"w11-17",q:"W której metodzie odbiorca (Subscriber) w przykładzie rejestruje subskrypcję?",a:["connectedCallback()","constructor()","renderedCallback()","handleClick()"],e:"connectedCallback to metoda cyklu życia uruchamiana, gdy komponent jest wstawiany do DOM. Tam wywoływane jest subscribe(…)."},{id:"w11-18",q:"Kiedy uruchamia się connectedCallback?",a:["Gdy komponent jest wstawiany do DOM","Gdy komponent jest usuwany z DOM","Po każdym renderowaniu","Przy wywołaniu Apex"],e:"connectedCallback uruchamia się, gdy komponent jest wstawiany do DOM."},{id:"w11-19",q:"Co robi publish('messageEvent', payload) w implementacji z wykładu?",a:["Wywołuje wszystkie callbacki zarejestrowane dla 'messageEvent', przekazując payload","Zapisuje payload w bazie danych","Wysyła payload do serwera Apex","Tworzy nowy komponent"],e:"publish iteruje po events[eventName] i wywołuje każdy callback z payloadem (w try/catch)."},{id:"w11-20",q:"Co robi unsubscribe w implementacji pubsub z wykładu?",a:["Usuwa konkretny callback z listy słuchaczy danego zdarzenia (filter)","Usuwa wszystkie zdarzenia","Zamyka kanał dla wszystkich","Wyrejestrowuje komponent z DOM"],e:"events[eventName] = events[eventName].filter(listener => listener !== callback)."},{id:"w11-21",q:"Jakie są zalety komunikacji Pub/Sub?",a:["Brak zależności hierarchicznej, mniejsze sprzężenie, łatwość testowania i ponownego użycia","Działa między różnymi Org-ami","Działa między różnymi stronami aplikacji","Nie wymaga JavaScriptu"],e:"Zalety: brak zależności hierarchicznej, czysta architektura, mniejsze sprzężenie, łatwe testowanie i reuse."},{id:"w11-22",q:"Jakie jest ograniczenie komunikacji Pub/Sub z wykładu?",a:["Działa tylko w obrębie jednej strony (Lightning App Page)","Działa tylko między rodzicem i dzieckiem","Wymaga Apex","Działa tylko w aplikacji mobilnej"],e:"Ograniczenie: działa tylko w obrębie jednej strony (Lightning App Page)."},{id:"w11-23",q:"Który komponent w przykładzie (account-container) pobiera dane z Apex?",a:["c-account-container (kontener główny)","c-contact-tile","c-account-header","c-activity-timeline"],e:"c-account-container to komponent nadrzędny. Pobiera dane z Apex (np. AccountController.getAccountDetails) i przechowuje stan."},{id:"w11-24",q:"Jaki poziom zagnieżdżenia ma c-contact-tile w przykładzie?",a:["Komponent potomny poziomu 2 (dziecko c-contact-list)","Komponent potomny poziomu 1","Komponent nadrzędny","Komponent rodzeństwa kontenera"],e:"c-contact-tile to poziom 2 i reprezentuje pojedynczy kontakt na liście c-contact-list (poziom 1)."},{id:"w11-25",q:"Za co odpowiada c-activity-timeline w przykładzie?",a:["Wyświetla historię zadań, rozmów i e-maili","Wyświetla informacje o firmie","Zarządza listą kontaktów","Pobiera dane z Apex"],e:"c-activity-timeline (poziom 1) wyświetla historię zadań, rozmów i e-maili."},{id:"w11-26",q:"Za co odpowiada c-account-header?",a:["Wyświetla podstawowe informacje o firmie (nazwa, branża, rating)","Przechowuje stan wybranego kontaktu","Reprezentuje pojedynczy kontakt","Publikuje wiadomości LMS"],e:"c-account-header (poziom 1) wyświetla podstawowe informacje o firmie."},{id:"w11-27",q:"Komponent A na stronie chce powiadomić niezależny komponent B (brak wspólnego rodzica). Co wybrać?",a:["Pub/Sub (Lightning Message Service)","@api","CustomEvent do rodzica","Bezpośrednie wywołanie metody B"],e:"Komponenty niezależne hierarchicznie komunikują się przez Pub/Sub, czyli LMS."},{id:"w11-28",q:"Co umożliwia komunikacja między komponentami LWC wg wykładu?",a:["Budowanie aplikacji modułowych","Omijanie limitów Apex","Zapis do bazy bez DML","Uruchamianie triggerów"],e:"Komunikacja LWC umożliwia budowanie aplikacji modułowych."}],Kp={id:Fp,title:Wp,questions:Up},Bp="w12",Jp="W12 · LWC w praktyce (LDS, Apex, dobre praktyki)",$p=[{id:"w12-01",q:"Co umożliwia Lightning Data Service (LDS)?",a:["Dostęp do rekordów bez konieczności pisania kodu Apex","Wykonywanie zapytań SQL z przeglądarki","Tworzenie triggerów w JS","Komunikację Pub/Sub"],e:"LDS daje dostęp do rekordów bez pisania kodu Apex."},{id:"w12-02",q:"Który moduł trzeba zaimportować, aby korzystać z getRecord i updateRecord?",a:["lightning/uiRecordApi","lwc","@salesforce/apex","c/pubsub"],e:"Konieczny jest import modułu lightning/uiRecordApi."},{id:"w12-03",q:"Jakich elementów LDS używa się do odczytu i aktualizacji rekordu?",a:["@wire(getRecord) i updateRecord()","getAccounts() i insert","publish() i subscribe()","fetch() i XMLHttpRequest"],e:"LDS: @wire(getRecord, …) do odczytu i updateRecord() :"Przepływ: LWC → Apex → SOQL → Salesforce (Platforma) → LWC."},{id:"w12-10",q:"Czym charakteryzuje się reaktywne wywołanie Apex przez @wire?",a:["Automatycznie odświeża dane przy zmianie parametrów","Wymaga ręcznego wywołania w handlerze kliknięcia","Nie może przyjmować parametrów","Działa tylko z LDS"],e:"@wire daje automatyczne odświeżanie danych przy zmianie parametrów (np. '$industry')."},{id:"w12-11",q:"Co otrzymuje funkcja dekorowana @wire, np. wiredAccounts(…)?",a:["Obiekt z polami data i error","Tylko listę rekordów","Obiekt event","Promise"],e:"wiredAccounts({ data, error }) { if (data) …; else if (error) …; }"},{id:"w12-12",q:"Która praktyka dotyczy architektury komponentów?",a:["Jeden cel = jeden komponent","Jak najgłębsze zagnieżdżanie komponentów","Jeden duży komponent na całą stronę","Logika w CSS"],e:"Architektura: komponenty modularne, jeden cel = jeden komponent, unikanie zagnieżdżania."},{id:"w12-13",q:"Dlaczego należy unikać głębokiego zagnieżdżania komponentów?",a:["Zbyt głęboka hierarchia DOM spowalnia renderowanie","Bo LWC nie pozwala na zagnieżdżanie","Bo powoduje błędy Apex","Bo zwiększa limity SOQL"],e:"Utrzymuj płaską strukturę DOM, bo zbyt głęboka hierarchia spowalnia renderowanie."},{id:"w12-14",q:"Dlaczego warto używać LDS tam, gdzie to możliwe?",a:["Jest szybsze i bezpieczniejsze niż Apex","Bo Apex jest przestarzały","Bo LDS nie ma limitów","Bo LDS pozwala na SQL"],e:"Używaj Lightning Data Service tam, gdzie to możliwe, bo jest szybsze i bezpieczniejsze niż Apex."},{id:"w12-15",q:"Co należy zrobić, jeśli trzeba użyć Apex z LWC?",a:["Czyścić dane i walidować wejście","Wyłączyć Locker Service","Używać without sharing","Przekazywać dane wrażliwe w zdarzeniach"],e:"Jeśli musisz użyć Apex, czyść dane i waliduj wejście."},{id:"w12-16",q:"Czego NIE należy przekazywać przez zdarzenia (events) ani Pub/Sub?",a:["Danych wrażliwych","Identyfikatorów rekordów","Komunikatów tekstowych","Nazw pól"],e:"Nie przekazuj danych wrażliwych przez zdarzenia (events) lub Pub/Sub."},{id:"w12-17",q:"Czego używać do komunikacji między stronami wg dobrych praktyk?",a:["Lightning Message Service","@api","CustomEvent","localStorage"],e:"Do komunikacji między stronami używaj Lightning Message Service."},{id:"w12-18",q:"Jak włączyć caching dla @wire?",a:["@wire(..., { cacheable: true })","@wire.cache()","@track(cache)","import cache from 'lwc'"],e:"Wydajność: włącz caching @wire(…, { cacheable: true })."},{id:"w12-19",q:"Co oznacza 'minimalizuj DOM reflow' w praktyce?",a:["Nie aktualizuj UI w pętli","Nie używaj CSS","Nie używaj @wire","Zawsze przeładowuj stronę"],e:"Minimalizuj DOM reflow, czyli nie aktualizuj UI w pętli."},{id:"w12-20",q:"Kiedy stosować @track lub reaktywne właściwości $?",a:["Tylko tam, gdzie to konieczne","Zawsze, dla każdej właściwości","Nigdy","Tylko w Apex"],e:"Używaj @track lub reaktywnych właściwości $ tylko tam, gdzie to konieczne."},{id:"w12-21",q:"Co stosować dla dużych danych lub komponentów (wydajność)?",a:["Lazy loading","Eager loading wszystkiego na starcie","Synchroniczne pętle","eval()"],e:"Stosuj lazy loading dla dużych danych lub komponentów."},{id:"w12-22",q:"Jaka konwencja nazewnictwa obowiązuje dla klas i zmiennych?",a:["PascalCase dla klas, camelCase dla zmiennych","camelCase dla klas, PascalCase dla zmiennych","snake_case dla wszystkiego","UPPER_CASE dla klas"],e:"PascalCase dla klas, camelCase dla zmiennych."},{id:"w12-23",q:"Których słów kluczowych do deklaracji zmiennych używać w JS LWC?",a:["const i let, nigdy var","Tylko var","var i let","Dowolnych"],e:"Używaj const i let, nigdy var."},{id:"w12-24",q:"Czego używać do dokumentowania funkcji w LWC?",a:["JSDoc","Javadoc","ApexDoc","Markdown w HTML"],e:"Używaj JSDoc do opisu funkcji w LWC. Metody Apex też dokumentuj."},{id:"w12-25",q:"Czego nigdy nie używać w LWC ze względów bezpieczeństwa?",a:["eval() ani dynamicznego HTML-a","const","@wire","SLDS"],e:"Nigdy nie używaj eval() ani dynamicznego HTML-a."},{id:"w12-26",q:"Co należy zrobić z Lightning Locker / Lightning Web Security?",a:["Nie wyłączać (jest automatycznie włączone)","Wyłączyć dla wydajności","Włączyć ręcznie w każdym komponencie","Zastąpić własnym mechanizmem"],e:"Korzystaj z Lightning Locker / LWS, czyli w praktyce nie wyłączaj (automatycznie włączone)."},{id:"w12-27",q:"Co oznacza FLS?",a:["Field-Level Security","Flow Logic Service","Full Lightning Support","Filtered List Selection"],e:"Przestrzegaj zasad CRUD/FLS (Field-Level Security)."},{id:"w12-28",q:"Jak należy obsługiwać błędy w kodzie LWC/Apex wg dobrych praktyk?",a:["Zawsze: try/catch oraz .catch(error => …)","Ignorować, platforma je obsłuży","Tylko console.log","Tylko w Apex"],e:"Zawsze obsługuj błędy: try/catch, .catch(error => …)."}],Qp={id:Bp,title:Jp,questions:$p},Vp="w13",Hp="W13 · Wybrane zagadnienia platformy Salesforce",Zp=[{id:"w13-01",q:"Czym jest aplikacja Lightning (Lightning App)?",a:["Zbiorem komponentów i stron wraz z konfiguracją, tworzącym spójne środowisko pracy użytkownika w Org-u","Pojedynczym komponentem LWC","Aplikacją mobilną instalowaną z App Store","Klasą Apex z interfejsem"],e:"Lightning App to zbiór komponentów i stron www wraz z konfiguracją, tworzący spójne środowisko pracy użytkownika."},{id:"w13-02",q:"W jakim modelu można tworzyć aplikacje Lightning?",a:["No-code, low-code lub pro-code","Tylko pro-code","Tylko no-code","Tylko przez AppExchange"],e:"Aplikacja Lightning jest tworzona w modelu no-code, low-code lub pro-code."},{id:"w13-03",q:"Jakie są główne typy aplikacji Lightning?",a:["Standardowe, niestandardowe (Custom), Console App","Publiczne, prywatne, chronione","Mobilne, desktopowe, webowe","Classic, Aura, LWC"],e:"Główne typy: standardowe (np. Sales, Service), niestandardowe (Custom) i Console App."},{id:"w13-04",q:"Co wyróżnia Console App?",a:["Umożliwia pracę na wielu rekordach jednocześnie","Działa tylko w terminalu","Jest dostępna tylko dla administratorów","Nie ma interfejsu graficznego"],e:"Console App umożliwia pracę na wielu rekordach jednocześnie."},{id:"w13-05",q:"Która warstwa aplikacji Lightning obejmuje pasek aplikacji, ikonę i nazwę widoczną dla użytkownika?",a:["Nawigacja (App Launcher / Menu)","Strony (Lightning Pages)","Komponenty","Kontrola dostępu"],e:"Nawigacja (App Launcher / Menu) to pasek aplikacji, ikona i nazwa aplikacji."},{id:"w13-06",q:"Która warstwa aplikacji Lightning obejmuje widoki, np. strony obiektów i strony główne?",a:["Strony (Lightning Pages)","Dane (Salesforce Objects)","Nawigacja","Komponenty"],e:"Strony (Lightning Pages) to widoki składające się na aplikację."},{id:"w13-07",q:"Która warstwa określa, kto może korzystać z aplikacji i jakie obiekty i rekordy są dostępne?",a:["Kontrola dostępu","Nawigacja","Strony","Komponenty"],e:"Kontrola dostępu: kto może korzystać z aplikacji oraz jakie obiekty i rekordy są dostępne."},{id:"w13-08",q:"Ile warstw aplikacji Lightning wymieniono na wykładzie?",a:["5: nawigacja, strony, komponenty, dane, kontrola dostępu","3: model, widok, kontroler","4: UI, logika, dane, integracja","2: frontend i backend"],e:"Warstwy: Nawigacja, Strony, Komponenty, Dane, Kontrola dostępu."},{id:"w13-09",q:"Jaki jest starszy interfejs platformy Salesforce?",a:["Salesforce Classic","Lightning Experience","Experience Cloud","Agentforce Vibes"],e:"Salesforce Classic to starszy interfejs z tradycyjnym układem zakładek i list rekordów oraz ograniczoną personalizacją."},{id:"w13-10",q:"Która cecha dotyczy Lightning Experience, a nie Classic?",a:["Obsługa LWC i dostęp do nowoczesnych funkcji, w tym Agentforce","Tradycyjny układ oparty na zakładkach","Ograniczone możliwości personalizacji","Brak konfigurowalnych stron"],e:"Lightning Experience: dynamiczny układ z komponentów, konfigurowalne strony, obsługa LWC, Agentforce."},{id:"w13-11",q:"Czy można przełączać się między Lightning Experience a Classic?",a:["Tak","Nie, Classic został usunięty","Tylko w Sandboxie","Tylko przez CLI"],e:"Na slajdach pokazano przełączanie Lightning Experience ⇄ Classic."},{id:"w13-12",q:"Jakie są sposoby pracy z Org-iem?",a:["Zdalny (interfejs webowy) i lokalny (Salesforce CLI, VS Code z Salesforce Extension Pack)","Tylko zdalny","Tylko przez aplikację mobilną","Tylko przez SSH"],e:"Zdalny: interfejs webowy Org-a. Lokalny: Salesforce CLI oraz VS Code z Salesforce Extension Pack."},{id:"w13-13",q:"Jaki plugin VS Code służy do pracy z Salesforce?",a:["Salesforce Extension Pack","Apex Runner","Lightning Studio","Force IDE"],e:"VS Code z pluginem Salesforce Extension Pack."},{id:"w13-14",q:"Czego NIE można zrobić lokalnie przy użyciu Salesforce CLI?",a:["Uruchamiać kodu Apex i uzyskać bezpośredniego dostępu do bazy danych","Edytować plików","Podglądać zasobów statycznych","Podglądać komponentów frontendowych (z serwerem deweloperskim)"],e:"Lokalnie nie można uruchamiać Apex ani mieć bezpośredniego dostępu do bazy, bo kod działa w Org-u."},{id:"w13-15",q:"Co jest możliwe lokalnie z Salesforce CLI?",a:["Edycja plików i podgląd komponentów frontendowych (po instalacji serwera deweloperskiego)","Uruchamianie triggerów","Wykonywanie DML na produkcji bez deployu","Bezpośrednie zapytania SQL do bazy Org-a"],e:"Lokalnie: edycja plików, podgląd zasobów statycznych i komponentów frontendowych (z serwerem deweloperskim)."},{id:"w13-16",q:"Które narzędzia interfejsu webowego Org-a pokazano na wykładzie?",a:["Setup, Developer Console, Lightning App Builder, Agentforce Vibes","Eclipse, IntelliJ, NetBeans","Workbench, Data Loader, Postman","Jenkins, Git, Docker"],e:"Narzędzia webowe: Setup, Developer Console, Lightning App Builder, Agentforce Vibes."},{id:"w13-17",q:"Czym jest Salesforce CLI?",a:["Aplikacją wiersza poleceń instalowaną na komputerze użytkownika","Interfejsem webowym Org-a","Językiem programowania","Typem Org-a"],e:"Salesforce CLI to aplikacja CLI instalowana na komputerze użytkownika (lokalny sposób pracy)."},{id:"w13-18",q:"Która warstwa aplikacji Lightning to elementy interfejsu, standardowe lub niestandardowe (np. LWC)?",a:["Komponenty (Lightning Components)","Strony","Dane","Nawigacja"],e:"Komponenty (Lightning Components) to elementy interfejsu, standardowe (Salesforce) lub niestandardowe (np. LWC)."},{id:"w13-19",q:"Który przykład to standardowa aplikacja Lightning?",a:["Sales lub Service","Aplikacja utworzona przez dewelopera","Komponent LWC","Trigger Apex"],e:"Standardowe to gotowe aplikacje Salesforce, np. Sales, Service."}],Gp={id:Vp,title:Hp,questions:Zp},Yp="w14",Xp="W14 · Automatyzacja i analityka modelu danych",ey=[{id:"w14-01",q:"Co obejmuje automatyka biznesowa na poziomie bazy danych (Database-Level Business Automation)?",a:["Mechanizmy automatycznej kontroli poprawności, wyliczania wartości, utrzymania spójności i reagowania na zmiany w rekordach","Budowanie ekranów i formularzy","Administrację serwerem bazy danych","Tworzenie triggerów SQL"],e:"Obejmuje mechanizmy kontroli poprawności, wyliczania wartości, utrzymania spójności i reagowania na zmiany rekordów."},{id:"w14-02",q:"Czy reguły automatyki modelu danych działają, gdy dane są modyfikowane przez API lub import?",a:["Tak, działają niezależnie od sposobu wprowadzania danych","Nie, tylko przy formularzu","Tylko przy imporcie","Tylko gdy włączony jest Flow"],e:"Reguły działają niezależnie od tego, czy dane są wprowadzane przez formularz, API, import czy inny proces."},{id:"w14-03",q:"Do czego służy pole External ID?",a:["Do identyfikowania rekordów na podstawie zewnętrznych identyfikatorów, np. przy integracji i imporcie","Do szyfrowania danych","Do relacji Master-Detail","Do wyświetlania danych zewnętrznych bez kopii"],e:"External ID pozwala identyfikować rekordy na podstawie zewnętrznych identyfikatorów, np. podczas integracji i importu."},{id:"w14-04",q:"Co wymusza atrybut Unique pola?",a:["Unikatowość wartości w obrębie danego obiektu","Podanie wartości","Unikatowość w całym Org-u","Szyfrowanie wartości"],e:"Unique wymusza unikatowość wartości w obrębie danego obiektu. Required wymusza podanie wartości."},{id:"w14-05",q:"Jak zagwarantować, że każda sala (Room__c) ma numer i żadne dwie sale nie mają tego samego numeru?",a:["Ustawić pole Number__c jako Required i Unique","Utworzyć pole Formula","Utworzyć Roll-Up Summary","Utworzyć Record-Triggered Flow"],e:"Przykład z wykładu: pole Number__c wymagane (Required) i unikatowe (Unique)."},{id:"w14-06",q:"Czym są Validation Rules?",a:["Warunkami, które muszą być spełnione, aby rekord mógł zostać zapisany","Polami wyliczanymi","Regułami wykrywania duplikatów","Uprawnieniami użytkowników"],e:"Reguły walidacyjne określają warunki, które muszą być spełnione, aby rekord mógł zostać zapisany."},{id:"w14-07",q:"Czego NIE robią Validation Rules?",a:["Nie wyliczają i nie zapisują wartości pól","Nie kontrolują zakresów wartości","Nie blokują zapisu niepoprawnych rekordów","Nie wyświetlają komunikatów o błędach"],e:"Validation Rules wymuszają informacje, kontrolują zakresy, daty i zależności, blokują zapis i pokazują komunikaty. Wyliczanie to Formula Fields."},{id:"w14-08",q:"Gdzie definiuje się Validation Rules?",a:["Setup → Object Manager → Validation Rules","Setup → Data → Duplicate Management","Developer Console → Triggers","App Launcher → Rules"],e:"Setup → Object Manager → (obiekt) → Validation Rules."},{id:"w14-09",q:"Który mechanizm wybrać, by sprawdzić, że koniec rezerwacji jest po jej rozpoczęciu?",a:["Validation Rule","Roll-Up Summary","Formula Field","Duplicate Rule"],e:"Tabela porównawcza: Validation Rules → kontrola poprawności, np. koniec rezerwacji po jej rozpoczęciu."},{id:"w14-10",q:"Do czego służą Formula Fields?",a:["Do automatycznego wyliczania wartości na podstawie innych pól","Do agregowania danych rekordów podrzędnych","Do blokowania zapisu","Do wykrywania duplikatów"],e:"Pola formuł automatycznie wyliczają wartości na podstawie innych pól."},{id:"w14-11",q:"Który mechanizm wybrać, by wyliczyć czas trwania rezerwacji?",a:["Formula Field","Roll-Up Summary","Validation Rule","Apex Trigger obowiązkowo"],e:"Formula Fields: automatyczne wyliczanie wartości, np. czasu trwania rezerwacji."},{id:"w14-12",q:"Co robią Roll-Up Summary Fields?",a:["Automatycznie aktualizują wartość w rekordzie nadrzędnym na podstawie rekordów podrzędnych","Wyliczają wartość z pól tego samego rekordu","Blokują duplikaty","Wysyłają powiadomienia"],e:"Roll-Up Summary automatycznie aktualizuje wartości w rekordzie nadrzędnym na podstawie powiązanych rekordów podrzędnych."},{id:"w14-13",q:"Dla jakiej relacji działa Roll-Up Summary?",a:["Tylko Master-Detail","Tylko Lookup","Master-Detail i Lookup","External Lookup"],e:"Mechanizm działa tylko dla relacji Master-Detail."},{id:"w14-14",q:"Jakie operacje oferuje Roll-Up Summary?",a:["COUNT, SUM, MIN, MAX","COUNT, SUM, AVG, MEDIAN","SUM, AVG","COUNT_DISTINCT, AVG"],e:"Dostępne operacje: COUNT, SUM, MIN, MAX. AVG nie ma na liście!"},{id:"w14-15",q:"Który mechanizm wybrać, by w Room__c automatycznie zliczać powiązane rezerwacje Event__c?",a:["Roll-Up Summary (COUNT) – Number_of_Events__c","Formula Field","Validation Rule","Duplicate Rule"],e:"Przykład: Room__c.Number_of_Events__c zlicza powiązane rezerwacje Event__c (Roll-Up Summary)."},{id:"w14-16",q:"Z jakich elementów korzysta Duplicate Management?",a:["Matching Rules (kryterium tożsamości) i Duplicate Rules (sposób reakcji)","Validation Rules i Formula Fields","Triggers i Flows","Unique i Required"],e:"Matching Rules to kryterium tożsamości, Duplicate Rules to sposób reakcji."},{id:"w14-17",q:"Co określają Matching Rules?",a:["Kryterium tożsamości (kiedy rekordy uznać za duplikaty)","Sposób reakcji na duplikat","Warunek zapisu rekordu","Formułę wyliczania"],e:"Matching Rules określają kryterium tożsamości. Duplicate Rules określają reakcję."},{id:"w14-18",q:"Które działanie NIE jest dostępną reakcją Duplicate Rules?",a:["Automatyczne scalenie rekordów","Zablokowanie utworzenia duplikatu","Wyświetlenie ostrzeżenia","Dopuszczenie zapisu i zarejestrowanie zdarzenia"],e:"Możliwe działania: blokada, ostrzeżenie, dopuszczenie zapisu z rejestracją zdarzenia."},{id:"w14-19",q:"Gdzie konfiguruje się zarządzanie duplikatami?",a:["Setup → Data → Duplicate Management","Setup → Object Manager → Validation Rules","Setup → Object Manager → Fields & Relationships","Developer Console"],e:"Setup → Data → Duplicate Management."},{id:"w14-20",q:"Który mechanizm wybrać, by system nie pozwalał na dwóch klientów o tym samym NIP?",a:["Duplicate Rules (wykrywanie duplikatów)","Roll-Up Summary","Formula Field","Record-Triggered Flow"],e:"Przykład z wykładu: powtarzający się NIP obsługują Duplicate Rules."},{id:"w14-21",q:"Kiedy warto użyć Apex Trigger zamiast narzędzi deklaratywnych?",a:["Przy regułach obejmujących wiele rekordów, złożonych zależnościach i operacjach trudnych do wykonania w Flow","Do prostego wymuszenia wartości pola","Do wyliczenia czasu trwania z dwóch pól","Do zliczania rekordów Master-Detail"],e:"Triggery służą do reguł obejmujących wiele rekordów, złożonych walidacji między obiektami i niestandardowych operacji niewygodnych w Flow."},{id:"w14-22",q:"Który mechanizm wybrać do kontroli kolizji czasowych rezerwacji tej samej sali?",a:["Apex Trigger","Formula Field","Unique Field","Roll-Up Summary"],e:"Przykład: system rezerwacji sal sprawdza kolizje czasowe, a to realizuje Apex Trigger."},{id:"w14-23",q:"Kiedy może uruchamiać się Record-Triggered Flow?",a:["Przy Create, Update, Create or Update oraz (w odpowiednich konfiguracjach) Delete","Tylko przy Create","Tylko według harmonogramu","Tylko po kliknięciu przycisku"],e:"Record-Triggered Flow: Create, Update, Create or Update, Delete (tylko w odpowiednich konfiguracjach)."},{id:"w14-24",q:"Co może robić Record-Triggered Flow?",a:["Aktualizować i tworzyć rekordy, wysyłać powiadomienia, operować na powiązanych danych","Tylko blokować zapis","Tylko wyliczać formuły","Tworzyć triggery SQL"],e:"Flow może aktualizować inne rekordy, tworzyć nowe, wysyłać powiadomienia i operować na powiązanych danych."},{id:"w14-25",q:"Czy Record-Triggered Flow jest mechanizmem relacyjnej bazy danych?",a:["Nie, to narzędzie automatyzacji platformy Salesforce","Tak, to trigger SQL","Tak, to procedura składowana","Tak, to widok bazy danych"],e:"Ważne: Record-Triggered Flow jest narzędziem automatyzacji platformy, a nie mechanizmem relacyjnej bazy danych."},{id:"w14-26",q:"Czy Salesforce pozwala definiować własne triggery SQL w fizycznej bazie danych?",a:["Nie, mechanizmy działają na poziomie platformy Salesforce","Tak, przez Developer Console","Tak, w Sandboxie","Tak, przez Salesforce CLI"],e:"Salesforce nie udostępnia bezpośredniego dostępu do fizycznej bazy ani triggerów SQL."},{id:"w14-27",q:"Które mechanizmy zaliczono do 'kontroli i integralności danych'?",a:["Required, Unique, Validation Rules, Duplicate Rules","Formula Fields, Roll-Up Summary","Apex Triggers, Record-Triggered Flow","LWC, Aura"],e:"Kontrola i integralność: Required, Unique, Validation Rules, Duplicate Rules."},{id:"w14-28",q:"Które mechanizmy zaliczono do 'automatycznego przetwarzania danych'?",a:["Formula Fields i Roll-Up Summary Fields","Validation Rules i Duplicate Rules","Apex Triggers i Flow","Required i Unique"],e:"Automatyczne przetwarzanie danych: Formula Fields, Roll-Up Summary Fields."},{id:"w14-29",q:"Które mechanizmy zaliczono do 'automatyzacji procesów związanych z danymi'?",a:["Apex Triggers i Record-Triggered Flow","Formula Fields i Roll-Up Summary","Required i Unique","Matching Rules"],e:"Automatyzacja procesów: Apex Triggers, Record-Triggered Flow."},{id:"w14-30",q:"Który mechanizm wybrać, by po utworzeniu rezerwacji automatycznie zaktualizować rekord sali (bez kodu)?",a:["Record-Triggered Flow","Validation Rule","Formula Field","Unique Field"],e:"Tabela: Record-Triggered Flow to automatyczne wykonywanie działań, np. aktualizacja powiązanych rekordów."},{id:"w14-31",q:"Gdzie tworzy się pola formuł i Roll-Up Summary?",a:["Setup → Object Manager → Fields & Relationships","Setup → Data → Duplicate Management","Setup → Process Automation","Developer Console → Fields"],e:"Oba typy pól tworzy się w Setup → Object Manager → Fields & Relationships."}],ny={id:Yp,title:Xp,questions:ey},ay="w15",ty="W15 · Flow & Flow Builder",oy=[{id:"w15-01",q:"Czym jest Salesforce Flow (jako ogólne pojęcie)?",a:["Ogólnym określeniem mechanizmów do tworzenia i uruchamiania automatyzacji metodą deklaratywną (bez kodu)","Językiem programowania automatyzacji","Rodzajem triggera Apex","Biblioteką JS dla LWC"],e:"Salesforce Flow to ogólne określenie mechanizmów deklaratywnej automatyzacji. Obejmuje też m.in. Flow Orchestration i Flow Integration."},{id:"w15-02",q:"Czym jest Flow Builder?",a:["Graficznym narzędziem typu Web IDE do tworzenia i konfigurowania Flow-ów","Kompilatorem Apex","Narzędziem CLI","Aplikacją mobilną"],e:"Flow Builder to graficzne narzędzie Web IDE (Web-based Integrated Development Environment)."},{id:"w15-03",q:"Czego struktura przypomina pojedynczy Flow?",a:["Schemat blokowy","Tabelę bazy danych","Klasę obiektową","Arkusz kalkulacyjny"],e:"Flow to konfiguracja automatyzacji o strukturze przypominającej schemat blokowy."},{id:"w15-04",q:"Czy Flow może oddziaływać na systemy zewnętrzne?",a:["Tak, umożliwia integrację z systemami zewnętrznymi","Nie, tylko na dane w Org-u","Tylko przez Apex","Tylko w Experience Cloud"],e:"Flow może oddziaływać na dane w Org-u i w systemach zewnętrznych."},{id:"w15-05",q:"Jak może być uruchamiany Flow?",a:["Manualnie przez użytkownika lub automatycznie przez zmianę danych, zdarzenie lub harmonogram","Tylko manualnie","Tylko przez Apex","Tylko przez harmonogram"],e:"Flow może być uruchamiany manualnie lub automatycznie: przez zmianę danych, zdarzenie lub harmonogram."},{id:"w15-06",q:"Jaka była ewolucja narzędzi automatyzacji Salesforce?",a:["Workflow Rules → Process Builder → Flow Builder","Flow Builder → Process Builder → Workflow Rules","Process Builder → Workflow Rules → Flow Builder","Apex → Flow → Workflow"],e:"Ewolucja: Workflow Rules → Process Builder → Flow Builder."},{id:"w15-07",q:"Czym były Workflow Rules?",a:["Prostymi regułami typu IF–THEN (e-mail, aktualizacja pól, zadania)","Graficznym narzędziem do złożonych procesów z rozgałęzieniami","Mechanizmem wieloetapowych akceptacji","Językiem skryptowym"],e:"Workflow Rules to proste reguły IF–THEN. Process Builder to graficzne, bardziej złożone procesy."},{id:"w15-08",q:"Do czego służą Approval Processes?",a:["Do obsługi wieloetapowych procesów akceptacji (np. rabatów, wydatków)","Do wykrywania duplikatów","Do harmonogramowania zadań","Do tworzenia ekranów"],e:"Approval Processes obsługują wieloetapowe procesy akceptacji, np. zatwierdzanie rabatów, wydatków czy ofert."},{id:"w15-09",q:"Do czego służy aplikacja Automation (Automation Lightning App)?",a:["Do centralnego zarządzania, monitorowania i kontrolowania procesów automatyzacji w Org-u","Do pisania kodu Apex","Do tworzenia obiektów","Do zarządzania użytkownikami"],e:"Automation to aplikacja do centralnego zarządzania, monitorowania i kontrolowania automatyzacji (Flows, Flow Logs, Monitor)."},{id:"w15-10",q:"Jaka jest ścieżka do listy Flow-ów w Setup?",a:["Setup → PLATFORM TOOLS → Process Automation → Flows","Setup → Object Manager → Flows","Setup → Data → Flows","Setup → Users → Flows"],e:"Setup → PLATFORM TOOLS → Process Automation → Flows, a New Flow otwiera Flow Builder."},{id:"w15-11",q:"Który rodzaj Flow umożliwia interaktywne procesy z udziałem użytkownika (formularze)?",a:["Screen Flow","Autolaunched Flow","Schedule-Triggered Flow","Platform Event-Triggered Flow"],e:"Screen Flow to interaktywne procesy z formularzami, polami i listami wyboru, obsługiwane przez człowieka lub agenta."},{id:"w15-12",q:"Jakie są przykładowe zastosowania Screen Flow?",a:["Rejestracja klienta, zgłoszenie serwisowe","Nocna aktualizacja statusów","Przetwarzanie płatności z systemu zewnętrznego","Reakcja na zmiany w Data Cloud"],e:"Screen Flow: rejestracja klienta, zgłoszenie serwisowe."},{id:"w15-13",q:"Kiedy może wykonywać działania Record-Triggered Flow względem zapisu?",a:["Przed zapisem (Before-Save) lub po zapisie (After-Save)","Tylko po zapisie","Tylko przed zapisem","Tylko po usunięciu"],e:"Record-Triggered Flow pozwala wykonywać działania przed zapisem (Before-Save) lub po zapisie (After-Save)."},{id:"w15-14",q:"Który rodzaj Flow uruchamia się według harmonogramu i przetwarza grupę rekordów?",a:["Schedule-Triggered Flow","Record-Triggered Flow","Screen Flow","Autolaunched Flow"],e:"Schedule-Triggered Flow uruchamia się w określonym terminie i według harmonogramu, bez interakcji użytkownika."},{id:"w15-15",q:"Który Flow nadaje się do okresowego generowania zadań dla pracowników?",a:["Schedule-Triggered Flow","Screen Flow","Platform Event-Triggered Flow","Data Cloud-Triggered Flow"],e:"Schedule-Triggered Flow: przypomnienia o terminach, aktualizacja nieaktywnych rekordów, okresowe zadania."},{id:"w15-16",q:"Jak działa Platform Event-Triggered Flow?",a:["Uruchamia się po odebraniu Platform Event i działa asynchronicznie","Uruchamia się po kliknięciu przycisku","Działa synchronicznie z procesem, który wygenerował zdarzenie","Uruchamia się według harmonogramu"],e:"Uruchamia się po odebraniu zdarzenia platformowego. Działa asynchronicznie, niezależnie od procesu, który wygenerował zdarzenie."},{id:"w15-17",q:"Który Flow nie obsługuje ekranów i nie ma własnego mechanizmu wyzwalającego?",a:["Autolaunched Flow","Screen Flow","Record-Triggered Flow","Schedule-Triggered Flow"],e:"Autolaunched Flow działa bez interakcji użytkownika, bez ekranów i bez własnego triggera."},{id:"w15-18",q:"Czym może być uruchamiany Autolaunched Flow?",a:["Innym Flow, kodem Apex, REST API, przyciskiem lub akcją","Tylko zmianą rekordu","Tylko harmonogramem","Tylko Platform Event"],e:"Autolaunched Flow uruchamia inny Flow, Apex, REST API, przycisk lub akcja użytkownika."},{id:"w15-19",q:"Który rodzaj Flow służy do budowania wielokrotnie wykorzystywanych fragmentów logiki?",a:["Autolaunched Flow (wywoływany jako Subflow)","Screen Flow","Schedule-Triggered Flow","Data Cloud-Triggered Flow"],e:"Autolaunched Flow umożliwia budowanie wielokrotnie wykorzystywanej logiki, wywoływanej np. przez Subflow."},{id:"w15-20",q:"Na co reaguje Data Cloud-Triggered Flow?",a:["Na zmiany danych w Salesforce Data 360 (Data Cloud)","Na kliknięcia w UI","Na zmiany w kodzie Apex","Na Platform Events"],e:"Data Cloud-Triggered Flow reaguje na zmiany danych w Data 360 (DMO, CIO)."},{id:"w15-21",q:"Co oznacza skrót DMO w Data Cloud?",a:["Data Model Objects – obiekty ujednoliconego modelu danych","Dynamic Metadata Objects","Data Migration Operations","Default Model Output"],e:"DMO = Data Model Objects (ujednolicony model danych). CIO = Calculated Insight Objects (wyniki obliczeń i analiz)."},{id:"w15-22",q:"Co przechowują Calculated Insight Objects (CIO)?",a:["Wyniki obliczeń i analiz danych","Ujednolicony model danych","Definicje ekranów","Logi Flow"],e:"CIO przechowują wyniki obliczeń i analiz danych."},{id:"w15-23",q:"Który Flow wybrać, by utworzyć Lead po osiągnięciu określonego poziomu zaangażowania klienta (dane z Data 360)?",a:["Data Cloud-Triggered Flow","Screen Flow","Schedule-Triggered Flow","Autolaunched Flow"],e:"Przykład z wykładu dla Data Cloud-Triggered Flow."},{id:"w15-24",q:"Jakie są trzy obszary interfejsu Flow Builder?",a:["Toolbox, Canvas, Button Bar","Editor, Console, Debugger","Palette, Properties, Outline","Header, Body, Footer"],e:"① Toolbox (przybornik), ② Canvas (obszar roboczy), ③ Button Bar (pasek przycisków)."},{id:"w15-25",q:"Co pokazuje Button Bar w Flow Builder?",a:["Czy Flow jest aktywny, znacznik czasu zapisu, wersję, ostrzeżenia i błędy","Listę zmiennych i formuł","Diagram Flow","Listę rekordów"],e:"Button Bar pokazuje informacje o Flow: aktywność, czas zapisu, wersję, ostrzeżenia i błędy."},{id:"w15-26",q:"Co zawiera Toolbox w Flow Builder?",a:["Listę elementów i zasobów utworzonych we Flow (zmienne, formuły, opcje wyboru)","Diagram Flow","Przyciski Save i Activate","Logi błędów"],e:"Toolbox to lista elementów i zasobów utworzonych we Flow."},{id:"w15-27",q:"Jakie są trzy główne składniki Flow?",a:["Elementy, łączniki (Connectors), zasoby (Resources)","Klasy, metody, pola","Obiekty, pola, rekordy","Ekrany, przyciski, formularze"],e:"Elementy (węzły), łączniki (przebieg) i zasoby (dane, niewidoczne na diagramie)."},{id:"w15-28",q:"Które składniki Flow nie są widoczne na diagramie?",a:["Zasoby (Resources)","Elementy","Łączniki","Decyzje"],e:"Zasoby (zmienne, stałe, formuły, szablony, opcje wyboru) nie są widoczne na diagramie."},{id:"w15-29",q:"Jakie są trzy typy elementów Flow?",a:["Interaction, Logic, Data","Input, Process, Output","Screen, Action, Loop","Before, After, Async"],e:"Interaction to interakcja z użytkownikiem, Logic to interakcja Flow z samym sobą, Data to interakcja z modelem danych."},{id:"w15-30",q:"Do którego typu elementów należą Screen, Action i Subflow?",a:["Interaction","Logic","Data","Resource"],e:"Elementy interakcji: Screen, Action, Subflow."},{id:"w15-31",q:"Do czego służy element Action?",a:["Do wykonania operacji lub wywołania zewnętrznej funkcjonalności, np. wysłania e-maila lub kodu Apex","Do przypisania wartości zmiennej","Do podziału kolekcji","Do pobierania rekordów"],e:"Action wykonuje gotowe akcje Salesforce (e-mail, powiadomienia), kod Apex i akcje z pakietów."},{id:"w15-32",q:"Do czego służy element Subflow?",a:["Do wywołania innego Flow z poziomu bieżącego przepływu (z przekazaniem danych)","Do zagnieżdżenia pętli","Do wywołania triggera","Do podziału ekranu"],e:"Subflow wywołuje inny Flow, przekazuje dane wejściowe i odbiera wyniki, co ułatwia modularyzację."},{id:"w15-33",q:"Który element Flow jest odpowiednikiem if-else / switch?",a:["Decision","Assignment","Loop","Transform"],e:"Decision to odpowiednik if-else albo switch, z wieloma ścieżkami wykonania."},{id:"w15-34",q:"Który element Flow jest odpowiednikiem for / while?",a:["Loop","Decision","Collection Sort","Subflow"],e:"Loop to odpowiednik for albo while ?",a:["Text Template","Formula","Choice","Constant"],e:"Text Template to szablon tekstowy zawierający zmienne i inne zasoby."},{id:"w15-51",q:"Który zasób definiuje etap procesu wieloetapowego?",a:["Stage","Choice","Record","Loop"],e:"Stage definiuje etap procesu, np. postęp obsługi zamówienia."},{id:"w15-52",q:"Który zasób udostępnia wartości listy wyboru z pola Salesforce?",a:["Picklist Choice Set","Record Choice Set","Collection Choice Set","Choice"],e:"Picklist Choice Set udostępnia wartości picklisty z pola, np. statusy rezerwacji."},{id:"w15-53",q:"Który zasób tworzy opcje wyboru na podstawie rekordów modelu danych?",a:["Record Choice Set","Picklist Choice Set","Record Collection","Choice"],e:"Record Choice Set to opcje z rekordów, np. wybór pokoju z istniejących pomieszczeń."},{id:"w15-54",q:"Która zmienna globalna zawiera dane rekordu, który wyzwolił Record-Triggered Flow?",a:["$Record","$Record__Prior","$Flow","$User"],e:"$Record to rekord wyzwalający. $Record__Prior to wartości sprzed aktualizacji."},{id:"w15-55",q:"Co zawiera $Record__Prior?",a:["Wartości rekordu sprzed aktualizacji","Poprzedni Flow","Rekord nadrzędny","Poprzedniego użytkownika"],e:"$Record__Prior zawiera wartości rekordu sprzed aktualizacji."},{id:"w15-56",q:"Która zmienna globalna daje dostęp do etykiet niestandardowych (Custom Labels)?",a:["$Label","$System","$Organization","$Permission"],e:"$Label daje dostęp do Custom Labels."},{id:"w15-57",q:"Co zawiera zmienna globalna $Flow?",a:["Informacje o aktualnie wykonywanym przepływie, np. data uruchomienia, komunikat błędu","Listę wszystkich Flow w Org-u","Dane zalogowanego użytkownika","Dane organizacji"],e:"$Flow zawiera informacje o bieżącym przepływie: data uruchomienia, czas wykonania, komunikat błędu."},{id:"w15-58",q:"Która stała globalna reprezentuje pusty ciąg znaków?",a:["$GlobalConstant.EmptyString","$GlobalConstant.Null","$GlobalConstant.False","$System.Empty"],e:"Stałe globalne: True, False, EmptyString, Null."},{id:"w15-59",q
