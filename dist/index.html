 => new(0,0), {X: var x, Y: var y} when x < y => new(x+y, y), {X: var x, Y: var y} when x > y => new(x-y, y), {X: var x, Y: var y} => new(2*x, 2*y) }; Wynik dla Point(3, 1)?",a:["(2, 1)","(4, 1)","(6, 2)","(3, 1)"],e:"x=3 > y=1, więc new Point(x - y, y) = (2, 1)."},{id:"w01-65",q:"Ten sam Transform. Wynik dla Point(2, 2)?",a:["(4, 4)","(0, 2)","(2, 2)","(0, 0)"],e:"Ani x<y, ani x>y, ani (0,0), więc ostatnia gałąź: (2*x, 2*y) = (4, 4)."},{id:"w01-66",q:"Co jest wymagane w klasycznej instrukcji switch (case) w C#?",a:["break na końcu każdej sekcji case (brak fall-through)","Nic, case przechodzą do następnego jak w C","Każdy case musi być stałą liczbową","default jest obowiązkowy"],e:"W C# break jest wymagany, nie ma niejawnego fall-through. switch działa też dla łańcuchów."},{id:"w01-67",q:"Co zaleca się zamiast kodu unsafe ze wskaźnikami?",a:["Span<T>","dynamic","object[]","ArrayList"],e:"Zamiast unsafe zaleca się np. Span<T>, choć czasem unsafe bywa niezbędny."},{id:"w01-68",q:"Co mówią wytyczne o przeciążaniu operatorów („DO NOT be cute”)?",a:["Przeciążaj tylko, gdy wynik jest oczywisty (np. DateTime − DateTime = TimeSpan)","Przeciążaj zawsze dla czytelności","Przeciążanie operatorów jest w C# niedozwolone","Używaj << do zapisu do strumienia"],e:"Przeciążanie ma sens, gdy wynik jest oczywisty. Nie należy używać | do łączenia zapytań ani << do zapisu do strumienia."},{id:"w01-69",q:"Która biblioteka desktopowa jest dostępna oficjalnie dla Windows i macOS (wieloplatformowa)?",a:["MAUI","WPF","WinForms","WinUI3"],e:"WinForms, WPF i WinUI3 są tylko dla Windows. MAUI działa na Windows i macOS. Avalonia i Uno (firm trzecich) działają na Windows, Linuksie i macOS."},{id:"w01-70",q:"Które biblioteki UI (firm trzecich/społeczności) działają na Windows, Linuksie i macOS?",a:["Avalonia i Uno","WPF i WinForms","MAUI i WinUI3","Blazor i Razor"],e:"Avalonia i Uno działają na Windows, Linuksie i macOS. MAUI nie wspiera desktopowego Linuksa."},{id:"w01-71",q:"Gdzie można hostować aplikację ASP.NET Core?",a:["Samodzielnie (Kestrel) lub na IIS (tylko Windows)","Wyłącznie na IIS","Wyłącznie w Azure","Tylko w Dockerze"],e:"Aplikacje mogą być hostowane samodzielnie (Kestrel) lub na IIS (tylko Windows). Popularne jest Kestrel + reverse proxy."},{id:"w01-72",q:"Jak nazywa się „oficjalny” ORM platformy .NET?",a:["Entity Framework Core","Hibernate","Dapper","sqlite-net-pcl"],e:"Entity Framework Core to oficjalny ORM."},{id:"w01-73",q:"Co jest oficjalnym frameworkiem wieloplatformowych aplikacji mobilnych .NET?",a:["MAUI (następca Xamarin.Forms)","Xamarin.Forms","WPF","Blazor"],e:"MAUI obsługuje Android, iOS, Windows (WinUI3), macOS (Catalyst) i Tizen. Jest rozwojową wersją Xamarin.Forms."},{id:"w01-74",q:"Czego używa Unity do kompilacji C# do kodu natywnego (AOT)?",a:["IL2CPP","RyuJIT",".NET Native","Roslyn"],e:"Unity używa C# jako języka skryptowego i translatora IL2CPP (AOT)."},{id:"w01-75",q:"Które projekty implementują .NET na mikrokontrolerach ARM?",a:["Meadow i nanoFramework","MAUI i Uno","ML.NET i ONNX","Blazor i WebAssembly"],e:"IoT: Meadow i nanoFramework implementują .NET na mikrokontrolerach ARM."},{id:"w01-76",q:"W jakich plikach definiowane są projekty .NET?",a:[".csproj (XML)",".sln","package.json","pom.xml"],e:"Projekty to pliki .csproj (XML), a solucje (zbiory projektów) to pliki .sln."},{id:"w01-77",q:"Czym jest solucja (.sln)?",a:["Zbiorem projektów (np. główny, testy, wspólne biblioteki)","Pojedynczym projektem","Plikiem konfiguracji appsettings","Pakietem NuGet"],e:"Solucja to zbiór projektów zdefiniowany w pliku .sln."},{id:"w01-78",q:"Co umożliwia .NET 10 w kontekście pojedynczych plików .cs?",a:["„Uruchomienie” samotnego pliku .cs (projekt tworzony w pamięci)","Kompilację bez CLR","Pominięcie typów","Uruchomienie w przeglądarce bez WebAssembly"],e:"Od .NET 10 można uruchomić samotny plik .cs, a projekt tworzony jest w pamięci."},{id:"w01-79",q:'Kod: static int ToInt(this string s) => int.Parse(s); var x = "23".ToInt(); Jaka jest wartość x?',a:["23 (int)",'"23" (string)',"Błąd kompilacji – string nie ma metody ToInt","0"],e:"Metoda rozszerzająca (this string s) dodaje ToInt do stringa, więc x = 23."},{id:"w01-80",q:"Który język NIE jest implementacją na platformie .NET wymienioną na wykładzie?",a:["Kotlin/Native","F#","IronPython","C++/CLI"],e:"Wymienione: F#, Delphi.NET, COBOL.NET, C++/CLI, Perl.NET, IronPython, IKVM.NET. Języki .NET od początku miały współpracować (interoperacyjność)."}],up={id:rp,title:lp,questions:sp},cp="w02",dp="W2 · ASP.NET Core MVC i Razor",wp=[{id:"w02-01",q:"Która odmiana ASP.NET Core NIE generuje HTML, a skupia się na dostarczaniu API (JSON/XML)?",a:["WebAPI","MVC","Razor Pages","Blazor"],e:"WebAPI nie odpowiada za generowanie HTML. Ma postać MVC bez V oraz minimal APIs."},{id:"w02-02",q:"Czym jest Blazor?",a:["Podejściem z zawierającymi się w sobie komponentami, renderowanymi na serwerze lub kliencie","Silnikiem szablonów HTML","ORM-em","Odmianą WebForms"],e:"Blazor buduje aplikacje z komponentów, które mogą być renderowane na serwerze lub kliencie (WebAssembly)."},{id:"w02-03",q:"Który dawny produkt ASP.NET tworzył aplikacje w podejściu RAD, na wzór aplikacji desktopowych?",a:["WebForms","Razor Pages","Blazor","MVC"],e:"Dawniej istniały WebForms, w których aplikacje webowe tworzono w podejściu RAD."},{id:"w02-04",q:"Za co odpowiada kontroler w architekturze MVC?",a:["Odbiera żądania użytkownika i manipuluje modelem","Prezentuje dane użytkownikowi","Przechowuje dane","Generuje CSS"],e:"Model to dane, widok to prezentacja, kontroler manipuluje modelem i odbiera żądania."},{id:"w02-05",q:"Czym jest ViewModel?",a:["Klasą modelu danych przeznaczoną dla konkretnego widoku (połączenie/przetworzenie innych modeli)","Encją bazodanową","Kontrolerem widoku","Plikiem .cshtml"],e:"ViewModel to model dla konkretnego widoku, powstały przez połączenie lub przetworzenie innych modeli."},{id:"w02-06",q:"Czym jest DTO?",a:["Obiektem pośrednim do przenoszenia danych między warstwami (np. klient ↔ baza)","Rodzajem widoku częściowego","Kontrolerem API","Dyrektywą Razor"],e:"DTO (Data Transfer Object) to obiekt transferowy między warstwami, zwłaszcza między klientem a bazą danych."},{id:"w02-07",q:"Jaką zasadą kierowano się przy budowie ASP.NET Core MVC, przez co nazwy folderów mają znaczenie?",a:["Konwencja ponad konfiguracją (convention over configuration)","Konfiguracja ponad konwencją","YAGNI","DRY"],e:"Convention over configuration: struktura projektu jest stała, a nazwy folderów mają znaczenie."},{id:"w02-08",q:"Jak musi być zdefiniowany kontroler MVC, by framework go rozpoznał?",a:["Klasa dziedzicząca po Controller z przyrostkiem Controller lub z atrybutem [Controller]","Dowolna klasa w folderze Models","Klasa z atrybutem [Route] obowiązkowo","Klasa statyczna"],e:"Kontrolery dziedziczą po Microsoft.AspNetCore.Mvc.Controller i mają przyrostek Controller (np. HomeController) lub atrybut [Controller]."},{id:"w02-09",q:"Gdzie powinna znajdować się logika biznesowa wg wykładu?",a:["Uruchamiana w kontrolerach, ale nie znajdująca się w nich","Bezpośrednio w kontrolerach","W widokach Razor","W wwwroot"],e:"Logika biznesowa powinna być uruchamiana w kontrolerach, ale nie powinna się w nich znajdować."},{id:"w02-10",q:"Co oznacza POCO?",a:["Plain Old CLR Objects – proste klasy z samymi właściwościami","Partial Object Controller Output","Public Object Collection","Plain Old C# Operator"],e:"Modele to często POCO, czyli proste klasy zawierające tylko właściwości."},{id:"w02-11",q:"Który plik odpowiada za akcję Privacy kontrolera Home?",a:["Views/Home/Privacy.cshtml","Views/Privacy/Home.cshtml","Controllers/Home/Privacy.cshtml","Pages/Privacy.cshtml"],e:"Views/[Kontroler]/[Akcja].cshtml, czyli Views/Home/Privacy.cshtml."},{id:"w02-12",q:"Które pliki zawierają globalne ustawienia widoków?",a:["_ViewStart.cshtml i _ViewImports.cshtml","_Layout.cshtml i Error.cshtml","appsettings.json i launchSettings.json","Program.cs i Startup.cs"],e:"_ViewStart.cshtml i _ViewImports.cshtml zawierają globalne ustawienia widoków."},{id:"w02-13",q:"Co zawiera folder wwwroot/?",a:["Statyczne pliki: HTML, grafiki, JavaScript, CSS","Widoki .cshtml","Kontrolery","Migracje bazy"],e:"wwwroot/ zawiera pliki statyczne. Domyślny szablon używa Bootstrap 5 i jQuery."},{id:"w02-14",q:"Co zawiera folder Properties/?",a:["Ustawienia uruchamiania, m.in. profile uruchamiania (samodzielnie, IIS, IIS Express)","Właściwości modeli","Konfigurację bazy danych","Pliki statyczne"],e:"Properties/ zawiera ustawienia uruchamiania, np. profile (launchSettings)."},{id:"w02-15",q:"Do czego służy appsettings.json?",a:["Do konfiguracji aplikacji (może być kilka plików dla różnych środowisk)","Do definiowania routingu","Do przechowywania widoków","Do listy pakietów NuGet"],e:"appsettings.json to konfiguracja aplikacji. Może być ich kilka (np. dla środowisk), często obok secrets.json."},{id:"w02-16",q:"Co robi Program.cs w aplikacji ASP.NET Core?",a:["Jest punktem wejścia: dołącza biblioteki, mapuje routing i uruchamia aplikację","Zawiera tylko widoki","Definiuje modele","Przechowuje sekrety"],e:"Program.cs to punkt wejścia: kontroluje biblioteki (serwisy), mapuje routing i uruchamia aplikację."},{id:"w02-17",q:"Jakie polecenie konsoli uruchamia aplikację z hot reloadem?",a:["dotnet watch run","dotnet run --hot","dotnet reload","dotnet build --watch"],e:"W konsoli: dotnet watch run."},{id:"w02-18",q:"Które publiczne metody kontrolera NIE są akcjami?",a:["Te z atrybutem [NonAction]","Te zwracające void","Te z parametrami","Te z atrybutem [HttpPost]"],e:"Publiczne metody kontrolera to akcje, poza tymi oznaczonymi [NonAction]."},{id:"w02-19",q:"Jak parametry akcji są wiązane z danymi żądania HTTP?",a:["Przez model binding (z walidacją)","Ręcznie przez Request.Form zawsze","Przez ViewBag","Przez routing tylko dla stringów"],e:"Parametry akcji są wiązane z danymi żądania i walidowane mechanizmem model binding."},{id:"w02-20",q:"Co najczęściej zwracają akcje kontrolera?",a:["IActionResult lub Task<ActionResult>","string","void","HttpResponse"],e:"Akcje najczęściej zwracają IActionResult lub Task<ActionResult>, czyli rezultat (HTML, plik, obrazek itp.)."},{id:"w02-21",q:"Jaki widok zostanie użyty przez akcję Index() z kodem return View(); ?",a:["Widok o nazwie akcji, czyli Index.cshtml","_Layout.cshtml","Default.cshtml","Żaden – wyjątek"],e:"Jeżeli ścieżka nie zostanie podana, uruchomiony zostanie widok o nazwie akcji."},{id:"w02-22",q:'W HomeController: public IActionResult Index2() { return View("Index"); } Który widok zobaczy użytkownik pod /Home/Index2?',a:["Views/Home/Index.cshtml","Views/Home/Index2.cshtml","Views/Shared/Index2.cshtml","Błąd – brak widoku Index2"],e:'Jawnie podana nazwa widoku ("Index") nadpisuje domyślną nazwę wynikającą z akcji.'},{id:"w02-23",q:'Kod: return View("FloatModel", 3.1415f); a widok: @model float  @Model.ToString("F2"). Co zostanie wyrenderowane (kultura en-US)?',a:["3.14","3.1415","FloatModel","3"],e:"Widok silnie typowany float formatuje do 2 miejsc po przecinku (F2). W kulturze pl-PL byłoby 3,14."},{id:"w02-24",q:"Jaki jest domyślny silnik szablonów ASP.NET Core?",a:["Razor","Thymeleaf","Handlebars","Blade"],e:"Domyślnym silnikiem jest Razor, oparty o znak @ i tag helpers."},{id:"w02-25",q:"W jakich plikach zapisywane są widoki ASP.NET Core MVC?",a:[".cshtml",".razor",".aspx",".html"],e:"Widoki MVC to pliki .cshtml grupowane w folderach kontrolerów. .razor to komponenty Blazor, .aspx to WebForms."},{id:"w02-26",q:"Jaka funkcja w layoucie wstawia zawartość konkretnego widoku?",a:["RenderBody()","RenderView()","RenderPartial()","@body"],e:"Widoki są umieszczane w globalnym szablonie jako wynik działania RenderBody()."},{id:"w02-27",q:"Gdzie domyślnie zdefiniowany jest główny layout aplikacji MVC?",a:["Views/Shared/_Layout.cshtml","Views/Home/_Layout.cshtml","wwwroot/_Layout.html","Pages/_Layout.cshtml"],e:'Główny układ to plik _Layout.cshtml w Views/Shared, ustawiany w _ViewStart.cshtml (Layout = "_Layout").'},{id:"w02-28",q:"Dlaczego <p>@GenericMethod<int>()</p> nie zadziała w domyślnej składni Razor?",a:["Znaki < i > są traktowane jak HTML – trzeba użyć @(GenericMethod<int>())","Razor nie obsługuje metod generycznych w ogóle","Brakuje średnika","Trzeba użyć @Html.Raw"],e:"W składni implicit nie można bezpośrednio używać typów generycznych. Trzeba użyć nawiasów: @(…)."},{id:"w02-29",q:"Czego nie mogą zawierać wyrażenia w domyślnej (implicit) składni Razor @…?",a:["Spacji (poza await)","Kropek","Wywołań metod","Liczb"],e:"Wyrażenia implicit nie mogą zawierać spacji (poza await). Do złożonych wyrażeń używa się @( … )."},{id:"w02-30",q:'Co wygeneruje @("<span>Hello World</span>") w Razor?',a:["&lt;span&gt;Hello World&lt;/span&gt; (tekst zakodowany)","Element <span> z tekstem Hello World","Pusty ciąg","Błąd kompilacji"],e:"Łańcuchy są automatycznie kodowane HTML (ochrona przed XSS)."},{id:"w02-31",q:"Jak wyświetlić łańcuch HTML bez kodowania w Razor i jakie jest ryzyko?",a:["@Html.Raw(...) – niebezpieczne dla danych od użytkownika (XSS)","@Html.Encode(...) – brak ryzyka","@(...) – brak ryzyka","@Html.Display(...) – spowalnia renderowanie"],e:"@Html.Raw() zapobiega kodowaniu, ale jest niebezpieczne dla danych pochodzących od użytkownika."},{id:"w02-32",q:"Co dzieje się z treścią w bloku @{ … } w Razor?",a:["Nie jest renderowana – służy do kodu (zmienne, ustawienia, np. layout)","Jest renderowana jako tekst","Jest wykonywana po stronie klienta","Jest ignorowana przy kompilacji"],e:"Treść w @{…} nie jest renderowana. Służy do tworzenia zmiennych, ustawień widoku czy lokalnych funkcji."},{id:"w02-33",q:'Kod: @{ var quote = "A"; } <p>@quote</p> @{ quote = "B"; } <p>@quote</p>. Co zobaczy użytkownik?',a:["<p>A</p><p>B</p>","<p>B</p><p>B</p>","<p>A</p><p>A</p>","Błąd – podwójna deklaracja"],e:"Kod wykonuje się sekwencyjnie: pierwszy akapit wyświetla A, potem zmienna jest zmieniana na B."},{id:"w02-34",q:"Do czego służy dyrektywa @using w widoku Razor?",a:["Do włączania przestrzeni nazw","Do wstrzykiwania zależności","Do określenia typu modelu","Do dziedziczenia widoku"],e:"@using włącza przestrzenie nazw. Inne dyrektywy: @attribute, @implements, @inherits, @model, @inject."},{id:"w02-35",q:"Do czego służy dyrektywa @inject?",a:["Do wstrzyknięcia zależności do widoku","Do określenia typu modelu","Do wstawienia widoku częściowego","Do importu przestrzeni nazw"],e:"@inject wstrzykuje zależność do widoku. Typ modelu określa @model."},{id:"w02-36",q:"Czym są tag helpers?",a:["Dodatkowymi atrybutami znaczników HTML sterującymi renderowaniem (np. asp-action)","Funkcjami JavaScript","Komponentami Blazor","Pakietami NuGet"],e:"Tag helpers dodają atrybuty do znaczników HTML (np. asp-controller, asp-action), więc front-endowcy nie muszą znać Razor."},{id:"w02-37",q:'Co robi <a asp-action="About">Kliknij</a>?',a:["Generuje odnośnik do akcji About zgodnie z regułami routingu","Wywołuje akcję About przez AJAX","Renderuje widok About wewnątrz linku","Nic – to zwykły atrybut"],e:"Tag helpers automatycznie generują odnośniki do akcji i kontrolerów zgodnie z routingiem."},{id:"w02-38",q:"Czym różni się ViewData od ViewBag?",a:["ViewData to słownik (object, wymaga rzutowania), ViewBag to struktura dynamiczna z notacją kropkową","ViewBag wymaga rzutowania, ViewData nie","ViewData działa tylko z @model","Nie różnią się"],e:"ViewData to słownik z wartościami typu object (wymaga rzutowania), ViewBag jest dynamiczny (ViewBag.Klucz) i nie wymaga rzutowania."},{id:"w02-39",q:"Kod akcji: ViewBag.Klucz2 = 3; w widoku: @(ViewBag.Klucz2 * 2). Co zostanie wyświetlone?",a:["6","32","Błąd – wymagane rzutowanie","Klucz2*2"],e:"ViewBag jest dynamiczny i nie wymaga rzutowania, więc 3 * 2 = 6."},{id:"w02-40",q:'W widoku: @((ViewData["Test"] as int?) > 1), a w akcji ViewData["Test"] = 2. Co się wyświetli?',a:["True","2","False","Błąd kompilacji"],e:"ViewData przechowuje object, więc trzeba rzutować (as int?). 2 > 1 daje True."},{id:"w02-41",q:"Co robi dyrektywa @model?",a:["Określa typ danych przekazywanych do widoku (silne typowanie, zmienna Model)","Tworzy nowy model w bazie","Wstrzykuje serwis","Importuje przestrzeń nazw"],e:"@model specyfikuje typ. W widoku dostępna jest zmienna Model tego typu z kontrolą podczas kompilacji."},{id:"w02-42",q:"Jak nazywa się zmienna w widoku przechowująca przekazany model?",a:["Model (wielka litera)","model","@model","ViewModel"],e:"@model (dyrektywa, mała litera) określa typ, a Model (wielka litera) to zmienna z danymi."},{id:"w02-43",q:"Czego wymaga scaffolding widoków?",a:["Visual Studio lub narzędzia dotnet-aspnetcodegenerator","Node.js","Entity Framework","Dockera"],e:"Do scaffoldingu potrzebne jest Visual Studio lub dotnet-aspnetcodegenerator."},{id:"w02-44",q:"Która wbudowana metoda kontrolera zwraca status HTTP 404?",a:["NotFound()","BadRequest()","Ok()","Redirect()"],e:"BadRequest() zwraca 400, Ok() 200, NotFound() 404. Redirect() i RedirectToAction() przekierowują."},{id:"w02-45",q:'Kod: public IActionResult TestId(int? id) { if (id == null) return BadRequest("Nie podano id"); return Ok(new { id }); }. Co zwróci GET /Actions/TestId/3?',a:['200 z JSON {"id":3}',"400 Nie podano id","404","Widok TestId.cshtml"],e:"Domyślny routing wiąże 3 z {id?}, więc Ok(new { id }) zwraca 200 z JSON."},{id:"w02-46",q:"Ten sam TestId(int? id). Co zwróci GET /Actions/TestId (bez id)?",a:["400 Bad Request „Nie podano id”",'200 z {"id":null}',"404 Not Found","500"],e:"id jest opcjonalne ({id?}), więc trafia null i akcja zwraca BadRequest."},{id:"w02-47",q:"Dlaczego w RedirectToAction(nameof(Index)) użyto nameof?",a:["Aby podać nazwę akcji nie jako „magiczny” string (bezpieczne przy refaktoryzacji)","Bo RedirectToAction wymaga typu Type","Bo nameof przyspiesza przekierowanie","Bo inaczej powstanie pętla"],e:'nameof(Index) daje "Index" sprawdzane przez kompilator, a nie wpisany ręcznie string.'},{id:"w02-48",q:"Do czego mapuje domyślny szablon routingu {controller=Home}/{action=Index}/{id?} adres /Products/Details/5?",a:["Akcja Details kontrolera Products z id = 5","Akcja Products kontrolera Details","Akcja Index kontrolera Home z id = 5","404"],e:"/Products/Details/5 to ProductsController.Details(int id) z id = 5. Domyślnie Home/Index."},{id:"w02-49",q:"Jaka akcja zostanie uruchomiona dla adresu / przy domyślnym routingu?",a:["HomeController.Index","DefaultController.Index","HomeController.Default","Żadna – 404"],e:"Domyślnym kontrolerem jest Home, a akcją Index."},{id:"w02-50",q:"Przy kilku wywołaniach MapControllerRoute – która reguła ma pierwszeństwo?",a:["Wcześniej zdefiniowana","Później zdefiniowana","Najbardziej szczegółowa niezależnie od kolejności","Losowa"],e:"Kolejność ma znaczenie, bo wcześniejsza reguła jest ważniejsza."},{id:"w02-51",q:'Reguła: pattern: "blog/{*article}", defaults: controller=Blog, action=Article. Które adresy do niej pasują?',a:["/Blog, /Blog/Article oraz /Blog/Article/dowolny-string","Tylko /Blog/Article","Tylko /Blog","Tylko /Blog/{id} z liczbą"],e:"{*article} to parametr catch-all, który przechwytuje dowolną (także pustą) resztę ścieżki."},{id:"w02-52",q:'Reguła z Program.cs: pattern "product/{id}-{name}" → ShowReviewForProduct2(int id, string name). Co trafi do parametrów dla /product/7-laptop?',a:['id = 7, name = "laptop"','id = "7-laptop", name = null','name = "7-laptop"',"404"],e:"Segment z separatorem '-' rozdziela się na {id} i {name}. Nazwy parametrów akcji muszą odpowiadać nazwom w szablonie."},{id:"w02-53",q:'W przykładzie z reguła "review/{*name}" akcja ma sygnaturę ShowReviewForProduct(string name). Co jest warunkiem poprawnego dopasowania?',a:["Parametr akcji musi nazywać się name, tak jak w szablonie","Parametr musi być typu int","Akcja musi mieć [HttpPost]","Kontroler musi nazywać się ReviewController"],e:"Komentarz w kodzie: zmienna musi nazywać się name, aby routing zadziałał."},{id:"w02-54",q:"Co nadpisuje routing oparty o konwencję?",a:["Routing oparty o atrybut (np. [Route])","Plik _ViewStart","appsettings.json","Nic – konwencja ma zawsze pierwszeństwo"],e:"Akcje mogą być mapowane konwencją lub atrybutem. Użycie atrybutu nadpisuje konwencję."},{id:"w02-55",q:"Co się stanie, gdy dwie akcje pasują do tej samej ścieżki (bez rozróżnienia czasownika HTTP)?",a:["Routing zwróci wyjątek (niejednoznaczność)","Wykona się pierwsza","Wykonają się obie","Wykona się losowa"],e:"Jeżeli dwie akcje pasują do ścieżki, routing zwraca wyjątek. Rozwiązaniem jest np. [HttpPost] na jednej z nich."},{id:"w02-56",q:"Typowy wzorzec: GET /Products/Edit/5 pokazuje formularz, a POST go zatwierdza. Jak rozróżnić akcje?",a:["Oznaczyć akcję zatwierdzającą atrybutem [HttpPost]","Nadać im różne nazwy plików widoku","Użyć [NonAction]","Dodać drugi kontroler"],e:"Atrybut [HttpPost] określa typ żądania jako POST."},{id:"w02-57",q:"Skąd domyślnie model binding pobiera dane?",a:["Z pól formularza, ciała żądania, danych routingu, query string i plików","Tylko z query string","Tylko z ciała JSON","Z ciasteczek i sesji"],e:"Domyślnie: pola formularza, body, dane routingu, query string i pliki."},{id:"w02-58",q:"Do jakich typów używane są dane z routingu i query string przy model bindingu?",a:["Tylko do prostych typów, np. int czy bool","Do złożonych obiektów","Tylko do stringów","Do plików"],e:"Dane z routingu i query string są używane tylko do prostych typów."},{id:"w02-59",q:"Który atrybut wymusza pobranie parametru z query string?",a:["[FromQuery]","[FromRoute]","[FromBody]","[FromForm]"],e:"Atrybuty: [FromQuery], [FromRoute], [FromForm], [FromBody], [FromHeader]. Można je dodać do parametru akcji lub właściwości modelu."},{id:"w02-60",q:'Kod: public IActionResult TestQuery([FromQuery] string? q) => Ok($"Query to było: {q}"); Co zwróci GET /Actions/TestQuery?q=abc?',a:["Query to było: abc","Query to było: ","Query to było: q=abc","400 Bad Request"],e:'[FromQuery] wiąże parametr q z query string, więc q = "abc".'},{id:"w02-61",q:"Do czego służą widoki częściowe (partial views)?",a:["Do reużywalnych fragmentów widoku, unikając duplikacji","Do całych układów strony","Do skomplikowanej logiki biznesowej z dostępem do bazy","Do API"],e:"Partial views to reużywalne fragmenty. Do układów służą layouts, a do logiki z kodem serwerowym view components."},{id:"w02-62",q:"Którą metodę zaleca się do renderowania widoku częściowego?",a:['@await Html.PartialAsync("profil") lub <partial name="profil" />','@Html.Partial("profil")','@RenderBody("profil")','@Html.Raw("profil")'],e:"Dobra praktyka to PartialAsync() zamiast Partial(), bo jest wywoływana asynchronicznie. Alternatywą jest tag helper <partial>."},{id:"w02-63",q:"Co otrzymuje widok częściowy?",a:["Kopię słownika ViewData i opcjonalnie obiekt modelu","Oryginalny ViewData (współdzielony)","Tylko model, bez ViewData","Nic"],e:'Widoki częściowe dostają kopię ViewData oraz opcjonalnie model: <partial name="profil" model="…" />.'},{id:"w02-64",q:"Czym różnią się view components od partial views?",a:["Nadają się do treści wymagającej dodatkowego kodu serwerowego, mogą np. komunikować się z bazą","Nie mogą mieć modelu i są tylko statyczne","Są szybsze, bo renderowane po stronie klienta","Służą do layoutu strony"],e:"View components są podobne do partiali, ale służą do treści wymagającej dodatkowego kodu na serwerze. Nie muszą opierać się o model."},{id:"w02-65",q:"Jak zachowuje się [Required] dla typów wartościowych (np. decimal, DateTime)?",a:["Typy wartościowe są zawsze wymagane","Atrybut jest ignorowany","Wymaga wartości różnej od 0","Powoduje błąd kompilacji"],e:"Slajd: [Required] wymusza dane, a typy wartościowe są zawsze wymagane (nie mogą być null)."},{id:"w02-66",q:"Do czego służą atrybuty [DataType] (np. DataType.Currency)?",a:["Do odpowiedniego wyświetlania danych (np. waluta, data)","Do zmiany typu w bazie","Do walidacji wyrażeniem regularnym","Do szyfrowania"],e:"[DataType] obsługuje odpowiednie wyświetlanie, np. z DisplayFor."},{id:"w02-67",q:"Który atrybut ogranicza długość łańcucha do 3–60 znaków?",a:["[StringLength(60, MinimumLength = 3)]","[Range(3, 60)]","[MaxLength(3, 60)]","[Length(60)]"],e:"StringLength(60, MinimumLength = 3). [Range] dotyczy wartości liczbowych."},{id:"w02-68",q:"Na czym opiera się walidacja po stronie klienta generowana przez scaffolding?",a:["Na atrybutach HTML5 data-* i jQuery Validation","Na Blazor WebAssembly","Na React","Tylko na walidacji serwerowej"],e:"Generowany HTML ma atrybuty data-val-*, które wykorzystuje jQuery Validation. Trzeba uruchomić partial ze skryptami (_ValidationScriptsPartial)."},{id:"w02-69",q:"Jaki parametr przyjmuje @Html.DisplayFor?",a:["Wyrażenie (lambda) wybierające element modelu, np. m => Model.Person.Salary","Nazwę pola jako string","Obiekt ViewData","Nazwę widoku"],e:"Parametrem DisplayFor jest wyrażenie wybierające element modelu. Wyświetla go zgodnie z [DataType]."},{id:"w02-70",q:'W modelu: [UIHint("_Stars")] public int Rating, a DisplayTemplates/_Stars.cshtml: @model int  @for (int i = 0; i < Model; i++) { @Html.Raw("🦀") }. Co pokaże DisplayFor dla Rating = 3?',a:["🦀🦀🦀","3","_Stars","Rating: 3"],e:"UIHint wskazuje DisplayTemplate _Stars, który rysuje Model razy 🦀."},{id:"w02-71",q:"Czym są DisplayTemplate i EditorTemplate?",a:["Widokami częściowymi używanymi do renderowania konkretnego elementu modelu","Szablonami layoutu","Szablonami projektów w VS","Klasami walidacji"],e:"DisplayTemplate i EditorTemplate definiują partial do renderowania konkretnego elementu modelu."},{id:"w02-72",q:"Dlaczego nie powinno się przekazywać encji bazodanowych bezpośrednio do widoku?",a:["Model widoku rzadko odpowiada encji, część danych się pomija lub agreguje","Bo Razor nie obsługuje encji","Bo encje nie mają właściwości","Bo spowalnia to bazę danych"],e:"Często pomija się dane lub je agreguje. Model widoku rzadko odpowiada encji, dlatego używa się ViewModeli i DTO."},{id:"w02-73",q:"Czemu obiekty otrzymywane od klienta metodą POST (np. DTO) nie powinny zawierać identyfikatora, któremu się ufa?",a:["Klient może go podmienić – nie należy ufać danym od klienta","Bo POST nie przenosi liczb","Bo identyfikator jest zawsze 0","Bo EF nie pozwala na id"],e:"Obiekty od klienta raczej nie powinny zawierać identyfikatora, a przynajmniej nie należy mu ufać."},{id:"w02-74",q:"W jakiej architekturze ViewModel jest kluczowym elementem i gdzie jest popularna?",a:["MVVM – popularna w aplikacjach mobilnych","MVC – w grach","MVP – w bazach danych","REST – w API"],e:"MVVM (Model, Widok, ViewModel) jest popularna w aplikacjach mobilnych."},{id:"w02-75",q:"Jakie narzędzia automatyzują mapowanie DTO ↔ encje wg wykładu?",a:["AutoMapper, Mapperly","Entity Framework, Dapper","NuGet, MSBuild","Swagger, OpenAPI"],e:"Ręczne mapowanie jest żmudne, dlatego istnieją narzędzia, np. AutoMapper i Mapperly."},{id:"w02-76",q:"Co sprawdza ModelState.IsValid w akcji POST?",a:["Czy dane przekazane przez model binding spełniają reguły walidacji","Czy użytkownik jest zalogowany","Czy baza danych jest dostępna","Czy widok istnieje"],e:"ModelState.IsValid mówi, czy model po bindingu przeszedł walidację (np. atrybuty data annotations)."},{id:"w02-77",q:"Kod: [HttpPost] public IActionResult AddReview([FromForm] UserReview userReview). Skąd pochodzą dane userReview?",a:["Z pól formularza HTML (POST)","Z query string","Z nagłówków","Z ciała JSON"],e:"[FromForm] wiąże dane z pól formularza."},{id:"w02-78",q:'Co robi app.MapControllerRoute(name: "default", pattern: "{controller=Home}/{action=Index}/{id?}")?',a:["Definiuje routing oparty o konwencję z wartościami domyślnymi i opcjonalnym id","Definiuje routing atrybutowy","Rejestruje kontrolery w DI","Włącza pliki statyczne"],e:"MapControllerRoute definiuje ścieżki konwencyjne. Rejestrację serwisów MVC robi builder.Services.AddControllersWithViews()."},{id:"w02-79",q:"Która linia w Program.cs rejestruje usługi MVC (kontrolery z widokami)?",a:["builder.Services.AddControllersWithViews();","app.UseRouting();","app.MapControllerRoute(...);","app.UseStaticFiles();"],e:"AddControllersWithViews() rejestruje serwisy MVC. UseStaticFiles obsługuje wwwroot, a MapControllerRoute definiuje routing."},{id:"w02-80",q:'W szablonie MVC: if (!app.Environment.IsDevelopment()) { app.UseExceptionHandler("/Home/Error"); app.UseHsts(); }. Kiedy użytkownik zobaczy stronę /Home/Error po wyjątku?',a:["Gdy aplikacja nie działa w środowisku Development (np. Production)","Zawsze","Tylko w Development","Nigdy – to tylko log"],e:"Handler wyjątków i HSTS są włączane poza środowiskiem Development. W Development widać stronę wyjątku dewelopera."}],yp={id:cp,title:dp,questions:wp},pp="w03",zp="W3 · Razor Pages, DI i Entity Framework Core",mp=[{id:"w03-01",q:"Na jakiej koncepcji opiera się Razor Pages?",a:["Na „stronach” zamiast kontrolerów i widoków","Na komponentach renderowanych w WebAssembly","Na kontrolerach bez widoków","Na mikroserwisach"],e:"Razor Pages tworzy aplikacje w oparciu o koncepcję stron zamiast kontrolerów i widoków."},{id:"w03-02",q:"Gdzie Razor Pages jest (częściowo) domyślnym podejściem zamiast MVC wg wykładu?",a:["W mechanizmie Identity oraz w dokumentacji","W WebAPI","W Blazor","W Minimal APIs"],e:"Razor Pages jest częściowo domyślnym podejściem, np. w Identity i w dokumentacji."},{id:"w03-03",q:"Z jakich plików składa się pojedyncza strona Razor Pages?",a:[".cshtml (widok) i .cshtml.cs (code-behind)",".razor i .razor.cs",".cshtml i Controller.cs",".html i .js"],e:"Każda strona to .cshtml (widok) i .cshtml.cs (logika, code-behind)."},{id:"w03-04",q:"Do jakiej technologii wykład porównuje mechanizm code-behind Razor Pages?",a:["Web Forms","Blazor","WebAPI","WPF"],e:"Mechanizm zbliżony do aplikacji Web Forms."},{id:"w03-05",q:"Jaka dyrektywa musi być na początku pliku strony Razor Pages?",a:["@page","@model","@inject","@layout"],e:"Stosowana jest dyrektywa @page. Strona podlega modelowi z pliku code-behind (@model IndexModel)."},{id:"w03-06",q:"Czym jest code-behind (PageModel) wg wykładu?",a:["Skrzyżowaniem ViewModelu z kontrolerem","Czystym widokiem","Encją bazodanową","Klasą konfiguracji"],e:"Code-behind zawiera dane wyświetlane na stronie oraz metody reagujące na żądania, czyli jest skrzyżowaniem ViewModelu z kontrolerem."},{id:"w03-07",q:"Jaki przyrostek mają zwyczajowo klasy code-behind w Razor Pages?",a:["Model (np. IndexModel)","Controller","Page","ViewModel"],e:"Konwencja: przyrostek „Model”, np. IndexModel : PageModel."},{id:"w03-08",q:"Która metoda PageModel uruchamia się w odpowiedzi na żądanie POST?",a:["OnPost() / OnPostAsync()","Post()","HandlePost()","OnSubmit()"],e:"OnGet() i OnPost() (lub wersje Async) uruchamiają się w odpowiedzi na GET i POST."},{id:"w03-09",q:"Co mogą zwracać metody OnGet()/OnPost()?",a:["void lub IActionResult (np. dla przekierowań)","Tylko void","Tylko string","Tylko View()"],e:"Zwracają void lub IActionResult, który pozwala np. na przekierowania. Domyślnie pokazują stronę widoku."},{id:"w03-10",q:"Gdzie znajduje się pełny layout aplikacji Razor Pages?",a:["Pages/Shared/_Layout.cshtml","Views/Shared/_Layout.cshtml","wwwroot/_Layout.cshtml","Pages/_Layout.cs"],e:"W Razor Pages layout jest w Pages/Shared/_Layout.cshtml, a w MVC w Views/Shared/."},{id:"w03-11",q:"Jak strona .cshtml odwołuje się do publicznych właściwości code-behind?",a:["Przez obiekt Model (np. Model.People)","Przez ViewBag","Przez this.Page","Przez @inject"],e:"Typowa konwencja to publiczne właściwości w PageModel, do których strona odwołuje się przez Model."},{id:"w03-12",q:'Strona ma @page "{id:int}" i OnGet(int id = 0). Co oznacza {id:int}?',a:["Segment routingu id z ograniczeniem do liczby całkowitej","Query string ?id=","Pole formularza","Nagłówek HTTP"],e:"Dyrektywą @page można sterować routingiem i definiować zmienne trafiające do OnGet(). :int to ograniczenie typu."},{id:"w03-13",q:"Kod Index2: OnGet(int id = 0) { Current = People.FirstOrDefault(x => x.Id == id); }. Co jest w Current, gdy nie ma osoby o danym id?",a:["null","Pierwsza osoba z listy","Wyjątek InvalidOperationException","Nowy obiekt Person"],e:"FirstOrDefault zwraca wartość domyślną (null dla klas), gdy brak dopasowania. First() rzuciłby wyjątek."},{id:"w03-14",q:"Jak wygenerować w Razor Pages link do strony Index z parametrem id=2?",a:['<a asp-page="Index" asp-route-id="2">','<a asp-action="Index" id="2">','<a href="@Index(2)">','<a asp-controller="Index" asp-id="2">'],e:"Tag helpers: asp-page oraz asp-route-{parametr}."},{id:"w03-15",q:"Do czego służy [BindProperty] na właściwości PageModel?",a:["Wiąże dane przychodzące (GET/POST) z właściwością","Udostępnia właściwość w API","Mapuje właściwość na kolumnę bazy","Wstrzykuje zależność"],e:"[BindProperty] łączy dane z żądania z właściwością modelu strony."},{id:"w03-16",q:"Dlaczego dla GET trzeba jawnie ustawić [BindProperty(SupportsGet = true)]?",a:["Ze względów bezpieczeństwa – domyślnie wiązanie dotyczy tylko POST","Bo GET nie obsługuje query string","Dla wydajności","Bo inaczej właściwość jest tylko do odczytu"],e:"Dla GET należy jawnie ustawić SupportsGet = true ze względów bezpieczeństwa."},{id:"w03-17",q:"Czy wielkość liter w nazwie parametru query string ma znaczenie przy wiązaniu [BindProperty]?",a:["Nie","Tak","Tylko dla GET","Tylko dla POST"],e:"Slajd: dane mogą być przekazane w query string, a wielkość znaków nie ma znaczenia."},{id:"w03-18",q:'Typowy OnPostAsync: if (!ModelState.IsValid) return Page(); … await _context.SaveChangesAsync(); return RedirectToPage("./Index"); Co dzieje się przy niepoprawnych danych?',a:["Strona jest wyświetlana ponownie (z błędami walidacji)","Dane są zapisywane do bazy","Następuje przekierowanie na Index","Rzucany jest wyjątek"],e:"Page() ponownie renderuje bieżącą stronę. Przy poprawnych danych następuje zapis i przekierowanie (wzorzec PRG)."},{id:"w03-19",q:"Czym jest wstrzykiwanie zależności (DI)?",a:["Wzorcem, w którym klasy dostają zależności „z zewnątrz” zamiast tworzyć je same (IoC)","Mechanizmem dziedziczenia","Sposobem wstrzykiwania SQL","Kompilacją JIT"],e:"DI pozwala osiągnąć IoC (inversion of control): klasy nie tworzą same zależności, tylko je dostają."},{id:"w03-20",q:"Gdzie rejestruje się typy dla mechanizmu DI w ASP.NET Core?",a:["W Program.cs (builder.Services)","W appsettings.json","W _ViewImports.cshtml","W pliku .csproj"],e:"Typy rejestruje się w Program.cs, a potem w konstruktorze podaje się typ do wstrzyknięcia."},{id:"w03-21",q:"Gdzie najczęściej deklaruje się zależność do wstrzyknięcia w kontrolerze lub PageModel?",a:["W konstruktorze","W metodzie OnGet jako zmienną lokalną z new","W atrybucie klasy","W pliku .cshtml.cs jako statyczne pole"],e:"W konstruktorze kontrolera, modelu strony lub usługi podaje się typ, który ma zostać wstrzyknięty."},{id:"w03-22",q:"Czym charakteryzują się obiekty zarejestrowane jako Transient?",a:["Są tworzone od nowa przy każdym wstrzyknięciu","Są wspólne dla jednego żądania HTTP","Są tworzone raz na cały cykl życia aplikacji","Są tworzone raz na sesję użytkownika"],e:"Transient tworzy nowy obiekt przy każdym wstrzyknięciu, Scoped jeden na żądanie HTTP, Singleton jeden na aplikację."},{id:"w03-23",q:"Czym charakteryzują się obiekty zarejestrowane jako Scoped?",a:["Są takie same w obrębie pojedynczego żądania HTTP","Są zawsze różne","Są tworzone raz na aplikację","Są tworzone raz na wątek"],e:"Scoped to te same obiekty dla pojedynczego żądania HTTP."},{id:"w03-24",q:"Czym charakteryzują się obiekty zarejestrowane jako Singleton?",a:["Są tworzone tylko raz podczas całego cyklu życia aplikacji","Są tworzone na każde żądanie","Są tworzone przy każdym wstrzyknięciu","Są tworzone raz na użytkownika"],e:"Singleton tworzony jest tylko raz w cyklu życia aplikacji."},{id:"w03-25",q:"Strona DiModel ma konstruktor DiModel(IHelper h). Rejestracja: builder.Services.AddTransient<IHelper, Helper>(). Co dostanie konstruktor?",a:["Nowy obiekt klasy Helper jako implementację IHelper","null","Wyjątek – brak rejestracji IHelper","Obiekt IHelper bez implementacji"],e:"AddTransient<IHelper, Helper> rejestruje Helper jako implementację interfejsu. Obiekty oczekujące IHelper dostają Helper."},{id:"w03-26",q:"Konstruktor oczekuje interfejsu IHelper, a zarejestrowano tylko builder.Services.AddTransient<Helper>(). Co się stanie?",a:["Błąd – nie da się rozwiązać IHelper (trzeba jawnie zarejestrować interfejs)","DI automatycznie dopasuje Helper do IHelper","Wstrzyknięty zostanie null","Zadziała, bo Transient to obsługuje"],e:"Wstrzykiwanie klasy przy oczekiwanym interfejsie trzeba jawnie zaznaczyć: AddTransient<IHelper, Helper>()."},{id:"w03-27",q:'Co oznacza rejestracja builder.Services.AddSingleton<IHelper, Helper>(_ => new Helper("test"))?',a:["Przekazanie DI metody fabrykującej, która tworzy obiekt (raz, jako singleton)","Utworzenie nowego Helper przy każdym żądaniu","Rejestrację dwóch serwisów","Błąd – singletony nie przyjmują lambd"],e:"Do DI można przekazać metodę fabrykującą (albo obiekt utworzony przez new). Singleton wywoła ją raz."},{id:"w03-28",q:"Czy ILogger<T> trzeba jawnie rejestrować w Program.cs, aby był wstrzykiwany?",a:["Nie – konfiguracja jest niejawna","Tak, przez AddLogger<T>()","Tak, przez AddSingleton<ILogger>()","Nie można go wstrzykiwać"],e:"ILogger jest wstrzykiwany przez DI, a jego konfiguracja w Program.cs jest niejawna."},{id:"w03-29",q:"Jak wygląda wstrzyknięcie loggera z użyciem primary constructor (C# 12)?",a:["public class DiPrimaryModel(ILogger<DiPrimaryModel> logger) : PageModel { … logger.LogInformation(…) }","public class DiPrimaryModel : PageModel(ILogger logger)","[Inject] ILogger logger;","public DiPrimaryModel() => logger = new Logger();"],e:"Primary constructor: parametr w nagłówku klasy jest dostępny w całej klasie, bez jawnego pola."},{id:"w03-30",q:"Czym jest builder.Services.AddRazorPages()?",a:["Metodą rozszerzającą rejestrującą biblioteki Razor Pages","Wbudowaną metodą klasy WebApplication","Middleware obsługującym routing","Metodą generującą strony"],e:"Builder może posiadać metody rozszerzające (np. AddRazorPages()) dodawane przez zaimportowane biblioteki."},{id:"w03-31",q:"Która linia mapuje strony Razor Pages w potoku aplikacji?",a:["app.MapRazorPages();","builder.Services.AddRazorPages();","app.UseRouting();","app.MapControllerRoute(...);"],e:"AddRazorPages() rejestruje serwisy (DI), a app.MapRazorPages() mapuje endpointy stron."},{id:"w03-32",q:"Co oznacza skrót ORM?",a:["Object-Relational Mapping – mapowanie encji/relacji bazy na obiekty","Object Resource Manager","Online Relational Model","Ordered Record Mapping"],e:"ORM mapuje encje i relacje bazodanowe na obiekty języka obiektowego."},{id:"w03-33",q:"Który ORM to „oficjalna” (1st party) biblioteka .NET?",a:["Entity Framework Core","nHibernate","Dapper","LiteDB"],e:"EF Core jest oficjalny. nHibernate i Dapper to alternatywy."},{id:"w03-34",q:"Który SZBD jest oficjalnie obsługiwany przez EF Core (bez providera firm trzecich)?",a:["SQLite","PostgreSQL","MySQL","Oracle"],e:"Oficjalnie: SQL Server (i LocalDB), SQLite, InMemory, Azure Cosmos DB. PostgreSQL, MySQL i Oracle wymagają providerów firm trzecich."},{id:"w03-35",q:"Czym jest provider InMemory w EF Core?",a:["Ograniczoną bazą testową działającą tylko w pamięci operacyjnej","Produkcyjną bazą cache","Bazą Redis","Wbudowanym SQL Serverem"],e:"InMemory to ograniczona baza testowa działająca tylko w pamięci."},{id:"w03-36",q:"Co zawiera connection string?",a:["Nazwę bazy, użytkownika, hasło i ustawienia połączenia","Kod SQL do wykonania","Listę tabel","Ścieżkę do pliku .csproj"],e:"Connection string zawiera nazwę bazy, użytkownika, hasło i ustawienia, np. Data Source=movies.db."},{id:"w03-37",q:"Gdzie NIE należy przechowywać connection stringa z hasłem wg wykładu?",a:["W kodzie źródłowym ani w appsettings.json (trafiają do kontroli wersji)","W user secrets","W zmiennych środowiskowych","W Azure Key Vault"],e:"Nie w źródłach ani w appsettings.json (mogą być w VCS). Należy użyć mechanizmu sekretów, zmiennych środowiskowych lub Key Vault."},{id:"w03-38",q:"Gdzie przechowywany jest plik sekretów (user secrets)?",a:["W katalogu domowym użytkownika (~/.microsoft lub %APPDATA%)","W folderze projektu obok appsettings.json","W wwwroot","W bazie danych"],e:"Plik sekretów to JSON w katalogu domowym użytkownika, poza repozytorium projektu."},{id:"w03-39",q:"Jakie polecenie CLI zarządza sekretami aplikacji?",a:["dotnet user-secrets","dotnet secrets add","dotnet ef secrets","nuget secrets"],e:"dotnet user-secrets, odpowiednik „Manage user secrets” w Visual Studio."},{id:"w03-40",q:"Co jest używane przy wdrożeniu do przekazywania sekretów wg wykładu?",a:["Zmienne środowiskowe lub Azure Key Vault / Hashicorp Vault","Plik secrets.json kopiowany na serwer","appsettings.Production.json w repozytorium","Komentarze w kodzie"],e:"Przy wdrożeniu sekrety przekazuje się jako zmienne środowiskowe lub przez rozwiązania typu Key Vault / Vault."},{id:"w03-41",q:"Jak nazywa się system zarządzania zależnościami w .NET?",a:["NuGet","npm","Maven","pip"],e:"NuGet to zarówno narzędzie (część .NET SDK), jak i serwis nuget.org."},{id:"w03-42",q:"Czym jest podejście Code First w EF Core?",a:["Model definiuje się klasami C# (adnotacje/konwencje/fluent), a baza powstaje z nich (migracje)","Klasy generuje się z istniejącej bazy","Pisanie SQL przed kodem","Brak bazy danych"],e:"Code First: klasy z adnotacjami, konwencjami lub fluent API. Database First: generowanie klas z istniejącej bazy (dotnet ef scaffold)."},{id:"w03-43",q:"Jakim poleceniem w podejściu Database First generuje się klasy z istniejącej bazy?",a:["dotnet ef scaffold","dotnet ef migrations add","dotnet ef database update","dotnet new efcore"],e:"Database First korzysta z dotnet ef scaffold (dbcontext scaffold)."},{id:"w03-44",q:"Które właściwości klasy encji domyślnie mają odpowiednik w bazie?",a:["Wszystkie publiczne właściwości z getterem i setterem","Tylko oznaczone [Column]","Tylko pola prywatne","Tylko właściwości typu string"],e:"Domyślnie mapowane są publiczne właściwości z get i set. Można to zmienić atrybutem [NotMapped]."},{id:"w03-45",q:"Który atrybut wyłącza mapowanie właściwości na kolumnę bazy?",a:["[NotMapped]","[Ignore]","[Column(false)]","[Transient]"],e:"[NotMapped] wyłącza mapowanie właściwości."},{id:"w03-46",q:'Do czego służy [Column("quote_id")] lub [Column(TypeName = "varchar(200)")]?',a:["Do zmiany nazwy kolumny lub ręcznego ustawienia typu w bazie","Do walidacji długości w formularzu","Do ustawienia klucza obcego","Do wyłączenia mapowania"],e:"Domyślnie nazwa tabeli to nazwa klasy, a kolumny to nazwa właściwości. [Column] pozwala to zmienić i ustawić typ."},{id:"w03-47",q:"Jak domyślnie (konwencją) EF Core rozpoznaje klucz główny?",a:["Właściwość o nazwie Id lub <NazwaKlasy>Id","Pierwsza właściwość w klasie","Właściwość typu Guid","Musi być atrybut [Key]"],e:"Konwencja: Id lub <Klasa>Id (np. AuthorId). Notatka wykładowcy: „coś z id w nazwie będzie kluczem głównym”."},{id:"w03-48",q:"Po jakiej klasie dziedziczy kontekst danych EF Core?",a:["DbContext","DbSet","PageModel","Controller"],e:"Tworzy się klasę dziedziczącą po DbContext, która implementuje wzorzec repozytorium."},{id:"w03-49",q:"Jaki typ mają właściwości DbContext reprezentujące tabele (encje)?",a:["DbSet<T>","List<T>","IEnumerable<T>","DbTable<T>"],e:"DbContext zawiera właściwości DbSet<T>, np. public DbSet<Quote> Quotes { get; set; }."},{id:"w03-50",q:"Jak zarejestrować DbContext z SQLite w Program.cs?",a:['builder.Services.AddDbContext<QuotesDbContext>(o => o.UseSqlite(builder.Configuration.GetConnectionString("QuotesDatabase")));',"app.UseDbContext<QuotesDbContext>();",'new QuotesDbContext("Data Source=quotes.db") w kontrolerze',"builder.Services.AddSingleton<SqliteConnection>();"],e:"AddDbContext rejestruje kontekst w DI (przed builder.Build()), a connection string pochodzi z konfiguracji lub sekretów."},{id:"w03-51",q:"Kiedy w Program.cs należy zarejestrować DbContext?",a:["Przed builder.Build()","Po app.Run()","Po builder.Build()","W dowolnym momencie"],e:"Rejestracja serwisów musi nastąpić przed builder.Build()."},{id:"w03-52",q:"Co oznacza skrót LINQ?",a:["Language INtegrated Query","Linked Query","Lightweight Integrated Query","List Iteration Query"],e:"LINQ = Language INtegrated Query, oparte o IEnumerable i IQueryable."},{id:"w03-53",q:"Od której wersji .NET Framework dostępny jest LINQ?",a:["3.5","2.0","4.0","4.5"],e:"LINQ jest dostępny od .NET Framework 3.5 (język C# 3.0)."},{id:"w03-54",q:"Na czym zbudowany jest LINQ, co pozwala obliczać zapytania w czasie wykonywania (np. tłumaczyć na SQL)?",a:["Na drzewach wyrażeń (expression trees)","Na refleksji atrybutów","Na wątkach","Na dynamic"],e:"LINQ zbudowany jest w oparciu o drzewa wyrażeń i intensywnie korzysta z lambd, metod i typów anonimowych."},{id:"w03-55",q:"Która operacja LINQ odpowiada „map” (projekcja)?",a:["Select()","Where()","Take()","OrderBy()"],e:"Select() to projekcja (map), a Where() to filtr."},{id:"w03-56",q:"Która operacja LINQ odpowiada „filter”?",a:["Where()","Select()","Skip()","Count()"],e:"Where() zwraca tylko elementy spełniające predykat."},{id:"w03-57",q:"Co robi Single(), gdy kolekcja zawiera więcej niż jeden element?",a:["Rzuca wyjątek","Zwraca pierwszy","Zwraca null","Zwraca ostatni"],e:"Single/SingleOrDefault wybiera jedyny element, a gdy jest ich więcej, rzuca wyjątek."},{id:"w03-58",q:"Co robi First(), gdy kolekcja jest pusta?",a:["Rzuca wyjątek","Zwraca null","Zwraca default(T)","Zwraca pustą listę"],e:"First() rzuca wyjątek, a FirstOrDefault() zwraca null (default)."},{id:"w03-59",q:"Kod: var p = new[]{1,2,3,4,5}; var r = p.Skip(1).Take(3).Sum(); Jaka jest wartość r?",a:["9","6","12","15"],e:"Skip(1) daje 2,3,4,5, Take(3) daje 2,3,4, a suma to 9."},{id:"w03-60",q:"Jak obliczane są zapytania LINQ zwracające IEnumerable?",a:["Leniwie (lazy evaluation) – do momentu materializacji","Natychmiast przy definicji","Równolegle zawsze","Tylko po stronie klienta"],e:"LINQ jest leniwy. Aby faktycznie wykonać zapytanie, trzeba je zmaterializować: ToList(), ToArray()."},{id:"w03-61",q:"Kod: var query = _context.Quotes.Where(x => x.Id > 0); (bez ToList). Czy zapytanie SQL zostało już wykonane?",a:["Nie – zostanie wykonane dopiero przy materializacji/iteracji","Tak, natychmiast","Tak, ale bez WHERE","Nie, nigdy nie zostanie wykonane"],e:"Notatka wykładowcy: nie ma ToList(), więc zapytanie nie zostanie zmaterializowane. Wykona się przy iteracji (np. w widoku)."},{id:"w03-62",q:"Która metoda materializuje zapytanie LINQ?",a:["ToList()","Where()","Select()","OrderBy()"],e:"Konwersje materializujące: ToArray(), ToList(). Wymienione są też AsEnumerable() i AsQueryable()."},{id:"w03-63",q:"Gdzie obliczane są wyrażenia LINQ dla SZBD w EF Core?",a:["Na serwerze bazodanowym; jeśli operacji nie da się przetłumaczyć – wyjątek","Zawsze w pamięci aplikacji","W przeglądarce","Losowo"],e:"Wyrażenia są ewaluowane na serwerze bazy. Gdyby operacja miała być wykonana po stronie aplikacji, EF rzuci wyjątek (wydajność)."},{id:"w03-64",q:"Gdzie konfiguruje się mapowanie za pomocą Fluent API?",a:["W metodzie OnModelCreating(ModelBuilder) DbContextu","W Program.cs w AddDbContext","W atrybutach klasy","W appsettings.json"],e:"Fluent API to wzorzec builder w OnModelCreating, np. modelBuilder.Entity<Quote>().HasKey(…)."},{id:"w03-65",q:"Co robi modelBuilder.Entity<Quote>().HasKey(c => new { c.Id, c.Date });?",a:["Definiuje złożony klucz główny z Id i Date","Tworzy indeks na Date","Definiuje relację 1:n","Tworzy dwie tabele"],e:"HasKey z typem anonimowym definiuje klucz złożony."},{id:"w03-66",q:"Co robi mechanizm migracji EF Core?",a:["Porównuje bieżący stan modelu z poprzednim i generuje operacje CREATE/ALTER/DROP","Przenosi dane między serwerami","Kopiuje bazę do chmury","Generuje klasy z bazy"],e:"Migracje porównują stan modelu z poprzednim i przygotowują operacje na schemacie. Pozwalają też zasiać dane."},{id:"w03-67",q:"Które polecenie aplikuje migracje do bazy danych?",a:["dotnet ef database update","dotnet ef migrations add","dotnet ef scaffold","dotnet build"],e:"dotnet ef migrations add tworzy migrację, a dotnet ef database update aplikuje ją do bazy."},{id:"w03-68",q:"Jaką pułapkę migracji z SQLite zanotował wykładowca?",a:["SQLite nie ma ALTER TABLE DROP COLUMN","SQLite nie obsługuje kluczy głównych","SQLite nie wspiera migracji w ogóle","SQLite wymaga hasła"],e:"Notatka: SQLite nie ma ALTER TABLE DROP COLUMN (wymaga przebudowy tabeli)."},{id:"w03-69",q:"Czym jest navigation property w EF Core?",a:["Właściwością wskazującą na powiązaną encję/kolekcję (nie typ skalarny)","Kluczem głównym","Właściwością [NotMapped]","Właściwością typu string"],e:"Navigation property to właściwość, której nie da się zmapować na typ skalarny (np. Author Author, List<Quote> Quotes). Na jej podstawie powstają relacje."},{id:"w03-70",q:"Jakie domyślne zachowanie usuwania tworzą konwencje dla wymaganej relacji 1:n?",a:["Usuwanie kaskadowe","Ustawianie null","Brak akcji","Blokada usunięcia"],e:"Konwencje aktywują usuwanie kaskadowe dla wymaganych połączeń oraz ustawianie null dla niewymaganych."},{id:"w03-71",q:"Jak wyrazić relację 1:n Quote → Author w Fluent API?",a:["modelBuilder.Entity<Quote>().HasOne(p => p.Author).WithMany(b => b.Quotes);","modelBuilder.Entity<Quote>().HasMany(p => p.Author).WithOne();","modelBuilder.Relation<Quote, Author>(1, n);","modelBuilder.Entity<Author>().HasKey(a => a.Quotes);"],e:"Quote ma jednego Author (HasOne), a Author ma wiele Quotes (WithMany)."},{id:"w03-72",q:"Czego wymaga relacja wiele-do-wielu w EF Core (konwencja)?",a:["Kolekcji po obydwu stronach relacji (np. ICollection<Tag> i ICollection<Quote>)","Jawnej klasy tabeli łączącej zawsze","Atrybutu [ManyToMany]","Klucza złożonego w obu tabelach"],e:"Relacje n:n wymagają kolekcji po obu stronach. Często używa się ICollection<T> zamiast List<T>."},{id:"w03-73",q:"Czy EF Core domyślnie ładuje dane z tabel powiązanych (np. Author dla Quote)?",a:["Nie – trzeba je włączyć przez Include()/ThenInclude()","Tak, zawsze","Tak, ale tylko dla relacji n:n","Tylko w trybie InMemory"],e:"Dane z tabel podrzędnych nie są wybierane automatycznie. Włącza się je przez Include() i ThenInclude()."},{id:"w03-74",q:'Kod: _context.Authors.Where(x => x.Name == "Otto").Include(x => x.Quotes).ThenInclude(x => x.Tags). Co zostanie załadowane?',a:["Autorzy o imieniu Otto z ich cytatami i tagami tych cytatów","Tylko autorzy","Wszystkie cytaty i tagi niezależnie od autora","Tylko tagi"],e:"Include ładuje kolekcję Quotes, a ThenInclude kolejny poziom, czyli Tags każdego cytatu."},{id:"w03-75",q:"Kod: var q = _context.Quotes.First(x => x.Id == 1); return View(q); a widok wyświetla @Model.Author.Name. Co się stanie (bez lazy loading)?",a:["Author będzie null → NullReferenceException","Author zostanie automatycznie doczytany","Wyświetli pusty napis bez błędu","Błąd kompilacji"],e:"Bez Include(n => n.Author) navigation property nie jest ładowana i ma wartość null. W przykładzie z kodu użyto _context.Quotes.Include(n => n.Author)."},{id:"w03-76",q:"Kiedy zmiany w śledzonych encjach zostaną zapisane do bazy?",a:["Dopiero po wywołaniu SaveChanges()/SaveChangesAsync()","Natychmiast po zmianie właściwości","Po zakończeniu żądania HTTP automatycznie","Po wywołaniu ToList()"],e:"Encje są śledzone (tracked), ale zmiany nie zostaną zapisane, dopóki nie zostanie wywołane SaveChanges()."},{id:"w03-77",q:'Kod Update(): var e = _context.Authors.First(x => x.AuthorId == 1); e.Name = "Otto Apocalypse"; _context.SaveChanges(); Czy potrzebne jest wywołanie _context.Update(e)?',a:["Nie – encja jest śledzona, SaveChanges wykryje zmianę","Tak, inaczej zmiana nie zostanie zapisana","Tak, oraz Attach(e)","Trzeba usunąć i dodać encję ponownie"],e:"Encja pobrana z kontekstu jest śledzona, więc zmiana właściwości i SaveChanges() wystarczą."},{id:"w03-78",q:"Do czego służą „zaślepki” (stub) z _context.Attach(new Author { AuthorId = 1 })?",a:["Do dodawania obiektów powiązanych bez pełnego wyszukiwania ich w bazie","Do usuwania rekordów","Do testów jednostkowych","Do migracji"],e:"Zaślepki pozwalają powiązać nowy Quote z istniejącym Author bez jego pobierania. Attach oznacza encję jako istniejącą."},{id:"w03-79",q:"Jak w EF Core pobrać dane zwykłym poleceniem SQL mapowanym na obiekty?",a:["FromSqlRaw()","ExecuteSql() bez mapowania","RawQuery()","Sql()"],e:'FromSqlRaw(), np. _context.Quotes.FromSqlRaw("SELECT * FROM Quotes WHERE quote_id = 3 LIMIT 1").'},{id:"w03-80",q:"Czym jest Dapper?",a:["Prostym mapperem obiektów (mikro-ORM) bez śledzenia obiektów","Oficjalnym ORM Microsoftu","Bazą dokumentową","Narzędziem migracji"],e:"Dapper mapuje wyniki „zwykłych” zapytań SQL na typy .NET i nie ma mechanizmu śledzenia."},{id:"w03-81",q:"Jaką bazą jest LiteDB?",a:["Embedded (jak SQLite), ale dokumentową (jak Mongo), napisaną w C#","Bazą time-series","Bazą wektorową","Bazą klucz-wartość w chmurze"],e:"LiteDB to embedded, dokumentowa baza w jednej bibliotece (~450 KB), w pełni w C#."},{id:"w03-82",q:"Jakim typem bazy jest InfluxDB?",a:["Time-series (szeregi czasowe)","Wektorowa","Dokumentowa z dostępem HTTP","Klucz-wartość"],e:"InfluxDB to time-series, Qdrant to baza wektorowa, a CouchDB to baza dokumentowa z dostępem przez HTTP."},{id:"w03-83",q:"Jakim typem bazy jest Qdrant?",a:["Wektorowa","Time-series","Relacyjna","Grafowa"],e:"Qdrant to baza wektorowa z oficjalnym SDK do .NET."},{id:"w03-84",q:"Który z poniższych przykładów to baza typu klucz-wartość wymieniona na wykładzie?",a:["Redis","InfluxDB","Qdrant","LiteDB"],e:"K-V: Redis, Azure Cosmos DB, RocksDB, FASTER, ZoneTree."},{id:"w03-85",q:"Kod: p.Select(x => x.Age).Sum() dla osób o wieku 19 i 40019. Jaki wynik?",a:["40038","40019","19","2"],e:"Select wybiera wiek, a Sum sumuje: 19 + 40019 = 40038."}],kp={id:pp,title:zp,questions:mp},fp="w04",gp="W4 · Web API i Minimal APIs (na podstawie kodu)",jp=[{id:"w04-01",q:"Po jakiej klasie dziedziczą kontrolery Web API w przykładach (bez obsługi widoków)?",a:["ControllerBase","Controller","PageModel","ApiController"],e:"Kontrolery API dziedziczą po ControllerBase (bez widoków). Controller dodaje obsługę widoków (MVC). [ApiController] to atrybut, nie klasa bazowa."},{id:"w04-02",q:'Co oznacza [Route("[controller]")] na klasie ProviderController?',a:["Ścieżka bazowa to nazwa kontrolera bez przyrostka: /Provider","Ścieżka to dosłownie /[controller]","Ścieżka to /ProviderController","Kontroler nie ma ścieżki"],e:"Token [controller] zostaje zastąpiony nazwą kontrolera bez „Controller”, więc /Provider."},{id:"w04-03",q:'ForecastController ma [Route("[controller]")], a akcja [HttpGet("/forecast/{city}")]. Pod jakim adresem jest akcja?',a:["/forecast/{city} – szablon zaczynający się od / jest bezwzględny","/Forecast/forecast/{city}","/Forecast/{city}","/api/forecast/{city}"],e:"Szablon akcji zaczynający się od '/' ignoruje trasę kontrolera."},{id:"w04-04",q:"CitiesProvider z miastami Warsaw, Paris, Beijing. Co zwróci GET /Provider/Rome (GetById: FirstOrDefault, null → NotFound())?",a:["404 Not Found","200 z null","400 Bad Request","500"],e:"FirstOrDefault zwraca null dla braku dopasowania, więc NotFound(), czyli 404."},{id:"w04-05",q:"Co zwróci GET /Provider w przykładzie (metoda zwraca IEnumerable<string>)?",a:['200 z tablicą JSON ["Warsaw","Paris","Beijing"]',"Widok HTML z listą","204 No Content","XML z listą zawsze"],e:"Web API serializuje zwracany obiekt domyślnie do JSON z kodem 200."},{id:"w04-06",q:"Akcja Post ma [HttpPost][Authorize]. Co zwróci POST /Provider bez tokenu JWT?",a:["401 Unauthorized","201 Created","400 Bad Request","403 Forbidden"],e:"[Authorize] wymaga uwierzytelnienia. Brak tokenu przy schemacie JwtBearer daje challenge, czyli 401."},{id:"w04-07",q:"Jaki kod HTTP zwraca CreatedAtAction(...) w akcji Post?",a:["201 Created","200 OK","202 Accepted","204 No Content"],e:"CreatedAtAction zwraca 201 z nagłówkiem Location wskazującym na podaną akcję."},{id:"w04-08",q:"CitiesProvider jest zarejestrowany przez AddSingleton(_ => new CitiesProvider { … }). Po udanym POST z nowym miastem, czy kolejne GET /Provider je zwróci?",a:["Tak – singleton żyje przez cały czas działania aplikacji (do restartu)","Nie – każde żądanie dostaje nową instancję","Tak, ale tylko dla tego samego użytkownika","Nie – dane są zapisywane dopiero w bazie"],e:"Singleton to jedna instancja na aplikację, więc lista w pamięci jest współdzielona do restartu. Przy Transient lub Scoped zmiana by przepadła."},{id:"w04-09",q:"Jaka byłaby konsekwencja zarejestrowania CitiesProvider jako AddScoped zamiast AddSingleton?",a:["Dodane miasto zniknęłoby po zakończeniu żądania (nowa lista dla każdego żądania)","Brak różnicy","Aplikacja by się nie uruchomiła","Miasta byłyby współdzielone między wszystkimi"],e:"Scoped to jedna instancja na żądanie HTTP, więc zmiany w liście w pamięci nie przetrwałyby."},{id:"w04-10",q:"Model City ma public required string Name { get; set; }. Co oznacza required?",a:["Właściwość musi być ustawiona przy tworzeniu obiektu (inicjalizator/deserializacja)","To atrybut walidacji [Required] z data annotations","Właściwość nie może być zmieniona","Właściwość jest kluczem głównym"],e:"required (C# 11) to składnik obowiązkowy przy inicjalizacji. To słowo kluczowe języka, nie atrybut [Required]."},{id:"w04-11",q:"Co robi atrybut [ApiController]?",a:["Włącza zachowania API, m.in. automatyczną odpowiedź 400 przy niepoprawnym modelu i wiązanie z body","Rejestruje kontroler w DI","Generuje dokumentację Swagger","Wymaga uwierzytelnienia"],e:"[ApiController] włącza automatyczną walidację modelu (400 ValidationProblem) i inferencję źródeł wiązania. Uwierzytelnienia nie wymusza."},{id:"w04-12",q:"Do czego służy [ProducesResponseType(StatusCodes.Status404NotFound)] na akcji?",a:["Do opisania możliwych odpowiedzi w dokumentacji OpenAPI/Swagger","Wymusza zwrócenie 404","Zmienia domyślny kod błędu","Włącza cache odpowiedzi"],e:"ProducesResponseType dokumentuje możliwe kody i typy odpowiedzi dla OpenAPI. Samo nie zmienia działania akcji."},{id:"w04-13",q:"Jak włączyć komentarze XML (///) w dokumentacji Swaggera w przykładzie?",a:["options.IncludeXmlComments(ścieżka do pliku .xml assembly) w AddSwaggerGen","app.UseXmlComments()","Atrybut [XmlDoc] na kontrolerze","Działa automatycznie bez konfiguracji"],e:'AddSwaggerGen(o => o.IncludeXmlComments(Path.Combine(AppContext.BaseDirectory, "<Assembly>.xml"))). Trzeba też generować plik XML przy kompilacji.'},{id:"w04-14",q:"Które middleware w przykładzie udostępniają Swaggera (Swashbuckle) w trybie Development?",a:["app.UseSwagger(); app.UseSwaggerUI();","app.MapControllers();","app.UseRouting();","app.UseOpenApiDocs();"],e:"UseSwagger() generuje dokument JSON, a UseSwaggerUI() interfejs. W przykładzie są włączane tylko w Development."},{id:"w04-15",q:"W nowszym przykładzie użyto builder.Services.AddOpenApi() i app.MapOpenApi(). Pod jakim adresem jest dokument OpenAPI?",a:["/openapi/v1.json","/swagger/v1/swagger.json","/api/docs","/openapi.yaml"],e:'MapOpenApi() wystawia /openapi/v1.json. Dlatego UseSwaggerUI wskazuje SwaggerEndpoint("/openapi/v1.json", …).'},{id:"w04-16",q:"Co dodaje app.MapScalarApiReference() w przykładzie OpenAPI?",a:["Alternatywny interfejs (Scalar) do przeglądania dokumentacji API","Ograniczanie liczby żądań","Wersjonowanie API","Uwierzytelnianie JWT"],e:"Scalar to alternatywny UI dla dokumentacji OpenAPI, obok Swagger UI."},{id:"w04-17",q:"Czym są Minimal APIs?",a:["Definiowaniem endpointów bezpośrednio w Program.cs (app.MapGet/MapPost) bez kontrolerów","Kontrolerami bez atrybutów","Razor Pages bez widoków","Bibliotekami do kompresji odpowiedzi"],e:'Minimal APIs to endpointy definiowane lambdami: app.MapGet("/…", () => …), zwykle z top-level statements.'},{id:"w04-18",q:'Kod: app.MapPost("/test", () => new { status = 3 }); Co zwróci POST /test?',a:['200 z JSON {"status":3}',"201 Created","204 No Content","405 Method Not Allowed"],e:"Zwrócony obiekt jest serializowany do JSON z kodem 200."},{id:"w04-19",q:'Kod: app.MapPost("/test", …). Co zwróci GET /test?',a:["405 Method Not Allowed","200 OK","404 zawsze","500"],e:"Endpoint istnieje tylko dla POST, więc GET pod tym adresem daje 405 (ścieżka pasuje, czasownik nie)."},{id:"w04-20",q:'Kod: app.MapPost("/test-body", ([FromBody] WeatherForecast f) => f.TemperatureC > 0 ? Results.Accepted() : Results.BadRequest()); Co zwróci body z TemperatureC = 0?',a:["400 Bad Request","202 Accepted","200 OK","201 Created"],e:"0 > 0 to fałsz, więc Results.BadRequest() (400). Dla wartości dodatnich Accepted() (202)."},{id:"w04-21",q:"Jaki kod HTTP zwraca Results.Accepted()?",a:["202","200","201","204"],e:"Accepted to 202: żądanie przyjęte do przetworzenia."},{id:"w04-22",q:"Co robi [FromServices] przy parametrze lambdy Minimal API, np. ([FromServices] ILogger<Program> logger) => …?",a:["Wstrzykuje parametr z kontenera DI","Pobiera parametr z body","Pobiera parametr z nagłówka","Rejestruje serwis w DI"],e:"[FromServices] wiąże parametr z kontenerem DI, czyli wstrzykuje go do handlera."},{id:"w04-23",q:"Rekord: public int TemperatureF => 32 + (int)(TemperatureC / 0.5556); Ile wynosi TemperatureF dla TemperatureC = 0?",a:["32","0","-17","33"],e:"0 / 0.5556 = 0, więc 32 + 0 = 32."},{id:"w04-24",q:"Ten sam wzór TemperatureF = 32 + (int)(TemperatureC / 0.5556). Ile wynosi dla TemperatureC = 10?",a:["49","50","42","18"],e:"10 / 0.5556 ≈ 17,998, a rzutowanie (int) obcina do 17, więc 32 + 17 = 49 (nie 50!)."},{id:"w04-25",q:"Ile elementów zwróci Enumerable.Range(1, 5).Select(…).ToArray() w endpoincie /weatherforecast?",a:["5","4","6","1"],e:"Range(start: 1, count: 5) daje 1,2,3,4,5, czyli 5 prognoz."},{id:"w04-26",q:"Jaki zakres wartości zwraca Random.Shared.Next(-20, 55)?",a:["Od -20 do 54 (górna granica wyłączna)","Od -20 do 55 włącznie","Od -19 do 55","Od 0 do 55"],e:"Next(min, max): min włącznie, max wyłącznie."},{id:"w04-27",q:'Co robi .WithName("GetWeatherForecast") na endpoincie Minimal API?',a:["Nadaje endpointowi nazwę (np. do generowania linków / operationId w OpenAPI)","Zmienia adres URL","Wymaga uwierzytelnienia","Ustawia nazwę pliku odpowiedzi"],e:"WithName nadaje nazwę endpointu, używaną m.in. jako operationId w OpenAPI. WithDescription dodaje opis."},{id:"w04-28",q:"Jaki typ daty używa nowszy przykład OpenAPI zamiast DateTime w WeatherForecast?",a:["DateOnly","TimeOnly","DateTimeOffset","string"],e:"DateOnly.FromDateTime(DateTime.Now.AddDays(index)) przechowuje samą datę, bez godziny."},{id:"w04-29",q:'Rate limiter: AddFixedWindowLimiter("fixed", PermitLimit = 4, Window = 12 s, QueueLimit = 0). Co stanie się z 5. żądaniem w tym samym oknie 12 s?',a:["Zostanie odrzucone z kodem 429","Trafi do kolejki","Zostanie obsłużone normalnie","Zwróci 503"],e:"Limit to 4 żądania na okno, a kolejka ma 0 miejsc, więc 5. żądanie jest odrzucane. Ustawiono RejectionStatusCode = 429."},{id:"w04-30",q:"Co oznacza kod HTTP 429?",a:["Too Many Requests","Unauthorized","Forbidden","Service Unavailable"],e:"429 = Too Many Requests, typowy kod dla rate limitingu."},{id:"w04-31",q:'Jak przypisać politykę rate limitingu "fixed" do endpointu?',a:['app.MapGet("/", …).RequireRateLimiting("fixed")','[RateLimit("fixed")] na Program','app.UseRateLimiter("fixed") wystarczy','builder.Services.AddRateLimit("/")'],e:'Polityka jest definiowana w AddRateLimiter, middleware włącza app.UseRateLimiter(), a endpoint wybiera politykę przez RequireRateLimiting("fixed").'},{id:"w04-32",q:"Co jest wymagane oprócz AddRateLimiter, aby limiter działał?",a:["app.UseRateLimiter() w potoku","app.UseCors()","app.UseAuthentication()","Nic więcej"],e:"Serwis trzeba dodać i włączyć middleware app.UseRateLimiter()."},{id:"w04-33",q:"Co oznacza AutoReplenishment = true w FixedWindowLimiter?",a:["Limit odnawia się automatycznie po upływie okna","Kolejka rośnie automatycznie","Limit rośnie z każdym żądaniem","Odrzucone żądania są ponawiane"],e:"Okno automatycznie się odnawia co Window (12 s) i przywraca PermitLimit."},{id:"w04-34",q:'Wersjonowanie: AddApiVersioning(o => { o.AssumeDefaultVersionWhenUnspecified = true; o.ApiVersionReader = new HeaderApiVersionReader("x-api-version"); }). Skąd odczytywana jest wersja API?',a:["Z nagłówka HTTP x-api-version","Z query string ?api-version=","Z segmentu URL","Z ciasteczka"],e:'HeaderApiVersionReader("x-api-version") odczytuje wersję z nagłówka.'},{id:"w04-35",q:'Ta sama konfiguracja wersjonowania. GET /Hello bez nagłówka wersji, kontrolery v1.0 ("Hello world v1") i v2.0 ("Hello world v2") pod tą samą trasą. Co zostanie zwrócone?',a:["Hello world v1 – przyjęta zostanie wersja domyślna","Hello world v2 – najnowsza","400 – brak wersji","Błąd niejednoznaczności tras"],e:"AssumeDefaultVersionWhenUnspecified = true, a domyślna wersja to 1.0, więc odpowiada kontroler v1."},{id:"w04-36",q:"Jak w przykładzie oznacza się, którą wersję API obsługuje kontroler?",a:['Atrybutem [ApiVersion("1.0")] (można kilka)',"Nazwą klasy z sufiksem V1","Osobnym projektem",'Atrybutem [Route("v1")] obowiązkowo'],e:'[ApiVersion("1.0")] / [ApiVersion(2.0)]. Jeden kontroler może obsługiwać kilka wersji.'},{id:"w04-37",q:"Ile minut jest ważny token wystawiany przez TokenController (expires: DateTime.UtcNow.AddMinutes(30))?",a:["30","60","5","Bezterminowo"],e:"expires: AddMinutes(30). Przy ClockSkew = TimeSpan.Zero token wygasa dokładnie po 30 min."},{id:"w04-38",q:"Co oznacza ClockSkew = TimeSpan.Zero w TokenValidationParameters?",a:["Brak tolerancji czasowej – token przestaje być ważny dokładnie w chwili wygaśnięcia","Token nigdy nie wygasa","Wyłączenie walidacji podpisu","Synchronizację zegara z serwerem NTP"],e:"Domyślnie jest kilkuminutowa tolerancja. Zero oznacza ścisłe sprawdzanie czasu wygaśnięcia."},{id:"w04-39",q:"Których elementów tokenu NIE weryfikuje konfiguracja JWT z przykładu?",a:["Wystawcy (issuer) i odbiorcy (audience)","Czasu ważności","Klucza podpisu","Podpisu tokenu"],e:"ValidateIssuer = false i ValidateAudience = false. Walidowane są czas (ValidateLifetime) oraz klucz podpisu (ValidateIssuerSigningKey)."},{id:"w04-40",q:"Jakiego algorytmu podpisu używa TokenController?",a:["HMAC SHA-256 z kluczem symetrycznym","RSA z kluczem publicznym","ECDSA","Brak podpisu"],e:"SymmetricSecurityKey + SecurityAlgorithms.HmacSha256, czyli ten sam sekret do podpisu i weryfikacji."},{id:"w04-41",q:"Co jest problemem bezpieczeństwa w przykładzie JWT (zgodnie z wykładem o sekretach)?",a:["Sekret klucza jest zapisany na sztywno w kodzie źródłowym","Token ma 30 minut ważności","Użyto HMAC","Token zawiera claim Jti"],e:'Klucz "to jest bardzo, bardzo tajny sekret" jest w kodzie. Sekrety powinny być w user secrets, zmiennych środowiskowych lub Key Vault.'},{id:"w04-42",q:"Do czego służy claim Jti w tokenie (new Claim(JwtRegisteredClaimNames.Jti, Guid.NewGuid().ToString()))?",a:["Unikalny identyfikator tokenu","Identyfikator użytkownika","Czas wygaśnięcia","Adres e-mail"],e:"jti (JWT ID) to unikalny identyfikator tokenu. sub to podmiot (użytkownik), email to e-mail."},{id:"w04-43",q:"Jak klient przesyła token JWT do API chronionego schematem JwtBearer?",a:["Nagłówek Authorization: Bearer <token>","W query string ?token=","W ciasteczku .AspNetCore.Identity","W body każdego żądania"],e:"Schemat Bearer oczekuje nagłówka Authorization: Bearer <token>."},{id:"w04-44",q:"W jakiej kolejności muszą być w potoku middleware uwierzytelniania i autoryzacji?",a:["app.UseAuthentication(); potem app.UseAuthorization();","Najpierw UseAuthorization, potem UseAuthentication","Kolejność nie ma znaczenia","Wystarczy UseAuthorization"],e:"Najpierw ustala się tożsamość (uwierzytelnienie), dopiero potem sprawdza uprawnienia (autoryzacja)."},{id:"w04-45",q:"Czym różni się uwierzytelnianie (authentication) od autoryzacji (authorization)?",a:["Uwierzytelnianie ustala, kim jest użytkownik; autoryzacja – do czego ma dostęp","To synonimy","Autoryzacja ustala tożsamość, uwierzytelnianie uprawnienia","Uwierzytelnianie dotyczy tylko API"],e:"Authentication to kto, authorization to co mu wolno. Błędy to odpowiednio 401 i 403."},{id:"w04-46",q:'W projekcie -cors: builder.Services.AddCors(o => o.AddPolicy("MyCORS", p => p.WithOrigins("http://localhost:5252"))), ale linia //app.UseCors("MyCORS"); jest zakomentowana. Jaki jest skutek?',a:["Polityka CORS nie jest stosowana – przeglądarka zablokuje odczyt odpowiedzi z innych originów","Wszystkie originy są dozwolone","Dozwolony jest tylko localhost:5252","Aplikacja się nie uruchomi"],e:"AddCors tylko definiuje politykę, a działa ona dopiero z middleware UseCors. Bez nagłówków CORS przeglądarka blokuje żądania cross-origin."},{id:"w04-47",q:"Kto egzekwuje ograniczenia CORS?",a:["Przeglądarka – na podstawie nagłówków odpowiedzi serwera","Serwer, odrzucając żądania z innych originów","Firewall","Kestrel w każdym przypadku, także dla curl"],e:"CORS to mechanizm przeglądarki. Narzędzia jak curl czy Postman nie podlegają CORS."},{id:"w04-48",q:"Co robi builder.Services.AddEndpointsApiExplorer()?",a:["Udostępnia metadane endpointów (m.in. Minimal APIs) dla generatora OpenAPI/Swagger","Wyświetla listę endpointów w przeglądarce","Włącza wersjonowanie","Włącza CORS"],e:"API Explorer zbiera metadane endpointów, z których korzysta Swashbuckle (AddSwaggerGen)."},{id:"w04-49",q:"Która linia w Program.cs Web API mapuje kontrolery z routingiem atrybutowym?",a:["app.MapControllers();",'app.MapControllerRoute("default", …);',"app.MapRazorPages();","app.UseEndpoints();"],e:"W API z [Route] używa się app.MapControllers(), a MapControllerRoute to routing konwencyjny MVC."},{id:"w04-50",q:'W TokenController: [Route("[controller]")] i [HttpPost("/token")]. Pod jakim adresem wystawiany jest token?',a:["POST /token","POST /Token/token","GET /token","POST /api/token"],e:`Szablon "/token" zaczyna się od '/', więc jest bezwzględny. Akcja ma [HttpPost], więc tylko POST.`}],hp={id:fp,title:gp,questions:jp},bp="w05",Sp="W5 · Identity, role, polityki i uwierzytelnianie (na podstawie kodu)",vp=[{id:"w05-01",q:"Co rejestruje builder.Services.AddDefaultIdentity<ApplicationUser>(…).AddEntityFrameworkStores<ApplicationDbContext>()?",a:["System ASP.NET Core Identity z domyślnym UI, przechowujący użytkowników w bazie przez EF Core","Uwierzytelnianie JWT","Tylko tabelę ról","Polityki autoryzacji"],e:"AddDefaultIdentity dodaje Identity (z UI w Razor Pages, Areas/Identity), a AddEntityFrameworkStores zapisuje dane w bazie przez DbContext."},{id:"w05-02",q:"Co oznacza options.SignIn.RequireConfirmedAccount = true?",a:["Użytkownik musi potwierdzić konto (np. e-mail), zanim się zaloguje","Każde logowanie wymaga 2FA","Hasło musi mieć min. 8 znaków","Konto jest blokowane po 3 próbach"],e:"RequireConfirmedAccount wymaga potwierdzenia konta przed zalogowaniem."},{id:"w05-03",q:"Co trzeba dodać do konfiguracji Identity, aby korzystać z ról (np. Admin)?",a:[".AddRoles<IdentityRole>()",".AddClaims()",".AddPolicies()","Nic, role są zawsze włączone"],e:"W przykładzie -roles: AddDefaultIdentity<…>(…).AddRoles<IdentityRole>().AddEntityFrameworkStores<…>(). W przykładzie -birthdate tego brak."},{id:"w05-04",q:'Co oznacza [Authorize(Roles = "Admin")] na akcji AdminOnly?',a:["Dostęp mają tylko uwierzytelnieni użytkownicy z rolą Admin","Dostęp ma każdy zalogowany","Akcja jest dostępna anonimowo","Tylko pierwszy użytkownik w bazie"],e:'Roles = "Admin" to autoryzacja oparta o role. Zalogowany bez roli dostanie odmowę (403 / Access Denied).'},{id:"w05-05",q:'Zalogowany użytkownik BEZ roli Admin wchodzi na akcję z [Authorize(Roles = "Admin")] (cookie Identity). Jaki będzie efekt?',a:["Odmowa dostępu – przekierowanie na stronę Access Denied (403)","Przekierowanie na stronę logowania (401)","Akcja się wykona","Błąd 500"],e:"Użytkownik jest uwierzytelniony, ale nie ma uprawnień, więc forbid (Access Denied). Niezalogowany zostałby przekierowany na login (challenge)."},{id:"w05-06",q:'Jak w przykładzie zdefiniowano politykę "IsAdult"?',a:['options.AddPolicy("IsAdult", p => p.AddRequirements(new MinimumAgeRequirement(18)))','options.AddPolicy("IsAdult", p => p.RequireRole("Adult"))',"[Authorize(Age = 18)]",'options.AddPolicy("IsAdult", p => p.RequireClaim("age", "18"))'],e:"Polityka używa własnego wymagania MinimumAgeRequirement(18), które sprawdza handler MinimumAgeHandler."},{id:"w05-07",q:"Jaki interfejs implementuje MinimumAgeRequirement?",a:["IAuthorizationRequirement","IAuthorizationHandler","IAuthenticationHandler","IPolicyProvider"],e:"Wymaganie (dane, np. MinimumAge) implementuje IAuthorizationRequirement, a logikę zawiera handler: AuthorizationHandler<MinimumAgeRequirement>."},{id:"w05-08",q:"Jak zarejestrowano MinimumAgeHandler w przykładzie?",a:["builder.Services.AddTransient<IAuthorizationHandler, MinimumAgeHandler>();","options.AddHandler<MinimumAgeHandler>();","[Handler] na klasie","Nie trzeba go rejestrować"],e:"Handler rejestruje się w DI jako IAuthorizationHandler. Bez rejestracji wymaganie nigdy nie zostanie spełnione."},{id:"w05-09",q:"Jak handler sygnalizuje spełnienie wymagania?",a:["context.Succeed(requirement)","return true","context.Fail() odwrotnie","throw new AuthorizedException()"],e:"context.Succeed(requirement) oznacza spełnienie. Zwrócenie bez Succeed oznacza brak spełnienia, czyli odmowę dostępu."},{id:"w05-10",q:"MinimumAgeHandler: age = Today.Year − dob.Year; if (dob > Today.AddYears(−age)) age−−; Dzisiaj 13.11.2026, data urodzenia 1.12.2008. Czy użytkownik przejdzie politykę IsAdult (≥18)?",a:["Nie – wiek wyniesie 17 (urodziny jeszcze nie minęły)","Tak – 2026 − 2008 = 18","Tak – handler liczy tylko lata","Wyjątek – brak daty"],e:"18 lat minus 1, bo 1.12.2008 > 13.11.2008 (urodziny w tym roku jeszcze nie minęły), więc 17 < 18."},{id:"w05-11",q:"Ten sam handler. Dzisiaj 13.11.2026, data urodzenia 13.11.2008. Czy użytkownik przejdzie IsAdult?",a:["Tak – wiek 18","Nie – wiek 17","Nie – wiek 19","Zależy od strefy czasowej"],e:"dob == Today.AddYears(-18), więc warunek > jest fałszywy, wiek = 18 ≥ 18 i Succeed."},{id:"w05-12",q:"Co robi MinimumAgeHandler, gdy _manager.GetUserAsync(context.User) zwróci null?",a:["Kończy bez Succeed – wymaganie niespełnione, dostęp zabroniony","Spełnia wymaganie","Rzuca wyjątek","Tworzy nowego użytkownika"],e:"if (user == null) return Task.CompletedTask; kończy bez context.Succeed, więc odmowa."},{id:"w05-13",q:'Polityka: policy.RequireAssertion(_ => DateTime.Now.DayOfWeek == DayOfWeek.Saturday || … == DayOfWeek.Sunday). Kiedy akcja [Authorize(Policy = "IsItWeekend")] będzie dostępna?',a:["Tylko w sobotę i niedzielę (dla zalogowanego)","Tylko w dni robocze","Zawsze","Tylko w niedzielę"],e:"RequireAssertion pozwala zapisać warunek lambdą bez osobnego handlera."},{id:"w05-14",q:'W HomeController jest WeekendOnly z [Authorize(Policy = "IsItWeekend")] oraz WeekendOnly2 bez atrybutu, zwracające View("WeekendOnly"). Co z tego wynika?',a:["Ten sam widok jest dostępny zawsze przez WeekendOnly2 – autoryzacja dotyczy akcji, nie widoku","WeekendOnly2 też wymaga weekendu","WeekendOnly2 nie zadziała bez atrybutu","Widok nie może być użyty przez dwie akcje"],e:"Atrybut [Authorize] chroni akcję (endpoint). Ten sam plik widoku zwrócony z niechronionej akcji jest dostępny dla każdego."},{id:"w05-15",q:"Jak oznaczyć akcję wymagającą konkretnej polityki autoryzacji?",a:['[Authorize(Policy = "IsAdult")]','[Policy("IsAdult")]','[Authorize("IsAdult") ] w Program.cs',"[RequirePolicy(IsAdult)]"],e:'Polityki wskazuje się przez [Authorize(Policy = "nazwa")], a definiuje w AddAuthorization(o => o.AddPolicy(…)).'},{id:"w05-16",q:"TokenController (Identity): użytkownik o podanym e-mailu nie istnieje. Co zwraca akcja?",a:["404 Not Found","401 Unauthorized","400 Bad Request","200 z pustym tokenem"],e:"if (user == null) return NotFound(). To ujawnia, czy e-mail istnieje w systemie (enumeracja użytkowników)."},{id:"w05-17",q:"TokenController: użytkownik istnieje, ale hasło jest błędne. Co zwraca akcja?",a:["401 Unauthorized","404 Not Found","403 Forbidden","200 bez tokenu"],e:"CheckPasswordAsync zwraca false, więc Unauthorized() (401)."},{id:"w05-18",q:"Która klasa Identity służy w przykładzie do wyszukania użytkownika i sprawdzenia hasła?",a:["UserManager<ApplicationUser> (FindBy
