 (PaaS) pojawił się dopiero w 2008."},{id:"w01-02",q:"Co pojawiło się w Salesforce w 2008 roku?",a:["Force.com – platforma PaaS do tworzenia aplikacji biznesowych","Pierwszy CRM w modelu SaaS","Lightning Web Components","Agentforce 360"],e:"2008 → Force.com w modelu PaaS, czyli platforma do tworzenia aplikacji biznesowych."},{id:"w01-03",q:"Co oznacza skrót CRM?",a:["Customer Relationship Management","Cloud Resource Manager","Customer Record Model","Component Runtime Module"],e:"CRM = Customer Relationship Management – zarządzanie relacjami z klientami."},{id:"w01-04",q:"Czym jest Org w Salesforce?",a:["Wydzielonym środowiskiem Salesforce typu PaaS działającym w chmurze","Lokalną instalacją serwera Salesforce w firmie","Pojedynczą aplikacją z AppExchange","Kontem jednego użytkownika"],e:"Org (Organization) to wydzielone środowisko PaaS Salesforce działające w chmurze Salesforce."},{id:"w01-05",q:"Co NIE jest wymienione jako zawartość Org-a?",a:["Fizyczne serwery i system operacyjny","Dane (w tym użytkownicy i uprawnienia)","Kod uruchamiany w Org-u","Konfiguracje (w tym aplikacje)"],e:"W Orgu przechowywane są: dane (w tym użytkownicy i ich uprawnienia), kod i konfiguracje. Infrastrukturą zajmuje się Salesforce, to istota PaaS."},{id:"w01-06",q:"Gdzie w Org-u przechowywani są użytkownicy i ich uprawnienia?",a:["W danych Org-a","W kodzie Apex","W zewnętrznym Active Directory (zawsze)","W AppExchange"],e:"Slajd: 'Dane (w tym użytkownicy i ich uprawnienia)'."},{id:"w01-07",q:"Które Org-i są kopiami innych Org-ów?",a:["Sandbox (testowe)","Developer Edition","Trailhead Playground","Production"],e:"Sandbox (testowy) to kopia innego Org-a, zwykle produkcyjnego."},{id:"w01-08",q:"Który rodzaj Org-a jest tymczasowy i nie jest samodzielny?",a:["Scratch Org","Developer Edition","Production","Trailhead Playground"],e:"Tymczasowe Org-i (Scratch Org) nie są samodzielne, bo są tworzone z innego Org-a (Dev Hub). Sandbox to z kolei kopia innego Org-a."},{id:"w01-09",q:"Jaki rodzaj Org-a służy do celów edukacyjnych?",a:["Trailhead Playground","Sandbox","Scratch Org","Production"],e:"Edukacyjne → Trailhead Playground; developerskie → Developer Edition."},{id:"w01-10",q:"Jak nazywa się darmowy Org developerski?",a:["Developer Edition","Trailhead Playground","Full Sandbox","Experience Org"],e:"Developerskie Org-i to Developer Edition."},{id:"w01-11",q:"Do czego służy AppExchange?",a:["To sklep z komercyjnymi aplikacjami dla Salesforce","To narzędzie do pisania kodu Apex","To rodzaj Org-a testowego","To API do integracji z systemami zewnętrznymi"],e:"Salesforce AppExchange to marketplace z komercyjnymi aplikacjami."},{id:"w01-12",q:"Czym jest Salesforce Customer 360?",a:["Zestawem usług SaaS dla biznesu, czyli gotowych aplikacji (Sales, Service, Marketing…)","Narzędziem do tworzenia komponentów LWC","Rodzajem Org-a produkcyjnego","Językiem zapytań do bazy danych"],e:"Customer 360 to usługi SaaS dla biznesu, czyli gotowe aplikacje, np. Sales, Marketing, Commerce, Customer Service."},{id:"w01-13",q:"Która aplikacja Customer 360 służy do organizacji i zarządzania sprzedażą?",a:["Sales","Commerce","Field Service","Revenue Management"],e:"Sales → organizacja i zarządzanie sprzedażą. Commerce dotyczy handlu elektronicznego."},{id:"w01-14",q:"Która aplikacja Customer 360 obsługuje usługi realizowane w terenie?",a:["Field Service","Contact Center","Customer Service","Commerce"],e:"Field Service → obsługa usług realizowanych w terenie."},{id:"w01-15",q:"Za co odpowiada Revenue Management?",a:["Zarządzanie ofertami, cenami, umowami i przychodami","Kampanie marketingowe i pozyskiwanie klientów","Handel elektroniczny","Obsługa zgłoszeń klientów"],e:"Revenue Management → zarządzanie ofertami, cenami, umowami i przychodami."},{id:"w01-16",q:"Co oznacza dopisek '360' w nazwie, np. Sales 360?",a:["Nazwę technologii oferowanej przez Salesforce w postaci aplikacji","Marketingowy ozdobnik jak 'Cloud'","Wersję API aplikacji","Liczbę dostępnych licencji"],e:"Ozdobnikami marketingowymi są 'Cloud' i 'Agentforce' (Sales Cloud, Agentforce Sales). '360' to nazwa technologii oferowanej w postaci aplikacji."},{id:"w01-17",q:"Czym uruchamia się aplikacje w Org-u Salesforce?",a:["App Launcherem","Object Managerem","Developer Console","Setup Audit Trail"],e:"Aplikacje uruchamia się za pomocą App Launchera."},{id:"w01-18",q:"Od czego zależy dostępność aplikacji SaaS Salesforce w Org-u?",a:["Od wykupionej licencji","Od wersji przeglądarki","Od liczby rekordów w bazie","Od wybranego języka programowania"],e:"Dostępność aplikacji zależy od wykupionej licencji. W Org-ach edukacyjnych i developerskich dostępny jest szeroki wachlarz aplikacji."},{id:"w01-19",q:"Co dzieje się z aplikacją utworzoną przez dewelopera w Org-u?",a:["Zostaje automatycznie dodana do zbioru aplikacji Org-a","Trzeba ją opublikować w AppExchange, aby była widoczna","Działa tylko w Scratch Org","Jest dostępna wyłącznie dla użytkowników zewnętrznych"],e:"Aplikacje utworzone w Org-u przez dewelopera są automatycznie dodawane do zbioru aplikacji Org-a."},{id:"w01-20",q:"Co zapewnia spójność danych między aplikacjami w Org-u?",a:["Wszystkie aplikacje działają na tym samym modelu danych","Każda aplikacja ma własną, synchronizowaną bazę","Integracja przez MuleSoft","Codzienna replikacja do Sandboxa"],e:"Wszystkie aplikacje działają na tym samym modelu danych."},{id:"w01-21",q:"Do czego służy Salesforce Experience Cloud?",a:["Do budowy aplikacji internetowych dla użytkowników zewnętrznych (klientów, partnerów)","Do zarządzania wewnętrzną sprzedażą","Do pisania testów jednostkowych Apex","Do tworzenia kopii Org-a"],e:"Experience Cloud to platforma do budowy aplikacji internetowych dla użytkowników zewnętrznych: logowanie, samoobsługa, spersonalizowane serwisy."},{id:"w01-22",q:"Kto korzysta z aplikacji Experience, a kto ze standardowych aplikacji Salesforce?",a:["Experience – klienci i partnerzy; Salesforce – pracownicy firmy","Experience – pracownicy; Salesforce – klienci","Obie grupy korzystają wyłącznie z aplikacji Salesforce","Experience – tylko administratorzy"],e:"Aplikacje Salesforce służą użytkownikom wewnętrznym (pracownikom), a aplikacje Experience użytkownikom zewnętrznym (klientom i partnerom)."},{id:"w01-23",q:"Jak nazywa się standardowy wygląd aplikacji Salesforce?",a:["Lightning Experience","Salesforce Classic Shell","Visualforce Theme","Experience Builder UI"],e:"Standardowy wygląd to styl Lightning Experience."},{id:"w01-24",q:"Które narzędzie jest narzędziem low-code?",a:["Flow","Apex","SOQL","LWC"],e:"Low-code: Object Manager, Flow, Lightning App Builder. Pro-code: Apex, LWC, SOQL/SOSL, API."},{id:"w01-25",q:"Które narzędzie należy do kategorii pro-code?",a:["Apex","Lightning App Builder","Object Manager","Flow"],e:"Pro-code: Apex, LWC, SOQL/SOSL, API."},{id:"w01-26",q:"Które narzędzie jest wymienione w kategorii integracji?",a:["MuleSoft","Object Manager","Lightning App Builder","Flow"],e:"Integracja: Platform Events, API (REST, GraphQL), MuleSoft."},{id:"w01-27",q:"Co jest wymienione w kategorii AI wśród narzędzi dewelopera?",a:["Prompt engineering, generatywna AI, agenci AI","Platform Events i MuleSoft","Object Manager i Flow","SOQL i SOSL"],e:"AI: prompt engineering, generatywna AI, agenci AI."},{id:"w01-28",q:"Co potrafi developer Salesforce wg wykładu?",a:["Analizować wymagania biznesowe i dobierać najlepsze rozwiązanie spośród technologii Salesforce","Administrować fizycznymi serwerami Salesforce","Tworzyć system operacyjny dla Org-a","Wyłącznie pisać kod Apex bez kontaktu z biznesem"],e:"Developer analizuje i rozumie wymagania biznesowe oraz dobiera najlepsze rozwiązanie: low-code, pro-code, AI lub integrację."},{id:"w01-29",q:"Ile głównych wydań platformy Salesforce przypada na rok?",a:["Trzy: Spring, Summer, Winter","Dwa: Spring i Winter","Cztery: po jednym na kwartał","Jedno roczne wydanie"],e:"Trzy wydania: Spring (luty), Summer (czerwiec), Winter (październik)."},{id:"w01-30",q:"W którym miesiącu wychodzi wydanie Winter?",a:["W październiku","W lutym","W czerwcu","W grudniu"],e:"Spring – luty, Summer – czerwiec, Winter – październik (Winter'27 wychodzi jesienią 2026)."},{id:"w01-31",q:"Jaka wersja API odpowiada wydaniu Spring'26?",a:["66.0","67.0","68.0","60.0"],e:"Spring'26 → 66.0, Summer'26 → 67.0, Winter'27 → 68.0. Każde wydanie podnosi wersję API o 1."},{id:"w01-32",q:"Jak długo minimum nowe wersje API zachowują kompatybilność ze starszymi?",a:["Minimum 3 lata","Minimum 1 rok","Minimum 6 miesięcy","Bezterminowo"],e:"Nowe wersje API zachowują kompatybilność ze starszymi przez określony czas, minimum 3 lata."},{id:"w01-33",q:"Gdzie zapisywana jest wersja API?",a:["W metadanych komponentu/projektu","W rekordzie użytkownika","W nazwie Org-a","W ciasteczku przeglądarki"],e:"Wersja API jest zapisywana w metadanych komponentu lub projektu i wpływa na dostępne możliwości oraz zachowanie kodu."},{id:"w01-34",q:"Co przede wszystkim określa wersja API?",a:["Kontrakt i zachowanie platformy dostępne dla danego klienta, komponentu lub żądania","Cenę licencji Salesforce","Wygląd interfejsu Lightning","Liczbę użytkowników Org-a"],e:"API określa przede wszystkim kontrakt i zachowanie platformy."},{id:"w01-35",q:"Która platforma jest alternatywą PaaS mocno zintegrowaną z Microsoft 365, Azure i Dynamics 365?",a:["Microsoft Power Platform","Oracle APEX","Google AppSheet","ServiceNow App Engine"],e:"Microsoft Power Platform to low-code/no-code zintegrowane z Microsoft 365, Azure i Dynamics 365."},{id:"w01-36",q:"Która alternatywa jest low-code PaaS szczególnie mocno związaną z bazą Oracle?",a:["Oracle APEX","Siemens Mendix","OutSystems","Google AppSheet"],e:"Oracle APEX to low-code PaaS mocno związany z bazą Oracle. Nie mylić z językiem Apex w Salesforce!"},{id:"w01-37",q:"Jaka jest wspólna cecha współczesnych platform aplikacyjnych wg wykładu?",a:["Integracja z AI i możliwość tworzenia agentów AI","Brak możliwości pisania kodu","Wyłącznie instalacja on-premise","Jedna, wspólna baza danych dla wszystkich dostawców"],e:"Wspólną cechą współczesnych platform jest integracja z AI i możliwość tworzenia agentów AI."},{id:"w01-38",q:"Co NIE należy do zakresu informatyki biznesowej (zastosowań Salesforce)?",a:["Administracja serwerami","Modelowanie procesów biznesowych","Automatyzacja procesów","Analiza wymagań biznesowych"],e:"Poza zakresem są: budowanie i utrzymywanie infrastruktury, administracja serwerami, tworzenie aplikacji od podstaw, podstawowe problemy informatyki."},{id:"w01-39",q:"Który element należy do zakresu informatyki biznesowej?",a:["Adaptacja gotowych rozwiązań","Tworzenie aplikacji od podstaw","Budowanie infrastruktury","Podstawowe problemy informatyki"],e:"W zakresie są m.in.: analiza wymagań, modelowanie procesów, automatyzacja, architektura systemów przedsiębiorstwa, AI w biznesie i adaptacja gotowych rozwiązań."},{id:"w01-40",q:"Która aplikacja Customer 360 dotyczy kampanii marketingowych i pozyskiwania klientów?",a:["Marketing","Sales","Commerce","Contact Center"],e:"Marketing → kampanie marketingowe i pozyskiwanie klientów."}],tp={id:ep,title:np,questions:ap},op="w02",ip="W2 · Czym są komponenty",rp=[{id:"w02-01",q:"Jak definiuje komponent norma ISO/IEC 15026:1998?",a:["Jednostka o wyodrębnionej strukturze (np. zespół lub moduł oprogramowania) w systemie rozpatrywanym na określonym poziomie analizy","Jedna z części składających się na system","Klasa dziedzicząca po klasie bazowej Component","Zbiór testów jednostkowych systemu"],e:"ISO/IEC 15026:1998: jednostka o wyodrębnionej strukturze, np. zespół lub moduł oprogramowania, w systemie rozpatrywanym na określonym poziomie analizy."},{id:"w02-02",q:"Która definicja komponentu pochodzi z normy ISO/IEC 29881:2008 (FiSMA)?",a:["Zbiór usług funkcjonalnych reprezentujący dobrze zdefiniowany zestaw funkcji, rozróżnialny za pomocą unikalnej nazwy","Jedna z części składających się na system","Moduł interfejsu użytkownika zbudowany z HTML, JS i CSS","Jednostka wdrożeniowa w kontenerze"],e:"ISO/IEC 29881:2008: zbiór usług funkcjonalnych, który po zaimplementowaniu reprezentuje dobrze zdefiniowany zestaw funkcji i jest rozróżnialny za pomocą unikalnej nazwy."},{id:"w02-03",q:"Jak brzmi definicja komponentu wg IEEE 829-2008?",a:["Jedna z części składających się na system","Zbiór usług funkcjonalnych o unikalnej nazwie","Jednostka o wyodrębnionej strukturze na określonym poziomie analizy","Moduł z własnym kodem, danymi i logiką"],e:"IEEE 829-2008 (Standard for Software and System Test Documentation): komponent to jedna z części składających się na system."},{id:"w02-04",q:"Z jakiego standardu pochodzi definicja komponentu IEEE omawiana na wykładzie?",a:["IEEE 829-2008 – dokumentacja testów oprogramowania i systemów","IEEE 754 – arytmetyka zmiennoprzecinkowa","IEEE 802.11 – sieci bezprzewodowe","IEEE 1471 – opis architektury"],e:"IEEE 829-2008: Standard for Software and System Test Documentation."},{id:"w02-05",q:"Która cecha komponentu we współczesnym przemyśle oznacza, że ten sam element może trafić do różnych systemów?",a:["Ten sam komponent może być częścią różnych systemów","Komponent jest zawsze niezbędny","Komponent nie posiada interfejsu","Komponent nie może składać się z innych komponentów"],e:"W przemyśle: ten sam komponent może być częścią różnych systemów, może być wyodrębniony, produkowany odrębnie i wymienialny."},{id:"w02-06",q:"Jak komponent współpracuje z resztą systemu (perspektywa przemysłowa)?",a:["Poprzez określony interfejs","Poprzez bezpośredni dostęp do pamięci innych części","Poprzez dziedziczenie po innych komponentach","Nie współpracuje, działa całkowicie samodzielnie"],e:"Komponent współpracuje z pozostałą częścią systemu poprzez określony interfejs."},{id:"w02-07",q:"Jaką architekturę daje to, że komponent może być zbudowany z innych komponentów?",a:["Hierarchiczną","Płaską","Monolityczną","Peer-to-peer"],e:"Komponent może być zbudowany z innych komponentów, co daje architekturę hierarchiczną."},{id:"w02-08",q:"Jakie rodzaje komponentów wyróżnia się ze względu na to, czy są niezbędne do działania systemu?",a:["Krytyczne, opcjonalne, awaryjne","Publiczne, prywatne, chronione","Statyczne, dynamiczne, abstrakcyjne","Frontendowe, backendowe, bazodanowe"],e:"Komponent może nie być niezbędny. Wyróżnia się komponenty krytyczne, opcjonalne i awaryjne."},{id:"w02-09",q:"Jak we współczesnej inżynierii oprogramowania powstają większe komponenty?",a:["Przez kompozycję mniejszych komponentów","Przez dziedziczenie po mniejszych komponentach","Przez kopiowanie kodu źródłowego","Przez łączenie baz danych"],e:"Kompozycja: większe komponenty powstają z mniejszych. Slajd podkreśla: ⚠️ nie dziedziczenie."},{id:"w02-10",q:"Który mechanizm wykład wyraźnie wskazuje jako NIE będący sposobem budowy komponentów?",a:["Dziedziczenie","Kompozycja","Hermetyzacja","Izolacja"],e:"Na slajdzie: 'Kompozycja – większe komponenty powstają z mniejszych – ⚠️ Nie dziedziczenie'."},{id:"w02-11",q:"Co oznacza izolacja komponentu?",a:["Hermetyzację realizacji i niezależność implementacji","Brak jakiegokolwiek interfejsu","Uruchamianie komponentu na osobnym serwerze","Zakaz ponownego użycia"],e:"Izolacja = hermetyzacja realizacji + niezależność implementacji."},{id:"w02-12",q:"Co oznacza, że komponent ma 'zamkniętą funkcjonalność'?",a:["Ma własny kod, dane i logikę","Nie można go już modyfikować","Nie ma dostępu do sieci","Jest dostępny tylko dla administratora"],e:"Zamknięta funkcjonalność: własny kod, dane i logika. To moduł o określonej odpowiedzialności."},{id:"w02-13",q:"Co oznacza ponowne wykorzystanie (reuse) komponentu?",a:["Ten sam komponent jest używany w różnych systemach","Komponent jest kopiowany i modyfikowany w każdym projekcie","Komponent uruchamia się wielokrotnie w pętli","Komponent dziedziczy po wielu klasach"],e:"Ponowne wykorzystanie: ten sam komponent w różnych systemach."},{id:"w02-14",q:"Która technologia NIE jest wymieniona jako forma komponentu we współczesnej inżynierii oprogramowania?",a:["Arkusze kalkulacyjne","Mikrousługi i API","Biblioteki i pakiety","Kontenery i usługi chmurowe"],e:"Wymienione technologie: klasy i moduły, biblioteki i pakiety, komponenty UI, mikrousługi i API, kontenery i usługi chmurowe."},{id:"w02-15",q:"Do jakiej kategorii komponentów Salesforce należą obiekty, pola i rekordy?",a:["Komponenty danych","Komponenty logiki biznesowej","Komponenty interfejsu","Komponenty integracyjne"],e:"Komponenty danych: obiekty, pola, rekordy."},{id:"w02-16",q:"Które elementy Salesforce to komponenty logiki biznesowej?",a:["Flow, Trigger, Validation Rules, Actions","Obiekty, pola, rekordy","Dashboard, kalendarze, detale","REST API, GraphQL API"],e:"Komponenty logiki biznesowej: Flow, Trigger, Validation Rules, Actions."},{id:"w02-17",q:"Z czego zbudowane są Lightning Web Components (komponenty interfejsu)?",a:["HTML + JS + CSS","Apex + SOQL","XML + XSLT","Java + JSP"],e:"Komponenty interfejsu: Lightning Web Components (HTML + JS + CSS)."},{id:"w02-18",q:"Do jakiej kategorii komponentów Salesforce należą Dashboard, Detale i Kalendarze?",a:["Komponenty aplikacji","Komponenty danych","Komponenty AI","Komponenty integracyjne"],e:"Komponenty aplikacji: Dashboard, detale, kalendarze."},{id:"w02-19",q:"Które elementy to komponenty integracyjne w Salesforce?",a:["REST API, GraphQL API","Flow, Trigger","Prompty, agenty","Obiekty, pola"],e:"Komponenty integracyjne: REST API i GraphQL API."},{id:"w02-20",q:"Co należy do komponentów AI w Salesforce?",a:["Prompty, agenty, akcje agentów","Validation Rules i Flow","Dashboard i kalendarze","Rekordy i pola"],e:"Komponenty AI: prompty, agenty, akcje agentów."},{id:"w02-21",q:"Do której kategorii komponentów Salesforce należy Validation Rule?",a:["Logiki biznesowej","Danych","Interfejsu","Aplikacji"],e:"Validation Rules są komponentem logiki biznesowej, obok Flow, Triggerów i Actions."},{id:"w02-22",q:"Która cecha NIE opisuje komponentu we współczesnym przemyśle?",a:["Musi być zawsze wyprodukowany razem z całym systemem","Wymienialny","Produkowany odrębnie","Pełni określoną funkcję w systemie"],e:"Komponent jest produkowany odrębnie, wymienialny, może być wyodrębniony jako osobna jednostka i pełni określoną funkcję."}],lp={id:op,title:ip,questions:rp},sp="w03",up="W3 · Model danych Salesforce",cp=[{id:"w03-01",q:"Czym jest model danych Salesforce wg wykładu?",a:["Elementem architektury platformy biznesowej, a nie tylko strukturą obiektów w Org-u","Wyłącznie zbiorem tabel w bazie danych","Fizycznym serwerem bazy danych","Plikiem konfiguracyjnym XML"],e:"Model danych jest elementem architektury platformy biznesowej, a nie tylko strukturą obiektów w Org-u."},{id:"w03-02",q:"Na co przyjęty model danych NIE wpływa bezpośrednio wg wykładu?",a:["Cenę licencji Salesforce","Kontrolę dostępu","Automatyzację procesów","Działanie sztucznej inteligencji"],e:"Model danych wpływa na: sposób przechowania informacji, działanie aplikacji, automatyzację, kontrolę dostępu, AI i integracje."},{id:"w03-03",q:"Jaka jest różnica między bazą danych a modelem danych?",a:["Baza danych to mechanizm przechowywania, a model danych opisuje znaczenie, strukturę i powiązania informacji","To synonimy","Model danych to fizyczny plik bazy","Baza danych opisuje znaczenie danych, a model danych je przechowuje"],e:"Baza danych jest jednym z mechanizmów przechowywania informacji, natomiast model danych opisuje ich znaczenie, strukturę i powiązania."},{id:"w03-04",q:"Co obejmuje model danych Salesforce?",a:["Definicje obiektów, ich pól, relacji między obiektami oraz reguł opisujących dane","Tylko listę tabel","Tylko kod Apex","Tylko layouty stron"],e:"Model danych obejmuje definicje obiektów, pól, relacji oraz reguł opisujących dane."},{id:"w03-05",q:"Czy model danych może obejmować dane, których fizycznie nie ma w Org-u?",a:["Tak, dane z systemów zewnętrznych","Nie, tylko dane fizycznie w Org-u","Tylko dane z innego Org-a Salesforce","Tylko dane z Sandboxa"],e:"Model danych może obejmować dane z systemów zewnętrznych, które nie są fizycznie przechowywane w Org-u."},{id:"w03-06",q:"Która perspektywa NIE jest wymieniona jako perspektywa modelu danych?",a:["Sprzętowa","Bezpieczeństwa","Integracyjna","AI"],e:"Perspektywy: biznesowa, aplikacyjna, bezpieczeństwa, integracyjna, analityczna, AI."},{id:"w03-07",q:"Co w pierwszej kolejności powinien odzwierciedlać model danych (perspektywa biznesowa)?",a:["Dziedzinę biznesową przedsiębiorstwa","Strukturę serwera bazy danych","Wymagania wydajnościowe zapytań","Strukturę kodu Apex"],e:"Model danych w pierwszej kolejności powinien odzwierciedlać dziedzinę biznesową przedsiębiorstwa."},{id:"w03-08",q:"Z czego powinny wynikać relacje między obiektami (perspektywa biznesowa)?",a:["Bezpośrednio z procesów biznesowych","Z ograniczeń technicznych bazy","Z liczby pól w obiekcie","Z wersji API"],e:"Relacje między obiektami powinny wynikać bezpośrednio z procesów biznesowych."},{id:"w03-09",q:"Co reprezentuje standardowy obiekt Account?",a:["Firmę lub klienta","Osobę powiązaną z firmą","Szansę sprzedaży","Konto użytkownika Salesforce"],e:"Account = firma lub klient. Contact = osoba powiązana z firmą. Opportunity = szansa sprzedaży."},{id:"w03-10",q:"Co reprezentuje standardowy obiekt Contact?",a:["Osobę powiązaną z firmą","Firmę lub klienta","Szansę sprzedaży","Zamówienie"],e:"Contact = osoba powiązana z firmą (Account)."},{id:"w03-11",q:"Co reprezentuje standardowy obiekt Opportunity?",a:["Szansę sprzedaży","Produkt","Klienta","Zgłoszenie serwisowe"],e:"Opportunity = szansa sprzedaży."},{id:"w03-12",q:"Czy gotowy model danych Salesforce można rozszerzać?",a:["Tak, o własne obiekty, pola i relacje","Nie, jest zamknięty","Tylko o nowe pola, bez nowych obiektów","Tylko przez zakup aplikacji z AppExchange"],e:"Salesforce dostarcza gotowy model danych dla standardowych obszarów biznesowych, który można rozszerzać o własne obiekty, pola i relacje."},{id:"w03-13",q:"Co decyduje o tym, jaki komponent UI zostanie użyty do prezentacji danych (perspektywa aplikacyjna)?",a:["Typ pola danych","Nazwa obiektu","Wersja przeglądarki","Liczba rekordów"],e:"Przykład z perspektywy aplikacyjnej: typ pola danych decyduje, jaki komponent UI zostanie użyty do ich prezentacji."},{id:"w03-14",q:"Co ograniczają reguły walidacyjne (perspektywa aplikacyjna)?",a:["Dziedzinę danych","Liczbę użytkowników","Wersję API","Dostęp do Org-a"],e:"Reguły walidacyjne ograniczają dziedzinę danych, czyli dopuszczalne wartości."},{id:"w03-15",q:"Co określają relacje w perspektywie aplikacyjnej?",a:["Źródło danych dla logiki aplikacji","Kolor przycisków w UI","Licencje użytkowników","Wersję platformy"],e:"Relacje określają źródło danych dla logiki aplikacji."},{id:"w03-16",q:"Dla jakich mechanizmów model danych stanowi podstawę (perspektywa aplikacyjna)?",a:["Dla interfejsu użytkownika i logiki realizowanej w Flow, Apex i LWC","Tylko dla raportów","Tylko dla integracji REST","Tylko dla AppExchange"],e:"Model danych stanowi podstawę zarówno dla UI, jak i dla logiki aplikacji (Flow, Apex, LWC)."},{id:"w03-17",q:"Jakie trzy poziomy dostępu oferuje model danych (perspektywa bezpieczeństwa)?",a:["Obiekt, pole, rekord","Org, aplikacja, strona","Użytkownik, rola, profil","Tabela, kolumna, indeks"],e:"Poziomy dostępu: obiekt (CRUD), pole (odczyt/modyfikacja), rekord (do których rekordów jest dostęp)."},{id:"w03-18",q:"Co określa dostęp na poziomie obiektu?",a:["Czy użytkownik może odczytywać, tworzyć, modyfikować lub usuwać rekordy danego obiektu","Do których konkretnych rekordów użytkownik ma dostęp","Czy użytkownik może edytować konkretne pole","Czy użytkownik może zalogować się do Org-a"],e:"Obiekt → CRUD na rekordach obiektu. Pole → odczyt/modyfikacja pól. Rekord → które konkretne rekordy."},{id:"w03-19",q:"Co określa dostęp na poziomie rekordu?",a:["Do których konkretnych rekordów użytkownik ma dostęp","Czy użytkownik może tworzyć rekordy obiektu","Czy użytkownik widzi dane pole","Czy użytkownik może zmienić typ pola"],e:"Poziom rekordu określa, do których konkretnych rekordów użytkownik ma dostęp."},{id:"w03-20",q:"Jak relacja Master-Detail wpływa na bezpieczeństwo?",a:["Wiąże dostęp do rekordów podrzędnych z dostępem do rekordów nadrzędnych","Całkowicie wyłącza kontrolę dostępu","Daje każdemu dostęp do rekordów podrzędnych","Nie ma wpływu na dostęp"],e:"Relacja Master-Detail wiąże dostęp do rekordów podrzędnych z dostępem do rekordów nadrzędnych."},{id:"w03-21",q:"Czym są External Objects (obiekty zewnętrzne)?",a:["Dają dostęp do danych w zewnętrznym systemie bez przechowywania ich kopii w Salesforce","Obiektami kopiowanymi nocą z systemu zewnętrznego","Obiektami widocznymi tylko dla użytkowników Experience Cloud","Obiektami tworzonymi w Sandboxie"],e:"External Objects to dostęp do danych przechowywanych w zewnętrznym systemie, bez konieczności przechowywania ich kopii w Salesforce."},{id:"w03-22",q:"Do czego służy Salesforce Data 360?",a:["Integracja, harmonizacja i ujednolicanie danych z różnych źródeł oraz udostępnianie danych innym systemom","Tworzenie komponentów UI","Pisanie triggerów","Zarządzanie wersjami API"],e:"Data 360 służy do integracji, harmonizacji i ujednolicania danych z różnych źródeł oraz udostępniania danych wewnętrznych innym systemom."},{id:"w03-23",q:"Jak integracja ma się do modelu danych (perspektywa integracyjna)?",a:["Model opisuje strukturę informacji, integracja określa sposób ich wymiany; mechanizmy integracyjne zwykle wpływają na kształt modelu","Integracja nie ma związku z modelem danych","Integracja zastępuje model danych","Model danych definiuje protokół sieciowy integracji"],e:"Model danych opisuje strukturę informacji, integracja sposób ich udostępniania i wymiany. Mechanizmy integracyjne zwykle wpływają na kształt modelu."},{id:"w03-24",q:"Jaki przykład zastosowania uczenia maszynowego podano na wykładzie?",a:["Prognozowanie prawdopodobieństwa zamknięcia szansy sprzedaży","Generowanie kodu Apex","Projektowanie layoutów stron","Tworzenie Sandboxów"],e:"Uczenie maszynowe: wykorzystanie danych historycznych do prognozowania, np. prawdopodobieństwa zamknięcia szansy sprzedaży."},{id:"w03-25",q:"W jakich granicach agenci AI wykonują operacje na danych biznesowych?",a:["W ramach przyznanych uprawnień","Bez żadnych ograniczeń","Tylko na danych testowych","Tylko na danych zewnętrznych"],e:"Agenci AI korzystają z danych biznesowych, by odpowiadać, rekomendować i wykonywać operacje w ramach przyznanych uprawnień."},{id:"w03-26",q:"Czego podstawę stanowi model danych wg podsumowania wykładu?",a:["Raportowania, analityki i wykorzystania AI","Wyłącznie kopii zapasowych","Infrastruktury sieciowej","Wyboru przeglądarki"],e:"Model danych stanowi podstawę raportowania, analityki i wykorzystania AI. Wspiera też aplikacje, automatyzację, bezpieczeństwo i integracje."},{id:"w03-27",q:"Za pomocą czego model danych organizuje informacje?",a:["Obiektów, pól i relacji","Plików, folderów i dysków","Klas, metod i interfejsów","Stron, sekcji i zakładek"],e:"Model danych organizuje informacje za pomocą obiektów, pól i relacji."}],dp={id:sp,title:up,questions:cp},wp="w04",pp="W4 · Baza danych Salesforce",yp=[{id:"w04-01",q:"Czego deweloper Salesforce NIE robi w zakresie bazy danych Org-a?",a:["Nie wybiera bazy danych ani nie tworzy kluczy głównych i obcych","Nie tworzy własnych obiektów","Nie dodaje pól do obiektów","Nie definiuje relacji między obiektami"],e:"Salesforce ukrywa szczegóły techniczne: nie wybiera się bazy, nie zarządza infrastrukturą, nie konfiguruje połączeń ani ORM, nie używa SQL i nie tworzy kluczy głównych i obcych."},{id:"w04-02",q:"Jak wygląda kwestia ORM w Org-u Salesforce?",a:["ORM jest już wdrożony i działa, nie trzeba go instalować","Trzeba zainstalować Hibernate","Trzeba skonfigurować własny ORM w Apex","Salesforce nie używa ORM"],e:"Nie instaluje się bibliotek ORM, bo ORM w Org-u jest już wdrożony i działa."},{id:"w04-03",q:"Jak w Salesforce nazywa się odpowiednik tabeli z relacyjnej bazy danych?",a:["Obiekt","Pole","Rekord","Lista"],e:"Tabela → Obiekt, Kolumna → Pole, Wiersz → Rekord."},{id:"w04-04",q:"Jak w Salesforce nazywa się odpowiednik kolumny tabeli?",a:["Pole","Obiekt","Rekord","Atrybut"],e:"Kolumna → Pole (Field)."},{id:"w04-05",q:"Jak w Salesforce nazywa się odpowiednik wiersza tabeli?",a:["Rekord","Pole","Obiekt","Krotka"],e:"Wiersz → Rekord (Record)."},{id:"w04-06",q:"Czy baza danych dostarczona z nowym Org-iem jest pusta?",a:["Nie, zawiera obiekty standardowe często wykorzystywane w problemach biznesowych","Tak, jest całkowicie pusta","Zawiera tylko obiekt User","Zawiera tylko dane przykładowe bez obiektów"],e:"Baza nie jest pusta. Są w niej obiekty standardowe z polami standardowymi."},{id:"w04-07",q:"Co zaleca Salesforce w kwestii obiektów?",a:["Używanie obiektów standardowych","Tworzenie wyłącznie obiektów Custom","Unikanie obiektów standardowych","Usuwanie nieużywanych obiektów standardowych"],e:"Salesforce zaleca używanie obiektów standardowych."},{id:"w04-08",q:"Jaka końcówka jest automatycznie dodawana do nazwy obiektu Custom?",a:["__c","__r","_custom","__x"],e:"Obiekty dodane do Org-a nazywane są Custom i mają automatycznie dodawaną końcówkę __c."},{id:"w04-09",q:"Jakie są podstawowe narzędzia tworzenia i edycji obiektów?",a:["Object Manager i Schema Builder","Developer Console i Workbench","App Launcher i AppExchange","Flow Builder i Process Builder"],e:"Podstawowe narzędzia: Object Manager i Schema Builder."},{id:"w04-10",q:"Czy można dodawać własne pola do obiektów standardowych?",a:["Tak","Nie, tylko do obiektów Custom","Tylko w Sandboxie","Tylko przez Apex"],e:"Istnieje możliwość dodawania własnych pól do obiektów standardowych."},{id:"w04-11",q:"Czym jest 'Object' w Salesforce w porównaniu z obiektem w OOP?",a:["Przede wszystkim definicją typu danych (analogia: tabela), a nie instancją jak w OOP","Tym samym co obiekt w OOP, czyli instancją klasy","Klasą Apex","Pojedynczym rekordem"],e:"Object w Salesforce to definicja typu danych (jak tabela). Record to konkretny element tego typu."},{id:"w04-12",q:"Jak dostać się do Object Managera?",a:["Setup → Object Manager","App Launcher → Object Manager","Developer Console → Object Manager","Profil użytkownika → Object Manager"],e:"Dostęp: Setup → Object Manager."},{id:"w04-13",q:"Czym różni się 'Custom Object from Spreadsheet' od 'Custom Object'?",a:["Pozwala również zaimportować dane, a 'Custom Object' tworzy tylko pusty obiekt","Tworzy obiekt tylko do odczytu","Tworzy obiekt zewnętrzny","Nie różni się niczym"],e:"Custom Object tworzy tylko pusty obiekt. Custom Object from Spreadsheet umożliwia również import danych."},{id:"w04-14",q:"Które narzędzie służy do wizualizacji schematu bazy danych?",a:["Schema Builder","Object Manager","App Launcher","Lightning App Builder"],e:"Wizualizacja schematu bazy danych to Schema Builder."},{id:"w04-15",q:"Co to jest Object Name przy tworzeniu obiektu?",a:["Nazwa techniczna wykorzystywana w konfiguracji i kodzie","Nazwa wyświetlana w interfejsie","Nazwa pola identyfikującego rekord","Liczba mnoga nazwy obiektu"],e:"Object Name to nazwa techniczna. Label i Plural Label to nazwy wyświetlane w interfejsie."},{id:"w04-16",q:"Do czego służą Label i Plural Label?",a:["To nazwa obiektu wyświetlana w interfejsie","To nazwa techniczna w kodzie","To nazwa pola klucza","To opis obiektu w raportach"],e:"Label, Plural Label to nazwa obiektu wyświetlana w interfejsie."},{id:"w04-17",q:"Czym jest Record Name?",a:["Polem identyfikującym rekord, definiowanym automatycznie przy tworzeniu obiektu (funkcja podobna do klucza głównego)","Technicznym identyfikatorem obiektu","Etykietą obiektu w liczbie mnogiej","Polem relacji do obiektu nadrzędnego"],e:"Record Name to pole identyfikujące rekord, tworzone automatycznie. Pełni funkcję podobną do klucza głównego."},{id:"w04-18",q:"Jakie typy danych może mieć pole Record Name?",a:["Text lub Auto Number","Number lub Currency","Date lub Date/Time","Picklist lub Checkbox"],e:"Data Type pola Record Name: Text albo Auto Number."},{id:"w04-19",q:"Co określa opcja Deployment Status obiektu?",a:["Czy obiekt jest dostępny dla użytkowników","Czy obiekt można używać w raportach","Czy rekordy można wyszukiwać","Czy śledzona jest historia pól"],e:"Deployment Status określa, czy obiekt jest dostępny dla użytkowników."},{id:"w04-20",q:"Która opcja pozwala powiązać rekordy obiektu z zadaniami i wydarzeniami?",a:["Allow Activities","Allow Reports","Allow Sharing","Track Field History"],e:"Allow Activities pozwala powiązać rekordy z aktywnościami, np. zadaniami i wydarzeniami."},{id:"w04-21",q:"Która opcja obiektu umożliwia stosowanie mechanizmów współdzielenia rekordów i kontroli dostępu?",a:["Allow Sharing","Allow Search","Allow Activities","Deployment Status"],e:"Allow Sharing umożliwia mechanizmy współdzielenia rekordów i kontroli dostępu."},{id:"w04-22",q:"Która opcja pozwala śledzić zmiany wartości wybranych pól?",a:["Track Field History","Allow Reports","Allow Search","Field Access"],e:"Track Field History pozwala śledzić zmiany wartości wybranych pól."},{id:"w04-23",q:"Która opcja umożliwia wykorzystanie rekordów obiektu w raportach i analizach?",a:["Allow Reports","Allow Activities","Allow Sharing","Search Layouts"],e:"Allow Reports umożliwia wykorzystanie rekordów w raportach i analizach."},{id:"w04-24",q:"Która sekcja konfiguracji obiektu służy do sprawdzania poprawności danych przed zapisem rekordu?",a:["Validation Rules","Triggers","Field Access","Record Types"],e:"Validation Rules sprawdzają poprawność danych przed zapisaniem rekordu."},{id:"w04-25",q:"Za co odpowiada sekcja Triggers w konfiguracji obiektu?",a:["Wykonywanie kodu Apex w odpowiedzi na operacje na rekordach","Sprawdzanie poprawności danych deklaratywnie","Rozmieszczenie pól na stronie","Uprawnienia do pól"],e:"Triggers wykonują kod Apex w odpowiedzi na operacje na rekordach."},{id:"w04-26",q:"Czym różni się Object Access od Field Access?",a:["Object Access to uprawnienia do operacji na obiekcie, a Field Access do odczytu i edycji poszczególnych pól","To to samo","Object Access dotyczy UI, Field Access bazy danych","Field Access dotyczy rekordów, Object Access pól"],e:"Object Access to uprawnienia do operacji na obiekcie. Field Access to uprawnienia do odczytu i edycji pól."},{id:"w04-27",q:"Co definiują Page Layouts?",a:["Rozmieszczenie pól, sekcji i powiązanych list na stronie rekordu","Najważniejsze informacje w skróconym widoku rekordu","Informacje w wynikach wyszukiwania","Warianty procesów biznesowych"],e:"Page Layouts to rozmieszczenie pól, sekcji i powiązanych list na stronie prezentacyjnej rekordu."},{id:"w04-28",q:"Co definiują Compact Layouts?",a:["Wybór najważniejszych informacji wyświetlanych w skróconym widoku rekordu","Pełne rozmieszczenie pól na stronie rekordu","Kolumny w wynikach wyszukiwania","Limity obiektu"],e:"Compact Layouts to najważniejsze informacje w skróconym widoku rekordu."},{id:"w04-29",q:"Do czego służą Record Types?",a:["Do różnych wariantów obsługi rekordów tego samego obiektu, np. różnych procesów biznesowych","Do określania typu danych pola","Do tworzenia nowych obiektów","Do definiowania relacji"],e:"Record Types to różne warianty obsługi rekordów tego samego obiektu, np. różne procesy biznesowe."},{id:"w04-30",q:"Co określają Search Layouts?",a:["Informacje prezentowane w wynikach wyszukiwania","Czy obiekt jest wyszukiwalny","Kolejność pól w formularzu","Uprawnienia do wyszukiwania"],e:"Search Layouts określają informacje prezentowane w wynikach wyszukiwania. To, czy obiekt w ogóle jest wyszukiwalny, określa Allow Search."},{id:"w04-31",q:"Które pole jest w obiekcie, ale nie jest wyświetlane na liście Fields & Relationships?",a:["RecordID","Created By","Owner","Last Modified By"],e:"Jest jeszcze pole RecordID, ale nie jest wyświetlane."},{id:"w04-32",q:"Jaki jest pierwszy krok tworzenia pola obiektu?",a:["Zdefiniowanie typu danych","Określenie nazwy i etykiety","Zdefiniowanie bezpieczeństwa","Dodanie do formularza"],e:"Krok 1: typ danych. Potem nazwa, etykieta, wymagalność, nal Lookup to relacja luźna z tabelą zewnętrzną."},{id:"w05-04",q:"Czym jest External Lookup Relationship?",a:["Relacją luźną między obiektem w Org-u a tabelą w zewnętrznej bazie danych","Relacją silną z obiektem z innego Org-a","Relacją między dwoma obiektami zewnętrznymi zawsze kaskadową","Relacją Master-Detail do Sandboxa"],e:"External Lookup to relacja luźna między obiektem w bazie Org-a i tabelą w zewnętrznej bazie danych."},{id:"w05-05",q:"Co wskazuje systemowe pole Created By?",a:["Użytkownika, który utworzył rekord","Użytkownika, który ostatnio zmodyfikował rekord","Właściciela rekordu","Datę utworzenia rekordu"],e:"Created By (Lookup) to użytkownik, który utworzył rekord."},{id:"w05-06",q:"Na co może wskazywać pole Owner?",a:["Na użytkownika lub kolejkę odpowiedzialną za rekord","Tylko na administratora Org-a","Na obiekt Master","Na konto (Account)"],e:"Owner (Lookup) to użytkownik lub kolejka odpowiedzialna za rekord, jeśli obiekt obsługuje własność rekordów."},{id:"w05-07",q:"Jakiego typu są pola systemowe Created By, Last Modified By i Owner?",a:["Lookup","Master-Detail","Text","Formula"],e:"Wszystkie są polami typu Lookup do użytkownika (Owner także do kolejki)."},{id:"w05-08",q:"Czy predefiniowane relacje Salesforce zawsze można usunąć?",a:["Nie, niektóre są niezbędne do działania funkcji i nie można ich usunąć ani dowolnie modyfikować","Tak, wszystkie można usunąć","Tak, ale tylko w Sandboxie","Nie, ale można je dowolnie modyfikować"],e:"Niektóre predefiniowane relacje są niezbędne do działania określonych funkcji i nie można ich usunąć ani dowolnie modyfikować."},{id:"w05-09",q:"Który przykład to relacja standardowego modelu danych?",a:["Opportunity – Account","Coach – Room","Product – Category (custom)","Event__c – Room__c"],e:"Przykłady standardowe: Contact–Account, Opportunity–Account, Case–Account."},{id:"w05-10",q:"Jakimi typami relacji tworzy się relacje niestandardowe?",a:["Lookup lub Master-Detail","Tylko External Lookup","Tylko Master-Detail","Hierarchical i Many-to-Many"],e:"Relacje niestandardowe tworzy się za pomocą typów Lookup lub Master-Detail."},{id:"w05-11",q:"Jaka jest krotność relacji Master-Detail?",a:["Jeden (Master) do wielu (Detail)","Wiele do wielu","Jeden do jednego","Wiele (Master) do jednego (Detail)"],e:"Master-Detail to relacja jeden (Master) do wielu (Detail)."},{id:"w05-12",q:"Który przykład z wykładu ilustruje relację Master-Detail?",a:["Polisa ubezpieczeniowa (Master) i roszczenie (Detail)","Kategoria (Parent) i produkt (Child)","Użytkownik i rekord (Created By)","Firma i kontakt"],e:"Roszczenie (Detail) nie może istnieć bez polisy (Master). Produkt–kategoria to przykład Lookup."},{id:"w05-13",q:"Czy rekord Detail może istnieć bez rekordu Master?",a:["Nie, rekord Master musi istnieć w chwili tworzenia Detail","Tak, zawsze","Tak, jeśli pole ma wartość null","Tylko w Sandboxie"],e:"Obiekt Detail nie może istnieć bez obiektu Master. Rekord Master musi istnieć w chwili tworzenia rekordu Detail."},{id:"w05-14",q:"Gdzie tworzy się pole przy relacji Master-Detail?",a:["W obiekcie Detail; w Master nie tworzy się żadnego pola","W obiekcie Master","W obu obiektach","W obiekcie pośredniczącym"],e:"W obiekcie Detail tworzymy pole typu Master-Detail. W obiekcie Master nie tworzymy żadnego pola, bo przechowuje on automatyczną listę Detail."},{id:"w05-15",q:"Czy można wstawić null w pole typu Master-Detail?",a:["Nie","Tak","Tak, ale tylko przez Apex","Tak, jeśli obiekt Master został usunięty"],e:"Relacja silna oznacza m.in. brak możliwości wstawienia null w pole Master-Detail."},{id:"w05-16",q:"Co dzieje się z rekordami Detail po usunięciu rekordu Master?",a:["Są usuwane kaskadowo","Pozostają z pustym polem relacji","Są przenoszone do innego Master","Usunięcie Master jest zablokowane"],e:"Master-Detail daje kaskadowe usuwanie rekordów Detail po usunięciu rekordu Master."},{id:"w05-17",q:"Do czego służą pola Roll-Up Summary i gdzie są dostępne?",a:["Do automatycznej agregacji danych rekordów Detail; dostępne w obiekcie Master relacji Master-Detail","Do agregacji w obiekcie Parent relacji Lookup","Do sumowania pól tego samego rekordu","Do agregacji danych zewnętrznych"],e:"Roll-Up Summary jest dostępne w obiekcie Master (tylko przy Master-Detail) i automatycznie agreguje dane rekordów Detail."},{id:"w05-18",q:"Skąd obiekt Detail bierze uprawnienia, widoczność i właściciela?",a:["Dziedziczy je po obiekcie Master; Detail nie ma pola Owner","Ma własne pole Owner i własne uprawnienia","Od administratora Org-a","Od użytkownika, który go utworzył"],e:"Detail dziedziczy uprawnienia i widoczność po Master. Nie posiada pola Owner i dziedziczy właściciela po Master."},{id:"w05-19",q:"Ile maksymalnie pól Master-Detail może mieć pojedynczy obiekt?",a:["2","1","40","10"],e:"Pojedynczy obiekt może mieć maksymalnie 2 pola typu Master-Detail."},{id:"w05-20",q:"Ile pól Lookup może mieć pojedynczy obiekt?",a:["Do 40, ale odlicza się od tego pola Master-Detail","Do 2","Do 40 niezależnie od pól Master-Detail","Bez limitu"],e:"Do 40 pól Lookup, przy czym limit obejmuje także pola Master-Detail."},{id:"w05-21",q:"Jak nazywają się obiekty w relacji Lookup?",a:["Parent i Child","Master i Detail","Owner i Record","Source i Target"],e:"Lookup: Parent i Child. Master-Detail: Master i Detail."},{id:"w05-22",q:"Który przykład z wykładu ilustruje relację Lookup?",a:["Kategoria (Parent) i produkt (Child)","Polisa (Master) i roszczenie (Detail)","Zamówienie i pozycja zamówienia","Faktura i linia faktury"],e:"Produkt (Child) i kategoria (Parent): oba obiekty mogą istnieć niezależnie."},{id:"w05-23",q:"Czy rekord Parent musi istnieć w chwili tworzenia rekordu Child w relacji Lookup?",a:["Nie, może nie istnieć","Tak, zawsze","Tak, chyba że pole jest wymagane","Tylko dla obiektów standardowych"],e:"Przy Lookup rekord Parent może nie istnieć w chwili tworzenia rekordu Child."},{id:"w05-24",q:"Jak rekord Parent uzyskuje listę wskazujących na niego rekordów Child?",a:["Przez Related List","Przez pole Roll-Up Summary","Przez dodatkowe pole w Parent","Nie może jej uzyskać"],e:"Rekord Parent może uzyskać listę obiektów Child, które na niego wskazują (Related List)."},{id:"w05-25",q:"Co dzieje się z rekordami Child po usunięciu rekordu Parent (Lookup)?",a:["Nie są usuwane kaskadowo","Są usuwane kaskadowo","Usunięcie Parent jest niemożliwe","Child przejmuje rolę Parent"],e:"Lookup to relacja luźna, więc brak kaskadowego usuwania rekordów Child."},{id:"w05-26",q:"Czy pole Lookup może mieć wartość null?",a:["Tak","Nie","Tylko w obiektach standardowych","Tylko przy relacji z samym sobą"],e:"W relacji luźnej można wstawić null w pole Lookup."},{id:"w05-27",q:"Czy obiekt Child w relacji Lookup dziedziczy uprawnienia i Owner po Parent?",a:["Nie","Tak, zawsze","Tylko uprawnienia, bez Owner","Tylko Owner, bez uprawnień"],e:"Lookup: brak dziedziczenia uprawnień i widoczności (w tym pola Owner)."},{id:"w05-28",q:"Czy relacja Lookup jest możliwa w obrębie tego samego obiektu?",a:["Tak","Nie","Tylko dla obiektów standardowych","Tylko jako Master-Detail"],e:"Relacja Lookup jest możliwa w obrębie tego samego obiektu (self-relationship)."},{id:"w05-29",q:"Jakim kolorem Schema Builder oznacza relację Master-Detail?",a:["Czerwonym","Niebieskim","Zielonym","Czarnym"],e:"Master-Detail jest oznaczana linią czerwoną, a Lookup linią niebieską."},{id:"w05-30",q:"Jakim kolorem Schema Builder oznacza relację Lookup?",a:["Niebieskim","Czerwonym","Pomarańczowym","Szarym"],e:"Lookup → linia niebieska."},{id:"w05-31",q:"Co łączy linia relacji na diagramie Schema Builder?",a:["Nagłówek obiektu Master/Parent z polem relacji w obiekcie Detail/Child","Dwa nagłówki obiektów","Dwa pola relacji","Pole Owner z obiektem User"],e:"Linia łączy nagłówek obiektu Master lub Parent z polem relacji w obiekcie Detail lub Child."},{id:"w05-32",q:"Dla jakich relacji na diagramie pojawia się symbol rozwidlenia i otwartego kółka?",a:["Dla obu typów relacji","Tylko dla Master-Detail","Tylko dla Lookup","Tylko dla relacji wiele do wielu"],e:"Symbol rozwidlenia i otwartego kółka pojawia się dla obu typów relacji."},{id:"w05-33",q:"Jak realizuje się relację wiele do wielu w Salesforce?",a:["Wyłącznie za pomocą obiektu pośredniczącego (Junction Object)","Polem typu Many-to-Many","Dwoma polami Lookup w obu obiektach","Nie da się jej zrealizować"],e:"Relacje wiele do wielu realizuje się wyłącznie za pomocą obiektu pośredniczącego (Junction Object)."},{id:"w05-34",q:"Który wariant obiektu pośredniczącego NIE jest wymieniony na wykładzie?",a:["1 pole Lookup bez innych pól relacji","2 pola Master-Detail","2 lub więcej pól Lookup","1 pole Master-Detail i 1 pole Lookup"],e:"Warianty: 2× Master-Detail, 2 lub więcej Lookup, albo Master-Detail + Lookup. Jedno pole relacji nie tworzy relacji wiele do wielu."},{id:"w05-35",q:"Czy obiekt pośredniczący może zawierać pola innego typu niż relacyjne?",a:["Tak","Nie","Tylko pola Formula","Tylko pola Roll-Up Summary"],e:"Obiekt pośredniczący może zawierać również pola innego typu."},{id:"w05-36",q:"Czy obiekt Master musi mieć pole wskazujące na rekordy Detail?",a:["Nie, rekord Master automatycznie przechowuje listę wskazujących na niego Detail","Tak, pole typu Detail List","Tak, pole Roll-Up Summary jest obowiązkowe","Tak, pole Lookup zwrotne"],e:"W obiekcie Master nie tworzymy żadnego pola. Przechowuje on automatyczną listę obiektów Detail."}],gp={id:mp,title:kp,questions:fp},hp="w06",jp="W6 · Wprowadzenie do Apex",vp=[{id:"w06-01",q:"Na jakim języku wzorowana jest składnia Apex?",a:["Java","C#","JavaScript","Python"],e:"Apex to język obiektowy ze składnią wzorowaną na Javie."},{id:"w06-02",q:"Czy Apex rozróżnia wielkość liter?",a:["Nie, inaczej niż Java","Tak, tak jak Java","Tylko w nazwach klas","Tylko w nazwach zmiennych"],e:"‼️ Apex nie rozróżnia wielkości liter, inaczej niż Java."},{id:"w06-03",q:"Ile klas może rozszerzać (extends) klasa Apex?",a:["Tylko jedną","Dowolnie wiele","Dwie","Żadnej, Apex nie ma dziedziczenia"],e:"Apex pozwala na pojedyncze dziedziczenie: klasa może rozszerzać tylko jedną klasę."},{id:"w06-04",q:"Ile interfejsów może implementować jedna klasa Apex?",a:["Wiele","Tylko jeden","Maksymalnie dwa","Żadnego"],e:"Klasa może implementować wiele interfejsów (implements)."},{id:"w06-05",q:"Z jakimi językami zapytań zintegrowany jest Apex?",a:["SOQL i SOSL","SQL i PL/SQL","GraphQL i SPARQL","HQL i JPQL"],e:"Apex jest zintegrowany z SOQL i SOSL."},{id:"w06-06",q:"Jakie typy danych występują w Apex?",a:["Tylko typy obiektowe; brak typów prymitywnych","Typy prymitywne i obiektowe jak w Javie","Tylko typy prymitywne","Tylko typ sObject"],e:"Apex ma tylko typy obiektowe. ‼️ Brak typów prymitywnych, np. int, double, boolean."},{id:"w06-07",q:"Jak zapisuje się literał tekstowy w Apex?",a:["W pojedynczych apostrofach: 'Hello'",'W cudzysłowach: "Hello"',"W backtickach: `Hello`","Dowolnie"],e:"‼️ String w Apex używa pojedynczych apostrofów: 'Hello'."},{id:"w06-08",q:"Który z poniższych NIE jest typem liczbowym Apex?",a:["int","Integer","Decimal","Long"],e:"Liczbowe: Integer, Long, Double, Decimal. 'int' to typ prymitywny, którego w Apex nie ma."},{id:"w06-09",q:"Jakie kolekcje oferuje Apex?",a:["List, Set, Map","Array, Tuple, Dict","Vector, Stack, Queue","Tylko tablice []"],e:"Kolekcje: List, Set, Map. ‼️ Brak tablic prostych typu []."},{id:"w06-10",q:"Jaki typ może przechowywać dowolną wartość w Apex?",a:["Object","sObject","Any","Variant"],e:"Typ bazowy Object może przechowywać dowolną wartość. sObject przechowuje dowolny rekord bazy."},{id:"w06-11",q:"Czym jest typ sObject?",a:["Typem rekordu bazy danych; może wskazywać na dowolny rekord każdej tabeli i jest typem bazowym typów wszystkich obiektów","Typem bazowym dla wszystkich wartości, także liczb","Typem przechowującym pliki binarne","Typem identyfikatora rekordu"],e:"sObject to rekord obiektu bazy danych, typ bazowy dla typów wszystkich obiektów (Account, Contact, MojaTabela__c…)."},{id:"w06-12",q:"Jakim sufiksem oznaczone są relacje między obiektami w Apex?",a:["__r","__c","__rel","__x"],e:"Obiekty niestandardowe mają sufiks __c, a relacje między obiektami sufiks __r."},{id:"w06-13",q:"Jaki typ reprezentuje unikalny identyfikator rekordu?",a:["ID","String","Integer","Key"],e:"Unikalny identyfikator rekordu obecny w każdym rekordzie ma typ ID."},{id:"w06-14",q:"Jaki typ Apex służy do danych binarnych, np. plików?",a:["Blob","Binary","ByteArray","File"],e:"Dane binarne, np. pliki, mają typ Blob."},{id:"w06-15",q:"Ile poziomów zagnieżdżenia klas wewnętrznych dopuszcza Apex?",a:["Tylko 1 poziom","Dowolnie wiele","2 poziomy","Apex nie pozwala na klasy wewnętrzne"],e:"Można definiować klasy wewnątrz innych klas, ale tylko 1 poziom ‼️."},{id:"w06-16",q:"Które typy w Apex dopuszczają wartość null?",a:["Wszystkie","Tylko typy obiektowe poza Integer i Boolean","Tylko sObject","Żadne"],e:"Wszystkie typy dopuszczają null, bo w Apex są tylko typy obiektowe."},{id:"w06-17",q:"Który typ czasowy w Apex uwzględnia strefy czasowe?",a:["DateTime (Date już nie)","Date (DateTime już nie)","Oba","Żaden"],e:"DateTime uwzględnia strefy czasowe, Date już nie ‼️."},{id:"w06-18",q:"Z jaką dokładnością DateTime jest zapisywany w bazie danych?",a:["Do sekund (choć w Apex uwzględnia milisekundy)","Do milisekund","Do minut","Do dni"],e:"DateTime w Apex uwzględnia milisekundy, ale w bazie zapisywany jest z dokładnością do sekund ‼️."},{id:"w06-19",q:"Czym jest w Apex deklaracja 'Integer numery []'?",a:["Listą (to alternatywny zapis List<Integer>)","Prostą tablicą o stałym rozmiarze","Zbiorem Set<Integer>","Błędem kompilacji"],e:"Listę można definiować na dwa sposoby: List<Integer> numery lub Integer numery []. Zawsze jest to lista."},{id:"w06-20",q:"Czego brakuje w Apex w porównaniu z Javą?",a:["Strumieni (streams) i try-with-resources","Pętli for-each","Obsługi wyjątków","Interfejsów"],e:"Brak strumieni 😞 oraz brak try-with-resources 😞."},{id:"w06-21",q:"Jak wykonywany jest kod Apex?",a:["Jest interpretowany bezpośrednio przez platformę Salesforce","Kompilowany do pliku .exe","Uruchamiany w przeglądarce użytkownika","Uruchamiany na lokalnej maszynie JVM dewelopera"],e:"Kod jest interpretowany bezpośrednio przez platformę Salesforce. Kod Apex to np. trigger, kontroler, batch job, a nie cała aplikacja."},{id:"w06-22",q:"Co ma własne każdy kontekst wykonania Apex?",a:["Zmienne statyczne, dane w pamięci, transakcje bazodanowe, limity zasobów","Własny Org","Własną bazę danych","Własnego użytkownika administracyjnego"],e:"Kontekst wykonania ma własne zmienne statyczne, dane w pamięci, transakcje bazodanowe i limity zasobów."},{id:"w06-23",q:"Dlaczego w Apex nie ma synchronizacji między kontekstami?",a:["Kontekst wykonuje się w jednym wątku, a różne konteksty mogą działać w różnych wątkach bez współdzielenia stanu","Bo Apex nie obsługuje wątków","Bo wszystkie konteksty dzielą jedną pamięć","Bo synchronizację zapewnia baza danych"],e:"Kontekst wykonuje się w jednym wątku. Różne konteksty mogą być w różnych wątkach, co oznacza brak synchronizacji ‼️."},{id:"w06-24",q:"Jaki rodzaj kontekstu tworzy uruchomienie kodu w Developer Console w celu debugowania?",a:["Anonimowy","Testowy","Batch","API"],e:"Anonimowy → Developer Console, debugowanie."},{id:"w06-25",q:"Która adnotacja/interfejs jest związana z kontekstem Batch?",a:["Database.Batchable","@isTest","@RestResource","@future"],e:"Batch: uruchamiany przez system, Database.Batchable."},{id:"w06-26",q:"Która adnotacja jest związana z kontekstem API (kod uruchamiany zdalnie)?",a:["@RestResource","@isTest","@future","Database.Batchable"],e:"API → uruchamiany zdalnie, @RestResource."},{id:"w06-27",q:"Co jest przykładem uruchomienia kontekstu asynchronicznego?",a:["Schedulable lub @future","Naciśnięcie przycisku","@isTest","Developer Console"],e:"Asynchroniczny: kod uruchamiany w tle, np. Schedulable, @future."},{id:"w06-28",q:"Jakie są cechy kontekstu synchronicznego?",a:["Użytkownik czeka na wynik, cały kod w jednej transakcji, błąd powoduje rollback całości","Kod w tle, większe limity","Brak transakcji","Kod uruchamiany wyłącznie przez system"],e:"Synchroniczny: wykonanie w odpowiedzi na akcję użytkownika, blokowanie UI, mniejsze limity, jedna transakcja i rollback przy błędzie."},{id:"w06-29",q:"Ile maksymalnie zapytań SOQL na transakcję dopuszcza kontekst synchroniczny?",a:["100","200","50","150"],e:"Synchroniczny: maks. 100 zapytań SOQL. Asynchroniczny: maks. 200."},{id:"w06-30",q:"Ile maksymalnie zapytań SOQL na transakcję dopuszcza kontekst asynchroniczny?",a:["200","100","150","Bez limitu"],e:"Asynchroniczny ma większe limity: maks. 200 zapytań SOQL na transakcję."},{id:"w06-31",q:"Które mechanizmy uruchamiają kod w kontekście asynchronicznym?",a:["Batch Apex, Queueable, Future methods, Scheduled Apex","Anonymous Apex i Web Service","Tylko triggery before","Tylko Visualforce GET"],e:"Operacje asynchroniczne uruchamiają m.in. Batch Apex, Queueable, Future methods i Scheduled Apex."},{id:"w06-32",q:"W jakim kontekście wykonuje się wywołanie Web Service (SOAP/REST) wg tabeli z wykładu?",a:["Synchronicznym","Asynchronicznym","Testowym","Batch"],e:"Web Service (SOAP lub REST) → S. Anonymous Apex → S. Inbound Email Service → A."},{id:"w06-33",q:"W jakim kontekście wykonuje się Inbound Email Service wg tabeli z wykładu?",a:["Asynchronicznym","Synchronicznym","Anonimowym","Testowym"],e:"Inbound Email Service → A (asynchroniczny)."},{id:"w06-34",q:"Gdzie dozwolone są zmienne statyczne w Apex?",a:["Tylko w klasach zewnętrznych","Tylko w klasach wewnętrznych","W interfejsach","W triggerach jako pola"],e:"Zmienne statyczne są dozwolone tylko w klasach zewnętrznych."},{id:"w06-35",q:"Jaki jest czas życia zmiennej statycznej w Apex?",a:["Czas trwania kontekstu uruchamiania; potem wartość jest tracona","Do restartu Org-a","Bezterminowo, jak w bazie danych","Do wylogowania użytkownika"],e:"Czas życia zmiennej statycznej to czas trwania kontekstu. Po jego zakończeniu wartość jest tracona."},{id:"w06-36",q:"Klasa Apex bez modyfikatora virtual ani abstract…",a:["…domyślnie nie może być klasą bazową innej klasy","…może być dowolnie rozszerzana","…nie może mieć konstruktora","…nie może implementować interfejsów"],e:"Domyślnie klasa nie może być klasą bazową. Musi być oznaczona virtual lub abstract."},{id:"w06-37",q:"Czym różni się klasa virtual od abstract?",a:["Z virtual można tworzyć obiekty i dziedziczyć; abstract musi być rozszerzona i nie można tworzyć jej obiektów","To synonimy","Abstract pozwala tworzyć obiekty, virtual nie","Virtual nie może być rozszerzona"],e:"virtual może być klasą bazową (można utworzyć obiekt). abstract musi być rozszerzona (nie można utworzyć obiektu)."},{id:"w06-38",q:"Ile maksymalnie parametrów może mieć metoda Apex?",a:["32","16","64","255"],e:"Metody mogą mieć maksymalnie 32 parametry."},{id:"w06-39",q:"Który typ jest przekazywany do metody przez referencję?",a:["List<String>","Integer","String","Date"],e:"Przez wartość przekazywane są Integer, Double, Long, Decimal, Boolean, Date, Datetime i String. Pozostałe typy (np. kolekcje, sObject) przez referencję."},{id:"w06-40",q:"Czy metody Apex są domyślnie polimorficzne?",a:["Nie; muszą być oznaczone virtual lub abstract","Tak, jak w Javie","Tak, ale tylko publiczne","Nie, Apex nie wspiera polimorfizmu"],e:"Metody domyślnie nie są polimorficzne. virtual ma implementację i może być nadpisana, abstract nie ma implementacji i musi być nadpisana."},{id:"w06-41",q:"Czego NIE mogą zawierać interfejsy w Apex?",a:["Domyślnych implementacji metod ani pól","Deklaracji metod","Metod zwracających Decimal","Metod z parametrami"],e:"W interfejsach brak domyślnych implementacji metod i pól."},{id:"w06-42",q:"Jaki zasięg widoczności daje modyfikator global?",a:["Wszystkie Org-i (pakiety managed)","Cały Org","Klasa i klasy potomne","Tylko wnętrze klasy"],e:"private – klasa; protected – klasa i potomne; public – cały Org; global – wszystkie Org-i (pakiety managed)."},{id:"w06-43",q:"Jaki zasięg widoczności daje public w Apex?",a:["Cały Org","Wszystkie Org-i","Klasa i potomne","Tylko pakiet"],e:"public → cały Org."},{id:"w06-44",q:"Do których elementów NIE można zastosować modyfikatora abstract/virtual?",a:["Do pól","Do klas","Do metod","Można do wszystkich"],e:"abstract i virtual: klasa ✅, metoda ✅, pole ❌."},{id:"w06-45",q:"Jakie jest domyślne zachowanie klasy Apex względem zasad dostępu (sharing)?",a:["without sharing – ignoruje zasady dostępu","with sharing – stosuje zasady dostępu","inherited sharing zawsze","Zależy od wersji API"],e:"Wg wykładu without sharing (ignoruje zasady dostępu) to domyślne zachowanie. with sharing stosuje zasady dostępu Salesforce."},{id:"w06-46",q:"Do czego może być zastosowany modyfikator transient?",a:["Tylko do pola; jego wartość nie jest serializowana (np. hasła, tokeny)","Tylko do metody","Tylko do klasy","Do klas i metod"],e:"transient (tylko pole) nie jest serializowane, czyli nie jest zapisywane do bazy ani przesyłane między warstwami MVC."},{id:"w06-47",q:"Co oznacza modyfikator synchronized dla metody wg wykładu?",a:["Tylko 1 wątek może naraz wykonywać tę metodę","Metoda jest wykonywana asynchronicznie","Metoda nadpisuje metodę bazową","Metoda jest wykonywana w kontekście synchronicznym"],e:"synchronized (tylko metoda): tylko 1 wątek może naraz wykonywać tę metodę."},{id:"w06-48",q:"Który modyfikator stosuje się do metody nadpisującej metodę klasy bazowej?",a:["override","virtual","extends","super"],e:"override (tylko metoda) nadpisuje metodę w klasie bazowej."},{id:"w06-49",q:"Która konstrukcja służy w Apex do wielokrotnego wyboru zamiast switch-case?",a:["switch on … when … when else","switch … case … default","match … with","select … case"],e:"Apex: switch on zmienna { when 'A' {...} when 'B','C' {...} when else {...} }."},{id:"w06-50",q:"Czy w instrukcji switch on w Apex używa się break?",a:["Nie, nie ma break","Tak, obowiązkowo","Tylko w when else","Tylko przy wielu wartościach"],e:"W switch on nie ma break, a gałęzie nie 'przepadają' do następnej."},{id:"w06-51",q:"Jak w switch on obsłużyć kilka wartości w jednej gałęzi?",a:["when 'Intermediate', 'Advanced' { … }","when 'Intermediate' || 'Advanced' { … }","case 'Intermediate': case 'Advanced':","when ('Intermediate' or 'Advanced')"],e:"Wartości oddziela się przecinkami: when 'Intermediate', 'Advanced'."},{id:"w06-52",q:"Co wypisze kod: for (Integer i = 0; i < 5; i++) { if (i == 2) continue; if (i == 4) break; System.debug(i); }",a:["0, 1, 3","0, 1, 2, 3","0, 1","0, 1, 3, 4"],e:"i=2 jest pomijane (continue), a przy i=4 pętla jest przerywana (break). Wynik: 0, 1, 3."},{id:"w06-53",q:"Ile razy wykona się ciało pętli: Integer count = 10; do { count++; } while (count < 5);",a:["1 raz","0 razy","5 razy","Nieskończenie"],e:"do-while zawsze wykonuje ciało przynajmniej raz, potem sprawdza warunek (11 < 5 = false)."},{id:"w06-54",q:"Czy w Apex są etykiety skoku dla break/continue?",a:["Nie","Tak, jak w Javie","Tylko dla pętli for","Tylko dla while"],e:"Brak etykiet skoku."},{id:"w06-55",q:"Do czego służy Apex DML?",a:["Do tworzenia, aktualizacji, usuwania i przywracania rekordów","Do pobierania rekordów zapytaniami","Do wyszukiwania pełnotekstowego","Do definiowania obiektów"],e:"Apex DML to tworzenie, aktualizacja, usuwanie i przywracanie rekordów."},{id:"w06-56",q:"Do czego służy SOSL?",a:["Do wyszukiwania rekordów po tekście, liczbach lub polach wyszukiwania","Do pobierania rekordów jednego obiektu z filtrami (jak SELECT)","Do modyfikacji rekordów","Do definiowania relacji"],e:"SOSL to Salesforce Object Search Language, czyli wyszukiwanie. SOQL służy do pobierania rekordów (SELECT…)."},{id:"w06-57",q:"Co zazwyczaj zwraca zapytanie SOQL?",a:["Listę rekordów","Pojedynczą liczbę","Plik CSV","Obiekt JSON"],e:"SOQL zazwyczaj zwraca listę rekordów, np. [SELECT Name, Industry FROM Account]."},{id:"w06-58",q:"Ile pól definiuje klasa SampleJob z wykładu (counter, isActive, jobName)?",a:["3, w tym 1 statyczne","2","3, wszystkie instancyjne","1"],e:"Pola: public static Integer counter (statyczne), private Boolean isActive, public final String jobName."},{id:"w06-59",q:"Czy obsługa wyjątków (try/catch/finally) w Apex różni się od Javy?",a:["Składnia i działanie takie same, ale brak try-with-resources","Apex nie ma bloku finally","Apex nie obsługuje wyjątków","Apex używa on error goto"],e:"Składnia i działanie takie same jak w Javie, ale brak try-with-resources."},{id:"w06-60",q:"Co to jest kontekst wykonania Apex?",a:["Jednostka wykonania kodu Apex, definiująca większość ograniczeń i czas życia zmiennych statycznych","Sesja użytkownika w przeglądarce","Zbiór klas w jednym pliku","Środowisko Sandbox"],e:"Kontekst to jednostka wykonania kodu. Definiuje większość ograniczeń i czas życia zmiennych statycznych."}],Sp={id:hp,title:jp,questions:vp},bp="w07",Cp="W7 · Apex DML",xp=[{id:"w07-01",q:"Co oznacza skrót DML?",a:["Data Manipulation Language","Data Model Language","Database Management Layer","Dynamic Metadata Language"],e:"DML = Data Manipulation Language: tworzenie, aktualizacja i usuwanie rekordów z poziomu Apex."},{id:"w07-02",q:"Do czego NIE służy DML w Apex?",a:["Do odczytu rekordów (do tego służy SOQL)","Do tworzenia rekordów","Do aktualizacji rekordów","Do usuwania rekordów"],e:"‼️ Do odczytu służy SOQL, a nie DML."},{id:"w07-03",q:"Jakie są dwa sposoby korzystania z Apex DML?",a:["Instrukcje DML i metody statyczne klasy Database","SQL i PL/SQL","SOQL i SOSL","REST API i SOAP API"],e:"Sposoby: instrukcje DML (insert, update…) oraz metody statyczne klasy Database."},{id:"w07-04",q:"Jak działa instrukcja upsert?",a:["Wstawia rekord, jeśli nie istnieje, lub aktualizuje, jeśli istnieje","Zawsze wstawia nowy rekord","Scala duplikaty","Przywraca usunięty rekord"],e:"upsert = insert (gdy rekordu brak) lub update (gdy istnieje)."},{id:"w07-05",q:"Do czego służy instrukcja merge?",a:["Do scalania rekordów uznanych za duplikaty","Do łączenia dwóch obiektów w jeden","Do łączenia transakcji","Do łączenia wyników SOQL"],e:"merge to scalanie rekordów uznanych za duplikaty."},{id:"w07-06",q:"Jaki jest limit rekordów przetwarzanych przez DML w jednej transakcji?",a:["10 000","150","50 000","200"],e:"Ograniczenia dla transakcji: liczba rekordów ≤ 10 000, liczba wywołań instrukcji DML ≤ 150."},{id:"w07-07",q:"Ile maksymalnie wywołań instrukcji DML dopuszcza jedna transakcja?",a:["150","100","10 000","200"],e:"Liczba wywołań instrukcji DML ≤ 150 na transakcję."},{id:"w07-08",q:"Na czym może operować Apex DML?",a:["Na pojedynczych rekordach i na kolekcjach rekordów","Tylko na pojedynczych rekordach","Tylko na listach","Tylko na mapach"],e:"Apex DML może operować na pojedynczych rekordach i na kolekcjach rekordów."},{id:"w07-09",q:"Co się dzieje, gdy instrukcja DML zakończy się błędem (bez try-catch)?",a:["Wykonanie jest przerywane i następuje automatyczne wycofanie transakcji","Błąd jest ignorowany","Zapisywane są poprawne rekordy","Rekord trafia do Recycle Bin"],e:"Błąd przerywa wykonanie i następuje automatyczne wycofanie transakcji."},{id:"w07-10",q:"Czy samo utworzenie obiektu w Apex (new Account(...)) zapisuje go w bazie?",a:["Nie, dopiero operacja DML powoduje zapis","Tak, natychmiast","Tak, na koniec kontekstu","Tak, jeśli ma wypełnione pole Name"],e:"‼️ Samo utworzenie obiektu nie zapisuje go w bazie. Dopiero DML powoduje zapis."},{id:"w07-11",q:"Kiedy rekord otrzymuje Id?",a:["Po wstawieniu do bazy (insert); Id nadawane jest automatycznie","W konstruktorze","Trzeba je nadać ręcznie","Po pierwszym zapytaniu SOQL"],e:"Rekord po utworzeniu nie ma Id. Wstawienie do bazy automatycznie nadaje Id, które jest potem dostępne w kodzie."},{id:"w07-12",q:"Dlaczego przy tworzeniu Contact powiązanego z Account kolejność operacji ma znaczenie?",a:["Obiekt podrzędny wymaga istnienia obiektu nadrzędnego (jego Id)","Bo Contact musi być wstawiony przed Account","Bo insert działa tylko alfabetycznie","Kolejność nie ma znaczenia"],e:"Najpierw insert Account, a potem Contact z AccountId = acc.Id, bo obiekt podrzędny wymaga istnienia nadrzędnego."},{id:"w07-13",q:"Jaki typ relacji łączy Contact z Account w przykładzie z wykładu?",a:["Lookup (Account – Parent, Contact – Child)","Master-Detail (Account – Master)","Wiele do wielu","External Lookup"],e:"W przykładzie relacja Lookup: Account to Parent, Contact to Child."},{id:"w07-14",q:"Dlaczego po insert można od razu wykonać update na tym samym obiekcie bez SOQL?",a:["Bo po insert obiekt zawiera już Id utworzonego rekordu","Bo update nie wymaga Id","Bo Apex cache'uje wszystkie rekordy","Nie można, trzeba najpierw pobrać rekord SOQL"],e:"Po insert zmienna zawiera Id, więc można zaktualizować rekord bez pobierania go SOQL."},{id:"w07-15",q:"Gdzie trafia rekord po operacji delete?",a:["Do Recycle Bin, a jego Id pozostaje takie samo","Jest trwale usuwany natychmiast","Do Sandboxa","Do archiwum z nowym Id"],e:"Po delete rekord trafia do Recycle Bin, a jego identyfikator pozostaje taki sam."},{id:"w07-16",q:"Jak długo standardowo usunięte rekordy pozostają w Recycle Bin?",a:["15 dni","30 dni","7 dni","90 dni"],e:"Standardowo usunięte rekordy pozostają w Recycle Bin przez 15 dni."},{id:"w07-17",q:"Jaki warunek musi spełnić rekord, aby wykonać undelete?",a:["Musi być wcześniej usunięty i nadal nadawać się do przywrócenia","Musi mieć nowe Id","Musi być w Sandboxie","Musi być zablokowany"],e:"undelete wymaga, aby rekord był wcześniej usunięty i nadal nadawał się do przywrócenia (jest w Recycle Bin)."},{id:"w07-18",q:"Co dzieje się po 'merge primaryAccount duplicateAccount'?",a:["primaryAccount zostaje rekordem głównym, duplicateAccount jest usuwany, a powiązane rekordy są podpinane do głównego","Oba rekordy są usuwane i tworzony jest nowy","duplicateAccount staje się rekordem głównym","Rekordy są tylko oznaczane jako duplikaty"],e:"primaryAccount pozostaje rekordem głównym, duplicateAccount jest usuwany, a powiązane rekordy trafiają do rekordu głównego."},{id:"w07-19",q:"Który wzorzec jest poprawny przy wstawianiu wielu rekordów (bulk DML)?",a:["Dodać rekordy do listy w pętli i wykonać jeden insert listy po pętli","Wykonać insert każdego rekordu wewnątrz pętli","Wstawiać rekordy pojedynczo w osobnych triggerach","Użyć SOQL do wstawienia"],e:"Poprawnie: zbudować List<Account> w pętli i wykonać jeden insert, czyli jedną transakcję z bazą. Insert w pętli to anty-wzorzec."},{id:"w07-20",q:"Dlaczego insert wewnątrz pętli for jest złym wzorcem?",a:["Generuje wiele operacji na bazie i szybko wyczerpuje limit 150 instrukcji DML","Bo Apex nie pozwala na insert w pętli","Bo rekordy nie dostaną Id","Bo pętla for nie działa z sObject"],e:"Każdy insert to osobne wywołanie DML, a limit to 150 na transakcję. Bulk DML wykonuje jedno wywołanie."},{id:"w07-21",q:"Jaki wyjątek jest zgłaszany przy niepowodzeniu instrukcji DML?",a:["DmlException","QueryException","NullPointerException","SaveException"],e:"Niepowodzenie instrukcji DML zgłasza wyjątek, np. DmlException."},{id:"w07-22",q:"Co może być przyczyną błędu DML?",a:["Brak wymaganego pola, reguła walidacji, ograniczenia relacji lub brak uprawnień","Tylko błąd sieci","Tylko przekroczenie limitu SOQL","Tylko błąd składni"],e:"Przyczyny: brak wymaganego pola, reguły walidacji, ograniczenia relacji, brak uprawnień."},{id:"w07-23",q:"Co oferuje klasa Database ponad instrukcje DML?",a:["Kontrolę obsługi błędów, częściowe powodzenie i dostęp do wyników poszczególnych operacji","Szybsze wykonanie zapytań","Brak limitów","Automatyczne tworzenie obiektów Custom"],e:"Database daje kontrolę obsługi błędów, częściowe powodzenie operacji i dostęp do wyników poszczególnych operacji."},{id:"w07-24",q:"Jaka jest domyślna wartość parametru allOrNone w metodach Database?",a:["true","false","null","Zależy od operacji"],e:"Domyślnie allOrNone = true, czyli atomowość analogiczna do instrukcji DML."},{id:"w07-25",q:"Co oznacza Database.insert(records, false)?",a:["Częściowe powodzenie: poprawne rekordy zostaną zapisane, błędne nie","Wszystkie rekordy zostaną wycofane przy jakimkolwiek błędzie","Nie zostanie zapisany żaden rekord","Rekordy zostaną zapisane bez walidacji"],e:"allOrNone = false: poprawne rekordy mogą zostać zapisane, nawet jeśli inne nie zostaną."},{id:"w07-26",q:"Lista: [Account(Name='A'), Account() bez Name, Account(Name='B')]. Ile kont zapisze Database.insert(lista, true)?",a:["0","2","1","3"],e:"Przy allOrNone = true błąd drugiego rekordu powoduje, że żadne z trzech kont nie zostanie zapisane."},{id:"w07-27",q:"Ta sama lista (drugi rekord bez Name), ale Database.insert(lista, false). Co się stanie?",a:["Rekord 1 i 3 zostaną zapisane, rekord 2 nie","Żaden rekord nie zostanie zapisany","Wszystkie trzy zostaną zapisane","Zostanie rzucony DmlException"],e:"Częściowe powodzenie: rekordy 1 i 3 zostaną dodane, 2 nie. Metoda zwraca wyniki zamiast rzucać wyjątek."},{id:"w07-28",q:"Czy allOrNone = false oznacza, że błędy są ignorowane?",a:["Nie, programista musi sprawdzić wyniki i zdecydować, co zrobić z błędnymi rekordami","Tak, błędy są ignorowane","Tak, ale tylko błędy walidacji","Nie, bo i tak rzucany jest wyjątek"],e:"Ważne: allOrNone = false nie oznacza ignorowania błędów. Trzeba je sprawdzić w wynikach."},{id:"w07-29",q:"Jaki typ zwraca Database.insert()?",a:["Database.SaveResult (tablica dla listy)","Database.InsertResult","Database.UpsertResult","Boolean"],e:"insert() i update() zwracają Database.SaveResult."},{id:"w07-30",q:"Jaki typ wyniku zwraca Database.upsert()?",a:["Database.UpsertResult","Database.SaveResult","Database.MergeResult","Database.UpdateResult"],e:"upsert() → Database.UpsertResult."},{id:"w07-31",q:"Jaki typ wyniku zwraca Database.update()?",a:["Database.SaveResult","Database.UpdateResult","Database.UpsertResult","Database.DeleteResult"],e:"Uwaga, pułapka: update() zwraca SaveResult, tak jak insert(). Nie istnieje UpdateResult."},{id:"w07-32",q:"Jaki typ wyniku zwraca Database.delete()?",a:["Database.DeleteResult","Database.SaveResult","Database.UndeleteResult","Boolean"],e:"delete() → DeleteResult, undelete() → UndeleteResult, merge() → MergeResult."},{id:"w07-33",q:"Która metoda SaveResult sprawdza, czy operacja się powiodła?",a:["isSuccess()","getStatus()","hasErrors()","wasSaved()"],e:"isSuccess() sprawdza powodzenie, getId() zwraca Id zapisanego rekordu, getErrors() zwraca informacje o błędach."},{id:"w07-34",q:"Która metoda SaveResult zwraca listę błędów (Database.Error)?",a:["getErrors()","getMessages()","getExceptions()","errors()"],e:"getErrors() zwraca obiekty Database.Error z metodą getMessage()."},{id:"w07-35",q:"Gdzie są dostępne informacje o błędach przy użyciu metod klasy Database?",a:["W obiektach wynikowych, np. Database.SaveResult i Database.Error","Tylko w DmlException","W logu systemowym Org-a","Nie są dostępne"],e:"Instrukcje DML podają błędy w obiekcie wyjątku. Metody Database podają je w obiektach wynikowych (SaveResult, Error)."},{id:"w07-36",q:"Kiedy zaleca się Database z allOrNone = false?",a:["Przy imporcie wielu rekordów, z których część może zawierać błędy","Przy prostym zapisie jednego rekordu","Gdy wszystkie rekordy muszą się powieść","Do dynamicznych zapytań SOQL"],e:"Import wielu rekordów, z których część może być błędna, to Database z allOrNone = false."},{id:"w07-37",q:"Co jest zalecane do prostego zapisu jednego rekordu?",a:["Instrukcja DML (insert, update…)","Database.insert z allOrNone = false","Database.query()","Database.setSavepoint()"],e:"Prosty zapis jednego rekordu: insert, update itp."},{id:"w07-38",q:"Która metoda służy do dynamicznych zapytań SOQL?",a:["Database.query()","Database.insert()","Database.search()","Database.select()"],e:"Dynamiczne zapytania SOQL wykonuje Database.query()."},{id:"w07-39",q:"Jak wycofać zmiany do określonego punktu w transakcji?",a:["Database.setSavepoint() wraz z Database.rollback()","undelete","Database.revert()","Wyrzucić DmlException"],e:"Wycofywanie zmian: Database.setSavepoint() + Database.rollback()."},{id:"w07-40",q:"Jak zachowuje się nieudana instrukcja DML wobec wcześniejszych operacji w transakcji?",a:["Nie zapisuje części rekordów, a wcześniejsze operacje w transakcji są automatycznie wycofywane","Zapisuje poprawne rekordy","Wycofuje tylko bieżący rekord","Nie ma wpływu na wcześniejsze operacje"],e:"Nieudana instrukcja DML nie zapisuje części rekordów, a wcześniejsze operacje są automatycznie wycofywane (jeśli wyjątek nie jest obsłużony)."},{id:"w07-41",q:"Co jest potrzebne, aby kod kontynuował działanie po błędzie instrukcji DML?",a:["Obsłużenie wyjątku w bloku try-catch","Nic, kod zawsze kontynuuje","Użycie undelete","Ustawienie allOrNone = true"],e:"Instrukcje DML wymagają try-catch, jeśli kod ma kontynuować po błędzie."},{id:"w07-42",q:"Co zawiera klasa Database poza metodami DML wg wykładu?",a:["Kontrolę transakcji, wycofanie działań i metody zapytań SOQL","Metody tworzenia obiektów Custom","Metody do budowy UI","Metody do wysyłania e-maili"],e:"Database poszerza DML m.in. o kontrolę transakcji, wycofanie działań i metody zapytań SOQL."}],Dp={id:bp,title:Cp,questions:xp},Lp="w08",Ep="W8 · Apex SOQL",Tp=[{id:"w08-01",q:"Co oznacza skrót SOQL?",a:["Salesforce Object Query Language","Structured Object Query Language","Salesforce Online Query Logic","Simple Object Query Language"],e:"SOQL = Salesforce Object Query Language."},{id:"w08-02",q:"Jak umieszcza się zapytanie SOQL inline w kodzie Apex?",a:["W nawiasach kwadratowych [ ]","W nawiasach klamrowych { }","W cudzysłowach i metodzie execute()","W znacznikach <soql>"],e:"SOQL jest używany inline w kodzie Apex w blokach [ ]."},{id:"w08-03",q:"Co może być rezultatem zapytania SOQL?",a:["Lista sObject, pojedynczy sObject lub Integer (dla funkcji agregujących jak count)","Tylko lista sObject","Tylko JSON","Tylko pojedynczy rekord"],e:"Wynik SOQL to lista sObject (rekordów), pojedynczy sObject albo Integer dla COUNT()."},{id:"w08-04",q:"Jaki typ zwraca: [SELECT COUNT() FROM Contact WHERE LastName = 'ORLEN']?",a:["Integer","List<Contact>","AggregateResult","Contact"],e:"SELECT COUNT() zwraca wartość typu Integer."},{id:"w08-05",q:"Jakie instrukcje oferuje SOQL?",a:["Tylko SELECT","SELECT, INSERT, UPDATE, DELETE","SELECT i UPDATE","SELECT i MERGE"],e:"SOQL ma tylko SELECT. Modyfikacje wykonuje się przez DML."},{id:"w08-06",q:"Czego NIE ma w SOQL w porównaniu z SQL?",a:["Dowolnego łączenia tabel za pomocą JOIN i symboli wieloznacznych *","Klauzuli WHERE","Klauzuli ORDER BY","Funkcji COUNT"],e:"W SOQL nie ma dowolnego JOIN, symboli wieloznacznych * ? ani zaawansowanych wyrażeń obliczeniowych."},{id:"w08-07",q:"Jak pobrać tylko standardowe pola obiektu Contact?",a:["SELECT FIELDS(STANDARD) FROM Contact","SELECT * FROM Contact","SELECT STANDARD FROM Contact","SELECT ALL FROM Contact"],e:"SELECT FIELDS(STANDARD) FROM Contact. Gwiazdka * nie jest dozwolona."},{id:"w08-08",q:"Jak pobrać imiona kontaktów oraz nazwy powiązanych kont (zapytanie od strony Child)?",a:["SELECT Contact.FirstName, Contact.Account.Name FROM Contact","SELECT FirstName, AccountId.Name FROM Contact JOIN Account","SELECT Name, (SELECT FirstName FROM Contacts) FROM Contact","SELECT FirstName FROM Contact, Account"],e:"Od strony obiektu podrzędnego używa się notacji kropkowej po nazwie relacji: Contact.Account.Name."},{id:"w08-09",q:"Jak pobrać nazwy kont i nazwiska powiązanych kontaktów (zapytanie od strony Parent)?",a:["SELECT Name, (SELECT LastName FROM Contacts) FROM Account","SELECT Name, Contact.LastName FROM Account","SELECT Name, (SELECT LastName FROM Contact) FROM Account","SELECT Account.Name JOIN Contact"],e:"Od strony Parent używa się podzapytania po nazwie relacji w liczbie mnogiej: Contacts."},{id:"w08-10",q:"Jak nazywa się lista rekordów podrzędnych w podzapytaniu od strony Parent (Account → Contact)?",a:["Contacts – nazwa obiektu Child w liczbie mnogiej","Contact","Contact__r","ContactList"],e:"Nazwa listy to nazwa obiektu Child w liczbie mnogiej, tutaj Contacts."},{id:"w08-11",q:"Jak w zapytaniu od strony Child odwołujemy się do obiektu Parent?",a:["Przez nazwę relacji (np. Account), a "Do warunkowego wyboru pól w zależności od typu rekordu (obiekty polimorficzne)","Do rzutowania typów pól","Do sprawdzania typu danych kolumny","Do tworzenia nowych typów"],e:"TYPEOF warunkowo wybiera pola zależnie od typu rekordu, np. TYPEOF What WHEN Account THEN Name, Industry … END FROM Event."},{id:"w08-18",q:"Do czego służy USING SCOPE w SOQL?",a:["Ogranicza dane do określonego zakresu widoku","Określa transakcję","Ogranicza liczbę rekordów","Blokuje rekordy"],e:"USING SCOPE ogranicza dane do określonego zakresu widoku, np. USING SCOPE My_View."},{id:"w08-19",q:"Do czego służy WITH DATA CATEGORY?",a:["Do filtrowania artykułów Knowledge według kategorii danych","Do grupowania rekordów","Do sortowania wyników","Do filtrowania po typie rekordu"],e:"WITH DATA CATEGORY filtruje artykuły (obiekty Knowledge) według kategorii danych."},{id:"w08-20",q:"Co robi ROLLUP w klauzuli GROUP BY?",a:["Tworzy sumy częściowe i całkowite","Tworzy wszystkie możliwe kombinacje grupowań","Usuwa duplikaty","Sortuje grupy"],e:"ROLLUP to sumy częściowe i całkowite. CUBE to wszystkie możliwe kombinacje grupowań."},{id:"w08-21",q:"Co robi CUBE w klauzuli GROUP BY?",a:["Tworzy wszystkie możliwe kombinacje grupowań","Tworzy sumy częściowe i całkowite","Zwraca dane w formacie 3D","Grupuje po wszystkich polach"],e:"CUBE tworzy wszystkie możliwe kombinacje grupowań."},{id:"w08-22",q:"Do czego służy HAVING?",a:["Do filtrowania grup po agregacji, np. HAVING COUNT(Id) > 10","Do filtrowania rekordów przed grupowaniem","Do sortowania","Do paginacji"],e:"HAVING filtruje wyniki agregacji (grupy). WHERE filtruje rekordy przed grupowaniem."},{id:"w08-23",q:"Co oznacza ORDER BY CreatedDate DESC NULLS LAST?",a:["Sortowanie malejąco po dacie utworzenia, wartości null na końcu","Sortowanie rosnąco, null na początku","Pomija rekordy z null","Sortuje tylko ostatnie rekordy"],e:"DESC = malejąco, NULLS LAST = wartości puste na końcu."},{id:"w08-24",q:"Które klauzule służą do paginacji wyników SOQL?",a:["LIMIT
