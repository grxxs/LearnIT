o set.","static to zupełnie inne słowo.","Leniwa inicjalizacja to Lazy<T>."]},{id:"w01-55",s:"f",q:"Czy get i set właściwości mogą mieć różną widoczność?",a:["Tak","Nie","Tylko w rekordach","Tylko w klasach statycznych"],e:"Widoczność get i set może być inna. Mogą też istnieć właściwości tylko z get albo tylko z set.",w:["Mogą, np. public get; private set;.","Dotyczy wszystkich klas, nie tylko rekordów.","Nie ma takiego ograniczenia."]},{id:"w01-56",s:"f",q:"Na czym opiera się zdarzenie (event) w C#?",a:["Na delegacie – typie funkcji będącej odbiorcą; odbiorców dodaje się operatorem +=","Na interfejsie IEvent","Na wątkach","Na atrybutach"],e:"Zdarzenie opiera się o delegat. Wiele funkcji odbiorców przypina się przez +=.",w:["Nie ma interfejsu IEvent – opiera się na delegacie.","Wątki nie są podstawą zdarzeń.","Atrybuty to metadane, nie mechanizm zdarzeń."]},{id:"w01-57",s:"f",q:"Dzięki czemu atrybuty (np. [PrimaryKey]) są wykorzystywane przez biblioteki?",a:["Są dostępne przez mechanizm refleksji (i source generators)","Są kompilowane do osobnego DLL","Są wykonywane jako metody","Są przechowywane w bazie danych"],e:"Atrybuty opisują metadane i są dostępne przez refleksję. Korzystają z nich biblioteki, np. sqlite-net-pcl do mapowania ORM.",w:["Atrybuty nie trafiają do osobnego DLL.","Atrybuty nie są wykonywane jak metody.","Atrybuty żyją w metadanych assembly, nie w bazie."]},{id:"w01-58",s:"f",q:"Jakie słowo kluczowe jest kluczowe w definicji metody rozszerzającej?",a:["this przed pierwszym parametrem","extends","static przed typem zwracanym (wystarczy)","partial"],e:'static int ToInt(this string s) pozwala wywołać "23".ToInt(). Metoda rozszerzająca dodaje metody do istniejących typów bez dziedziczenia.',w:["extends to Java.","static jest wymagane, ale bez this to zwykła metoda statyczna.","partial służy do dzielenia klas."]},{id:"w01-59",s:"f",q:"Od którego .NET kompilator domyślnie ostrzega o możliwym użyciu wartości null (nullable)?",a:[".NET 6",".NET 5",".NET Core 3.1",".NET 8"],e:"Od .NET 6 kompilator domyślnie ostrzega o danych, które mogą być null. Typy oznacza się przez ? (np. string?).",w:[".NET 5 – jeszcze nie domyślnie.","3.1 – nie domyślnie.",".NET 8 – było już wcześniej (od 6)."]},{id:"w01-60",s:"f",q:"Czym jest record w C#?",a:["Typem referencyjnym z wbudowaną enkapsulacją danych, przeznaczonym jako niemutowalny pojemnik","Typem wartościowym","Tablicą krotek","Klasą statyczną"],e:"record to typ referencyjny, a record struct to typ wartościowy. Rekordy to niemutowalne pojemniki na dane.",w:["record to typ referencyjny (wartościowy to record struct).","To nie krotki.","Rekord nie jest statyczny."]},{id:"w01-61",s:"f",q:"Czym jest record struct?",a:["Typem wartościowym działającym jak rekord","Typem referencyjnym","Strukturą bez właściwości","Aliasem dla klasy"],e:"record struct to typ wartościowy działający tak samo jak record (C# 10).",w:["Referencyjny to zwykły record.","Rekordy mają właściwości.","To nie alias klasy."]},{id:"w01-62",s:"g",q:'Kod: string category = p.Age switch { < 13 => "Child", >= 13 and < 20 => "Teen", >= 20 and < 65 => "Adult", _ => "Senior" }; Jaki wynik dla Age = 19?',a:["Teen","Adult","Child","Senior"],e:'19 spełnia >= 13 and < 20, więc wynik to "Teen".',w:["Adult to >= 20 – 19 tam nie wpada.","Child to < 13.","Senior to przypadek domyślny (_)."]},{id:"w01-63",s:"g",q:"Ten sam switch (Child <13, Teen 13–19, Adult 20–64, Senior). Jaki wynik dla Age = 65?",a:["Senior","Adult","Teen","Wyjątek – brak dopasowania"],e:'65 nie spełnia < 65, więc trafia do _ (discard), czyli "Senior".',w:["Adult to < 65 – 65 już nie.","Teen to < 20.","_ łapie wszystko pozostałe, więc wyjątku nie ma."]},{id:"w01-64",s:"g",q:"Kod: static Point Transform(Point p) => p switch { {X:0,Y:0} => new(0,0), {X: var x, Y: var y} when x < y => new(x+y, y), {X: var x, Y: var y} when x > y => new(x-y, y), {X: var x, Y: var y} => new(2*x, 2*y) }; Wynik dla Point(3, 1)?",a:["(2, 1)","(4, 1)","(6, 2)","(3, 1)"],e:"x=3 > y=1, więc new Point(x - y, y) = (2, 1).",w:["4 to x+y – ta gałąź dotyczy x < y.","(6,2) to gałąź (2x,2y) – nie dotyczy, bo x > y pasuje wcześniej.","(3,1) to oryginał – Transform zawsze coś zmienia."]},{id:"w01-65",s:"g",q:"Ten sam Transform. Wynik dla Point(2, 2)?",a:["(4, 4)","(0, 2)","(2, 2)","(0, 0)"],e:"Ani x<y, ani x>y, ani (0,0), więc ostatnia gałąź: (2*x, 2*y) = (4, 4).",w:["(0,2) to x−y – wymaga x > y.","(2,2) – ostatnia gałąź podwaja wartości.","(0,0) tylko dla punktu (0,0)."]},{id:"w01-66",s:"g",q:"Co jest wymagane w klasycznej instrukcji switch (case) w C#?",a:["break na końcu każdej sekcji case (brak fall-through)","Nic, case przechodzą do następnego jak w C","Każdy case musi być stałą liczbową","default jest obowiązkowy"],e:"W C# break jest wymagany, nie ma niejawnego fall-through. switch działa też dla łańcuchów.",w:["C# nie pozwala na niejawny fall-through.","switch działa też ze stringami.","default nie jest obowiązkowy."]},{id:"w01-67",s:"h",q:"Co zaleca się zamiast kodu unsafe ze wskaźnikami?",a:["Span<T>","dynamic","object[]","ArrayList"],e:"Zamiast unsafe zaleca się np. Span<T>, choć czasem unsafe bywa niezbędny.",w:["dynamic wyłącza kontrolę typów – nie zastępuje wskaźników.","object[] to boxing i alokacje.","ArrayList to przestarzała kolekcja."]},{id:"w01-68",s:"h",q:"Co mówią wytyczne o przeciążaniu operatorów („DO NOT be cute”)?",a:["Przeciążaj tylko, gdy wynik jest oczywisty (np. DateTime − DateTime = TimeSpan)","Przeciążaj zawsze dla czytelności","Przeciążanie operatorów jest w C# niedozwolone","Używaj << do zapisu do strumienia"],e:"Przeciążanie ma sens, gdy wynik jest oczywisty. Nie należy używać | do łączenia zapytań ani << do zapisu do strumienia.",w:["Wytyczne mówią: nie przesadzaj.","Przeciążanie jest w C# dozwolone.","To dokładnie przykład złej praktyki."]},{id:"w01-69",s:"i",q:"Która biblioteka desktopowa jest dostępna oficjalnie dla Windows i macOS (wieloplatformowa)?",a:["MAUI","WPF","WinForms","WinUI3"],e:"WinForms, WPF i WinUI3 są tylko dla Windows. MAUI działa na Windows i macOS. Avalonia i Uno (firm trzecich) działają na Windows, Linuksie i macOS.",w:["WPF – tylko Windows.","WinForms – tylko Windows.","WinUI3 – tylko Windows."]},{id:"w01-70",s:"i",q:"Które biblioteki UI (firm trzecich/społeczności) działają na Windows, Linuksie i macOS?",a:["Avalonia i Uno","WPF i WinForms","MAUI i WinUI3","Blazor i Razor"],e:"Avalonia i Uno działają na Windows, Linuksie i macOS. MAUI nie wspiera desktopowego Linuksa.",w:["Tylko Windows.","MAUI nie wspiera desktopowego Linuksa; WinUI3 to Windows.","To technologie webowe, nie desktopowe UI."]},{id:"w01-71",s:"i",q:"Gdzie można hostować aplikację ASP.NET Core?",a:["Samodzielnie (Kestrel) lub na IIS (tylko Windows)","Wyłącznie na IIS","Wyłącznie w Azure","Tylko w Dockerze"],e:"Aplikacje mogą być hostowane samodzielnie (Kestrel) lub na IIS (tylko Windows). Popularne jest Kestrel + reverse proxy.",w:["IIS to tylko jedna z opcji (i tylko Windows).","Azure to opcja, nie wymóg.","Docker to opcja, nie wymóg."]},{id:"w01-72",s:"i",q:"Jak nazywa się „oficjalny” ORM platformy .NET?",a:["Entity Framework Core","Hibernate","Dapper","sqlite-net-pcl"],e:"Oficjalnym ORM platformy .NET jest Entity Framework Core.",w:["Hibernate to Java (w .NET jest nHibernate).","Dapper to mikro-ORM, nie oficjalny.","sqlite-net-pcl to mała biblioteka dla SQLite."]},{id:"w01-73",s:"i",q:"Co jest oficjalnym frameworkiem wieloplatformowych aplikacji mobilnych .NET?",a:["MAUI (następca Xamarin.Forms)","Xamarin.Forms","WPF","Blazor"],e:"MAUI obsługuje Android, iOS, Windows (WinUI3), macOS (Catalyst) i Tizen. Jest rozwojową wersją Xamarin.Forms.",w:["Xamarin.Forms to poprzednik MAUI.","WPF to desktop Windows.","Blazor to web."]},{id:"w01-74",s:"i",q:"Czego używa Unity do kompilacji C# do kodu natywnego (AOT)?",a:["IL2CPP","RyuJIT",".NET Native","Roslyn"],e:"Unity używa C# jako języka skryptowego i translatora IL2CPP (AOT).",w:["RyuJIT to JIT, nie AOT.",".NET Native był dla UWP.","Roslyn kompiluje do IL."]},{id:"w01-75",s:"i",q:"Które projekty implementują .NET na mikrokontrolerach ARM?",a:["Meadow i nanoFramework","MAUI i Uno","ML.NET i ONNX","Blazor i WebAssembly"],e:"IoT: Meadow i nanoFramework implementują .NET na mikrokontrolerach ARM.",w:["MAUI i Uno to UI dla telefonów i desktopu.","To biblioteki AI.","To technologie webowe."]},{id:"w01-76",s:"i",q:"W jakich plikach definiowane są projekty .NET?",a:[".csproj (XML)",".sln","package.json","pom.xml"],e:"Projekty to pliki .csproj (XML), a solucje (zbiory projektów) to pliki .sln.",w:[".sln to solucje (zbiory projektów).","package.json to npm.","pom.xml to Maven."]},{id:"w01-77",s:"i",q:"Czym jest solucja (.sln)?",a:["Zbiorem projektów (np. główny, testy, wspólne biblioteki)","Pojedynczym projektem","Plikiem konfiguracji appsettings","Pakietem NuGet"],e:"Solucja to zbiór projektów zdefiniowany w pliku .sln.",w:["Projekt to .csproj.","appsettings to konfiguracja aplikacji.","NuGet to pakiety."]},{id:"w01-78",s:"i",q:"Co umożliwia .NET 10 w kontekście pojedynczych plików .cs?",a:["„Uruchomienie” samotnego pliku .cs (projekt tworzony w pamięci)","Kompilację bez CLR","Pominięcie typów","Uruchomienie w przeglądarce bez WebAssembly"],e:"Od .NET 10 można uruchomić samotny plik .cs, a projekt tworzony jest w pamięci.",w:["CLR nadal jest potrzebny.","Typy nadal obowiązują.","To nie ma związku z przeglądarką."]},{id:"w01-79",s:"h",q:'Kod: static int ToInt(this string s) => int.Parse(s); var x = "23".ToInt(); Jaka jest wartość x?',a:["23 (int)",'"23" (string)',"Błąd kompilacji – string nie ma metody ToInt","0"],e:"Metoda rozszerzająca (this string s) dodaje ToInt do stringa, więc x = 23.",w:["ToInt zwraca int, nie string.","Metoda rozszerzająca „dodaje” ToInt do stringa.",'int.Parse("23") = 23, nie 0.']},{id:"w01-80",s:"i",q:"Który język NIE jest implementacją na platformie .NET wymienioną na wykładzie?",a:["Kotlin/Native","F#","IronPython","C++/CLI"],e:"Wymienione: F#, Delphi.NET, COBOL.NET, C++/CLI, Perl.NET, IronPython, IKVM.NET. Języki .NET od początku miały współpracować (interoperacyjność).",w:["F# to drugi główny język .NET – jest na liście.","IronPython to Python na .NET – jest na liście.","C++/CLI działa na .NET – jest na liście."]}],lk={id:nk,title:tk,sections:rk,questions:sk},ck="w02",dk="W2 · ASP.NET Core MVC i Razor",wk=[{id:"a",title:"Odmiany ASP.NET Core",text:"**WebAPI** nie generuje HTML. Dostarcza API (JSON/XML) w postaci MVC bez widoków (V) albo jako minimal APIs. **Blazor** buduje aplikacje z komponentów, renderowanych na serwerze lub po stronie klienta (WebAssembly). Dawniej istniały **WebForms**, w których aplikacje webowe tworzono w podejściu RAD, na wzór aplikacji desktopowych."},{id:"b",title:"Wzorzec MVC",text:"W MVC **model** to dane, **widok** to prezentacja, a **kontroler** odbiera żądania użytkownika i manipuluje modelem. Logika biznesowa powinna być uruchamiana w kontrolerach, ale nie powinna się w nich znajdować.\n\nTypy modeli: **POCO** (Plain Old CLR Objects) to proste klasy z samymi właściwościami. **ViewModel** to model dla konkretnego widoku, powstały przez połączenie lub przetworzenie innych modeli. **DTO** (Data Transfer Object) to obiekt przenoszący dane między warstwami, zwłaszcza między klientem a bazą.\n\nASP.NET Core MVC działa według zasady **convention over configuration** (konwencja ponad konfigurację): struktura projektu jest stała, a nazwy folderów mają znaczenie. Kontroler dziedziczy po `Microsoft.AspNetCore.Mvc.Controller` i ma przyrostek `Controller` (np. `HomeController`) lub atrybut `[Controller]`."},{id:"c",title:"Struktura projektu MVC",text:'• Widok akcji leży w `Views/[Kontroler]/[Akcja].cshtml` (np. `Views/Home/Privacy.cshtml`).\n• `_ViewStart.cshtml` i `_ViewImports.cshtml` zawierają globalne ustawienia widoków.\n• `wwwroot/` zawiera pliki statyczne (HTML, grafiki, JavaScript, CSS). Domyślny szablon używa Bootstrap 5 i jQuery.\n• `Properties/` zawiera ustawienia uruchamiania (profile: samodzielnie, IIS, IIS Express).\n• `appsettings.json` to konfiguracja aplikacji (może być kilka plików dla różnych środowisk, często obok `secrets.json`).\n• `Program.cs` to punkt wejścia: kontroluje biblioteki (serwisy), mapuje routing i uruchamia aplikację.\n• Z hot reloadem aplikację uruchamia `dotnet watch run`.\n• Scaffolding widoków wymaga Visual Studio lub narzędzia `dotnet-aspnetcodegenerator`.\n\nW `Program.cs`: `builder.Services.AddControllersWithViews();` rejestruje usługi MVC, `UseStaticFiles` obsługuje `wwwroot`, a `app.MapControllerRoute(name: "default", pattern: "{controller=Home}/{action=Index}/{id?}")` definiuje routing konwencyjny z wartościami domyślnymi. Blok `if (!app.Environment.IsDevelopment()) { app.UseExceptionHandler("/Home/Error"); app.UseHsts(); }` działa poza środowiskiem Development (np. Production). W Development użytkownik widzi stronę wyjątku dewelopera.'},{id:"d",title:"Akcje kontrolera",text:'Publiczne metody kontrolera są akcjami, poza tymi z atrybutem `[NonAction]`. Parametry akcji są wiązane z danymi żądania i walidowane przez **model binding**. Akcje najczęściej zwracają `IActionResult` lub `Task<ActionResult>`.\n\n`return View();` używa widoku o nazwie akcji (np. `Index.cshtml`). Jawnie podana nazwa nadpisuje domyślną: `View("Index")` w akcji `Index2` pokaże `Views/Home/Index.cshtml`. Widok silnie typowany `@model float` z `@Model.ToString("F2")` pokaże `3.14` (w kulturze en-US; w pl-PL byłoby `3,14`).\n\nMetody pomocnicze: `Ok()` – 200, `BadRequest()` – 400, `NotFound()` – 404, `Redirect()` i `RedirectToAction()` – przekierowania. Przykład: `TestId(int? id)` z `BadRequest("Nie podano id")` dla `null` i `Ok(new { id })` zwróci dla `/Actions/TestId/3` odpowiedź 200 z JSON `{"id":3}`, a dla `/Actions/TestId` (bez id, bo `{id?}` jest opcjonalne) odpowiedź 400. `nameof(Index)` podaje nazwę akcji bez „magicznego” stringa, co jest bezpieczne przy refaktoryzacji.'},{id:"e",title:"Silnik Razor",text:'Domyślnym silnikiem szablonów jest **Razor** (znak `@` i tag helpers). Widoki MVC to pliki `.cshtml` w folderach kontrolerów (`.razor` to komponenty Blazor, `.aspx` to WebForms). Główny układ to `Views/Shared/_Layout.cshtml`, ustawiany w `_ViewStart.cshtml` (`Layout = "_Layout"`). Zawartość konkretnego widoku wstawia w nim `RenderBody()`.\n\nSkładnia:\n• Wyrażenia niejawne (`@...`) nie mogą zawierać spacji (poza `await`) ani typów generycznych (znaki `<` i `>` są traktowane jak HTML). Złożone wyrażenia zapisuje się w nawiasach: `@(GenericMethod<int>())`.\n• Łańcuchy są automatycznie kodowane HTML (ochrona przed XSS): `@("<span>Hello World</span>")` wyświetli tekst `&lt;span&gt;...`. `@Html.Raw(...)` wyłącza kodowanie, ale jest niebezpieczne dla danych od użytkownika.\n• Treść bloku `@{ ... }` nie jest renderowana, służy do kodu (zmienne, ustawienia, funkcje lokalne). Kod wykonuje się sekwencyjnie, więc `@{ var quote = "A"; } <p>@quote</p> @{ quote = "B"; } <p>@quote</p>` da `<p>A</p><p>B</p>`.\n• Dyrektywy: `@using` (przestrzenie nazw), `@inject` (wstrzyknięcie zależności), `@model` (typ modelu), `@attribute`, `@implements`, `@inherits`.\n• `@model` (mała litera) to dyrektywa określająca typ danych (silne typowanie, kontrola w czasie kompilacji), a `Model` (wielka litera) to zmienna z przekazanymi danymi.'},{id:"f",title:"Tag helpers",text:'**Tag helpers** dodają atrybuty do znaczników HTML (np. `asp-controller`, `asp-action`), dzięki czemu front-endowcy nie muszą znać Razor. Na przykład `<a asp-action="About">Kliknij</a>` generuje odnośnik do akcji `About` zgodnie z regułami routingu.'},{id:"g",title:"ViewData i ViewBag",text:'**ViewData** to słownik z wartościami typu `object`, więc wymaga rzutowania. **ViewBag** jest dynamiczny (`ViewBag.Klucz`) i nie wymaga rzutowania. Przykłady: `ViewBag.Klucz2 = 3` w akcji i `@(ViewBag.Klucz2 * 2)` w widoku wyświetli 6. `ViewData["Test"] = 2` i `@((ViewData["Test"] as int?) > 1)` wyświetli `True`.'},{id:"i",title:"Routing",text:'Domyślny szablon `{controller=Home}/{action=Index}/{id?}` odwzorowuje adres `/Products/Details/5` na akcję `Details` kontrolera `Products` z `id = 5`. Adres `/` trafia do `HomeController.Index`.\n\nPrzy kilku wywołaniach `MapControllerRoute` ważniejsza jest reguła zdefiniowana wcześniej. Parametr **catch-all** `{*article}` przechwytuje dowolną (także pustą) resztę ścieżki, np. `blog/{*article}` pasuje do `/Blog`, `/Blog/Article` i `/Blog/Article/dowolny-string`. Szablon `product/{id}-{name}` rozdziela segment w miejscu `-`, więc `/product/7-laptop` daje `id = 7` i `name = "laptop"`. Nazwy parametrów akcji muszą odpowiadać nazwom w szablonie.\n\nRouting atrybutowy (np. `[Route]`) nadpisuje routing konwencyjny. Gdy dwie akcje pasują do tej samej ścieżki, routing zgłasza wyjątek (niejednoznaczność). Typowy wzorzec: `GET /Products/Edit/5` pokazuje formularz, a akcję zatwierdzającą oznacza się `[HttpPost]`.'},{id:"j",title:"Model binding",text:"Model binding domyślnie pobiera dane z pól formularza, ciała żądania, danych routingu, query string i plików. Dane z routingu i query string są używane tylko do prostych typów (np. `int`, `bool`). Źródło można wymusić atrybutem: `[FromQuery]`, `[FromRoute]`, `[FromForm]`, `[FromBody]`, `[FromHeader]`. Na przykład `TestQuery([FromQuery] string? q)` dla `?q=abc` zwróci `Query to było: abc`, a `AddReview([FromForm] UserReview userReview)` pobiera dane z pól formularza HTML (POST)."},{id:"k",title:"Widoki częściowe i view components",text:'**Widoki częściowe (partial views)** to reużywalne fragmenty widoku, pozwalają uniknąć duplikacji. Zaleca się `@await Html.PartialAsync("profil")` (asynchroniczne wywołanie, lepsze niż `Partial()`) albo tag helper `<partial name="profil" />`. Widok częściowy dostaje kopię słownika `ViewData` i opcjonalnie model: `<partial name="profil" model="..." />`. Do układów służą layouts.\n\n**View components** są podobne do partiali, ale służą do treści wymagającej dodatkowego kodu serwerowego, np. komunikacji z bazą. Nie muszą opierać się o model.'},{id:"l",title:"Walidacja i szablony wyświetlania",text:'• `[Required]` wymusza dane, a typy wartościowe (np. `decimal`, `DateTime`) są zawsze wymagane (nie mogą być `null`).\n• `[DataType]` (np. `DataType.Currency`) steruje odpowiednim wyświetlaniem danych.\n• `[StringLength(60, MinimumLength = 3)]` ogranicza długość łańcucha do 3–60 znaków, a `[Range]` dotyczy wartości liczbowych.\n• Walidacja po stronie klienta (scaffolding) opiera się na atrybutach HTML5 `data-val-*` i jQuery Validation (trzeba dołączyć partial ze skryptami, `_ValidationScriptsPartial`).\n• `ModelState.IsValid` w akcji POST mówi, czy dane po bindingu spełniają reguły walidacji.\n• `@Html.DisplayFor` przyjmuje wyrażenie (lambdę) wybierające element modelu, np. `m => Model.Person.Salary`, i wyświetla go zgodnie z `[DataType]`.\n• **DisplayTemplate** i **EditorTemplate** to widoki częściowe do renderowania konkretnego elementu modelu. Atrybut `[UIHint("_Stars")]` wskazuje szablon `DisplayTemplates/_Stars.cshtml`, np. rysujący `Model` razy znak 🦀 (dla `Rating = 3` wynik to 🦀🦀🦀).'},{id:"m",title:"ViewModel, DTO i mapowanie",text:"Encji bazodanowych nie powinno się przekazywać bezpośrednio do widoku: model widoku rzadko odpowiada encji, część danych się pomija lub agreguje, dlatego używa się ViewModeli i DTO. Obiekty otrzymywane od klienta (np. DTO w POST) raczej nie powinny zawierać identyfikatora, któremu się ufa, bo klient może go podmienić. W architekturze **MVVM** (Model, Widok, ViewModel) kluczowy jest ViewModel. Jest ona popularna w aplikacjach mobilnych. Mapowanie DTO i encji automatyzują narzędzia **AutoMapper** i **Mapperly**."}],uk=[{id:"w02-01",s:"a",q:"Która odmiana ASP.NET Core NIE generuje HTML, a skupia się na dostarczaniu API (JSON/XML)?",a:["WebAPI","MVC","Razor Pages","Blazor"],e:"WebAPI nie odpowiada za generowanie HTML. Ma postać MVC bez V oraz minimal APIs.",w:["MVC renderuje HTML po stronie serwera.","Razor Pages też generuje HTML (SSR).","Blazor buduje UI z komponentów."]},{id:"w02-02",s:"a",q:"Czym jest Blazor?",a:["Podejściem z zawierającymi się w sobie komponentami, renderowanymi na serwerze lub kliencie","Silnikiem szablonów HTML","ORM-em","Odmianą WebForms"],e:"Blazor buduje aplikacje z komponentów, które mogą być renderowane na serwerze lub kliencie (WebAssembly).",w:["Silnik szablonów to Razor.","ORM to EF Core.","WebForms to inna, dawna technologia (RAD)."]},{id:"w02-03",s:"a",q:"Który dawny produkt ASP.NET tworzył aplikacje w podejściu RAD, na wzór aplikacji desktopowych?",a:["WebForms","Razor Pages","Blazor","MVC"],e:"Dawniej istniały WebForms, w których aplikacje webowe tworzono w podejściu RAD.",w:["Razor Pages to nowoczesne podejście „stron”, nie RAD.","Blazor to komponenty.","MVC to Model-Widok-Kontroler."]},{id:"w02-04",s:"b",q:"Za co odpowiada kontroler w architekturze MVC?",a:["Odbiera żądania użytkownika i manipuluje modelem","Prezentuje dane użytkownikowi","Przechowuje dane","Generuje CSS"],e:"Model to dane, widok to prezentacja, kontroler manipuluje modelem i odbiera żądania.",w:["Prezentacja to rola widoku.","Dane to model.","CSS nie jest rolą żadnej warstwy MVC."]},{id:"w02-05",s:"b",q:"Czym jest ViewModel?",a:["Klasą modelu danych przeznaczoną dla konkretnego widoku (połączenie/przetworzenie innych modeli)","Encją bazodanową","Kontrolerem widoku","Plikiem .cshtml"],e:"ViewModel to model dla konkretnego widoku, powstały przez połączenie lub przetworzenie innych modeli.",w:["Encja bazodanowa to model danych, nie model widoku.","ViewModel to model, nie kontroler.",".cshtml to sam widok."]},{id:"w02-06",s:"b",q:"Czym jest DTO?",a:["Obiektem pośrednim do przenoszenia danych między warstwami (np. klient ↔ baza)","Rodzajem widoku częściowego","Kontrolerem API","Dyrektywą Razor"],e:"DTO (Data Transfer Object) to obiekt transferowy między warstwami, zwłaszcza między klientem a bazą danych.",w:["Partial view to fragment widoku.","DTO to obiekt danych, nie kontroler.","Dyrektywy Razor to @model, @inject itd."]},{id:"w02-07",s:"b",q:"Jaką zasadą kierowano się przy budowie ASP.NET Core MVC, przez co nazwy folderów mają znaczenie?",a:["Konwencja ponad konfiguracją (convention over configuration)","Konfiguracja ponad konwencją","YAGNI","DRY"],e:"Convention over configuration: struktura projektu jest stała, a nazwy folderów mają znaczenie.",w:["Odwrotnie – konwencja ponad konfiguracją.","YAGNI to zasada „nie rób na zapas”.","DRY to „nie powtarzaj się” – nie dotyczy struktury folderów."]},{id:"w02-08",s:"b",q:"Jak musi być zdefiniowany kontroler MVC, by framework go rozpoznał?",a:["Klasa dziedzicząca po Controller z przyrostkiem Controller lub z atrybutem [Controller]","Dowolna klasa w folderze Models","Klasa z atrybutem [Route] obowiązkowo","Klasa statyczna"],e:"Kontrolery dziedziczą po Microsoft.AspNetCore.Mvc.Controller i mają przyrostek Controller (np. HomeController) lub atrybut [Controller].",w:["Folder Models zawiera modele, nie kontrolery.","[Route] jest opcjonalny.","Kontroler nie może być statyczny – framework tworzy jego instancje."]},{id:"w02-09",s:"b",q:"Gdzie powinna znajdować się logika biznesowa wg wykładu?",a:["Uruchamiana w kontrolerach, ale nie znajdująca się w nich","Bezpośrednio w kontrolerach","W widokach Razor","W wwwroot"],e:"Logika biznesowa powinna być uruchamiana w kontrolerach, ale nie powinna się w nich znajdować.",w:["Wg wykładu logika ma być tylko uruchamiana w kontrolerze.","Widoki to prezentacja – zero logiki biznesowej.","wwwroot to pliki statyczne."]},{id:"w02-10",s:"b",q:"Co oznacza POCO?",a:["Plain Old CLR Objects – proste klasy z samymi właściwościami","Partial Object Controller Output","Public Object Collection","Plain Old C# Operator"],e:"Modele to często POCO, czyli proste klasy zawierające tylko właściwości.",w:["P to Plain, nie Partial.","To nie kolekcja.","C to CLR, nie C#."]},{id:"w02-11",s:"c",q:"Który plik odpowiada za akcję Privacy kontrolera Home?",a:["Views/Home/Privacy.cshtml","Views/Privacy/Home.cshtml","Controllers/Home/Privacy.cshtml","Pages/Privacy.cshtml"],e:"Views/[Kontroler]/[Akcja].cshtml, czyli Views/Home/Privacy.cshtml.",w:["Folder to nazwa kontrolera (Home), plik to akcja (Privacy).","Widoki nie są w Controllers.","Pages/ to Razor Pages, nie MVC."]},{id:"w02-12",s:"c",q:"Które pliki zawierają globalne ustawienia widoków?",a:["_ViewStart.cshtml i _ViewImports.cshtml","_Layout.cshtml i Error.cshtml","appsettings.json i launchSettings.json","Program.cs i Startup.cs"],e:"_ViewStart.cshtml i _ViewImports.cshtml zawierają globalne ustawienia widoków.",w:["_Layout to szablon, Error to widok błędu.","To pliki konfiguracji aplikacji i uruchamiania.","To kod startowy aplikacji."]},{id:"w02-13",s:"c",q:"Co zawiera folder wwwroot/?",a:["Statyczne pliki: HTML, grafiki, JavaScript, CSS","Widoki .cshtml","Kontrolery","Migracje bazy"],e:"wwwroot/ zawiera pliki statyczne. Domyślny szablon używa Bootstrap 5 i jQuery.",w:["Widoki są w Views/.","Kontrolery są w Controllers/.","Migracje są w Migrations/."]},{id:"w02-14",s:"c",q:"Co zawiera folder Properties/?",a:["Ustawienia uruchamiania, m.in. profile uruchamiania (samodzielnie, IIS, IIS Express)","Właściwości modeli","Konfigurację bazy danych","Pliki statyczne"],e:"Properties/ zawiera ustawienia uruchamiania, np. profile (launchSettings).",w:["Właściwości modeli są w klasach w Models/.","Konfiguracja bazy (connection string) jest w appsettings/sekretach.","Pliki statyczne to wwwroot/."]},{id:"w02-15",s:"c",q:"Do czego służy appsettings.json?",a:["Do konfiguracji aplikacji (może być kilka plików dla różnych środowisk)","Do definiowania routingu","Do przechowywania widoków","Do listy pakietów NuGet"],e:"appsettings.json to konfiguracja aplikacji. Może być ich kilka (np. dla środowisk), często obok secrets.json.",w:["Routing definiuje Program.cs i atrybuty.","Widoki są w .cshtml.","Pakiety są w .csproj."]},{id:"w02-16",s:"c",q:"Co robi Program.cs w aplikacji ASP.NET Core?",a:["Jest punktem wejścia: dołącza biblioteki, mapuje routing i uruchamia aplikację","Zawiera tylko widoki","Definiuje modele","Przechowuje sekrety"],e:"Program.cs to punkt wejścia: kontroluje biblioteki (serwisy), mapuje routing i uruchamia aplikację.",w:["Widoki to .cshtml.","Modele to klasy w Models/.","Sekrety to secrets.json lub user secrets."]},{id:"w02-17",s:"c",q:"Jakie polecenie konsoli uruchamia aplikację z hot reloadem?",a:["dotnet watch run","dotnet run --hot","dotnet reload","dotnet build --watch"],e:"Aplikację z hot reloadem uruchamia się w konsoli poleceniem dotnet watch run.",w:["Nie ma flagi --hot.","Takiej komendy nie ma.","dotnet build nie ma trybu watch."]},{id:"w02-18",s:"d",q:"Które publiczne metody kontrolera NIE są akcjami?",a:["Te z atrybutem [NonAction]","Te zwracające void","Te z parametrami","Te z atrybutem [HttpPost]"],e:"Publiczne metody kontrolera to akcje, poza tymi oznaczonymi [NonAction].",w:["Akcja może zwracać void.","Parametry nie wykluczają akcji.","[HttpPost] nadal oznacza akcję – tylko dla POST."]},{id:"w02-19",s:"d",q:"Jak parametry akcji są wiązane z danymi żądania HTTP?",a:["Przez model binding (z walidacją)","Ręcznie przez Request.Form zawsze","Przez ViewBag","Przez routing tylko dla stringów"],e:"Parametry akcji są wiązane z danymi żądania i walidowane mechanizmem model binding.",w:["Request.Form to ręczny dostęp – binding robi to automatycznie.","ViewBag przekazuje dane do widoku, nie z żądania.","Routing wiąże też inne typy proste (np. int)."]},{id:"w02-20",s:"d",q:"Co najczęściej zwracają akcje kontrolera?",a:["IActionResult lub Task<ActionResult>","string","void","HttpResponse"],e:"Akcje najczęściej zwracają IActionResult lub Task<ActionResult>, czyli rezultat (HTML, plik, obrazek itp.).",w:["Mogą, ale typowo zwracają IActionResult.","void jest możliwe, ale nietypowe.","HttpResponse to obiekt kontekstu, nie typ zwracany akcji."]},{id:"w02-21",s:"d",q:"Jaki widok zostanie użyty przez akcję Index() z kodem return View(); ?",a:["Widok o nazwie akcji, czyli Index.cshtml","_Layout.cshtml","Default.cshtml","Żaden – wyjątek"],e:"Jeżeli ścieżka nie zostanie podana, uruchomiony zostanie widok o nazwie akcji.",w:["_Layout to szablon, a nie widok akcji.","Nie ma domyślnego Default.cshtml.","Wyjątku nie ma, gdy istnieje Index.cshtml."]},{id:"w02-22",s:"d",q:'W HomeController: public IActionResult Index2() { return View("Index"); } Który widok zobaczy użytkownik pod /Home/Index2?',a:["Views/Home/Index.cshtml","Views/Home/Index2.cshtml","Views/Shared/Index2.cshtml","Błąd – brak widoku Index2"],e:'Jawnie podana nazwa widoku ("Index") nadpisuje domyślną nazwę wynikającą z akcji.',w:["Jawna nazwa „Index” nadpisuje nazwę akcji.","Widok szukany jest najpierw w Views/Home, a i tak to Index.","Brak Index2.cshtml nie przeszkadza – szukany jest Index."]},{id:"w02-23",s:"d",q:'Kod: return View("FloatModel", 3.1415f); a widok: @model float  @Model.ToString("F2"). Co zostanie wyrenderowane (kultura en-US)?',a:["3.14","3.1415","FloatModel","3"],e:"Widok silnie typowany float formatuje do 2 miejsc po przecinku (F2). W kulturze pl-PL byłoby 3,14.",w:["F2 zaokrągla do 2 miejsc.","FloatModel to nazwa widoku, nie treść.","F2 nie obcina do liczby całkowitej."]},{id:"w02-24",s:"e",q:"Jaki jest domyślny silnik szablonów ASP.NET Core?",a:["Razor","Thymeleaf","Handlebars","Blade"],e:"Domyślnym silnikiem jest Razor, oparty o znak @ i tag helpers.",w:["Thymeleaf to Java/Spring.","Handlebars to JS.","Blade to PHP/Laravel."]},{id:"w02-25",s:"e",q:"W jakich plikach zapisywane są widoki ASP.NET Core MVC?",a:[".cshtml",".razor",".aspx",".html"],e:"Widoki MVC to pliki .cshtml grupowane w folderach kontrolerów. .razor to komponenty Blazor, .aspx to WebForms.",w:[".razor to komponenty Blazor.",".aspx to WebForms.","Zwykłe .html nie są przetwarzane przez Razor."]},{id:"w02-26",s:"e",q:"Jaka funkcja w layoucie wstawia zawartość konkretnego widoku?",a:["RenderBody()","RenderView()","RenderPartial()","@body"],e:"Widoki są umieszczane w globalnym szablonie jako wynik działania RenderBody().",w:["Nie ma RenderView().","RenderPartial wstawia widok częśc ] dla typów wartościowych (np. decimal, DateTime)?",a:["Typy wartościowe są zawsze wymagane","Atrybut jest ignorowany","Wymaga wartości różnej od 0","Powoduje błąd kompilacji"],e:"Atrybut [Required] wymusza podanie danych, a typy wartościowe (np. decimal, DateTime) są zawsze wymagane, bo nie mogą mieć wartości null.",w:["Nie jest ignorowany, ale typ wartościowy i tak ma wartość.","Nie sprawdza != 0 (0 to poprawna wartość).","Kompiluje się poprawnie."]},{id:"w02-66",s:"l",q:"Do czego służą atrybuty [DataType] (np. DataType.Currency)?",a:["Do odpowiedniego wyświetlania danych (np. waluta, data)","Do zmiany typu w bazie","Do walidacji wyrażeniem regularnym","Do szyfrowania"],e:"[DataType] obsługuje odpowiednie wyświetlanie, np. z DisplayFor.",w:["Nie zmienia typu w bazie (do tego służy [Column]).","Regex to [RegularExpression].","Nie szyfruje."]},{id:"w02-67",s:"l",q:"Który atrybut ogranicza długość łańcucha do 3–60 znaków?",a:["[StringLength(60, MinimumLength = 3)]","[Range(3, 60)]","[MaxLength(3, 60)]","[Length(60)]"],e:"StringLength(60, MinimumLength = 3). [Range] dotyczy wartości liczbowych.",w:["[Range] dotyczy liczb.","MaxLength nie przyjmuje dwóch parametrów.","[Length(60)] ma inną składnię."]},{id:"w02-68",s:"l",q:"Na czym opiera się walidacja po stronie klienta generowana przez scaffolding?",a:["Na atrybutach HTML5 data-* i jQuery Validation","Na Blazor WebAssembly","Na React","Tylko na walidacji serwerowej"],e:"Generowany HTML ma atrybuty data-val-*, które wykorzystuje jQuery Validation. Trzeba uruchomić partial ze skryptami (_ValidationScriptsPartial).",w:["Blazor nie jest używany.","React nie jest używany.","Jest też walidacja klienta."]},{id:"w02-69",s:"l",q:"Jaki parametr przyjmuje @Html.DisplayFor?",a:["Wyrażenie (lambda) wybierające element modelu, np. m => Model.Person.Salary","Nazwę pola jako string","Obiekt ViewData","Nazwę widoku"],e:"Parametrem DisplayFor jest wyrażenie wybierające element modelu. Wyświetla go zgodnie z [DataType].",w:["Przyjmuje wyrażenie, nie string.","ViewData nie jest parametrem.","Nazwa widoku nie jest parametrem."]},{id:"w02-70",s:"l",q:'W modelu: [UIHint("_Stars")] public int Rating, a DisplayTemplates/_Stars.cshtml: @model int  @for (int i = 0; i < Model; i++) { @Html.Raw("🦀") }. Co pokaże DisplayFor dla Rating = 3?',a:["🦀🦀🦀","3","_Stars","Rating: 3"],e:"UIHint wskazuje DisplayTemplate _Stars, który rysuje Model razy 🦀.",w:["UIHint wskazuje szablon, który rysuje kraby.","_Stars to nazwa szablonu, nie wynik.","Szablon nie wyświetla etykiety."]},{id:"w02-71",s:"l",q:"Czym są DisplayTemplate i EditorTemplate?",a:["Widokami częściowymi używanymi do renderowania konkretnego elementu modelu","Szablonami layoutu","Szablonami projektów w VS","Klasami walidacji"],e:"DisplayTemplate i EditorTemplate definiują partial do renderowania konkretnego elementu modelu.",w:["Layout to inny mechanizm.","To nie szablony projektów VS.","Walidacja to atrybuty."]},{id:"w02-72",s:"m",q:"Dlaczego nie powinno się przekazywać encji bazodanowych bezpośrednio do widoku?",a:["Model widoku rzadko odpowiada encji, część danych się pomija lub agreguje","Bo Razor nie obsługuje encji","Bo encje nie mają właściwości","Bo spowalnia to bazę danych"],e:"Często pomija się dane lub je agreguje. Model widoku rzadko odpowiada encji, dlatego używa się ViewModeli i DTO.",w:["Razor obsługuje dowolne klasy.","Encje mają właściwości.","Problem dotyczy architektury, nie wydajności bazy."]},{id:"w02-73",s:"m",q:"Czemu obiekty otrzymywane od klienta metodą POST (np. DTO) nie powinny zawierać identyfikatora, któremu się ufa?",a:["Klient może go podmienić – nie należy ufać danym od klienta","Bo POST nie przenosi liczb","Bo identyfikator jest zawsze 0","Bo EF nie pozwala na id"],e:"Obiekty od klienta raczej nie powinny zawierać identyfikatora, a przynajmniej nie należy mu ufać.",w:["POST przenosi dowolne dane.","Id nie jest zawsze 0.","EF pozwala na Id."]},{id:"w02-74",s:"m",q:"W jakiej architekturze ViewModel jest kluczowym elementem i gdzie jest popularna?",a:["MVVM – popularna w aplikacjach mobilnych","MVC – w grach","MVP – w bazach danych","REST – w API"],e:"MVVM (Model, Widok, ViewModel) jest popularna w aplikacjach mobilnych.",w:["MVC nie ma ViewModelu jako kluczowej warstwy.","MVP to inny wzorzec.","REST to styl API."]},{id:"w02-75",s:"m",q:"Jakie narzędzia automatyzują mapowanie DTO ↔ encje wg wykładu?",a:["AutoMapper, Mapperly","Entity Framework, Dapper","NuGet, MSBuild","Swagger, OpenAPI"],e:"Ręczne mapowanie jest żmudne, dlatego istnieją narzędzia, np. AutoMapper i Mapperly.",w:["To ORM-y.","To narzędzia pakietów i budowania.","To dokumentacja API."]},{id:"w02-76",s:"l",q:"Co sprawdza ModelState.IsValid w akcji POST?",a:["Czy dane przekazane przez model binding spełniają reguły walidacji","Czy użytkownik jest zalogowany","Czy baza danych jest dostępna","Czy widok istnieje"],e:"ModelState.IsValid mówi, czy model po bindingu przeszedł walidację (np. atrybuty data annotations).",w:["Logowanie sprawdza User.Identity.","Dostępność bazy to inna sprawa.","Istnienia widoku nie sprawdza."]},{id:"w02-77",s:"j",q:"Kod: [HttpPost] public IActionResult AddReview([FromForm] UserReview userReview). Skąd pochodzą dane userReview?",a:["Z pól formularza HTML (POST)","Z query string","Z nagłówków","Z ciała JSON"],e:"Atrybut [FromForm] wiąże dane z pól formularza HTML.",w:["Query string to [FromQuery].","Nagłówki to [FromHeader].","JSON to [FromBody]."]},{id:"w02-78",s:"c",q:'Co robi app.MapControllerRoute(name: "default", pattern: "{controller=Home}/{action=Index}/{id?}")?',a:["Definiuje routing oparty o konwencję z wartościami domyślnymi i opcjonalnym id","Definiuje routing atrybutowy","Rejestruje kontrolery w DI","Włącza pliki statyczne"],e:"MapControllerRoute definiuje ścieżki konwencyjne. Rejestrację serwisów MVC robi builder.Services.AddControllersWithViews().",w:["Routing atrybutowy to [Route].","Rejestracja w DI to AddControllersWithViews().","Pliki statyczne to UseStaticFiles()."]},{id:"w02-79",s:"c",q:"Która linia w Program.cs rejestruje usługi MVC (kontrolery z widokami)?",a:["builder.Services.AddControllersWithViews();","app.UseRouting();","app.MapControllerRoute(...);","app.UseStaticFiles();"],e:"AddControllersWithViews() rejestruje serwisy MVC. UseStaticFiles obsługuje wwwroot, a MapControllerRoute definiuje routing.",w:["UseRouting to middleware.","MapControllerRoute definiuje trasy.","UseStaticFiles obsługuje wwwroot."]},{id:"w02-80",s:"c",q:'W szablonie MVC: if (!app.Environment.IsDevelopment()) { app.UseExceptionHandler("/Home/Error"); app.UseHsts(); }. Kiedy użytkownik zobaczy stronę /Home/Error po wyjątku?',a:["Gdy aplikacja nie działa w środowisku Development (np. Production)","Zawsze","Tylko w Development","Nigdy – to tylko log"],e:"Handler wyjątków i HSTS są włączane poza środowiskiem Development. W Development widać stronę wyjątku dewelopera.",w:["W Development jest strona wyjątku dewelopera.","W Development nie trafia na /Home/Error.","To nie log – to przekierowanie do strony błędu."]}],zk={id:ck,title:dk,sections:wk,questions:uk},yk="w03",pk="W3 · Razor Pages, DI i Entity Framework Core",kk=[{id:"a",title:"Razor Pages",text:'**Razor Pages** tworzy aplikacje w oparciu o „strony” zamiast kontrolerów i widoków. Jest częściowo domyślnym podejściem, np. w Identity i w dokumentacji. Layout leży w `Pages/Shared/_Layout.cshtml` (w MVC w `Views/Shared/`).\n\nKażda strona składa się z pliku `.cshtml` (widok) i `.cshtml.cs` (logika, **code-behind**, mechanizm zbliżony do Web Forms). Plik widoku zaczyna się dyrektywą `@page` i ma model z code-behind (`@model IndexModel`). Klasy code-behind zwyczajowo mają przyrostek `Model` (`IndexModel : PageModel`). Code-behind to skrzyżowanie ViewModelu z kontrolerem: zawiera dane wyświetlane na stronie i metody reagujące na żądania. Publiczne właściwości strona odczytuje przez `Model` (np. `Model.People`).\n\nMetody `OnGet()` i `OnPost()` (lub wersje `Async`) reagują na GET i POST. Zwracają `void` (pokazują stronę) lub `IActionResult` (np. dla przekierowań).\n\nDyrektywa `@page "{id:int}"` steruje routingiem: segment `id` jest ograniczony do liczby całkowitej i trafia do `OnGet(int id = 0)`. `FirstOrDefault` zwraca `null`, gdy nie ma dopasowania (`First()` rzuciłby wyjątek). Link do strony z parametrem: `<a asp-page="Index" asp-route-id="2">`.\n\n`[BindProperty]` wiąże dane z żądania z właściwością modelu strony. Domyślnie dotyczy tylko POST, a dla GET trzeba jawnie ustawić `[BindProperty(SupportsGet = true)]` (ze względów bezpieczeństwa). Wielkość liter w nazwie parametru query string nie ma znaczenia. Typowy `OnPostAsync`: jeśli `!ModelState.IsValid`, zwraca `Page()` (strona wyświetla się ponownie z błędami). Inaczej robi `SaveChangesAsync()` i `RedirectToPage("./Index")`.'},{id:"b",title:"Wstrzykiwanie zależności (DI)",text:'**DI** to wzorzec, w którym klasy dostają zależności „z zewnątrz” zamiast same je tworzyć (osiąga się w ten sposób IoC, Inversion of Control). Typy rejestruje się w `Program.cs` (`builder.Services`), a zależność deklaruje w konstruktorze kontrolera, modelu strony lub usługi.\n\nCykl życia zarejestrowanych obiektów:\n• **Transient** – nowy obiekt przy każdym wstrzyknięciu,\n• **Scoped** – ten sam obiekt w obrębie jednego żądania HTTP,\n• **Singleton** – jeden obiekt przez cały cykl życia aplikacji.\n\nRejestracja `AddTransient<IHelper, Helper>()` oznacza, że konstruktor oczekujący `IHelper` dostanie nowy obiekt `Helper`. Jeśli zarejestrowano tylko `AddTransient<Helper>()`, a konstruktor oczekuje interfejsu `IHelper`, wystąpi błąd: interfejs trzeba zarejestrować jawnie. Do DI można też przekazać metodę fabrykującą: `AddSingleton<IHelper, Helper>(_ => new Helper("test"))` (singleton wywoła ją raz).'},{id:"c",title:"Logger i rejestracja Razor Pages",text:"`ILogger<T>` jest wstrzykiwany przez DI, a jego konfiguracja w `Program.cs` jest niejawna, więc nie trzeba go rejestrować. Z primary constructor (C# 12) wygląda to tak: `public class DiPrimaryModel(ILogger<DiPrimaryModel> logger) : PageModel`, a parametr jest dostępny w całej klasie bez jawnego pola.\n\n`builder.Services.AddRazorPages()` to metoda rozszerzająca (dodana przez zaimportowaną bibliotekę), która rejestruje serwisy Razor Pages. `app.MapRazorPages()` mapuje endpointy stron w potoku aplikacji."},{id:"d",title:"ORM i providery bazy danych",text:`**ORM** (Object-Relational Mapping) mapuje encje i relacje bazodanowe na obiekty języka obiektowego. Oficjalny (1st party) ORM platformy to **Entity Framework Core**. Alternatywy to nHibernate i Dapper.

Oficjalnie EF Core obsługuje SQL Server (i LocalDB), SQLite, InMemory oraz Azure Cosmos DB. PostgreSQL, MySQL i Oracle wymagają providerów firm trzecich. Provider **InMemory** to ograniczona baza testowa działająca tylko w pamięci operacyjnej.

Zależnościami zarządza **NuGet** (narzędzie w .NET SDK i serwis nuget.org).`},{id:"e",title:"Connection string i sekrety",text:"**Connection string** zawiera nazwę bazy, użytkownika, hasło i ustawienia połączenia, np. `Data Source=movies.db`. Nie należy przechowywać go z hasłem w kodzie źródłowym ani w `appsettings.json`, bo te pliki mogą trafić do kontroli wersji. Zamiast tego używa się sekretów (`dotnet user-secrets`, w Visual Studio „Manage user secrets”). Plik sekretów to JSON w katalogu domowym użytkownika (`~/.microsoft` lub `%APPDATA%`), poza repozytorium projektu. Przy wdrożeniu sekrety przekazuje się jako zmienne środowiskowe albo przez rozwiązania typu Azure Key Vault i Hashicorp Vault."},{id:"f",title:"EF Core: modelowanie i DbContext",text:'**Code First**: model definiuje się klasami C# (adnotacje, konwencje lub Fluent API), a baza powstaje z nich (przez migracje). **Database First**: klasy generuje się z istniejącej bazy poleceniem `dotnet ef dbcontext scaffold`.\n\nDomyślnie mapowane są publiczne właściwości z `get` i `set` (wyłącza to `[NotMapped]`). Domyślnie nazwa tabeli to nazwa klasy, a nazwa kolumny to nazwa właściwości. `[Column("quote_id")]` zmienia nazwę kolumny, a `[Column(TypeName = "varchar(200)")]` ustawia typ w bazie. Klucz główny EF Core rozpoznaje konwencją: właściwość `Id` lub `<NazwaKlasy>Id` (np. `AuthorId`).\n\nKontekst danych to klasa dziedzicząca po **DbContext** (implementuje wzorzec repozytorium). Tabele reprezentują jego właściwości `DbSet<T>`, np. `public DbSet<Quote> Quotes { get; set; }`. Kontekst rejestruje się w `Program.cs` przed `builder.Build()`: `builder.Services.AddDbContext<QuotesDbContext>(o => o.UseSqlite(builder.Configuration.GetConnectionString("QuotesDatabase")))`.'},{id:"g",title:"LINQ",text:"**LINQ** (Language INtegrated Query) działa na `IEnumerable` i `IQueryable`. Jest dostępny od .NET Framework 3.5 (C# 3.0). Opiera się na **drzewach wyrażeń** (expression trees), które pozwalają np. przetłumaczyć zapytanie na SQL w czasie wykonywania, oraz intensywnie korzysta z lambd, metod i typów anonimowych.\n\nOperacje: `Select()` to projekcja (map), a `Where()` to filtr. `Single()` rzuca wyjątek, gdy elementów jest więcej niż jeden. `First()` rzuca wyjątek dla pustej kolekcji, a `FirstOrDefault()` zwraca `null` (default). Przykład: `Skip(1).Take(3).Sum()` dla `{1,2,3,4,5}` daje 2 + 3 + 4 = 9. `p.Select(x => x.Age).Sum()` dla wieków 19 i 40019 daje 40038.\n\nZapytania LINQ zwracające `IEnumerable` są obliczane **leniwie** aż do materializacji (`ToList()`, `ToArray()`). Zapytanie `_context.Quotes.Where(x => x.Id > 0)` bez `ToList()` nie zostało więc jeszcze wykonane, wykona się przy iteracji (np. w widoku). W EF Core wyrażenia LINQ są obliczane na serwerze bazy. Jeśli operacji nie da się przetłumaczyć, EF rzuca wyjątek (ze względu na wydajność)."},{id:"h",title:"Fluent API i migracje",text:"**Fluent API** to wzorzec builder w metodzie `OnModelCreating(ModelBuilder)` kontekstu, np. `modelBuilder.Entity<Quote>().HasKey(c => new { c.Id, c.Date })` definiuje złożony klucz główny.\n\n**Migracje** porównują bieżący stan modelu z poprzednim i generują operacje `CREATE`/`ALTER`/`DROP` na schemacie. Pozwalają też zasiać dane. `dotnet ef migrations add` tworzy migrację, a `dotnet ef database update` stosuje ją do bazy. Pułapka SQLite: nie ma `ALTER TABLE DROP COLUMN`, więc wymaga przebudowy tabeli."},{id:"i",title:"Relacje i ładowanie danych w EF Core",text:'**Navigation property** to właściwość wskazująca na powiązaną encję lub kolekcję (nie typ skalarny), np. `Author Author` albo `List<Quote> Quotes`. Na jej podstawie powstają relacje. Dla wymaganej relacji 1:n konwencje włączają usuwanie kaskadowe (dla niewymaganych ustawiają `null`). Relację 1:n w Fluent API zapisuje się: `modelBuilder.Entity<Quote>().HasOne(p => p.Author).WithMany(b => b.Quotes);`. Relacja wiele-do-wielu wymaga kolekcji po obu stronach (często `ICollection<T>`).\n\nDane z tabel powiązanych nie są ładowane automatycznie. Włącza się je przez `Include()` i `ThenInclude()`: `Authors.Where(x => x.Name == "Otto").Include(x => x.Quotes).ThenInclude(x => x.Tags)` załaduje autorów Otto z ich cytatami i tagami cytatów. Bez `Include(n => n.Author)` właściwość `Author` jest `null`, więc `@Model.Author.Name` w widoku rzuci `NullReferenceException`.\n\n„Zaślepki” (stub) z `_context.Attach(new Author { AuthorId = 1 })` pozwalają powiązać nowy `Quote` z istniejącym `Author` bez pobierania go z bazy. `Attach` oznacza encję jako istniejącą.'},{id:"j",title:"Śledzenie zmian i zapis",text:"EF Core śledzi (tracking) encje pobrane z kontekstu. Zmiany nie trafią do bazy, dopóki nie wywołasz `SaveChanges()` lub `SaveChangesAsync()`. Jeśli encja jest śledzona, zmiana właściwości i `SaveChanges()` wystarczą, więc wywołanie `_context.Update(e)` nie jest potrzebne."},{id:"k",title:"SQL i inne bazy danych",text:'Zwykłe polecenie SQL mapowane na obiekty wykonuje `FromSqlRaw()`, np. `_context.Quotes.FromSqlRaw("SELECT * FROM Quotes WHERE quote_id = 3 LIMIT 1")`. **Dapper** to prosty mapper (mikro-ORM): mapuje wyniki zwykłych zapytań SQL na typy .NET i nie śledzi obiektów.\n\nInne bazy: **LiteDB** (embedded jak SQLite, ale dokumentowa jak Mongo, w pełni w C#), **InfluxDB** (szeregi czasowe), **Qdrant** (wektorowa, z oficjalnym SDK do .NET), CouchDB (dokumentowa, dostęp przez HTTP). Bazy klucz-wartość to m.in. Redis, Azure Cosmos DB, RocksDB, FASTER i ZoneTree.'}],mk=[{id:"w03-01",s:"a",q:"Na jakiej koncepcji opiera się Razor Pages?",a:["Na „stronach” zamiast kontrolerów i widoków","Na komponentach renderowanych w WebAssembly","Na kontrolerach bez widoków","Na mikroserwisach"],e:"Razor Pages tworzy aplikacje w oparciu o koncepcję stron zamiast kontrolerów i widoków.",w:["WebAssembly to Blazor.","Kontrolery bez widoków to WebAPI.","Mikroserwisy to architektura, nie Razor Pages."]},{id:"w03-02",s:"a",q:"Gdzie Razor Pages jest (częściowo) domyślnym podejściem zamiast MVC wg wykładu?",a:["W mechanizmie Identity oraz w dokumentacji","W WebAPI","W Blazor","W Minimal APIs"],e:"Razor Pages jest częściowo domyślnym podejściem, np. w Identity i w dokumentacji.",w:["WebAPI nie generuje stron.","Blazor to komponenty.","Minimal APIs to endpointy bez stron."]},{id:"w03-03",s:"a",q:"Z jakich plików składa się pojedyncza strona Razor Pages?",a:[".cshtml (widok) i .cshtml.cs (code-behind)",".razor i .razor.cs",".cshtml i Controller.cs",".html i .js"],e:"Każda strona to .cshtml (widok) i .cshtml.cs (logika, code-behind).",w:[".razor to Blazor.","Razor Pages nie ma kontrolerów.","To nie statyczne pliki HTML i JS."]},{id:"w03-04",s:"a",q:"Do jakiej technologii wykład porównuje mechanizm code-behind Razor Pages?",a:["Web Forms","Blazor","WebAPI","WPF"],e:"Mechanizm code-behind w Razor Pages jest zbliżony do aplikacji Web Forms.",w:["Blazor to komponenty, nie code-behind.","WebAPI nie ma widoków.","WPF to desktop."]},{id:"w03-05",s:"a",q:"Jaka dyrektywa musi być na początku pliku strony Razor Pages?",a:["@page","@model","@inject","@layout"],e:"Stosowana jest dyrektywa @page. Strona podlega modelowi z pliku code-behind (@model IndexModel).",w:["@model jest, ale to @page czyni plik stroną.","@inject wstrzykuje zależności.","@layout nie jest wymagane."]},{id:"w03-06",s:"a",q:"Czym jest code-behind (PageModel) wg wykładu?",a:["Skrzyżowaniem ViewModelu z kontrolerem","Czystym widokiem","Encją bazodanową","Klasą konfiguracji"],e:"Code-behind zawiera dane wyświetlane na stronie oraz metody reagujące na żądania, czyli jest skrzyżowaniem ViewModelu z kontrolerem.",w:["Widok to .cshtml.","Encje to modele bazy.","Konfiguracja jest w Program.cs."]},{id:"w03-07",s:"a",q:"Jaki przyrostek mają zwyczajowo klasy code-behind w Razor Pages?",a:["Model (np. IndexModel)","Controller","Page","ViewModel"],e:"Konwencja: przyrostek „Model”, np. IndexModel : PageModel.",w:["Controller to przyrostek MVC.","Page to klasa bazowa (PageModel), nie konwencja nazwy.","ViewModel to inny wzorzec."]},{id:"w03-08",s:"a",q:"Która metoda PageModel uruchamia się w odpowiedzi na żądanie POST?",a:["OnPost() / OnPostAsync()","Post()","HandlePost()","OnSubmit()"],e:"OnGet() i OnPost() (lub wersje Async) uruchamiają się w odpowiedzi na GET i POST.",w:["Konwencja wymaga prefiksu On.","Nie ma HandlePost.","Nie ma OnSubmit."]},{id:"w03-09",s:"a",q:"Co mogą zwracać metody OnGet()/OnPost()?",a:["void lub IActionResult (np. dla przekierowań)","Tylko void","Tylko string","Tylko View()"],e:"Zwracają void lub IActionResult, który pozwala np. na przekierowania. Domyślnie pokazują stronę widoku.",w:["Może też zwracać IActionResult.","Nie zwraca string.","View() to metoda kontrolerów MVC (strony zwracają Page())."]},{id:"w03-10",s:"a",q:"Gdzie znajduje się pełny layout aplikacji Razor Pages?",a:["Pages/Shared/_Layout.cshtml","Views/Shared/_Layout.cshtml","wwwroot/_Layout.cshtml","Pages/_Layout.cs"],e:"W Razor Pages layout jest w Pages/Shared/_Layout.cshtml, a w MVC w Views/Shared/.",w:["Views/Shared to MVC.","wwwroot to statyczne pliki.","Layout to .cshtml, nie .cs."]},{id:"w03-11",s:"a",q:"Jak strona .cshtml odwołuje się do publicznych właściwości code-behind?",a:["Przez obiekt Model (np. Model.People)","Przez ViewBag","Przez this.Page","Przez @inject"],e:"Typowa konwencja to publiczne właściwości w PageModel, do których strona odwołuje się przez Model.",w:["ViewBag to inna droga (MVC).","Nie ma this.Page.","@inject wstrzykuje serwisy."]},{id:"w03-12",s:"a",q:'Strona ma @page "{id:int}" i OnGet(int id = 0). Co oznacza {id:int}?',a:["Segment routingu id z ograniczeniem do liczby całkowitej","Query string ?id=","Pole formularza","Nagłówek HTTP"],e:"Dyrektywą @page można sterować routingiem i definiować zmienne trafiające do OnGet(). :int to ograniczenie typu.",w:["Query string to ?id=.","To nie pole formularza.","To nie nagłówek."]},{id:"w03-13",s:"a",q:"Kod Index2: OnGet(int id = 0) { Current = People.FirstOrDefault(x => x.Id == id); }. Co jest w Current, gdy nie ma osoby o danym id?",a:["null","Pierwsza osoba ania"],e:"Domyślnie nazwa tabeli to nazwa klasy, a kolumny to nazwa właściwości. [Column] pozwala to zmienić i ustawić typ.",w:["Walidacja to [StringLength].","Klucz obcy to [ForeignKey].","Wyłączenie mapowania to [NotMapped]."]},{id:"w03-47",s:"f",q:"Jak domyślnie (konwencją) EF Core rozpoznaje klucz główny?",a:["Właściwość o nazwie Id lub <NazwaKlasy>Id","Pierwsza właściwość w klasie","Właściwość typu Guid","Musi być atrybut [Key]"],e:"Konwencja: Id lub <Klasa>Id (np. AuthorId). Notatka wykładowcy: „coś z id w nazwie będzie kluczem głównym”.",w:["Kolejność właściwości nie decyduje.","Typ Guid nie jest wymagany.","[Key] jest opcjonalny dzięki konwencji."]},{id:"w03-48",s:"f",q:"Po jakiej klasie dziedziczy kontekst danych EF Core?",a:["DbContext","DbSet","PageModel","Controller"],e:"Tworzy się klasę dziedziczącą po DbContext, która implementuje wzorzec repozytorium.",w:["DbSet to tabela w kontekście.","PageModel to Razor Pages.","Controller to MVC."]},{id:"w03-49",s:"f",q:"Jaki typ mają właściwości DbContext reprezentujące tabele (encje)?",a:["DbSet<T>","List<T>","IEnumerable<T>","DbTable<T>"],e:"DbContext zawiera właściwości DbSet<T>, np. public DbSet<Quote> Quotes { get; set; }.",w:["List<T> nie zapewnia dostępu do bazy.","IEnumerable – to nie typ właściwości w kontekście.","DbTable nie istnieje."]},{id:"w03-50",s:"f",q:"Jak zarejestrować DbContext z SQLite w Program.cs?",a:['builder.Services.AddDbContext<QuotesDbContext>(o => o.UseSqlite(builder.Configuration.GetConnectionString("QuotesDatabase")));',"app.UseDbContext<QuotesDbContext>();",'new QuotesDbContext("Data Source=quotes.db") w kontrolerze',"builder.Services.AddSingleton<SqliteConnection>();"],e:"AddDbContext rejestruje kontekst w DI (przed builder.Build()), a connection string pochodzi z konfiguracji lub sekretów.",w:["Nie ma UseDbContext.","new w kontrolerze łamie DI.","Rejestracja samego połączenia to nie DbContext."]},{id:"w03-51",s:"f",q:"Kiedy w Program.cs należy zarejestrować DbContext?",a:["Przed builder.Build()","Po app.Run()","Po builder.Build()","W dowolnym momencie"],e:"Rejestracja serwisów musi nastąpić przed builder.Build().",w:["Po Run() kod się nie wykona.","Po Build() kontener jest już zamknięty.","Kolejność ma znaczenie."]},{id:"w03-52",s:"g",q:"Co oznacza skrót LINQ?",a:["Language INtegrated Query","Linked Query","Lightweight Integrated Query","List Iteration Query"],e:"LINQ = Language INtegrated Query, oparte o IEnumerable i IQueryable.",w:["Nie Linked.","Nie Lightweight.","Nie List Iteration."]},{id:"w03-53",s:"g",q:"Od której wersji .NET Framework dostępny jest LINQ?",a:["3.5","2.0","4.0","4.5"],e:"LINQ jest dostępny od .NET Framework 3.5 (język C# 3.0).",w:["2.0 to generyki.","4.0 to dynamic.","4.5 – za późno, LINQ był wcześniej."]},{id:"w03-54",s:"g",q:"Na czym zbudowany jest LINQ, co pozwala obliczać zapytania w czasie wykonywania (np. tłumaczyć na SQL)?",a:["Na drzewach wyrażeń (expression trees)","Na refleksji atrybutów","Na wątkach","Na dynamic"],e:"LINQ zbudowany jest w oparciu o drzewa wyrażeń i intensywnie korzysta z lambd, metod i typów anonimowych.",w:["Atrybuty to nie podstawa LINQ.","Wątki nie są podstawą.","dynamic nie jest podstawą."]},{id:"w03-55",s:"g",q:"Która operacja LINQ odpowiada „map” (projekcja)?",a:["Select()","Where()","Take()","OrderBy()"],e:"Select() to projekcja (map), a Where() to filtr.",w:["Where to filter.","Take ogranicza liczbę.","OrderBy sortuje."]},{id:"w03-56",s:"g",q:"Która operacja LINQ odpowiada „filter”?",a:["Where()","Select()","Skip()","Count()"],e:"Where() zwraca tylko elementy spełniające predykat.",w:["Select to map.","Skip pomija.","Count liczy."]},{id:"w03-57",s:"g",q:"Co robi Single(), gdy kolekcja zawiera więcej niż jeden element?",a:["Rzuca wyjątek","Zwraca pierwszy","Zwraca null","Zwraca ostatni"],e:"Single/SingleOrDefault wybiera jedyny element, a gdy jest ich więcej, rzuca wyjątek.",w:["To zachowanie First.","SingleOrDefault zwraca null tylko dla pustej kolekcji – dla wielu też rzuca.","Nie zwraca ostatniego."]},{id:"w03-58",s:"g",q:"Co robi First(), gdy kolekcja jest pusta?",a:["Rzuca wyjątek","Zwraca null","Zwraca default(T)","Zwraca pustą listę"],e:"First() rzuca wyjątek, a FirstOrDefault() zwraca null (default).",w:["null zwraca FirstOrDefault.","default(T) zwraca FirstOrDefault.","Pusta lista to Where()."]},{id:"w03-59",s:"g",q:"Kod: var p = new[]{1,2,3,4,5}; var r = p.Skip(1).Take(3).Sum(); Jaka jest wartość r?",a:["9","6","12","15"],e:"Skip(1) daje 2,3,4,5, Take(3) daje 2,3,4, a suma to 9.",w:["6 to suma 1+2+3 (bez Skip).","12 to 3+4+5 (Skip 2).","15 to suma wszystkich."]},{id:"w03-60",s:"g",q:"Jak obliczane są zapytania LINQ zwracające IEnumerable?",a:["Leniwie (lazy evaluation) – do momentu materializacji","Natychmiast przy definicji","Równolegle zawsze","Tylko po stronie klienta"],e:"LINQ jest leniwy. Aby faktycznie wykonać zapytanie, trzeba je zmaterializować: ToList(), ToArray().",w:["Nie natychmiast – leniwie.","Nie zawsze równolegle (to PLINQ).","Dla EF zapytanie wykonuje baza."]},{id:"w03-61",s:"g",q:"Kod: var query = _context.Quotes.Where(x => x.Id > 0); (bez ToList). Czy zapytanie SQL zostało już wykonane?",a:["Nie – zostanie wykonane dopiero przy materializacji/iteracji","Tak, natychmiast","Tak, ale bez WHERE","Nie, nigdy nie zostanie wykonane"],e:"Notatka wykładowcy: nie ma ToList(), więc zapytanie nie zostanie zmaterializowane. Wykona się przy iteracji (np. w widoku).",w:["Nie natychmiast – jest leniwe.","WHERE zostanie przetłumaczone na SQL.","Wykona się przy iteracji."]},{id:"w03-62",s:"g",q:"Która metoda materializuje zapytanie LINQ?",a:["ToList()","Where()","Select()","OrderBy()"],e:"Konwersje materializujące: ToArray(), ToList(). Wymienione są też AsEnumerable() i AsQueryable().",w:["Where nie materializuje.","Select nie materializuje.","OrderBy nie materializuje."]},{id:"w03-63",s:"g",q:"Gdzie obliczane są wyrażenia LINQ dla SZBD w EF Core?",a:["Na serwerze bazodanowym; jeśli operacji nie da się przetłumaczyć – wyjątek","Zawsze w pamięci aplikacji","W przeglądarce","Losowo"],e:"Wyrażenia są ewaluowane na serwerze bazy. Gdyby operacja miała być wykonana po stronie aplikacji, EF rzuci wyjątek (wydajność).",w:["Nie w pamięci – na serwerze bazy.","Nie w przeglądarce.","Nie losowo."]},{id:"w03-64",s:"h",q:"Gdzie konfiguruje się mapowanie za pomocą Fluent API?",a:["W metodzie OnModelCreating(ModelBuilder) DbContextu","W Program.cs w AddDbContext","W atrybutach klasy","W appsettings.json"],e:"Fluent API to wzorzec builder w OnModelCreating, np. modelBuilder.Entity<Quote>().HasKey(…).",w:["AddDbContext to rejestracja.","Atrybuty to alternatywa dla fluent.","appsettings nie konfiguruje mapowania."]},{id:"w03-65",s:"h",q:"Co robi modelBuilder.Entity<Quote>().HasKey(c => new { c.Id, c.Date });?",a:["Definiuje złożony klucz główny z Id i Date","Tworzy indeks na Date","Definiuje relację 1:n","Tworzy dwie tabele"],e:"HasKey z typem anonimowym definiuje klucz złożony.",w:["To nie indeks.","Relację opisują HasOne/WithMany.","Tworzy jedną tabelę."]},{id:"w03-66",s:"h",q:"Co robi mechanizm migracji EF Core?",a:["Porównuje bieżący stan modelu z poprzednim i generuje operacje CREATE/ALTER/DROP","Przenosi dane między serwerami","Kopiuje bazę do chmury","Generuje klasy z bazy"],e:"Migracje porównują stan modelu z poprzednim i przygotowują operacje na schemacie. Pozwalają też zasiać dane.",w:["Nie przenosi danych między serwerami.","Nie kopiuje do chmury.","Generowanie klas z bazy to scaffold."]},{id:"w03-67",s:"h",q:"Które polecenie aplikuje migracje do bazy danych?",a:["dotnet ef database update","dotnet ef migrations add","dotnet ef scaffold","dotnet build"],e:"dotnet ef migrations add tworzy migrację, a dotnet ef database update aplikuje ją do bazy.",w:["migrations add tylko tworzy migrację.","scaffold to Database First.","build nie dotyka bazy."]},{id:"w03-68",s:"h",q:"Jaką pułapkę migracji z SQLite zanotował wykładowca?",a:["SQLite nie ma ALTER TABLE DROP COLUMN","SQLite nie obsługuje kluczy głównych","SQLite nie wspiera migracji w ogóle","SQLite wymaga hasła"],e:"Notatka: SQLite nie ma ALTER TABLE DROP COLUMN (wymaga przebudowy tabeli).",w:["Ma klucze główne.","Migracje są wspierane.","SQLite nie wymaga hasła."]},{id:"w03-69",s:"i",q:"Czym jest navigation property w EF Core?",a:["Właściwością wskazującą na powiązaną encję/kolekcję (nie typ skalarny)","Kluczem głównym","Właściwością [NotMapped]","Właściwością typu string"],e:"Navigation property to właściwość, której nie da się zmapować na typ skalarny (np. Author Author, List<Quote> Quotes). Na jej podstawie powstają relacje.",w:["Klucz główny to Id.","[NotMapped] wyłącza mapowanie.","String to typ skalarny."]},{id:"w03-70",s:"i",q:"Jakie domyślne zachowanie usuwania tworzą konwencje dla wymaganej relacji 1:n?",a:["Usuwanie kaskadowe","Ustawianie null","Brak akcji","Blokada usunięcia"],e:"Konwencje aktywują usuwanie kaskadowe dla wymaganych połączeń oraz ustawianie null dla niewymaganych.",w:["Ustawianie null dotyczy niewymaganych relacji.","Domyślnie jest kaskada.","Blokada nie jest domyślna."]},{id:"w03-71",s:"i",q:"Jak wyrazić relację 1:n Quote → Author w Fluent API?",a:["modelBuilder.Entity<Quote>().HasOne(p => p.Author).WithMany(b => b.Quotes);","modelBuilder.Entity<Quote>().HasMany(p => p.Author).WithOne();","modelBuilder.Relation<Quote, Author>(1, n);","modelBuilder.Entity<Author>().HasKey(a => a.Quotes);"],e:"Quote ma jednego Author (HasOne), a Author ma wiele Quotes (WithMany).",w:["Odwrotnie – HasOne z perspektywy Quote.","Nie ma takiej metody.","Kolekcja to nie klucz."]},{id:"w03-72",s:"i",q:"Czego wymaga relacja wiele-do-wielu w EF Core (konwencja)?",a:["Kolekcji po obydwu stronach relacji (np. ICollection<Tag> i ICollection<Quote>)","Jawnej klasy tabeli łączącej zawsze","Atrybutu [ManyToMany]","Klucza złożonego w obu tabelach"],e:"Relacje n:n wymagają kolekcji po obu stronach. Często używa się ICollection<T> zamiast List<T>.",w:["Od EF Core 5 nie trzeba jawnej klasy łączącej.","Nie ma [ManyToMany].","Klucz złożony nie jest wymagany."]},{id:"w03-73",s:"i",q:"Czy EF Core domyślnie ładuje dane z tabel powiązanych (np. Author dla Quote)?",a:["Nie – trzeba je włączyć przez Include()/ThenInclude()","Tak, zawsze","Tak, ale tylko dla relacji n:n","Tylko w trybie InMemory"],e:"Dane z tabel podrzędnych nie są wybierane automatycznie. Włącza się je przez Include() i ThenInclude().",w:["Nie zawsze – tylko z Include.","Dotyczy wszystkich relacji.","Nie zależy od providera."]},{id:"w03-74",s:"i",q:'Kod: _context.Authors.Where(x => x.Name == "Otto").Include(x => x.Quotes).ThenInclude(x => x.Tags). Co zostanie załadowane?',a:["Autorzy o imieniu Otto z ich cytatami i tagami tych cytatów","Tylko autorzy","Wszystkie cytaty i tagi niezależnie od autora","Tylko tagi"],e:"Include ładuje kolekcję Quotes, a ThenInclude kolejny poziom, czyli Tags każdego cytatu.",w:["Include ładuje też cytaty.","Filtr Where zawęża autorów.","Ładuje autorów, cytaty i tagi."]},{id:"w03-75",s:"i",q:"Kod: var q = _context.Quotes.First(x => x.Id == 1); return View(q); a widok wyświetla @Model.Author.Name. Co się stanie (bez lazy loading)?",a:["Author będzie null → NullReferenceException","Author zostanie automatycznie doczytany","Wyświetli pusty napis bez błędu","Błąd kompilacji"],e:"Bez Include(n => n.Author) navigation property nie jest ładowana i ma wartość null. W przykładzie z kodu użyto _context.Quotes.Include(n => n.Author).",w:["Bez lazy loading nic nie jest doczytywane.","Dereferencja null rzuca wyjątek.","Kompiluje się poprawnie."]},{id:"w03-76",s:"j",q:"Kiedy zmiany w śledzonych encjach zostaną zapisane do bazy?",a:["Dopiero po wywołaniu SaveChanges()/SaveChangesAsync()","Natychmiast po zmianie właściwości","Po zakończeniu żądania HTTP automatycznie","Po wywołaniu ToList()"],e:"Encje są śledzone (tracked), ale zmiany nie zostaną zapisane, dopóki nie zostanie wywołane SaveChanges().",w:["Zmiana właściwości jest tylko śledzona.","Nie ma automatycznego zapisu na koniec żądania.","ToList odczytuje, nie zapisuje."]},{id:"w03-77",s:"j",q:'Kod Update(): var e = _context.Authors.First(x => x.AuthorId == 1); e.Name = "Otto Apocalypse"; _context.SaveChanges(); Czy potrzebne jest wywołanie _context.Update(e)?',a:["Nie – encja jest śledzona, SaveChanges wykryje zmianę","Tak, inaczej zmiana nie zostanie zapisana","Tak, oraz Attach(e)","Trzeba usunąć i dodać encję ponownie"],e:"Encja pobrana z kontekstu jest śledzona, więc zmiana właściwości i SaveChanges() wystarczą.",w:["Update() nie jest potrzebne dla śledzonej encji.","Attach nie jest potrzebne.","Usuwanie i dodawanie jest zbędne."]},{id:"w03-78",s:"i",q:"Do czego służą „zaślepki” (stub) z _context.Attach(new Author { AuthorId = 1 })?",a:["Do dodawania obiektów powiązanych bez pełnego wyszukiwania ich w bazie","Do usuwania rekordów","Do testów jednostkowych","Do migracji"],e:"Zaślepki pozwalają powiązać nowy Quote z istniejącym Author bez jego pobierania. Attach oznacza encję jako istniejącą.",w:["Nie służą do usuwania.","To nie mocki testowe.","To nie migracje."]},{id:"w03-79",s:"k",q:"Jak w EF Core pobrać dane zwykłym poleceniem SQL mapowanym na obiekty?",a:["FromSqlRaw()","ExecuteSql() bez mapowania","RawQuery()","Sql()"],e:'FromSqlRaw(), np. _context.Quotes.FromSqlRaw("SELECT * FROM Quotes WHERE quote_id = 3 LIMIT 1").',w:["ExecuteSql nie mapuje wyników na encje.","Nie ma RawQuery.","Nie ma Sql()."]},{id:"w03-80",s:"k",q:"Czym jest Dapper?",a:["Prostym mapperem obiektów (mikro-ORM) bez śledzenia obiektów","Oficjalnym ORM Microsoftu","Bazą dokumentową","Narzędziem migracji"],e:"Dapper mapuje wyniki „zwykłych” zapytań SQL na typy .NET i nie ma mechanizmu śledzenia.",w:["Nie jest oficjalny.","To nie baza danych.","To nie narzędzie migracji."]},{id:"w03-81",s:"k",q:"Jaką bazą jest LiteDB?",a:["Embedded (jak SQLite), ale dokumentową (jak Mongo), napisaną w C#","Bazą time-series","Bazą wektorową","Bazą klucz-wartość w chmurze"],e:"LiteDB to embedded, dokumentowa baza w jednej bibliotece (~450 KB), w pełni w C#.",w:["Time-series to InfluxDB.","Wektorowa to Qdrant.","Nie K-V w chmurze."]},{id:"w03-82",s:"k",q:"Jakim typem bazy jest InfluxDB?",a:["Time-series (szeregi czasowe)","Wektorowa","Dokumentowa z dostępem HTTP","Klucz-wartość"],e:"InfluxDB to time-series, Qdrant to baza wektorowa, a CouchDB to baza dokumentowa z dostępem przez HTTP.",w:["Wektorowa to Qdrant.","Dokumentowa z dostępem HTTP to CouchDB.","K-V to Redis."]},{id:"w03-83",s:"k",q:"Jakim typem bazy jest Qdrant?",a:["Wektorowa","Time-series","Relacyjna","Grafowa"],e:"Qdrant to baza wektorowa z oficjalnym SDK do .NET.",w:["Time-series to InfluxDB.","Nie relacyjna.","Nie grafowa."]},{id:"w03-84",s:"k",q:"Który z poniższych przykładów to baza typu klucz-wartość wymieniona na wykładzie?",a:["Redis","InfluxDB","Qdrant","LiteDB"],e:"K-V: Redis, Azure Cosmos DB, RocksDB, FASTER, ZoneTree.",w:["InfluxDB to time-series.","Qdrant to baza wektorowa.","LiteDB to dokumentowa embedded."]},{id:"w03-85",s:"g",q:"Kod: p.Select(x => x.Age).Sum() dla osób o wieku 19 i 40019. Jaki wynik?",a:["40038","40019","19","2"],e:"Select wybiera wiek, a Sum sumuje: 19 + 40019 = 40038.",w:["To tylko jeden wiek.","To tylko drugi wiek.","2 to liczba osób (Count), nie suma."]}],jk={id:yk,title:pk,sections:kk,questions:mk},gk="w04",bk="W4 · Web API i Minimal APIs (na podstawie kodu)",fk=[{id:"a",title:"Kontrolery Web API i routing",text:'Kontrolery Web API dziedziczą po `ControllerBase` (bez obsługi widoków). `Controller` dodaje obsługę widoków (MVC), a `[ApiController]` to atrybut, nie klasa bazowa.\n\nW `[Route("[controller]")]` token `[controller]` zostaje zastąpiony nazwą kontrolera bez przyrostka `Controller`, więc dla `ProviderController` ścieżka bazowa to `/Provider`. Szablon akcji zaczynający się od `/` (np. `[HttpGet("/forecast/{city}")]` albo `[HttpPost("/token")]`) jest bezwzględny i ignoruje trasę kontrolera. Kontrolery z routingiem atrybutowym mapuje się w `Program.cs` przez `app.MapControllers()` (a `MapControllerRoute` to routing konwencyjny MVC).\n\nPrzykład `CitiesProvider` z miastami Warsaw, Paris, Beijing: `GET /Provider` zwraca 200 z tablicą JSON (domyślnie obiekt jest serializowany do JSON), a `GET /Provider/Rome` zwraca 404, bo `FirstOrDefault` daje `null`, a akcja zwraca `NotFound()`.'},{id:"b",title:"POST, autoryzacja i cykl życia usługi",text:"Akcja `[HttpPost][Authorize]` wymaga uwierzytelnienia, więc `POST /Provider` bez tokenu JWT zwraca **401 Unauthorized**. `CreatedAtAction(...)` zwraca **201 Created** z nagłówkiem `Location`.\n\nJeśli `CitiesProvider` jest zarejestrowany jako `AddSingleton`, lista w pamięci żyje do restartu aplikacji, więc kolejne `GET /Provider` zwróci dodane miasto. Przy `AddScoped` (jedna instancja na żądanie HTTP) dodane miasto zniknęłoby po zakończeniu żądania."},{id:"c",title:"Model, [ApiController] i dokumentacja",text:"`required` w `public required string Name { get; set; }` to słowo kluczowe języka (C# 11): właściwość musi być ustawiona przy tworzeniu obiektu (inicjalizator lub deserializacja). To nie atrybut `[Required]`.\n\n`[ApiController]` włącza zachowania API: automatyczną walidację modelu (odpowiedź 400) i wnioskowanie źródeł wiązania (m.in. z body). Uwierzytelniania nie wymusza. `[ProducesResponseType(StatusCodes.Status404NotFound)]` opisuje możliwe odpowiedzi w dokumentacji OpenAPI/Swagger, ale samo nie zmienia działania akcji.\n\nKomentarze XML (`///`) włącza się w Swaggerze przez `AddSwaggerGen(o => o.IncludeXmlComments(...))` ze ścieżką do pliku `.xml` assembly. Plik XML trzeba też generować przy kompilacji. `AddEndpointsApiExplorer()` udostępnia metadane endpointów (m.in. Minimal APIs) generatorowi OpenAPI/Swagger (Swashbuckle)."},{id:"d",title:"OpenAPI i Swagger UI",text:"Swashbuckle udostępniają `app.UseSwagger()` (dokument JSON) i `app.UseSwaggerUI()` (interfejs), włączane w przykładzie tylko w trybie Development. W nowszym podejściu `builder.Services.AddOpenApi()` i `app.MapOpenApi()` wystawiają dokument pod adresem `/openapi/v1.json`. `app.MapScalarApiReference()` dodaje alternatywny interfejs **Scalar** do przeglądania dokumentacji."},{id:"e",title:"Minimal APIs",text:'**Minimal APIs** to definiowanie endpointów bezpośrednio w `Program.cs` lambdami (`app.MapGet("/...", () => ...)`, `app.MapPost`), bez kontrolerów, zwykle z top-level statements.\n\nPrzykłady:\n• `app.MapPost("/test", () => new { status = 3 })`: `POST /test` zwraca 200 z JSON `{"status":3}`, a `GET /test` zwraca **405 Method Not Allowed** (ścieżka pasuje, czasownik nie),\n• `MapPost("/test-body", ([FromBody] WeatherForecast f) => f.TemperatureC > 0 ? Results.Accepted() : Results.BadRequest())`: dla `TemperatureC = 0` wynik to 400, a dla wartości dodatnich `Accepted()`, czyli 202,\n• `[FromServices]` wstrzykuje parametr z kontenera DI (np. `[FromServices] ILogger<Program> logger`),\n• `.WithName("GetWeatherForecast")` nadaje endpointowi nazwę (używaną m.in. jako operationId w OpenAPI).\n\nZ przykładu prognoz pogody: `TemperatureF => 32 + (int)(TemperatureC / 0.5556)` daje 32 dla 0 °C i 49 dla 10 °C (10 / 0.5556 ≈ 17,998, a `(int)` obcina do 17, więc nie 50). `Enumerable.Range(1, 5)` daje 5 elementów. `Random.Shared.Next(-20, 55)` zwraca wartości od −20 do 54 (górna granica jest wyłączna). Nowszy przykład używa `DateOnly` (sama data, bez godziny) zamiast `DateTime`.'},{id:"f",title:"Rate limiting",text:'Przykład: `AddFixedWindowLimiter("fixed", ...)` z `PermitLimit = 4`, `Window = 12 s` i `QueueLimit = 0`. Piąte żądanie w tym samym oknie zostanie odrzucone z kodem **429 Too Many Requests** (`RejectionStatusCode = 429`), bo limit wynosi 4 żądania na okno, a kolejka ma 0 miejsc. `AutoReplenishment = true` oznacza, że limit odnawia się automatycznie po upływie okna.\n\nOprócz `AddRateLimiter` trzeba włączyć middleware `app.UseRateLimiter()`. Politykę przypisuje się endpointowi przez `.RequireRateLimiting("fixed")`.'},{id:"g",title:"Wersjonowanie API",text:'Konfiguracja `AddApiVersioning(o => { o.AssumeDefaultVersionWhenUnspecified = true; o.ApiVersionReader = new HeaderApiVersionReader("x-api-version"); })` odczytuje wersję z nagłówka HTTP `x-api-version`. Wersję API, którą obsługuje kontroler, oznacza się atrybutem `[ApiVersion("1.0")]` (jeden kontroler może obsługiwać kilka wersji). Jeśli klient nie poda nagłówka, przyjmowana jest wersja domyślna 1.0, więc `GET /Hello` zwróci „Hello world v1”.'},{id:"h",title:"JWT i uwierzytelnianie w API",text:"`TokenController` wystawia token JWT ważny 30 minut (`AddMinutes(30)`). Podpisuje go algorytmem **HMAC SHA-256** z kluczem symetrycznym (ten sam sekret służy do podpisu i weryfikacji). `ClockSkew = TimeSpan.Zero` oznacza brak tolerancji czasowej: token przestaje być ważny dokładnie w chwili wygaśnięcia (domyślnie jest kilkuminutowa tolerancja). Konfiguracja z przykładu ma `ValidateIssuer = false` i `ValidateAudience = false`, więc nie sprawdza wystawcy ani odbiorcy. Waliduje czas (`ValidateLifetime`) i klucz podpisu (`ValidateIssuerSigningKey`). Claim `Jti` to unikalny identyfikator tokenu.\n\nProblem bezpieczeństwa: sekret klucza jest zapisany na sztywno w kodzie. Sekrety powinny być w user secrets, zmiennych środowiskowych lub Key Vault.\n\nKlient przesyła token w nagłówku `Authorization: Bearer <token>`. W potoku najpierw musi być `app.UseAuthentication()` (kim jest użytkownik), a potem `app.UseAuthorization()` (do czego ma dostęp). Błędy to odpowiednio 401 i 403."},{id:"i",title:"CORS",text:'`AddCors` tylko definiuje politykę, a działa ona dopiero z middleware `app.UseCors("MyCORS")`. Gdy ta linia jest zakomentowana, polityka nie jest stosowana i przeglądarka zablokuje odczyt odpowiedzi z innych originów. CORS egzekwuje przeglądarka na podstawie nagłówków odpowiedzi serwera. Narzędzia jak curl czy Postman go nie stosują.'}],hk=[{id:"w04-01",s:"a",q:"Po jakiej klasie dziedziczą kontrolery Web API w przykładach (bez obsługi widoków)?",a:["ControllerBase","Controller","PageModel","ApiController"],e:"Kontrolery API dziedziczą po ControllerBase (bez widoków). Controller dodaje obsługę widoków (MVC). [ApiController] to atrybut, nie klasa bazowa.",w:["Controller dodaje obsługę widoków (MVC).","PageModel to Razor Pages.","[ApiController] to atrybut, a nie klasa bazowa."]},{id:"w04-02",s:"a",q:'Co oznacza [Route("[controller]")] na klasie ProviderController?',a:["Ścieżka bazowa to nazwa kontrolera bez przyrostka: /Provider","Ścieżka to dosłownie /[controller]","Ścieżka to /ProviderController","Kontroler nie ma ścieżki"],e:"Token [controller] zostaje zastąpiony nazwą kontrolera bez „Controller”, więc /Provider.",w:["Token [controller] jest podmieniany na nazwę.","Przyrostek Controller jest obcinany.","Ścieżka jest – /Provider."]},{id:"w04-03",s:"a",q:'ForecastController ma [Route("[controller]")], a akcja [HttpGet("/forecast/{city}")]. Pod jakim adresem jest akcja?',a:["/forecast/{city} – szablon zaczynający się od / jest bezwzględny","/Forecast/forecast/{city}","/Forecast/{city}","/api/forecast/{city}"],e:"Szablon akcji zaczynający się od '/' ignoruje trasę kontrolera.",w:["Szablon z wiodącym / ignoruje trasę kontrolera.","Segment „forecast” jest częścią szablonu.","Prefiksu api nie ma."]},{id:"w04-04",s:"a",q:"CitiesProvider z miastami Warsaw, Paris, Beijing. Co zwróci GET /Provider/Rome (GetById: FirstOrDefault, null → NotFound())?",a:["404 Not Found","200 z null","400 Bad Request","500"],e:"FirstOrDefault zwraca null dla braku dopasowania, więc NotFound(), czyli 404.",w:["Kod jawnie zwraca NotFound przy null.","Nie 400 – żądanie jest poprawne.","Nie ma błędu serwera."]},{id:"w04-05",s:"a",q:"Co zwróci GET /Provider w przykładzie (metoda zwraca IEnumerable<string>)?",a:['200 z tablicą JSON ["Warsaw","Paris","Beijing"]',"Widok HTML z listą","204 No Content","XML z listą zawsze"],e:"Web API serializuje zwracany obiekt domyślnie do JSON z kodem 200.",w:["To API – nie zwraca widoku.","Lista nie jest pusta – 3 miasta.","Domyślny format to JSON."]},{id:"w04-06",s:"b",q:"Akcja Post ma [HttpPost][Authorize]. Co zwróci POST /Provider bez tokenu JWT?",a:["401 Unauthorized","201 Created","400 Bad Request","403 Forbidden"],e:"[Authorize] wymaga uwierzytelnienia. Brak tokenu przy schemacie JwtBearer daje challenge, czyli 401.",w:["Bez tokenu nie przejdzie do akcji.","Do walidacji modelu nawet nie dojdzie.","403 jest, gdy tożsamość znana, ale brak uprawnień."]},{id:"w04-07",s:"b",q:"Jaki kod HTTP zwraca CreatedAtAction(...) w akcji Post?",a:["201 Created","200 OK","202 Accepted","204 No Content"],e:"CreatedAtAction zwraca 201 z nagłówkiem Location wskazującym na podaną akcję.",w:["200 to Ok().","202 to Accepted().","204 to NoContent()."]},{id:"w04-08",s:"b",q:"CitiesProvider jest zarejestrowany przez AddSingleton(_ => new CitiesProvider { … }). Po udanym POST z nowym miastem, czy kolejne GET /Provider je zwróci?",a:["Tak – singleton żyje przez cały czas działania aplikacji (do restartu)","Nie – każde żądanie dostaje nową instancję","Tak, ale tylko dla tego samego użytkownika","Nie – dane są zapisywane dopiero w bazie"],e:"Singleton to jedna instancja na aplikację, więc lista w pamięci jest współdzielona do restartu. Przy Transient lub Scoped zmiana by przepadła.",w:["Singleton nie daje nowej instancji na żądanie.","Nie zależy od użytkownika.","Bazy tu nie ma – lista w pamięci."]},{id:"w04-09",s:"b",q:"Jaka byłaby konsekwencja zarejestrowania CitiesProvider jako AddScoped zamiast AddSingleton?",a:["Dodane miasto zniknęłoby po zakończeniu żądania (nowa lista dla każdego żądania)","Brak różnicy","Aplikacja by się nie uruchomiła","Miasta byłyby współdzielone między wszystkimi"],e:"Scoped to jedna instancja na żądanie HTTP, więc zmiany w liście w pamięci nie przetrwałyby.",w:["Różnica jest – czas życia instancji.","Aplikacja uruchomi się normalnie.","Scoped to nie współdzielenie globalne."]},{id:"w04-10",s:"c",q:"Model City ma public required string Name { get; set; }. Co oznacza required?",a:["Właściwość musi być ustawiona przy tworzeniu obiektu (inicjalizator/deserializacja)","To atrybut walidacji [Required] z data annotations","Właściwość nie może być zmieniona","Właściwość jest kluczem głównym"],e:"required (C# 11) to składnik obowiązkowy przy inicjalizacji. To słowo kluczowe języka, nie atrybut [Required].",w:["[Required] to atrybut walidacji – required to słowo kluczowe C# 11.","To nie readonly/init.","Kluczem jest Id, nie Name."]},{id:"w04-11",s:"c",q:"Co robi atrybut [ApiController]?",a:["Włącza zachowania API, m.in. automatyczną odpowiedź 400 przy niepoprawnym modelu i wiązanie z body","Rejestruje kontroler w DI","Generuje dokumentację Swagger","Wymaga uwierzytelnienia"],e:"[ApiController] włącza automatyczną walidację modelu (400 ValidationProblem) i inferencję źródeł wiązania. Uwierzytelnienia nie wymusza.",w:["Rejestrację robi AddControllers.","Dokumentację generuje Swagger.","Uwierzytelnianie to [Authorize]."]},{id:"w04-12",s:"c",q:"Do czego służy [ProducesResponseType(StatusCodes.Status404NotFound)] na akcji?",a:["Do opisania możliwych odpowiedzi w dokumentacji OpenAPI/Swagger","Wymusza zwrócenie 404","Zmienia domyślny kod błędu","Włącza cache odpowiedzi"],e:"ProducesResponseType dokumentuje możliwe kody i typy odpowiedzi dla OpenAPI. Samo nie zmienia działania akcji.",w:["Nie wymusza – tylko dokumentuje.","Nie zmienia kodu błędu.","Cache to [ResponseCache]."]},{id:"w04-13",s:"c",q:"Jak włączyć komentarze XML (///) w dokumentacji Swaggera w przykładzie?",a:["options.IncludeXmlComments(ścieżka do pliku .xml assembly) w AddSwaggerGen","app.UseXmlComments()","Atrybut [XmlDoc] na kontrolerze","Działa automatycznie bez konfiguracji"],e:'AddSwaggerGen(o => o.IncludeXmlComments(Path.Combine(AppContext.BaseDirectory, "<Assembly>.xml"))). Trzeba też generować plik XML przy kompilacji.',w:["Nie ma UseXmlComments.","Nie ma [XmlDoc].","Wymaga konfiguracji i wygenerowania pliku XML."]},{id:"w04-14",s:"c",q:"Które middleware w przykładzie udostępniają Swaggera (Swashbuckle) w trybie Development?",a:["app.UseSwagger(); app.UseSwaggerUI();","app.MapControllers();"
