,"app.UseRouting();","app.UseOpenApiDocs();"],e:"UseSwagger() generuje dokument JSON, a UseSwaggerUI() interfejs. W przykładzie są włączane tylko w Development.",w:["MapControllers mapuje endpointy.","UseRouting to routing.","UseOpenApiDocs nie istnieje."]},{id:"w04-15",s:"d",q:"W nowszym przykładzie użyto builder.Services.AddOpenApi() i app.MapOpenApi(). Pod jakim adresem jest dokument OpenAPI?",a:["/openapi/v1.json","/swagger/v1/swagger.json","/api/docs","/openapi.yaml"],e:'MapOpenApi() wystawia /openapi/v1.json. Dlatego UseSwaggerUI wskazuje SwaggerEndpoint("/openapi/v1.json", …).',w:["/swagger/v1/swagger.json to domyślna ścieżka Swashbuckle (UseSwagger).","/api/docs nie jest zdefiniowane.","Format to JSON, nie YAML."]},{id:"w04-16",s:"d",q:"Co dodaje app.MapScalarApiReference() w przykładzie OpenAPI?",a:["Alternatywny interfejs (Scalar) do przeglądania dokumentacji API","Ograniczanie liczby żądań","Wersjonowanie API","Uwierzytelnianie JWT"],e:"Scalar to alternatywny UI dla dokumentacji OpenAPI, obok Swagger UI.",w:["Rate limiting to AddRateLimiter.","Wersjonowanie to AddApiVersioning.","JWT to AddJwtBearer."]},{id:"w04-17",s:"e",q:"Czym są Minimal APIs?",a:["Definiowaniem endpointów bezpośrednio w Program.cs (app.MapGet/MapPost) bez kontrolerów","Kontrolerami bez atrybutów","Razor Pages bez widoków","Bibliotekami do kompresji odpowiedzi"],e:'Minimal APIs to endpointy definiowane lambdami: app.MapGet("/…", () => …), zwykle z top-level statements.',w:["Kontrolery bez atrybutów to nadal kontrolery.","Razor Pages to strony.","To nie kompresja."]},{id:"w04-18",s:"e",q:'Kod: app.MapPost("/test", () => new { status = 3 }); Co zwróci POST /test?',a:['200 z JSON {"status":3}',"201 Created","204 No Content","405 Method Not Allowed"],e:"Zwrócony obiekt jest serializowany do JSON z kodem 200.",w:["201 wymaga Created/CreatedAtAction.","Zwraca treść – nie 204.","POST jest zmapowany."]},{id:"w04-19",s:"e",q:'Kod: app.MapPost("/test", …). Co zwróci GET /test?',a:["405 Method Not Allowed","200 OK","404 zawsze","500"],e:"Endpoint istnieje tylko dla POST, więc GET pod tym adresem daje 405 (ścieżka pasuje, czasownik nie).",w:["Endpoint obsługuje tylko POST.","Ścieżka istnieje – zły jest czasownik (405).","To nie błąd serwera."]},{id:"w04-20",s:"e",q:'Kod: app.MapPost("/test-body", ([FromBody] WeatherForecast f) => f.TemperatureC > 0 ? Results.Accepted() : Results.BadRequest()); Co zwróci body z TemperatureC = 0?',a:["400 Bad Request","202 Accepted","200 OK","201 Created"],e:"0 > 0 to fałsz, więc Results.BadRequest() (400). Dla wartości dodatnich Accepted() (202).",w:["Accepted tylko dla > 0.","200 nie jest zwracane.","201 nie jest zwracane."]},{id:"w04-21",s:"e",q:"Jaki kod HTTP zwraca Results.Accepted()?",a:["202","200","201","204"],e:"Accepted to 202: żądanie przyjęte do przetworzenia.",w:["200 to Ok.","201 to Created.","204 to NoContent."]},{id:"w04-22",s:"e",q:"Co robi [FromServices] przy parametrze lambdy Minimal API, np. ([FromServices] ILogger<Program> logger) => …?",a:["Wstrzykuje parametr z kontenera DI","Pobiera parametr z body","Pobiera parametr z nagłówka","Rejestruje serwis w DI"],e:"[FromServices] wiąże parametr z kontenerem DI, czyli wstrzykuje go do handlera.",w:["Body to [FromBody].","Nagłówek to [FromHeader].","Rejestracja jest w builder.Services."]},{id:"w04-23",s:"e",q:"Rekord: public int TemperatureF => 32 + (int)(TemperatureC / 0.5556); Ile wynosi TemperatureF dla TemperatureC = 0?",a:["32","0","-17","33"],e:"Dla TemperatureC = 0 dzielenie daje 0, więc TemperatureF = 32 + 0 = 32.",w:["To °C, a wzór dodaje 32.","Nie ma wartości ujemnej przy 0 °C.","(int)0 = 0, więc 32."]},{id:"w04-24",s:"e",q:"Ten sam wzór TemperatureF = 32 + (int)(TemperatureC / 0.5556). Ile wynosi dla TemperatureC = 10?",a:["49","50","42","18"],e:"10 / 0.5556 ≈ 17,998, a rzutowanie (int) obcina do 17, więc 32 + 17 = 49 (nie 50!).",w:["Pułapka: (int) obcina 17,998 do 17.","42 to błędny rachunek.","18 to wynik dzielenia przed dodaniem 32."]},{id:"w04-25",s:"e",q:"Ile elementów zwróci Enumerable.Range(1, 5).Select(…).ToArray() w endpoincie /weatherforecast?",a:["5","4","6","1"],e:"Range(start: 1, count: 5) daje 1,2,3,4,5, czyli 5 prognoz.",w:["Range(1, 5) to 5 liczb, a nie 1..4.","Nie 6 – drugi parametr to liczba elementów.","Select nie zmienia liczby elementów."]},{id:"w04-26",s:"e",q:"Jaki zakres wartości zwraca Random.Shared.Next(-20, 55)?",a:["Od -20 do 54 (górna granica wyłączna)","Od -20 do 55 włącznie","Od -19 do 55","Od 0 do 55"],e:"W Next(min, max) dolna granica jest włączona, a górna wyłączona. Wynik mieści się więc w zakresie od −20 do 54.",w:["Górna granica jest wyłączna.","-20 jest włączone.","Dolna granica to -20."]},{id:"w04-27",s:"e",q:'Co robi .WithName("GetWeatherForecast") na endpoincie Minimal API?',a:["Nadaje endpointowi nazwę (np. do generowania linków / operationId w OpenAPI)","Zmienia adres URL","Wymaga uwierzytelnienia","Ustawia nazwę pliku odpowiedzi"],e:"WithName nadaje nazwę endpointu, używaną m.in. jako operationId w OpenAPI. WithDescription dodaje opis.",w:["URL się nie zmienia.","Nie dotyczy uwierzytelniania.","Nie dotyczy plików."]},{id:"w04-28",s:"e",q:"Jaki typ daty używa nowszy przykład OpenAPI zamiast DateTime w WeatherForecast?",a:["DateOnly","TimeOnly","DateTimeOffset","string"],e:"DateOnly.FromDateTime(DateTime.Now.AddDays(index)) przechowuje samą datę, bez godziny.",w:["TimeOnly to sama godzina.","DateTimeOffset ma strefę czasową.","string to nie typ daty."]},{id:"w04-29",s:"f",q:'Rate limiter: AddFixedWindowLimiter("fixed", PermitLimit = 4, Window = 12 s, QueueLimit = 0). Co stanie się z 5. żądaniem w tym samym oknie 12 s?',a:["Zostanie odrzucone z kodem 429","Trafi do kolejki","Zostanie obsłużone normalnie","Zwróci 503"],e:"Limit to 4 żądania na okno, a kolejka ma 0 miejsc, więc 5. żądanie jest odrzucane. Ustawiono RejectionStatusCode = 429.",w:["QueueLimit = 0, więc kolejka jest pusta.","Limit 4 jest już wyczerpany.","Kod ustawiono na 429, nie 503."]},{id:"w04-30",s:"f",q:"Co oznacza kod HTTP 429?",a:["Too Many Requests","Unauthorized","Forbidden","Service Unavailable"],e:"429 = Too Many Requests, typowy kod dla rate limitingu.",w:["Unauthorized to 401.","Forbidden to 403.","Service Unavailable to 503."]},{id:"w04-31",s:"f",q:'Jak przypisać politykę rate limitingu "fixed" do endpointu?',a:['app.MapGet("/", …).RequireRateLimiting("fixed")','[RateLimit("fixed")] na Program','app.UseRateLimiter("fixed") wystarczy','builder.Services.AddRateLimit("/")'],e:'Polityka jest definiowana w AddRateLimiter, middleware włącza app.UseRateLimiter(), a endpoint wybiera politykę przez RequireRateLimiting("fixed").',w:["Nie ma atrybutu [RateLimit] na Program.","UseRateLimiter nie przypisuje polityki.","Nie ma AddRateLimit."]},{id:"w04-32",s:"f",q:"Co jest wymagane oprócz AddRateLimiter, aby limiter działał?",a:["app.UseRateLimiter() w potoku","app.UseCors()","app.UseAuthentication()","Nic więcej"],e:"Serwis trzeba dodać i włączyć middleware app.UseRateLimiter().",w:["CORS nie jest powiązany.","Uwierzytelnianie nie jest powiązane.","Middleware jest wymagany."]},{id:"w04-33",s:"f",q:"Co oznacza AutoReplenishment = true w FixedWindowLimiter?",a:["Limit odnawia się automatycznie po upływie okna","Kolejka rośnie automatycznie","Limit rośnie z każdym żądaniem","Odrzucone żądania są ponawiane"],e:"Okno automatycznie się odnawia co Window (12 s) i przywraca PermitLimit.",w:["Kolejka się nie powiększa.","Limit jest stały.","Odrzucone żądania nie są ponawiane."]},{id:"w04-34",s:"g",q:'Wersjonowanie: AddApiVersioning(o => { o.AssumeDefaultVersionWhenUnspecified = true; o.ApiVersionReader = new HeaderApiVersionReader("x-api-version"); }). Skąd odczytywana jest wersja API?',a:["Z nagłówka HTTP x-api-version","Z query string ?api-version=","Z segmentu URL","Z ciasteczka"],e:'HeaderApiVersionReader("x-api-version") odczytuje wersję z nagłówka.',w:["Query string wymaga QueryStringApiVersionReader.","Segment URL wymaga UrlSegmentApiVersionReader.","Ciasteczka nie są czytane."]},{id:"w04-35",s:"g",q:'Ta sama konfiguracja wersjonowania. GET /Hello bez nagłówka wersji, kontrolery v1.0 ("Hello world v1") i v2.0 ("Hello world v2") pod tą samą trasą. Co zostanie zwrócone?',a:["Hello world v1 – przyjęta zostanie wersja domyślna","Hello world v2 – najnowsza","400 – brak wersji","Błąd niejednoznaczności tras"],e:"AssumeDefaultVersionWhenUnspecified = true, a domyślna wersja to 1.0, więc odpowiada kontroler v1.",w:["Najnowsza wersja nie jest wybierana domyślnie.","AssumeDefault… zapobiega błędowi 400.","Wersjonowanie rozdziela trasy."]},{id:"w04-36",s:"g",q:"Jak w przykładzie oznacza się, którą wersję API obsługuje kontroler?",a:['Atrybutem [ApiVersion("1.0")] (można kilka)',"Nazwą klasy z sufiksem V1","Osobnym projektem",'Atrybutem [Route("v1")] obowiązkowo'],e:'[ApiVersion("1.0")] / [ApiVersion(2.0)]. Jeden kontroler może obsługiwać kilka wersji.',w:["Nazwa klasy nie decyduje.","Osobny projekt nie jest potrzebny.",'[Route("v1")] nie jest obowiązkowy.']},{id:"w04-37",s:"h",q:"Ile minut jest ważny token wystawiany przez TokenController (expires: DateTime.UtcNow.AddMinutes(30))?",a:["30","60","5","Bezterminowo"],e:"expires: AddMinutes(30). Przy ClockSkew = TimeSpan.Zero token wygasa dokładnie po 30 min.",w:["To nie 60.","To nie 5.","Ma ustawione expires."]},{id:"w04-38",s:"h",q:"Co oznacza ClockSkew = TimeSpan.Zero w TokenValidationParameters?",a:["Brak tolerancji czasowej – token przestaje być ważny dokładnie w chwili wygaśnięcia","Token nigdy nie wygasa","Wyłączenie walidacji podpisu","Synchronizację zegara z serwerem NTP"],e:"Domyślnie jest kilkuminutowa tolerancja. Zero oznacza ścisłe sprawdzanie czasu wygaśnięcia.",w:["Token wygasa normalnie.","Podpis nadal jest walidowany.","To nie synchronizacja NTP."]},{id:"w04-39",s:"h",q:"Których elementów tokenu NIE weryfikuje konfiguracja JWT z przykładu?",a:["Wystawcy (issuer) i odbiorcy (audience)","Czasu ważności","Klucza podpisu","Podpisu tokenu"],e:"ValidateIssuer = false i ValidateAudience = false. Walidowane są czas (ValidateLifetime) oraz klucz podpisu (ValidateIssuerSigningKey).",w:["Czas ważności jest walidowany.","Klucz podpisu jest walidowany.","Podpis jest walidowany."]},{id:"w04-40",s:"h",q:"Jakiego algorytmu podpisu używa TokenController?",a:["HMAC SHA-256 z kluczem symetrycznym","RSA z kluczem publicznym","ECDSA","Brak podpisu"],e:"SymmetricSecurityKey + SecurityAlgorithms.HmacSha256, czyli ten sam sekret do podpisu i weryfikacji.",w:["RSA to klucz asymetryczny – tu jest symetryczny.","ECDSA nie jest użyte.","Podpis jest."]},{id:"w04-41",s:"h",q:"Co jest problemem bezpieczeństwa w przykładzie JWT (zgodnie z wykładem o sekretach)?",a:["Sekret klucza jest zapisany na sztywno w kodzie źródłowym","Token ma 30 minut ważności","Użyto HMAC","Token zawiera claim Jti"],e:'Klucz "to jest bardzo, bardzo tajny sekret" jest w kodzie. Sekrety powinny być w user secrets, zmiennych środowiskowych lub Key Vault.',w:["30 min to rozsądny czas.","HMAC jest w porządku.","Jti to dobra praktyka."]},{id:"w04-42",s:"h",q:"Do czego służy claim Jti w tokenie (new Claim(JwtRegisteredClaimNames.Jti, Guid.NewGuid().ToString()))?",a:["Unikalny identyfikator tokenu","Identyfikator użytkownika","Czas wygaśnięcia","Adres e-mail"],e:"jti (JWT ID) to unikalny identyfikator tokenu. sub to podmiot (użytkownik), email to e-mail.",w:["Użytkownik to sub.","Czas wygaśnięcia to exp.","E-mail to email."]},{id:"w04-43",s:"h",q:"Jak klient przesyła token JWT do API chronionego schematem JwtBearer?",a:["Nagłówek Authorization: Bearer <token>","W query string ?token=","W ciasteczku .AspNetCore.Identity","W body każdego żądania"],e:"Schemat Bearer oczekuje nagłówka Authorization: Bearer <token>.",w:["Nie w query string.","Ciasteczko to Identity, nie JWT Bearer.","Nie w body."]},{id:"w04-44",s:"h",q:"W jakiej kolejności muszą być w potoku middleware uwierzytelniania i autoryzacji?",a:["app.UseAuthentication(); potem app.UseAuthorization();","Najpierw UseAuthorization, potem UseAuthentication","Kolejność nie ma znaczenia","Wystarczy UseAuthorization"],e:"Najpierw ustala się tożsamość (uwierzytelnienie), dopiero potem sprawdza uprawnienia (autoryzacja).",w:["Najpierw tożsamość, potem uprawnienia.","Kolejność ma znaczenie.","Bez UseAuthentication nie ma tożsamości."]},{id:"w04-45",s:"h",q:"Czym różni się uwierzytelnianie (authentication) od autoryzacji (authorization)?",a:["Uwierzytelnianie ustala, kim jest użytkownik; autoryzacja – do czego ma dostęp","To synonimy","Autoryzacja ustala tożsamość, uwierzytelnianie uprawnienia","Uwierzytelnianie dotyczy tylko API"],e:"Authentication to kto, authorization to co mu wolno. Błędy to odpowiednio 401 i 403.",w:["To nie synonimy.","Odwrotnie.","Dotyczy wszystkich aplikacji."]},{id:"w04-46",s:"i",q:'W projekcie -cors: builder.Services.AddCors(o => o.AddPolicy("MyCORS", p => p.WithOrigins("http://localhost:5252"))), ale linia //app.UseCors("MyCORS"); jest zakomentowana. Jaki jest skutek?',a:["Polityka CORS nie jest stosowana – przeglądarka zablokuje odczyt odpowiedzi z innych originów","Wszystkie originy są dozwolone","Dozwolony jest tylko localhost:5252","Aplikacja się nie uruchomi"],e:"AddCors tylko definiuje politykę, a działa ona dopiero z middleware UseCors. Bez nagłówków CORS przeglądarka blokuje żądania cross-origin.",w:["Bez UseCors nie ma nagłówków zezwalających.","Polityka nie jest stosowana.","Aplikacja startuje normalnie."]},{id:"w04-47",s:"i",q:"Kto egzekwuje ograniczenia CORS?",a:["Przeglądarka – na podstawie nagłówków odpowiedzi serwera","Serwer, odrzucając żądania z innych originów","Firewall","Kestrel w każdym przypadku, także dla curl"],e:"CORS to mechanizm przeglądarki. Narzędzia jak curl czy Postman nie podlegają CORS.",w:["Serwer nie blokuje – wysyła nagłówki.","Firewall nie ma z tym związku.","curl ignoruje CORS."]},{id:"w04-48",s:"c",q:"Co robi builder.Services.AddEndpointsApiExplorer()?",a:["Udostępnia metadane endpointów (m.in. Minimal APIs) dla generatora OpenAPI/Swagger","Wyświetla listę endpointów w przeglądarce","Włącza wersjonowanie","Włącza CORS"],e:"API Explorer zbiera metadane endpointów, z których korzysta Swashbuckle (AddSwaggerGen).",w:["Nie wyświetla listy.","Wersjonowanie to AddApiVersioning.","CORS to AddCors."]},{id:"w04-49",s:"a",q:"Która linia w Program.cs Web API mapuje kontrolery z routingiem atrybutowym?",a:["app.MapControllers();",'app.MapControllerRoute("default", …);',"app.MapRazorPages();","app.UseEndpoints();"],e:"W API z [Route] używa się app.MapControllers(), a MapControllerRoute to routing konwencyjny MVC.",w:["MapControllerRoute to routing konwencyjny MVC.","MapRazorPages to strony.","UseEndpoints to starszy sposób."]},{id:"w04-50",s:"a",q:'W TokenController: [Route("[controller]")] i [HttpPost("/token")]. Pod jakim adresem wystawiany jest token?',a:["POST /token","POST /Token/token","GET /token","POST /api/token"],e:`Szablon "/token" zaczyna się od '/', więc jest bezwzględny. Akcja ma [HttpPost], więc tylko POST.`,w:["Wiodący / ignoruje [controller].","Metoda to POST, nie GET.","Prefiksu api nie ma."]}],Sk={id:gk,title:bk,sections:fk,questions:hk},Ck="w05",Tk="W5 · Identity, role, polityki i uwierzytelnianie (na podstawie kodu)",Pk=[{id:"a",title:"Konfiguracja Identity",text:"`AddDefaultIdentity<ApplicationUser>(...).AddEntityFrameworkStores<ApplicationDbContext>()` rejestruje system **ASP.NET Core Identity** z domyślnym UI (Razor Pages, `Areas/Identity`), który przechowuje użytkowników w bazie przez EF Core. `options.SignIn.RequireConfirmedAccount = true` oznacza, że użytkownik musi potwierdzić konto (np. e-mail), zanim się zaloguje. Aby korzystać z ról (np. `Admin`), trzeba dodać `.AddRoles<IdentityRole>()`."},{id:"b",title:"Autoryzacja na podstawie ról",text:'`[Authorize(Roles = "Admin")]` oznacza, że dostęp mają tylko uwierzytelnieni użytkownicy z rolą Admin. Zalogowany użytkownik bez tej roli dostanie odmowę dostępu (Access Denied, 403). Niezalogowany zostanie natomiast przekierowany na stronę logowania (challenge).'},{id:"c",title:"Polityki autoryzacji",text:'Polityka z własnym wymaganiem składa się z kilku elementów:\n• **wymaganie** implementujące `IAuthorizationRequirement` (zawiera dane, np. `MinimumAgeRequirement(18)`),\n• **handler** `AuthorizationHandler<MinimumAgeRequirement>` z logiką, zarejestrowany w DI jako `IAuthorizationHandler` (bez rejestracji wymaganie nigdy nie zostanie spełnione),\n• **polityka** w `AddAuthorization(o => o.AddPolicy("IsAdult", p => p.AddRequirements(new MinimumAgeRequirement(18))))`,\n• atrybut `[Authorize(Policy = "IsAdult")]` na akcji.\n\nHandler sygnalizuje spełnienie wymagania przez `context.Succeed(requirement)`. Zakończenie bez `Succeed` oznacza odmowę. Gdy `_manager.GetUserAsync(...)` zwróci `null`, handler kończy bez `Succeed`, więc dostęp jest zabroniony.\n\nWiek liczy się tak: `age = Today.Year − dob.Year; if (dob > Today.AddYears(−age)) age−−;`. Dla dzisiejszej daty 13.11.2026 użytkownik urodzony 1.12.2008 ma 17 lat (urodziny jeszcze nie minęły), więc polityki nie przejdzie. Użytkownik urodzony 13.11.2008 ma 18 lat i przejdzie.\n\nPolitykę można też zapisać lambdą bez osobnego handlera: `policy.RequireAssertion(_ => DateTime.Now.DayOfWeek == DayOfWeek.Saturday || ...Sunday)` (akcja `[Authorize(Policy = "IsItWeekend")]` jest dostępna tylko w weekend). Atrybut `[Authorize]` chroni akcję (endpoint), a nie widok. Ten sam plik widoku zwrócony z niechronionej akcji (`WeekendOnly2`) jest dostępny dla każdego.'},{id:"d",title:"TokenController z Identity",text:'W kontrolerze wystawiającym token używa się `UserManager<ApplicationUser>` (wstrzykiwany przez DI) z metodami `FindByEmailAsync`, `CheckPasswordAsync` i `GetRolesAsync`. Gdy użytkownik o danym e-mailu nie istnieje, akcja zwraca `NotFound()` (404). To ujawnia, czy e-mail istnieje w systemie (enumeracja użytkowników). Gdy użytkownik istnieje, ale hasło jest błędne, zwraca `Unauthorized()` (401).\n\nPułapka z rolami: `claims.Add(new Claim(ClaimTypes.Role, string.Join("+", roles)))` tworzy jeden claim, np. `"Admin+User"`, który nie jest równy `"Admin"`, więc token nie przejdzie `[Authorize(Roles = "Admin")]`. Poprawnie byłby osobny claim `Role` dla każdej roli. Taki kod działa tylko wtedy, gdy użytkownik ma dokładnie jedną rolę.'},{id:"e",title:"Identity w aplikacji MVC",text:"Domyślne uwierzytelnianie w aplikacji MVC z Identity (logowanie przez stronę) opiera się na **ciasteczku** (cookie), a JWT z przykładu to dodatkowy endpoint do API. Strony logowania i rejestracji Identity to **Razor Pages** (`Areas/Identity/Pages/Account/Login.cshtml`), dlatego w `Program.cs` jest też `app.MapRazorPages()`. Bez tego strony logowania nie byłyby dostępne.\n\n`app.UseMigrationsEndPoint()` w trybie Development (razem z `AddDatabaseDeveloperPageExceptionFilter`) pokazuje błędy bazy i pozwala zastosować brakujące migracje z poziomu strony błędu. Datę urodzenia dodano do użytkownika, rozszerzając klasę `ApplicationUser : IdentityUser` o właściwość `BirthDate` i dodając migrację."},{id:"f",title:"Basic Auth i klucz API",text:"**Basic Authentication** przesyła dane w nagłówku `Authorization: Basic base64(login:hasło)`. Base64 to kodowanie, a nie szyfrowanie, więc bez HTTPS jest to niebezpieczne i domyślnie blokowane. `options.AllowInsecureProtocol = true` pozwala użyć Basic Auth przez niezaszyfrowane HTTP. W przykładzie `basicdefault` w `OnValidateCredentials` uwierzytelnienie udaje się, gdy login równa się hasłu (np. alice/alice), a po poprawnej walidacji tworzy się `ClaimsPrincipal` z claimami (`NameIdentifier`, `Name`) i wywołuje `context.Success()`.\n\nW `basicdefault` jest `AddAuthentication(BasicAuthenticationDefaults.AuthenticationScheme)`, a do tego klucz API i Basic. `[Authorize]` bez wskazania schematu używa domyślnego schematu (Basic). Żądanie z poprawnym kluczem API (bez Basic) dostaje więc 401. W przykładzie `multiauth` uwierzytelnienie którymkolwiek schematem umożliwia domyślna polityka `new AuthorizationPolicyBuilder(ApiKeyScheme, BasicScheme).RequireAuthenticatedUser().Build()`. `RequireAuthenticatedUser()` przepuszcza każdego uwierzytelnionego użytkownika (bez wymagań co do ról i claimów)."},{id:"g",title:"Claimy oraz kody 401 i 403",text:"**Claim** to stwierdzenie o użytkowniku w postaci pary typ–wartość, np. e-mail, rola, imię. `ClaimsIdentity` grupuje claimy, a `ClaimsPrincipal` reprezentuje użytkownika. Autoryzacja z własnym wymaganiem (jak `IsAdult`) potrzebuje klasy wymagania (`IAuthorizationRequirement`), handlera zarejestrowanego w DI i polityki w `AddAuthorization`.\n\nKod **401 Unauthorized** oznacza brak lub niepoprawne uwierzytelnienie (dla Basic z nagłówkiem `WWW-Authenticate`). Kod **403 Forbidden** oznacza użytkownika znanego, który nie ma uprawnień.\n\nPrzykład z `Leaderboard`: w `summaries.OrderByDescending(x => Random.Shared.Next()).Select(x => new PointsDto(x, Random.Shared.Next(100))).OrderByDescending(x => x.Points)` ostatni `OrderByDescending` decyduje o kolejności: wynik jest malejąco po punktach (0–99)."}],Ak=[{id:"w05-01",s:"a",q:"Co rejestruje builder.Services.AddDefaultIdentity<ApplicationUser>(…).AddEntityFrameworkStores<ApplicationDbContext>()?",a:["System ASP.NET Core Identity z domyślnym UI, przechowujący użytkowników w bazie przez EF Core","Uwierzytelnianie JWT","Tylko tabelę ról","Polityki autoryzacji"],e:"AddDefaultIdentity dodaje Identity (z UI w Razor Pages, Areas/Identity), a AddEntityFrameworkStores zapisuje dane w bazie przez DbContext.",w:["JWT to AddJwtBearer.","Role to dopiero AddRoles.","Polityki to AddAuthorization."]},{id:"w05-02",s:"a",q:"Co oznacza options.SignIn.RequireConfirmedAccount = true?",a:["Użytkownik musi potwierdzić konto (np. e-mail), zanim się zaloguje","Każde logowanie wymaga 2FA","Hasło musi mieć min. 8 znaków","Konto jest blokowane po 3 próbach"],e:"RequireConfirmedAccount wymaga potwierdzenia konta przed zalogowaniem.",w:["2FA to inna opcja.","Długość hasła to Password options.","Blokada to Lockout options."]},{id:"w05-03",s:"a",q:"Co trzeba dodać do konfiguracji Identity, aby korzystać z ról (np. Admin)?",a:[".AddRoles<IdentityRole>()",".AddClaims()",".AddPolicies()","Nic, role są zawsze włączone"],e:"W przykładzie -roles: AddDefaultIdentity<…>(…).AddRoles<IdentityRole>().AddEntityFrameworkStores<…>(). W przykładzie -birthdate tego brak.",w:["AddClaims nie istnieje.","AddPolicies nie istnieje.","Role nie są domyślnie włączone."]},{id:"w05-04",s:"b",q:'Co oznacza [Authorize(Roles = "Admin")] na akcji AdminOnly?',a:["Dostęp mają tylko uwierzytelnieni użytkownicy z rolą Admin","Dostęp ma każdy zalogowany","Akcja jest dostępna anonimowo","Tylko pierwszy użytkownik w bazie"],e:'Roles = "Admin" to autoryzacja oparta o role. Zalogowany bez roli dostanie odmowę (403 / Access Denied).',w:["Każdy zalogowany to samo [Authorize].","Anonimowy dostęp to [AllowAnonymous].","Nie ma takiej zasady."]},{id:"w05-05",s:"b",q:'Zalogowany użytkownik BEZ roli Admin wchodzi na akcję z [Authorize(Roles = "Admin")] (cookie Identity). Jaki będzie efekt?',a:["Odmowa dostępu – przekierowanie na stronę Access Denied (403)","Przekierowanie na stronę logowania (401)","Akcja się wykona","Błąd 500"],e:"Użytkownik jest uwierzytelniony, ale nie ma uprawnień, więc forbid (Access Denied). Niezalogowany zostałby przekierowany na login (challenge).",w:["Login pojawia się dla niezalogowanych (401).","Akcja się nie wykona.","Nie ma błędu serwera."]},{id:"w05-06",s:"c",q:'Jak w przykładzie zdefiniowano politykę "IsAdult"?',a:['options.AddPolicy("IsAdult", p => p.AddRequirements(new MinimumAgeRequirement(18)))','options.AddPolicy("IsAdult", p => p.RequireRole("Adult"))',"[Authorize(Age = 18)]",'options.AddPolicy("IsAdult", p => p.RequireClaim("age", "18"))'],e:"Polityka używa własnego wymagania MinimumAgeRequirement(18), które sprawdza handler MinimumAgeHandler.",w:["Nie ma roli Adult.","Nie ma atrybutu z wiekiem.","Claim age nie istnieje."]},{id:"w05-07",s:"c",q:"Jaki interfejs implementuje MinimumAgeRequirement?",a:["IAuthorizationRequirement","IAuthorizationHandler","IAuthenticationHandler","IPolicyProvider"],e:"Wymaganie (dane, np. MinimumAge) implementuje IAuthorizationRequirement, a logikę zawiera handler: AuthorizationHandler<MinimumAgeRequirement>.",w:["Handler implementuje AuthorizationHandler.","To uwierzytelnianie, nie autoryzacja.","IPolicyProvider nie jest użyty."]},{id:"w05-08",s:"c",q:"Jak zarejestrowano MinimumAgeHandler w przykładzie?",a:["builder.Services.AddTransient<IAuthorizationHandler, MinimumAgeHandler>();","options.AddHandler<MinimumAgeHandler>();","[Handler] na klasie","Nie trzeba go rejestrować"],e:"Handler rejestruje się w DI jako IAuthorizationHandler. Bez rejestracji wymaganie nigdy nie zostanie spełnione.",w:["AddHandler nie istnieje w opcjach.","Nie ma atrybutu [Handler].","Bez rejestracji handler nie działa."]},{id:"w05-09",s:"c",q:"Jak handler sygnalizuje spełnienie wymagania?",a:["context.Succeed(requirement)","return true","context.Fail() odwrotnie","throw new AuthorizedException()"],e:"context.Succeed(requirement) oznacza spełnienie. Zwrócenie bez Succeed oznacza brak spełnienia, czyli odmowę dostępu.",w:["Handler nie zwraca bool.","Fail oznacza jawną porażkę.","Wyjątki nie są mechanizmem autoryzacji."]},{id:"w05-10",s:"c",q:"MinimumAgeHandler: age = Today.Year − dob.Year; if (dob > Today.AddYears(−age)) age−−; Dzisiaj 13.11.2026, data urodzenia 1.12.2008. Czy użytkownik przejdzie politykę IsAdult (≥18)?",a:["Nie – wiek wyniesie 17 (urodziny jeszcze nie minęły)","Tak – 2026 − 2008 = 18","Tak – handler liczy tylko lata","Wyjątek – brak daty"],e:"18 lat minus 1, bo 1.12.2008 > 13.11.2008 (urodziny w tym roku jeszcze nie minęły), więc 17 < 18.",w:["Pułapka: urodziny jeszcze nie minęły, więc 17.","Handler odejmuje 1, gdy urodziny nie minęły.","Data jest ustawiona."]},{id:"w05-11",s:"c",q:"Ten sam handler. Dzisiaj 13.11.2026, data urodzenia 13.11.2008. Czy użytkownik przejdzie IsAdult?",a:["Tak – wiek 18","Nie – wiek 17","Nie – wiek 19","Zależy od strefy czasowej"],e:"dob == Today.AddYears(-18), więc warunek > jest fałszywy, wiek = 18 ≥ 18 i Succeed.",w:["Urodziny są dziś, więc odejmowania nie ma.","Nie 19.","Strefa nie ma znaczenia (Today)."]},{id:"w05-12",s:"c",q:"Co robi MinimumAgeHandler, gdy _manager.GetUserAsync(context.User) zwróci null?",a:["Kończy bez Succeed – wymaganie niespełnione, dostęp zabroniony","Spełnia wymaganie","Rzuca wyjątek","Tworzy nowego użytkownika"],e:"if (user == null) return Task.CompletedTask; kończy bez context.Succeed, więc odmowa.",w:["Bez Succeed wymaganie nie jest spełnione.","Nie rzuca wyjątku.","Nie tworzy użytkownika."]},{id:"w05-13",s:"c",q:'Polityka: policy.RequireAssertion(_ => DateTime.Now.DayOfWeek == DayOfWeek.Saturday || … == DayOfWeek.Sunday). Kiedy akcja [Authorize(Policy = "IsItWeekend")] będzie dostępna?',a:["Tylko w sobotę i niedzielę (dla zalogowanego)","Tylko w dni robocze","Zawsze","Tylko w niedzielę"],e:"RequireAssertion pozwala zapisać warunek lambdą bez osobnego handlera.",w:["Odwrotnie.","Tylko weekend.","Sobota też."]},{id:"w05-14",s:"c",q:'W HomeController jest WeekendOnly z [Authorize(Policy = "IsItWeekend")] oraz WeekendOnly2 bez atrybutu, zwracające View("WeekendOnly"). Co z tego wynika?',a:["Ten sam widok jest dostępny zawsze przez WeekendOnly2 – autoryzacja dotyczy akcji, nie widoku","WeekendOnly2 też wymaga weekendu","WeekendOnly2 nie zadziała bez atrybutu","Widok nie może być użyty przez dwie akcje"],e:"Atrybut [Authorize] chroni akcję (endpoint). Ten sam plik widoku zwrócony z niechronionej akcji jest dostępny dla każdego.",w:["Atrybut chroni akcję, nie widok.","Zadziała – widok istnieje.","Widok może być użyty przez wiele akcji."]},{id:"w05-15",s:"c",q:"Jak oznaczyć akcję wymagającą konkretnej polityki autoryzacji?",a:['[Authorize(Policy = "IsAdult")]','[Policy("IsAdult")]','[Authorize("IsAdult") ] w Program.cs',"[RequirePolicy(IsAdult)]"],e:'Polityki wskazuje się przez [Authorize(Policy = "nazwa")], a definiuje w AddAuthorization(o => o.AddPolicy(…)).',w:["Nie ma atrybutu [Policy].","Polityki nie wskazuje się w Program.cs.","Nie ma [RequirePolicy]."]},{id:"w05-16",s:"d",q:"TokenController (Identity): użytkownik o podanym e-mailu nie istnieje. Co zwraca akcja?",a:["404 Not Found","401 Unauthorized","400 Bad Request","200 z pustym tokenem"],e:"if (user == null) return NotFound(). To ujawnia, czy e-mail istnieje w systemie (enumeracja użytkowników).",w:["401 jest przy złym haśle.","Żądanie jest poprawne – nie 400.","Tokenu nie ma."]},{id:"w05-17",s:"d",q:"TokenController: użytkownik istnieje, ale hasło jest błędne. Co zwraca akcja?",a:["401 Unauthorized","404 Not Found","403 Forbidden","200 bez tokenu"],e:"CheckPasswordAsync zwraca false, więc Unauthorized() (401).",w:["404 jest, gdy brak użytkownika.","403 to brak uprawnień.","Kod jawnie zwraca Unauthorized."]},{id:"w05-18",s:"d",q:"Która klasa Identity służy w przykładzie do wyszukania użytkownika i sprawdzenia hasła?",a:["UserManager<ApplicationUser> (FindByEmailAsync, CheckPasswordAsync)","SignInManager<IdentityRole>","DbContext bezpośrednio","IdentityRole"],e:"UserManager<T> jest wstrzykiwany przez DI. Metody: FindByEmailAsync, CheckPasswordAsync, GetRolesAsync.",w:["SignInManager to logowanie cookie, a IdentityRole to rola.","DbContext bezpośrednio to nie API Identity.","IdentityRole to klasa roli."]},{id:"w05-19",s:"d",q:'TokenController dodaje rolę: claims.Add(new Claim(ClaimTypes.Role, string.Join("+", roles))). Użytkownik ma role Admin i User. Czy token przejdzie [Authorize(Roles = "Admin")]?',a:['Nie – powstaje jeden claim "Admin+User", który nie równa się "Admin"',"Tak – Admin jest w treści claimu","Tak – role są dzielone po '+'","Tylko jeśli Admin jest pierwszy"],e:"Pułapka: wiele ról złączonych w jeden claim. Poprawnie byłby osobny claim Role dla każdej roli. Działa tylko, gdy użytkownik ma dokładnie jedną rolę.",w:["Porównanie jest dokładne, nie „zawiera”.","Nikt nie dzieli po '+'.","Kolejność nic nie zmienia."]},{id:"w05-20",s:"e",q:"Na czym oparta jest domyślna autentykacja aplikacji MVC z Identity (logowanie przez stronę)?",a:["Na ciasteczku (cookie) uwierzytelniającym","Na tokenie JWT w nagłówku","Na Basic Auth","Na kluczu API"],e:"AddDefaultIdentity konfiguruje uwierzytelnianie ciasteczkiem. JWT w przykładzie to dodatkowy endpoint do API.",w:["JWT to osobny endpoint API.","Basic to inny przykład.","Klucz API to inny przykład."]},{id:"w05-21",s:"e",q:"W jakiej technologii zbudowane są strony logowania/rejestracji Identity w przykładach (Areas/Identity/Pages/Account/Login.cshtml)?",a:["Razor Pages","MVC z kontrolerem AccountController","Blazor","Minimal APIs"],e:"Identity UI jest w Razor Pages (Areas/Identity/Pages). Dlatego w Program.cs jest też app.MapRazorPages().",w:["Nie ma AccountController.","To nie Blazor.","To nie Minimal APIs."]},{id:"w05-22",s:"e",q:"Dlaczego aplikacja MVC z Identity ma w Program.cs app.MapRazorPages()?",a:["Bo strony Identity (logowanie, rejestracja) to Razor Pages","Bo kontrolery tego wymagają","Bo inaczej nie działa routing MVC","Dla Swaggera"],e:"Identity UI to Razor Pages w Areas/Identity, więc bez MapRazorPages strony logowania nie byłyby dostępne.",w:["Kontrolery tego nie wymagają.","Routing MVC działa bez tego.","Swagger nie jest tu używany."]},{id:"w05-23",s:"e",q:"Co robi app.UseMigrationsEndPoint() w trybie Development?",a:["Pozwala zastosować brakujące migracje EF z poziomu strony błędu","Automatycznie usuwa bazę","Wyświetla listę endpointów","Włącza Swagger"],e:"Razem z AddDatabaseDeveloperPageExceptionFilter pokazuje błędy bazy i pozwala zaaplikować migracje w Development.",w:["Nie usuwa bazy.","Nie wyświetla endpointów.","Nie dotyczy Swaggera."]},{id:"w05-24",s:"e",q:"Jak w przykładzie -birthdate dodano datę urodzenia do użytkownika?",a:["Rozszerzając klasę użytkownika (ApplicationUser : IdentityUser) o właściwość i dodając migrację","Dodając claim do ciasteczka","W appsettings.json","W tabeli ról"],e:"Własny ApplicationUser z BirthDate oraz migracja (…_BirthDate) rozszerzają schemat Identity. Handler wieku czyta user.BirthDate.",w:["Nie claim w cookie.","Nie w appsettings.","Nie w tabeli ról."]},{id:"w05-25",s:"f",q:"Przykład basicdefault: OnValidateCredentials sukces, gdy context.Username == context.Password. Które dane logowania przejdą?",a:["user: alice, hasło: alice","user: alice, hasło: secret","user: admin, hasło: admin123","Żadne – brak bazy"],e:"Uwierzytelnienie udaje się, gdy login równa się hasłu. To przykład demonstracyjny.",w:["Login ≠ hasło.","admin ≠ admin123.","Dane nie pochodzą z bazy – warunek to login == hasło."]},{id:"w05-26",s:"f",q:"Co oznacza options.AllowInsecureProtocol = true w Basic Auth?",a:["Zezwala na Basic Auth przez niezaszyfrowane HTTP (dane logowania jawnym tekstem w Base64)","Wyłącza sprawdzanie hasła","Pozwala na anonimowy dostęp","Wymusza HTTPS"],e:"Basic Auth przesyła login:hasło zakodowane Base64, czyli bez szyfrowania. Bez HTTPS jest to niebezpieczne, dlatego domyślnie jest blokowane.",w:["Hasło jest sprawdzane.","Anonimowy dostęp to nie to.","Odwrotnie – zezwala na HTTP."]},{id:"w05-27",s:"f",q:"Jak przesyłane są dane uwierzytelniające w Basic Authentication?",a:["W nagłówku Authorization: Basic base64(login:hasło)","W nagłówku Authorization: Bearer <JWT>","W query string","W ciasteczku sesji"],e:"Basic to Base64 z login:hasło. Base64 to kodowanie, nie szyfrowanie.",w:["Bearer to JWT.","Nie w query string.","Nie w ciasteczku."]},{id:"w05-28",s:"f",q:"basicdefault: AddAuthentication(BasicAuthenticationDefaults.AuthenticationScheme) + AddApiKeyHeaderAuthentication(…) + AddBasic(…); AddAuthorization() bez polityk. Żądanie z poprawnym kluczem API (bez Basic) do akcji [Authorize]. Wynik?",a:["401 – domyślna polityka używa tylko domyślnego schematu (Basic)","200 – oba schematy są sprawdzane","403","500"],e:"[Authorize] bez wskazania schematu korzysta z domyślnego schematu (Basic), więc klucz API nie jest sprawdzany.",w:["Domyślna polityka nie sprawdza klucza API.","Nie 403 – brak tożsamości.","Brak błędu serwera."]},{id:"w05-29",s:"f",q:"Jak przykład multiauth pozwala uwierzytelnić się kluczem API LUB Basic?",a:["Ustawia DefaultPolicy = new AuthorizationPolicyBuilder(ApiKeyScheme, BasicScheme).RequireAuthenticatedUser().Build()","Dodaje dwa atrybuty [Authorize] do każdej akcji","Wywołuje AddAuthentication dwa razy","Usuwa schemat domyślny"],e:"Domyślna polityka z dwoma schematami sprawdza oba, więc wystarczy uwierzytelnienie którymkolwiek.",w:["Dwa [Authorize] nie łączą schematów.","AddAuthentication jest wywołane raz.","Schemat domyślny jest nadal ustawiony."]},{id:"w05-30",s:"f",q:"Co oznacza RequireAuthenticatedUser() w polityce?",a:["Wymaga, by użytkownik był uwierzytelniony (bez dodatkowych ról/claimów)","Wymaga roli Admin","Wymaga potwierdzonego e-maila","Wymaga 2FA"],e:"Polityka przepuszcza każdego uwierzytelnionego użytkownika.",w:["Roli nie wymaga.","Potwierdzenia e-maila nie wymaga.","2FA nie wymaga."]},{id:"w05-31",s:"f",q:"Gdzie w przykładzie Basic Auth tworzona jest tożsamość użytkownika po poprawnej walidacji?",a:["context.Principal = new ClaimsPrincipal(new ClaimsIdentity(claims, context.Scheme.Name)); context.Success();","W bazie danych Identity","W ciasteczku przez SignInAsync","W TokenController"],e:"W OnValidateCredentials budowany jest ClaimsPrincipal z claimami (NameIdentifier, Name) i wywoływane context.Success().",w:["Nie w bazie Identity.","Nie SignInAsync.","To nie TokenController."]},{id:"w05-32",s:"g",q:"Czym jest claim?",a:["Stwierdzeniem o użytkowniku (para typ–wartość), np. e-mail, rola, imię","Rodzajem hasła","Kluczem API","Tabelą w bazie Identity"],e:"Claim to para typ–wartość opisująca podmiot. ClaimsIdentity grupuje claimy, a ClaimsPrincipal reprezentuje użytkownika.",w:["To nie hasło.","To nie klucz API.","To nie tabela."]},{id:"w05-33",s:"g",q:"Czego wymaga autoryzacja oparta o polityki z własnym wymaganiem (jak IsAdult)?",a:["Klasy wymagania (IAuthorizationRequirement), handlera (AuthorizationHandler<T>) zarejestrowanego w DI i polityki w AddAuthorization","Tylko atrybutu [Authorize(Roles)]","Tylko claimu w tokenie","Osobnej bazy danych"],e:"Pełny łańcuch: requirement, handler (DI), AddPolicy oraz [Authorize(Policy = …)].",w:["Role to inny mechanizm.","Claim nie wystarczy dla własnego wymagania.","Osobna baza nie jest potrzebna."]},{id:"w05-34",s:"g",q:'Akcja z [Authorize] w LeaderboardController ma [HttpGet("/leaderboard")]. Co zwróci żądanie bez uwierzytelnienia?',a:["401 Unauthorized (challenge schematu)","200 z pustą listą","404","403"],e:"Brak uwierzytelnienia to 401 (dla Basic z nagłówkiem WWW-Authenticate). 403 jest wtedy, gdy użytkownik jest znany, ale nie ma uprawnień.",w:["Brak tożsamości daje 401.","Akcja się nie wykona.","Endpoint istnieje."]},{id:"w05-35",s:"g",q:"Kod: summaries.OrderByDescending(x => Random.Shared.Next()).Select(x => new PointsDto(x, Random.Shared.Next(100))).OrderByDescending(x => x.Points). Jak posortowany jest wynik?",a:["Malejąco po losowych punktach (0–99)","Alfabetycznie","Losowo bez sortowania","Rosnąco po punktach"],e:"Ostatni OrderByDescending(x => x.Points) decyduje o kolejności: malejąco po punktach. Punkty z Next(100) mają wartości 0..99.",w:["Sortowanie nie jest alfabetyczne.","Ostatnie OrderBy sortuje.","Malejąco, nie rosnąco."]},{id:"w05-36",s:"g",q:"Który kod odpowiedzi oznacza „uwierzytelniony, ale brak uprawnień”?",a:["403 Forbidden","401 Unauthorized","404 Not Found","429 Too Many Requests"],e:"401 to brak lub niepoprawne uwierzytelnienie, 403 to brak uprawnień przy znanej tożsamości.",w:["401 to brak uwierzytelnienia.","404 to brak zasobu.","429 to rate limit."]}],Dk={id:Ck,title:Tk,sections:Pk,questions:Ak},vk="zpwo",Nk="Zarządzanie projektami wytwarzania oprogramowania",Mk="ZPWO",Rk="Zarządzanie projektami, PMBOK i PRINCE2, XP, FDD, Lean, DSDM, jakość, TDD i refaktoryzacja.",Lk=["w01","w02","w03"],Ik={id:vk,name:Nk,short:Mk,description:Rk,lectures:Lk},Ek="w01",xk="W0–W1 · Zarządzanie projektami, PMI i PRINCE2",Ok=[{id:"a",title:"Zaliczenie przedmiotu",text:"Aby zaliczyć wykład, trzeba zdobyć co najmniej **51%** punktów. Taki sam próg obowiązuje na laboratorium. Próg 50% nie wystarcza."},{id:"b",title:"Czym jest projekt",text:`**Projekt** to przedsięwzięcie tymczasowe, które ma doprowadzić do wytworzenia unikalnego produktu, usługi lub rezultatu. Nie jest rutyną, bo za każdym razem dotyczy nowej sytuacji. Realizuje się go w określonym czasie i przy ograniczonych środkach.

Celem projektu jest **wprowadzenie zmiany**.`},{id:"c",title:"Projekt a proces",text:`**Proces** to działanie powtarzalne, które sprzyja stabilizacji. Przykłady to taśmowa produkcja silników albo obsługa klienta w banku. Zmiany w procesie wprowadza się stopniowo, a kierownictwo rzadko się w niego wtrąca.

**Projekt** jest przeciwieństwem rutyny: zmienia i zaburza istniejące procesy. Dlatego w organizacji nastawionej na procesy projekt często wywołuje konflikty. Organizacje nastawione na projekty to na przykład uczelnia naukowa, zakład badawczo-rozwojowy, firma budowlana albo firma konsultingowa.

Każdy projekt opisują trzy parametry: **zakres** (rezultat), **czas** (termin) i **koszt** (budżet). Typowe trudności to opór ludzi, konflikt z normalnym działaniem firmy, presja czasu i ryzyko. Pojawiają się też nieporozumienia, bo projekt działa jako system wewnątrz innego, istniejącego już systemu.`},{id:"d",title:"Cele SMART",text:`Dobry cel projektu spełnia pięć warunków, które składają się na skrót **SMART**:
• **S**pecific – konkretny,
• **M**easurable – mierzalny,
• **A**chievable – osiągalny, czyli realistyczny,
• **R**elevant – istotny, czyli zgodny z celami biznesowymi,
• **T**ime-bound – określony w czasie.

Przykład: cel „napiszę powieść liczącą 60 000 słów w ciągu 6 miesięcy” jest mierzalny i ograniczony w czasie. Jest też osiągalny, ponieważ wymaga napisania około 2500 słów tygodniowo.`},{id:"e",title:"Metodyki zarządzania projektami",text:`Istnieją metodyki uniwersalne, które stosuje się w różnych branżach. W USA jest to **PMI**, w Wielkiej Brytanii **PRINCE2**, a w Unii Europejskiej **PM²**.

Istnieją też metodyki wdrożeniowe, na przykład SAP Activate, oraz metodyki firmowe, takie jak PMM (IBM), RUP i MSF (Microsoft).`},{id:"f",title:"Role w projekcie i jego etapy",text:`Zarządzanie projektem ma kilka poziomów. Najwyżej stoi zarząd, który sprawuje nadzór. Niżej jest **Komitet Sterujący**, który zarządza projektem strategicznie i zatwierdza rezultaty kolejnych etapów. Bieżącą pracą kieruje **kierownik projektu**, a poszczególnymi zespołami kierownicy zespołów.

**Sponsor** jest silnie zainteresowany sukcesem projektu. Wspiera kierownika swoim autorytetem i pomaga rozwiązywać problemy, także finansowe. Kierownik projektu przypomina kapitana: może zlecać zadania innym, ale odpowiedzialność nadal spoczywa na nim.

**Biuro projektu** zajmuje się dokumentacją, korespondencją i organizacją komunikacji. **Zespół zapewnienia jakości** kontroluje prace, przeprowadza audyt procesu, pilnuje procedur i zarządza ryzykiem.

Klasyczny projekt przechodzi cztery etapy: identyfikację (cele i studium wykonalności), planowanie, realizację i ukończenie (zwolnienie zasobów i wnioski na przyszłość). W podejściu klasycznym zakres jest stały, a termin i koszt dostosowuje się do niego.`},{id:"g",title:"PMI i PMBOK Guide",text:`**PMI** (Project Management Institute) to międzynarodowe stowarzyszenie z siedzibą w USA, które działa od 1969 roku. Opublikowało **PMBOK Guide**, czyli zbiór wiedzy i dobrych praktyk. Opisuje on, co należy wiedzieć i robić, ale nie narzuca jednej metody pracy. Obecnie aktualne jest 8. wydanie (listopad 2025), natomiast literatura przedmiotu opiera się jeszcze na 6. wydaniu z 2017 roku.

**PMBOK 6** opisuje projekt jako zestaw procesów: jest ich **49**, podzielonych na 5 grup i 10 obszarów wiedzy. Każdy proces należy do jednego obszaru wiedzy i do jednej grupy procesów. Grupy to: inicjowanie, planowanie, wykonawcze, monitorowanie i kontrola oraz zamknięcie.

Liczba procesów w poszczególnych obszarach: integracja 7, zakres 6, harmonogram 6, koszty 4, jakość 3, zasoby 6, komunikacja 3, ryzyko 7, zamówienia 3, interesariusze 4.

**PMBOK 7** (2021) odchodzi od procesów i opiera się na zasadach: ma 12 zasad i 8 domen wydajności. **PMBOK 8** (2025) łączy oba podejścia: ma 6 zasad, 7 domen wydajności i 40 procesów, a nowością są wątki o sztucznej inteligencji, biurze projektu (PMO) i zamówieniach.`},{id:"h",title:"PMBOK 6: integracja i harmonogram",text:`Obszar **zarządzania integracją** ma 7 procesów:
• 4.1 opracowanie karty projektu – grupa inicjowanie,
• 4.2 opracowanie planu zarządzania – planowanie,
• 4.3 kierowanie pracami i 4.4 zarządzanie wiedzą o projekcie – realizacja,
• 4.5 monitorowanie pracy i 4.6 zintegrowana kontrola zmian – monitorowanie i kontrola,
• 4.7 zamknięcie projektu.

**Karta projektu** formalnie uruchamia projekt i daje kierownikowi prawo do korzystania z zasobów.

Przykład kontroli zmian: klient zgłasza nową funkcję, zespół ocenia jej wpływ na zakres, termin i koszt, komitet ds. zmian podejmuje decyzję, a następnie aktualizuje się plan.

Harmonogram można zbudować **metodą ścieżki krytycznej (CPM)** w narzędziu takim jak MS Project albo GanttProject. Efektem są wykres Gantta, diagram sieciowy i kamienie milowe.`},{id:"i",title:"Zasady PMBOK 7 i 8 oraz interesariusze",text:`**PMBOK 7** ma 12 zasad: odpowiedzialne zarządzanie (stewardship), zespół, interesariusze, wartość, myślenie systemowe, przywództwo, dostosowanie (tailoring), jakość, złożoność, ryzyko, adaptacja i odporność oraz zmiana.

**PMBOK 8** ma 6 zasad: całościowe spojrzenie, skupienie na wartości, wbudowana jakość, odpowiedzialne przywództwo, uwzględnianie zrównoważonego rozwoju i upełnomocnione zespoły. Ma też 7 domen wydajności: nadzór, interesariusze, zakres, zasoby, harmonogram, ryzyko i finanse.

Poziom zaangażowania interesariuszy ocenia się na pięciostopniowej skali: nieświadomy, opierający się, neutralny, wspierający, wiodący. W macierzy zaangażowania litera **C** oznacza poziom obecny (current), a litera **D** poziom pożądany do osiągnięcia sukcesu (desired).`},{id:"j",title:"PRINCE2: podstawy i tolerancje",text:`**PRINCE2** to skrót od „PRojects IN Controlled Environments”, czyli projekty w kontrolowanym środowisku. Jest to standard administracji publicznej w Wielkiej Brytanii. Poprzednikami były PROMPT i PRINCE. Szóste wydanie opublikował AXELOS, a siódme **PeopleCert**. Komisja Europejska rozwija własną, otwartą metodykę **PM²**.

PRINCE2 w wersji 7 zwraca uwagę na siedem aspektów: czas, koszt, zakres, jakość, korzyści, ryzyko i **zrównoważony rozwój** (ten ostatni jest nowością). Dla każdego aspektu ustala się cel oraz **tolerancję**, czyli dopuszczalne odchylenie od celu, na przykład termin plus minus dwa tygodnie.

Na tym polega **zarządzanie przez wyjątki**. Dopóki kierownik projektu mieści się w tolerancjach, działa samodzielnie, a Komitet Sterujący się nie wtrąca. Gdy tolerancja zostanie przekroczona, kierownik zgłasza sprawę Komitetowi.

Siedem zasad PRINCE2: ciągła zasadność biznesowa (projekt trwa tak długo, jak ma uzasadnienie), uczenie się z doświadczeń, określone role i odpowiedzialności, zarządzanie etapami, zarządzanie przez wyjątki, skupienie na produktach i dostosowanie do projektu.`},{id:"k",title:"PRINCE2: praktyki, procesy i Komitet Sterujący",text:`**Praktyki** PRINCE2 (w starszych wydaniach nazywane tematami) odpowiadają na pytania:
• Business case (uzasadnienie biznesowe) – Dlaczego?
• Organizing (organizacja) – Kto?
• Plans (plany) – Jak? Ile? Kiedy?
• Quality (jakość) – Co?
• Risk (ryzyko) – Co, jeśli?
• Issues (zagadnienia, dawniej „Zmiana”) – Jaki to ma wpływ?
• Progress (postęp) – Gdzie jesteśmy i czy kontynuować?

W procesach **Komitet Sterujący** odpowiada za strategiczne zarządzanie projektem (DP, Directing a project). **Kierownik zespołu** odpowiada za zarządzanie wytwarzaniem produktów (MP, Managing product delivery). Pozostałe procesy prowadzi kierownik projektu.

Komitetowi Sterującemu przewodniczy **Executive**. Zasiadają w nim też Senior User i Senior Supplier, a nadzór nad jakością pełni Project Assurance.

PRINCE2 7 składa się z pięciu elementów: kontekstu projektu, **ludzi** (nowość), praktyk, procesów i zasad.`},{id:"l",title:"PRINCE2 Agile",text:"W **PRINCE2 Agile** czas i koszt są stałe, bez żadnej tolerancji. Negocjuje się więc zakres. Stałe są też krytyczne kryteria jakości. Stosowane techniki to między innymi historyjki użytkownika, priorytetyzacja **MoSCoW**, wykres spalania i retrospektywa."},{id:"m",title:"Certyfikaty i relacja PMBOK do PRINCE2",text:`PMI przyznaje certyfikaty **CAPM, PMP i PMI-ACP**. W PRINCE2 są dwa poziomy: Foundation i Practitioner.

PMBOK i PRINCE2 nie konkurują ze sobą, tylko się uzupełniają. PMBOK jest źródłem wiedzy i technik, a PRINCE2 dostarcza ram zarządzania z rolami, procesami i produktami.`}],qk=[{id:"w01-01",s:"a",q:"Jaki próg jest wymagany do zaliczenia wykładu?",a:["51%","50%","60%","75%"],w:["Pułapka – 50% nie wystarcza, trzeba 51%.","Za wysoko.","Za wysoko."],e:"Zgodnie z kryteriami oceny zaliczenie wykładu wymaga 51% punktów. Taki sam próg obowiązuje na laboratorium."},{id:"w01-02",s:"b",q:"Jak definiuje się projekt (przedsięwzięcie) wg wykładu?",a:["Tymczasowe przedsięwzięcie podjęte w celu wytworzenia unikalnego produktu, usługi lub rezultatu","Powtarzalny proces o ustalonej technologii","Stały dział w organizacji","Ciągła działalność operacyjna firmy"],w:["To opis działań procesowych.","Projekt jest tymczasowy.","To procesy, nie projekt."],e:"Projekt jest przedsięwzięciem nierutynowym, realizowanym w określonym czasie i określonymi środkami. Jego celem jest wprowadzenie zmiany."},{id:"w01-03",s:"b",q:"Co jest celem projektu wg wykładu?",a:["Wprowadzenie zmiany","Utrzymanie stabilizacji","Powtarzanie sprawdzonych czynności","Obsługa klienta"],w:["Stabilizacja to cel procesów.","To działania procesowe.","To przykład procesu."],e:"Celem projektu jest wprowadzenie zmiany. Sytuacja jest nowa, dlatego projekt nie jest procesem rutynowym."},{id:"w01-04",s:"c",q:"Który przykład to działanie procesowe, a nie projektowe?",a:["Taśmowa produkcja silnika","Wdrożenie nowego systemu ERP","Budowa nowej siedziby","Opracowanie nowego produktu"],w:["Wdrożenie to jednorazowa zmiana – projekt.","Budowa to projekt.","Nowy produkt to projekt."],e:"Działania procesowe są powtarzalne i sprzyjają stabilizacji, na przykład taśmowa produkcja albo obsługa klienta w banku."},{id:"w01-05",s:"c",q:"Która organizacja jest zorientowana na projekty wg wykładu?",a:["Przedsiębiorstwo budowlane","Bank","Zakład produkcyjny","Uczelnia dydaktyczna"],w:["Bank – orientacja procesowa.","Zakład produkcyjny – procesowa.","Uczelnia dydaktyczna – procesowa (naukowa – projektowa)."],e:"Organizacjami zorientowanymi na projekty są między innymi uczelnia naukowa, zakład B+R oraz firma budowlana, konsultingowa lub marketingowa."},{id:"w01-06",s:"c",q:"Dlaczego projekt w organizacji procesowej bywa w konflikcie z jej działaniem?",a:["Bo modyfikuje i zaburza istniejące procesy","Bo zawsze przekracza budżet","Bo nie ma kierownika","Bo jest tańszy"],w:["Nie zawsze przekracza budżet.","Projekt ma kierownika.","Cena nie jest przyczyną konfliktu."],e:"Projekt zmienia i zaburza istniejące procesy, dlatego w organizacji procesowej może powodować konflikty."},{id:"w01-07",s:"c",q:"Która cecha dotyczy PROCESU, a nie projektu?",a:["Zmiany wprowadzane są w sposób ewolucyjny, kierownictwo sporadycznie ingeruje","Wywołuje gruntowne zmiany","Kierownictwo aktywnie uczestniczy","Nowość sytuacji"],w:["To projekt.","To projekt.","To projekt."],e:"W procesie zmiany wprowadza się ewolucyjnie, a kierownictwo ingeruje w niego tylko sporadycznie. W projekcie jest odwrotnie."},{id:"w01-08",s:"c",q:"Które trzy kluczowe parametry projektu tworzą „trójkąt”?",a:["Zakres, czas, koszt","Jakość, ryzyko, zespół","Sponsor, kierownik, klient","Plan, wykonanie, kontrola"],w:["To ważne, ale nie trzy kluczowe parametry.","To role.","To etapy/funkcje."],e:"Trzy kluczowe parametry projektu to rezultat (zakres), czas realizacji (termin) i budżet (koszt)."},{id:"w01-09",s:"c",q:"Który z problemów projektu wynika z faktu, że projekt jest „systemem wewnątrz istniejącego systemu”?",a:["Nieporozumienia","Presja czasu","Ryzyko","Opór otoczenia"],w:["Presja czasu wynika z terminu.","Ryzyko z nowości i niepewności.","Opór – niechęć do zmian."],e:"Projekt działa jako system wewnątrz istniejącego systemu, więc łatwo o nieporozumienia. Opór, presja czasu i ryzyko to osobne problemy projektów."},{id:"w01-10",s:"d",q:"Co oznacza M w akronimie SMART?",a:["Measurable – mierzalny","Manageable – zarządzalny","Motivating – motywujący","Minimal – minimalny"],w:["Nie w tej definicji.","Nie w tej definicji.","Nie w tej definicji."],e:"SMART to: Specific, Measurable, Achievable, Relevant, Time-bound. Litera M oznacza więc „mierzalny”."},{id:"w01-11",s:"d",q:"Co oznacza R w SMART wg wykładu?",a:["Relevant – istotny (zgodny z celami biznesowymi)","Realistic – realistyczny","Responsible – odpowiedzialny","Reviewed – zweryfikowany"],w:["Pułapka: realistyczność to A (Achievable).","Nie w tej definicji.","Nie w tej definicji."],e:"Litera R oznacza „Relevant”, czyli istotny i zgodny z celami biznesowymi. Literą A oznaczono „Achievable”, czyli osiągalny i realistyczny."},{id:"w01-12",s:"d",q:"W przykładzie SMART („powieść 60 000 słów w 6 miesięcy”), który element odpowiada za Achievable?",a:["Będę pisać 2500 słów tygodniowo","Zawsze marzyłem o byciu pisarzem","Zacznę 1 stycznia, skończę 30 czerwca","Powieść science-fiction na 60 000 słów"],w:["To Relevant.","To Time-bound.","To Specific."],e:"Element „Achievable” (osiągalny) to realistyczne tempo pracy, czyli 2500 słów tygodniowo. „60 000 słów w 6 miesięcy” opisuje cel mierzalny."},{id:"w01-13",s:"e",q:"Która metodyka to uniwersalny standard z Wielkiej Brytanii?",a:["PRINCE2","PMI","PM²","RUP"],w:["PMI – USA.","PM² – Unia Europejska.","RUP – firmowa (IBM/Rational)."],e:"PRINCE2 jest uniwersalnym standardem z Wielkiej Brytanii. W USA odpowiednikiem jest PMI, a w Unii Europejskiej PM²."},{id:"w01-14",s:"e",q:"Do jakiej kategorii metodyk należy SAP Activate?",a:["Wdrożeniowe","Zwinne","Uniwersalne","Inżynierii oprogramowania (kaskadowe)"],w:["Zwinne: XP, FDD, Scrum.","Uniwersalne: PMI, PRINCE2, PM2.","IO: kaskadowe, punktów węzłowych."],e:"SAP Activate należy do metodyk wdrożeniowych. Metodyki firmowe to na przykład PMM (IBM), RUP i MSF (Microsoft)."},{id:"w01-15",s:"f",q:"Kto realizuje zarządzanie strategiczne projektem?",a:["Komitet Sterujący","Zarząd firmy","Kierownik projektu","Kierownik zespołu"],w:["Zarząd – generalny nadzór.","KP – zarządzanie bieżące.","Kierownik zespołu – zarządzanie zespołem."],e:"Strategicznym zarządzaniem projektem zajmuje się Komitet Sterujący. Kierownik projektu zarządza bieżącą pracą, a kierownik zespołu pracą zespołu."},{id:"w01-16",s:"f",q:"Jaka jest kolejność etapów klasycznego projektu wg wykładu?",a:["Identyfikacja → Planowanie/Projektowanie → Realizacja → Ukończenie","Realizacja → Planowanie → Identyfikacja → Ukończenie","Planowanie → Identyfikacja → Ukończenie → Realizacja","Identyfikacja → Realizacja → Planowanie → Ukończenie"],w:["Realizacja nie może być pierwsza.","Identyfikacja jest pierwsza.","Planowanie przed realizacją."],e:"Klasyczny projekt ma cztery etapy: identyfikację (cele, studium wykonalności), planowanie, realizację (prace, ryzyko, postęp) i ukończenie (zwolnienie zasobów, wnioski)."},{id:"w01-17",s:"f",q:"W którym etapie wykonuje się studium wykonalności?",a:["Identyfikacja","Realizacja","Ukończenie","Planowanie szczegółowe"],w:["Realizacja to praca i kontrola.","Ukończenie to zamknięcie.","Szczegółowe planowanie to harmonogram i kontrakt."],e:"Studium wykonalności wykonuje się w etapie identyfikacji, razem z definiowaniem celów i wstępnym planowaniem."},{id:"w01-18",s:"f",q:"Co jest stałe w planowaniu klasycznym (w odróżnieniu od zwinnego)?",a:["Zakres – a czas i budżet się dostosowują","Czas i budżet – a zakres się negocjuje","Wszystko jest elastyczne","Tylko jakość"],w:["To podejście zwinne / PRINCE2 Agile.","W klasycznym zakres jest stały.","Nie tylko jakość."],e:"W podejściu klasycznym zakres jest stały, a termin i koszt zmieniają się, by go zrealizować."},{id:"w01-19",s:"f",q:"Kim jest sponsor projektu?",a:["Osobą silnie zainteresowaną sukcesem, wspierającą KP autorytetem i rozwiązującą problemy (też finansowe)","Osobą zarządzającą bieżącą pracą zespołu","Członkiem biura projektu","Zewnętrznym audytorem"],w:["To kierownik projektu/zespołu.","Biuro prowadzi dokumentację.","Audyt to zespół zapewnienia jakości."],e:"Sponsor jest silnie zainteresowany sukcesem projektu, wspiera kierownika autorytetem i rozwiązuje problemy, także finansowe. Dba o dobry klimat „na górze” i korzysta ze wsparcia Komitetu Sterującego."},{id:"w01-20",s:"f",q:"Co wg wykładu kierownik projektu może delegować?",a:["Zadania – ale nie odpowiedzialność","Odpowiedzialność za projekt","Zadania i odpowiedzialność","Nic"],w:["Odpowiedzialność pozostaje na nim.","Odpowiedzialności nie przenosi.","Zleca realizację zadań."],e:"Kierownik projektu jest jak kapitan: może zlecać zadania, ale odpowiedzialność za projekt pozostaje przy nim."},{id:"w01-21",s:"f",q:"Kto zatwierdza rezultaty etapów realizacji projektu?",a:["Komitet Sterujący","Biuro projektu","Zespół wykonawczy","Podwykonawca"],w:["Biuro prowadzi dokumentację.","Zespół wykonuje.","Podwykonawca wykonuje zlecone prace."],e:"Komitet Sterujący sprawuje nadzór, wspiera sponsora, zatwierdza rezultaty etapów i zleca kontrole."},{id:"w01-22",s:"f",q:"Czym zajmuje się biuro projektu?",a:["Dokumentacją, korespondencją, administrowaniem i organizacją komunikacji","Podejmowaniem decyzji strategicznych","Audytem wewnętrznym","Finansowaniem projektu"],w:["To Komitet Sterujący.","To zespół zapewnienia jakości.","To sponsor."],e:"Biuro projektu pomaga kierownikowi i zespołom w pracach biurowych, takich jak dokumentacja, korespondencja i komunikacja."},{id:"w01-23",s:"f",q:"Czym zajmuje się zespół zapewnienia jakości?",a:["Kontrolą prac, audytem procesu, przestrzeganiem procedur, zarządzaniem ryzykiem","Prowadzeniem korespondencji","Zatwierdzaniem budżetu","Pisaniem kodu"],w:["To biuro projektu.","To sponsor/komitet.","To zespół wykonawczy."],e:"Zespół zapewnienia jakości kontroluje prace, robi audyty wewnętrzne, pilnuje procedur i zarządza ryzykiem. Może też wstrzymać zagrożony projekt (STOP)."},{id:"w01-24",s:"g",q:"Od kiedy istnieje Project Management Institute (PMI)?",a:["Od 1969 r. (USA)","Od 1989 r. (UK)","Od 2001 r.","Od 1996 r."],w:["1989 to PRINCE (UK).","To rok Agile Manifesto.","1996 to PRINCE2."],e:"PMI to międzynarodowe stowarzyszenie z USA, założone w 1969 roku."},{id:"w01-25",s:"g",q:"Co opisuje PMBOK® Guide?",a:["Co należy wiedzieć i robić – zbiór dobrych praktyk, nie narzuca jednej metody","Ścisłą metodykę z rolami i procesami","Wyłącznie metody zwinne","Kod etyki programistów"],w:["To PRINCE2 (kto, co i kiedy).","Nie tylko agile.","To nie kodeks etyki."],e:"PMBOK Guide jest zbiorem wiedzy i dobrych praktyk. Mówi, co należy wiedzieć i robić, ale nie narzuca jednej metody. Metodyką z rolami, procesami i produktami jest natomiast PRINCE2."},{id:"w01-26",s:"g",q:"Które wydanie PMBOK® jest aktualne wg wykładu?",a:["8. (listopad 2025)","6. (2017)","7. (2021)","5. (2013)"],w:["6. jest podstawą slajdów, ale nie aktualne.","Poprzednie.","Starsze."],e:"Aktualne jest 8. wydanie PMBOK z listopada 2025 roku. W literaturze przedmiotu wciąż funkcjonuje 6. wydanie z 2017 roku."},{id:"w01-27",s:"g",q:"Ile procesów, grup procesów i obszarów wiedzy ma PMBOK® 6 (2017)?",a:["49 procesów, 5 grup, 10 obszarów","40 procesów, 5 obszarów, 7 domen","12 zasad, 8 domen","7 zasad, 7 praktyk, 7 procesów"],w:["To PMBOK 8.","To PMBOK 7.","To PRINCE2."],e:"PMBOK 6 opiera się na procesach: ma 49 procesów, 5 grup procesów i 10 obszarów wiedzy. Dla każdego procesu opisuje wejścia, narzędzia i wyjścia (ITTO)."},{id:"w01-28",s:"g",q:"Czym charakteryzuje się PMBOK® 7 (2021)?",a:["Podejście oparte na zasadach: 12 zasad, 8 domen wydajności, rezygnacja z opisu procesów","49 procesów i 10 obszarów","6 zasad i 40 procesów","7 zasad i 7 procesów"],w:["To PMBOK 6.","To PMBOK 8.","To PRINCE2."],e:"PMBOK 7 opiera się na zasadach: ma 12 zasad i 8 domen wydajności. Rezygnuje z opisu procesów, a podkreśla wartość i dostosowanie (tailoring)."},{id:"w01-29",s:"g",q:"Czym charakteryzuje się PMBOK® 8 (2025)?",a:["6 zasad, 7 domen wydajności, 40 procesów w 5 obszarach; nowe: AI, PMO, zamówienia","12 zasad i 8 domen","49 procesów i 10 obszarów","Tylko metody zwinne"],w:["To PMBOK 7.","To PMBOK 6.","Nie tylko agile."],e:"PMBOK 8 łączy zasady z wydania 7 z procesami z wydania 6. Ma 6 zasad, 7 domen wydajności i 40 procesów, a nowe wątki to AI, PMO i zamówienia."},{id:"w01-30",s:"g",q:"Które z poniższych NIE jest grupą procesów PMI?",a:["Procesy testowania","Procesy inicjowania","Procesy monitorowania i kontroli","Procesy zamknięcia"],w:["To grupa procesów.","To grupa procesów.","To grupa procesów."],e:"Grupy procesów PMI to inicjowanie, planowanie, wykonawcze (realizacja), monitorowanie i kontrola oraz zamknięcie. Grupy „procesy testowania” nie ma."},{id:"w01-31",s:"g",q:"Który z obszarów wiedzy PMBOK® 6 ma najwięcej (7) procesów obok integracji?",a:["Ryzyko","Jakość","Komunikacja","Koszty"],w:["Jakość – 3 procesy.","Komunikacja – 3.","Koszty – 4."],e:"Liczba procesów w obszarach: integracja 7, zakres 6, harmonogram 6, koszty 4, jakość 3, zasoby 6, komunikacja 3, ryzyko 7, zamówienia 3, interesariusze 4, razem 49. Tyle samo co integracja (7) ma ryzyko."},{id:"w01-32",s:"g",q:"Ile procesów ma obszar Zarządzanie kosztami w PMBOK® 6?",a:["4","6","7","3"],w:["6 mają zakres, harmonogram, zasoby.","7 mają integracja i ryzyko.","3 mają jakość, komunikacja, zamówienia."],e:"Obszar zarządzania kosztami ma 4 procesy."},{id:"w01-33",s:"g",q:"Do ilu obszarów wiedzy i grup procesów należy każdy proces w PMBOK® 6?",a:["Do jednego obszaru wiedzy i jednej grupy procesów","Do kilku obszarów","Tylko do obszaru, bez grupy","Do wszystkich grup"],w:["Dokładnie jeden obszar.","Należy też do grupy.","Do jednej grupy."],e:"Każdy proces należy jednocześnie do jednego obszaru wiedzy i do jednej grupy procesów."},{id:"w01-34",s:"h",q:"Który dokument formalnie uruchamia projekt i daje kierownikowi uprawnienia do zasobów?",a:["Karta projektu","Rejestr założeń","Plan zarządzania projektem","Harmonogram"],w:["Rejestr założeń to drugie wyjście procesu 4.1.","Plan powstaje w procesie 4.2 (planowanie).","Harmonogram to obszar 6."],e:"Kartę projektu opracowuje się w procesie 4.1 (inicjowanie). Formalnie uruchamia ona projekt i daje kierownikowi uprawnienia do zasobów."},{id:"w01-35",s:"h",q:"Do której grupy procesów należy 4.6 Zintegrowana kontrola zmian?",a:["Monitorowanie i kontrola","Planowanie","Realizacja","Zamknięcie"],w:["Planowanie – 4.2.","Realizacja – 4.3 i 4.4.","Zamknięcie – 4.7."],e:"Procesy integracji dzielą się na grupy: 4.1 inicjowanie, 4.2 planowanie, 4.3–4.4 realizacja, 4.5–4.6 monitorowanie i kontrola, 4.7 zamknięcie. Zintegrowana kontrola zmian (4.6) należy więc do monitorowania i kontroli."},{id:"w01-36",s:"h",q:"Do której grupy procesów należy 4.4 Zarządzanie wiedzą o projekcie?",a:["Realizacja","Planowanie","Monitorowanie i kontrola","Inicjowanie"],w:["Planowanie – 4.2.","Monitorowanie – 4.5 i 4.6.","Inicjowanie – 4.1."],e:"Procesy 4.3 (kierowanie pracami) i 4.4 (zarządzanie wiedzą o projekcie) należą do grupy realizacji."},{id:"w01-37",s:"h",q:"Jaka jest kolejność w procesie zintegrowanej kontroli zmian (przykład z wykładu)?",a:["Zgłoszenie → ocena wpływu na zakres, termin i koszt → decyzja komitetu ds. zmian → aktualizacja planu","Zgłoszenie → natychmiastowa implementacja","Decyzja komitetu → zgłoszenie → ocena","Aktualizacja planu → ocena → zgłoszenie"],w:["Najpierw ocena i decyzja.","Zła kolejność.","Zła kolejność."],e:"Zmianę obsługuje się tak: klient zgłasza funkcję, ocenia się jej wpływ na zakres, termin i koszt, komitet ds. zmian podejmuje decyzję, a na końcu aktualizuje się plan i harmonogram."},{id:"w01-38",s:"h",q:"Jaką metodę harmonogramowania podano jako przykład?",a:["Metoda ścieżki krytycznej (CPM)","MoSCoW","Planning Poker","Story Points"],w:["MoSCoW to priorytetyzacja.","To technika szacowania zwinnego.","To jednostka szacowania."],e:"Harmonogram tworzy się metodą (na przykład ścieżki krytycznej, CPM) i narzędziem (MS Project, GanttProject). Efektem są wykres Gantta, diagram sieciowy i kamienie milowe."},{id:"w01-39",s:"i",q:"Które z poniższych jest jedną z 12 zasad PMBOK® 7?",a:["Dostosowanie (tailoring)","Zrównoważony rozwój","Koncentracja na produktach","Ciągła zasadność biznesowa"],w:["To zasada PMBOK 8 (i aspekt PRINCE2 7).","To zasada PRINCE2.","To zasada PRINCE2."],e:"Wśród 12 zasad PMBOK 7 jest dostosowanie (tailoring). Pozostałe to: stewardship, zespół, interesariusze, wartość, myślenie systemowe, przywództwo, jakość, złożoność, ryzyko, adaptacja i odporność oraz zmiana."},{id:"w01-40",s:"i",q:"Która z poniższych jest jedną z 6 zasad PMBOK® 8?",a:["Zrównoważony rozwój (Integrate sustainability)","Myślenie systemowe","Złożoność","Zarządzanie etapowe"],w:["To PMBOK 7.","To PMBOK 7.","To PRINCE2."],e:"Sześć zasad PMBOK 8 to: całościowe spojrzenie, skupienie na wartości, wbudowana jakość, odpowiedzialne przywództwo, uwzględnianie zrównoważonego rozwoju i upełnomocnione zespoły."},{id:"w01-41",s:"i",q:"Ile domen wydajności ma PMBOK® 8?",a:["7","8","10","12"],w:["8 to PMBOK 7.","10 to obszary wiedzy PMBOK 6.","12 to zasady PMBOK 7."],e:"PMBOK 8 ma 7 domen wydajności: nadzór, interesariusze, zakres, zasoby, harmonogram, ryzyko i finanse."},{id:"w01-42",s:"i",q:"Na macierzy zaangażowania interesariuszy co oznacza litera D?",a:["Pożądany poziom zaangażowania (desired)","Obecny poziom (current)","Decydent","Dostawca"],w:["C = current.","Nie ma takiego oznaczenia.","Nie ma takiego oznaczenia."],e:"W macierzy zaangażowania interesariuszy C oznacza poziom bieżący (current), a D poziom pożądany do osiągnięcia sukcesu (desired)."},{id:"w01-43",s:"i",q:"Które poziomy zaangażowania interesariuszy wymieniono?",a:["Nieświadomy, opierający się, neutralny, wspierający, wiodący","Niski, średni, wysoki","Pasywny, aktywny","Klient, dostawca, użytkownik"],w:["To nie te poziomy.","To nie te poziomy.","To role, nie poziomy."],e:"PMBOK 6 (rozdział 13) wymienia pięć poziomów zaangażowania: nieświadomy, opierający się, neutralny, wspierający i wiodący."},{id:"w01-44",s:"j",q:"Co oznacza skrót PRINCE2?",a:["PRojects IN Controlled Environments","PRoject INitiation and Control Engine","PRocess INtegrated Change Evaluation","PRofessional INternational Certification"],w:["Nie.","Nie.","Nie."],e:"PRINCE2 to skrót od PRojects IN Controlled Environments, czyli projekty w kontrolowanym środowisku. Jest to standard administracji publicznej w Wielkiej Brytanii."},{id:"w01-45",s:"j",q:"Kto wydaje 7. wydanie PRINCE2?",a:["PeopleCert","AXELOS","CCTA","PMI"],w:["AXELOS – 6. wydanie (i PRINCE2 Agile 2015).","CCTA – PRINCE (pierwotny).","PMI wydaje PMBOK."],e:"Siódme wydanie PRINCE2 wydaje PeopleCert. Wcześniej, w wydaniu 6., wydawcą był AXELOS."},{id:"w01-46",s:"j",q:"Jaką metodykę rozwija Komisja Europejska?",a:["PM²","PRINCE2","PMBOK","Scrum"],w:["To UK.","To PMI (USA).","To framework zwinny."],e:"Komisja Europejska rozwija własną, otwartą metodykę PM²."},{id:"w01-47",s:"j",q:"Który aspekt wydajności jest NOWY w PRINCE2 7?",a:["Zrównoważony rozwój","Czas","Ryzyko","Jakość"],w:["Był wcześniej.","Był wcześniej.","Był wcześniej."],e:"PRINCE2 7 ma siedem aspektów wydajności: czas, koszt, zakres, jakość, korzyści, ryzyko i zrównoważony rozwój. Ostatni z nich jest nowy."},{id:"w01-48",s:"j",q:"Czym jest tolerancja w PRINCE2?",a:["Dopuszczalnym odchyleniem od celu aspektu (np. termin ±2 tygodnie)","Tolerancją na błędy w kodzie","Liczbą dopuszczalnych zmian zakresu","Czasem na naprawę defektu"],w:["Nie dotyczy kodu.","To nie liczba zmian.","To nie SLA."],e:"Dla każdego aspektu ustala się cel i tolerancję, czyli dopuszczalne odchylenie od celu, na przykład termin plus minus dwa tygodnie. W jej granicach kierownik projektu działa samodzielnie."},{id:"w01-49",s:"j",q:"Na czym polega zarządzanie przez wyjątki w PRINCE2?",a:["KP działa samodzielnie w granicach tolerancji, a ich przekroczenie eskaluje do Komitetu Sterującego","Komitet codziennie zatwierdza decyzje KP","Zespół omija KP przy problemach","Obsługa wyjątków w kodzie"],w:["Komitet nie ingeruje w bieżącą pracę.","Eskalacja idzie przez KP.","To nie programowanie."],e:"Komitet Sterujący ustala tolerancje i nie ingeruje, dopóki kierownik projektu się w nich mieści. Gdy tolerancja zostanie przekroczona, kierownik zgłasza sprawę Komitetowi."},{id:"w01-50",s:"j",q:"Która zasada PRINCE2 mówi, że projekt trwa, dopóki ma uzasadnienie biznesowe?",a:["Ciągła zasadność biznesowa","Zarządzanie etapowe","Koncentracja na produktach","Korzystanie z doświadczeń"],w:["Etapowe – decyzje etap po etapie.","Produkty – planowanie od produktów.","Doświadczenia – wnioski z projektów."],e:"Zasada ciągłej zasadności biznesowej oznacza, że projekt trwa tylko tak długo, jak ma uzasadnienie biznesowe. Pozostałe zasady PRINCE2 to uczenie się z doświadczeń, role, etapy, tolerancje, produkty i dostosowanie."},{id:"w01-51",s:"k",q:"Na jakie pytanie odpowiada praktyka „Uzasadnienie biznesowe” (Business case) w PRINCE2?",a:["Dlaczego?","Kto?","Gdzie jesteśmy?","Co, jeśli…?"],w:["Kto? – Organizowanie.","Gdzie jesteśmy? – Postępy.","Co, jeśli…? – Ryzyko."],e:"Praktyka Business case odpowiada na pytanie „Dlaczego?”. Pozostałe odpowiadają na pytania: Organizing – Kto? Plans – Jak? Ile? Kiedy? Quality – Co? Risk – Co, jeśli? Issues – Jaki wpływ? Progress – Gdzie jesteśmy i czy kontynuować?"},{id:"w01-52",s:"k",q:"Jak nazywały się praktyki PRINCE2 we wcześniejszych wydaniach?",a:["Tematy","Procesy","Zasady","Domeny"],w:["Procesy to osobny element.","Zasady to osobny element.","Domeny to PMBOK."],e:"W PRINCE2 7 mówi się o praktykach, a we wcześniejszych wydaniach o tematach. Praktyka „Zagadnienia” nazywała się dawniej „Zmiana”."},{id:"w01-53",s:"k",q:"Kto odpowiada za proces Strategiczne zarządzanie projektem (Directing a project, DP) w PRINCE2?",a:["Komitet Sterujący","Kierownik projektu","Kierownik zespołu","Biuro projektu"],w:["KP odpowiada za SU, IP, CS, SB, CP.","Kierownik zespołu – MP.","Biuro nie odpowiada za procesy."],e:"Proces strategicznego zarządzania projektem (DP) należy do Komitetu Sterującego. Proces MP prowadzi kierownik zespołu, a pozostałe kierownik projektu."},{id:"w01-54",s:"k",q:"Kto odpowiada za proces Zarządzanie wytwarzaniem produktów (MP) w PRINCE2?",a:["Kierownik zespołu","Kierownik projektu","Komitet Sterujący","Sponsor"],w:["KP odpowiada za inne procesy.","Komitet – DP.","Sponsor nie ma procesu."],e:"Proces zarządzania wytwarzaniem produktów (MP) prowadzi kierownik zespołu, czyli osoba na poziomie dostarczania produktów."},{id:"w01-55",s:"k",q:"Kto przewodniczy Komitetowi Sterującemu w strukturze PRINCE2?",a:["Executive (Przewodniczący)","Senior User","Senior Supplier","Project Support"],w:["Główny użytkownik – członek komitetu.","Główny dostawca – członek komitetu.","Wsparcie – poza komitetem."],e:"Komitetowi Sterującemu przewodniczy Executive. Pozostali członkowie to Senior User i Senior Supplier, a nadzór pełni Project Assurance."},{id:"w01-56",s:"k",q:"Który element jest nowy w PRINCE2 7 (pięć elementów)?",a:["Ludzie","Zasady","Praktyki","Procesy"],w:["Zasady były wcześniej.","Praktyki (tematy) były wcześniej.","Procesy były wcześniej."],e:"PRINCE2 7 ma pięć elementów: kontekst projektu, ludzi, praktyki, procesy i zasady. Nowym elementem są ludzie."},{id:"w01-57",s:"l",q:"Co jest stałe w PRINCE2 Agile?",a:["Czas i koszt (zerowa tolerancja)","Zakres","Wszystkie funkcje","Ryzyko"],w:["Zakres jest elastyczny (MoSCoW).","Funkcje dostarcza się wg priorytetów.","Ryzyko może się zmieniać w granicach."],e:"W PRINCE2 Agile stałe są czas i koszt, bez tolerancji, więc negocjuje się zakres. Krytyczne kryteria jakości również są stałe."},{id:"w01-58",s:"l",q:"Która technika jest wymieniona w PRINCE2 Agile?",a:["MoSCoW","Metoda ścieżki krytycznej","Diagram Ishikawy","Analiza SWOT"],w:["CPM to klasyczne harmonogramowanie.","Nie wymieniona.","Nie wymieniona."],e:"PRINCE2 Agile korzysta z technik takich jak historyjki użytkownika, MoSCoW, wykres spalania i retrospektywa."},{id:"w01-59",s:"m",q:"Które certyfikaty są przypisane do PMI?",a:["CAPM, PMP, PMI-ACP","PRINCE2 Foundation, Practitioner","PSM, CSM","ITIL Foundation"],w:["To PRINCE2.","To certyfikaty Scrum.","To ITIL."],e:"PMI przyznaje certyfikaty CAPM, PMP i PMI-ACP. Certyfikaty PRINCE2 to Foundation i Practitioner."},{id:"w01-60",s:"m",q:"Które stwierdzenie o PMBOK i PRINCE2 jest prawdziwe?",a:["Uzupełniają się: PMBOK – źródło wiedzy i technik, PRINCE2 – ramy zarządzania","Wzajemnie się wykluczają","PRINCE2 jest słabiej sformalizowany niż PMBOK","PMBOK pochodzi z UK"],w:["Nie wykluczają się.","Odwrotnie – PMBOK jest słabiej sformalizowany.","PMBOK – USA."],e:"W praktyce oba podejścia się uzupełniają. PMBOK jest źródłem wiedzy i technik, a PRINCE2 dostarcza ram zarządzania."}],Wk={id:Ek,title:xk,sections:Ok,questions:qk},Bk="w02",Fk="W2a · Podejścia zwinne: XP, historyjki, FDD, Lean, DSDM",Kk=[{id:"a",title:"Podejście zwinne a klasyczne",text:`W podejściu klasycznym zakres jest ustalony, a czas i koszt mogą się zmieniać. W podejściu zwinnym (nastawionym na wartość) jest odwrotnie: **czas i zasoby są ustalone, a szacuje się zakres**. Jakość jest stała w obu podejściach.

Wykład porządkuje pojęcia na czterech poziomach: wartości (Manifest Agile), zasady (Lean), ramy i metodyki (Scrum, DSDM) oraz praktyki (XP). Praktyki odpowiadają na pytanie, jak wytwarzamy oprogramowanie, na przykład przez TDD, pracę w parach, refaktoryzację i ciągłą integrację.`},{id:"b",title:"Manifest Agile i metody zwinne",text:`**Manifest Agile** z 2001 roku zawiera 4 wartości i 12 zasad. Nie stworzył nowej metody. Nazwał jedynie wspólne wartości, które miały już istniejące metody „lekkie”.

Inne metody i pojęcia:
• **Scrumban** to hybryda: łączy rytm Scruma z przepływem pracy i limitami WIP z Kanbana.
• **SAFe, LeSS i Nexus** służą do skalowania pracy na wiele zespołów.
• **Crystal** (A. Cockburn) ma warianty zależne od wielkości zespołu: Clear jest dla zespołów liczących 1–6 osób. Im większy zespół i wyższa krytyczność projektu, tym więcej formalizmu.
• **ASD** (J. Highsmith, 2000) uznaje zmianę za normę, a plan za hipotezę. Jego fazy to spekulacja, współpraca i uczenie się.
• **AUP** (S. Ambler) to uproszczona, zwinna odmiana Unified Process z fazami: rozpoczęcie, opracowanie, konstrukcja i przejście. Jej następcą jest DAD.`},{id:"c",title:"Extreme Programming (XP)",text:`**XP** powstał w projekcie płacowym C3 w firmie Chrysler (K. Beck, R. Jeffries). Jego idea to dobre praktyki doprowadzone do ekstremum. Skoro testy są dobre, to pisze się je najpierw (test-first). Skoro częste scalanie kodu jest dobre, to robi się ciągłą integrację. Skoro przegląd kodu jest dobry, to prowadzi się go cały czas, czyli programuje w parach.

Wartości XP to komunikacja, prostota, informacja zwrotna, odwaga i **szacunek**, który dodano w drugim wydaniu.

Role w zespole: programiści, tester, **tracker** (mierzy postęp i porównuje szacunki z rzeczywistymi wynikami) oraz coach. Po stronie klienta są właściciel produktu, eksperci i analitycy. Zgodnie z zasadą „Cały zespół” klient pracuje razem z programistami, w proporcji około 2 do 3. Iteracja trwa od jednego do trzech tygodni.`},{id:"d",title:"Historyjki użytkownika i INVEST",text:`Historyjkę użytkownika zapisuje się według szablonu: „Jako <rola> chcę <cel>, aby <korzyść>”. Rola powinna być konkretna, a nie ogólna, więc „użytkownik systemu” jest złym wyborem.

Dobra historyjka spełnia warunki **INVEST**:
• **I**ndependent – niezależna od innych,
• **N**egotiable – możliwa do negocjowania,
• **V**aluable – wartościowa dla klienta,
• **E**stimable – da się ją oszacować,
• **S**mall – mała,
• **T**estable – da się ją przetestować.

Przykłady błędów:
• „Zaprojektuj bazę danych zleceń” to zadanie techniczne. Klient nie zauważy różnicy, więc historyjka nie jest wartościowa (V).
• „System ma działać szybko” nie jest testowalne (T), bo nie wiadomo, kiedy zadanie jest skończone. Lepiej napisać na przykład: „wyszukiwanie trwa krócej niż 2 sekundy”.
• Gdy nikt nie potrafi oszacować historyjki, na przykład modułu fiskalnego, zespół robi **spike**, czyli krótkie rozpoznanie wykonywane przed szacowaniem.`},{id:"e",title:"Kryteria akceptacji, DoD, DoR i hierarchia wymagań",text:`Historyjka ma trzy elementy, zwane **3C**: kartę (Card), rozmowę (Conversation) i potwierdzenie (**Confirmation**). Potwierdzeniem są kryteria akceptacji. Na jedną historyjkę zaleca się od 3 do 7 takich kryteriów. Każde z nich ma dać się sprawdzić odpowiedzią „tak” lub „nie” i opisywać zachowanie systemu, a nie wygląd ekranu.

**Kryteria akceptacji** dotyczą jednej historyjki i mówią, co ma działać. **Definition of Done (DoD)** dotyczy wszystkich historyjek i mówi, jak dobrze mają być wykonane. Historyjka jest skończona, gdy spełnia jedno i drugie.

**Definition of Ready (DoR)** to warunki wejścia: określają, czy historyjkę można zaplanować do iteracji. DoR nie jest częścią Scrum Guide, tylko praktyką opcjonalną. Zbyt długa lista warunków zamienia go w bramkę znaną z modelu kaskadowego.

Wymagania mają trzy poziomy:
• **epik** trwa miesiące i jest szacowany w rozmiarach koszulek (S, M, L),
• **historyjka** mieści się w jednej iteracji i jest szacowana w punktach (story points),
• **zadanie techniczne** trwa najwyżej jeden dzień i jest szacowane w godzinach.`},{id:"f",title:"Dzielenie historyjek",text:`Historyjki dzieli się „w pionie”, jak plaster tortu. Każda przechodzi przez wszystkie warstwy systemu i dostarcza wartość klientowi. Podział na warstwy robi się dopiero na poziomie zadań technicznych.

Pomaga w tym technika **SPIDR** (M. Cohn): Spike, **P**aths (ścieżki), Interfaces (interfejsy), Data (dane), Rules (reguły).`},{id:"g",title:"Gra planistyczna i prosty projekt",text:`W **grze planistycznej** w XP obowiązuje podział pracy. Biznes decyduje, **co** ma być zrobione i **kiedy**: klient pisze historyjki i ustala ich kolejność. Programiści mówią, **ile** to kosztuje i **jak** to zrobić.

Budżet wydania oblicza się jako **prędkość razy liczba iteracji**. Zasada „**wczorajszej pogody**” mówi, że w następnej iteracji planuje się tyle punktów, ile zespół faktycznie ukończył w poprzedniej. Iteracja jest timeboxem, czyli ma stały czas trwania, więc gdy czasu brakuje, zmniejsza się zakres.

Beck podaje cztery reguły prostego projektu, uporządkowane od najważniejszej:
1. kod przechodzi wszystkie testy,
2. wyraża intencję programisty,
3. nie zawiera powtórzeń,
4. ma jak najmniej elementów.`},{id:"h",title:"Praktyki XP: YAGNI, programowanie w parach, CI",text:`**YAGNI** (You Aren’t Gonna Need It) oznacza, że niczego nie robimy na zapas. **KISS** nakazuje wybierać najprostsze rozwiązanie, a **DRY** unikać powtórzeń.

W **programowaniu w parach** jedna osoba jest kierowcą (pisze kod i myśli taktycznie), a druga nawigatorem (przegląda kod i myśli strategicznie). Role zamienia się co kilkadziesiąt minut. Według badań Cockburna i Williams z 2000 roku para potrzebuje około 15% więcej czasu, ale popełnia około 15% mniej defektów. W XP kod jest wspólną własnością zespołu. W FDD każdą klasą opiekuje się jeden właściciel.

**Ciągła integracja (CI)** scala i testuje każdą zmianę. Build z testami powinien trwać najwyżej 10 minut, kod scala się z gałęzią główną co najmniej raz dziennie, a zepsuty (czerwony) build ma najwyższy priorytet. **Daily Build** scala kod tylko raz na dobę, więc błędy ujawniają się dopiero po wielu godzinach.

Zasadę zrównoważonego tempa w pierwszym i drugim wydaniu XP nazwano „40-godzinnym tygodniem”, a później „Energized Work”.`},{id:"i",title:"Co utrudnia stosowanie XP",text:"XP trudno stosować, gdy zespoły są duże i rozproszone, gdy umowa przewiduje stałą cenę i stały zakres, gdy brakuje klienta, gdy cykl testów jest długi albo gdy w firmie panuje kultura nadgodzin."},{id:"j",title:"FDD (Feature Driven Development)",text:`W **FDD** pracuje się nad **cechami** (features). Cecha to coś, co ma wartość dla klienta, a jej implementacja trwa najwyżej dwa tygodnie. Nazwę cechy tworzy się według szablonu <akcja> <rezultat> <obiekt>, na przykład „Oblicz wartość zlecenia”.

Procesy 1–3 (model ogólny, lista cech, planowanie według cech) wykonuje się raz, na początku projektu. Projektowanie i budowę poszczególnych cech powtarza się iteracyjnie. Jakość zapewniają obowiązkowe inspekcje projektu i kodu.

Postęp mierzy się wagami kamieni milowych: przegląd domeny 1%, projekt 40%, inspekcja projektu 3%, kod 40%, inspekcja kodu 10%, włączenie do głównej wersji 1%. Cecha, która ma już projekt i jego inspekcję, jest więc ukończona w 1 + 40 + 3 = 44%.

Stan zbiorów cech pokazuje się kolorami w raporcie **parking lot**. Dzięki niemu kierownictwo widzi postęp bez szczegółów technicznych.`},{id:"k",title:"Lean",text:`**Lean** wywodzi się z Toyota Production System (T. Ohno), a w oprogramowaniu rozwijali go M. i T. Poppendieck. To zbiór zasad, a nie proces. Jednym z narzędzi jest Kanban.

Siedem zasad Lean: eliminuj straty, wbudowuj jakość, twórz wiedzę, **odkładaj decyzje**, dostarczaj szybko, szanuj ludzi i optymalizuj całość. Zasada „odkładaj decyzje” oznacza, że decyzje trudne do odwrócenia podejmuje się w ostatnim odpowiedzialnym momencie.

Lean wyróżnia rodzaje marnotrawstwa i przekłada je na oprogramowanie:
• zapasy to praca częściowo wykonana, na przykład kod niezintegrowany albo niewdrożony,
• nadprodukcja to funkcje, których nikt nie potrzebuje,
• transport to przekazywanie pracy między ludźmi,
