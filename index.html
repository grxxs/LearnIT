żeli – Wtedy","<akcja> <rezultat> <obiekt>","Given – When – Then – And"],w:["To format kryteriów akceptacji (scenariusze).","To szablon cechy FDD.","To BDD (scenariusze)."],e:"Connextra (2001): Jako <rola> chcę <cel>, aby <korzyść>."},{id:"w02-18",q:"Która rola w historyjce jest błędna wg wykładu?",a:["„użytkownik systemu” – zbyt ogólna","„pracownik obsługi klienta”","„właściciel pralni”","„klient zarejestrowany”"],w:["To konkretna rola – dobrze.","To konkretna rola – dobrze.","To konkretna rola – dobrze."],e:"Rola: konkretna rola/persona, nie ogólny „użytkownik”."},{id:"w02-19",q:"Co oznacza V w INVEST?",a:["Valuable – wartościowa","Verified – zweryfikowana","Visible – widoczna","Versioned – wersjonowana"],w:["Nie w INVEST.","Nie w INVEST.","Nie w INVEST."],e:"INVEST: Independent, Negotiable, Valuable, Estimable, Small, Testable (B. Wake, 2003)."},{id:"w02-20",q:"Historyjka „Zaprojektuj bazę danych zleceń” narusza którą cechę INVEST?",a:["Valuable – to zadanie techniczne, klient nie widzi różnicy","Small","Independent","Testable"],w:["Może być mała – problemem jest brak wartości.","Problem nie dotyczy zależności.","Problem nie dotyczy testowalności."],e:"V – „czy klient zauważy różnicę?” – zadanie techniczne to nie historyjka."},{id:"w02-21",q:"„System ma działać szybko” narusza którą cechę INVEST?",a:["Testable","Negotiable","Estimable","Independent"],w:["Problem to brak mierzalnego kryterium.","Problem to brak mierzalnego kryterium.","Nie chodzi o kolejność."],e:"T – „czy wiemy, kiedy jest skończona?” → np. wyszukanie < 2 s."},{id:"w02-22",q:"Co zrobić z historyjką, której nikt nie umie oszacować (np. moduł fiskalny)?",a:["Spike – rozpoznanie przed szacowaniem","Pominąć ją na zawsze","Oszacować losowo","Podzielić poziomo na warstwy"],w:["Nie pomija się wymagań.","Losowe szacunki są bezwartościowe.","Podział poziomy daje zadania, nie historyjki."],e:"E – Estimable; brak wiedzy → spike (S w SPIDR)."},{id:"w02-23",q:"Którym „C” z 3C są kryteria akceptacji?",a:["Confirmation (trzecie C)","Card","Conversation","Collaboration"],w:["Card – pierwsze C.","Conversation – drugie C.","Nie należy do 3C."],e:"3C (R. Jeffries): Card, Conversation, Confirmation."},{id:"w02-24",q:"Ile kryteriów akceptacji zaleca się na historyjkę?",a:["3–7 (więcej → podziel historyjkę)","1","10–20","Dokładnie 5"],w:["Zwykle za mało.","Za dużo – historyjka do podziału.","Nie ma sztywnej liczby."],e:"3–7 kryteriów; każde sprawdzalne tak/nie; opis zachowania, nie wyglądu ekranu."},{id:"w02-25",q:"Czym różnią się kryteria akceptacji od DoD?",a:["Kryteria – jedna historyjka, CO ma działać; DoD – wszystkie historyjki, JAK DOBRZE zrobione","To to samo","DoD dotyczy jednej historyjki","Kryteria ustala sam zespół"],w:["Różnią się zakresem.","DoD dotyczy wszystkich.","Kryteria – klient z zespołem; DoD – zespół."],e:"Historyjka skończona = spełnia swoje kryteria akceptacji i DoD."},{id:"w02-26",q:"Czy Definition of Ready jest częścią Scrum Guide?",a:["Nie – to praktyka opcjonalna","Tak, obowiązkowa","Tak, zamiast DoD","Tylko w Scrum 2010"],w:["Nie jest w Scrum Guide.","Nie zastępuje DoD.","Nie."],e:"DoR – opcjonalna; za długa lista zamienia się w bramkę z modelu kaskadowego."},{id:"w02-27",q:"DoR to warunki…",a:["Wejścia – historyjkę można zaplanować do iteracji","Wyjścia – historyjka jest ukończona","Zamknięcia projektu","Rekrutacji zespołu"],w:["To DoD.","Nie dotyczy projektu.","Nie dotyczy rekrutacji."],e:"Backlog → DoR → Iteracja → DoD → Przyrost."},{id:"w02-28",q:"Jaka jest hierarchia wymagań wg wykładu?",a:["Epik → historyjka → zadanie techniczne","Zadanie → historyjka → epik","Historyjka → epik → cecha","Cecha → epik → zadanie"],w:["Odwrotnie.","Epik jest najwyżej.","Nie w tej kolejności."],e:"Epik (miesiące, rozmiar koszulkowy), historyjka (iteracja, story points), zadanie (≤ 1 dzień, godziny)."},{id:"w02-29",q:"W jakich jednostkach szacuje się zadania techniczne?",a:["W godzinach","W story points","W rozmiarach koszulkowych","W miesiącach"],w:["Story points – historyjki.","Rozmiar koszulkowy – epiki.","Za duże."],e:"Epik – rozmiar koszulkowy; historyjka – story points; zadanie – godziny."},{id:"w02-30",q:"Jak należy dzielić historyjki?",a:["W pionie – każda przechodzi przez wszystkie warstwy i daje wartość („plaster tortu”)","W poziomie – UI, logika, dane osobno","Według programistów","Alfabetycznie"],w:["Podział poziomy daje zadania techniczne bez wartości.","Nie według osób.","Bez sensu."],e:"Historyjka = plaster tortu; podział na warstwy dopiero na poziomie zadań."},{id:"w02-31",q:"Co oznacza P w SPIDR?",a:["Paths – ścieżki","Priority – priorytet","Points – punkty","Planning – planowanie"],w:["Nie w SPIDR.","Nie w SPIDR.","Nie w SPIDR."],e:"SPIDR (M. Cohn): Spike, Paths, Interfaces, Data, Rules."},{id:"w02-32",q:"Co w grze planistycznej XP decyduje biznes, a co programiści?",a:["Biznes – CO i KIEDY; programiści – ILE kosztuje i JAK","Biznes – JAK; programiści – CO","Wszystko decyduje kierownik","Programiści – priorytety"],w:["Odwrotnie.","Brak takiej roli w grze.","Priorytety ustala klient."],e:"Klient pisze historyjki i ustala kolejność; programiści szacują koszt."},{id:"w02-33",q:"Jak obliczyć budżet wydania w grze planistycznej?",a:["Prędkość × liczba iteracji","Liczba programistów × godziny","Suma rozmiarów koszulkowych","Budżet finansowy / stawka"],w:["Nie w tej technice.","Koszulki dla epików.","To nie budżet w punktach."],e:"Budżet wydania = prędkość × liczba iteracji."},{id:"w02-34",q:"Co oznacza zasada „wczorajszej pogody”?",a:["W kolejnej iteracji planuj tyle punktów, ile zespół faktycznie ukończył w poprzedniej","Planuj zawsze o 20% więcej","Planuj według prognozy kierownika","Nie planuj w deszczowe dni"],w:["Nie zawyżamy.","Opiera się na danych zespołu.","Żart."],e:"„Wczorajsza pogoda” – prędkość z ostatniej iteracji."},{id:"w02-35",q:"Co dzieje się, gdy w iteracji (timeboxie) brakuje czasu?",a:["Zmniejsza się zakres","Wydłuża się iteracja","Obniża się jakość","Dodaje się ludzi"],w:["Timebox ma stałą długość.","Jakość jest stała.","Nie to jest odpowiedzią."],e:"Iteracja to timebox – gdy brakuje czasu, zmniejsza się zakres."},{id:"w02-36",q:"Która z czterech reguł prostego projektu (Beck) jest najważniejsza?",a:["Przechodzi wszystkie testy","Wyraża intencję","Nie ma powtórzeń","Ma najmniej elementów"],w:["Druga.","Trzecia (DRY).","Czwarta."],e:"Reguły wg ważności: testy → intencja → brak powtórzeń → najmniej elementów."},{id:"w02-37",q:"Co oznacza YAGNI?",a:["You Aren’t Gonna Need It – nic „na zapas”","Keep It Simple","Don’t Repeat Yourself","Test First"],w:["To KISS.","To DRY.","To praktyka test-first."],e:"YAGNI – nic na zapas; KISS – najprostsze rozwiązanie; DRY – bez powtórzeń."},{id:"w02-38",q:"Jakie role występują w programowaniu w parach?",a:["Kierowca (pisze, taktycznie) i nawigator (przegląda, strategicznie)","Lider i podwładny","Tester i programista","Architekt i analityk"],w:["Role są równorzędne i się zamieniają.","Obaj programują.","Nie te role."],e:"Zamiana ról co kilkadziesiąt minut; ciągły przegląd kodu."},{id:"w02-39",q:"Co mówią badania Cockburna i Williams (2000) o parach?",a:["Para potrzebuje ok. 15% więcej czasu, ale ma ok. 15% mniej defektów","Para jest 2× szybsza","Para potrzebuje 2× więcej czasu","Brak różnicy"],w:["Nie jest szybsza.","Tylko ok. 15% więcej.","Jest różnica w defektach."],e:"~15% więcej czasu, ~15% mniej defektów."},{id:"w02-40",q:"Która metoda stosuje indywidualną własność klas zamiast współwłasności kodu?",a:["FDD","XP","Scrum","Lean"],w:["XP – współwłasność.","Scrum tego nie narzuca.","Lean to zasady."],e:"XP – współwłasność kodu; FDD – właściciele klas."},{id:"w02-41",q:"Ile maksymalnie powinien trwać build z testami w CI wg XP?",a:["≤ 10 minut (Ten-Minute Build)","≤ 1 godzina","≤ 1 dzień","Bez limitu"],w:["Za długo.","To Daily Build, a nie CI.","Jest limit."],e:"Ten-Minute Build; scalanie z gałęzią główną co najmniej raz dziennie; czerwony build – najwyższy priorytet."},{id:"w02-42",q:"Czym różni się CI od Daily Build?",a:["CI scala i testuje każdą zmianę; Daily Build scala raz na dobę","To to samo","Daily Build jest częstszy","CI nie uruchamia testów"],w:["Różnią się częstotliwością.","Odwrotnie.","CI uruchamia testy."],e:"Nocna kompilacja – błędy wychodzą po wielu godzinach."},{id:"w02-43",q:"Jak nazywała się praktyka zrównoważonego tempa w 1. i 2. wydaniu XP?",a:["„40-godzinny tydzień” → „Energized Work”","„Crunch time” → „Overtime”","„Sprint” → „Marathon”","„Daily” → „Weekly”"],w:["XP jest przeciw nadgodzinom.","Nie.","Nie."],e:"Zasada Becka: nie dwa tygodnie nadgodzin z rzędu."},{id:"w02-44",q:"Co utrudnia stosowanie XP?",a:["Stała cena i stały zakres w umowie","Zmieniające się wymagania","Mały zespół","Klient dostępny na co dzień"],w:["To sprzyja XP.","To sprzyja XP.","To sprzyja XP."],e:"Utrudnia: duże rozproszone zespoły, fixed price/scope, brak klienta, długi cykl testów, kultura nadgodzin."},{id:"w02-45",q:"Jaki szablon nazwy ma cecha (feature) w FDD?",a:["<akcja> <rezultat> <obiekt>, np. „Oblicz wartość zlecenia”","Jako <rola> chcę <cel>","Given–When–Then","<obiekt>.<metoda>()"],w:["To historyjka.","To BDD.","To nie szablon FDD."],e:"Cecha: wartość dla klienta, implementacja maks. 2 tygodnie."},{id:"w02-46",q:"Które procesy FDD wykonuje się raz na początku projektu?",a:["1–3: model ogólny, lista cech, planowanie wg cech","4–5: projektowanie i budowa cechy","Tylko proces 5","Wszystkie iteracyjnie"],w:["Te są iteracyjne (dla każdej cechy).","Nie.","1–3 raz na początku."],e:"Raz: model, lista cech, plan. Iteracyjnie: projektowanie cechy, budowa cechy."},{id:"w02-47",q:"Jaki jest główny mechanizm jakości w FDD?",a:["Obowiązkowe inspekcje (przeglądy)","Programowanie w parach","TDD","Retrospektywy"],w:["To XP.","To technika XP.","To Scrum."],e:"Inspekcje projektu i kodu są obowiązkowe."},{id:"w02-48",q:"Jaką wagę ma kamień milowy „Kod” w śledzeniu postępu FDD?",a:["40%","10%","1%","3%"],w:["10% – inspekcja kodu.","1% – przegląd domeny i włączenie do wersji.","3% – inspekcja projektu."],e:"Wagi: przegląd domeny 1%, projekt 40%, inspekcja projektu 3%, kod 40%, inspekcja kodu 10%, włączenie 1%."},{id:"w02-49",q:"Ile procent ukończenia ma cecha po projekcie i inspekcji projektu (FDD)?",a:["44%","40%","41%","50%"],w:["Bez przeglądu domeny i inspekcji.","Brak inspekcji (3%).","To nie ta suma."],e:"1% (przegląd domeny) + 40% (projekt) + 3% (inspekcja projektu) = 44%."},{id:"w02-50",q:"Jak nazywa się raport FDD pokazujący stan zbiorów cech kolorami?",a:["Parking lot","Burndown","Gantt","Kanban board"],w:["Wykres spalania – Scrum/XP.","Harmonogram.","Tablica przepływu."],e:"Raport „parking lot” – kierownictwo widzi postęp bez szczegółów technicznych."},{id:"w02-51",q:"Skąd wywodzi się Lean?",a:["Z Toyota Production System (T. Ohno)","Z projektu Chrysler C3","Z konsorcjum DSDM","Z PMI"],w:["To XP.","To DSDM.","PMI to PMBOK."],e:"TPS (1950–70) → Womack, Jones, Roos → M. i T. Poppendieck (Lean SD)."},{id:"w02-52",q:"Czym jest Lean wg wykładu?",a:["Zbiorem zasad, nie procesem – narzędziem jest m.in. Kanban","Procesem z rolami","Frameworkiem jak Scrum","Standardem ISO"],w:["Nie ma ról.","To zasady.","To nie ISO."],e:"Wartość, przepływ, ciągłe doskonalenie (kaizen)."},{id:"w02-53",q:"Co oznacza zasada Lean „Odkładaj decyzje” (Defer Commitment)?",a:["Nieodwracalne decyzje podejmuj w ostatnim odpowiedzialnym momencie","Nie podejmuj żadnych decyzji","Decyzje podejmuje tylko klient","Odkładaj wydania"],w:["Decyzje się podejmuje – później.","Zespół jest upodmiotowiony.","„Dostarczaj szybko”."],e:"7 zasad: eliminuj straty, wbudowana jakość, tworzenie wiedzy, odkładaj decyzje, dostarczaj szybko, szacunek, optymalizuj całość."},{id:"w02-54",q:"Czemu w oprogramowaniu odpowiadają „zapasy” z produkcji (marnotrawstwo Lean)?",a:["Praca częściowo wykonana (kod niezintegrowany, niewdrożony)","Zbędne funkcje","Przekazania","Przełączanie zadań"],w:["To nadprodukcja.","To transport.","To ruch."],e:"Zapasy → praca częściowo wykonana; nadprodukcja → zbędne funkcje; transport → przekazania; ruch → przełączanie."},{id:"w02-55",q:"Praca nad 3 projektami naraz to który rodzaj marnotrawstwa?",a:["Przełączanie zadań (ruch)","Oczekiwanie","Defekty","Ponowne uczenie się"],w:["Oczekiwanie – czekanie na decyzję.","Defekty – błędy.","Utracona wiedza."],e:"Ruch → przełączanie zadań."},{id:"w02-56",q:"Co jest stałe w DSDM?",a:["Czas, koszt i jakość – zmienia się zakres","Zakres","Tylko koszt","Nic"],w:["Zakres się zmienia (MoSCoW).","Także czas i jakość.","Trzy elementy są stałe."],e:"DSDM: ustalone czas, koszt, jakość; zmienia się zakres."},{id:"w02-57",q:"Która z zasad DSDM mówi o jakości?",a:["Nigdy nie idź na kompromis z jakością","Dostarczaj na czas","Współpracuj","Wykazuj kontrolę"],w:["Inna zasada.","Inna zasada.","Inna zasada."],e:"8 zasad DSDM: potrzeba biznesowa, na czas, współpraca, jakość, przyrostowo, iteracyjnie, komunikacja, kontrola."},{id:"w02-58",q:"Co oznacza W w MoSCoW?",a:["Won’t have this time – świadomie poza zakresem tego wydania","Would have","Wish list","Waiting"],w:["Nie w DSDM.","Nie.","Nie."],e:"Must, Should, Could, Won’t have this time."},{id:"w02-59",q:"Z czego rezygnujemy najpierw, gdy w timeboxie DSDM brakuje czasu?",a:["Z Could have","Z Must have","Ze Should have","Z jakości"],w:["Must dostarczamy zawsze.","Should – dopiero w drugiej kolejności.","Jakość jest stała."],e:"Najpierw Could, w razie potrzeby Should; Must zawsze."},{id:"w02-60",q:"Jaki maksymalny udział nakładu mogą mieć wymagania Must w DSDM?",a:["≤ 60%","≤ 20%","≤ 80%","100%"],w:["≈ 20% to Could.","Za dużo.","Za dużo – brak bufora."],e:"Must ≤ 60%, Could ≈ 20% (bufor)."},{id:"w02-61",q:"Jaka jest kolejność faz DSDM?",a:["Przed projektem → Wykonalność → Podstawy → Wytwarzanie ewolucyjne → Wdrożenie → Po projekcie","Podstawy → Wykonalność → Wdrożenie","Wytwarzanie → Wykonalność → Podstawy","Identyfikacja → Realizacja → Ukończenie"],w:["Wykonalność jest przed podstawami.","Zła kolejność.","To klasyczne etapy."],e:"Wykonalność: czy warto i czy się da; Podstawy: „wystarczająco”, nie wszystko z góry."},{id:"w02-62",q:"Jak długo trwa typowy timebox w DSDM?",a:["2–4 tygodnie","1 dzień","3–6 miesięcy","1 rok"],w:["Za krótko.","Za długo.","Za długo."],e:"Timebox: kick-off, badanie, doskonalenie, konsolidacja, zamknięcie."},{id:"w02-63",q:"Która rola DSDM ma najwyższą moc decyzyjną i zapewnia finansowanie?",a:["Sponsor biznesowy","Wizjoner biznesowy","Ambasador biznesu","Koordynator techniczny"],w:["Wizjoner – cele biznesowe.","Ambasador – codzienne decyzje w zespole.","Koordynator – architektura."],e:"Sponsor biznesowy – finansowanie i zasoby."},{id:"w02-64",q:"Jaka miara postępu jest typowa dla PM w FDD?",a:["% ukończenia cech","Prędkość zespołu","Czas przepływu","Terminowość timeboxów"],w:["To XP.","To Lean.","To DSDM."],e:"XP – prędkość; FDD – % cech; Lean – czas przepływu; DSDM – terminowość timeboxów."},{id:"w02-65",q:"Na tablicy zadań kolumna „W toku” ma limit WIP 2 i jest pełna. Co robi para, która skończyła zadanie?",a:["Pomaga domknąć zadania w toku lub testy, zanim weźmie nowe","Bierze nowe zadanie z „Do zrobienia”","Zwiększa limit WIP","Czeka bezczynnie"],w:["Limit WIP to blokuje.","Limitów się nie łamie doraźnie.","Może pomagać innym."],e:"Limit WIP – najpierw kończ, potem zaczynaj."}],Cp={id:hp,title:bp,questions:Sp},Tp="w03",Pp="W2b · Jakość: ISO, testy, TDD, refaktoryzacja, dług techniczny",vp=[{id:"w03-01",q:"Kto sformułował „hipotezę wytrzymałości projektu” (Design Stamina Hypothesis)?",a:["M. Fowler (2007)","K. Beck","S. McConnell","W. Cunningham"],w:["Beck – XP, TDD.","McConnell – Code Complete.","Cunningham – dług techniczny."],e:"Bez dbałości o jakość po punkcie zwrotnym liczba dostarczanych funkcji spada."},{id:"w03-02",q:"Która cecha słabej jakości kodu wymieniona jest na wykładzie?",a:["Jest trudna i kosztowna do wykrycia – klient jej nie widzi","Zawsze powoduje awarie","Przyspiesza rozwój","Jest łatwa do wykrycia"],w:["Nie zawsze – często działa.","Spowalnia rozwój.","Odwrotnie."],e:"Słaba jakość narasta przy zmianach ad hoc pod presją czasu."},{id:"w03-03",q:"Ile zasad jakości ma ISO 9000:2015?",a:["7","5","8","10"],w:["Za mało.","8 to zasady DSDM.","10 to obszary PMBOK 6."],e:"Orientacja na klienta, przywództwo, zaangażowanie ludzi, podejście procesowe, doskonalenie, decyzje na podstawie dowodów, zarządzanie relacjami."},{id:"w03-04",q:"Która praktyka zwinna odpowiada zasadzie ISO 9000 „Doskonalenie” (PDCA)?",a:["Retrospektywa po każdej iteracji","Klient w zespole","Tablica i limit WIP","Lider służebny"],w:["To orientacja na klienta.","To podejście procesowe.","To przywództwo."],e:"Doskonalenie – ciągłe ulepszanie (PDCA) → retrospektywa."},{id:"w03-05",q:"Ile charakterystyk jakości ma model ISO/IEC 25010:2023?",a:["9","8","6","12"],w:["8 miała wersja 2011.","Za mało.","Za dużo."],e:"2023: przydatność funkcjonalna, wydajność, kompatybilność, zdolność interakcji, niezawodność, bezpieczeństwo, utrzymywalność, elastyczność, bezpieczeństwo użytkowania (safety)."},{id:"w03-06",q:"Jak w ISO 25010:2023 nazywa się dawna „użyteczność”?",a:["Zdolność interakcji","Elastyczność","Przydatność funkcjonalna","Kompatybilność"],w:["Elastyczność to dawna przenośność.","To inna charakterystyka.","To inna charakterystyka."],e:"Zmiany 2023: użyteczność → zdolność interakcji; przenośność → elastyczność; nowa – safety."},{id:"w03-07",q:"Która charakterystyka jest NOWA w ISO 25010:2023?",a:["Bezpieczeństwo użytkowania (safety)","Bezpieczeństwo (security)","Niezawodność","Wydajność"],w:["Security była wcześniej.","Była wcześniej.","Była wcześniej."],e:"Safety: ograniczenia, wykrywanie zagrożeń, bezpieczne awarie."},{id:"w03-08",q:"Do której charakterystyki ISO 25010 należy testowalność i modyfikowalność?",a:["Utrzymywalność","Niezawodność","Elastyczność","Przydatność funkcjonalna"],w:["Niezawodność – dostępność, tolerancja błędów.","Elastyczność – adaptowalność, skalowalność.","Funkcjonalna – kompletność, poprawność."],e:"Utrzymywalność: modułowość, ponowne użycie, analizowalność, modyfikowalność, testowalność."},{id:"w03-09",q:"Pralnia: „awaria drukarki nie blokuje przyjęcia zlecenia”. Którą charakterystykę ISO 25010 to dotyczy?",a:["Niezawodność","Wydajność","Kompatybilność","Zdolność interakcji"],w:["Wydajność – czas odpowiedzi.","Kompatybilność – współpraca z innymi systemami.","Zdolność interakcji – obsługa przez użytkownika."],e:"Niezawodność – wydruk do kolejki, ponowienie."},{id:"w03-10",q:"Jaka jest maksymalna typowa skuteczność wykrywania defektów pojedynczej metody wg McConnella?",a:["ok. 75%","ok. 95%","ok. 30%","100%"],w:["Żadna metoda tego nie osiąga.","Wiele metod przekracza 30%.","Niemożliwe."],e:"Żadna metoda nie przekracza ok. 75% → łącz metody; przegląd jest tańszy niż test."},{id:"w03-11",q:"Jaki wniosek płynie z danych o wykrywaniu defektów?",a:["Łącz metody; przegląd jest tańszy niż test","Wystarczą testy jednostkowe","Wystarczą testy beta","Inspekcje są bezużyteczne"],w:["Jedna metoda nie wystarcza.","Jedna metoda nie wystarcza.","Formalne inspekcje są skuteczne."],e:"W praktyce zwinnej: para = ciągły przegląd; PR = przegląd; CI = testy przy scaleniu."},{id:"w03-12",q:"Jaki jest typowy udział testów jednostkowych w piramidzie testów?",a:["ok. 70%","ok. 10%","ok. 20%","ok. 50%"],w:["10% – UI/E2E.","20% – integracyjne.","Nie ta proporcja."],e:"Piramida: jednostkowe ~70%, integracyjne ~20%, UI/E2E ~10%."},{id:"w03-13",q:"Czym jest antywzorzec „rożek lodów”?",a:["Dużo ręcznych testów UI, mało jednostkowych → wolno i drogo","Dużo testów jednostkowych","Brak testów UI","Testy tylko w CI"],w:["To zdrowa piramida.","To nie jest antywzorzec z wykładu.","To dobra praktyka."],e:"Odwrócona piramida – informacja zwrotna za późno."},{id:"w03-14",q:"Co mówi wykład o pokryciu kodu?",a:["To miara pomocnicza: niskie wskazuje luki, wysokie nie gwarantuje dobrych testów","100% gwarantuje brak błędów","Jest bezużyteczne","Jest jedynym kryterium jakości"],w:["Nie gwarantuje.","Pomaga znaleźć luki.","Nie jedynym."],e:"Pokrycie – miara pomocnicza."},{id:"w03-15",q:"Reguła rabatu: < 100 zł – 0%, 100–499,99 zł – 5%, ≥ 500 zł – 10%. Które wartości to wartości graniczne?",a:["−0,01 · 0 · 99,99 · 100 · 499,99 · 500","−5 · 50 · 250 · 800","1 · 2 · 3","120 zł"],w:["To klasy równoważności (po jednym na klasę).","Losowe.","To typowe „dobre dane”."],e:"Na krańcach przedziałów najczęściej błąd < zamiast ≤."},{id:"w03-16",q:"Ile testów wystarcza dla klas równoważności w regule rabatu (4 klasy: ujemne, 0%, 5%, 10%)?",a:["4 – po jednym na klasę","1","Wszystkie możliwe wartości","100"],w:["Nie pokryje klas.","Niemożliwe.","Zbędne."],e:"Np. −5 · 50 · 250 · 800 zł."},{id:"w03-17",q:"Jaka jest minimalna liczba testów w testowaniu bazowym?",a:["Równa złożoności cyklomatycznej","Równa liczbie linii kodu","Zawsze 1","Równa liczbie klas"],w:["Nie.","Każda gałąź co najmniej raz.","Nie."],e:"Każda gałąź co najmniej raz: min. testów = złożoność cyklomatyczna."},{id:"w03-18",q:"Czym jest TDD wg wykładu?",a:["Techniką programisty (nie metodyką projektu), rozwinięciem test-first z XP","Metodyką zarządzania projektem","Rodzajem testów beta","Narzędziem CI"],w:["Nie metodyka.","To nie testy beta.","To nie narzędzie."],e:"TDD: RED → GREEN → REFACTOR (K. Beck, 2002)."},{id:"w03-19",q:"Jaka jest kolejność cyklu TDD?",a:["RED → GREEN → REFACTOR","GREEN → RED → REFACTOR","REFACTOR → RED → GREEN","CODE → TEST → DEPLOY"],w:["Najpierw czerwony test.","Refaktoryzacja na końcu.","To nie TDD."],e:"Najpierw test, który nie przechodzi, potem minimalny kod, potem porządkowanie."},{id:"w03-20",q:"Które z praw TDD (R. C. Martin) jest poprawne?",a:["Kod produkcyjny tylko na tyle, by test przeszedł","Pisz cały kod, potem testy","Testy pisz po wdrożeniu","Test może przejść od razu"],w:["To odwrotność TDD.","Najpierw test.","Test musi najpierw nie przechodzić."],e:"Bez kodu bez czerwonego testu; test tylko na tyle, by nie przeszedł; kod tylko na tyle, by przeszedł."},{id:"w03-21",q:"W przykładzie TDD po pierwszym teście (pusty koszyk = 0) jaki jest minimalny kod GREEN?",a:["public decimal Wartosc() => 0m;","Pełna implementacja z listą pozycji","Brak kodu","throw new NotImplementedException()"],w:["Za dużo – to dopiero REFACTOR po kolejnych testach.","Test nie przejdzie.","Test nie przejdzie."],e:"GREEN: minimalny kod, by test przeszedł."},{id:"w03-22",q:"Która odmiana „najpierw test” dotyczy testów akceptacyjnych pisanych przez klienta z zespołem?",a:["ATDD","TDD","BDD","DDD"],w:["TDD – programista, testy jednostkowe.","BDD – zachowanie, Given–When–Then.","DDD to projektowanie dziedzinowe."],e:"ATDD – kryteria akceptacji przed kodem."},{id:"w03-23",q:"Które ograniczenie TDD wymieniono?",a:["Trudniejsze dla UI, baz danych i kodu zastanego","Brak informacji zwrotnej","Brak testów regresyjnych","Gorszy projekt kodu"],w:["Feedback w minutach – zaleta.","Daje testy regresyjne.","Kod testowalny = lepszy projekt."],e:"Ograniczenia: UI/BD/legacy, koszt utrzymania testów, związanie z implementacją."},{id:"w03-24",q:"Co powinien wyjaśniać komentarz wg standardu kodowania?",a:["Dlaczego (a nie co)","Co robi każda linia","Kto napisał kod","Datę zmiany"],w:["Co – powinien mówić kod.","To wie system kontroli wersji.","To wie VCS."],e:"Kod samodokumentujący się; komentarz mówi „dlaczego”."},{id:"w03-25",q:"Czym jest zapach kodu?",a:["Symptomem problemu w strukturze – kod działa, ale trudno go zmienić","Błędem w działaniu programu","Luką bezpieczeństwa","Niską wydajnością"],w:["To nie błąd.","To nie zapach (→ przegląd bezpieczeństwa).","To nie zapach (→ pomiar)."],e:"Zapach to sygnał do refaktoryzacji (M. Fowler)."},{id:"w03-26",q:"Które z poniższych NIE jest zapachem kodu wg wykładu?",a:["Błąd na granicy przedziału","Długa lista parametrów","Magiczna liczba","Zazdrość o funkcje"],w:["To zapach.","To zapach (obsesja typów prostych).","To zapach."],e:"Nie są zapachami: błąd graniczny (→ test), niska wydajność (→ pomiar), luka bezpieczeństwa."},{id:"w03-27",q:"Metoda używa głównie danych innej klasy. Jaki to zapach i jaka refaktoryzacja?",a:["Zazdrość o funkcje → przenieś funkcję","Długa funkcja → wyodrębnij funkcję","Tajemnicza nazwa → zmień nazwę","Chirurgia śrutówką → podziel klasę"],w:["To inny objaw.","To inny objaw.","To inny objaw (zmiana → wiele klas)."],e:"Zazdrość o funkcje (feature envy) → przenieś funkcję tam, gdzie dane."},{id:"w03-28",q:"Jedna zmiana wymusza poprawki w wielu klasach. Jak nazywa się ten zapach?",a:["Chirurgia śrutówką","Spekulatywna ogólność","Powielony kod","Obsesja typów prostych"],w:["Kod na zapas.","Ten sam fragment w wielu miejscach.","status jako int itp."],e:"Chirurgia śrutówką → przenieś funkcje/pola razem."},{id:"w03-29",q:"Jak zrefaktoryzować status zlecenia zapisany jako int 3?",a:["Zastąp typ prosty enum (np. StatusZlecenia.Wydane)","Dodaj komentarz „3 = wydane”","Zmień na double","Usuń status"],w:["Komentarz „dezodorant” – nie leczy.","Nadal typ prosty.","Status jest potrzebny."],e:"Obsesja typów prostych / magiczna liczba → enum lub obiekt."},{id:"w03-30",q:"Czym jest refaktoryzacja?",a:["Zmianą wewnętrznej struktury kodu bez zmiany obserwowalnego zachowania","Naprawą błędów","Dodawaniem funkcji","Optymalizacją wydajności"],w:["Naprawa zmienia zachowanie.","To nie refaktoryzacja.","To nie refaktoryzacja."],e:"Nie jest też przepisaniem od zera ani osobnym etapem projektu."},{id:"w03-31",q:"Co mówi reguła trzech w refaktoryzacji?",a:["Za trzecim powtórzeniem wyodrębnij kod","Refaktoryzuj co trzy iteracje","Maksymalnie trzy refaktoryzacje dziennie","Trzy osoby zatwierdzają refaktoryzację"],w:["Nie chodzi o iteracje.","Brak takiego limitu.","Nie."],e:"Kiedy: przed dodaniem funkcji, gdy kod trudny, za 3. powtórzeniem, na przeglądzie, krok REFACTOR."},{id:"w03-32",q:"Co oznaczają „dwa kapelusze” Becka?",a:["Albo dodajesz funkcję, albo refaktoryzujesz – nigdy naraz","Programista i tester w jednej osobie","Kierowca i nawigator","Kod i testy"],w:["Nie o rolach.","To pary.","Nie."],e:"Reguła skauta: zostaw kod czystszym, niż go zastałeś."},{id:"w03-33",q:"Co zrobić, gdy po kroku refaktoryzacji testy są czerwone?",a:["Cofnąć ostatni krok","Wyłączyć testy","Kontynuować kolejne kroki","Przepisać system od zera"],w:["Testy pilnują zachowania.","Najpierw powrót do zielonego.","Przepisywanie to ostateczność (strangler fig)."],e:"Bezpieczna refaktoryzacja: mały krok → testy → commit; czerwone → cofnij."},{id:"w03-34",q:"Jak zastąpić bardzo zły system bez przepisywania od zera?",a:["Stopniowa wymiana – wzorzec strangler fig","Big bang rewrite","Usunięcie testów","Zamrożenie kodu"],w:["Właśnie tego się unika.","Testy są potrzebne.","Nie rozwiązuje problemu."],e:"Strangler fig – nowy kod przejmuje kolejne funkcje starego."},{id:"w03-35",q:"Kto wprowadził pojęcie długu technicznego?",a:["W. Cunningham (1992)","M. Fowler","K. Beck","R. C. Martin"],w:["Fowler – kwadrant długu (2009).","Beck – XP.","Martin – Czysty kod."],e:"Uproszczenie = pożyczka; odsetki = wolniejszy rozwój; spłata = refaktoryzacja."},{id:"w03-36",q:"„Wydajemy teraz, spłacimy w kolejnej iteracji” – jaki to dług wg kwadrantu Fowlera?",a:["Świadomy i rozważny","Świadomy i lekkomyślny","Nieświadomy i lekkomyślny","Nieświadomy i rozważny"],w:["„Nie mamy czasu na projektowanie”.","„Co to są warstwy?”.","„Teraz wiemy, jak należało to zrobić”."],e:"Kwadrant: lekkomyślny/rozważny × świadomy/nieświadomy."},{id:"w03-37",q:"„Teraz wiemy, jak należało to zrobić” – jaki to dług?",a:["Nieświadomy i rozważny","Świadomy i rozważny","Świadomy i lekkomyślny","Nieświadomy i lekkomyślny"],w:["Świadomy rozważny – „spłacimy w kolejnej iteracji”.","„Nie mamy czasu na projektowanie”.","„Co to są warstwy?”."],e:"Wiedza przychodzi z czasem – dług rozważny, ale nieświadomy w chwili zaciągania."},{id:"w03-38",q:"Jak zarządzać długiem technicznym wg wykładu?",a:["Widoczny w backlogu z kosztem, stała część pojemności iteracji na spłatę","Ignorować do końca projektu","Spłacać tylko po wdrożeniu","Ukrywać przed klientem"],w:["Odsetki rosną.","Za późno.","Ma być widoczny."],e:"DoD i przeglądy hamu
