12-02",s:"a",q:"Który moduł trzeba zaimportować, aby korzystać z getRecord i updateRecord?",a:["lightning/uiRecordApi","lwc","@salesforce/apex","c/pubsub"],e:"Konieczny jest import modułu lightning/uiRecordApi."},{id:"w12-03",s:"a",q:"Jakich elementów LDS używa się do odczytu i aktualizacji rekordu?",a:["@wire(getRecord) i updateRecord()","getAccounts() i insert","publish() i subscribe()","fetch() i XMLHttpRequest"],e:"LDS: @wire(getRecord, …) do odczytu i updateRecord() do aktualizacji."},{id:"w12-04",s:"a",q:"Jak zaimportować referencję do pola Account.Name w LWC?",a:["import NAME_FIELD from '@salesforce/schema/Account.Name';","import NAME_FIELD from 'lightning/uiRecordApi/Account.Name';","import { Name } from 'Account';","const NAME_FIELD = 'SELECT Name FROM Account';"],e:"Pola importuje się ze schematu: '@salesforce/schema/Account.Name'."},{id:"w12-05",s:"a",q:"Co oznacza '$recordId' w @wire(getRecord, { recordId: '$recordId', … })?",a:["Reaktywny parametr: wartość właściwości recordId; zmiana wywołuje ponowne pobranie","Literał tekstowy '$recordId'","Zmienną środowiskową","Identyfikator Org-a"],e:"Prefiks $ oznacza reaktywną właściwość. Przy zmianie recordId dane są automatycznie pobierane ponownie."},{id:"w12-06",s:"b",q:"Jak zaimportować metodę Apex getAccounts z klasy AccountController?",a:["import getAccounts from '@salesforce/apex/AccountController.getAccounts';","import { getAccounts } from 'c/AccountController';","import getAccounts from 'lightning/uiRecordApi';","require('AccountController').getAccounts"],e:"import getAccounts from '@salesforce/apex/AccountController.getAccounts';"},{id:"w12-07",s:"b",q:"Jaką zaletę ma imperatywne wywołanie metod Apex?",a:["Daje pełną kontrolę, np. wywołanie po kliknięciu przycisku, w warunkach, pętlach","Automatycznie odświeża dane przy zmianie parametrów","Nie wymaga importu","Działa bez Apex"],e:"Imperatywne wywołanie daje pełną kontrolę (przyciski, warunki, pętle). Automatyczne odświeżanie daje @wire."},{id:"w12-08",s:"b",q:"Jak obsługuje się wynik imperatywnego wywołania Apex z LWC?",a:["Jako Promise: .then(result => …).catch(error => …)","Przez callback onsuccess","Synchronicznie: const r = getAccounts()","Przez Trigger.new"],e:"getAccounts({ industry: 'IT' }).then(result => {…}).catch(error => {…})."},{id:"w12-09",s:"b",q:"Jaki jest przepływ danych przy imperatywnym wywołaniu Apex z LWC?",a:["LWC → Apex → SOQL → Salesforce (Platforma) → LWC","LWC → SOQL → LWC","Apex → LWC → SOQL","LWC → SQL → Baza danych → LWC"],e:"Przy imperatywnym wywołaniu dane płyną tak: LWC wywołuje Apex, Apex wykonuje zapytanie SOQL do platformy Salesforce, a wynik wraca do LWC."},{id:"w12-10",s:"b",q:"Czym charakteryzuje się reaktywne wywołanie Apex przez @wire?",a:["Automatycznie odświeża dane przy zmianie parametrów","Wymaga ręcznego wywołania w handlerze kliknięcia","Nie może przyjmować parametrów","Działa tylko z LDS"],e:"@wire daje automatyczne odświeżanie danych przy zmianie parametrów (np. '$industry')."},{id:"w12-11",s:"b",q:"Co otrzymuje funkcja dekorowana @wire, np. wiredAccounts(…)?",a:["Obiekt z polami data i error","Tylko listę rekordów","Obiekt event","Promise"],e:"wiredAccounts({ data, error }) { if (data) …; else if (error) …; }"},{id:"w12-12",s:"c",q:"Która praktyka dotyczy architektury komponentów?",a:["Jeden cel = jeden komponent","Jak najgłębsze zagnieżdżanie komponentów","Jeden duży komponent na całą stronę","Logika w CSS"],e:"Architektura: komponenty modularne, jeden cel = jeden komponent, unikanie zagnieżdżania."},{id:"w12-13",s:"c",q:"Dlaczego należy unikać głębokiego zagnieżdżania komponentów?",a:["Zbyt głęboka hierarchia DOM spowalnia renderowanie","Bo LWC nie pozwala na zagnieżdżanie","Bo powoduje błędy Apex","Bo zwiększa limity SOQL"],e:"Utrzymuj płaską strukturę DOM, bo zbyt głęboka hierarchia spowalnia renderowanie."},{id:"w12-14",s:"c",q:"Dlaczego warto używać LDS tam, gdzie to możliwe?",a:["Jest szybsze i bezpieczniejsze niż Apex","Bo Apex jest przestarzały","Bo LDS nie ma limitów","Bo LDS pozwala na SQL"],e:"Używaj Lightning Data Service tam, gdzie to możliwe, bo jest szybsze i bezpieczniejsze niż Apex."},{id:"w12-15",s:"c",q:"Co należy zrobić, jeśli trzeba użyć Apex z LWC?",a:["Czyścić dane i walidować wejście","Wyłączyć Locker Service","Używać without sharing","Przekazywać dane wrażliwe w zdarzeniach"],e:"Jeśli musisz użyć Apex, czyść dane i waliduj wejście."},{id:"w12-16",s:"d",q:"Czego NIE należy przekazywać przez zdarzenia (events) ani Pub/Sub?",a:["Danych wrażliwych","Identyfikatorów rekordów","Komunikatów tekstowych","Nazw pól"],e:"Nie przekazuj danych wrażliwych przez zdarzenia (events) lub Pub/Sub."},{id:"w12-17",s:"c",q:"Czego używać do komunikacji między stronami wg dobrych praktyk?",a:["Lightning Message Service","@api","CustomEvent","localStorage"],e:"Do komunikacji między stronami używaj Lightning Message Service."},{id:"w12-18",s:"e",q:"Jak włączyć caching dla @wire?",a:["@wire(..., { cacheable: true })","@wire.cache()","@track(cache)","import cache from 'lwc'"],e:"Wydajność: włącz caching @wire(…, { cacheable: true })."},{id:"w12-19",s:"e",q:"Co oznacza 'minimalizuj DOM reflow' w praktyce?",a:["Nie aktualizuj UI w pętli","Nie używaj CSS","Nie używaj @wire","Zawsze przeładowuj stronę"],e:"Minimalizuj DOM reflow, czyli nie aktualizuj UI w pętli."},{id:"w12-20",s:"e",q:"Kiedy stosować @track lub reaktywne właściwości $?",a:["Tylko tam, gdzie to konieczne","Zawsze, dla każdej właściwości","Nigdy","Tylko w Apex"],e:"Używaj @track lub reaktywnych właściwości $ tylko tam, gdzie to konieczne."},{id:"w12-21",s:"e",q:"Co stosować dla dużych danych lub komponentów (wydajność)?",a:["Lazy loading","Eager loading wszystkiego na starcie","Synchroniczne pętle","eval()"],e:"Stosuj lazy loading dla dużych danych lub komponentów."},{id:"w12-22",s:"e",q:"Jaka konwencja nazewnictwa obowiązuje dla klas i zmiennych?",a:["PascalCase dla klas, camelCase dla zmiennych","camelCase dla klas, PascalCase dla zmiennych","snake_case dla wszystkiego","UPPER_CASE dla klas"],e:"PascalCase dla klas, camelCase dla zmiennych."},{id:"w12-23",s:"e",q:"Których słów kluczowych do deklaracji zmiennych używać w JS LWC?",a:["const i let, nigdy var","Tylko var","var i let","Dowolnych"],e:"W JavaScripcie komponentów LWC używa się const i let, a nigdy var."},{id:"w12-24",s:"e",q:"Czego używać do dokumentowania funkcji w LWC?",a:["JSDoc","Javadoc","ApexDoc","Markdown w HTML"],e:"Używaj JSDoc do opisu funkcji w LWC. Metody Apex też dokumentuj."},{id:"w12-25",s:"d",q:"Czego nigdy nie używać w LWC ze względów bezpieczeństwa?",a:["eval() ani dynamicznego HTML-a","const","@wire","SLDS"],e:"Nigdy nie używaj eval() ani dynamicznego HTML-a."},{id:"w12-26",s:"d",q:"Co należy zrobić z Lightning Locker / Lightning Web Security?",a:["Nie wyłączać (jest automatycznie włączone)","Wyłączyć dla wydajności","Włączyć ręcznie w każdym komponencie","Zastąpić własnym mechanizmem"],e:"Korzystaj z Lightning Locker / LWS, czyli w praktyce nie wyłączaj (automatycznie włączone)."},{id:"w12-27",s:"d",q:"Co oznacza FLS?",a:["Field-Level Security","Flow Logic Service","Full Lightning Support","Filtered List Selection"],e:"Przestrzegaj zasad CRUD/FLS (Field-Level Security)."},{id:"w12-28",s:"d",q:"Jak należy obsługiwać błędy w kodzie LWC/Apex wg dobrych praktyk?",a:["Zawsze: try/catch oraz .catch(error => …)","Ignorować, platforma je obsłuży","Tylko console.log","Tylko w Apex"],e:"Zawsze obsługuj błędy: try/catch, .catch(error => …)."}],xp={id:Rp,title:Lp,sections:Ip,questions:Ep},Op="w13",qp="W13 · Wybrane zagadnienia platformy Salesforce",Wp=[{id:"a",title:"Aplikacje Lightning",text:`**Aplikacja Lightning** to zbiór komponentów i stron wraz z konfiguracją, który tworzy spójne środowisko pracy użytkownika w Org-u. Można ją zbudować w modelu no-code, low-code lub pro-code.

Typy aplikacji: **standardowe** (gotowe, np. Sales, Service), **niestandardowe (Custom)** i **Console App**, która pozwala pracować na wielu rekordach jednocześnie.

Aplikacja ma pięć warstw:
• **nawigacja** (App Launcher / menu) – pasek aplikacji, ikona i nazwa,
• **strony** (Lightning Pages) – widoki, np. strony obiektów i strona główna,
• **komponenty** – elementy interfejsu, standardowe lub niestandardowe (np. LWC),
• **dane**,
• **kontrola dostępu** – kto może używać aplikacji i jakie obiekty i rekordy są dostępne.`},{id:"b",title:"Lightning Experience a Classic",text:"**Salesforce Classic** to starszy interfejs z tradycyjnym układem zakładek i list rekordów oraz ograniczoną personalizacją. **Lightning Experience** ma dynamiczny układ z komponentów, konfigurowalne strony, obsługę LWC i dostęp do nowoczesnych funkcji, w tym Agentforce. Można przełączać się między oboma interfejsami."},{id:"c",title:"Sposoby pracy z Org-iem",text:`Z Org-iem można pracować na dwa sposoby:
• **zdalnie** – przez interfejs webowy Org-a: Setup, Developer Console, Lightning App Builder, Agentforce Vibes,
• **lokalnie** – przez **Salesforce CLI** (aplikację wiersza poleceń instalowaną na komputerze) oraz VS Code z pluginem **Salesforce Extension Pack**.

Lokalnie można edytować pliki i oglądać zasoby statyczne oraz komponenty frontendowe (po instalacji serwera deweloperskiego). Nie można natomiast uruchamiać kodu Apex ani mieć bezpośredniego dostępu do bazy danych, bo kod działa w Org-u.`}],Bp=[{id:"w13-01",s:"a",q:"Czym jest aplikacja Lightning (Lightning App)?",a:["Zbiorem komponentów i stron wraz z konfiguracją, tworzącym spójne środowisko pracy użytkownika w Org-u","Pojedynczym komponentem LWC","Aplikacją mobilną instalowaną z App Store","Klasą Apex z interfejsem"],e:"Lightning App to zbiór komponentów i stron www wraz z konfiguracją, tworzący spójne środowisko pracy użytkownika."},{id:"w13-02",s:"a",q:"W jakim modelu można tworzyć aplikacje Lightning?",a:["No-code, low-code lub pro-code","Tylko pro-code","Tylko no-code","Tylko przez AppExchange"],e:"Aplikacja Lightning jest tworzona w modelu no-code, low-code lub pro-code."},{id:"w13-03",s:"a",q:"Jakie są główne typy aplikacji Lightning?",a:["Standardowe, niestandardowe (Custom), Console App","Publiczne, prywatne, chronione","Mobilne, desktopowe, webowe","Classic, Aura, LWC"],e:"Główne typy: standardowe (np. Sales, Service), niestandardowe (Custom) i Console App."},{id:"w13-04",s:"a",q:"Co wyróżnia Console App?",a:["Umożliwia pracę na wielu rekordach jednocześnie","Działa tylko w terminalu","Jest dostępna tylko dla administratorów","Nie ma interfejsu graficznego"],e:"Console App umożliwia pracę na wielu rekordach jednocześnie."},{id:"w13-05",s:"a",q:"Która warstwa aplikacji Lightning obejmuje pasek aplikacji, ikonę i nazwę widoczną dla użytkownika?",a:["Nawigacja (App Launcher / Menu)","Strony (Lightning Pages)","Komponenty","Kontrola dostępu"],e:"Nawigacja (App Launcher / Menu) to pasek aplikacji, ikona i nazwa aplikacji."},{id:"w13-06",s:"a",q:"Która warstwa aplikacji Lightning obejmuje widoki, np. strony obiektów i strony główne?",a:["Strony (Lightning Pages)","Dane (Salesforce Objects)","Nawigacja","Komponenty"],e:"Strony (Lightning Pages) to widoki składające się na aplikację."},{id:"w13-07",s:"a",q:"Która warstwa określa, kto może korzystać z aplikacji i jakie obiekty i rekordy są dostępne?",a:["Kontrola dostępu","Nawigacja","Strony","Komponenty"],e:"Kontrola dostępu: kto może korzystać z aplikacji oraz jakie obiekty i rekordy są dostępne."},{id:"w13-08",s:"a",q:"Ile warstw aplikacji Lightning wymieniono na wykładzie?",a:["5: nawigacja, strony, komponenty, dane, kontrola dostępu","3: model, widok, kontroler","4: UI, logika, dane, integracja","2: frontend i backend"],e:"Warstwy: Nawigacja, Strony, Komponenty, Dane, Kontrola dostępu."},{id:"w13-09",s:"b",q:"Jaki jest starszy interfejs platformy Salesforce?",a:["Salesforce Classic","Lightning Experience","Experience Cloud","Agentforce Vibes"],e:"Salesforce Classic to starszy interfejs z tradycyjnym układem zakładek i list rekordów oraz ograniczoną personalizacją."},{id:"w13-10",s:"b",q:"Która cecha dotyczy Lightning Experience, a nie Classic?",a:["Obsługa LWC i dostęp do nowoczesnych funkcji, w tym Agentforce","Tradycyjny układ oparty na zakładkach","Ograniczone możliwości personalizacji","Brak konfigurowalnych stron"],e:"Lightning Experience: dynamiczny układ z komponentów, konfigurowalne strony, obsługa LWC, Agentforce."},{id:"w13-11",s:"b",q:"Czy można przełączać się między Lightning Experience a Classic?",a:["Tak","Nie, Classic został usunięty","Tylko w Sandboxie","Tylko przez CLI"],e:"Na slajdach pokazano przełączanie Lightning Experience ⇄ Classic."},{id:"w13-12",s:"c",q:"Jakie są sposoby pracy z Org-iem?",a:["Zdalny (interfejs webowy) i lokalny (Salesforce CLI, VS Code z Salesforce Extension Pack)","Tylko zdalny","Tylko przez aplikację mobilną","Tylko przez SSH"],e:"Zdalny: interfejs webowy Org-a. Lokalny: Salesforce CLI oraz VS Code z Salesforce Extension Pack."},{id:"w13-13",s:"c",q:"Jaki plugin VS Code służy do pracy z Salesforce?",a:["Salesforce Extension Pack","Apex Runner","Lightning Studio","Force IDE"],e:"VS Code z pluginem Salesforce Extension Pack."},{id:"w13-14",s:"c",q:"Czego NIE można zrobić lokalnie przy użyciu Salesforce CLI?",a:["Uruchamiać kodu Apex i uzyskać bezpośredniego dostępu do bazy danych","Edytować plików","Podglądać zasobów statycznych","Podglądać komponentów frontendowych (z serwerem deweloperskim)"],e:"Lokalnie nie można uruchamiać Apex ani mieć bezpośredniego dostępu do bazy, bo kod działa w Org-u."},{id:"w13-15",s:"c",q:"Co jest możliwe lokalnie z Salesforce CLI?",a:["Edycja plików i podgląd komponentów frontendowych (po instalacji serwera deweloperskiego)","Uruchamianie triggerów","Wykonywanie DML na produkcji bez deployu","Bezpośrednie zapytania SQL do bazy Org-a"],e:"Lokalnie: edycja plików, podgląd zasobów statycznych i komponentów frontendowych (z serwerem deweloperskim)."},{id:"w13-16",s:"c",q:"Które narzędzia interfejsu webowego Org-a pokazano na wykładzie?",a:["Setup, Developer Console, Lightning App Builder, Agentforce Vibes","Eclipse, IntelliJ, NetBeans","Workbench, Data Loader, Postman","Jenkins, Git, Docker"],e:"Narzędzia webowe: Setup, Developer Console, Lightning App Builder, Agentforce Vibes."},{id:"w13-17",s:"c",q:"Czym jest Salesforce CLI?",a:["Aplikacją wiersza poleceń instalowaną na komputerze użytkownika","Interfejsem webowym Org-a","Językiem programowania","Typem Org-a"],e:"Salesforce CLI to aplikacja CLI instalowana na komputerze użytkownika (lokalny sposób pracy)."},{id:"w13-18",s:"a",q:"Która warstwa aplikacji Lightning to elementy interfejsu, standardowe lub niestandardowe (np. LWC)?",a:["Komponenty (Lightning Components)","Strony","Dane","Nawigacja"],e:"Komponenty (Lightning Components) to elementy interfejsu, standardowe (Salesforce) lub niestandardowe (np. LWC)."},{id:"w13-19",s:"a",q:"Który przykład to standardowa aplikacja Lightning?",a:["Sales lub Service","Aplikacja utworzona przez dewelopera","Komponent LWC","Trigger Apex"],e:"Standardowe to gotowe aplikacje Salesforce, np. Sales, Service."}],Fp={id:Op,title:qp,sections:Wp,questions:Bp},Kp="w14",Jp="W14 · Automatyzacja i analityka modelu danych",_p=[{id:"a",title:"Automatyzacja na poziomie bazy danych",text:`Automatyka biznesowa na poziomie bazy danych to mechanizmy kontroli poprawności, wyliczania wartości, utrzymania spójności i reagowania na zmiany rekordów. Reguły działają niezależnie od sposobu wprowadzania danych (formularz, API, import). Salesforce nie daje bezpośredniego dostępu do fizycznej bazy ani triggerów SQL. Mechanizmy działają na poziomie platformy. Wykład dzieli je na trzy grupy:
• **kontrola i integralność danych**: Required, Unique, Validation Rules, Duplicate Rules,
• **automatyczne przetwarzanie danych**: Formula Fields i Roll-Up Summary Fields,
• **automatyzacja procesów**: Apex Triggers i Record-Triggered Flow.`},{id:"b",title:"External ID, Required i Unique",text:"Pole **External ID** pozwala identyfikować rekordy na podstawie zewnętrznych identyfikatorów, np. przy integracji i imporcie. Atrybut **Required** wymusza podanie wartości, a **Unique** unikatowość wartości w obrębie obiektu. Przykład: aby każda sala (`Room__c`) miała numer i żadne dwie nie miały tego samego, pole `Number__c` ustawia się jako Required i Unique."},{id:"c",title:"Validation Rules",text:"**Validation Rules** (reguły walidacyjne) określają warunki, które musi spełniać rekord, aby można go było zapisać. Wymuszają informacje, kontrolują zakresy, daty i zależności, blokują zapis i pokazują komunikaty. Nie wyliczają ani nie zapisują wartości pól. Definiuje się je w Setup → Object Manager → (obiekt) → Validation Rules. Przykład: sprawdzenie, że koniec rezerwacji jest po jej rozpoczęciu."},{id:"d",title:"Formula Fields i Roll-Up Summary",text:"**Formula Fields** automatycznie wyliczają wartości na podstawie innych pól, np. czas trwania rezerwacji. **Roll-Up Summary** automatycznie aktualizuje wartość w rekordzie nadrzędnym na podstawie rekordów podrzędnych i działa tylko dla relacji Master-Detail. Dostępne operacje to COUNT, SUM, MIN i MAX (AVG nie ma). Przykład: pole `Number_of_Events__c` w `Room__c` zlicza powiązane rezerwacje `Event__c` (COUNT). Oba typy pól tworzy się w Setup → Object Manager → Fields & Relationships."},{id:"e",title:"Duplicate Management",text:"Zarządzanie duplikatami (Setup → Data → Duplicate Management) korzysta z dwóch elementów: **Matching Rules** (kryterium tożsamości, czyli kiedy rekordy uznać za duplikaty) i **Duplicate Rules** (sposób reakcji). Duplicate Rules mogą zablokować zapis, ostrzec użytkownika albo dopuścić zapis z zarejestrowaniem zdarzenia. Automatycznego scalania rekordów nie ma wśród tych działań. Przykład: dwóch klientów o tym samym NIP-ie obsługują Duplicate Rules."},{id:"f",title:"Apex Trigger i Record-Triggered Flow",text:`**Apex Trigger** stosuje się do reguł obejmujących wiele rekordów, złożonych walidacji między obiektami i niestandardowych operacji niewygodnych we Flow. Przykład: kontrola kolizji czasowych rezerwacji tej samej sali.

**Record-Triggered Flow** uruchamia się przy Create, Update, Create or Update oraz (w odpowiednich konfiguracjach) Delete. Może aktualizować inne rekordy, tworzyć nowe, wysyłać powiadomienia i operować na powiązanych danych, np. zaktualizować rekord sali po utworzeniu rezerwacji, bez kodu. Jest narzędziem automatyzacji platformy, a nie mechanizmem relacyjnej bazy danych.`}],Up=[{id:"w14-01",s:"a",q:"Co obejmuje automatyka biznesowa na poziomie bazy danych (Database-Level Business Automation)?",a:["Mechanizmy automatycznej kontroli poprawności, wyliczania wartości, utrzymania spójności i reagowania na zmiany w rekordach","Budowanie ekranów i formularzy","Administrację serwerem bazy danych","Tworzenie triggerów SQL"],e:"Obejmuje mechanizmy kontroli poprawności, wyliczania wartości, utrzymania spójności i reagowania na zmiany rekordów."},{id:"w14-02",s:"a",q:"Czy reguły automatyki modelu danych działają, gdy dane są modyfikowane przez API lub import?",a:["Tak, działają niezależnie od sposobu wprowadzania danych","Nie, tylko przy formularzu","Tylko przy imporcie","Tylko gdy włączony jest Flow"],e:"Reguły działają niezależnie od tego, czy dane są wprowadzane przez formularz, API, import czy inny proces."},{id:"w14-03",s:"b",q:"Do czego służy pole External ID?",a:["Do identyfikowania rekordów na podstawie zewnętrznych identyfikatorów, np. przy integracji i imporcie","Do szyfrowania danych","Do relacji Master-Detail","Do wyświetlania danych zewnętrznych bez kopii"],e:"External ID pozwala identyfikować rekordy na podstawie zewnętrznych identyfikatorów, np. podczas integracji i importu."},{id:"w14-04",s:"b",q:"Co wymusza atrybut Unique pola?",a:["Unikatowość wartości w obrębie danego obiektu","Podanie wartości","Unikatowość w całym Org-u","Szyfrowanie wartości"],e:"Unique wymusza unikatowość wartości w obrębie danego obiektu. Required wymusza podanie wartości."},{id:"w14-05",s:"b",q:"Jak zagwarantować, że każda sala (Room__c) ma numer i żadne dwie sale nie mają tego samego numeru?",a:["Ustawić pole Number__c jako Required i Unique","Utworzyć pole Formula","Utworzyć Roll-Up Summary","Utworzyć Record-Triggered Flow"],e:"Przykład z wykładu: pole Number__c wymagane (Required) i unikatowe (Unique)."},{id:"w14-06",s:"c",q:"Czym są Validation Rules?",a:["Warunkami, które muszą być spełnione, aby rekord mógł zostać zapisany","Polami wyliczanymi","Regułami wykrywania duplikatów","Uprawnieniami użytkowników"],e:"Reguły walidacyjne określają warunki, które muszą być spełnione, aby rekord mógł zostać zapisany."},{id:"w14-07",s:"c",q:"Czego NIE robią Validation Rules?",a:["Nie wyliczają i nie zapisują wartości pól","Nie kontrolują zakresów wartości","Nie blokują zapisu niepoprawnych rekordów","Nie wyświetlają komunikatów o błędach"],e:"Validation Rules wymuszają informacje, kontrolują zakresy, daty i zależności, blokują zapis i pokazują komunikaty. Wyliczanie to Formula Fields."},{id:"w14-08",s:"c",q:"Gdzie definiuje się Validation Rules?",a:["Setup → Object Manager → Validation Rules","Setup → Data → Duplicate Management","Developer Console → Triggers","App Launcher → Rules"],e:"Validation Rules definiuje się w Setup → Object Manager, po wybraniu obiektu, w sekcji Validation Rules."},{id:"w14-09",s:"c",q:"Który mechanizm wybrać, by sprawdzić, że koniec rezerwacji jest po jej rozpoczęciu?",a:["Validation Rule","Roll-Up Summary","Formula Field","Duplicate Rule"],e:"Do kontroli poprawności danych służy Validation Rule. Przykład z wykładu to sprawdzenie, że koniec rezerwacji jest po jej rozpoczęciu."},{id:"w14-10",s:"d",q:"Do czego służą Formula Fields?",a:["Do automatycznego wyliczania wartości na podstawie innych pól","Do agregowania danych rekordów podrzędnych","Do blokowania zapisu","Do wykrywania duplikatów"],e:"Pola formuł automatycznie wyliczają wartości na podstawie innych pól."},{id:"w14-11",s:"d",q:"Który mechanizm wybrać, by wyliczyć czas trwania rezerwacji?",a:["Formula Field","Roll-Up Summary","Validation Rule","Apex Trigger obowiązkowo"],e:"Formula Fields: automatyczne wyliczanie wartości, np. czasu trwania rezerwacji."},{id:"w14-12",s:"d",q:"Co robią Roll-Up Summary Fields?",a:["Automatycznie aktualizują wartość w rekordzie nadrzędnym na podstawie rekordów podrzędnych","Wyliczają wartość z pól tego samego rekordu","Blokują duplikaty","Wysyłają powiadomienia"],e:"Roll-Up Summary automatycznie aktualizuje wartości w rekordzie nadrzędnym na podstawie powiązanych rekordów podrzędnych."},{id:"w14-13",s:"d",q:"Dla jakiej relacji działa Roll-Up Summary?",a:["Tylko Master-Detail","Tylko Lookup","Master-Detail i Lookup","External Lookup"],e:"Mechanizm działa tylko dla relacji Master-Detail."},{id:"w14-14",s:"d",q:"Jakie operacje oferuje Roll-Up Summary?",a:["COUNT, SUM, MIN, MAX","COUNT, SUM, AVG, MEDIAN","SUM, AVG","COUNT_DISTINCT, AVG"],e:"Dostępne operacje: COUNT, SUM, MIN, MAX. AVG nie ma na liście!"},{id:"w14-15",s:"d",q:"Który mechanizm wybrać, by w Room__c automatycznie zliczać powiązane rezerwacje Event__c?",a:["Roll-Up Summary (COUNT) – Number_of_Events__c","Formula Field","Validation Rule","Duplicate Rule"],e:"Przykład: Room__c.Number_of_Events__c zlicza powiązane rezerwacje Event__c (Roll-Up Summary)."},{id:"w14-16",s:"e",q:"Z jakich elementów korzysta Duplicate Management?",a:["Matching Rules (kryterium tożsamości) i Duplicate Rules (sposób reakcji)","Validation Rules i Formula Fields","Triggers i Flows","Unique i Required"],e:"Matching Rules to kryterium tożsamości, Duplicate Rules to sposób reakcji."},{id:"w14-17",s:"e",q:"Co określają Matching Rules?",a:["Kryterium tożsamości (kiedy rekordy uznać za duplikaty)","Sposób reakcji na duplikat","Warunek zapisu rekordu","Formułę wyliczania"],e:"Matching Rules określają kryterium tożsamości. Duplicate Rules określają reakcję."},{id:"w14-18",s:"e",q:"Które działanie NIE jest dostępną reakcją Duplicate Rules?",a:["Automatyczne scalenie rekordów","Zablokowanie utworzenia duplikatu","Wyświetlenie ostrzeżenia","Dopuszczenie zapisu i zarejestrowanie zdarzenia"],e:"Możliwe działania: blokada, ostrzeżenie, dopuszczenie zapisu z rejestracją zdarzenia."},{id:"w14-19",s:"e",q:"Gdzie konfiguruje się zarządzanie duplikatami?",a:["Setup → Data → Duplicate Management","Setup → Object Manager → Validation Rules","Setup → Object Manager → Fields & Relationships","Developer Console"],e:"Zarządzanie duplikatami konfiguruje się w Setup → Data → Duplicate Management."},{id:"w14-20",s:"e",q:"Który mechanizm wybrać, by system nie pozwalał na dwóch klientów o tym samym NIP?",a:["Duplicate Rules (wykrywanie duplikatów)","Roll-Up Summary","Formula Field","Record-Triggered Flow"],e:"Przykład z wykładu: powtarzający się NIP obsługują Duplicate Rules."},{id:"w14-21",s:"f",q:"Kiedy warto użyć Apex Trigger zamiast narzędzi deklaratywnych?",a:["Przy regułach obejmujących wiele rekordów, złożonych zależnościach i operacjach trudnych do wykonania w Flow","Do prostego wymuszenia wartości pola","Do wyliczenia czasu trwania z dwóch pól","Do zliczania rekordów Master-Detail"],e:"Triggery służą do reguł obejmujących wiele rekordów, złożonych walidacji między obiektami i niestandardowych operacji niewygodnych w Flow."},{id:"w14-22",s:"f",q:"Który mechanizm wybrać do kontroli kolizji czasowych rezerwacji tej samej sali?",a:["Apex Trigger","Formula Field","Unique Field","Roll-Up Summary"],e:"Przykład: system rezerwacji sal sprawdza kolizje czasowe, a to realizuje Apex Trigger."},{id:"w14-23",s:"f",q:"Kiedy może uruchamiać się Record-Triggered Flow?",a:["Przy Create, Update, Create or Update oraz (w odpowiednich konfiguracjach) Delete","Tylko przy Create","Tylko według harmonogramu","Tylko po kliknięciu przycisku"],e:"Record-Triggered Flow: Create, Update, Create or Update, Delete (tylko w odpowiednich konfiguracjach)."},{id:"w14-24",s:"f",q:"Co może robić Record-Triggered Flow?",a:["Aktualizować i tworzyć rekordy, wysyłać powiadomienia, operować na powiązanych danych","Tylko blokować zapis","Tylko wyliczać formuły","Tworzyć triggery SQL"],e:"Flow może aktualizować inne rekordy, tworzyć nowe, wysyłać powiadomienia i operować na powiązanych danych."},{id:"w14-25",s:"f",q:"Czy Record-Triggered Flow jest mechanizmem relacyjnej bazy danych?",a:["Nie, to narzędzie automatyzacji platformy Salesforce","Tak, to trigger SQL","Tak, to procedura składowana","Tak, to widok bazy danych"],e:"Ważne: Record-Triggered Flow jest narzędziem automatyzacji platformy, a nie mechanizmem relacyjnej bazy danych."},{id:"w14-26",s:"a",q:"Czy Salesforce pozwala definiować własne triggery SQL w fizycznej bazie danych?",a:["Nie, mechanizmy działają na poziomie platformy Salesforce","Tak, przez Developer Console","Tak, w Sandboxie","Tak, przez Salesforce CLI"],e:"Salesforce nie udostępnia bezpośredniego dostępu do fizycznej bazy ani triggerów SQL."},{id:"w14-27",s:"a",q:"Które mechanizmy zaliczono do 'kontroli i integralności danych'?",a:["Required, Unique, Validation Rules, Duplicate Rules","Formula Fields, Roll-Up Summary","Apex Triggers, Record-Triggered Flow","LWC, Aura"],e:"Kontrola i integralność: Required, Unique, Validation Rules, Duplicate Rules."},{id:"w14-28",s:"a",q:"Które mechanizmy zaliczono do 'automatycznego przetwarzania danych'?",a:["Formula Fields i Roll-Up Summary Fields","Validation Rules i Duplicate Rules","Apex Triggers i Flow","Required i Unique"],e:"Automatyczne przetwarzanie danych: Formula Fields, Roll-Up Summary Fields."},{id:"w14-29",s:"f",q:"Które mechanizmy zaliczono do 'automatyzacji procesów związanych z danymi'?",a:["Apex Triggers i Record-Triggered Flow","Formula Fields i Roll-Up Summary","Required i Unique","Matching Rules"],e:"Automatyzacja procesów: Apex Triggers, Record-Triggered Flow."},{id:"w14-30",s:"f",q:"Który mechanizm wybrać, by po utworzeniu rezerwacji automatycznie zaktualizować rekord sali (bez kodu)?",a:["Record-Triggered Flow","Validation Rule","Formula Field","Unique Field"],e:"Tabela: Record-Triggered Flow to automatyczne wykonywanie działań, np. aktualizacja powiązanych rekordów."},{id:"w14-31",s:"d",q:"Gdzie tworzy się pola formuł i Roll-Up Summary?",a:["Setup → Object Manager → Fields & Relationships","Setup → Data → Duplicate Management","Setup → Process Automation","Developer Console → Fields"],e:"Pola formuł i Roll-Up Summary tworzy się w Setup → Object Manager → Fields & Relationships."}],Hp={id:Kp,title:Jp,sections:_p,questions:Up},Vp="w15",Zp="W15 · Flow & Flow Builder",Gp=[{id:"a",title:"Czym jest Flow",text:"**Salesforce Flow** to ogólne określenie mechanizmów do deklaratywnej automatyzacji (bez kodu). Obejmuje też m.in. Flow Orchestration i Flow Integration. **Flow Builder** to graficzne narzędzie typu Web IDE do tworzenia i konfigurowania Flow-ów. Pojedynczy Flow ma strukturę przypominającą schemat blokowy, może oddziaływać na dane w Org-u i w systemach zewnętrznych oraz może być uruchamiany ręcznie albo automatycznie (zmiana danych, zdarzenie, harmonogram)."},{id:"b",title:"Ewolucja narzędzi automatyzacji",text:"Narzędzia automatyzacji Salesforce rozwijały się w kolejności: **Workflow Rules** (proste reguły IF–THEN: e-mail, aktualizacja pól, zadania) → **Process Builder** (graficzne, bardziej złożone procesy) → **Flow Builder**. **Approval Processes** obsługują wieloetapowe procesy akceptacji, np. rabatów i wydatków. Aplikacja **Automation** służy do centralnego zarządzania, monitorowania i kontrolowania automatyzacji w Org-u. Listę Flow-ów znajdziesz w Setup → PLATFORM TOOLS → Process Automation → Flows, a „New Flow” otwiera Flow Builder."},{id:"c",title:"Screen Flow",text:"**Screen Flow** to interaktywny proces z formularzami, polami i listami wyboru, obsługiwany przez człowieka lub agenta. Przykłady zastosowania: rejestracja klienta i zgłoszenie serwisowe."},{id:"d",title:"Flow uruchamiany automatycznie",text:`• **Record-Triggered Flow** wykonuje działania przed zapisem rekordu (**Before-Save**) lub po nim (**After-Save**).
• **Schedule-Triggered Flow** uruchamia się według harmonogramu, bez udziału użytkownika, i przetwarza grupę rekordów. Nadaje się np. do przypomnień o terminach, aktualizacji nieaktywnych rekordów i okresowego tworzenia zadań dla pracowników.
• **Platform Event-Triggered Flow** uruchamia się po odebraniu zdarzenia platformowego. Działa asynchronicznie, niezależnie od procesu, który zdarzenie wygenerował.`},{id:"e",title:"Autolaunched Flow",text:"**Autolaunched Flow** działa bez interakcji użytkownika, nie ma ekranów ani własnego wyzwalacza. Uruchamia go inny Flow, kod Apex, REST API, przycisk lub akcja użytkownika. Nadaje się do budowania wielokrotnie wykorzystywanej logiki, wywoływanej np. jako Subflow."},{id:"f",title:"Data Cloud-Triggered Flow",text:"**Data Cloud-Triggered Flow** reaguje na zmiany danych w Salesforce Data 360 (Data Cloud). Przykład: utworzenie Leada po osiągnięciu określonego poziomu zaangażowania klienta. Skróty: **DMO** (Data Model Objects) to obiekty ujednoliconego modelu danych, a **CIO** (Calculated Insight Objects) przechowują wyniki obliczeń i analiz."},{id:"g",title:"Interfejs Flow Buildera",text:"Flow Builder ma trzy obszary: **Toolbox** (przybornik z listą elementów i zasobów utworzonych we Flow, np. zmiennych, formuł i opcji wyboru), **Canvas** (obszar roboczy) i **Button Bar** (pasek przycisków, który pokazuje, czy Flow jest aktywny, znacznik czasu zapisu, wersję, ostrzeżenia i błędy)."},{id:"h",title:"Składniki Flow i elementy interakcji",text:`Flow składa się z trzech składników: **elementów** (węzłów), **łączników (Connectors)**, które określają przebieg, oraz **zasobów (Resources)**, czyli danych niewidocznych na diagramie.

Elementy dzielą się na trzy typy: **Interaction** (interakcja z użytkownikiem: Screen, Action, Subflow), **Logic** (interakcja Flow z samym sobą) i **Data** (interakcja z modelem danych). **Action** wykonuje operację lub wywołuje zewnętrzną funkcję, np. wysyła e-mail lub uruchamia kod Apex. **Subflow** wywołuje inny Flow, przekazuje mu dane wejściowe i odbiera wyniki, co ułatwia modularyzację.`},{id:"i",title:"Elementy Logic",text:`Elementy typu Logic:
• **Decision** – odpowiednik if-else albo switch, z wieloma ścieżkami,
• **Loop** – odpowiednik for albo while, iteruje po kolekcji,
• **Assignment** – przypisuje wartości zmiennym i polom (np. zwiększa liczniki),
• **Split by Date** – dzieli kolekcję według pola typu Date lub Date/Time (np. rezerwacje według dnia rozpoczęcia),
• **Split by Field Value** – grupuje rekordy o takiej samej wartości pola (np. według pokoju lub trenera),
• **Transform** – mapuje pola źródłowe na docelowe i tworzy nową strukturę danych,
• **Collection Filter** – tworzy nową kolekcję z elementów spełniających warunki, bez ponownego pobierania z bazy,
• **Collection Sort** – sortuje kolekcję rosnąco lub malejąco, np. pokoje według pojemności.`},{id:"j",title:"Elementy Data",text:"Operacje na danych wykonują elementy typu **Data**: Get Records, Create Records, Update Records i Delete Records. **Get Records** wyszukuje rekordy według kryteriów (z filtrowaniem i sortowaniem), pobiera jeden rekord lub kolekcję i zapisuje je w zmiennych."},{id:"k",title:"Konektory",text:`Rodzaje łączników (konektorów):
• **Fault Connector** – przekierowuje proces w razie błędu elementu,
• **Wait Connector** – kontynuuje proces po zdarzeniu lub upływie czasu,
• **Go To Connector** – przechodzi do wskazanego elementu w dowolnym miejscu diagramu,
• **Decision Outcome Connector** – wybiera ścieżkę na podstawie wyniku warunku.`},{id:"l",title:"Zasoby (Resources)",text:`**Zasoby** są tymczasowe: ich wartości są przechowywane w pamięci na czas wykonywania danej instancji Flow. Nowy zasób dodaje się przez Toolbox → New Resource, a zarządza się nimi w Toolbox → Manager. Rodzaje zasobów:
• **Constant** – niezmienna wartość używana w całym Flow,
• **Text Template** – szablon tekstowy ze zmiennymi, np. treść e-maila,
• **Stage** – etap procesu wieloetapowego,
• **Picklist Choice Set** – wartości listy wyboru z pola Salesforce,
• **Record Choice Set** – opcje wyboru z rekordów modelu danych,
• **Record** – pojedynczy rekord, **Record Collection** – kolekcja rekordów (np. lista dostępnych pokoi).`},{id:"m",title:"Zmienne globalne Flow",text:`Zmienne globalne:
• **$Record** – rekord, który wyzwolił Record-Triggered Flow,
• **$Record__Prior** – wartości rekordu sprzed aktualizacji,
• **$Label** – dostęp do Custom Labels,
• **$Flow** – informacje o bieżącym przepływie (data uruchomienia, czas wykonania, komunikat błędu),
• **$GlobalConstant** – stałe globalne: True, False, EmptyString, Null.

Zmienne globalne są zasadniczo tylko do odczytu. Niektóre, np. \`$Flow.CurrentStage\`, można modyfikować. Zasoby udostępniane przez elementy: Loop daje bieżący rekord, Decision daje Outcome, Screen wartości z formularza, a Get Records Record lub Record Collection.`},{id:"n",title:"Zapis, aktywacja i uruchamianie Flow",text:"**Save** zapisuje Flow, ale nie można go wtedy uruchomić. **Activate** go uaktywnia, a **Run** uruchamia. **Debug** uruchamia w trybie debugowania. Gotowy Flow można uruchomić na Record Page i App Page, przez Quick Action, przyciski i linki, w Experience Cloud, Utility Bar, List View i Navigation Tab. Nie uruchamia się go w triggerze SQL bazy danych."},{id:"o",title:"Dobre praktyki Flow",text:`Dobre praktyki:
• **Nie umieszczaj operacji na danych w pętli.** Get, Create, Update i Delete Records mają być poza elementem Loop. Dane gromadź w kolekcjach i przetwarzaj zbiorczo.
• Powtarzalną logikę wydzielaj do Autolaunched Flow i wywołuj przez Subflow.
• **Flow Trigger Explorer** analizuje i porządkuje kolejność uruchamiania Record-Triggered Flow dla obiektu.
• Obsługuj błędy: definiuj Fault Paths, waliduj dane wejściowe, pokazuj zrozumiałe komunikaty, rejestruj błędy i powiadamiaj administratora.
• Zamiast modyfikować aktywną wersję, twórz nowe wersje i testuj w Sandboxie.
• Flow wybieraj do standardowych procesów, a Apex do złożonej logiki. Nie buduj rozbudowanego Flow tylko po to, żeby uniknąć kilku linijek kodu. **Invocable Apex** łączy Flow z Apex.
• Używaj czytelnych nazw API, np. \`Create_Room_Flow\`, \`varRoomName\`, \`Get_Available_Rooms\`.
• Przewiduj mechanizm pomijania (bypass), czyli możliwość czasowego wyłączenia wybranych automatyzacji.`}],Qp=[{id:"w15-01",s:"a",q:"Czym jest Salesforce Flow (jako ogólne pojęcie)?",a:["Ogólnym określeniem mechanizmów do tworzenia i uruchamiania automatyzacji metodą deklaratywną (bez kodu)","Językiem programowania automatyzacji","Rodzajem triggera Apex","Biblioteką JS dla LWC"],e:"Salesforce Flow to ogólne określenie mechanizmów deklaratywnej automatyzacji. Obejmuje też m.in. Flow Orchestration i Flow Integration."},{id:"w15-02",s:"a",q:"Czym jest Flow Builder?",a:["Graficznym narzędziem typu Web IDE do tworzenia i konfigurowania Flow-ów","Kompilatorem Apex","Narzędziem CLI","Aplikacją mobilną"],e:"Flow Builder to graficzne narzędzie Web IDE (Web-based Integrated Development Environment)."},{id:"w15-03",s:"a",q:"Czego struktura przypomina pojedynczy Flow?",a:["Schemat blokowy","Tabelę bazy danych","Klasę obiektową","Arkusz kalkulacyjny"],e:"Flow to konfiguracja automatyzacji o strukturze przypominającej schemat blokowy."},{id:"w15-04",s:"a",q:"Czy Flow może oddziaływać na systemy zewnętrzne?",a:["Tak, umożliwia integrację z systemami zewnętrznymi","Nie, tylko na dane w Org-u","Tylko przez Apex","Tylko w Experience Cloud"],e:"Flow może oddziaływać na dane w Org-u i w systemach zewnętrznych."},{id:"w15-05",s:"a",q:"Jak może być uruchamiany Flow?",a:["Manualnie przez użytkownika lub automatycznie przez zmianę danych, zdarzenie lub harmonogram","Tylko manualnie","Tylko przez Apex","Tylko przez harmonogram"],e:"Flow może być uruchamiany manualnie lub automatycznie: przez zmianę danych, zdarzenie lub harmonogram."},{id:"w15-06",s:"b",q:"Jaka była ewolucja narzędzi automatyzacji Salesforce?",a:["Workflow Rules → Process Builder → Flow Builder","Flow Builder → Process Builder → Workflow Rules","Process Builder → Workflow Rules → Flow Builder","Apex → Flow → Workflow"],e:"Narzędzia automatyzacji rozwijały się w kolejności: Workflow Rules, potem Process Builder, a na końcu Flow Builder."},{id:"w15-07",s:"b",q:"Czym były Workflow Rules?",a:["Prostymi regułami typu IF–THEN (e-mail, aktualizacja pól, zadania)","Graficznym narzędziem do złożonych procesów z rozgałęzieniami","Mechanizmem wieloetapowych akceptacji","Językiem skryptowym"],e:"Workflow Rules to proste reguły IF–THEN. Process Builder to graficzne, bardziej złożone procesy."},{id:"w15-08",s:"b",q:"Do czego służą Approval Processes?",a:["Do obsługi wieloetapowych procesów akceptacji (np. rabatów, wydatków)","Do wykrywania duplikatów","Do harmonogramowania zadań","Do tworzenia ekranów"],e:"Approval Processes obsługują wieloetapowe procesy akceptacji, np. zatwierdzanie rabatów, wydatków czy ofert."},{id:"w15-09",s:"b",q:"Do czego służy aplikacja Automation (Automation Lightning App)?",a:["Do centralnego zarządzania, monitorowania i kontrolowania procesów automatyzacji w Org-u","Do pisania kodu Apex","Do tworzenia obiektów","Do zarządzania użytkownikami"],e:"Automation to aplikacja do centralnego zarządzania, monitorowania i kontrolowania automatyzacji (Flows, Flow Logs, Monitor)."},{id:"w15-10",s:"b",q:"Jaka jest ścieżka do listy Flow-ów w Setup?",a:["Setup → PLATFORM TOOLS → Process Automation → Flows","Setup → Object Manager → Flows","Setup → Data → Flows","Setup → Users → Flows"],e:"Listę Flow-ów znajdziesz w Setup → PLATFORM TOOLS → Process Automation → Flows. Przycisk New Flow otwiera Flow Builder."},{id:"w15-11",s:"c",q:"Który rodzaj Flow umożliwia interaktywne procesy z udziałem użytkownika (formularze)?",a:["Screen Flow","Autolaunched Flow","Schedule-Triggered Flow","Platform Event-Triggered Flow"],e:"Screen Flow to interaktywne procesy z formularzami, polami i listami wyboru, obsługiwane przez człowieka lub agenta."},{id:"w15-12",s:"c",q:"Jakie są przykładowe zastosowania Screen Flow?",a:["Rejestracja klienta, zgłoszenie serwisowe","Nocna aktualizacja statusów","Przetwarzanie płatności z systemu zewnętrznego","Reakcja na zmiany w Data Cloud"],e:"Screen Flow: rejestracja klienta, zgłoszenie serwisowe."},{id:"w15-13",s:"d",q:"Kiedy może wykonywać działania Record-Triggered Flow względem zapisu?",a:["Przed zapisem (Before-Save) lub po zapisie (After-Save)","Tylko po zapisie","Tylko przed zapisem","Tylko po usunięciu"],e:"Record-Triggered Flow pozwala wykonywać działania przed zapisem (Before-Save) lub po zapisie (After-Save)."},{id:"w15-14",s:"d",q:"Który rodzaj Flow uruchamia się według harmonogramu i przetwarza grupę rekordów?",a:["Schedule-Triggered Flow","Record-Triggered Flow","Screen Flow","Autolaunched Flow"],e:"Schedule-Triggered Flow uruchamia się w określonym terminie i według harmonogramu, bez interakcji użytkownika."},{id:"w15-15",s:"d",q:"Który Flow nadaje się do okresowego generowania zadań dla pracowników?",a:["Schedule-Triggered Flow","Screen Flow","Platform Event-Triggered Flow","Data Cloud-Triggered Flow"],e:"Schedule-Triggered Flow: przypomnienia o terminach, aktualizacja nieaktywnych rekordów, okresowe zadania."},{id:"w15-16",s:"d",q:"Jak działa Platform Event-Triggered Flow?",a:["Uruchamia się po odebraniu Platform Event i działa asynchronicznie","Uruchamia się po kliknięciu przycisku","Działa synchronicznie z procesem, który wygenerował zdarzenie","Uruchamia się według harmonogramu"],e:"Uruchamia się po odebraniu zdarzenia platformowego. Działa asynchronicznie, niezależnie od procesu, który wygenerował zdarzenie."},{id:"w15-17",s:"e",q:"Który Flow nie obsługuje ekranów i nie ma własnego mechanizmu wyzwalającego?",a:["Autolaunched Flow","Screen Flow","Record-Triggered Flow","Schedule-Triggered Flow"],e:"Autolaunched Flow działa bez interakcji użytkownika, bez ekranów i bez własnego triggera."},{id:"w15-18",s:"e",q:"Czym może być uruchamiany Autolaunched Flow?",a:["Innym Flow, kodem Apex, REST API, przyciskiem lub akcją","Tylko zmianą rekordu","Tylko harmonogramem","Tylko Platform Event"],e:"Autolaunched Flow uruchamia inny Flow, Apex, REST API, przycisk lub akcja użytkownika."},{id:"w15-19",s:"e",q:"Który rodzaj Flow służy do budowania wielokrotnie wykorzystywanych fragmentów logiki?",a:["Autolaunched Flow (wywoływany jako Subflow)","Screen Flow","Schedule-Triggered Flow","Data Cloud-Triggered Flow"],e:"Autolaunched Flow umożliwia budowanie wielokrotnie wykorzystywanej logiki, wywoływanej np. przez Subflow."},{id:"w15-20",s:"f",q:"Na co reaguje Data Cloud-Triggered Flow?",a:["Na zmiany danych w Salesforce Data 360 (Data Cloud)","Na kliknięcia w UI","Na zmiany w kodzie Apex","Na Platform Events"],e:"Data Cloud-Triggered Flow reaguje na zmiany danych w Data 360 (DMO, CIO)."},{id:"w15-21",s:"f",q:"Co oznacza skrót DMO w Data Cloud?",a:["Data Model Objects – obiekty ujednoliconego modelu danych","Dynamic Metadata Objects","Data Migration Operations","Default Model Output"],e:"DMO = Data Model Objects (ujednolicony model danych). CIO = Calculated Insight Objects (wyniki obliczeń i analiz)."},{id:"w15-22",s:"f",q:"Co przechowują Calculated Insight Objects (CIO)?",a:["Wyniki obliczeń i analiz danych","Ujednolicony model danych","Definicje ekranów","Logi Flow"],e:"CIO przechowują wyniki obliczeń i analiz danych."},{id:"w15-23",s:"f",q:"Który Flow wybrać, by utworzyć Lead po osiągnięciu określonego poziomu zaangażowania klienta (dane z Data 360)?",a:["Data Cloud-Triggered Flow","Screen Flow","Schedule-Triggered Flow","Autolaunched Flow"],e:"Przykład z wykładu dla Data Cloud-Triggered Flow."},{id:"w15-24",s:"g",q:"Jakie są trzy obszary interfejsu Flow Builder?",a:["Toolbox, Canvas, Button Bar","Editor, Console, Debugger","Palette, Properties, Outline","Header, Body, Footer"],e:"① Toolbox (przybornik), ② Canvas (obszar roboczy), ③ Button Bar (pasek przycisków)."},{id:"w15-25",s:"g",q:"Co pokazuje Button Bar w Flow Builder?",a:["Czy Flow jest aktywny, znacznik czasu zapisu, wersję, ostrzeżenia i błędy","Listę zmiennych i formuł","Diagram Flow","Listę rekordów"],e:"Button Bar pokazuje informacje o Flow: aktywność, czas zapisu, wersję, ostrzeżenia i błędy."},{id:"w15-26",s:"g",q:"Co zawiera Toolbox w Flow Builder?",a:["Listę elementów i zasobów utworzonych we Flow (zmienne, formuły, opcje wyboru)","Diagram Flow","Przyciski Save i Activate","Logi błędów"],e:"Toolbox to lista elementów i zasobów utworzonych we Flow."},{id:"w15-27",s:"h",q:"Jakie są trzy główne składniki Flow?",a:["Elementy, łączniki (Connectors), zasoby (Resources)","Klasy, metody, pola","Obiekty, pola, rekordy","Ekrany, przyciski, formularze"],e:"Elementy (węzły), łączniki (przebieg) i zasoby (dane, niewidoczne na diagramie)."},{id:"w15-28",s:"h",q:"Które składniki Flow nie są widoczne na diagramie?",a:["Zasoby (Resources)","Elementy","Łączniki","Decyzje"],e:"Zasoby (zmienne, stałe, formuły, szablony, opcje wyboru) nie są widoczne na diagramie."},{id:"w15-29",s:"h",q:"Jakie są trzy typy elementów Flow?",a:["Interaction, Logic, Data","Input, Process, Output","Screen, Action, Loop","Before, After, Async"],e:"Interaction to interakcja z użytkownikiem, Logic to interakcja Flow z samym sobą, Data to interakcja z modelem danych."},{id:"w15-30",s:"h",q:"Do którego typu elementów należą Screen, Action i Subflow?",a:["Interaction","Logic","Data","Resource"],e:"Elementy interakcji: Screen, Action, Subflow."},{id:"w15-31",s:"h",q:"Do czego służy element Action?",a:["Do wykonania operacji lub wywołania zewnętrznej funkcjonalności, np. wysłania e-maila lub kodu Apex","Do przypisania wartości zmiennej","Do podziału kolekcji","Do pobierania rekordów"],e:"Action wykonuje gotowe akcje Salesforce (e-mail, powiadomienia), kod Apex i akcje z pakietów."},{id:"w15-32",s:"h",q:"Do czego służy element Subflow?",a:["Do wywołania innego Flow z poziomu bieżącego przepływu (z przekazaniem danych)","Do zagnieżdżenia pętli","Do wywołania triggera","Do podziału ekranu"],e:"Subflow wywołuje inny Flow, przekazuje dane wejściowe i odbiera wyniki, co ułatwia modularyzację."},{id:"w15-33",s:"i",q:"Który element Flow jest odpowiednikiem if-else / switch?",a:["Decision","Assignment","Loop","Transform"],e:"Decision to odpowiednik if-else albo switch, z wieloma ścieżkami wykonania."},{id:"w15-34",s:"i",q:"Który element Flow jest odpowiednikiem for / while?",a:["Loop","Decision","Collection Sort","Subflow"],e:"Loop to odpowiednik for albo while. Iteruje po kolekcji."},{id:"w15-35",s:"i",q:"Do czego służy element Assignment?",a:["Do przypisywania wartości zmiennym i polom rekordów (np. zwiększanie liczników)","Do przypisania rekordu właścicielowi","Do pobierania rekordów","Do sterowania przebiegiem"],e:"Assignment przypisuje wartości zmiennym i polom, np. ID pokoju do varRoomId."},{id:"w15-36",s:"i",q:"Który element dzieli kolekcję rekordów na grupy wg pola typu Date lub Date/Time?",a:["Split by Date","Split by Field Value","Collection Filter","Collection Sort"],e:"Split by Date dzieli według daty, np. rezerwacje według dnia rozpoczęcia."},{id:"w15-37",s:"i",q:"Który element grupuje rekordy o takich samych wartościach wskazanego pola?",a:["Split by Field Value","Split by Date","Transform","Decision"],e:"Split by Field Value: np. podział rezerwacji według pokoju lub trenera."},{id:"w15-38",s:"i",q:"Do czego służy element Transform?",a:["Do przekształcania danych i tworzenia nowej struktury przez mapowanie pól źródłowych na docelowe","Do sortowania kolekcji","Do filtrowania kolekcji","Do przypisania wartości"],e:"Transform mapuje pola źródłowe na docelowe i tworzy nową strukturę danych."},{id:"w15-39",s:"i",q:"Który element tworzy nową kolekcję z elementów spełniających warunki, bez ponownego pobierania z bazy?",a:["Collection Filter","Get Records","Collection Sort","Split by Field Value"],e:"Collection Filter tworzy nową kolekcję spełniającą warunki, bez ponownego pobierania rekordów."},{id:"w15-40",s:"i",q:"Który element sortuje kolekcję rosnąco lub malejąco wg wybranego pola?",a:["Collection Sort","Collection Filter","Get Records","Transform"],e:"Collection Sort, np. posortowanie pokoi według pojemności."},{id:"w15-41",s:"j",q:"Do którego typu elementów należą Get, Create, Update i Delete Records?",a:["Data","Logic","Interaction","Resource"],e:"Elementy operacji na danych: Get, Create, Update, Delete Records."},{id:"w15-42",s:"j",q:"Co robi element Get Records?",a:["Wyszukuje rekordy wg kryteriów (z filtrowaniem i sortowaniem) i zapisuje je w zmiennych","Tworzy rekordy","Filtruje kolekcję w pamięci","Usuwa rekordy"],e:"Get Records pobiera jeden rekord lub kolekcję i zapisuje je w zmiennych."},{id:"w15-43",s:"k",q:"Który konektor przekierowuje proces w przypadku błędu?",a:["Fault Connector","Standard Connector","Go To Connector","Wait Connector"],e:"Fault Connector to przekierowanie procesu w przypadku błędu elementu."},{id:"w15-44",s:"k",q:"Który konektor kontynuuje proces po zdarzeniu lub upływie czasu?",a:["Wait Connector","Loop Connector","Fault Connector","Decision Outcome Connector"],e:"Wait Connector kontynuuje proces po wystąpieniu zdarzenia lub upływie czasu."},{id:"w15-45",s:"k",q:"Który konektor pozwala przejść do wskazanego elementu, również w innej części diagramu?",a:["Go To Connector","Standard Connector","Loop Connector","Wait Connector"],e:"Go To Connector to przejście do wskazanego elementu w dowolnym miejscu diagramu."},{id:"w15-46",s:"k",q:"Który konektor wybiera ścieżkę na podstawie wyniku warunku (True/False)?",a:["Decision Outcome Connector","Standard Connector","Fault Connector","Go To Connector"],e:"Decision Outcome Connector wybiera ścieżkę na podstawie wyniku warunku."},{id:"w15-47",s:"l",q:"Jaki charakter mają zasoby (Resources) Flow?",a:["Tymczasowy – wartości przechowywane w pamięci na czas wykonywania instancji Flow","Trwały – zapisywane w bazie danych","Globalny dla całego Org-a","Przechowywane w ciasteczkach"],e:"Zasoby są tymczasowe: wartości przechowywane w pamięci na czas wykonywania danej instancji Flow."},{id:"w15-48",s:"l",q:"Jak dodać nowy zasób we Flow Builder?",a:["Toolbox → New Resource","Canvas → ⨁ → Resource","Setup → Resources","Button Bar → Add"],e:"Nowy zasób dodaje się przez Toolbox → New Resource. Za t błędu","Listę wszystkich Flow w Org-u","Dane zalogowanego użytkownika","Dane organizacji"],e:"$Flow zawiera informacje o bieżącym przepływie: data uruchomienia, czas wykonania, komunikat błędu."},{id:"w15-58",s:"m",q:"Która stała globalna reprezentuje pusty ciąg znaków?",a:["$GlobalConstant.EmptyString","$GlobalConstant.Null","$GlobalConstant.False","$System.Empty"],e:"Stałe globalne: True, False, EmptyString, Null."},{id:"w15-59",s:"m",q:"Jaki zasób automatycznie udostępnia element Loop?",a:["Bieżący rekord przetwarzany w iteracji","Wybraną ścieżkę (Outcome)","Wartości z formularza","Kolekcję pobranych rekordów"],e:"Loop udostępnia bieżący rekord. Decision udostępnia Outcome, Screen wartości z formularza, a Get Records Record lub Record Collection."},{id:"w15-60",s:"m",q:"Czy zmienne globalne Flow można zwykle modyfikować?",a:["Zasadniczo są tylko do odczytu; niektóre, np. $Flow.CurrentStage, można modyfikować","Tak, wszystkie","Nie, żadnej nie można ani odczytać","Tylko w Debug"],e:"Zmienne globalne są zasadniczo tylko do odczytu. Niektóre, np. $Flow.CurrentStage, można modyfikować w określony sposób."},{id:"w15-61",s:"n",q:"Czym różni się Save od Activate w Flow Builder?",a:["Save zapisuje Flow (nie można go uruchomić), Activate uaktywnia go (można uruchomić)","To samo","Activate zapisuje, Save uruchamia","Save uruchamia w trybie debug"],e:"Save zapisuje Flow, ale nie można go uruchomić. Activate go uaktywnia. Run uruchamia, Debug uruchamia w trybie debugowania."},{id:"w15-62",s:"n",q:"Gdzie NIE wymieniono możliwości osadzenia/uruchomienia Flow?",a:["W triggerze SQL bazy danych","Lightning Record Page","Quick Action","List View"],e:"Flow uruchomisz na Record Page, App Page, przez Quick Action, przyciski i linki, w Experience Cloud, Utility Bar, List View i Navigation Tab."},{id:"w15-63",s:"o",q:"Czego NIE należy umieszczać wewnątrz elementu Loop wg dobrych praktyk?",a:["Get/Create/Update/Delete Records","Assignment","Decision","Zmiennych"],e:"Nie umieszczaj operacji na danych w pętli. Gromadź dane w kolekcjach i wykonuj operacje zbiorczo poza pętlą."},{id:"w15-64",s:"o",q:"Jak należy wydzielać powtarzalną logikę we Flow?",a:["Do Autolaunched Flow wywoływanego przez Subflow","Kopiować do każdego Flow","Do Screen Flow","Do Schedule-Triggered Flow"],e:"Powtarzalną logikę wydzielaj do Autolaunched Flow i wywołuj przez Subflow."},{id:"w15-65",s:"o",q:"Które narzędzie służy do analizy kolejności uruchamiania Record-Triggered Flow dla obiektu?",a:["Flow Trigger Explorer","Developer Console","Schema Builder","Debug Log"],e:"Flow Trigger Explorer analizuje i zarządza kolejnością uruchamiania przepływów."},{id:"w15-66",s:"o",q:"Jak obsługiwać błędy we Flow wg dobrych praktyk?",a:["Definiować Fault Paths, pokazywać zrozumiałe komunikaty i rejestrować błędy","Ignorować błędy","Zawsze przerywać Flow bez komunikatu","Przekazywać błędy do Apex"],e:"Fault Paths, kontrola danych, walidacja wejścia, zrozumiałe komunikaty, rejestrowanie błędów i powiadomienia administratora."},{id:"w15-67",s:"o",q:"Jak postępować z aktywną wersją Flow przy zmianach?",a:["Tworzyć nowe wersje zamiast modyfikować bezpośrednio aktywną wersję","Modyfikować aktywną wersję na produkcji","Usuwać starą i tworzyć od nowa","Wyłączyć kontrolę wersji"],e:"Kontrola wersji: twórz nowe wersje Flow zamiast modyfikować aktywną wersję. Testuj w Sandboxie."},{id:"w15-68",s:"o",q:"Kiedy preferować Flow, a kiedy Apex?",a:["Flow dla standardowych procesów i operacji na rekordach; Apex przy złożonej logice lub precyzyjnej kontroli","Zawsze Apex","Zawsze Flow, nawet kosztem bardzo skomplikowanych konstrukcji","Flow tylko dla UI"],e:"Flow dla standardowych procesów. Apex dla złożonej logiki. Nie buduj rozbudowanego Flow tylko po to, by uniknąć kilku linijek kodu."},{id:"w15-69",s:"o",q:"Co pozwala łączyć możliwości Flow z kodem Apex?",a:["Invocable Apex","Trigger Apex","Anonymous Apex","Batch Apex"],e:"Invocable Apex łączy Flow z Apex, gdy standardowe możliwości Flow są niewystarczające."},{id:"w15-70",s:"o",q:"Który przykład nazwy technicznej jest zgodny z dobrymi praktykami?",a:["Create_Room_Flow, varRoomName, Get_Available_Rooms","flow1, x, temp","MÓJ FLOW!!!, zmienna 1","a_b_c, Flow-New"],e:"Czytelne nazwy API: Create_Room_Flow, varRoomName, Get_Available_Rooms."},{id:"w15-71",s:"o",q:"Co oznacza dobra praktyka 'mechanizm pomijania' (bypass)?",a:["Przewidywanie możliwości czasowego wyłączenia wybranych automatyzacji","Omijanie limitów Governor","Pomijanie walidacji danych","Omijanie uprawnień użytkownika"],e:"Mechanizm pomijania (bypass) to możliwość czasowego wyłączenia wybranych automatyzacji."},{id:"w15-72",s:"l",q:"Który zasób przechowuje kolekcję rekordów modelu danych?",a:["Record Collection","Record","Collection Choice Set","Variable"],e:"Record to pojedynczy rekord, Record Collection to kolekcja rekordów (np. lista dostępnych pokoi)."}],Xp={id:Vp,title:Zp,sections:Gp,questions:Qp},$p="net",Yp="Architektura i programowanie w .NET",ek=".NET",ak="C#, platforma .NET, ASP.NET Core MVC i Razor Pages, DI, EF Core, Web API, Identity. Test podchwytliwy!",ik=["w01","w02","w03","w04","w05"],ok={id:$p,name:Yp,short:ek,description:ak,lectures:ik},nk="w01",tk="W1 · C# i platforma .NET",rk=[{id:"a",title:"Zaliczenie",text:"Zaliczenie odbywa się w postaci **podchwytliwego testu jednokrotnego wyboru**. Wykładowca uprzedza też o możliwych intencjonalnych „kłamstwach” w pytaniach."},{id:"b",title:"Platforma .NET",text:`**.NET** to pojęcie zbiorcze („umbrella term”). Składają się na nie: **CLR** (Common Language Runtime, środowisko uruchomieniowe, odpowiednik JVM), **BCL** (biblioteka klas bazowych), kompilatory (**Roslyn** dla C#/VB), kompilator JIT (**RyuJIT**), system budowania **MSBuild**, frameworki (ASP.NET, ML.NET, WPF) i narzędzia (np. **NuGet**).

Kod C# jest kompilowany do kodu pośredniego **MSIL/CIL** w assembly (zwykle pliki \`.dll\`), a przy starcie aplikacji kompiluje go JIT. Do uruchomienia potrzebny jest CLR. CLR można dostarczyć razem z aplikacją (**self-contained**, także jako pojedynczy plik wykonywalny). Kompilacja **AOT** (ahead-of-time) rozwija się coraz bardziej od .NET 8, wcześniej istniały m.in. .NET Native (UWP) i IL2CPP (Unity).

Implementacje: **.NET Framework** (tylko Windows, ostatnia wersja 4.8.1), **.NET Core** (wieloplatformowy, do wersji 3.1) i **.NET 5** jako „połączenie” (bez wersji 4, żeby nie mylić z .NET Framework 4.x). Wersje parzyste mają wsparcie **LTS** (long-term support), nieparzyste **STS** (short-term support). Aktualnie (2026) jest .NET 10 (LTS) i C# 14, a ponadto .NET Standard 2.1 i .NET Framework 4.8.1.`},{id:"c",title:"Język C# i jego wersje",text:"Autorem **C#** jest Anders Hejlsberg (twórca także Delphi i TypeScript). Język powstał w 2000 roku, a pierwsza publiczna wersja ukazała się w styczniu 2002. C# jest wieloparadygmatowy i silnie typowany: głównie obiektowy, ze zintegrowanym programowaniem zdarzeniowym i elementami funkcyjnymi. Ma odśmiecacz (GC) i jest memory safe.\n\nNowości w kolejnych wersjach:\n• **2.0** (2005): klasy statyczne, typy generyczne, metody anonimowe,\n• **3.0** (2007): LINQ, `var`, typy anonimowe, lambdy, metody rozszerzające, automatyczne właściwości,\n• **4.0** (2010): `dynamic`, ko- i kontrawariancja, argumenty opcjonalne,\n• **5.0** (2012): `async`/`await`,\n• **6.0** (2015): `nameof`, interpolacja łańcuchów, exception filters,\n• **8.0** (2019): domyślne implementacje w interfejsach, switch expressions, async streams, indeksy i zakresy,\n• **9.0** (2020): rekordy, top-level statements, rozszerzone pattern matching,\n• **10** (2021): record struct, global using, file-scoped namespace,\n• **11** (2022): raw string literals, atrybuty generyczne, literały UTF-8, wzorce list, składniki `required`,\n• **12** (2023): primary constructors, collection expressions, opcjonalne parametry lambd,\n• **13**: partial properties i indeksatory,\n• **14** (2025): extension members, słowo kluczowe `field`, niejawne konwersje dla `Span<T>`."},{id:"d",title:"Typy i podstawowa składnia",text:'**Top-level statements** (C# 9+) automatycznie generują klasę `Program` i metodę `Main()`, ograniczając „ceremonię”. Spotkasz je w Minimal APIs.\n\n**Typy wartościowe** (np. `int`) są przekazywane przez wartość, ale nadal są obiektami, bo dziedziczą po `System.ValueType`. `struct` jest podobny do klasy, ale to typ wartościowy (przechowywany na stosie). `byte` ma zakres 0–255 (bez znaku, inaczej niż w Javie), a `sbyte` −128..127. `char` to pojedynczy znak UTF-16. `string` to alias `System.String`, łańcuchy są niemutowalne (UTF-16).\n\n**var** wnioskuje typ z wyrażenia po prawej stronie, działa tylko dla zmiennych lokalnych, wymaga inicjalizatora, a typ się potem nie zmienia. Dlatego `var x; x = 5;` się nie skompiluje, a `var a = 3; a = "test";` to błąd kompilacji (`a` jest `int`). Zachowanie dynamiczne daje tylko `dynamic`.\n\nOperator `??` zwraca prawą stronę, gdy lewa jest `null` (np. `int? c = null; int d = c ?? -1;` daje −1). Operator `?.` wywołuje metodę tylko wtedy, gdy obiekt nie jest `null`.'},{id:"e",title:"Parametry i modyfikatory dostępu",text:"Modyfikatory parametrów: **in** – parametr wejściowy, którego nie można zmienić, **out** – parametr wyjściowy, do którego metoda zapisuje wynik (można go zadeklarować w wywołaniu: `Example(out int a)`), **ref** – przekazanie przez referencję z możliwością zmiany.\n\nDomyślna widoczność: składowe klasy (metody i pola) są **private**, a klasa najwyższego poziomu jest **internal**. `internal` oznacza widoczność w obrębie assembly (najczęściej jednego DLL), a nie przestrzeni nazw czy pakietu jak w Javie. `private protected` (od C# 7.2) to dostęp w klasach pochodnych, ale tylko w tym samym assembly. `protected internal` to klasy pochodne lub to samo assembly."},{id:"f",title:"Programowanie obiektowe w C#",text:'• Przeciążanie metod wymaga różnej listy argumentów. Nie wystarczy inny typ zwracany.\n• W **klasie statycznej** wszystkie składowe muszą być statyczne, a odwołuje się do nich przez nazwę klasy.\n• Dziedziczenie i implementację interfejsów zapisuje się dwukropkiem: `class A : Base, IFoo`. Klasa bazowa może być tylko jedna, a interfejsów wiele.\n• **Polimorfizm** wymaga jawnego `virtual` w klasie bazowej i `override` w pochodnej (w Javie metody są domyślnie wirtualne, w C# nie).\n• **sealed** – po klasie nie można dziedziczyć. **abstract** – nie można utworzyć obiektu, ale klasa może mieć składowe nieabstrakcyjne (metoda `abstract` wymusza klasę `abstract`).\n• Od C# 8.0 interfejsy mogą mieć domyślne implementacje metod.\n• **Właściwość** (property) działa jak pole, ale jest metodą (`get`/`set`). Akcesor `init` pozwala ustawić wartość tylko przy tworzeniu obiektu. `get` i `set` mogą mieć różną widoczność, a właściwość może mieć tylko jeden z nich.\n• **Zdarzenie** (event) opiera się na delegacie, a odbiorców dodaje się operatorem `+=`.\n• **Atrybuty** (np. `[PrimaryKey]`) są metadanymi dostępnymi przez refleksję, więc korzystają z nich biblioteki (np. ORM).\n• **Metoda rozszerzająca** ma `this` przed pierwszym parametrem: `static int ToInt(this string s)` pozwala wywołać `"23".ToInt()`.\n• Od .NET 6 kompilator domyślnie ostrzega o wartościach, które mogą być `null` (typy oznacza się `?`, np. `string?`).\n• **record** to typ referencyjny z wbudowaną enkapsulacją danych, przeznaczony jako niemutowalny pojemnik. **record struct** (C# 10) to typ wartościowy działający tak samo.'},{id:"g",title:"Switch i dopasowanie wzorców",text:'Wyrażenie `switch` z wzorcami: `p.Age switch { < 13 => "Child", >= 13 and < 20 => "Teen", >= 20 and < 65 => "Adult", _ => "Senior" }`. Dla 19 wynik to Teen. Dla 65 to Senior, bo nie spełnia `< 65` i trafia do `_` (discard).\n\nDopasowanie wzorców własności: `p switch { {X:0,Y:0} => ..., {X: var x, Y: var y} when x < y => ..., {X: var x, Y: var y} when x > y => ..., {X: var x, Y: var y} => new(2*x, 2*y) }`. Dla `Point(3, 1)` zachodzi `x > y`, więc wynik to `(x-y, y) = (2, 1)`. Dla `Point(2, 2)` żaden z warunków nie pasuje, więc ostatnia gałąź daje `(4, 4)`.\n\nW klasycznej instrukcji `switch` (case) w C# wymagany jest `break` na końcu każdej sekcji, bo nie ma niejawnego fall-through.'},{id:"h",title:"Unsafe, operatory i metody rozszerzające",text:'Zamiast kodu `unsafe` ze wskaźnikami zaleca się np. `Span<T>`, choć czasem `unsafe` bywa niezbędny. Wytyczne dotyczące przeciążania operatorów („DO NOT be cute”): przeciążaj tylko, gdy wynik jest oczywisty (np. `DateTime − DateTime = TimeSpan`). Nie należy używać `|` do łączenia zapytań ani `<<` do zapisu do strumienia.\n\nPrzykład metody rozszerzającej: `static int ToInt(this string s) => int.Parse(s);`, więc `"23".ToInt()` zwraca 23.'},{id:"i",title:"Ekosystem .NET",text:`• **Aplikacje desktopowe**: WinForms, WPF i WinUI3 działają tylko na Windows. **MAUI** działa na Windows i macOS. Biblioteki firm trzecich **Avalonia** i **Uno** działają na Windows, Linuksie i macOS (MAUI nie wspiera desktopowego Linuksa).
• **ASP.NET Core** można hostować samodzielnie (Kestrel) albo na IIS (tylko Windows). Popularne jest Kestrel z reverse proxy.
• **ORM**: oficjalny to **Entity Framework Core**.
• **Aplikacje mobilne**: oficjalny framework to **MAUI** (następca Xamarin.Forms; obsługuje Android, iOS, Windows, macOS i Tizen).
• **Unity** używa C# jako języka skryptowego i translatora **IL2CPP** (AOT).
• **IoT**: **Meadow** i **nanoFramework** implementują .NET na mikrokontrolerach ARM.
• Projekty .NET opisują pliki \`.csproj\` (XML), a solucja (\`.sln\`) to zbiór projektów, np. głównego, testów i wspólnych bibliotek.
• Od .NET 10 można uruchomić samotny plik \`.cs\`, a projekt powstaje w pamięci.
• Inne języki platformy .NET: F#, Delphi.NET, COBOL.NET, C++/CLI, Perl.NET, IronPython, IKVM.NET. Kotlin/Native nie należy do nich.`}],sk=[{id:"w01-01",s:"a",q:"W jakiej formie odbywa się zaliczenie przedmiotu wg pierwszego wykładu?",a:["Podchwytliwy test jednokrotnego wyboru","Projekt zaliczeniowy","Egzamin ustny","Test wielokrotnego wyboru z punktami ujemnymi"],e:"Zaliczenie odbywa się w postaci podchwytliwego testu jednokrotnego wyboru. Wykładowca uprzedza też o możliwych intencjonalnych „kłamstwach”.",w:["Projektu nie ma – wykładowca zapowiedział test.","Nie ustny – pisemny test jednokrotnego wyboru.","Jednokrotnego, nie wielokrotnego wyboru; o punktach ujemnych nie było mowy."]},{id:"w01-02",s:"b",q:"Z czego składa się platforma .NET wg wykładu?",a:["CLR, BCL, kompilatory (Roslyn), JIT (RyuJIT), MSBuild, frameworki i narzędzia (np. NuGet)","JVM, JDK i Maven","Tylko z kompilatora C#","CLR i Visual Studio"],e:".NET to „umbrella term”: CLR (runtime), BCL, kompilatory (Roslyn), JIT (RyuJIT), system budowania (MSBuild), frameworki (ASP.NET, ML.NET, WPF) i narzędzia (NuGet).",w:["JVM, JDK i Maven to ekosystem Javy – .NET jest jedynie jego odpowiednikiem.","Kompilator to tylko jeden z wielu składników.","Visual Studio to IDE, nie część platformy; brakuje BCL, JIT, MSBuild."]},{id:"w01-03",s:"b",q:"Co oznacza skrót CLR?",a:["Common Language Runtime","Common Library Repository","Compiled Language Runtime","Core Language Resolver"],e:"CLR = Common Language Runtime, czyli środowisko uruchomieniowe .NET (odpowiednik JVM).",w:["„Repository” – nie; L oznacza Language.","„Compiled” – nie; to Common Language Runtime.","Takiego rozwinięcia nie ma."]},{id:"w01-04",s:"b",q:"Jak nazywa się kompilator JIT platformy .NET?",a:["RyuJIT","Roslyn","MSBuild","HotSpot"],e:"RyuJIT to kompilator JIT. Roslyn to kompilator C# do kodu pośredniego, MSBuild to system budowania, HotSpot to JVM Javy.",w:["Roslyn kompiluje C# do IL, a nie JIT-uje do kodu maszynowego.","MSBuild to system budowania.","HotSpot to JIT w JVM (Java)."]},{id:"w01-05",s:"b",q:"Czym jest Roslyn?",a:["Kompilatorem (C#/VB) platformy .NET","Kompilatorem JIT","Menedżerem pakietów","Środowiskiem uruchomieniowym"],e:"Roslyn to kompilatory platformy. JIT to RyuJIT, pakiety obsługuje NuGet, runtime to CLR.",w:["JIT to RyuJIT.","Menedżer pakietów to NuGet.","Środowisko uruchomieniowe to CLR."]},{id:"w01-06",s:"b",q:"Do jakiej postaci kompilowany jest kod C#?",a:["Do kodu pośredniego MSIL/CIL, który przy starcie jest kompilowany JIT","Bezpośrednio do kodu maszynowego zawsze","Do bajtkodu JVM","Do JavaScriptu"],e:"Kod jest kompilowany do MSIL/CIL (assembly, zwykle DLL), a przy starcie aplikacji kompiluje go JIT. Do uruchomienia niezbędny jest CLR.",w:["Bezpośrednio do natywnego kodu tylko w AOT – domyślnie przez IL + JIT.","Bajtkod JVM to Java, nie .NET.","C# nie jest kompilowany do JavaScriptu – w przeglądarce .NET działa przez WebAssembly."]},{id:"w01-07",s:"b",q:"Jakie rozszerzenie mają najczęściej pliki assembly .NET?",a:[".dll",".jar",".so",".class"],e:"Kod jest kompilowany do assembly, najczęściej plików DLL.",w:[".jar to archiwa Javy.",".so to biblioteki natywne Linuksa.",".class to skompilowane klasy Javy."]},{id:"w01-08",s:"b",q:"Czym jest self-contained deployment?",a:["Dostarczeniem CLR razem z aplikacją (także jako pojedynczy plik wykonywalny)","Wdrożeniem aplikacji wyłącznie na IIS","Kompilacją do WebAssembly","Wdrożeniem bez plików DLL"],e:"CLR może być dostarczony razem z aplikacją (self-contained). Wykładowca uważa to podejście za wskazane.",w:["IIS to sposób hostowania, nie rodzaj wdrożenia CLR.","WebAssembly dotyczy Blazora, nie self-contained.","Pliki DLL nadal są – CLR jest po prostu dołączony."]},{id:"w01-09",s:"b",q:"Od której wersji .NET kompilacja AOT rozwija się coraz bardziej wg wykładu?",a:[".NET 8",".NET 5",".NET Core 3.1",".NET Framework 4.8"],e:"AOT (ahead-of-time) rozwija się coraz bardziej od .NET 8. Wcześniej istniały m.in. .NET Native (UWP) i IL2CPP (Unity).",w:[".NET 5 to „połączenie” Framework/Core, nie przełom w AOT.",".NET Core 3.1 to koniec linii Core.",".NET Framework nie wspiera nowoczesnego AOT."]},{id:"w01-10",s:"b",q:"Która implementacja .NET działa tylko na Windows i osiągnęła wersję 4.8.1?",a:[".NET Framework",".NET Core",".NET 5","Mono"],e:".NET Framework jest tylko dla Windows (4.8.1). .NET Core jest wieloplatformowy (do 3.1), a .NET 5 to „połączenie”.",w:[".NET Core jest wieloplatformowy i skończył się na 3.1.",".NET 5 jest wieloplatformowy.","Mono to alternatywna, wieloplatformowa implementacja."]},{id:"w01-11",s:"b",q:"Do jakiej wersji dotarł .NET Core, zanim zastąpił go .NET 5?",a:["3.1","4.8.1","2.2","4.0"],e:".NET Core osiągnął wersję 3.1. Potem przyszło .NET 5.0 jako „połączenie”, bez numeru 4, żeby nie mylić z .NET Framework 4.x.",w:["4.8.1 to ostatni .NET Framework.","2.2 to wcześniejsza wersja Core.","4.0 to wersja .NET Framework – Core nie miał 4.x (dlatego skok na 5)."]},{id:"w01-12",s:"b",q:"Które wersje .NET mają wsparcie LTS (long-term support)?",a:["Parzyste","Nieparzyste","Wszystkie","Tylko wersje z końcówką .1"],e:"Parzyste to LTS, nieparzyste to STS (short-term support). Aktualna jest .NET 10 (LTS).",w:["Odwrotnie – nieparzyste to STS.","Nie – STS ma krótsze wsparcie.","O LTS nie decyduje końcówka .1."]},{id:"w01-13",s:"b",q:"Jaka jest aktualna wersja .NET i C# wg wykładu (2026)?",a:[".NET 10 i C# 14",".NET 9 i C# 13",".NET 8 i C# 12",".NET 11 i C# 15"],e:"Według wykładu (rok 2026) aktualne są .NET 10.0 i C# 14.0. Dostępne są też .NET Standard 2.1 i .NET Framework 4.8.1.",w:["To para z 2024 roku.","To para z 2023 roku.","Takie wersje jeszcze nie istnieją."]},{id:"w01-14",s:"c",q:"Kto jest twórcą języka C#?",a:["Anders Hejlsberg (autor Delphi i TypeScript)","James Gosling","Bjarne Stroustrup","Guido van Rossum"],e:"Anders Hejlsberg, autor również Delphi oraz TypeScript.",w:["Gosling stworzył Javę.","Stroustrup stworzył C++.","Van Rossum stworzył Pythona."]},{id:"w01-15",s:"c",q:"Kiedy ukazała się pierwsza publiczna wersja C#?",a:["W styczniu 2002 (język powstał w 2000)","W 1995","W 2005","W 2010"],e:"C# powstał w 2000 roku, ale pierwsza publiczna wersja pojawiła się w styczniu 2002.",w:["1995 to rok Javy.","2005 to C# 2.0.","2010 to C# 4.0."]},{id:"w01-16",s:"c",q:"Jakim językiem jest C# wg wykładu?",a:["Wieloparadygmatowym o silnej kontroli typów: głównie obiektowym, ze zdarzeniami i elementami funkcyjnymi","Czysto funkcyjnym","Dynamicznie typowanym skryptowym","Proceduralnym bez klas"],e:"C# jest wieloparadygmatowy, silnie typowany, głównie obiektowy, ze zintegrowanym programowaniem zdarzeniowym i dodatkami funkcyjnymi. Ma GC i jest memory safe.",w:["Ma elementy funkcyjne, ale jest głównie obiektowy.","C# jest silnie i statycznie typowany (dynamic to wyjątek).","Klasy są podstawą C#."]},{id:"w01-17",s:"c",q:"W której wersji C# pojawiły się LINQ, wyrażenia lambda i metody rozszerzające?",a:["3.0","2.0","5.0","7.0"],e:"C# 3.0 (2007): LINQ, lokalna inferencja typów (var), typy anonimowe, lambdy, metody rozszerzające, automatyczne właściwości.",w:["2.0 wprowadził generyki i metody anonimowe – lambdy dopiero w 3.0.","5.0 to async/await.","7.0 to krotki i pattern matching."]},{id:"w01-18",s:"c",q:"W której wersji C# pojawiły się typy generyczne?",a:["2.0","3.0","1.0","4.0"],e:"C# 2.0 (2005): klasy statyczne, typy generyczne, metody anonimowe.",w:["3.0 to LINQ i lambdy.","1.0 nie miał generyków.","4.0 to dynamic i wariancja generyków."]},{id:"w01-19",s:"c",q:"W której wersji C# wprowadzono async/await?",a:["5.0","4.0","6.0","7.0"],e:"C# 5.0 (2012): async/await. W 4.0 był typ dynamic, w 6.0 nameof i interpolacja.",w:["4.0 to dynamic.","6.0 to nameof i interpolacja.","7.0 to krotki; Task<T> z async to rozszerzenie, nie początek."]},{id:"w01-20",s:"c",q:"W której wersji C# pojawił się typ dynamic?",a:["4.0","3.0","5.0","2.0"],e:"C# 4.0 (2010): dynamic, generyczna ko- i kontrawariancja, argumenty opcjonalne.",w:["3.0 to LINQ.","5.0 to async/await.","2.0 to generyki."]},{id:"w01-21",s:"c",q:"W której wersji C# pojawiły się nameof i interpolacja łańcuchów?",a:["6.0","5.0","7.0","8.0"],e:"C# 6.0 (2015): nameof, interpolacja łańcuchów, exception filters.",w:["5.0 to async/await.","7.0 to krotki, discards, pattern matching.","8.0 to switch expressions i domyślne implementacje."]},{id:"w01-22",s:"c",q:"W której wersji C# pojawiły się domyślne implementacje w interfejsach i switch expressions?",a:["8.0","7.0","9.0","6.0"],e:"C# 8.0 (2019): domyślne implementacje interfejsów, switch expressions, async streams, indeksy i zakresy.",w:["7.0 to krotki i podstawowy pattern matching.","9.0 to rekordy i top-level statements.","6.0 to nameof i interpolacja."]},{id:"w01-23",s:"c",q:"W której wersji C# pojawiły się rekordy i top-level statements?",a:["9.0","8.0","10.0","7.0"],e:"C# 9.0 (2020): rekordy, top-level statements, rozszerzenia pattern matching.",w:["8.0 to switch expressions.","10.0 to record struct i global using.","7.0 to krotki."]},{id:"w01-24",s:"c",q:"Co wprowadził C# 10?",a:["record struct, globalne using i file-scoped namespace","Rekordy i top-level statements","Primary constructors","async/await"],e:"C# 10 (2021): record structs, global using, file-scoped namespace, stałe interpolowane łańcuchy.",w:["Rekordy i top-level to C# 9.","Primary constructors to C# 12.","async/await to C# 5."]},{id:"w01-25",s:"c",q:"W której wersji C# pojawiły się primary constructors i collection expressions?",a:["12","11","10","14"],e:"C# 12 (2023): primary constructors, collection expressions, opcjonalne parametry lambd.",w:["11 to raw strings i required.","10 to record struct i global using.","14 to extension members i field."]},{id:"w01-26",s:"c",q:"Co wprowadził C# 11?",a:["Raw string literals, required, wzorce list","Słowo kluczowe field","Primary constructors","Domyślne implementacje interfejsów"],e:"C# 11 (2022): raw string literals, atrybuty generyczne, literały UTF-8, wzorce list, składniki required.",w:["field to C# 14.","Primary constructors to C# 12.","Domyślne implementacje interfejsów to C# 8."]},{id:"w01-27",s:"c",q:"Co wprowadził C# 14 (2025)?",a:["Extension members i słowo kluczowe field","Rekordy","Partial properties","Collection expressions"],e:"C# 14: extension members, słowo kluczowe field, niejawne konwersje dla Span<T>. Partial properties i indeksatory to C# 13.",w:["Rekordy to C# 9.","Partial properties to C# 13.","Collection expressions to C# 12."]},{id:"w01-28",s:"d",q:"Co robią top-level statements (C# 9+)?",a:["Automatycznie generują klasę Program i metodę Main(), ograniczając „ceremonię”","Wymuszają statyczne klasy","Pozwalają pisać kod poza assembly","Usuwają potrzebę CLR"],e:"Top-level statements generują klasę Program i Main(). Spotkasz je w Minimal APIs i punktach wejścia dużych aplikacji.",w:["Nie wymuszają klas statycznych.","Kod nadal trafia do assembly.","CLR jest zawsze potrzebny."]},{id:"w01-29",s:"d",q:"Co jest prawdą o typach wartościowych w C# (np. int)?",a:["Są przekazywane przez wartość, ale nadal są obiektami – dziedziczą po System.ValueType","Nie są obiektami, jak prymitywy w Javie","Są przekazywane przez referencję","Zawsze są przechowywane na stercie"],e:"Typy wartościowe są przekazywane przez wartość, ale to nadal obiekty, bo dziedziczą po System.ValueType.",w:["Pułapka z Javy: w C# int to obiekt (System.Int32 : ValueType).","Typy wartościowe są kopiowane, nie przekazywane przez referencję (chyba że ref).","Zwykle na stosie (lokalne) – nie zawsze na stercie."]},{id:"w01-30",s:"d",q:"Czym jest struct w C#?",a:["Złożoną strukturą podobną do klasy, ale typem wartościowym (na stosie)","Typem referencyjnym jak klasa","Aliasem dla record","Typem wskaźnikowym"],e:"struct jest podobny do klasy, ale jest typem wartościowym przechowywanym na stosie.",w:["struct jest typem wartościowym, nie referencyjnym.","record to osobny typ (a record struct to jeszcze coś innego).","Wskaźniki to osobna kategoria (unsafe)."]},{id:"w01-31",s:"d",q:"Jaki zakres ma typ byte w C#?",a:[
