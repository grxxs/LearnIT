47",s:"g",q:"Co oznacza modyfikator synchronized dla metody wg wykładu?",a:["Tylko 1 wątek może naraz wykonywać tę metodę","Metoda jest wykonywana asynchronicznie","Metoda nadpisuje metodę bazową","Metoda jest wykonywana w kontekście synchronicznym"],e:"synchronized (tylko metoda): tylko 1 wątek może naraz wykonywać tę metodę."},{id:"w06-48",s:"g",q:"Który modyfikator stosuje się do metody nadpisującej metodę klasy bazowej?",a:["override","virtual","extends","super"],e:"override (tylko metoda) nadpisuje metodę w klasie bazowej."},{id:"w06-49",s:"h",q:"Która konstrukcja służy w Apex do wielokrotnego wyboru zamiast switch-case?",a:["switch on … when … when else","switch … case … default","match … with","select … case"],e:"Apex: switch on zmienna { when 'A' {...} when 'B','C' {...} when else {...} }."},{id:"w06-50",s:"h",q:"Czy w instrukcji switch on w Apex używa się break?",a:["Nie, nie ma break","Tak, obowiązkowo","Tylko w when else","Tylko przy wielu wartościach"],e:"W switch on nie ma break, a gałęzie nie 'przepadają' do następnej."},{id:"w06-51",s:"h",q:"Jak w switch on obsłużyć kilka wartości w jednej gałęzi?",a:["when 'Intermediate', 'Advanced' { … }","when 'Intermediate' || 'Advanced' { … }","case 'Intermediate': case 'Advanced':","when ('Intermediate' or 'Advanced')"],e:"Wartości oddziela się przecinkami: when 'Intermediate', 'Advanced'."},{id:"w06-52",s:"h",q:"Co wypisze kod: for (Integer i = 0; i < 5; i++) { if (i == 2) continue; if (i == 4) break; System.debug(i); }",a:["0, 1, 3","0, 1, 2, 3","0, 1","0, 1, 3, 4"],e:"i=2 jest pomijane (continue), a przy i=4 pętla jest przerywana (break). Wynik: 0, 1, 3."},{id:"w06-53",s:"h",q:"Ile razy wykona się ciało pętli: Integer count = 10; do { count++; } while (count < 5);",a:["1 raz","0 razy","5 razy","Nieskończenie"],e:"do-while zawsze wykonuje ciało przynajmniej raz, potem sprawdza warunek (11 < 5 = false)."},{id:"w06-54",s:"h",q:"Czy w Apex są etykiety skoku dla break/continue?",a:["Nie","Tak, jak w Javie","Tylko dla pętli for","Tylko dla while"],e:"W Apex nie ma etykiet skoku dla break i continue."},{id:"w06-55",s:"i",q:"Do czego służy Apex DML?",a:["Do tworzenia, aktualizacji, usuwania i przywracania rekordów","Do pobierania rekordów zapytaniami","Do wyszukiwania pełnotekstowego","Do definiowania obiektów"],e:"Apex DML to tworzenie, aktualizacja, usuwanie i przywracanie rekordów."},{id:"w06-56",s:"i",q:"Do czego służy SOSL?",a:["Do wyszukiwania rekordów po tekście, liczbach lub polach wyszukiwania","Do pobierania rekordów jednego obiektu z filtrami (jak SELECT)","Do modyfikacji rekordów","Do definiowania relacji"],e:"SOSL to Salesforce Object Search Language, czyli wyszukiwanie. SOQL służy do pobierania rekordów (SELECT…)."},{id:"w06-57",s:"i",q:"Co zazwyczaj zwraca zapytanie SOQL?",a:["Listę rekordów","Pojedynczą liczbę","Plik CSV","Obiekt JSON"],e:"SOQL zazwyczaj zwraca listę rekordów, np. [SELECT Name, Industry FROM Account]."},{id:"w06-58",s:"i",q:"Ile pól definiuje klasa SampleJob z wykładu (counter, isActive, jobName)?",a:["3, w tym 1 statyczne","2","3, wszystkie instancyjne","1"],e:"Pola: public static Integer counter (statyczne), private Boolean isActive, public final String jobName."},{id:"w06-59",s:"i",q:"Czy obsługa wyjątków (try/catch/finally) w Apex różni się od Javy?",a:["Składnia i działanie takie same, ale brak try-with-resources","Apex nie ma bloku finally","Apex nie obsługuje wyjątków","Apex używa on error goto"],e:"Składnia i działanie takie same jak w Javie, ale brak try-with-resources."},{id:"w06-60",s:"c",q:"Co to jest kontekst wykonania Apex?",a:["Jednostka wykonania kodu Apex, definiująca większość ograniczeń i czas życia zmiennych statycznych","Sesja użytkownika w przeglądarce","Zbiór klas w jednym pliku","Środowisko Sandbox"],e:"Kontekst to jednostka wykonania kodu. Definiuje większość ograniczeń i czas życia zmiennych statycznych."}],rp={id:ip,title:op,sections:np,questions:tp},sp="w07",lp="W7 · Apex DML",cp=[{id:"a",title:"Czym jest DML i jakie ma limity",text:"**DML** (Data Manipulation Language) służy w Apex do tworzenia, aktualizowania i usuwania rekordów. Do odczytu służy SOQL, nie DML. Są dwa sposoby użycia DML: instrukcje (`insert`, `update` itd.) oraz metody statyczne klasy `Database`. DML może operować na pojedynczych rekordach i na kolekcjach.\n\nOgraniczenia jednej transakcji: najwyżej **10 000** przetworzonych rekordów i najwyżej **150** wywołań instrukcji DML. Jeśli instrukcja DML zakończy się błędem (bez try-catch), wykonanie jest przerywane, a transakcja automatycznie wycofywana."},{id:"b",title:"Instrukcje DML",text:"Instrukcje DML:\n• **insert** – dodaje rekord,\n• **update** – zmienia rekord,\n• **upsert** – wstawia rekord, jeśli nie istnieje, albo aktualizuje, jeśli istnieje,\n• **delete** – usuwa rekord do kosza (Recycle Bin), a jego Id zostaje takie samo; rekordy leżą w koszu standardowo 15 dni,\n• **undelete** – przywraca rekord, który został wcześniej usunięty i nadal jest w koszu,\n• **merge** – scala rekordy uznane za duplikaty; rekord główny zostaje, duplikat jest usuwany, a powiązane rekordy trafiają do głównego.\n\nSamo utworzenie obiektu w Apex (`new Account(...)`) nie zapisuje go w bazie: zapis powoduje dopiero DML. Rekord dostaje Id po `insert`, więc potem można go od razu zaktualizować bez zapytania SOQL. Przy tworzeniu Contact powiązanego z Account kolejność ma znaczenie: najpierw `insert` Account, potem Contact z `AccountId = acc.Id`, bo obiekt podrzędny wymaga istnienia nadrzędnego (w przykładzie relacja Lookup)."},{id:"c",title:"Bulk DML",text:"Poprawny wzorzec to dodać rekordy do listy w pętli i wykonać **jeden** `insert` całej listy po pętli. `Insert` wewnątrz pętli to antywzorzec: każde wywołanie to osobna operacja na bazie i limit 150 instrukcji DML szybko się wyczerpuje."},{id:"d",title:"Obsługa błędów DML",text:"Niepowodzenie instrukcji DML zgłasza wyjątek, np. `DmlException`. Przyczyny to brak wymaganego pola, reguła walidacji, ograniczenia relacji albo brak uprawnień. Nieudana instrukcja nie zapisuje części rekordów, a wcześniejsze operacje w transakcji są automatycznie wycofywane (jeśli wyjątek nie jest obsłużony). Żeby kod kontynuował po błędzie, trzeba obsłużyć wyjątek w bloku try-catch."},{id:"e",title:"Klasa Database",text:"Klasa **Database** daje większą kontrolę niż instrukcje DML: obsługę błędów, częściowe powodzenie i dostęp do wyników poszczególnych operacji. Parametr **allOrNone** domyślnie ma wartość `true`, czyli działa atomowo jak instrukcja DML.\n\nPrzykład: lista trzech kont, z których drugie nie ma nazwy. `Database.insert(lista, true)` nie zapisze żadnego (0 kont). `Database.insert(lista, false)` zapisze konto 1 i 3, a drugie pominie. Wtedy metoda nie rzuca wyjątku, tylko zwraca wyniki, które programista musi sprawdzić. Ustawienie `false` nie oznacza ignorowania błędów.\n\nTypy wyników: `insert` i `update` zwracają **SaveResult** (nie ma UpdateResult), `upsert` – UpsertResult, `delete` – DeleteResult, `undelete` – UndeleteResult, `merge` – MergeResult. Metoda `isSuccess()` sprawdza powodzenie, `getId()` zwraca Id, a `getErrors()` listę błędów typu `Database.Error` (z metodą `getMessage()`). Przy instrukcjach DML błędy są w obiekcie wyjątku, a przy metodach Database w obiektach wynikowych."},{id:"f",title:"Kiedy co stosować",text:"Do prostego zapisu jednego rekordu wystarczy instrukcja DML. Przy imporcie wielu rekordów, z których część może być błędna, stosuje się `Database` z `allOrNone = false`. Klasa Database poszerza DML o kontrolę transakcji, wycofanie działań i metody zapytań. `Database.query()` wykonuje dynamiczne zapytania SOQL. Zmiany do wybranego punktu w transakcji cofa się przez `Database.setSavepoint()` i `Database.rollback()`."}],dp=[{id:"w07-01",s:"a",q:"Co oznacza skrót DML?",a:["Data Manipulation Language","Data Model Language","Database Management Layer","Dynamic Metadata Language"],e:"DML = Data Manipulation Language: tworzenie, aktualizacja i usuwanie rekordów z poziomu Apex."},{id:"w07-02",s:"a",q:"Do czego NIE służy DML w Apex?",a:["Do odczytu rekordów (do tego służy SOQL)","Do tworzenia rekordów","Do aktualizacji rekordów","Do usuwania rekordów"],e:"DML służy do zmieniania danych (tworzenia, aktualizacji, usuwania). Do odczytu rekordów służy SOQL."},{id:"w07-03",s:"a",q:"Jakie są dwa sposoby korzystania z Apex DML?",a:["Instrukcje DML i metody statyczne klasy Database","SQL i PL/SQL","SOQL i SOSL","REST API i SOAP API"],e:"Sposoby: instrukcje DML (insert, update…) oraz metody statyczne klasy Database."},{id:"w07-04",s:"b",q:"Jak działa instrukcja upsert?",a:["Wstawia rekord, jeśli nie istnieje, lub aktualizuje, jeśli istnieje","Zawsze wstawia nowy rekord","Scala duplikaty","Przywraca usunięty rekord"],e:"upsert = insert (gdy rekordu brak) lub update (gdy istnieje)."},{id:"w07-05",s:"b",q:"Do czego służy instrukcja merge?",a:["Do scalania rekordów uznanych za duplikaty","Do łączenia dwóch obiektów w jeden","Do łączenia transakcji","Do łączenia wyników SOQL"],e:"merge to scalanie rekordów uznanych za duplikaty."},{id:"w07-06",s:"a",q:"Jaki jest limit rekordów przetwarzanych przez DML w jednej transakcji?",a:["10 000","150","50 000","200"],e:"Ograniczenia dla transakcji: liczba rekordów ≤ 10 000, liczba wywołań instrukcji DML ≤ 150."},{id:"w07-07",s:"a",q:"Ile maksymalnie wywołań instrukcji DML dopuszcza jedna transakcja?",a:["150","100","10 000","200"],e:"Liczba wywołań instrukcji DML ≤ 150 na transakcję."},{id:"w07-08",s:"a",q:"Na czym może operować Apex DML?",a:["Na pojedynczych rekordach i na kolekcjach rekordów","Tylko na pojedynczych rekordach","Tylko na listach","Tylko na mapach"],e:"Apex DML może operować na pojedynczych rekordach i na kolekcjach rekordów."},{id:"w07-09",s:"a",q:"Co się dzieje, gdy instrukcja DML zakończy się błędem (bez try-catch)?",a:["Wykonanie jest przerywane i następuje automatyczne wycofanie transakcji","Błąd jest ignorowany","Zapisywane są poprawne rekordy","Rekord trafia do Recycle Bin"],e:"Błąd przerywa wykonanie i następuje automatyczne wycofanie transakcji."},{id:"w07-10",s:"b",q:"Czy samo utworzenie obiektu w Apex (new Account(...)) zapisuje go w bazie?",a:["Nie, dopiero operacja DML powoduje zapis","Tak, natychmiast","Tak, na koniec kontekstu","Tak, jeśli ma wypełnione pole Name"],e:"Samo utworzenie obiektu w kodzie (new Account(...)) nie zapisuje go w bazie. Zapis powoduje dopiero operacja DML."},{id:"w07-11",s:"b",q:"Kiedy rekord otrzymuje Id?",a:["Po wstawieniu do bazy (insert); Id nadawane jest automatycznie","W konstruktorze","Trzeba je nadać ręcznie","Po pierwszym zapytaniu SOQL"],e:"Rekord po utworzeniu nie ma Id. Wstawienie do bazy automatycznie nadaje Id, które jest potem dostępne w kodzie."},{id:"w07-12",s:"b",q:"Dlaczego przy tworzeniu Contact powiązanego z Account kolejność operacji ma znaczenie?",a:["Obiekt podrzędny wymaga istnienia obiektu nadrzędnego (jego Id)","Bo Contact musi być wstawiony przed Account","Bo insert działa tylko alfabetycznie","Kolejność nie ma znaczenia"],e:"Najpierw insert Account, a potem Contact z AccountId = acc.Id, bo obiekt podrzędny wymaga istnienia nadrzędnego."},{id:"w07-13",s:"b",q:"Jaki typ relacji łączy Contact z Account w przykładzie z wykładu?",a:["Lookup (Account – Parent, Contact – Child)","Master-Detail (Account – Master)","Wiele do wielu","External Lookup"],e:"W przykładzie relacja Lookup: Account to Parent, Contact to Child."},{id:"w07-14",s:"b",q:"Dlaczego po insert można od razu wykonać update na tym samym obiekcie bez SOQL?",a:["Bo po insert obiekt zawiera już Id utworzonego rekordu","Bo update nie wymaga Id","Bo Apex cache'uje wszystkie rekordy","Nie można, trzeba najpierw pobrać rekord SOQL"],e:"Po insert zmienna zawiera Id, więc można zaktualizować rekord bez pobierania go SOQL."},{id:"w07-15",s:"b",q:"Gdzie trafia rekord po operacji delete?",a:["Do Recycle Bin, a jego Id pozostaje takie samo","Jest trwale usuwany natychmiast","Do Sandboxa","Do archiwum z nowym Id"],e:"Po delete rekord trafia do Recycle Bin, a jego identyfikator pozostaje taki sam."},{id:"w07-16",s:"b",q:"Jak długo standardowo usunięte rekordy pozostają w Recycle Bin?",a:["15 dni","30 dni","7 dni","90 dni"],e:"Standardowo usunięte rekordy pozostają w Recycle Bin przez 15 dni."},{id:"w07-17",s:"b",q:"Jaki warunek musi spełnić rekord, aby wykonać undelete?",a:["Musi być wcześniej usunięty i nadal nadawać się do przywrócenia","Musi mieć nowe Id","Musi być w Sandboxie","Musi być zablokowany"],e:"undelete wymaga, aby rekord był wcześniej usunięty i nadal nadawał się do przywrócenia (jest w Recycle Bin)."},{id:"w07-18",s:"b",q:"Co dzieje się po 'merge primaryAccount duplicateAccount'?",a:["primaryAccount zostaje rekordem głównym, duplicateAccount jest usuwany, a powiązane rekordy są podpinane do głównego","Oba rekordy są usuwane i tworzony jest nowy","duplicateAccount staje się rekordem głównym","Rekordy są tylko oznaczane jako duplikaty"],e:"primaryAccount pozostaje rekordem głównym, duplicateAccount jest usuwany, a powiązane rekordy trafiają do rekordu głównego."},{id:"w07-19",s:"c",q:"Który wzorzec jest poprawny przy wstawianiu wielu rekordów (bulk DML)?",a:["Dodać rekordy do listy w pętli i wykonać jeden insert listy po pętli","Wykonać insert każdego rekordu wewnątrz pętli","Wstawiać rekordy pojedynczo w osobnych triggerach","Użyć SOQL do wstawienia"],e:"Poprawnie: zbudować List<Account> w pętli i wykonać jeden insert, czyli jedną transakcję z bazą. Insert w pętli to anty-wzorzec."},{id:"w07-20",s:"c",q:"Dlaczego insert wewnątrz pętli for jest złym wzorcem?",a:["Generuje wiele operacji na bazie i szybko wyczerpuje limit 150 instrukcji DML","Bo Apex nie pozwala na insert w pętli","Bo rekordy nie dostaną Id","Bo pętla for nie działa z sObject"],e:"Każdy insert to osobne wywołanie DML, a limit to 150 na transakcję. Bulk DML wykonuje jedno wywołanie."},{id:"w07-21",s:"d",q:"Jaki wyjątek jest zgłaszany przy niepowodzeniu instrukcji DML?",a:["DmlException","QueryException","NullPointerException","SaveException"],e:"Niepowodzenie instrukcji DML zgłasza wyjątek, np. DmlException."},{id:"w07-22",s:"d",q:"Co może być przyczyną błędu DML?",a:["Brak wymaganego pola, reguła walidacji, ograniczenia relacji lub brak uprawnień","Tylko błąd sieci","Tylko przekroczenie limitu SOQL","Tylko błąd składni"],e:"Przyczyny: brak wymaganego pola, reguły walidacji, ograniczenia relacji, brak uprawnień."},{id:"w07-23",s:"e",q:"Co oferuje klasa Database ponad instrukcje DML?",a:["Kontrolę obsługi błędów, częściowe powodzenie i dostęp do wyników poszczególnych operacji","Szybsze wykonanie zapytań","Brak limitów","Automatyczne tworzenie obiektów Custom"],e:"Database daje kontrolę obsługi błędów, częściowe powodzenie operacji i dostęp do wyników poszczególnych operacji."},{id:"w07-24",s:"e",q:"Jaka jest domyślna wartość parametru allOrNone w metodach Database?",a:["true","false","null","Zależy od operacji"],e:"Domyślnie allOrNone = true, czyli atomowość analogiczna do instrukcji DML."},{id:"w07-25",s:"e",q:"Co oznacza Database.insert(records, false)?",a:["Częściowe powodzenie: poprawne rekordy zostaną zapisane, błędne nie","Wszystkie rekordy zostaną wycofane przy jakimkolwiek błędzie","Nie zostanie zapisany żaden rekord","Rekordy zostaną zapisane bez walidacji"],e:"allOrNone = false: poprawne rekordy mogą zostać zapisane, nawet jeśli inne nie zostaną."},{id:"w07-26",s:"e",q:"Lista: [Account(Name='A'), Account() bez Name, Account(Name='B')]. Ile kont zapisze Database.insert(lista, true)?",a:["0","2","1","3"],e:"Przy allOrNone = true błąd drugiego rekordu powoduje, że żadne z trzech kont nie zostanie zapisane."},{id:"w07-27",s:"e",q:"Ta sama lista (drugi rekord bez Name), ale Database.insert(lista, false). Co się stanie?",a:["Rekord 1 i 3 zostaną zapisane, rekord 2 nie","Żaden rekord nie zostanie zapisany","Wszystkie trzy zostaną zapisane","Zostanie rzucony DmlException"],e:"Częściowe powodzenie: rekordy 1 i 3 zostaną dodane, 2 nie. Metoda zwraca wyniki zamiast rzucać wyjątek."},{id:"w07-28",s:"e",q:"Czy allOrNone = false oznacza, że błędy są ignorowane?",a:["Nie, programista musi sprawdzić wyniki i zdecydować, co zrobić z błędnymi rekordami","Tak, błędy są ignorowane","Tak, ale tylko błędy walidacji","Nie, bo i tak rzucany jest wyjątek"],e:"Ważne: allOrNone = false nie oznacza ignorowania błędów. Trzeba je sprawdzić w wynikach."},{id:"w07-29",s:"e",q:"Jaki typ zwraca Database.insert()?",a:["Database.SaveResult (tablica dla listy)","Database.InsertResult","Database.UpsertResult","Boolean"],e:"insert() i update() zwracają Database.SaveResult."},{id:"w07-30",s:"e",q:"Jaki typ wyniku zwraca Database.upsert()?",a:["Database.UpsertResult","Database.SaveResult","Database.MergeResult","Database.UpdateResult"],e:"Metoda Database.upsert() zwraca wynik typu Database.UpsertResult."},{id:"w07-31",s:"e",q:"Jaki typ wyniku zwraca Database.update()?",a:["Database.SaveResult","Database.UpdateResult","Database.UpsertResult","Database.DeleteResult"],e:"Uwaga, pułapka: update() zwraca SaveResult, tak jak insert(). Nie istnieje UpdateResult."},{id:"w07-32",s:"e",q:"Jaki typ wyniku zwraca Database.delete()?",a:["Database.DeleteResult","Database.SaveResult","Database.UndeleteResult","Boolean"],e:"Database.delete() zwraca Database.DeleteResult. Odpowiednio undelete() zwraca UndeleteResult, a merge() MergeResult."},{id:"w07-33",s:"e",q:"Która metoda SaveResult sprawdza, czy operacja się powiodła?",a:["isSuccess()","getStatus()","hasErrors()","wasSaved()"],e:"isSuccess() sprawdza powodzenie, getId() zwraca Id zapisanego rekordu, getErrors() zwraca informacje o błędach."},{id:"w07-34",s:"e",q:"Która metoda SaveResult zwraca listę błędów (Database.Error)?",a:["getErrors()","getMessages()","getExceptions()","errors()"],e:"getErrors() zwraca obiekty Database.Error z metodą getMessage()."},{id:"w07-35",s:"e",q:"Gdzie są dostępne informacje o błędach przy użyciu metod klasy Database?",a:["W obiektach wynikowych, np. Database.SaveResult i Database.Error","Tylko w DmlException","W logu systemowym Org-a","Nie są dostępne"],e:"Instrukcje DML podają błędy w obiekcie wyjątku. Metody Database podają je w obiektach wynikowych (SaveResult, Error)."},{id:"w07-36",s:"e",q:"Kiedy zaleca się Database z allOrNone = false?",a:["Przy imporcie wielu rekordów, z których część może zawierać błędy","Przy prostym zapisie jednego rekordu","Gdy wszystkie rekordy muszą się powieść","Do dynamicznych zapytań SOQL"],e:"Import wielu rekordów, z których część może być błędna, to Database z allOrNone = false."},{id:"w07-37",s:"f",q:"Co jest zalecane do prostego zapisu jednego rekordu?",a:["Instrukcja DML (insert, update…)","Database.insert z allOrNone = false","Database.query()","Database.setSavepoint()"],e:"Prosty zapis jednego rekordu: insert, update itp."},{id:"w07-38",s:"f",q:"Która metoda służy do dynamicznych zapytań SOQL?",a:["Database.query()","Database.insert()","Database.search()","Database.select()"],e:"Dynamiczne zapytania SOQL wykonuje Database.query()."},{id:"w07-39",s:"f",q:"Jak wycofać zmiany do określonego punktu w transakcji?",a:["Database.setSavepoint() wraz z Database.rollback()","undelete","Database.revert()","Wyrzucić DmlException"],e:"Wycofywanie zmian: Database.setSavepoint() + Database.rollback()."},{id:"w07-40",s:"d",q:"Jak zachowuje się nieudana instrukcja DML wobec wcześniejszych operacji w transakcji?",a:["Nie zapisuje części rekordów, a wcześniejsze operacje w transakcji są automatycznie wycofywane","Zapisuje poprawne rekordy","Wycofuje tylko bieżący rekord","Nie ma wpływu na wcześniejsze operacje"],e:"Nieudana instrukcja DML nie zapisuje części rekordów, a wcześniejsze operacje są automatycznie wycofywane (jeśli wyjątek nie jest obsłużony)."},{id:"w07-41",s:"d",q:"Co jest potrzebne, aby kod kontynuował działanie po błędzie instrukcji DML?",a:["Obsłużenie wyjątku w bloku try-catch","Nic, kod zawsze kontynuuje","Użycie undelete","Ustawienie allOrNone = true"],e:"Instrukcje DML wymagają try-catch, jeśli kod ma kontynuować po błędzie."},{id:"w07-42",s:"f",q:"Co zawiera klasa Database poza metodami DML wg wykładu?",a:["Kontrolę transakcji, wycofanie działań i metody zapytań SOQL","Metody tworzenia obiektów Custom","Metody do budowy UI","Metody do wysyłania e-maili"],e:"Database poszerza DML m.in. o kontrolę transakcji, wycofanie działań i metody zapytań SOQL."}],wp={id:sp,title:lp,sections:cp,questions:dp},up="w08",zp="W8 · Apex SOQL",yp=[{id:"a",title:"SOQL: podstawy",text:"**SOQL** (Salesforce Object Query Language) służy do odczytu danych i ma tylko instrukcję **SELECT**. Modyfikacje wykonuje się przez DML. W kodzie Apex zapytanie zapisuje się w nawiasach kwadratowych `[ ]`. Wynikiem jest lista sObject, pojedynczy sObject lub Integer (dla `COUNT()`).\n\nPodstawowa struktura: `SELECT pola FROM obiekt WHERE warunki` (opcjonalnie `ORDER BY`). WHERE filtruje rekordy podobnie jak w SQL, np. `WHERE Industry = 'Technology' AND AnnualRevenue > 1000000`. W porównaniu z SQL w SOQL nie ma dowolnego JOIN, symboli wieloznacznych (`*`) ani zaawansowanych wyrażeń obliczeniowych."},{id:"b",title:"Zapytania na powiązanych obiektach",text:"Standardowe pola obiektu pobiera się przez `SELECT FIELDS(STANDARD) FROM Contact` (gwiazdka nie jest dozwolona).\n\n**Od strony Child** do obiektu nadrzędnego odwołujemy się notacją kropkową przez nazwę relacji (a nie przez klucz `AccountId`): `SELECT Contact.FirstName, Contact.Account.Name FROM Contact`.\n\n**Od strony Parent** używa się podzapytania z nazwą obiektu podrzędnego w liczbie mnogiej: `SELECT Name, (SELECT LastName FROM Contacts) FROM Account`.\n\nW obiektach użytkownika sufiks `__c` mają obiekty i pola, a `__r` relacje, np. `Mother_of_Child__r.FirstName__c`. Nazwę relacji nadaje programista, a sufiks `__r` dodaje się automatycznie. Przykład: `SELECT FirstName__c, Mother_of_Child__r.FirstName__c FROM Daughter__c WHERE Mother_of_Child__r.LastName__c LIKE 'C%'`."},{id:"c",title:"Zmienne w zapytaniach",text:"Wartość zmiennej Apex można użyć w SOQL, poprzedzając ją dwukropkiem, np. `WHERE LastName = :nazwisko`. To tak zwana zmienna wiązana (bind variable). Dzięki niej to samo zapytanie działa dla różnych wartości bez zmiany składni."},{id:"d",title:"Dodatkowe klauzule SOQL",text:`Mniej typowe klauzule:
• **TYPEOF** – warunkowy wybór pól zależnie od typu rekordu (obiekty polimorficzne),
• **USING SCOPE** – ogranicza dane do zakresu widoku,
• **WITH DATA CATEGORY** – filtruje artykuły Knowledge według kategorii danych,
• **FOR UPDATE** – blokuje rekordy w transakcji, żeby zapobiec konfliktom,
• **UPDATE TRACKING** i **UPDATE VIEWSTAT** – śledzenie rekordów i statystyki przeglądania,
• **FOR VIEW** i **FOR REFERENCE** – informują, że dane zostały wyświetlone lub użyte, co może wpłynąć na statystyki i współdzielenie.`},{id:"e",title:"Grupowanie, sortowanie i agregacje",text:"**GROUP BY** grupuje rekordy. Dodatkowo `ROLLUP` tworzy sumy częściowe i całkowite, a `CUBE` wszystkie możliwe kombinacje grupowań. **HAVING** filtruje grupy po agregacji (np. `HAVING COUNT(Id) > 10`), a `WHERE` filtruje rekordy przed grupowaniem.\n\n`ORDER BY CreatedDate DESC NULLS LAST` sortuje malejąco po dacie utworzenia, a puste wartości umieszcza na końcu. Do stronicowania służą **LIMIT** (ogranicza liczbę rekordów) i **OFFSET** (pomija podaną liczbę rekordów).\n\nFunkcje agregujące to MIN, MAX, SUM, AVG, COUNT i COUNT_DISTINCT (MEDIAN nie ma). Zapytanie z grupowaniem zwraca `List<AggregateResult>`, a wartości odczytuje się przez `ar.get('alias')`."},{id:"f",title:"Ograniczenia SOQL",text:`Ograniczenia SOQL:
• długość jednego zapytania do 100 000 znaków,
• do 200 pól w SELECT,
• do 50 000 zwróconych rekordów (10 000 to limit rekordów DML),
• do 100 zapytań w transakcji (kontekst synchroniczny; asynchroniczny do 200),
• dostęp do 5 poziomów relacji w dół i 1 w górę,
• nie ma wildcards ani aliasów i nie można agregować po podzapytaniu.

Przykład zagnieżdżonych podzapytań na 4 poziomach: Account → Contact → Asset → WorkOrder → WorkOrderLineItem (każda relacja 1:N).`}],pp=[{id:"w08-01",s:"a",q:"Co oznacza skrót SOQL?",a:["Salesforce Object Query Language","Structured Object Query Language","Salesforce Online Query Logic","Simple Object Query Language"],e:"SOQL to skrót od Salesforce Object Query Language."},{id:"w08-02",s:"a",q:"Jak umieszcza się zapytanie SOQL inline w kodzie Apex?",a:["W nawiasach kwadratowych [ ]","W nawiasach klamrowych { }","W cudzysłowach i metodzie execute()","W znacznikach <soql>"],e:"SOQL jest używany inline w kodzie Apex w blokach [ ]."},{id:"w08-03",s:"a",q:"Co może być rezultatem zapytania SOQL?",a:["Lista sObject, pojedynczy sObject lub Integer (dla funkcji agregujących jak count)","Tylko lista sObject","Tylko JSON","Tylko pojedynczy rekord"],e:"Wynik SOQL to lista sObject (rekordów), pojedynczy sObject albo Integer dla COUNT()."},{id:"w08-04",s:"a",q:"Jaki typ zwraca: [SELECT COUNT() FROM Contact WHERE LastName = 'ORLEN']?",a:["Integer","List<Contact>","AggregateResult","Contact"],e:"Zapytanie SELECT COUNT() zwraca wartość typu Integer."},{id:"w08-05",s:"a",q:"Jakie instrukcje oferuje SOQL?",a:["Tylko SELECT","SELECT, INSERT, UPDATE, DELETE","SELECT i UPDATE","SELECT i MERGE"],e:"SOQL ma tylko SELECT. Modyfikacje wykonuje się przez DML."},{id:"w08-06",s:"a",q:"Czego NIE ma w SOQL w porównaniu z SQL?",a:["Dowolnego łączenia tabel za pomocą JOIN i symboli wieloznacznych *","Klauzuli WHERE","Klauzuli ORDER BY","Funkcji COUNT"],e:"W SOQL nie ma dowolnego JOIN, symboli wieloznacznych * ? ani zaawansowanych wyrażeń obliczeniowych."},{id:"w08-07",s:"b",q:"Jak pobrać tylko standardowe pola obiektu Contact?",a:["SELECT FIELDS(STANDARD) FROM Contact","SELECT * FROM Contact","SELECT STANDARD FROM Contact","SELECT ALL FROM Contact"],e:"SELECT FIELDS(STANDARD) FROM Contact. Gwiazdka * nie jest dozwolona."},{id:"w08-08",s:"b",q:"Jak pobrać imiona kontaktów oraz nazwy powiązanych kont (zapytanie od strony Child)?",a:["SELECT Contact.FirstName, Contact.Account.Name FROM Contact","SELECT FirstName, AccountId.Name FROM Contact JOIN Account","SELECT Name, (SELECT FirstName FROM Contacts) FROM Contact","SELECT FirstName FROM Contact, Account"],e:"Od strony obiektu podrzędnego używa się notacji kropkowej po nazwie relacji: Contact.Account.Name."},{id:"w08-09",s:"b",q:"Jak pobrać nazwy kont i nazwiska powiązanych kontaktów (zapytanie od strony Parent)?",a:["SELECT Name, (SELECT LastName FROM Contacts) FROM Account","SELECT Name, Contact.LastName FROM Account","SELECT Name, (SELECT LastName FROM Contact) FROM Account","SELECT Account.Name JOIN Contact"],e:"Od strony Parent używa się podzapytania po nazwie relacji w liczbie mnogiej: Contacts."},{id:"w08-10",s:"b",q:"Jak nazywa się lista rekordów podrzędnych w podzapytaniu od strony Parent (Account → Contact)?",a:["Contacts – nazwa obiektu Child w liczbie mnogiej","Contact","Contact__r","ContactList"],e:"Nazwa listy to nazwa obiektu Child w liczbie mnogiej, tutaj Contacts."},{id:"w08-11",s:"b",q:"Jak w zapytaniu od strony Child odwołujemy się do obiektu Parent?",a:["Przez nazwę relacji (np. Account), a nie przez klucz (AccountId)","Przez klucz AccountId","Przez JOIN","Przez podzapytanie"],e:"Posługujemy się nazwą relacji (Account.Name), a nie kluczem (AccountId)."},{id:"w08-12",s:"b",q:"Jaki sufiks mają relacje użytkownika używane w zapytaniach SOQL (np. Mother_of_Child)?",a:["__r","__c","__rel","s (liczba mnoga)"],e:"Obiekty użytkownika mają sufiks __c, relacje użytkownika __r, np. Mother_of_Child__r.FirstName__c."},{id:"w08-13",s:"b",q:"Kto nadaje nazwę relacji niestandardowej (np. Mother_of_Child)?",a:["Programista","Salesforce automatycznie z nazwy obiektu","Administrator bazy w SQL","Nazwa jest zawsze równa nazwie obiektu Parent"],e:"Nazwa relacji jest nadawana przez programistę, a sufiks __r jest dodawany automatycznie."},{id:"w08-14",s:"b",q:"Które zapytanie poprawnie pobiera córki, których nazwisko matki zaczyna się na 'C'?",a:["SELECT FirstName__c, Mother_of_Child__r.FirstName__c FROM Daughter__c WHERE Mother_of_Child__r.LastName__c LIKE 'C%'","SELECT FirstName__c FROM Daughter__c WHERE Mother_of_Child__c.LastName__c LIKE 'C*'","SELECT * FROM Daughter__c JOIN Mother__c WHERE LastName LIKE 'C%'","SELECT FirstName__c, Mother__c.FirstName__c FROM Daughter__c WHERE Mother__c.LastName__c = 'C%'"],e:"Przez relację odwołujemy się sufiksem __r. LIKE 'C%' działa jak w SQL, bez * i JOIN."},{id:"w08-15",s:"c",q:"Jak użyć wartości zmiennej Apex w zapytaniu SOQL?",a:["Poprzedzając ją dwukropkiem, np. WHERE LastName = :nazwisko","Przez konkatenację: 'WHERE LastName = ' + nazwisko","Przez ${nazwisko}","Przez ?nazwisko"],e:"Dwukropek : pozwala wykorzystać zmienną Apex jako parametr zapytania (bind variable)."},{id:"w08-16",s:"c",q:"Jaka jest korzyść z bind variables (:zmienna) w SOQL?",a:["To samo zapytanie może być wykonywane dla różnych wartości bez modyfikowania jego składni","Zapytanie wykonuje się asynchronicznie","Omijają limity SOQL","Pozwalają używać *"],e:"Dzięki dwukropkowi to samo zapytanie działa dla różnych wartości bez zmiany składni."},{id:"w08-17",s:"d",q:"Do czego służy TYPEOF w SOQL?",a:["Do warunkowego wyboru pól w zależności od typu rekordu (obiekty polimorficzne)","Do rzutowania typów pól","Do sprawdzania typu danych kolumny","Do tworzenia nowych typów"],e:"TYPEOF warunkowo wybiera pola zależnie od typu rekordu, np. TYPEOF What WHEN Account THEN Name, Industry … END FROM Event."},{id:"w08-18",s:"d",q:"Do czego służy USING SCOPE w SOQL?",a:["Ogranicza dane do określonego zakresu widoku","Określa transakcję","Ogranicza liczbę rekordów","Blokuje rekordy"],e:"USING SCOPE ogranicza dane do określonego zakresu widoku, np. USING SCOPE My_View."},{id:"w08-19",s:"d",q:"Do czego służy WITH DATA CATEGORY?",a:["Do filtrowania artykułów Knowledge według kategorii danych","Do grupowania rekordów","Do sortowania wyników","Do filtrowania po typie rekordu"],e:"WITH DATA CATEGORY filtruje artykuły (obiekty Knowledge) według kategorii danych."},{id:"w08-20",s:"e",q:"Co robi ROLLUP w klauzuli GROUP BY?",a:["Tworzy sumy częściowe i całkowite","Tworzy wszystkie możliwe kombinacje grupowań","Usuwa duplikaty","Sortuje grupy"],e:"ROLLUP to sumy częściowe i całkowite. CUBE to wszystkie możliwe kombinacje grupowań."},{id:"w08-21",s:"e",q:"Co robi CUBE w klauzuli GROUP BY?",a:["Tworzy wszystkie możliwe kombinacje grupowań","Tworzy sumy częściowe i całkowite","Zwraca dane w formacie 3D","Grupuje po wszystkich polach"],e:"CUBE tworzy wszystkie możliwe kombinacje grupowań."},{id:"w08-22",s:"e",q:"Do czego służy HAVING?",a:["Do filtrowania grup po agregacji, np. HAVING COUNT(Id) > 10","Do filtrowania rekordów przed grupowaniem","Do sortowania","Do paginacji"],e:"HAVING filtruje wyniki agregacji (grupy). WHERE filtruje rekordy przed grupowaniem."},{id:"w08-23",s:"e",q:"Co oznacza ORDER BY CreatedDate DESC NULLS LAST?",a:["Sortowanie malejąco po dacie utworzenia, wartości null na końcu","Sortowanie rosnąco, null na początku","Pomija rekordy z null","Sortuje tylko ostatnie rekordy"],e:"DESC = malejąco, NULLS LAST = wartości puste na końcu."},{id:"w08-24",s:"e",q:"Które klauzule służą do paginacji wyników SOQL?",a:["LIMIT i OFFSET","GROUP BY i HAVING","FOR VIEW i FOR REFERENCE","TYPEOF i USING SCOPE"],e:"Paginacja: OFFSET pomija określoną liczbę rekordów, LIMIT ogranicza liczbę rekordów."},{id:"w08-25",s:"e",q:"Co robi klauzula OFFSET?",a:["Pomija określoną liczbę rekordów","Ogranicza liczbę zwracanych rekordów","Przesuwa strefę czasową","Blokuje rekordy"],e:"OFFSET pomija rekordy, LIMIT ogranicza ich liczbę."},{id:"w08-26",s:"d",q:"Co robi klauzula FOR UPDATE?",a:["Blokuje rekordy do edycji w transakcji Apex, aby zapobiec konfliktom","Aktualizuje zwrócone rekordy","Aktualizuje statystyki przeglądania","Oznacza rekordy jako ostatnio używane"],e:"FOR UPDATE blokuje rekordy w transakcji, np. SELECT Id FROM Account WHERE Name = 'Acme' FOR UPDATE."},{id:"w08-27",s:"d",q:"Czego dotyczą klauzule UPDATE TRACKING i UPDATE VIEWSTAT?",a:["Śledzenia rekordów (np. ostatnio użyte) i statystyk przeglądania","Blokowania rekordów","Aktualizacji wartości pól","Wersjonowania API"],e:"UPDATE TRACKING to śledzenie rekordów, UPDATE VIEWSTAT to statystyki przeglądania."},{id:"w08-28",s:"d",q:"Co oznaczają FOR VIEW / FOR REFERENCE?",a:["Informację, że dane zostały wyświetlone lub użyte do odniesienia (wpływa na statystyki i współdzielenie)","Blokadę rekordów","Tryb tylko do odczytu","Pobranie danych z widoku listy"],e:"FOR VIEW i FOR REFERENCE informują, że dane zostały wyświetlone lub użyte, co może wpłynąć na statystyki i reguły współdzielenia."},{id:"w08-29",s:"e",q:"Która funkcja NIE jest funkcją agregującą SOQL?",a:["MEDIAN()","COUNT_DISTINCT()","AVG()","SUM()"],e:"Funkcje agregujące: MIN, MAX, SUM, AVG, COUNT, COUNT_DISTINCT."},{id:"w08-30",s:"e",q:"Jaki typ zwraca zapytanie z GROUP BY i funkcjami agregującymi (np. COUNT(Id))?",a:["List<AggregateResult>","List<Account>","Integer","Map<String, Integer>"],e:"Zapytania agregujące zwracają List<AggregateResult>, a wartości odczytuje się przez ar.get('alias')."},{id:"w08-31",s:"e",q:"Jak odczytać wartość z AggregateResult?",a:["ar.get('totalAccounts')","ar.totalAccounts","ar['totalAccounts']","ar.getValue(1)"],e:"Wartości odczytuje się metodą get z nazwą pola/aliasu: ar.get('Industry'), ar.get('totalAccounts')."},{id:"w08-32",s:"f",q:"Jaka jest maksymalna długość jednego zapytania SOQL?",a:["100 000 znaków","10 000 znaków","1 000 000 znaków","32 768 znaków"],e:"Pojedyncze zapytanie SOQL może mieć najwyżej 100 000 znaków."},{id:"w08-33",s:"f",q:"Ile maksymalnie pól można umieścić w SELECT?",a:["200","100","500","50"],e:"W klauzuli SELECT można umieścić najwyżej 200 pól."},{id:"w08-34",s:"f",q:"Ile maksymalnie rekordów zwraca SOQL?",a:["50 000","10 000","100 000","2 000"],e:"Liczba zwracanych rekordów ≤ 50 000. (10 000 to limit rekordów DML.)"},{id:"w08-35",s:"f",q:"Ile maksymalnie zapytań SOQL można wykonać w pojedynczej transakcji (wg slajdu ograniczeń)?",a:["100","150","200","50"],e:"Liczba zapytań w pojedynczej transakcji ≤ 100 (kontekst synchroniczny; asynchroniczny 200)."},{id:"w08-36",s:"f",q:"Ile poziomów relacji w dół i w górę obsługuje SOQL wg wykładu?",a:["5 w dół i 1 w górę","1 w dół i 5 w górę","5 w obie strony","Bez ograniczeń"],e:"SOQL daje dostęp do 5 poziomów relacji w dół i 1 poziomu w górę."},{id:"w08-37",s:"f",q:"Które stwierdzenie o SOQL jest prawdziwe wg slajdu ograniczeń?",a:["Nie można agregować po podzapytaniu","Można używać wildcards (*)","Brak limitu zwracanych rekordów","Można stosować dowolny JOIN"],e:"Ograniczenia: brak wildcards, brak aliasów, nie można agregować po podzapytaniu."},{id:"w08-38",s:"f",q:"Który łańcuch obiektów pokazano jako przykład zagnieżdżonych podzapytań na 4 poziomach?",a:["Account → Contact → Asset → WorkOrder → WorkOrderLineItem","Account → Opportunity → Quote → Order → Invoice","User → Role → Profile → Permission → Object","Lead → Contact → Account → Case → Task"],e:"Przykład: Account 1:N Contact 1:N Asset 1:N WorkOrder 1:N WorkOrderLineItem."},{id:"w08-39",s:"a",q:"Jak brzmi podstawowa struktura zapytania SOQL?",a:["SELECT pola FROM obiekt WHERE warunki (opcjonalnie ORDER BY)","FROM obiekt SELECT pola","GET pola IN obiekt","QUERY obiekt FILTER warunki"],e:"SELECT one or more fields FROM an object WHERE filter statements, opcjonalnie z sortowaniem."},{id:"w08-40",s:"a",q:"Która klauzula SOQL filtruje rekordy analogicznie do SQL?",a:["WHERE","WITH","USING","HAVING"],e:"WHERE filtruje rekordy analogicznie do SQL, np. WHERE Industry = 'Technology' AND AnnualRevenue > 1000000."}],kp={id:up,title:zp,sections:yp,questions:pp},mp="w09",jp="W9 · Wyzwalacze (triggery) Apex",gp=[{id:"a",title:"Czym jest trigger",text:"**Trigger** (wyzwalacz) to kod Apex uruchamiany przez środowisko pod wpływem zdarzenia na obiektach w bazie danych. Składnia: `trigger TriggerName on ObjectName (trigger_events) { ... }`. Jeśli w triggerze wystąpi błąd, wszystkie zmiany wykonane w jego obrębie są wycofywane. Metoda `addError('...')` zatrzymuje zapis danego rekordu i pokazuje użytkownikowi komunikat."},{id:"b",title:"Zmienne kontekstowe triggera",text:"Zmienne kontekstowe znajdują się w klasie `System.Trigger`. Pozwalają sprawdzić operację DML, przetwarzane rekordy i to, czy trigger działa przed zapisem, czy po nim, dzięki czemu można pisać uniwersalne triggery.\n\nKolekcje rekordów:\n• `Trigger.new` – `List<SObject>` nowych wersji rekordów,\n• `Trigger.old` – stare wersje rekordów,\n• `Trigger.newMap` i `Trigger.oldMap` – `Map<Id, SObject>`, czyli rekordy według Id,\n• `Trigger.size` – liczba rekordów w triggerze (Integer).\n\nFlagi (wszystkie typu Boolean): `isBefore` (przed zapisem), `isAfter` (po zapisie), `isUndelete` (po przywróceniu z kosza), `isExecuting` (czy to trigger wywołał bieżący kod), a także `isInsert` i podobne."},{id:"c",title:"Zdarzenia triggerów",text:"Triggery mają **7 zdarzeń**: before insert, before update, before delete oraz after insert, after update, after delete, after undelete. Zdarzenia „before undelete” nie ma.\n\n• **before insert / before update** – można zmieniać pola rekordów przed zapisem, bez dodatkowego DML,\n• **after insert** – rekord ma już Id, więc można tworzyć powiązane rekordy,\n• **after update** – dane są już zapisane i pól z `Trigger.new` nie można zmieniać,\n• **before delete** – można zablokować usunięcie przez `addError()`,\n• **after delete** – dane są już usunięte, dostępne jest tylko `Trigger.old`,\n• **after undelete** – po przywróceniu z kosza, używane rzadko.\n\nDostępność kolekcji: w before insert jest tylko `Trigger.new` (nie ma starej wersji nowego rekordu). `Trigger.new` i `Trigger.old` są dostępne razem tylko przy update (before i after). W before delete jest tylko `Trigger.old`, a w after undelete tylko `Trigger.new`."},{id:"d",title:"Przykłady triggerów",text:"Przykłady z wykładu:\n• Ustawienie `Title = 'Nie określono'` w nowych kontaktach bez tytułu: **before insert**, wystarczy przypisać wartość w `Trigger.new`. Puste pole lub pole ze spacjami sprawdza `String.isBlank()`.\n• Normalizacja e-maila w Lead: w before insert wystarczy `Email = Email.trim().toLowerCase();`, bez DML.\n• Błąd przypisany do pola: `acc.Name.addError('...')`, a do całego rekordu: `acc.addError('...')`.\n• Opportunity (before update): jeśli szansa nie jest zamknięta (`IsClosed == false`), a `CloseDate` jest w przeszłości, trigger wywołuje `opp.CloseDate.addError(...)`.\n• Tworzenie zadań (Task) po utworzeniu Account: after insert, zadania zbiera się w `List<Task>` w pętli i robi się jeden `insert` po pętli. Zadanie łączy z kontem pole `WhatId = acc.Id`.\n• Blokada usuwania kont typu „Customer”: before delete, iteruje się po `Trigger.old`, bo `Trigger.new` jest niedostępne.\n• Trigger `myAccountTrigger`: dla `Industry == null` ustawia `'General'`, a `addError` wywołuje tylko przy przychodzie powyżej miliarda."}],bp=[{id:"w09-01",s:"a",q:"Czym jest trigger (wyzwalacz) Apex?",a:["Kodem Apex uruchamianym przez środowisko pod wpływem zdarzenia na obiektach (w bazie danych)","Przyciskiem w interfejsie użytkownika","Zapytaniem SOQL wykonywanym cyklicznie","Deklaratywną regułą walidacji"],e:"Trigger to kod Apex uruchamiany przez środowisko pod wpływem zdarzenia na obiektach w bazie danych."},{id:"w09-02",s:"a",q:"Co dzieje się ze zmianami wykonanymi w triggerze w przypadku błędu?",a:["Wszystkie zmiany wykonane w obrębie triggera są wycofywane","Zmiany są zachowywane","Wycofywany jest tylko ostatni rekord","Zmiany trafiają do Recycle Bin"],e:"Przy błędzie wszystkie zmiany wykonane w obrębie triggera są wycofywane."},{id:"w09-03",s:"a",q:"Jaka jest poprawna składnia definicji triggera?",a:["trigger TriggerName on ObjectName (trigger_events) { … }","trigger ObjectName for TriggerName { … }","on ObjectName trigger TriggerName (events) { … }","public trigger TriggerName extends ObjectName { … }"],e:"Składnia: trigger TriggerName on ObjectName (trigger_events) { //code_block }."},{id:"w09-04",s:"a",q:"Co robi acc.addError('…') w triggerze?",a:["Zatrzymuje zapis danego rekordu i wyświetla komunikat użytkownikowi","Zapisuje błąd w logu, ale rekord jest zapisywany","Usuwa rekord","Rzuca DmlException, którego nie można obsłużyć"],e:"addError() zatrzymuje zapis danego rekordu i wyświetla komunikat użytkownikowi."},{id:"w09-05",s:"b",q:"Czym jest Trigger.new?",a:["Kolekcją (List<SObject>) nowych wersji rekordów, na których działa trigger","Mapą starych rekordów","Liczbą rekordów","Flagą operacji insert"],e:"Trigger.new: List<SObject>, czyli nowe wersje rekordów."},{id:"w09-06",s:"b",q:"Jaki typ ma Trigger.newMap?",a:["Map<Id, SObject>","List<SObject>","Set<Id>","Map<String, Object>"],e:"Trigger.newMap i Trigger.oldMap to Map<Id, SObject>, czyli mapowanie rekordów po Id."},{id:"w09-07",s:"b",q:"Co zwraca Trigger.size?",a:["Liczbę rekordów w triggerze (Integer)","Rozmiar triggera w bajtach","Liczbę zdarzeń obsługiwanych przez trigger","Liczbę pól obiektu"],e:"Trigger.size: Integer, czyli liczba rekordów w triggerze."},{id:"w09-08",s:"c",q:"W którym zdarzeniu można modyfikować dane rekordu przed zapisem (bez dodatkowego DML)?",a:["before insert / before update","after insert","after update","after delete"],e:"W before insert i before update można modyfikować dane przed zapisem. W after update dane są już zapisane i nie można zmieniać pól."},{id:"w09-09",s:"c",q:"Do czego typowo używa się zdarzenia before delete?",a:["Do zablokowania usunięcia, np. przez addError()","Do przywracania rekordu","Do nadawania Id","Do modyfikacji pól przed wstawieniem"],e:"before delete: przed usunięciem, można zablokować usunięcie przez addError()."},{id:"w09-10",s:"c",q:"Dlaczego after insert stosuje się do tworzenia powiązanych rekordów?",a:["Bo rekord ma już Id, którego można użyć w rekordach powiązanych","Bo w after insert można zmieniać pola rekordu","Bo after insert nie ma limitów","Bo before insert nie widzi Trigger.new"],e:"after insert: rekord ma już Id, używane np. do tworzenia powiązanych rekordów."},{id:"w09-11",s:"c",q:"Co jest prawdą o after update?",a:["Dane są już zapisane w bazie; nie można zmieniać pól (rekordów z Trigger.new)","Można dowolnie modyfikować Trigger.new","Trigger.old jest niedostępne","Rekord nie ma jeszcze Id"],e:"after update: dane są już zapisane, nie można zmieniać pól."},{id:"w09-12",s:"c",q:"Która kolekcja jest dostępna w after delete?",a:["Tylko Trigger.old","Tylko Trigger.new","Obie","Żadna"],e:"after delete: dane są już usunięte, dostępne tylko Trigger.old."},{id:"w09-13",s:"c",q:"Kiedy uruchamia się after undelete?",a:["Po przywróceniu rekordu z kosza","Po trwałym usunięciu rekordu","Przed usunięciem","Po scaleniu rekordów"],e:"after undelete: po przywróceniu rekordu z kosza, używane rzadko (np. do ponownego powiązania danych)."},{id:"w09-14",s:"c",q:"Czy Trigger.old jest dostępne w before insert?",a:["Nie","Tak","Tylko dla obiektów Custom","Tylko w trybie bulk"],e:"W before insert dostępne jest Trigger.new, ale nie Trigger.old, bo nowy rekord nie ma jeszcze starej wersji."},{id:"w09-15",s:"c",q:"W których zdarzeniach dostępne są zarówno Trigger.new, jak i Trigger.old?",a:["before update i after update","before insert i after insert","before delete i after delete","after undelete"],e:"Obie kolekcje są dostępne tylko przy update (before i after)."},{id:"w09-16",s:"c",q:"Czy Trigger.new jest dostępne w before delete?",a:["Nie, dostępne jest tylko Trigger.old","Tak","Tak, ale jest puste","Tylko w after delete"],e:"W before delete nie ma Trigger.new, dostępne jest tylko Trigger.old."},{id:"w09-17",s:"c",q:"Która kolekcja jest dostępna w after undelete?",a:["Trigger.new","Trigger.old","Obie","Żadna"],e:"W after undelete dostępne jest Trigger.new, a Trigger.old nie."},{id:"w09-18",s:"b",q:"W jakiej klasie zawarte są zmienne kontekstowe triggera?",a:["System.Trigger","Database.Trigger","Apex.Context","Schema.Trigger"],e:"Zmienne kontekstowe zawarte są w klasie System.Trigger."},{id:"w09-19",s:"b",q:"Do czego służą zmienne kontekstowe triggera?",a:["Pozwalają sprawdzić kontekst DML, przetwarzane rekordy i czy to before/after, co umożliwia pisanie uniwersalnych triggerów","Do przechowywania danych między transakcjami","Do definiowania pól obiektu","Do konfiguracji uprawnień"],e:"Zmienne kontekstowe pozwalają sprawdzić operację, rekordy, before/after i dodatkowe informacje, co umożliwia uniwersalne triggery."},{id:"w09-20",s:"b",q:"Która flaga mówi, że trigger działa przed zapisaniem danych?",a:["Trigger.isBefore","Trigger.isInsert","Trigger.isExecuting","Trigger.isAfter"],e:"Trigger.isBefore: przed zapisem. Trigger.isAfter: po zapisie."},{id:"w09-21",s:"b",q:"Co oznacza flaga Trigger.isExecuting?",a:["Że to trigger wywołał bieżący kod","Że trigger jest w trakcie insert","Że trigger jest wyłączony","Że trigger działa asynchronicznie"],e:"Trigger.isExecuting: czy trigger wywołał ten kod."},{id:"w09-22",s:"b",q:"Która flaga oznacza, że trigger działa po przywróceniu rekordu z kosza?",a:["Trigger.isUndelete","Trigger.isDelete","Trigger.isRestore","Trigger.isAfter"],e:"Trigger.isUndelete: działa po przywróceniu rekordu z kosza."},{id:"w09-23",s:"b",q:"Jakiego typu są flagi kontekstowe (isInsert, isBefore…)?",a:["Boolean","Integer","String","Enum"],e:"Wszystkie flagi kontekstowe triggera (isInsert, isBefore itd.) są typu Boolean."},{id:"w09-24",s:"d",q:"Trigger ma ustawić Title = 'Nie określono' w nowych kontaktach bez tytułu. Jakie zdarzenie wybrać?",a:["before insert","after insert","before delete","after update"],e:"Modyfikacja pól przed zapisem nowego rekordu to before insert: wystarczy przypisać wartość w Trigger.new, bez DML."},{id:"w09-25",s:"d",q:"Jak sprawdzić, że pole tekstowe jest puste lub zawiera tylko spacje?",a:["String.isBlank(con.Title)","con.Title == ''","con.Title.isEmpty()","String.isNull(con.Title)"],e:"String.isBlank() zwraca true dla null, pustego i białych znaków. Używane w przykładach z wykładu."},{id:"w09-26",s:"d",q:"Jak dodać błąd przypisany do konkretnego pola (a nie całego rekordu)?",a:["acc.Name.addError('…')","acc.addFieldError('Name', '…')","Trigger.addError(acc.Name)","throw new FieldException('Name')"],e:"acc.Name.addError('…') przypisuje błąd do pola Name. acc.addError('…') przypisuje go do całego rekordu."},{id:"w09-27",s:"d",q:"Jaki warunek sprawdza trigger dla Opportunity z wykładu (before update)?",a:["Czy otwarta szansa (IsClosed == false) ma CloseDate w przeszłości","Czy kwota przekracza 1 mld","Czy brak nazwy","Czy Type = 'Customer'"],e:"Jeśli szansa nie jest zamknięta, a CloseDate < Date.today(), to opp.CloseDate.addError(…)."},{id:"w09-28",s:"d",q:"Jak w triggerze before insert na Lead znormalizować e-mail do małych liter?",a:["leadRecord.Email = leadRecord.Email.trim().toLowerCase();","update leadRecord.Email.toLowerCase();","insert leadRecord.Email.lower();","Trigger.new.Email = lower(Email);"],e:"W before insert wystarczy przypisać wartość: Email = Email.trim().toLowerCase(). Nie potrzeba DML."},{id:"w09-29",s:"d",q:"Trigger after insert na Account tworzy zadania (Task). Jaki jest poprawny wzorzec?",a:["Zebrać Taski w liście w pętli i wykonać jeden insert po pętli","Wykonać insert Task wewnątrz pętli dla każdego konta","Zmodyfikować Trigger.new, dodając Taski","Użyć before insert, bo konto nie ma jeszcze Id"],e:"Zbieramy w List<Task> i wykonujemy insert raz (bulk). Task.WhatId = acc.Id wymaga after insert."},{id:"w09-30",s:"d",q:"Którą kolekcję iteruje trigger before delete blokujący usunięcie kont typu 'Customer'?",a:["Trigger.old","Trigger.new","Trigger.newMap","Trigger.size"],e:"W before delete Trigger.new jest niedostępne, więc iteruje się po Trigger.old."},{id:"w09-31",s:"d",q:"Jakie pole Task łączy zadanie z kontem w przykładzie z wykładu?",a:["WhatId","AccountId","WhoId","ParentId"],e:"W przykładzie z wykładu zadanie łączy z kontem pole WhatId, któremu przypisuje się acc.Id."},{id:"w09-32",s:"d",q:"Co zrobi trigger myAccountTrigger (before insert, before update), gdy Industry == null?",a:["Ustawi Industry = 'General'","Zablokuje zapis","Usunie rekord","Nic"],e:"if (acc.Industry == null) acc.Industry = 'General'; addError jest wywoływane tylko, gdy AnnualRevenue > 1 mld."},{id:"w09-33",s:"c",q:"Ile zdarzeń wyzwalaczy łącznie omówiono (grupy before i after)?",a:["7 (3 before + 4 after)","6 (3 + 3)","8 (4 + 4)","4"],e:"before: insert, update, delete. after: insert, update, delete, undelete. Nie ma 'before undelete'."},{id:"w09-34",s:"c",q:"Które zdarzenie NIE istnieje?",a:["before undelete","after undelete","before delete","after delete"],e:"Zdarzenie undelete występuje tylko w wariancie after, więc „before undelete” nie istnieje."}],fp={id:mp,title:jp,sections:gp,questions:bp},hp="w10",Sp="W10 · Podstawy LWC",Cp=[{id:"a",title:"Czym jest LWC",text:"**Lightning Web Components (LWC)** to nowoczesny framework Salesforce do budowania interfejsów w aplikacjach Lightning. Opiera się na natywnych standardach webowych: **Custom Elements** (własne znaczniki, np. `<c-my-component>`; camelCase jest zamieniany na kebab-case z prefiksem `c-`), **HTML Templates**, **Shadow DOM** (izolacja stylów i logiki) oraz **ES6 Modules**."},{id:"b",title:"Struktura komponentu",text:"Komponent LWC tworzy się w katalogu `force-app/main/default/lwc/<nazwaKomponentu>/`. Nazwa katalogu i plików to nazwa komponentu. Pliki komponentu:\n• `.html` – szablon,\n• `.js` – logika,\n• `.js-meta.xml` – metadane,\n• `.css` – styl (opcjonalny),\n• `.svg` – ikona komponentu, np. w Lightning App Builder (opcjonalny).\n\nKomponent instaluje się w Org-u poleceniem **SFDX: Deploy This Source To Org** w VS Code."},{id:"c",title:"Plik .html i .css",text:"Szablon `.html` definiuje strukturę i elementy UI. Głównym, wymaganym kontenerem jest `<template>`. W szablonie używa się HTML, komponentów Lightning Base Components (np. `<lightning-input>`) oraz dyrektyw: `for:each`, `if:true`, `lwc:if`. Pozostałe przykłady z pytań to dyrektywy Vue i Angulara.\n\nZapis `{name}` to wiązanie danych (data binding) z właściwością z pliku `.js`. Atrybut `onchange={handleChange}` wywołuje metodę `handleChange` z pliku `.js` przy zmianie wartości.\n\nStyle z pliku `.css` są domyślnie ograniczone do komponentu (CSS scoping, Shadow DOM) i mogą współpracować z Salesforce Lightning Design System (SLDS). Selektor `:host` oznacza główny element komponentu."},{id:"d",title:"Plik .js i klasa LightningElement",text:"Plik `.js` zawiera logikę: właściwości, metody, obsługę zdarzeń, komunikację, pobieranie i aktualizację danych (przez Apex lub Lightning Data Service) oraz metody cyklu życia. Przykład (Hello World): `import { LightningElement, track } from 'lwc';` oraz `export default class ...`. Wyrażenie `export default` udostępnia klasę komponentu platformie.\n\n`LightningElement` to klasa bazowa każdego komponentu: zapewnia renderowanie HTML, reaktywność (`@track`, `@api`), zdarzenia i cykl życia (np. `connectedCallback()`, `disconnectedCallback()`). Dekorator `@track` gwarantuje automatyczną zmianę w szablonie po zmianie wartości, a `@api` udostępnia właściwość komponentowi nadrzędnemu. Nową wartość pola odczytuje się w handlerze przez `event.target.value`."},{id:"e",title:"Plik .js-meta.xml",text:"Plik `.js-meta.xml` określa, czy komponent jest dostępny w Lightning App Builder i gdzie może być używany (targets), a także etykietę, opis i właściwości konfiguracyjne. Wartość `<isExposed>true</isExposed>` oznacza, że komponent jest widoczny w UI. Targety to np. `lightning__AppPage` (strona aplikacji), `lightning__RecordPage` (strona rekordu) i `lightning__HomePage` (strona główna)."},{id:"f",title:"Zalety i środowisko uruchomienia LWC",text:"Zalety LWC: oparcie na standardach webowych, integracja z platformą, wydajność (wykorzystuje natywne API przeglądarki, więc jest szybszy niż starszy framework Aura), możliwość ponownego użycia i bezpieczeństwo (wbudowany Salesforce Locker Service chroni przed złośliwym kodem). LWC uruchamia się bezpośrednio w przeglądarce użytkownika, a z backendem komunikuje się np. przez Apex."},{id:"g",title:"Gdzie można użyć LWC",text:`Komponenty LWC można umieścić w wielu miejscach:
• **Utility Bar** – narzędzia dostępne z paska narzędzi aplikacji,
• **Lightning Out** – osadzanie komponentów Lightning w zewnętrznych aplikacjach internetowych,
• **Custom Tabs** – komponenty jako samodzielne karty aplikacji,
• **Flow Screens** – komponenty jako elementy ekranów w Salesforce Flow,
• **Experience Cloud** – interfejsy portali i społeczności,
• **Record Pages** – prezentacja i obsługa danych konkretnego rekordu,
• **App Pages** – własne strony aplikacji.`}],Tp=[{id:"w10-01",s:"a",q:"Czym jest Lightning Web Components (LWC)?",a:["Nowoczesnym frameworkiem Salesforce do budowania UI w aplikacjach Lightning, opartym na natywnych technologiach webowych","Językiem programowania backendu Salesforce","Narzędziem low-code do budowy procesów","Starszym frameworkiem zastąpionym przez Aurę"],e:"LWC to nowoczesny framework Salesforce do budowania interfejsów, bazujący na natywnych standardach webowych."},{id:"w10-02",s:"a",q:"Na jakich natywnych technologiach webowych bazuje LWC?",a:["HTML Custom Elements, HTML Templates, Shadow DOM, ES6 Modules","jQuery, Bootstrap, AngularJS","Visualforce, Aura, Apex","React, JSX, Redux"],e:"LWC bazuje na Custom Elements (<c-my-component>), HTML Templates, Shadow DOM (izolacja) i ES6 Modules."},{id:"w10-03",s:"a",q:"Która technologia zapewnia izolację stylów i logiki komponentu LWC?",a:["Shadow DOM","ES6 Modules","HTML Templates","Locker Service"],e:"Shadow DOM zapewnia izolację stylów i logiki."},{id:"w10-04",s:"a",q:"Jak wygląda znacznik własnego komponentu LWC w HTML (Custom Element)?",a:["<c-my-component>","<lwc:myComponent>","<myComponent/>","<c:myComponent>"],e:"Custom Elements to własne znaczniki HTML, np. <c-my-component> (camelCase zamieniany na kebab-case z prefiksem c-)."},{id:"w10-05",s:"b",q:"W jakim katalogu projektu tworzy się komponenty LWC?",a:["force-app/main/default/lwc","src/components","force-app/main/default/classes","force-app/lwc/components"],e:"Komponenty tworzy się w force-app/main/default/lwc/<nazwaKomponentu>/."},{id:"w10-06",s:"b",q:"Skąd pochodzi nazwa komponentu LWC?",a:["Z nazwy katalogu i plików","Z atrybutu name w pliku .js","Z nazwy klasy Apex","Z pliku package.json"],e:"Nazwa komponentu LWC pochodzi z nazwy katalogu i plików."},{id:"w10-07",s:"b",q:"Który plik LWC zawiera metadane komponentu?",a:[".js-meta.xml",".html",".css",".svg"],e:".html to szablon, .js to logika, .js-meta.xml to metadane, .css to styl (opcjonalny), .svg to ikona (opcjonalna)."},{id:"w10-08",s:"b",q:"Które pliki komponentu LWC są opcjonalne?",a:[".css i .svg",".html i .js",".js-meta.xml i .css",".js i .svg"],e:"Opcjonalne są plik stylu (.css) i plik ikony (.svg)."},{id:"w10-09",s:"b",q:"Jakim poleceniem instaluje się komponent w Org-u (VS Code)?",a:["SFDX: Deploy This Source To Org","npm publish","git push origin org","SFDX: Retrieve Source from Org"],e:"Zainstalowanie komponentu: SFDX: Deploy This Source To Org."},{id:"w10-10",s:"c",q:"Za co odpowiada plik .html komponentu LWC?",a:["Definiuje strukturę (layout) i elementy UI; używa dyrektyw jak for:each, lwc:if","Zawiera logikę biznesową i obsługę zdarzeń","Określa, gdzie komponent może być używany","Definiuje ikonę komponentu"],e:"Szablon .html definiuje strukturę i elementy UI. Używa HTML, Lightning Base Components i dyrektyw (for:each, if:true, lwc:if)."},{id:"w10-11",s:"c",q:"Które z poniższych to dyrektywy szablonu LWC?",a:["for:each, if:true, lwc:if","v-for, v-if","ng-repeat, ng-if","*ngFor, *ngIf"],e:"Dyrektywy LWC: for:each, if:true, lwc:if. Pozostałe to Vue i Angular."},{id:"w10-12",s:"d",q:"Za co odpowiada plik .js komponentu LWC?",a:["Logikę, właściwości, metody, obsługę zdarzeń, komunikację, pobieranie danych i cykl życia","Wyłącznie wygląd komponentu","Definicję miejsc użycia komponentu","Ikonę komponentu"],e:"Plik .js: logika biznesowa, właściwości i metody, obsługa zdarzeń, komunikacja, dane (Apex, Lightning Data Service) i lifecycle hooks."},{id:"w10-13",s:"d",q:"Za pomocą czego plik .js komponentu pobiera i aktualizuje dane Salesforce?",a:["Apex oraz Lightning Data Service","Bezpośrednich zapytań SQL","Plików CSV","Visualforce"],e:"Logika .js obsługuje pobieranie i aktualizację modelu danych, np. przez Apex oraz Lightning Data Service."},{id:"w10-14",s:"e",q:"Co określa plik .js-meta.xml?",a:["Czy komponent jest dostępny w Lightning App Builder i gdzie może być używany (App/Home/Record Page, Flow Screens)","Logikę obsługi zdarzeń","Kolory komponentu","Strukturę HTML"],e:".js-meta.xml określa dostępność w Lightning App Builder, miejsca użycia (targets), Flow Screens oraz etykietę, opis i właściwości konfiguracyjne."},{id:"w10-15",s:"c",q:"Jak domyślnie działają style z pliku .css komponentu LWC?",a:["Są ograniczone do komponentu (CSS scoping, Shadow DOM)","Są globalne dla całej strony","Nadpisują style SLDS całej aplikacji","Działają tylko w Experience Cloud"],e:"Style są domyślnie ograniczone do komponentu (CSS scoping, Shadow DOM)."},{id:"w10-16",s:"c",q:"Z jakim systemem projektowym może współpracować CSS komponentu LWC?",a:["Salesforce Lightning Design System (SLDS)","Material Design","Bootstrap (wymagany)","Tailwind (wbudowany)"],e:"CSS może współpracować z Salesforce Lightning Design System (SLDS)."},{id:"w10-17",s:"b",q:"Do czego służy plik .svg komponentu?",a:["Definiuje ikonę komponentu, np. w Lightning App Builder","Definiuje grafikę wyświetlaną w szablonie","Zawiera style","Jest wymagany do deployu"],e:".svg (opcjonalny) definiuje ikonę reprezentującą komponent w Lightning App Builder."},{id:"w10-18",s:"f",q:"Dlaczego LWC jest szybszy niż starsze frameworki Salesforce, np. Aura?",a:["Wykorzystuje natywne API przeglądarki","Działa na serwerze","Kompiluje się do Apex","Nie używa JavaScriptu"],e:"Wydajność: LWC wykorzystuje natywne API przeglądarki, więc działa szybciej niż Aura."},{id:"w10-19",s:"f",q:"Co chroni komponenty LWC przed złośliwym kodem?",a:["Salesforce Locker Service","Shadow DOM","SLDS","Lightning Message Service"],e:"Bezpieczeństwo: wbudowany Salesforce Locker Service chroni przed złośliwym kodem."},{id:"w10-20",s:"f",q:"Która zaleta LWC NIE jest wymieniona na wykładzie?",a:["Działanie bez przeglądarki","Standardy webowe","Reużywalność","Integracja z Apex"],e:"Zalety: standardy webowe, integracja, wydajność, reużywalność, bezpieczeństwo."},{id:"w10-21",s:"c",q:"Jaki element jest głównym, wymaganym kontenerem szablonu LWC?",a:["<template>","<div>","<lightning-card>","<body>"],e:"<template> to główny kontener komponentu, wymagany w LWC."},{id:"w10-22",s:"c",q:"Co oznacza {name} w szablonie LWC?",a:["Data binding – wartość właściwości name z pliku .js","Komentarz","Zmienną CSS","Parametr URL"],e:"Zapis {name} to wiązanie danych (data binding) z właściwością name zdefiniowaną w pliku .js."},{id:"w10-23",s:"c",q:"Czym jest <lightning-input>?",a:["Komponentem z biblioteki Salesforce (Lightning Base Components)","Standardowym znacznikiem HTML5","Komponentem własnym (c-)","Elementem Visualforce"],e:"<lightning-input> to komponent z biblioteki Salesforce."},{id:"w10-24",s:"c",q:"Co robi atrybut onchange={handleChange} w szablonie?",a:["Wywołuje metodę handleChange zdefiniowaną w pliku .js przy zmianie wartości","Wywołuje metodę Apex handleChange","Zmienia styl elementu","Wysyła zdarzenie do LMS"],e:"onchange={handleChange} wywołuje funkcję handleChange z pliku .js."},{id:"w10-25",s:"d",q:"Z jakiego modułu importuje się LightningElement?",a:["'lwc'","'lightning'","'c/base'","'salesforce'"],e:"import { LightningElement, track } from 'lwc';"},{id:"w10-26",s:"d",q:"Co oznacza 'export default' w klasie komponentu?",a:["Udostępnienie klasy komponentu platformie","Ustawienie domyślnych wartości pól","Eksport do Apex","Udostępnienie komponentu publicznie w Internecie"],e:"export default udostępnia klasę komponentu platformie."},{id:"w10-27",s:"d",q:"Do czego służy dekorator @track w przykładzie Hello World?",a:["Gwarantuje automatyczną zmianę w szablonie przy zmianie wartości","Udostępnia właściwość rodzicowi","Wywołuje metodę Apex","Śledzi zmiany w bazie danych"],e:"@track gwarantuje automatyczną zmianę w szablonie (reaktywność). @api udostępnia właściwość rodzicowi."},{id:"w10-28",s:"d",q:"Jak w handleChange(event) odczytać nową wartość pola?",a:["event.target.value","event.value","this.value","event.detail.text"],e:"Nową wartość pola odczytuje się z obiektu zdarzenia: this.name = event.target.value;"},{id:"w10-29",s:"e",q:"Co oznacza <isExposed>true</isExposed> w .js-meta.xml?",a:["Komponent jest widoczny w UI (np. w Lightning App Builder)","Komponent jest publiczny w Internecie","Komponent ma dostęp do wszystkich danych","Komponent jest eksportowany do pakietu"],e:"<isExposed> określa, czy komponent jest widoczny w UI."},{id:"w10-30",s:"e",q:"Który target pozwala dodać komponent do strony rekordu?",a:["lightning__RecordPage","lightning__AppPage","lightning__HomePage","lightning__FlowScreen"],e:"AppPage – strona aplikacji, RecordPage – strona rekordu, HomePage – strona główna."},{id:"w10-31",s:"c",q:"Co reprezentuje selektor CSS :host w komponencie LWC?",a:["Główny element (host element) komponentu","Element <body> strony","Wszystkie komponenty potomne","Element rodzica"],e:":host to selektor głównego elementu komponentu LWC."},{id:"w10-32",s:"d",q:"Czym jest klasa LightningElement?",a:["Klasą bazową każdego komponentu LWC, zapewniającą renderowanie, reaktywność, zdarzenia i cykl życia","Klasą Apex do obsługi UI","Komponentem bazowym biblioteki SLDS","Klasą testową"],e:"LightningElement to klasa bazowa każdego komponentu: renderowanie HTML, reaktywność (@track, @api), zdarzenia i cykl życia."},{id:"w10-33",s:"d",q:"Które z poniższych to metody cyklu życia komponentu LWC?",a:["connectedCallback(), disconnectedCallback()","onInit(), onDestroy()","componentDidMount(), componentWillUnmount()","beforeInsert(), afterInsert()"],e:"LightningElement realizuje cykl życia, np. connectedCallback() i disconnectedCallback()."},{id:"w10-34",s:"f",q:"Gdzie uruchamia się komponent LWC?",a:["Bezpośrednio w przeglądarce użytkownika","Na serwerze Salesforce","W bazie danych Org-a","W kontekście asynchronicznym Apex"],e:"Komponent LWC uruchamia się bezpośrednio w przeglądarce, a z backendem komunikuje się np. przez Apex."},{id:"w10-35",s:"g",q:"Do czego służy zastosowanie LWC w Utility Bar?",a:["Do tworzenia narzędzi dostępnych z paska narzędzi aplikacji","Do osadzania w zewnętrznych aplikacjach","Do portali społeczności","Do ekranów Flow"],e:"Utility Bar to narzędzia dostępne z paska narzędzi aplikacji."},{id:"w10-36",s:"g",q:"Co umożliwia Lightning Out?",a:["Osadzanie komponentów Lightning w zewnętrznych aplikacjach internetowych","Wylogowanie z Lightning","Eksport danych z Org-a","Przełączenie do Salesforce Classic"],e:"Lightning Out to osadzanie komponentów Lightning w zewnętrznych aplikacjach internetowych."},{id:"w10-37",s:"g",q:"Do czego służą Custom Tabs w kontekście LWC?",a:["Udostępnianie komponentów jako samodzielnych kart aplikacji","Tworzenie zakładek w przeglądarce","Definiowanie pól obiektu","Grupowanie rekordów"],e:"Custom Tabs udostępniają komponenty jako samodzielne karty aplikacji."},{id:"w10-38",s:"g",q:"Gdzie użyć LWC, aby był elementem ekranu procesu automatyzacji?",a:["Flow Screens","Utility Bar","Lightning Out","Home Pages"],e:"Flow Screens: komponenty LWC jako elementy ekranów Salesforce Flow."},{id:"w10-39",s:"g",q:"Do czego służy LWC w Experience Cloud?",a:["Do tworzenia interfejsów portali i społeczności","Do aplikacji konsolowych","Do aplikacji mobilnej","Do pisania triggerów"],e:"Experience Cloud to interfejsy portali i społeczności dla użytkowników zewnętrznych."},{id:"w10-40",s:"g",q:"Do czego służą Record Pages?",a:["Do prezentacji i obsługi danych konkretnego rekordu","Do budowania własnych stron aplikacji","Do strony głównej","Do raportów"],e:"Record Pages: prezentacja i obsługa danych konkretnego rekordu. App Pages: własne strony aplikacji."}],Pp={id:hp,title:Sp,sections:Cp,questions:Tp},Ap="w11",Dp="W11 · Komunikacja między komponentami LWC",vp=[{id:"a",title:"Sposoby komunikacji między komponentami",text:"Komunikacja między komponentami LWC pozwala budować aplikacje modułowe. Są cztery sytuacje:\n• **rodzic → dziecko**: przez właściwości dziecka oznaczone `@api`, ustawiane przez rodzica,\n• **dziecko → rodzic**: dziecko wysyła zdarzenie `CustomEvent`,\n• **rodzeństwo ↔ rodzeństwo**: pośredniczy wspólny rodzic (dziecko 1 wysyła zdarzenie do rodzica, a ten ustawia właściwość dziecka 2),\n• **komponenty niezależne w hierarchii**: globalnie przez Pub/Sub, czyli Lightning Message Service (publikacja–subskrypcja, niezależna od hierarchii)."},{id:"b",title:"Rodzic i dziecko w kodzie",text:"Dziecko udostępnia właściwość dekoratorem `@api`, np. `@api message;`. Rodzic ustawia ją jako atrybut: `<c-child-component message=\"Witaj\"></c-child-component>`.\n\nW drugą stronę dziecko tworzy zdarzenie `const myEvent = new CustomEvent('notify', { detail: { text: '...' } });` i wysyła je przez `this.dispatchEvent(myEvent);`. Rodzic nasłuchuje go atrybutem „on” + nazwa zdarzenia: `<c-child-component onnotify={handleNotification}>`. Dane przekazane w zdarzeniu są w `event.detail` (np. `event.detail.text`)."},{id:"c",title:"Wzorzec Pub/Sub",text:"**Publisher–Subscriber (Pub/Sub)** pozwala komponentom niezależnym hierarchicznie wymieniać informacje bez wspólnego rodzica: jeden komponent publikuje zdarzenie (publish), a inny je subskrybuje (subscribe). Minimalny moduł `pubsub.js` ma funkcje `subscribe`, `unsubscribe` i `publish` i leży w osobnym katalogu `lwc/pubsub/`. Importuje się go zapisem `import { publish } from 'c/pubsub';`, gdzie prefiks `c/` oznacza przestrzeń nazw Custom (własne komponenty i moduły).\n\nNadawca (Publisher) nie subskrybuje kanału, tylko używa `publish`. W implementacji z wykładu `publish` wywołuje wszystkie callbacki zarejestrowane dla danego zdarzenia, przekazując im dane (w try/catch), a `unsubscribe` usuwa z listy wybrany callback (filter)."},{id:"d",title:"Subskrypcja i ograniczenia Pub/Sub",text:"Odbiorca (Subscriber) rejestruje subskrypcję w metodzie `connectedCallback()`. To metoda cyklu życia, która uruchamia się, gdy komponent jest wstawiany do DOM. Zalety Pub/Sub: brak zależności hierarchicznej, czysta architektura, mniejsze sprzężenie oraz łatwość testowania i ponownego użycia. Ograniczenie: działa tylko w obrębie jednej strony (Lightning App Page)."},{id:"e",title:"Przykład z wykładu: strona konta",text:"Przykładowa strona konta składa się z komponentów:\n• `c-account-container` – kontener nadrzędny; pobiera dane z Apex (np. `AccountController.getAccountDetails`) i przechowuje stan,\n• `c-account-header` (poziom 1) – podstawowe informacje o firmie (nazwa, branża, rating),\n• `c-activity-timeline` (poziom 1) – historia zadań, rozmów i e-maili,\n• `c-contact-list` (poziom 1) i `c-contact-tile` (poziom 2) – pojedynczy kontakt na liście.\n\nGdy komponent A chce powiadomić niezależny komponent B, który nie ma z nim wspólnego rodzica, należy użyć Pub/Sub (Lightning Message Service)."}],Np=[{id:"w11-01",s:"a",q:"Jak realizuje się komunikację Rodzic → Dziecko w LWC?",a:["Przez właściwości (properties) dziecka oznaczone @api, ustawiane przez rodzica","Przez CustomEvent wysyłany przez rodzica","Przez Lightning Message Service obowiązkowo","Przez wywołanie Apex"],e:"Dane przekazuje się w dół, od rodzica do dziecka, przez właściwości dziecka oznaczone dekoratorem @api."},{id:"w11-02",s:"a",q:"Jak realizuje się komunikację Dziecko → Rodzic w LWC?",a:["Dziecko wysyła zdarzenie CustomEvent do rodzica","Dziecko ustawia właściwość @api rodzica","Dziecko wywołuje metodę Apex rodzica","Nie jest to możliwe"],e:"Komponent dziecka wysyła do rodzica zdarzenia CustomEvent."},{id:"w11-03",s:"a",q:"Jak komunikują się komponenty rodzeństwa (wspólny rodzic)?",a:["Za pomocą wspólnego rodzica: dziecko 1 wysyła zdarzenie, rodzic aktualizuje dane dziecka 2","Bezpośrednio przez @api","Bezpośrednio przez wywołanie metody drugiego dziecka","Przez wspólną zmienną globalną window"],e:"Komponenty rodzeństwa komunikują się przez wspólnego rodzica. Dziecko 1 wysyła zdarzenie do rodzica, a rodzic ustawia właściwość dziecka 2."},{id:"w11-04",s:"a",q:"Czym jest Lightning Message Service w kontekście komunikacji?",a:["Globalną komunikacją publikacja–subskrypcja w całej aplikacji, niezależnie od hierarchii","Komunikacją Rodzic → Dziecko","Usługą e-mail Salesforce","Mechanizmem wywołań Apex"],e:"Lightning Message Service to globalna komunikacja typu publish/subscribe, niezależna od hierarchii komponentów."},{id:"w11-05",s:"b",q:"Który dekorator czyni właściwość dziecka dostępną dla rodzica?",a:["@api","@track","@wire","@public"],e:"@api message; to właściwość dostępna dla rodzica."},{id:"w11-06",s:"b",q:"Jak rodzic przekazuje wartość 'Witaj' do właściwości message dziecka?",a:['<c-child-component message="Witaj"></c-child-component>','<c-child-component @api.message="Witaj">',"this.child.message = 'Witaj' w Apex",'<c-child-component onmessage="Witaj">'],e:'Rodzic osadza dziecko i ustawia atrybut: <c-child-component message="…">.'},{id:"w11-07",s:"b",q:"Jak dziecko tworzy zdarzenie o nazwie 'notify' z danymi?",a:["new CustomEvent('notify', { detail: { text: '…' } })","new Event('onnotify', { data: '…' })","fireEvent('notify', '…')","new LightningEvent('notify')"],e:"const myEvent = new CustomEvent('notify', { detail: { … } });"},{id:"w11-08",s:"b",q:"Jak dziecko wysyła utworzone zdarzenie?",a:["this.dispatchEvent(myEvent)","this.emit(myEvent)","publish(myEvent)","this.fire(myEvent)"],e:"Utworzone zdarzenie wysyła się wywołaniem this.dispatchEvent(myEvent);"},{id:"w11-09",s:"b",q:"Jak rodzic nasłuchuje zdarzenia 'notify' od dziecka?",a:["<c-child-component onnotify={handleNotification}>","<c-child-component notify={handleNotification}>","<c-child-component on-notify={handleNotification}>","<c-child-component @notify={handleNotification}>"],e:"Nazwa atrybutu to 'on' + nazwa zdarzenia: onnotify={handleNotification}."},{id:"w11-10",s:"b",q:"Gdzie w obiekcie zdarzenia znajdują się dane przesłane przez dziecko?",a:["event.detail","event.target.value","event.payload","event.data"],e:"Dane przekazane w CustomEvent są w event.detail, np. event.detail.text."},{id:"w11-11",s:"c",q:"Jaki wzorzec komunikacyjny pozwala komponentom niezależnym hierarchicznie wymieniać informacje bez wspólnego rodzica?",a:["Publisher–Subscriber (Pub/Sub)","Model–View–Controller","Singleton","Rodzic–Dziecko"],e:"Publisher–Subscriber: jeden komponent publikuje zdarzenie (publish), inny je subskrybuje (subscribe)."},{id:"w11-12",s:"c",q:"Jakie minimalne funkcje ma moduł pubsub.js z wykładu?",a:["subscribe, unsubscribe, publish","send, receive","on, off, emit, once","connect, disconnect"],e:"Minimalna funkcjonalność: subscribe, unsubscribe, publish."},{id:"w11-13",s:"c",q:"Gdzie umieszcza się moduł pubsub.js?",a:["W odrębnym katalogu lwc/pubsub/","W katalogu classes/","W pliku .js-meta.xml","W statycznych zasobach Apex"],e:"Moduł pubsub.js umieszcza się w odrębnym katalogu: lwc/pubsub/."},{id:"w11-14",s:"c",q:"Jak komponent importuje funkcję publish z kanału pubsub?",a:["import { publish } from 'c/pubsub';","import publish from 'lwc/pubsub';","import { publish } from 'lightning/pubsub';","require('pubsub').publish"],e:"import { publish } from 'c/pubsub'. Prefiks c/ to przestrzeń nazw Custom."},{id:"w11-15",s:"c",q:"Co oznacza prefiks 'c/' w imporcie 'c/pubsub'?",a:["Przestrzeń nazw Custom (własne komponenty/moduły)","Moduł wbudowany Salesforce","Moduł CSS","Moduł z CDN"],e:"Prefiks c/ oznacza przestrzeń nazw Custom, czyli własne komponenty i moduły."},{id:"w11-16",s:"c",q:"Czy nadawca (Publisher) subskrybuje kanał?",a:["Nie, nadawca używa tylko funkcji publish","Tak, zawsze","Tak, w connectedCallback","Tylko jeśli chce odebrać potwierdzenie"],e:"Nadawca nie subskrybuje kanału, tylko używa funkcji publish."},{id:"w11-17",s:"d",q:"W której metodzie odbiorca (Subscriber) w przykładzie rejestruje subskrypcję?",a:["connectedCallback()","constructor()","renderedCallback()","handleClick()"],e:"connectedCallback to metoda cyklu życia uruchamiana, gdy komponent jest wstawiany do DOM. Tam wywoływane jest subscribe(…)."},{id:"w11-18",s:"d",q:"Kiedy uruchamia się connectedCallback?",a:["Gdy komponent jest wstawiany do DOM","Gdy komponent jest usuwany z DOM","Po każdym renderowaniu","Przy wywołaniu Apex"],e:"connectedCallback uruchamia się, gdy komponent jest wstawiany do DOM."},{id:"w11-19",s:"c",q:"Co robi publish('messageEvent', payload) w implementacji z wykładu?",a:["Wywołuje wszystkie callbacki zarejestrowane dla 'messageEvent', przekazując payload","Zapisuje payload w bazie danych","Wysyła payload do serwera Apex","Tworzy nowy komponent"],e:"publish iteruje po events[eventName] i wywołuje każdy callback z payloadem (w try/catch)."},{id:"w11-20",s:"c",q:"Co robi unsubscribe w implementacji pubsub z wykładu?",a:["Usuwa konkretny callback z listy słuchaczy danego zdarzenia (filter)","Usuwa wszystkie zdarzenia","Zamyka kanał dla wszystkich","Wyrejestrowuje komponent z DOM"],e:"events[eventName] = events[eventName].filter(listener => listener !== callback)."},{id:"w11-21",s:"d",q:"Jakie są zalety komunikacji Pub/Sub?",a:["Brak zależności hierarchicznej, mniejsze sprzężenie, łatwość testowania i ponownego użycia","Działa między różnymi Org-ami","Działa między różnymi stronami aplikacji","Nie wymaga JavaScriptu"],e:"Zalety: brak zależności hierarchicznej, czysta architektura, mniejsze sprzężenie, łatwe testowanie i reuse."},{id:"w11-22",s:"d",q:"Jakie jest ograniczenie komunikacji Pub/Sub z wykładu?",a:["Działa tylko w obrębie jednej strony (Lightning App Page)","Działa tylko między rodzicem i dzieckiem","Wymaga Apex","Działa tylko w aplikacji mobilnej"],e:"Ograniczenie: działa tylko w obrębie jednej strony (Lightning App Page)."},{id:"w11-23",s:"e",q:"Który komponent w przykładzie (account-container) pobiera dane z Apex?",a:["c-account-container (kontener główny)","c-contact-tile","c-account-header","c-activity-timeline"],e:"c-account-container to komponent nadrzędny. Pobiera dane z Apex (np. AccountController.getAccountDetails) i przechowuje stan."},{id:"w11-24",s:"e",q:"Jaki poziom zagnieżdżenia ma c-contact-tile w przykładzie?",a:["Komponent potomny poziomu 2 (dziecko c-contact-list)","Komponent potomny poziomu 1","Komponent nadrzędny","Komponent rodzeństwa kontenera"],e:"c-contact-tile to poziom 2 i reprezentuje pojedynczy kontakt na liście c-contact-list (poziom 1)."},{id:"w11-25",s:"e",q:"Za co odpowiada c-activity-timeline w przykładzie?",a:["Wyświetla historię zadań, rozmów i e-maili","Wyświetla informacje o firmie","Zarządza listą kontaktów","Pobiera dane z Apex"],e:"c-activity-timeline (poziom 1) wyświetla historię zadań, rozmów i e-maili."},{id:"w11-26",s:"e",q:"Za co odpowiada c-account-header?",a:["Wyświetla podstawowe informacje o firmie (nazwa, branża, rating)","Przechowuje stan wybranego kontaktu","Reprezentuje pojedynczy kontakt","Publikuje wiadomości LMS"],e:"c-account-header (poziom 1) wyświetla podstawowe informacje o firmie."},{id:"w11-27",s:"e",q:"Komponent A na stronie chce powiadomić niezależny komponent B (brak wspólnego rodzica). Co wybrać?",a:["Pub/Sub (Lightning Message Service)","@api","CustomEvent do rodzica","Bezpośrednie wywołanie metody B"],e:"Komponenty niezależne hierarchicznie komunikują się przez Pub/Sub, czyli LMS."},{id:"w11-28",s:"a",q:"Co umożliwia komunikacja między komponentami LWC wg wykładu?",a:["Budowanie aplikacji modułowych","Omijanie limitów Apex","Zapis do bazy bez DML","Uruchamianie triggerów"],e:"Komunikacja LWC umożliwia budowanie aplikacji modułowych."}],Mp={id:Ap,title:Dp,sections:vp,questions:Np},Rp="w12",Lp="W12 · LWC w praktyce (LDS, Apex, dobre praktyki)",Ip=[{id:"a",title:"Lightning Data Service (LDS)",text:"**LDS** daje dostęp do rekordów bez pisania kodu Apex. Do odczytu służy `@wire(getRecord, ...)`, a do aktualizacji `updateRecord()`. Oba pochodzą z modułu `lightning/uiRecordApi`. Pola importuje się ze schematu, np. `import NAME_FIELD from '@salesforce/schema/Account.Name';`. W zapisie `recordId: '$recordId'` prefiks `$` oznacza właściwość reaktywną: gdy `recordId` się zmieni, dane są automatycznie pobierane ponownie."},{id:"b",title:"Wywołanie Apex z LWC",text:"Metodę Apex importuje się zapisem `import getAccounts from '@salesforce/apex/AccountController.getAccounts';`. Można ją wywołać na dwa sposoby:\n• **imperatywnie** – daje pełną kontrolę (np. po kliknięciu przycisku, w warunkach, pętlach). Wynik obsługuje się jako Promise: `.then(result => ...).catch(error => ...)`. Przepływ: LWC → Apex → SOQL → Salesforce (platforma) → LWC,\n• **reaktywnie przez `@wire`** – automatycznie odświeża dane przy zmianie parametrów (np. `'$industry'`). Funkcja dekorowana `@wire` otrzymuje obiekt z polami `data` i `error`."},{id:"c",title:"Architektura i bezpieczeństwo danych",text:"Dobre praktyki dotyczące architektury: komponenty mają być modularne (jeden cel = jeden komponent), a zagnieżdżanie ograniczone. Płaska struktura DOM jest szybsza, bo zbyt głęboka hierarchia spowalnia renderowanie. LDS używa się, gdzie to możliwe, bo jest szybszy i bezpieczniejszy niż Apex. Gdy trzeba użyć Apex, należy czyścić dane i walidować wejście. Do komunikacji między stronami służy Lightning Message Service."},{id:"d",title:"Bezpieczeństwo kodu LWC",text:"Zasady bezpieczeństwa: nie przekazuj danych wrażliwych przez zdarzenia (events) ani Pub/Sub. Nigdy nie używaj `eval()` ani dynamicznego HTML-a. Nie wyłączaj Lightning Locker ani Lightning Web Security (są włączone automatycznie). Przestrzegaj zasad CRUD i FLS (Field-Level Security, czyli bezpieczeństwo na poziomie pola). Błędy zawsze obsługuj przez `try/catch` i `.catch(error => ...)`."},{id:"e",title:"Wydajność i styl kodu",text:"Wydajność: włączaj cache dla `@wire` przez `@wire(..., { cacheable: true })`, nie aktualizuj UI w pętli (minimalizuj DOM reflow), używaj `@track` i właściwości reaktywnych `$` tylko tam, gdzie to konieczne, i stosuj lazy loading dla dużych danych lub komponentów.\n\nStyl: PascalCase dla klas i camelCase dla zmiennych, `const` i `let` (nigdy `var`), JSDoc do opisu funkcji."}],Ep=[{id:"w12-01",s:"a",q:"Co umożliwia Lightning Data Service (LDS)?",a:["Dostęp do rekordów bez konieczności pisania kodu Apex","Wykonywanie zapytań SQL z przeglądarki","Tworzenie triggerów w JS","Komunikację Pub/Sub"],e:"LDS daje dostęp do rekordów bez pisania kodu Apex."},{id:"w
