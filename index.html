• ruch to przełączanie się między zadaniami, na przykład praca nad trzema projektami naraz.`},{id:"l",title:"DSDM",text:`W **DSDM** stałe są **czas, koszt i jakość**, a zmienia się zakres. Osiem zasad tej metody: potrzeba biznesowa, dostawa na czas, współpraca, jakość (nigdy bez kompromisu), praca przyrostowa, praca iteracyjna, komunikacja i kontrola.

Wymagania ustala się metodą **MoSCoW**: Must have (musi być), Should have (powinno być), Could have (mogłoby być) i **Won’t have this time** (świadomie poza zakresem tego wydania). Wymagania Must mogą zajmować najwyżej 60% nakładu pracy, a Could około 20%, co stanowi bufor. Gdy w timeboxie brakuje czasu, rezygnuje się najpierw z Could, a w razie potrzeby z Should. Must zostaje zawsze.

Fazy DSDM: przed projektem, wykonalność (czy warto i czy się da), podstawy (robimy „wystarczająco”, a nie wszystko z góry), wytwarzanie ewolucyjne, wdrożenie i po projekcie. Typowy timebox trwa od 2 do 4 tygodni.

Największą władzę decyzyjną ma **sponsor biznesowy**. To on zapewnia finansowanie i zasoby.`},{id:"m",title:"Miary postępu i limity WIP",text:`Każda metoda ma własną typową miarę postępu:
• XP – prędkość,
• FDD – procent ukończonych cech,
• Lean – czas przepływu,
• DSDM – terminowość timeboxów.

**Limit WIP** (work in progress) ogranicza liczbę zadań rozpoczętych jednocześnie. Zasada brzmi: najpierw kończ, potem zaczynaj. Gdy kolumna „W toku” jest pełna, wolna para nie bierze nowego zadania, tylko pomaga domknąć zadania w toku albo ich testy.`}],Jk=[{id:"w02-01",s:"a",q:"Co jest ustalone, a co szacowane w podejściu zwinnym (value-driven)?",a:["Czas i zasoby ustalone → szacujemy zakres","Zakres ustalony → szacujemy czas i zasoby","Wszystko szacowane","Jakość szacowana, reszta ustalona"],w:["To podejście klasyczne (plan-driven).","Zawsze coś jest ustalone.","Jakość jest stała w obu podejściach."],e:"W podejściu zwinnym czas i zasoby są ustalone, a szacuje się zakres. W klasycznym jest odwrotnie: stały jest zakres."},{id:"w02-02",s:"a",q:"Co jest stałe zarówno w podejściu klasycznym, jak i zwinnym?",a:["Jakość","Zakres","Czas","Zasoby"],w:["Zakres stały tylko w klasycznym.","Czas stały tylko w zwinnym.","Zasoby stałe tylko w zwinnym."],e:"Jakość jest stała w obu podejściach, zarówno klasycznym, jak i zwinnym."},{id:"w02-03",s:"a",q:"Do jakiego poziomu (wartości / zasady / ramy / praktyki) wykład przypisuje XP?",a:["Praktyki – jak wytwarzamy (TDD, pary, refaktoryzacja, CI)","Wartości – Manifest Agile","Zasady – jak Lean","Ramy – jak Scrum"],w:["Wartości to Manifest Agile.","Zasady to Lean.","Ramy to Scrum, DSDM, Kanban, FDD…"],e:"Wykład porządkuje pojęcia na czterech poziomach: wartości (Manifest), zasady (Lean), ramy i metodyki (Scrum, DSDM) oraz praktyki (XP). XP opisuje, jak wytwarzamy oprogramowanie: TDD, praca w parach, refaktoryzacja, CI."},{id:"w02-04",s:"b",q:"Ile wartości i zasad ma Manifest Agile (2001)?",a:["4 wartości, 12 zasad","12 wartości, 4 zasady","5 wartości, 14 zasad","7 wartości, 7 zasad"],w:["Odwrotnie.","To wartości i zasady XP (2. wyd.).","To PRINCE2."],e:"Manifest Agile z 2001 roku zawiera 4 wartości i 12 zasad."},{id:"w02-05",s:"b",q:"Co zrobił Manifest Agile wg wykładu?",a:["Nazwał wspólne wartości metod, które już istniały – nie stworzył nowej metody","Stworzył Scrum","Stworzył XP","Zastąpił PMBOK"],w:["Scrum istniał wcześniej.","XP istniał wcześniej.","Nie zastąpił PMBOK."],e:"Manifest Agile nie stworzył nowej metody. Nazwał wspólne wartości istniejących metod „lekkich”."},{id:"w02-06",s:"b",q:"Czym jest Scrumban?",a:["Hybrydą: rytm Scruma + przepływ i limity WIP Kanbana","Odmianą XP","Metodą skalowania","Wersją DSDM"],w:["XP to praktyki.","Skalowanie to SAFe, LeSS, Nexus.","DSDM to osobna rama."],e:"Scrumban łączy rytm Scruma z przepływem pracy i limitami WIP z Kanbana."},{id:"w02-07",s:"b",q:"Które metody służą skalowaniu na wiele zespołów?",a:["SAFe, LeSS, Nexus","XP, FDD, Lean","DSDM, Crystal, ASD","PMI, PRINCE2, PM²"],w:["To metody jednego zespołu/praktyki.","To metodyki zwinne.","To metodyki klasyczne."],e:"Do skalowania pracy na wiele zespołów służą SAFe, LeSS i Nexus."},{id:"w02-08",s:"b",q:"Który wariant Crystal przeznaczony jest dla zespołu 1–6 osób?",a:["Clear","Yellow","Orange","Red"],w:["Yellow: 7–20.","Orange: 21–40.","Red: 41–80."],e:"W Crystalu (A. Cockburn) im większy zespół i wyższa krytyczność projektu, tym więcej formalizmu. Wariant Clear jest przeznaczony dla zespołów liczących 1–6 osób."},{id:"w02-09",s:"b",q:"Jakie są fazy ASD (Adaptive Software Development)?",a:["Spekulacja → Współpraca → Uczenie się","Planuj → Buduj → Poprawiaj","Rozpoczęcie → Opracowanie → Konstrukcja → Przejście","RED → GREEN → REFACTOR"],w:["To właśnie to, co ASD zastępuje.","To fazy AUP/RUP.","To cykl TDD."],e:"ASD (J. Highsmith, 2000) uznaje zmianę za normę, a plan za hipotezę. Jego fazy to spekulacja, współpraca i uczenie się."},{id:"w02-10",s:"b",q:"Czym jest AUP?",a:["Uproszczoną, zwinną odmianą Unified Process (fazy RUP w lekkiej wersji)","Metodą skalowania","Odmianą Kanbana","Standardem jakości"],w:["Skalowanie to SAFe, LeSS, Nexus.","Nie ma związku z Kanbanem.","To nie standard jakości."],e:"AUP (S. Ambler, około 2005) to uproszczona, zwinna odmiana Unified Process. Ma fazy: rozpoczęcie, opracowanie, konstrukcja, przejście, a jej następcą jest DAD."},{id:"w02-11",s:"c",q:"Z jakiego projektu wywodzi się XP?",a:["Projekt płacowy C3 w firmie Chrysler (K. Beck, R. Jeffries)","Projekt bankowy w Singapurze","Toyota Production System","Konsorcjum DSDM"],w:["To geneza FDD.","To geneza Lean.","To DSDM."],e:"XP wywodzi się z projektu płacowego C3 w firmie Chrysler. Stworzyli go K. Beck i R. Jeffries, a Beck opisał go w książce „Extreme Programming Explained”."},{id:"w02-12",s:"c",q:"Jaka jest idea XP?",a:["Dobre praktyki „do ekstremum” (np. przegląd kodu cały czas → pary)","Maksymalna dokumentacja","Ekstremalnie długie iteracje","Ekstremalnie duże zespoły"],w:["XP stawia na rozmowę zamiast dokumentów.","Krótkie cykle.","Małe zespoły (do ok. 10–12)."],e:"XP doprowadza dobre praktyki do ekstremum. Skoro testy są dobre, to pisze się je najpierw. Skoro scalanie kodu jest dobre, to scala się go ciągle. Skoro przegląd kodu jest dobry, to prowadzi się go cały czas, czyli programuje w parach."},{id:"w02-13",s:"c",q:"Która wartość XP została dodana w 2. wydaniu?",a:["Szacunek","Komunikacja","Prostota","Odwaga"],w:["Była od początku.","Była od początku.","Była od początku."],e:"Wartości XP to komunikacja, prostota, informacja zwrotna, odwaga i szacunek. Szacunek dodano w drugim wydaniu."},{id:"w02-14",s:"c",q:"Która rola w XP mierzy postęp i porównuje szacunki z wynikami?",a:["Tracker","Coach","Tester","Właściciel produktu"],w:["Coach pilnuje procesu i uczy praktyk.","Tester pomaga pisać testy akceptacyjne.","PO – wizja i priorytety."],e:"W XP postęp mierzy i porównuje z szacunkami tracker. Pozostałe role to programiści, tester i coach, a po stronie klienta właściciel produktu, eksperci i analitycy."},{id:"w02-15",s:"c",q:"Jaka jest proporcja klient : programiści w podejściu „Cały zespół” XP?",a:["≈ 2 : 3","1 : 10","1 : 1","3 : 1"],w:["Klient ma silną reprezentację.","Nie 1:1.","Programistów jest więcej."],e:"Zgodnie z zasadą „Cały zespół” klient pracuje razem z programistami, w proporcji około 2 do 3."},{id:"w02-16",s:"c",q:"Jak długa jest iteracja w XP wg wykładu?",a:["1–3 tygodnie","1–3 miesiące","1 dzień","6 miesięcy"],w:["1–3 miesiące to częstotliwość wydań (XP 1999).","Za krótko.","Za długo."],e:"Iteracja w XP trwa od jednego do trzech tygodni. Wydania (od XP 1999) powstają co 1–3 miesiące."},{id:"w02-17",s:"d",q:"Jaki jest szablon historyjki użytkownika?",a:["Jako <rola> chcę <cel>, aby <korzyść>","Zakładając – Jeżeli – Wtedy","<akcja> <rezultat> <obiekt>","Given – When – Then – And"],w:["To format kryteriów akceptacji (scenariusze).","To szablon cechy FDD.","To BDD (scenariusze)."],e:"Szablon historyjki pochodzi z firmy Connextra (2001): „Jako <rola> chcę <cel>, aby <korzyść>”."},{id:"w02-18",s:"d",q:"Która rola w historyjce jest błędna wg wykładu?",a:["„użytkownik systemu” – zbyt ogólna","„pracownik obsługi klienta”","„właściciel pralni”","„klient zarejestrowany”"],w:["To konkretna rola – dobrze.","To konkretna rola – dobrze.","To konkretna rola – dobrze."],e:"Rola w historyjce ma być konkretną rolą lub personą. Ogólne określenie „użytkownik systemu” jest zbyt niedokładne."},{id:"w02-19",s:"d",q:"Co oznacza V w INVEST?",a:["Valuable – wartościowa","Verified – zweryfikowana","Visible – widoczna","Versioned – wersjonowana"],w:["Nie w INVEST.","Nie w INVEST.","Nie w INVEST."],e:"INVEST to: Independent, Negotiable, Valuable, Estimable, Small, Testable (B. Wake, 2003). Litera V oznacza „wartościowa”."},{id:"w02-20",s:"d",q:"Historyjka „Zaprojektuj bazę danych zleceń” narusza którą cechę INVEST?",a:["Valuable – to zadanie techniczne, klient nie widzi różnicy","Small","Independent","Testable"],w:["Może być mała – problemem jest brak wartości.","Problem nie dotyczy zależności.","Problem nie dotyczy testowalności."],e:"Historyjka powinna być wartościowa dla klienta (V). Pytanie kontrolne brzmi: czy klient zauważy różnicę? Projekt bazy danych jest zadaniem technicznym, a nie historyjką."},{id:"w02-21",s:"d",q:"„System ma działać szybko” narusza którą cechę INVEST?",a:["Testable","Negotiable","Estimable","Independent"],w:["Problem to brak mierzalnego kryterium.","Problem to brak mierzalnego kryterium.","Nie chodzi o kolejność."],e:"Historyjka musi być testowalna (T). Pytanie kontrolne brzmi: skąd wiemy, że jest skończona? Zamiast „szybko” lepiej napisać na przykład „wyszukiwanie trwa krócej niż 2 s”."},{id:"w02-22",s:"d",q:"Co zrobić z historyjką, której nikt nie umie oszacować (np. moduł fiskalny)?",a:["Spike – rozpoznanie przed szacowaniem","Pominąć ją na zawsze","Oszacować losowo","Podzielić poziomo na warstwy"],w:["Nie pomija się wymagań.","Losowe szacunki są bezwartościowe.","Podział poziomy daje zadania, nie historyjki."],e:"Gdy brakuje wiedzy, żeby oszacować historyjkę (E – Estimable), robi się spike, czyli krótkie rozpoznanie przed szacowaniem. Spike to litera S w technice SPIDR."},{id:"w02-23",s:"e",q:"Którym „C” z 3C są kryteria akceptacji?",a:["Confirmation (trzecie C)","Card","Conversation","Collaboration"],w:["Card – pierwsze C.","Conversation – drugie C.","Nie należy do 3C."],e:"W modelu 3C (R. Jeffries) są: Card, Conversation i Confirmation. Trzecie C, potwierdzenie, to kryteria akceptacji."},{id:"w02-24",s:"e",q:"Ile kryteriów akceptacji zaleca się na historyjkę?",a:["3–7 (więcej → podziel historyjkę)","1","10–20","Dokładnie 5"],w:["Zwykle za mało.","Za dużo – historyjka do podziału.","Nie ma sztywnej liczby."],e:"Na historyjkę zaleca się 3–7 kryteriów akceptacji. Każde ma być sprawdzalne odpowiedzią „tak” lub „nie” i opisywać zachowanie, a nie wygląd ekranu. Gdy kryteriów jest więcej, historyjkę lepiej podzielić."},{id:"w02-25",s:"e",q:"Czym różnią się kryteria akceptacji od DoD?",a:["Kryteria – jedna historyjka, CO ma działać; DoD – wszystkie historyjki, JAK DOBRZE zrobione","To to samo","DoD dotyczy jednej historyjki","Kryteria ustala sam zespół"],w:["Różnią się zakresem.","DoD dotyczy wszystkich.","Kryteria – klient z zespołem; DoD – zespół."],e:"Kryteria akceptacji dotyczą jednej historyjki i mówią, co ma działać. DoD dotyczy wszystkich historyjek i mówi, jak dobrze mają być zrobione. Historyjka jest skończona, gdy spełnia jedno i drugie."},{id:"w02-26",s:"e",q:"Czy Definition of Ready jest częścią Scrum Guide?",a:["Nie – to praktyka opcjonalna","Tak, obowiązkowa","Tak, zamiast DoD","Tylko w Scrum 2010"],w:["Nie jest w Scrum Guide.","Nie zastępuje DoD.","Nie."],e:"Definition of Ready nie należy do Scrum Guide, to praktyka opcjonalna. Zbyt długa lista warunków zamienia ją w bramkę znaną z modelu kaskadowego."},{id:"w02-27",s:"e",q:"DoR to warunki…",a:["Wejścia – historyjkę można zaplanować do iteracji","Wyjścia – historyjka jest ukończona","Zamknięcia projektu","Rekrutacji zespołu"],w:["To DoD.","Nie dotyczy projektu.","Nie dotyczy rekrutacji."],e:"DoR to warunki wejścia: określają, czy historyjkę można zaplanować do iteracji. Cały przebieg to backlog, DoR, iteracja, DoD, przyrost."},{id:"w02-28",s:"e",q:"Jaka jest hierarchia wymagań wg wykładu?",a:["Epik → historyjka → zadanie techniczne","Zadanie → historyjka → epik","Historyjka → epik → cecha","Cecha → epik → zadanie"],w:["Odwrotnie.","Epik jest najwyżej.","Nie w tej kolejności."],e:"Wymagania mają trzy poziomy: epik (trwa miesiące, szacowany w rozmiarze koszulki), historyjka (mieści się w iteracji, szacowana w punktach) i zadanie techniczne (najwyżej jeden dzień, szacowane w godzinach)."},{id:"w02-29",s:"e",q:"W jakich jednostkach szacuje się zadania techniczne?",a:["W godzinach","W story points","W rozmiarach koszulkowych","W miesiącach"],w:["Story points – historyjki.","Rozmiar koszulkowy – epiki.","Za duże."],e:"Zadania techniczne szacuje się w godzinach. Epik szacuje się w rozmiarach koszulek, a historyjkę w punktach."},{id:"w02-30",s:"e",q:"Jak należy dzielić historyjki?",a:["W pionie – każda przechodzi przez wszystkie warstwy i daje wartość („plaster tortu”)","W poziomie – UI, logika, dane osobno","Według programistów","Alfabetycznie"],w:["Podział poziomy daje zadania techniczne bez wartości.","Nie według osób.","Bez sensu."],e:"Historyjka ma być „plastrem tortu”: przechodzi przez wszystkie warstwy systemu i dostarcza wartość. Podział na warstwy robi się dopiero na poziomie zadań."},{id:"w02-31",s:"f",q:"Co oznacza P w SPIDR?",a:["Paths – ścieżki","Priority – priorytet","Points – punkty","Planning – planowanie"],w:["Nie w SPIDR.","Nie w SPIDR.","Nie w SPIDR."],e:"SPIDR (M. Cohn) to: Spike, Paths (ścieżki), Interfaces (interfejsy), Data (dane), Rules (reguły). Litera P oznacza ścieżki."},{id:"w02-32",s:"g",q:"Co w grze planistycznej XP decyduje biznes, a co programiści?",a:["Biznes – CO i KIEDY; programiści – ILE kosztuje i JAK","Biznes – JAK; programiści – CO","Wszystko decyduje kierownik","Programiści – priorytety"],w:["Odwrotnie.","Brak takiej roli w grze.","Priorytety ustala klient."],e:"W grze planistycznej klient pisze historyjki i ustala ich kolejność, czyli decyduje, co i kiedy. Programiści szacują koszt i wybierają sposób wykonania, czyli ile i jak."},{id:"w02-33",s:"g",q:"Jak obliczyć budżet wydania w grze planistycznej?",a:["Prędkość × liczba iteracji","Liczba programistów × godziny","Suma rozmiarów koszulkowych","Budżet finansowy / stawka"],w:["Nie w tej technice.","Koszulki dla epików.","To nie budżet w punktach."],e:"Budżet wydania oblicza się jako prędkość pomnożoną przez liczbę iteracji."},{id:"w02-34",s:"g",q:"Co oznacza zasada „wczorajszej pogody”?",a:["W kolejnej iteracji planuj tyle punktów, ile zespół faktycznie ukończył w poprzedniej","Planuj zawsze o 20% więcej","Planuj według prognozy kierownika","Nie planuj w deszczowe dni"],w:["Nie zawyżamy.","Opiera się na danych zespołu.","Żart."],e:"Zasada „wczorajszej pogody” mówi, że w nowej iteracji planuje się tyle punktów, ile zespół faktycznie ukończył w ostatniej."},{id:"w02-35",s:"g",q:"Co dzieje się, gdy w iteracji (timeboxie) brakuje czasu?",a:["Zmniejsza się zakres","Wydłuża się iteracja","Obniża się jakość","Dodaje się ludzi"],w:["Timebox ma stałą długość.","Jakość jest stała.","Nie to jest odpowiedzią."],e:"Iteracja jest timeboxem, czyli ma stały czas. Gdy czasu brakuje, zmniejsza się zakres."},{id:"w02-36",s:"g",q:"Która z czterech reguł prostego projektu (Beck) jest najważniejsza?",a:["Przechodzi wszystkie testy","Wyraża intencję","Nie ma powtórzeń","Ma najmniej elementów"],w:["Druga.","Trzecia (DRY).","Czwarta."],e:"Cztery reguły prostego projektu Becka, od najważniejszej: kod przechodzi wszystkie testy, wyraża intencję, nie zawiera powtórzeń i ma jak najmniej elementów."},{id:"w02-37",s:"h",q:"Co oznacza YAGNI?",a:["You Aren’t Gonna Need It – nic „na zapas”","Keep It Simple","Don’t Repeat Yourself","Test First"],w:["To KISS.","To DRY.","To praktyka test-first."],e:"YAGNI (You Aren’t Gonna Need It) oznacza, że nie robimy niczego na zapas. KISS to najprostsze rozwiązanie, a DRY to brak powtórzeń."},{id:"w02-38",s:"h",q:"Jakie role występują w programowaniu w parach?",a:["Kierowca (pisze, taktycznie) i nawigator (przegląda, strategicznie)","Lider i podwładny","Tester i programista","Architekt i analityk"],w:["Role są równorzędne i się zamieniają.","Obaj programują.","Nie te role."],e:"W programowaniu w parach kierowca pisze kod i myśli taktycznie, a nawigator przegląda kod i myśli strategicznie. Role zamienia się co kilkadziesiąt minut, a kod jest przeglądany cały czas."},{id:"w02-39",s:"h",q:"Co mówią badania Cockburna i Williams (2000) o parach?",a:["Para potrzebuje ok. 15% więcej czasu, ale ma ok. 15% mniej defektów","Para jest 2× szybsza","Para potrzebuje 2× więcej czasu","Brak różnicy"],w:["Nie jest szybsza.","Tylko ok. 15% więcej.","Jest różnica w defektach."],e:"Według badań Cockburna i Williams (2000) para potrzebuje około 15% więcej czasu, ale popełnia około 15% mniej defektów."},{id:"w02-40",s:"h",q:"Która metoda stosuje indywidualną własność klas zamiast współwłasności kodu?",a:["FDD","XP","Scrum","Lean"],w:["XP – współwłasność.","Scrum tego nie narzuca.","Lean to zasady."],e:"W XP kod jest wspólną własnością zespołu. W FDD każdą klasą opiekuje się jeden właściciel."},{id:"w02-41",s:"h",q:"Ile maksymalnie powinien trwać build z testami w CI wg XP?",a:["≤ 10 minut (Ten-Minute Build)","≤ 1 godzina","≤ 1 dzień","Bez limitu"],w:["Za długo.","To Daily Build, a nie CI.","Jest limit."],e:"XP zakłada „Ten-Minute Build”, czyli build z testami trwający najwyżej 10 minut. Kod scala się z gałęzią główną co najmniej raz dziennie, a zepsuty build ma najwyższy priorytet."},{id:"w02-42",s:"h",q:"Czym różni się CI od Daily Build?",a:["CI scala i testuje każdą zmianę; Daily Build scala raz na dobę","To to samo","Daily Build jest częstszy","CI nie uruchamia testów"],w:["Różnią się częstotliwością.","Odwrotnie.","CI uruchamia testy."],e:"Ciągła integracja scala i testuje każdą zmianę. Daily Build, czyli nocna kompilacja, robi to raz na dobę, więc błędy wychodzą po wielu godzinach."},{id:"w02-43",s:"h",q:"Jak nazywała się praktyka zrównoważonego tempa w 1. i 2. wydaniu XP?",a:["„40-godzinny tydzień” → „Energized Work”","„Crunch time” → „Overtime”","„Sprint” → „Marathon”","„Daily” → „Weekly”"],w:["XP jest przeciw nadgodzinom.","Nie.","Nie."],e:"W pierwszym i drugim wydaniu XP zasadę zrównoważonego tempa nazywano „40-godzinnym tygodniem”, a później „Energized Work”. Beck przestrzegał przed dwoma tygodniami nadgodzin z rzędu."},{id:"w02-44",s:"i",q:"Co utrudnia stosowanie XP?",a:["Stała cena i stały zakres w umowie","Zmieniające się wymagania","Mały zespół","Klient dostępny na co dzień"],w:["To sprzyja XP.","To sprzyja XP.","To sprzyja XP."],e:"XP utrudniają: duże rozproszone zespoły, stała cena i stały zakres w umowie, brak klienta, długi cykl testów oraz kultura nadgodzin."},{id:"w02-45",s:"j",q:"Jaki szablon nazwy ma cecha (feature) w FDD?",a:["<akcja> <rezultat> <obiekt>, np. „Oblicz wartość zlecenia”","Jako <rola> chcę <cel>","Given–When–Then","<obiekt>.<metoda>()"],w:["To historyjka.","To BDD.","To nie szablon FDD."],e:"Nazwę cechy w FDD tworzy się według szablonu <akcja> <rezultat> <obiekt>, na przykład „Oblicz wartość zlecenia”. Cecha ma wartość dla klienta, a jej implementacja trwa najwyżej dwa tygodnie."},{id:"w02-46",s:"j",q:"Które procesy FDD wykonuje się raz na początku projektu?",a:["1–3: model ogólny, lista cech, planowanie wg cech","4–5: projektowanie i budowa cechy","Tylko proces 5","Wszystkie iteracyjnie"],w:["Te są iteracyjne (dla każdej cechy).","Nie.","1–3 raz na początku."],e:"Procesy 1–3 (model ogólny, lista cech, planowanie według cech) wykonuje się raz na początku. Projektowanie cechy i budowę cechy powtarza się iteracyjnie."},{id:"w02-47",s:"j",q:"Jaki jest główny mechanizm jakości w FDD?",a:["Obowiązkowe inspekcje (przeglądy)","Programowanie w parach","TDD","Retrospektywy"],w:["To XP.","To technika XP.","To Scrum."],e:"W FDD jakość zapewniają przede wszystkim obowiązkowe inspekcje (przeglądy) projektu i kodu."},{id:"w02-48",s:"j",q:"Jaką wagę ma kamień milowy „Kod” w śledzeniu postępu FDD?",a:["40%","10%","1%","3%"],w:["10% – inspekcja kodu.","1% – przegląd domeny i włączenie do wersji.","3% – inspekcja projektu."],e:"Wagi kamieni milowych w FDD: przegląd domeny 1%, projekt 40%, inspekcja projektu 3%, kod 40%, inspekcja kodu 10%, włączenie 1%. Kod waży więc 40%."},{id:"w02-49",s:"j",q:"Ile procent ukończenia ma cecha po projekcie i inspekcji projektu (FDD)?",a:["44%","40%","41%","50%"],w:["Bez przeglądu domeny i inspekcji.","Brak inspekcji (3%).","To nie ta suma."],e:"Po projekcie i jego inspekcji cecha ma 1% (przegląd domeny) + 40% (projekt) + 3% (inspekcja projektu) = 44% ukończenia."},{id:"w02-50",s:"j",q:"Jak nazywa się raport FDD pokazujący stan zbiorów cech kolorami?",a:["Parking lot","Burndown","Gantt","Kanban board"],w:["Wykres spalania – Scrum/XP.","Harmonogram.","Tablica przepływu."],e:"Raport pokazujący stan zbiorów cech kolorami nazywa się parking lot. Dzięki niemu kierownictwo widzi postęp bez szczegółów technicznych."},{id:"w02-51",s:"k",q:"Skąd wywodzi się Lean?",a:["Z Toyota Production System (T. Ohno)","Z projektu Chrysler C3","Z konsorcjum DSDM","Z PMI"],w:["To XP.","To DSDM.","PMI to PMBOK."],e:"Lean wywodzi się z Toyota Production System (T. Ohno, lata 1950–1970). Później rozwijali go Womack, Jones i Roos, a w oprogramowaniu M. i T. Poppendieck."},{id:"w02-52",s:"k",q:"Czym jest Lean wg wykładu?",a:["Zbiorem zasad, nie procesem – narzędziem jest m.in. Kanban","Procesem z rolami","Frameworkiem jak Scrum","Standardem ISO"],w:["Nie ma ról.","To zasady.","To nie ISO."],e:"Lean jest zbiorem zasad, a nie procesem. Opiera się na wartości, przepływie i ciągłym doskonaleniu (kaizen), a jednym z narzędzi jest Kanban."},{id:"w02-53",s:"k",q:"Co oznacza zasada Lean „Odkładaj decyzje” (Defer Commitment)?",a:["Nieodwracalne decyzje podejmuj w ostatnim odpowiedzialnym momencie","Nie podejmuj żadnych decyzji","Decyzje podejmuje tylko klient","Odkładaj wydania"],w:["Decyzje się podejmuje – później.","Zespół jest upodmiotowiony.","„Dostarczaj szybko”."],e:"Siedem zasad Lean: eliminuj straty, wbudowuj jakość, twórz wiedzę, odkładaj decyzje, dostarczaj szybko, szanuj ludzi, optymalizuj całość. „Odkładaj decyzje” oznacza, że decyzje nieodwracalne podejmuje się w ostatnim odpowiedzialnym momencie."},{id:"w02-54",s:"k",q:"Czemu w oprogramowaniu odpowiadają „zapasy” z produkcji (marnotrawstwo Lean)?",a:["Praca częściowo wykonana (kod niezintegrowany, niewdrożony)","Zbędne funkcje","Przekazania","Przełączanie zadań"],w:["To nadprodukcja.","To transport.","To ruch."],e:"W oprogramowaniu zapasom odpowiada praca częściowo wykonana, na przykład kod niezintegrowany lub niewdrożony. Nadprodukcja to zbędne funkcje, transport to przekazywanie pracy, a ruch to przełączanie się między zadaniami."},{id:"w02-55",s:"k",q:"Praca nad 3 projektami naraz to który rodzaj marnotrawstwa?",a:["Przełączanie zadań (ruch)","Oczekiwanie","Defekty","Ponowne uczenie się"],w:["Oczekiwanie – czekanie na decyzję.","Defekty – błędy.","Utracona wiedza."],e:"Praca nad trzema projektami naraz to marnotrawstwo typu „ruch”, czyli przełączanie zadań."},{id:"w02-56",s:"l",q:"Co jest stałe w DSDM?",a:["Czas, koszt i jakość – zmienia się zakres","Zakres","Tylko koszt","Nic"],w:["Zakres się zmienia (MoSCoW).","Także czas i jakość.","Trzy elementy są stałe."],e:"W DSDM stałe są czas, koszt i jakość, a zmienia się zakres."},{id:"w02-57",s:"l",q:"Która z zasad DSDM mówi o jakości?",a:["Nigdy nie idź na kompromis z jakością","Dostarczaj na czas","Współpracuj","Wykazuj kontrolę"],w:["Inna zasada.","Inna zasada.","Inna zasada."],e:"Jedna z ośmiu zasad DSDM brzmi: nigdy nie idź na kompromis z jakością. Pozostałe to potrzeba biznesowa, dostawa na czas, współpraca, praca przyrostowa, praca iteracyjna, komunikacja i kontrola."},{id:"w02-58",s:"l",q:"Co oznacza W w MoSCoW?",a:["Won’t have this time – świadomie poza zakresem tego wydania","Would have","Wish list","Waiting"],w:["Nie w DSDM.","Nie.","Nie."],e:"MoSCoW to: Must have, Should have, Could have, Won’t have this time. W oznacza elementy, z których w tym wydaniu świadomie rezygnujemy."},{id:"w02-59",s:"l",q:"Z czego rezygnujemy najpierw, gdy w timeboxie DSDM brakuje czasu?",a:["Z Could have","Z Must have","Ze Should have","Z jakości"],w:["Must dostarczamy zawsze.","Should – dopiero w drugiej kolejności.","Jakość jest stała."],e:"Gdy w timeboxie brakuje czasu, rezygnuje się najpierw z wymagań Could, a w razie potrzeby z Should. Wymagania Must zawsze zostają."},{id:"w02-60",s:"l",q:"Jaki maksymalny udział nakładu mogą mieć wymagania Must w DSDM?",a:["≤ 60%","≤ 20%","≤ 80%","100%"],w:["≈ 20% to Could.","Za dużo.","Za dużo – brak bufora."],e:"Wymagania Must mogą zajmować najwyżej 60% nakładu, a Could około 20%, co stanowi bufor."},{id:"w02-61",s:"l",q:"Jaka jest kolejność faz DSDM?",a:["Przed projektem → Wykonalność → Podstawy → Wytwarzanie ewolucyjne → Wdrożenie → Po projekcie","Podstawy → Wykonalność → Wdrożenie","Wytwarzanie → Wykonalność → Podstawy","Identyfikacja → Realizacja → Ukończenie"],w:["Wykonalność jest przed podstawami.","Zła kolejność.","To klasyczne etapy."],e:"Fazy DSDM: przed projektem, wykonalność (czy warto i czy się da), podstawy (robimy „wystarczająco”, a nie wszystko z góry), wytwarzanie ewolucyjne, wdrożenie i po projekcie."},{id:"w02-62",s:"l",q:"Jak długo trwa typowy timebox w DSDM?",a:["2–4 tygodnie","1 dzień","3–6 miesięcy","1 rok"],w:["Za krótko.","Za długo.","Za długo."],e:"Typowy timebox w DSDM trwa od 2 do 4 tygodni. Składa się z kick-offu, badania, doskonalenia, konsolidacji i zamknięcia."},{id:"w02-63",s:"l",q:"Która rola DSDM ma najwyższą moc decyzyjną i zapewnia finansowanie?",a:["Sponsor biznesowy","Wizjoner biznesowy","Ambasador biznesu","Koordynator techniczny"],w:["Wizjoner – cele biznesowe.","Ambasador – codzienne decyzje w zespole.","Koordynator – architektura."],e:"Sponsor biznesowy zapewnia finansowanie i zasoby, a w DSDM ma najwyższą moc decyzyjną."},{id:"w02-64",s:"m",q:"Jaka miara postępu jest typowa dla PM w FDD?",a:["% ukończenia cech","Prędkość zespołu","Czas przepływu","Terminowość timeboxów"],w:["To XP.","To Lean.","To DSDM."],e:"Typowe miary postępu: w XP prędkość, w FDD procent ukończonych cech, w Lean czas przepływu, w DSDM terminowość timeboxów."},{id:"w02-65",s:"m",q:"Na tablicy zadań kolumna „W toku” ma limit WIP 2 i jest pełna. Co robi para, która skończyła zadanie?",a:["Pomaga domknąć zadania w toku lub testy, zanim weźmie nowe","Bierze nowe zadanie z „Do zrobienia”","Zwiększa limit WIP","Czeka bezczynnie"],w:["Limit WIP to blokuje.","Limitów się nie łamie doraźnie.","Może pomagać innym."],e:"Limit WIP oznacza: najpierw kończ, potem zaczynaj. Gdy kolumna „W toku” jest pełna, para pomaga domknąć zadania w toku albo ich testy, zamiast brać nowe zadanie."}],_k={id:Bk,title:Fk,sections:Kk,questions:Jk},Uk="w03",Hk="W2b · Jakość: ISO, testy, TDD, refaktoryzacja, dług techniczny",Vk=[{id:"a",title:"Dlaczego jakość się opłaca",text:`M. Fowler w 2007 roku sformułował **hipotezę wytrzymałości projektu** (Design Stamina Hypothesis). Według niej, jeśli nie dbamy o jakość, to od pewnego punktu zwrotnego liczba funkcji dostarczanych w czasie zaczyna spadać.

Słaba jakość narasta, gdy zmiany wprowadza się doraźnie pod presją czasu. Trudno ją wykryć i kosztowna jest jej naprawa, a klient jej nie widzi.`},{id:"b",title:"Normy ISO 9000 i ISO/IEC 25010",text:`Norma **ISO 9000:2015** zawiera 7 zasad zarządzania jakością: orientację na klienta, przywództwo, zaangażowanie ludzi, podejście procesowe, doskonalenie, podejmowanie decyzji na podstawie dowodów i zarządzanie relacjami. Zasadzie „doskonalenie” (cykl PDCA) odpowiada w podejściu zwinnym retrospektywa po każdej iteracji.

Norma **ISO/IEC 25010:2023** opisuje jakość oprogramowania za pomocą **9 charakterystyk**:
• przydatność funkcjonalna,
• wydajność,
• kompatybilność,
• zdolność interakcji (dawniej użyteczność),
• niezawodność,
• bezpieczeństwo informacji (security),
• utrzymywalność,
• elastyczność (dawniej przenośność),
• bezpieczeństwo użytkowania (safety) – to nowość z 2023 roku.

**Utrzymywalność** obejmuje modułowość, ponowne użycie, analizowalność, modyfikowalność i testowalność. **Niezawodność** dotyczy na przykład sytuacji, w której awaria drukarki nie blokuje przyjęcia zlecenia: wydruk trafia do kolejki i jest ponawiany.`},{id:"c",title:"Wykrywanie defektów i piramida testów",text:`Żadna pojedyncza metoda nie wykrywa więcej niż około **75%** defektów (dane McConnella). Dlatego metody się łączy. Przegląd kodu jest przy tym tańszy niż testowanie. W praktyce zwinnej praca w parze jest ciągłym przeglądem, pull request to przegląd, a ciągła integracja uruchamia testy przy każdym scaleniu.

**Piramida testów** określa proporcje: około 70% to testy jednostkowe, 20% integracyjne, a 10% testy interfejsu i end-to-end. Odwrócona piramida to antywzorzec „**rożek lodów**”: jest dużo ręcznych testów interfejsu, a mało jednostkowych. Wtedy testowanie jest wolne i drogie, a informacja zwrotna przychodzi za późno.

**Pokrycie kodu** testami to tylko miara pomocnicza. Niskie pokrycie wskazuje luki, ale wysokie nie gwarantuje, że testy są dobre.`},{id:"d",title:"Klasy równoważności i wartości graniczne",text:`Weźmy regułę rabatu: poniżej 100 zł rabat wynosi 0%, od 100 zł do 499,99 zł wynosi 5%, a od 500 zł wynosi 10%.

**Klasy równoważności** to grupy danych, które program powinien traktować tak samo. Wystarczy jeden test z każdej klasy. Tutaj są cztery klasy: kwoty ujemne (niepoprawne), rabat 0%, rabat 5% i rabat 10%. Przykładowe dane testowe to −5, 50, 250 i 800 zł.

**Wartości graniczne** leżą na krańcach przedziałów: −0,01, 0, 99,99, 100, 499,99 i 500. Testuje się je, bo programiści najczęściej mylą znak „mniejsze niż” ze znakiem „mniejsze lub równe”.

W testowaniu bazowym każda gałąź kodu ma zostać wykonana co najmniej raz. Minimalna liczba testów jest wtedy równa **złożoności cyklomatycznej**.`},{id:"e",title:"TDD (programowanie sterowane testami)",text:`**TDD** to technika pracy programisty, a nie metodyka prowadzenia projektu. Jest rozwinięciem zasady test-first z XP (K. Beck, 2002).

Cykl TDD ma trzy kroki:
1. **RED** – piszemy test, który nie przechodzi.
2. **GREEN** – piszemy minimalny kod, dzięki któremu test przechodzi.
3. **REFACTOR** – porządkujemy kod.

R. C. Martin sformułował trzy prawa TDD: nie piszemy kodu produkcyjnego, dopóki nie mamy testu, który nie przechodzi. Test piszemy tylko w takim zakresie, żeby przestał przechodzić. Kod produkcyjny piszemy tylko w takim zakresie, żeby test przeszedł.

Przykład: pierwszy test sprawdza, że pusty koszyk ma wartość 0. Minimalny kod, który go spełnia, to \`public decimal Wartosc() => 0m;\`.

**ATDD** to odmiana, w której klient razem z zespołem pisze testy akceptacyjne przed napisaniem kodu.

Ograniczenia TDD: trudniej je stosować w interfejsie użytkownika, bazach danych i kodzie odziedziczonym po innych. Testy trzeba też utrzymywać, a ponadto są związane z implementacją.`},{id:"f",title:"Komentarze i zapachy kodu",text:`Kod powinien być czytelny sam w sobie. Komentarz ma wyjaśniać, **dlaczego** coś zrobiono, a nie co robi kod.

**Zapach kodu** (M. Fowler) to objaw problemu w strukturze programu. Kod działa, ale trudno go zmieniać. Zapach jest sygnałem, że warto przeprowadzić refaktoryzację. Zapachem nie jest błąd na granicy przedziału (to sprawa testów), niska wydajność (trzeba ją zmierzyć) ani luka bezpieczeństwa.

Przykłady zapachów i ich leczenia:
• **Zazdrość o funkcje** – metoda korzysta głównie z danych innej klasy. Rozwiązanie: przenieść metodę tam, gdzie są dane.
• **Chirurgia śrutówką** – jedna zmiana wymusza poprawki w wielu klasach. Rozwiązanie: zebrać powiązane funkcje i pola w jednym miejscu.
• **Obsesja typów prostych** – na przykład status zlecenia zapisany jako liczba 3. Rozwiązanie: zastąpić ją typem wyliczeniowym, np. \`StatusZlecenia.Wydane\`.`},{id:"g",title:"Refaktoryzacja",text:`**Refaktoryzacja** to zmiana wewnętrznej struktury kodu bez zmiany jego zachowania widocznego z zewnątrz. Nie jest przepisywaniem programu od zera ani osobnym etapem projektu.

Refaktoryzuje się: przed dodaniem nowej funkcji, gdy kod jest trudny do zrozumienia, przy trzecim powtórzeniu tego samego fragmentu (**reguła trzech**), podczas przeglądu kodu i w kroku REFACTOR cyklu TDD.

„**Dwa kapelusze**” Becka oznaczają, że w danej chwili albo dodajemy funkcję, albo refaktoryzujemy, ale nigdy jedno i drugie naraz. Reguła skauta mówi: zostaw kod czystszy, niż go zastałeś.

Bezpieczna refaktoryzacja idzie małymi krokami: zmiana, testy, commit. Jeśli po kroku testy są czerwone, cofamy ten ostatni krok.

Bardzo zły system zastępuje się stopniowo, zamiast przepisywać go od zera. Służy do tego wzorzec **strangler fig**: nowy kod po kolei przejmuje funkcje starego.`},{id:"h",title:"Dług techniczny",text:`Pojęcie **długu technicznego** wprowadził W. Cunningham w 1992 roku. Porównał uproszczenie w kodzie do pożyczki. Odsetkami jest wolniejszy rozwój projektu, a spłatą refaktoryzacja.

Kwadrant Fowlera dzieli dług na dwie osie: lekkomyślny albo rozważny oraz świadomy albo nieświadomy. Przykłady:
• „Wydajemy teraz, a spłacimy w kolejnej iteracji” – dług **świadomy i rozważny**.
• „Teraz wiemy, jak należało to zrobić” – dług **nieświadomy i rozważny**, bo wiedza przychodzi dopiero z czasem.

Jak zarządzać długiem: umieścić go w backlogu razem z kosztem i przeznaczać stałą część pojemności iteracji na jego spłatę. Nowy dług ograniczają DoD i przeglądy kodu, a decyzję o spłacie podejmuje się na retrospektywie razem z właścicielem produktu.`},{id:"i",title:"ADR, karty CRC, narzędzia AI i retrospektywa",text:`**ADR** (M. Nygard, 2011) to rekord decyzji architektonicznej. Opisuje kontekst, samą decyzję i jej konsekwencje. **Karty CRC** (Beck i Cunningham, 1989) to technika projektowania: dla każdej klasy zapisuje się jej odpowiedzialności i współpracowników.

Asystenci AI, na przykład GitHub Copilot, potrafią proponować zmiany w kodzie. Decyzja, testy i przegląd pozostają jednak po stronie zespołu.

Jakość nie jest fazą na końcu projektu, tylko elementem każdej iteracji. Dług techniczny spłaca się i proces doskonali na **retrospektywie**.`}],Zk=[{id:"w03-01",s:"a",q:"Kto sformułował „hipotezę wytrzymałości projektu” (Design Stamina Hypothesis)?",a:["M. Fowler (2007)","K. Beck","S. McConnell","W. Cunningham"],w:["Beck – XP, TDD.","McConnell – Code Complete.","Cunningham – dług techniczny."],e:"M. Fowler w 2007 roku sformułował hipotezę wytrzymałości projektu (Design Stamina Hypothesis). Według niej bez dbałości o jakość po pewnym punkcie zwrotnym liczba dostarczanych funkcji zaczyna spadać."},{id:"w03-02",s:"a",q:"Która cecha słabej jakości kodu wymieniona jest na wykładzie?",a:["Jest trudna i kosztowna do wykrycia – klient jej nie widzi","Zawsze powoduje awarie","Przyspiesza rozwój","Jest łatwa do wykrycia"],w:["Nie zawsze – często działa.","Spowalnia rozwój.","Odwrotnie."],e:"Słaba jakość narasta, gdy zmiany wprowadza się doraźnie pod presją czasu. Jest trudna i kosztowna do wykrycia, bo klient jej nie widzi."},{id:"w03-03",s:"b",q:"Ile zasad jakości ma ISO 9000:2015?",a:["7","5","8","10"],w:["Za mało.","8 to zasady DSDM.","10 to obszary PMBOK 6."],e:"ISO 9000:2015 ma 7 zasad: orientację na klienta, przywództwo, zaangażowanie ludzi, podejście procesowe, doskonalenie, decyzje oparte na dowodach i zarządzanie relacjami."},{id:"w03-04",s:"b",q:"Która praktyka zwinna odpowiada zasadzie ISO 9000 „Doskonalenie” (PDCA)?",a:["Retrospektywa po każdej iteracji","Klient w zespole","Tablica i limit WIP","Lider służebny"],w:["To orientacja na klienta.","To podejście procesowe.","To przywództwo."],e:"Zasadzie „doskonalenie”, czyli ciągłemu ulepszaniu (PDCA), odpowiada w podejściu zwinnym retrospektywa po każdej iteracji."},{id:"w03-05",s:"b",q:"Ile charakterystyk jakości ma model ISO/IEC 25010:2023?",a:["9","8","6","12"],w:["8 miała wersja 2011.","Za mało.","Za dużo."],e:"ISO/IEC 25010:2023 ma 9 charakterystyk jakości: przydatność funkcjonalną, wydajność, kompatybilność, zdolność interakcji, niezawodność, bezpieczeństwo (security), utrzymywalność, elastyczność i bezpieczeństwo użytkowania (safety)."},{id:"w03-06",s:"b",q:"Jak w ISO 25010:2023 nazywa się dawna „użyteczność”?",a:["Zdolność interakcji","Elastyczność","Przydatność funkcjonalna","Kompatybilność"],w:["Elastyczność to dawna przenośność.","To inna charakterystyka.","To inna charakterystyka."],e:"W wersji z 2023 roku zmieniono nazwy: użyteczność stała się zdolnością interakcji, a przenośność elastycznością. Dodano też nową charakterystykę, safety."},{id:"w03-07",s:"b",q:"Która charakterystyka jest NOWA w ISO 25010:2023?",a:["Bezpieczeństwo użytkowania (safety)","Bezpieczeństwo (security)","Niezawodność","Wydajność"],w:["Security była wcześniej.","Była wcześniej.","Była wcześniej."],e:"Nowa w ISO 25010:2023 jest charakterystyka safety, czyli bezpieczeństwo użytkowania. Obejmuje ograniczenia, wykrywanie zagrożeń i bezpieczne awarie."},{id:"w03-08",s:"b",q:"Do której charakterystyki ISO 25010 należy testowalność i modyfikowalność?",a:["Utrzymywalność","Niezawodność","Elastyczność","Przydatność funkcjonalna"],w:["Niezawodność – dostępność, tolerancja błędów.","Elastyczność – adaptowalność, skalowalność.","Funkcjonalna – kompletność, poprawność."],e:"Utrzymywalność obejmuje modułowość, ponowne użycie, analizowalność, modyfikowalność i testowalność."},{id:"w03-09",s:"b",q:"Pralnia: „awaria drukarki nie blokuje przyjęcia zlecenia”. Którą charakterystykę ISO 25010 to dotyczy?",a:["Niezawodność","Wydajność","Kompatybilność","Zdolność interakcji"],w:["Wydajność – czas odpowiedzi.","Kompatybilność – współpraca z innymi systemami.","Zdolność interakcji – obsługa przez użytkownika."],e:"To przykład niezawodności: awaria drukarki nie blokuje pracy systemu, bo wydruk trafia do kolejki i jest ponawiany."},{id:"w03-10",s:"c",q:"Jaka jest maksymalna typowa skuteczność wykrywania defektów pojedynczej metody wg McConnella?",a:["ok. 75%","ok. 95%","ok. 30%","100%"],w:["Żadna metoda tego nie osiąga.","Wiele metod przekracza 30%.","Niemożliwe."],e:"Żadna pojedyncza metoda wykrywania defektów nie przekracza około 75% skuteczności, dlatego łączy się różne metody."},{id:"w03-11",s:"c",q:"Jaki wniosek płynie z danych o wykrywaniu defektów?",a:["Łącz metody; przegląd jest tańszy niż test","Wystarczą testy jednostkowe","Wystarczą testy beta","Inspekcje są bezużyteczne"],w:["Jedna metoda nie wystarcza.","Jedna metoda nie wystarcza.","Formalne inspekcje są skuteczne."],e:"Skoro żadna metoda nie wystarcza, łączy się je, a przegląd kodu jest tańszy niż test. W praktyce zwinnej para to ciągły przegląd, pull request to przegląd, a CI uruchamia testy przy scaleniu."},{id:"w03-12",s:"c",q:"Jaki jest typowy udział testów jednostkowych w piramidzie testów?",a:["ok. 70%","ok. 10%","ok. 20%","ok. 50%"],w:["10% – UI/E2E.","20% – integracyjne.","Nie ta proporcja."],e:"W piramidzie testów około 70% stanowią testy jednostkowe, 20% integracyjne i 10% testy interfejsu oraz end-to-end."},{id:"w03-13",s:"c",q:"Czym jest antywzorzec „rożek lodów”?",a:["Dużo ręcznych testów UI, mało jednostkowych → wolno i drogo","Dużo testów jednostkowych","Brak testów UI","Testy tylko w CI"],w:["To zdrowa piramida.","To nie jest antywzorzec z wykładu.","To dobra praktyka."],e:"Rożek lodów to odwrócona piramida testów: dużo ręcznych testów interfejsu, a mało jednostkowych. Jest wolny i drogi, a informacja zwrotna przychodzi za późno."},{id:"w03-14",s:"c",q:"Co mówi wykład o pokryciu kodu?",a:["To miara pomocnicza: niskie wskazuje luki, wysokie nie gwarantuje dobrych testów","100% gwarantuje brak błędów","Jest bezużyteczne","Jest jedynym kryterium jakości"],w:["Nie gwarantuje.","Pomaga znaleźć luki.","Nie jedynym."],e:"Pokrycie kodu jest tylko miarą pomocniczą. Niskie wskazuje luki w testach, ale wysokie nie gwarantuje, że testy są dobre."},{id:"w03-15",s:"d",q:"Reguła rabatu: < 100 zł – 0%, 100–499,99 zł – 5%, ≥ 500 zł – 10%. Które wartości to wartości graniczne?",a:["−0,01 · 0 · 99,99 · 100 · 499,99 · 500","−5 · 50 · 250 · 800","1 · 2 · 3","120 zł"],w:["To klasy równoważności (po jednym na klasę).","Losowe.","To typowe „dobre dane”."],e:"Wartości graniczne leżą na krańcach przedziałów. Najczęstszy błąd to użycie znaku „mniejsze niż” zamiast „mniejsze lub równe”, dlatego testuje się wartości przy samych krańcach."},{id:"w03-16",s:"d",q:"Ile testów wystarcza dla klas równoważności w regule rabatu (4 klasy: ujemne, 0%, 5%, 10%)?",a:["4 – po jednym na klasę","1","Wszystkie możliwe wartości","100"],w:["Nie pokryje klas.","Niemożliwe.","Zbędne."],e:"W testowaniu klas równoważności wystarczy jeden test na klasę. Cztery klasy to cztery testy, na przykład −5, 50, 250 i 800 zł."},{id:"w03-17",s:"d",q:"Jaka jest minimalna liczba testów w testowaniu bazowym?",a:["Równa złożoności cyklomatycznej","Równa liczbie linii kodu","Zawsze 1","Równa liczbie klas"],w:["Nie.","Każda gałąź co najmniej raz.","Nie."],e:"W testowaniu bazowym każda gałąź kodu ma zostać wykonana co najmniej raz. Minimalna liczba testów jest równa złożoności cyklomatycznej."},{id:"w03-18",s:"e",q:"Czym jest TDD wg wykładu?",a:["Techniką programisty (nie metodyką projektu), rozwinięciem test-first z XP","Metodyką zarządzania projektem","Rodzajem testów beta","Narzędziem CI"],w:["Nie metodyka.","To nie testy beta.","To nie narzędzie."],e:"TDD jest techniką pracy programisty, a nie metodyką projektu. Rozwija zasadę test-first z XP, a jego cykl to RED, GREEN, REFACTOR (K. Beck, 2002)."},{id:"w03-19",s:"e",q:"Jaka jest kolejność cyklu TDD?",a:["RED → GREEN → REFACTOR","GREEN → RED → REFACTOR","REFACTOR → RED → GREEN","CODE → TEST → DEPLOY"],w:["Najpierw czerwony test.","Refaktoryzacja na końcu.","To nie TDD."],e:"Najpierw piszemy test, który nie przechodzi (RED), potem minimalny kod, który go spełnia (GREEN), a na końcu porządkujemy kod (REFACTOR)."},{id:"w03-20",s:"e",q:"Które z praw TDD (R. C. Martin) jest poprawne?",a:["Kod produkcyjny tylko na tyle, by test przeszedł","Pisz cały kod, potem testy","Testy pisz po wdrożeniu","Test może przejść od razu"],w:["To odwrotność TDD.","Najpierw test.","Test musi najpierw nie przechodzić."],e:"Zgodnie z prawami TDD R. C. Martina kod produkcyjny piszemy tylko w takim zakresie, żeby test przeszedł. Nie piszemy go też bez testu, który nie przechodzi."},{id:"w03-21",s:"e",q:"W przykładzie TDD po pierwszym teście (pusty koszyk = 0) jaki jest minimalny kod GREEN?",a:["public decimal Wartosc() => 0m;","Pełna implementacja z listą pozycji","Brak kodu","throw new NotImplementedException()"],w:["Za dużo – to dopiero REFACTOR po kolejnych testach.","Test nie przejdzie.","Test nie przejdzie."],e:"Krok GREEN to minimalny kod, dzięki któremu test przechodzi. Dla pustego koszyka wystarczy zwrócić 0."},{id:"w03-22",s:"e",q:"Która odmiana „najpierw test” dotyczy testów akceptacyjnych pisanych przez klienta z zespołem?",a:["ATDD","TDD","BDD","DDD"],w:["TDD – programista, testy jednostkowe.","BDD – zachowanie, Given–When–Then.","DDD to projektowanie dziedzinowe."],e:"ATDD to odmiana „najpierw test”, w której klient razem z zespołem pisze kryteria i testy akceptacyjne przed napisaniem kodu."},{id:"w03-23",s:"e",q:"Które ograniczenie TDD wymieniono?",a:["Trudniejsze dla UI, baz danych i kodu zastanego","Brak informacji zwrotnej","Brak testów regresyjnych","Gorszy projekt kodu"],w:["Feedback w minutach – zaleta.","Daje testy regresyjne.","Kod testowalny = lepszy projekt."],e:"Ograniczenia TDD: trudniej je stosować w interfejsie użytkownika, bazach danych i kodzie odziedziczonym po innych. Testy trzeba utrzymywać, a ponadto są związane z implementacją."},{id:"w03-24",s:"f",q:"Co powinien wyjaśniać komentarz wg standardu kodowania?",a:["Dlaczego (a nie co)","Co robi każda linia","Kto napisał kod","Datę zmiany"],w:["Co – powinien mówić kod.","To wie system kontroli wersji.","To wie VCS."],e:"Komentarz powinien wyjaśniać, dlaczego coś zrobiono, a nie co robi kod. Kod ma być czytelny sam w sobie."},{id:"w03-25",s:"f",q:"Czym jest zapach kodu?",a:["Symptomem problemu w strukturze – kod działa, ale trudno go zmienić","Błędem w działaniu programu","Luką bezpieczeństwa","Niską wydajnością"],w:["To nie błąd.","To nie zapach (→ przegląd bezpieczeństwa).","To nie zapach (→ pomiar)."],e:"Zapach kodu to objaw problemu w strukturze: kod działa, ale trudno go zmieniać. To sygnał, że warto przeprowadzić refaktoryzację (M. Fowler)."},{id:"w03-26",s:"f",q:"Które z poniższych NIE jest zapachem kodu wg wykładu?",a:["Błąd na granicy przedziału","Długa lista parametrów","Magiczna liczba","Zazdrość o funkcje"],w:["To zapach.","To zapach (obsesja typów prostych).","To zapach."],e:"Błąd na granicy przedziału wykrywa się testem, niską wydajność pomiarem, a lukę bezpieczeństwa analizą bezpieczeństwa. Żaden z nich nie jest zapachem kodu."},{id:"w03-27",s:"f",q:"Metoda używa głównie danych innej klasy. Jaki to zapach i jaka refaktoryzacja?",a:["Zazdrość o funkcje → przenieś funkcję","Długa funkcja → wyodrębnij funkcję","Tajemnicza nazwa → zmień nazwę","Chirurgia śrutówką → podziel klasę"],w:["To inny objaw.","To inny objaw.","To inny objaw (zmiana → wiele klas)."],e:"Gdy metoda korzysta głównie z danych innej klasy, mamy zazdrość o funkcje (feature envy). Rozwiązaniem jest przeniesienie metody tam, gdzie są dane."},{id:"w03-28",s:"f",q:"Jedna zmiana wymusza poprawki w wielu klasach. Jak nazywa się ten zapach?",a:["Chirurgia śrutówką","Spekulatywna ogólność","Powielony kod","Obsesja typów prostych"],w:["Kod na zapas.","Ten sam fragment w wielu miejscach.","status jako int itp."],e:"Gdy jedna zmiana wymusza poprawki w wielu klasach, mamy chirurgię śrutówką. Rozwiązaniem jest przeniesienie powiązanych funkcji i pól w jedno miejsce."},{id:"w03-29",s:"f",q:"Jak zrefaktoryzować status zlecenia zapisany jako int 3?",a:["Zastąp typ prosty enum (np. StatusZlecenia.Wydane)","Dodaj komentarz „3 = wydane”","Zmień na double","Usuń status"],w:["Komentarz „dezodorant” – nie leczy.","Nadal typ prosty.","Status jest potrzebny."],e:"Zapisywanie statusu jako liczby to obsesja typów prostych i „magiczna liczba”. Rozwiązaniem jest typ wyliczeniowy (enum) albo obiekt, na przykład `StatusZlecenia.Wydane`."},{id:"w03-30",s:"g",q:"Czym jest refaktoryzacja?",a:["Zmianą wewnętrznej struktury kodu bez zmiany obserwowalnego zachowania","Naprawą błędów","Dodawaniem funkcji","Optymalizacją wydajności"],w:["Naprawa zmienia zachowanie.","To nie refaktoryzacja.","To nie refaktoryzacja."],e:"Refaktoryzacja zmienia wewnętrzną strukturę kodu bez zmiany jego zachowania widocznego z zewnątrz. Nie jest przepisywaniem od zera ani osobnym etapem projektu."},{id:"w03-31",s:"g",q:"Co mówi reguła trzech w refaktoryzacji?",a:["Za trzecim powtórzeniem wyodrębnij kod","Refaktoryzuj co trzy iteracje","Maksymalnie trzy refaktoryzacje dziennie","Trzy osoby zatwierdzają refaktoryzację"],w:["Nie chodzi o iteracje.","Brak takiego limitu.","Nie."],e:"Reguła trzech mówi, że za trzecim powtórzeniem wyodrębnia się wspólny kod. Refaktoryzuje się też przed dodaniem funkcji, gdy kod jest trudny, na przeglądzie i w kroku REFACTOR."},{id:"w03-32",s:"g",q:"Co oznaczają „dwa kapelusze” Becka?",a:["Albo dodajesz funkcję, albo refaktoryzujesz – nigdy naraz","Programista i tester w jednej osobie","Kierowca i nawigator","Kod i testy"],w:["Nie o rolach.","To pary.","Nie."],e:"„Dwa kapelusze” Becka: w danej chwili albo dodajesz funkcję, albo refaktoryzujesz, nigdy jedno i drugie naraz. Reguła skauta mówi dodatkowo, żeby zostawić kod czystszy, niż go zastałeś."},{id:"w03-33",s:"g",q:"Co zrobić, gdy po kroku refaktoryzacji testy są czerwone?",a:["Cofnąć ostatni krok","Wyłączyć testy","Kontynuować kolejne kroki","Przepisać system od zera"],w:["Testy pilnują zachowania.","Najpierw powrót do zielonego.","Przepisywanie to ostateczność (strangler fig)."],e:"Bezpieczna refaktoryzacja idzie małymi krokami: zmiana, testy, commit. Jeśli testy są czerwone, cofa się ostatni krok."},{id:"w03-34",s:"g",q:"Jak zastąpić bardzo zły system bez przepisywania od zera?",a:["Stopniowa wymiana – wzorzec strangler fig","Big bang rewrite","Usunięcie testów","Zamrożenie kodu"],w:["Właśnie tego się unika.","Testy są potrzebne.","Nie rozwiązuje problemu."],e:"Bardzo zły system zastępuje się stopniowo, wzorcem strangler fig. Nowy kod po kolei przejmuje funkcje starego, więc nie trzeba przepisywać wszystkiego od zera."},{id:"w03-35",s:"h",q:"Kto wprowadził pojęcie długu technicznego?",a:["W. Cunningham (1992)","M. Fowler","K. Beck","R. C. Martin"],w:["Fowler – kwadrant długu (2009).","Beck – XP.","Martin – Czysty kod."],e:"Pojęcie długu technicznego wprowadził W. Cunningham w 1992 roku. Uproszczenie jest pożyczką, odsetki to wolniejszy rozwój, a spłatą jest refaktoryzacja."},{id:"w03-36",s:"h",q:"„Wydajemy teraz, spłacimy w kolejnej iteracji” – jaki to dług wg kwadrantu Fowlera?",a:["Świadomy i rozważny","Świadomy i lekkomyślny","Nieświadomy i lekkomyślny","Nieświadomy i rozważny"],w:["„Nie mamy czasu na projektowanie”.","„Co to są warstwy?”.","„Teraz wiemy, jak należało to zrobić”."],e:"Według kwadrantu Fowlera dług zaciągnięty z rozmysłem, z planem spłaty w następnej iteracji, jest świadomy i rozważny."},{id:"w03-37",s:"h",q:"„Teraz wiemy, jak należało to zrobić” – jaki to dług?",a:["Nieświadomy i rozważny","Świadomy i rozważny","Świadomy i lekkomyślny","Nieświadomy i lekkomyślny"],w:["Świadomy rozważny – „spłacimy w kolejnej iteracji”.","„Nie mamy czasu na projektowanie”.","„Co to są warstwy?”."],e:"Dług nieświadomy i rozważny powstaje, gdy dopiero po czasie zdobywamy wiedzę, jak należało coś zrobić. W chwili zaciągania długu jej jeszcze nie mieliśmy."},{id:"w03-38",s:"h",q:"Jak zarządzać długiem technicznym wg wykładu?",a:["Widoczny w backlogu z kosztem, stała część pojemności iteracji na spłatę","Ignorować do końca projektu","Spłacać tylko po wdrożeniu","Ukrywać przed klientem"],w:["Odsetki rosną.","Za późno.","Ma być widoczny."],e:"Dług techniczny powinien być widoczny w backlogu razem z kosztem, a stała część pojemności iteracji powinna iść na jego spłatę. Now
