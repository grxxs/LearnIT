ym jest Org w Salesforce?",a:["Wydzielonym środowiskiem Salesforce typu PaaS działającym w chmurze","Lokalną instalacją serwera Salesforce w firmie","Pojedynczą aplikacją z AppExchange","Kontem jednego użytkownika"],e:"Org (Organization) to wydzielone środowisko PaaS Salesforce działające w chmurze Salesforce."},{id:"w01-05",s:"b",q:"Co NIE jest wymienione jako zawartość Org-a?",a:["Fizyczne serwery i system operacyjny","Dane (w tym użytkownicy i uprawnienia)","Kod uruchamiany w Org-u","Konfiguracje (w tym aplikacje)"],e:"W Orgu przechowywane są: dane (w tym użytkownicy i ich uprawnienia), kod i konfiguracje. Infrastrukturą zajmuje się Salesforce, to istota PaaS."},{id:"w01-06",s:"b",q:"Gdzie w Org-u przechowywani są użytkownicy i ich uprawnienia?",a:["W danych Org-a","W kodzie Apex","W zewnętrznym Active Directory (zawsze)","W AppExchange"],e:"Użytkownicy i ich uprawnienia są przechowywani w danych Org-a. Oprócz danych Org zawiera też kod i konfiguracje."},{id:"w01-07",s:"b",q:"Które Org-i są kopiami innych Org-ów?",a:["Sandbox (testowe)","Developer Edition","Trailhead Playground","Production"],e:"Sandbox (testowy) to kopia innego Org-a, zwykle produkcyjnego."},{id:"w01-08",s:"b",q:"Który rodzaj Org-a jest tymczasowy i nie jest samodzielny?",a:["Scratch Org","Developer Edition","Production","Trailhead Playground"],e:"Tymczasowe Org-i (Scratch Org) nie są samodzielne, bo są tworzone z innego Org-a (Dev Hub). Sandbox to z kolei kopia innego Org-a."},{id:"w01-09",s:"b",q:"Jaki rodzaj Org-a służy do celów edukacyjnych?",a:["Trailhead Playground","Sandbox","Scratch Org","Production"],e:"Org do celów edukacyjnych to Trailhead Playground. Org developerski to Developer Edition."},{id:"w01-10",s:"b",q:"Jak nazywa się darmowy Org developerski?",a:["Developer Edition","Trailhead Playground","Full Sandbox","Experience Org"],e:"Darmowy Org developerski nazywa się Developer Edition."},{id:"w01-11",s:"c",q:"Do czego służy AppExchange?",a:["To sklep z komercyjnymi aplikacjami dla Salesforce","To narzędzie do pisania kodu Apex","To rodzaj Org-a testowego","To API do integracji z systemami zewnętrznymi"],e:"Salesforce AppExchange to marketplace z komercyjnymi aplikacjami."},{id:"w01-12",s:"d",q:"Czym jest Salesforce Customer 360?",a:["Zestawem usług SaaS dla biznesu, czyli gotowych aplikacji (Sales, Service, Marketing…)","Narzędziem do tworzenia komponentów LWC","Rodzajem Org-a produkcyjnego","Językiem zapytań do bazy danych"],e:"Customer 360 to usługi SaaS dla biznesu, czyli gotowe aplikacje, np. Sales, Marketing, Commerce, Customer Service."},{id:"w01-13",s:"d",q:"Która aplikacja Customer 360 służy do organizacji i zarządzania sprzedażą?",a:["Sales","Commerce","Field Service","Revenue Management"],e:"Aplikacja Sales służy do organizacji i zarządzania sprzedażą. Commerce dotyczy handlu elektronicznego."},{id:"w01-14",s:"d",q:"Która aplikacja Customer 360 obsługuje usługi realizowane w terenie?",a:["Field Service","Contact Center","Customer Service","Commerce"],e:"Aplikacja Field Service obsługuje usługi realizowane w terenie."},{id:"w01-15",s:"d",q:"Za co odpowiada Revenue Management?",a:["Zarządzanie ofertami, cenami, umowami i przychodami","Kampanie marketingowe i pozyskiwanie klientów","Handel elektroniczny","Obsługa zgłoszeń klientów"],e:"Revenue Management odpowiada za zarządzanie ofertami, cenami, umowami i przychodami."},{id:"w01-16",s:"d",q:"Co oznacza dopisek '360' w nazwie, np. Sales 360?",a:["Nazwę technologii oferowanej przez Salesforce w postaci aplikacji","Marketingowy ozdobnik jak 'Cloud'","Wersję API aplikacji","Liczbę dostępnych licencji"],e:"Ozdobnikami marketingowymi są 'Cloud' i 'Agentforce' (Sales Cloud, Agentforce Sales). '360' to nazwa technologii oferowanej w postaci aplikacji."},{id:"w01-17",s:"e",q:"Czym uruchamia się aplikacje w Org-u Salesforce?",a:["App Launcherem","Object Managerem","Developer Console","Setup Audit Trail"],e:"Aplikacje uruchamia się za pomocą App Launchera."},{id:"w01-18",s:"e",q:"Od czego zależy rce Classic Shell","Visualforce Theme","Experience Builder UI"],e:"Standardowy wygląd to styl Lightning Experience."},{id:"w01-24",s:"g",q:"Które narzędzie jest narzędziem low-code?",a:["Flow","Apex","SOQL","LWC"],e:"Low-code: Object Manager, Flow, Lightning App Builder. Pro-code: Apex, LWC, SOQL/SOSL, API."},{id:"w01-25",s:"g",q:"Które narzędzie należy do kategorii pro-code?",a:["Apex","Lightning App Builder","Object Manager","Flow"],e:"Do narzędzi pro-code należą Apex, LWC, SOQL/SOSL i API. Low-code to Object Manager, Flow i Lightning App Builder."},{id:"w01-26",s:"g",q:"Które narzędzie jest wymienione w kategorii integracji?",a:["MuleSoft","Object Manager","Lightning App Builder","Flow"],e:"Integracja: Platform Events, API (REST, GraphQL), MuleSoft."},{id:"w01-27",s:"g",q:"Co jest wymienione w kategorii AI wśród narzędzi dewelopera?",a:["Prompt engineering, generatywna AI, agenci AI","Platform Events i MuleSoft","Object Manager i Flow","SOQL i SOSL"],e:"AI: prompt engineering, generatywna AI, agenci AI."},{id:"w01-28",s:"g",q:"Co potrafi developer Salesforce wg wykładu?",a:["Analizować wymagania biznesowe i dobierać najlepsze rozwiązanie spośród technologii Salesforce","Administrować fizycznymi serwerami Salesforce","Tworzyć system operacyjny dla Org-a","Wyłącznie pisać kod Apex bez kontaktu z biznesem"],e:"Developer analizuje i rozumie wymagania biznesowe oraz dobiera najlepsze rozwiązanie: low-code, pro-code, AI lub integrację."},{id:"w01-29",s:"h",q:"Ile głównych wydań platformy Salesforce przypada na rok?",a:["Trzy: Spring, Summer, Winter","Dwa: Spring i Winter","Cztery: po jednym na kwartał","Jedno roczne wydanie"],e:"Trzy wydania: Spring (luty), Summer (czerwiec), Winter (październik)."},{id:"w01-30",s:"h",q:"W którym miesiącu wychodzi wydanie Winter?",a:["W październiku","W lutym","W czerwcu","W grudniu"],e:"Spring – luty, Summer – czerwiec, Winter – październik (Winter'27 wychodzi jesienią 2026)."},{id:"w01-31",s:"h",q:"Jaka wersja API odpowiada wydaniu Spring'26?",a:["66.0","67.0","68.0","60.0"],e:"Spring'26 odpowiada wersji API 66.0, Summer'26 wersji 67.0, a Winter'27 wersji 68.0. Każde kolejne wydanie podnosi wersję API o 1."},{id:"w01-32",s:"h",q:"Jak długo minimum nowe wersje API zachowują kompatybilność ze starszymi?",a:["Minimum 3 lata","Minimum 1 rok","Minimum 6 miesięcy","Bezterminowo"],e:"Nowe wersje API zachowują kompatybilność ze starszymi przez określony czas, minimum 3 lata."},{id:"w01-33",s:"h",q:"Gdzie zapisywana jest wersja API?",a:["W metadanych komponentu/projektu","W rekordzie użytkownika","W nazwie Org-a","W ciasteczku przeglądarki"],e:"Wersja API jest zapisywana w metadanych komponentu lub projektu i wpływa na dostępne możliwości oraz zachowanie kodu."},{id:"w01-34",s:"h",q:"Co przede wszystkim określa wersja API?",a:["Kontrakt i zachowanie platformy dostępne dla danego klienta, komponentu lub żądania","Cenę licencji Salesforce","Wygląd interfejsu Lightning","Liczbę użytkowników Org-a"],e:"API określa przede wszystkim kontrakt i zachowanie platformy."},{id:"w01-35",s:"i",q:"Która platforma jest alternatywą PaaS mocno zintegrowaną z Microsoft 365, Azure i Dynamics 365?",a:["Microsoft Power Platform","Oracle APEX","Google AppSheet","ServiceNow App Engine"],e:"Microsoft Power Platform to low-code/no-code zintegrowane z Microsoft 365, Azure i Dynamics 365."},{id:"w01-36",s:"i",q:"Która alternatywa jest low-code PaaS szczególnie mocno związaną z bazą Oracle?",a:["Oracle APEX","Siemens Mendix","OutSystems","Google AppSheet"],e:"Oracle APEX to low-code PaaS mocno związany z bazą Oracle. Nie mylić z językiem Apex w Salesforce!"},{id:"w01-37",s:"i",q:"Jaka jest wspólna cecha współczesnych platform aplikacyjnych wg wykładu?",a:["Integracja z AI i możliwość tworzenia agentów AI","Brak możliwości pisania kodu","Wyłącznie instalacja on-premise","Jedna, wspólna baza danych dla wszystkich dostawców"],e:"Wspólną cechą współczesnych platform jest integracja z AI i możliwość tworzenia agentów AI."},{id:"w01-38",s:"j",q:"Co NIE należy do zakresu informatyki biznesowej (zastosowań Salesforce)?",a:["Administracja serwerami","Modelowanie procesów biznesowych","Automatyzacja procesów","Analiza wymagań biznesowych"],e:"Poza zakresem są: budowanie i utrzymywanie infrastruktury, administracja serwerami, tworzenie aplikacji od podstaw, podstawowe problemy informatyki."},{id:"w01-39",s:"j",q:"Który element należy do zakresu informatyki biznesowej?",a:["Adaptacja gotowych rozwiązań","Tworzenie aplikacji od podstaw","Budowanie infrastruktury","Podstawowe problemy informatyki"],e:"W zakresie są m.in.: analiza wymagań, modelowanie procesów, automatyzacja, architektura systemów przedsiębiorstwa, AI w biznesie i adaptacja gotowych rozwiązań."},{id:"w01-40",s:"d",q:"Która aplikacja Customer 360 dotyczy kampanii marketingowych i pozyskiwania klientów?",a:["Marketing","Sales","Commerce","Contact Center"],e:"Aplikacja Marketing dotyczy kampanii marketingowych i pozyskiwania klientów."}],Ey={id:My,title:Ry,sections:Ly,questions:Iy},xy="w02",Oy="W2 · Czym są komponenty",qy=[{id:"a",title:"Definicje komponentu",text:`Różne normy definiują komponent nieco inaczej:
• **ISO/IEC 15026:1998** – jednostka o wyodrębnionej strukturze (np. zespół lub moduł oprogramowania) w systemie rozpatrywanym na określonym poziomie analizy,
• **ISO/IEC 29881:2008 (FiSMA)** – zbiór usług funkcjonalnych, który po zaimplementowaniu reprezentuje dobrze zdefiniowany zestaw funkcji i jest rozróżnialny dzięki unikalnej nazwie,
• **IEEE 829-2008** (standard dokumentacji testów oprogramowania i systemów) – jedna z części składających się na system.`},{id:"b",title:"Komponent w przemyśle",text:`W przemyśle komponent to element, który:
• może być częścią różnych systemów,
• może być wyodrębniony, produkowany odrębnie i wymieniany,
• pełni określoną funkcję,
• współpracuje z resztą systemu przez określony interfejs,
• może być zbudowany z innych komponentów, co daje architekturę hierarchiczną.

Komponent nie musi być niezbędny. Wyróżnia się komponenty krytyczne, opcjonalne i awaryjne. Nie jest prawdą, że musi być wyprodukowany razem z całym systemem.`},{id:"c",title:"Komponent w inżynierii oprogramowania",text:`Większe komponenty powstają przez **kompozycję** mniejszych. Nie przez dziedziczenie: slajd wyraźnie to podkreśla. Cechy komponentu:
• **izolacja** – hermetyzacja realizacji i niezależność implementacji,
• **zamknięta funkcjonalność** – własny kod, dane i logika,
• **ponowne wykorzystanie (reuse)** – ten sam komponent jest używany w różnych systemach.

Komponentami mogą być klasy i moduły, biblioteki i pakiety, komponenty UI, mikrousługi i API oraz kontenery i usługi chmurowe. Arkusze kalkulacyjne nie są wymienione.`},{id:"d",title:"Komponenty w Salesforce",text:`Komponenty Salesforce dzielą się na kategorie:
• **dane** – obiekty, pola, rekordy,
• **logika biznesowa** – Flow, Trigger, Validation Rules, Actions,
• **interfejs** – Lightning Web Components (HTML + JS + CSS),
• **aplikacje** – Dashboard, strony szczegółów, kalendarze,
• **integracja** – REST API i GraphQL API,
• **AI** – prompty, agenci i akcje agentów.`}],Wy=[{id:"w02-01",s:"a",q:"Jak definiuje komponent norma ISO/IEC 15026:1998?",a:["Jednostka o wyodrębnionej strukturze (np. zespół lub moduł oprogramowania) w systemie rozpatrywanym na określonym poziomie analizy","Jedna z części składających się na system","Klasa dziedzicząca po klasie bazowej Component","Zbiór testów jednostkowych systemu"],e:"ISO/IEC 15026:1998: jednostka o wyodrębnionej strukturze, np. zespół lub moduł oprogramowania, w systemie rozpatrywanym na określonym poziomie analizy."},{id:"w02-02",s:"a",q:"Która definicja komponentu pochodzi z normy ISO/IEC 29881:2008 (FiSMA)?",a:["Zbiór usług funkcjonalnych reprezentujący dobrze zdefiniowany zestaw funkcji, rozróżnialny za pomocą unikalnej nazwy","Jedna z części składających się na system","Moduł interfejsu użytkownika zbudowany z HTML, JS i CSS","Jednostka wdrożeniowa w kontenerze"],e:"ISO/IEC 29881:2008: zbiór usług funkcjonalnych, który po zaimplementowaniu reprezentuje dobrze zdefiniowany zestaw funkcji i jest rozróżnialny za pomocą unikalnej nazwy."},{id:"w02-03",s:"a",q:"Jak brzmi definicja komponentu wg IEEE 829-2008?",a:["Jedna z części składających się na system","Zbiór usług funkcjonalnych o unikalnej nazwie","Jednostka o wyodrębnionej strukturze na określonym poziomie analizy","Moduł z własnym kodem, danymi i logiką"],e:"IEEE 829-2008 (Standard for Software and System Test Documentation): komponent to jedna z części składających się na system."},{id:"w02-04",s:"a",q:"Z jakiego standardu pochodzi definicja komponentu IEEE omawiana na wykładzie?",a:["IEEE 829-2008 – dokumentacja testów oprogramowania i systemów","IEEE 754 – arytmetyka zmiennoprzecinkowa","IEEE 802.11 – sieci bezprzewodowe","IEEE 1471 – opis architektury"],e:"IEEE 829-2008: Standard for Software and System Test Documentation."},{id:"w02-05",s:"b",q:"Która cecha komponentu we współczesnym przemyśle oznacza, że ten sam element może trafić do różnych systemów?",a:["Ten sam komponent może być częścią różnych systemów","Komponent jest zawsze niezbędny","Komponent nie posiada interfejsu","Komponent nie może składać się z innych komponentów"],e:"W przemyśle: ten sam komponent może być częścią różnych systemów, może być wyodrębniony, produkowany odrębnie i wymienialny."},{id:"w02-06",s:"b",q:"Jak komponent współpracuje z resztą systemu (perspektywa przemysłowa)?",a:["Poprzez określony interfejs","Poprzez bezpośredni dostęp do pamięci innych części","Poprzez dziedziczenie po innych komponentach","Nie współpracuje, działa całkowicie samodzielnie"],e:"Komponent współpracuje z pozostałą częścią systemu poprzez określony interfejs."},{id:"w02-07",s:"b",q:"Jaką architekturę daje to, że komponent może być zbudowany z innych komponentów?",a:["Hierarchiczną","Płaską","Monolityczną","Peer-to-peer"],e:"Komponent może być zbudowany z innych komponentów, co daje architekturę hierarchiczną."},{id:"w02-08",s:"b",q:"Jakie rodzaje komponentów wyróżnia się ze względu na to, czy są niezbędne do działania systemu?",a:["Krytyczne, opcjonalne, awaryjne","Publiczne, prywatne, chronione","Statyczne, dynamiczne, abstrakcyjne","Frontendowe, backendowe, bazodanowe"],e:"Komponent może nie być niezbędny. Wyróżnia się komponenty krytyczne, opcjonalne i awaryjne."},{id:"w02-09",s:"c",q:"Jak we współczesnej inżynierii oprogramowania powstają większe komponenty?",a:["Przez kompozycję mniejszych komponentów","Przez dziedziczenie po mniejszych komponentach","Przez kopiowanie kodu źródłowego","Przez łączenie baz danych"],e:"We współczesnej inżynierii oprogramowania większe komponenty powstają przez kompozycję mniejszych. Slajd wyraźnie podkreśla, że nie przez dziedziczenie."},{id:"w02-10",s:"c",q:"Który mechanizm wykład wyraźnie wskazuje jako NIE będący sposobem budowy komponentów?",a:["Dziedziczenie","Kompozycja","Hermetyzacja","Izolacja"],e:"Na slajdzie jest wyraźna uwaga: większe komponenty powstają z mniejszych przez kompozycję, a nie przez dziedziczenie."},{id:"w02-11",s:"c",q:"Co oznacza izolacja komponentu?",a:["Hermetyzację realizacji i niezależność implementacji","Brak jakiegokolwiek interfejsu","Uruchamianie komponentu na osobnym serwerze","Zakaz ponownego użycia"],e:"Izolacja = hermetyzacja realizacji + niezależność implementacji."},{id:"w02-12",s:"c",q:"Co oznacza, że komponent ma 'zamkniętą funkcjonalność'?",a:["Ma własny kod, dane i logikę","Nie można go już modyfikować","Nie ma dostępu do sieci","Jest dostępny tylko dla administratora"],e:"Zamknięta funkcjonalność: własny kod, dane i logika. To moduł o określonej odpowiedzialności."},{id:"w02-13",s:"c",q:"Co oznacza ponowne wykorzystanie (reuse) komponentu?",a:["Ten sam komponent jest używany w różnych systemach","Komponent jest kopiowany i modyfikowany w każdym projekcie","Komponent uruchamia się wielokrotnie w pętli","Komponent dziedziczy po wielu klasach"],e:"Ponowne wykorzystanie: ten sam komponent w różnych systemach."},{id:"w02-14",s:"c",q:"Która technologia NIE jest wymieniona jako forma komponentu we współczesnej inżynierii oprogramowania?",a:["Arkusze kalkulacyjne","Mikrousługi i API","Biblioteki i pakiety","Kontenery i usługi chmurowe"],e:"Wymienione technologie: klasy i moduły, biblioteki i pakiety, komponenty UI, mikrousługi i API, kontenery i usługi chmurowe."},{id:"w02-15",s:"d",q:"Do jakiej kategorii komponentów Salesforce należą obiekty, pola i rekordy?",a:["Komponenty danych","Komponenty logiki biznesowej","Komponenty interfejsu","Komponenty integracyjne"],e:"Obiekty, pola i rekordy to komponenty danych."},{id:"w02-16",s:"d",q:"Które elementy Salesforce to komponenty logiki biznesowej?",a:["Flow, Trigger, Validation Rules, Actions","Obiekty, pola, rekordy","Dashboard, kalendarze, detale","REST API, GraphQL API"],e:"Komponenty logiki biznesowej: Flow, Trigger, Validation Rules, Actions."},{id:"w02-17",s:"d",q:"Z czego zbudowane są Lightning Web Components (komponenty interfejsu)?",a:["HTML + JS + CSS","Apex + SOQL","XML + XSLT","Java + JSP"],e:"Komponenty interfejsu: Lightning Web Components (HTML + JS + CSS)."},{id:"w02-18",s:"d",q:"Do jakiej kategorii komponentów Salesforce należą Dashboard, Detale i Kalendarze?",a:["Komponenty aplikacji","Komponenty danych","Komponenty AI","Komponenty integracyjne"],e:"Komponenty aplikacji: Dashboard, detale, kalendarze."},{id:"w02-19",s:"d",q:"Które elementy to komponenty integracyjne w Salesforce?",a:["REST API, GraphQL API","Flow, Trigger","Prompty, agenty","Obiekty, pola"],e:"Komponenty integracyjne: REST API i GraphQL API."},{id:"w02-20",s:"d",q:"Co należy do komponentów AI w Salesforce?",a:["Prompty, agenty, akcje agentów","Validation Rules i Flow","Dashboard i kalendarze","Rekordy i pola"],e:"Komponenty AI: prompty, agenty, akcje agentów."},{id:"w02-21",s:"d",q:"Do której kategorii komponentów Salesforce należy Validation Rule?",a:["Logiki biznesowej","Danych","Interfejsu","Aplikacji"],e:"Validation Rules są komponentem logiki biznesowej, obok Flow, Triggerów i Actions."},{id:"w02-22",s:"b",q:"Która cecha NIE opisuje komponentu we współczesnym przemyśle?",a:["Musi być zawsze wyprodukowany razem z całym systemem","Wymienialny","Produkowany odrębnie","Pełni określoną funkcję w systemie"],e:"Komponent jest produkowany odrębnie, wymienialny, może być wyodrębniony jako osobna jednostka i pełni określoną funkcję."}],By={id:xy,title:Oy,sections:qy,questions:Wy},Fy="w03",Ky="W3 · Model danych Salesforce",Jy=[{id:"a",title:"Model danych a baza danych",text:`Model danych Salesforce jest elementem architektury platformy biznesowej, a nie tylko strukturą obiektów w Org-u. Wpływa na sposób przechowywania informacji, działanie aplikacji, automatyzację, kontrolę dostępu, AI i integracje. Nie wpływa bezpośrednio na cenę licencji.

**Baza danych** to jeden z mechanizmów przechowywania informacji. **Model danych** opisuje natomiast znaczenie, strukturę i powiązania informacji. Obejmuje definicje obiektów, pól, relacji i reguł opisujących dane. Może też obejmować dane z systemów zewnętrznych, których nie ma fizycznie w Org-u.`},{id:"b",title:"Perspektywa biznesowa i obiekty standardowe",text:`Model danych można oglądać z sześciu perspektyw: biznesowej, aplikacyjnej, bezpieczeństwa, integracyjnej, analitycznej i AI. Perspektywy sprzętowej nie ma.

W **perspektywie biznesowej** model odzwierciedla dziedzinę biznesową przedsiębiorstwa, a relacje między obiektami wynikają bezpośrednio z procesów biznesowych. Salesforce dostarcza gotowy model dla standardowych obszarów, który można rozszerzać o własne obiekty, pola i relacje. Przykłady obiektów standardowych:
• **Account** – firma lub klient,
• **Contact** – osoba powiązana z firmą,
• **Opportunity** – szansa sprzedaży.`},{id:"c",title:"Perspektywa aplikacyjna",text:"W perspektywie aplikacyjnej model danych jest podstawą interfejsu użytkownika oraz logiki aplikacji (Flow, Apex, LWC). Na przykład typ pola decyduje, jaki komponent UI zostanie użyty do jego pokazania. Reguły walidacyjne ograniczają dziedzinę danych, czyli dopuszczalne wartości. Relacje określają źródło danych dla logiki aplikacji."},{id:"d",title:"Perspektywa bezpieczeństwa",text:`Dostęp do danych kontroluje się na trzech poziomach:
• **obiekt** – czy użytkownik może odczytywać, tworzyć, modyfikować lub usuwać rekordy (CRUD),
• **pole** – czy może pole odczytać lub zmienić,
• **rekord** – do których konkretnych rekordów ma dostęp.

Relacja Master-Detail wiąże dostęp do rekordów podrzędnych z dostępem do rekordów nadrzędnych.`},{id:"e",title:"Perspektywa integracyjna",text:"**External Objects** (obiekty zewnętrzne) dają dostęp do danych przechowywanych w systemie zewnętrznym, bez trzymania ich kopii w Salesforce. **Data 360** służy do integracji, harmonizacji i ujednolicania danych z różnych źródeł oraz do udostępniania danych innym systemom. Model danych opisuje strukturę informacji, a integracja określa sposób ich wymiany. Mechanizmy integracyjne zwykle wpływają na kształt modelu."},{id:"f",title:"Analityka, AI i podsumowanie",text:`W perspektywie analitycznej i AI dane historyczne służą do prognozowania. Przykład z wykładu to uczenie maszynowe, które przewiduje prawdopodobieństwo zamknięcia szansy sprzedaży. Agenci AI korzystają z danych biznesowych, żeby odpowiadać, rekomendować i wykonywać operacje, ale tylko w ramach przyznanych uprawnień.

Podsumowując, model danych organizuje informacje za pomocą obiektów, pól i relacji. Jest podstawą raportowania, analityki i wykorzystania AI, a także wspiera aplikacje, automatyzację, bezpieczeństwo i integracje.`}],_y=[{id:"w03-01",s:"a",q:"Czym jest model danych Salesforce wg wykładu?",a:["Elementem architektury platformy biznesowej, a nie tylko strukturą obiektów w Org-u","Wyłącznie zbiorem tabel w bazie danych","Fizycznym serwerem bazy danych","Plikiem konfiguracyjnym XML"],e:"Model danych jest elementem architektury platformy biznesowej, a nie tylko strukturą obiektów w Org-u."},{id:"w03-02",s:"a",q:"Na co przyjęty model danych NIE wpływa bezpośrednio wg wykładu?",a:["Cenę licencji Salesforce","Kontrolę dostępu","Automatyzację procesów","Działanie sztucznej inteligencji"],e:"Model danych wpływa na: sposób przechowania informacji, działanie aplikacji, automatyzację, kontrolę dostępu, AI i integracje."},{id:"w03-03",s:"a",q:"Jaka jest różnica między bazą danych a modelem danych?",a:["Baza danych to mechanizm przechowywania, a model danych opisuje znaczenie, strukturę i powiązania informacji","To synonimy","Model danych to fizyczny plik bazy","Baza danych opisuje znaczenie danych, a model danych je przechowuje"],e:"Baza danych jest jednym z mechanizmów przechowywania informacji, natomiast model danych opisuje ich znaczenie, strukturę i powiązania."},{id:"w03-04",s:"a",q:"Co obejmuje model danych Salesforce?",a:["Definicje obiektów, ich pól, relacji między obiektami oraz reguł opisujących dane","Tylko listę tabel","Tylko kod Apex","Tylko layouty stron"],e:"Model danych obejmuje definicje obiektów, pól, relacji oraz reguł opisujących dane."},{id:"w03-05",s:"a",q:"Czy model danych może obejmować dane, których fizycznie nie ma w Org-u?",a:["Tak, dane z systemów zewnętrznych","Nie, tylko dane fizycznie w Org-u","Tylko dane z innego Org-a Salesforce","Tylko dane z Sandboxa"],e:"Model danych może obejmować dane z systemów zewnętrznych, które nie są fizycznie przechowywane w Org-u."},{id:"w03-06",s:"b",q:"Która perspektywa NIE jest wymieniona jako perspektywa modelu danych?",a:["Sprzętowa","Bezpieczeństwa","Integracyjna","AI"],e:"Perspektywy: biznesowa, aplikacyjna, bezpieczeństwa, integracyjna, analityczna, AI."},{id:"w03-07",s:"b",q:"Co w pierwszej kolejności powinien odzwierciedlać model danych (perspektywa biznesowa)?",a:["Dziedzinę biznesową przedsiębiorstwa","Strukturę serwera bazy danych","Wymagania wydajnościowe zapytań","Strukturę kodu Apex"],e:"Model danych w pierwszej kolejności powinien odzwierciedlać dziedzinę biznesową przedsiębiorstwa."},{id:"w03-08",s:"b",q:"Z czego powinny wynikać relacje między obiektami (perspektywa biznesowa)?",a:["Bezpośrednio z procesów biznesowych","Z ograniczeń technicznych bazy","Z liczby pól w obiekcie","Z wersji API"],e:"Relacje między obiektami powinny wynikać bezpośrednio z procesów biznesowych."},{id:"w03-09",s:"b",q:"Co reprezentuje standardowy obiekt Account?",a:["Firmę lub klienta","Osobę powiązaną z firmą","Szansę sprzedaży","Konto użytkownika Salesforce"],e:"Account = firma lub klient. Contact = osoba powiązana z firmą. Opportunity = szansa sprzedaży."},{id:"w03-10",s:"b",q:"Co reprezentuje standardowy obiekt Contact?",a:["Osobę powiązaną z firmą","Firmę lub klienta","Szansę sprzedaży","Zamówienie"],e:"Contact (kontakt) reprezentuje osobę powiązaną z firmą, czyli z obiektem Account."},{id:"w03-11",s:"b",q:"Co reprezentuje standardowy obiekt Opportunity?",a:["Szansę sprzedaży","Produkt","Klienta","Zgłoszenie serwisowe"],e:"Opportunity reprezentuje szansę sprzedaży."},{id:"w03-12",s:"b",q:"Czy gotowy model danych Salesforce można rozszerzać?",a:["Tak, o własne obiekty, pola i relacje","Nie, jest zamknięty","Tylko o nowe pola, bez nowych obiektów","Tylko przez zakup aplikacji z AppExchange"],e:"Salesforce dostarcza gotowy model danych dla standardowych obszarów biznesowych, który można rozszerzać o własne obiekty, pola i relacje."},{id:"w03-13",s:"c",q:"Co decyduje o tym, jaki komponent UI zostanie użyty do prezentacji danych (perspektywa aplikacyjna)?",a:["Typ pola danych","Nazwa obiektu","Wersja przeglądarki","Liczba rekordów"],e:"Przykład z perspektywy aplikacyjnej: typ pola danych decyduje, jaki komponent UI zostanie użyty do ich prezentacji."},{id:"w03-14",s:"c",q:"Co ograniczają reguły walidacyjne (perspektywa aplikacyjna)?",a:["Dziedzinę danych","Liczbę użytkowników","Wersję API","Dostęp do Org-a"],e:"Reguły walidacyjne ograniczają dziedzinę danych, czyli dopuszczalne wartości."},{id:"w03-15",s:"c",q:"Co określają relacje w perspektywie aplikacyjnej?",a:["Źródło danych dla logiki aplikacji","Kolor przycisków w UI","Licencje użytkowników","Wersję platformy"],e:"Relacje określają źródło danych dla logiki aplikacji."},{id:"w03-16",s:"c",q:"Dla jakich mechanizmów model danych stanowi podstawę (perspektywa aplikacyjna)?",a:["Dla interfejsu użytkownika i logiki realizowanej w Flow, Apex i LWC","Tylko dla raportów","Tylko dla integracji REST","Tylko dla AppExchange"],e:"Model danych stanowi podstawę zarówno dla UI, jak i dla logiki aplikacji (Flow, Apex, LWC)."},{id:"w03-17",s:"d",q:"Jakie trzy poziomy dostępu oferuje model danych (perspektywa bezpieczeństwa)?",a:["Obiekt, pole, rekord","Org, aplikacja, strona","Użytkownik, rola, profil","Tabela, kolumna, indeks"],e:"Poziomy dostępu: obiekt (CRUD), pole (odczyt/modyfikacja), rekord (do których rekordów jest dostęp)."},{id:"w03-18",s:"d",q:"Co określa dostęp na poziomie obiektu?",a:["Czy użytkownik może odczytywać, tworzyć, modyfikować lub usuwać rekordy danego obiektu","Do których konkretnych rekordów użytkownik ma dostęp","Czy użytkownik może edytować konkretne pole","Czy użytkownik może zalogować się do Org-a"],e:"Dostęp na poziomie obiektu określa operacje CRUD na rekordach obiektu. Dostęp na poziomie pola dotyczy odczytu i modyfikacji pól, a na poziomie rekordu tego, do których konkretnych rekordów użytkownik ma dostęp."},{id:"w03-19",s:"d",q:"Co określa dostęp na poziomie rekordu?",a:["Do których konkretnych rekordów użytkownik ma dostęp","Czy użytkownik może tworzyć rekordy obiektu","Czy użytkownik widzi dane pole","Czy użytkownik może zmienić typ pola"],e:"Poziom rekordu określa, do których konkretnych rekordów użytkownik ma dostęp."},{id:"w03-20",s:"d",q:"Jak relacja Master-Detail wpływa na bezpieczeństwo?",a:["Wiąże dostęp do rekordów podrzędnych z dostępem do rekordów nadrzędnych","Całkowicie wyłącza kontrolę dostępu","Daje każdemu dostęp do rekordów podrzędnych","Nie ma wpływu na dostęp"],e:"Relacja Master-Detail wiąże dostęp do rekordów podrzędnych z dostępem do rekordów nadrzędnych."},{id:"w03-21",s:"e",q:"Czym są External Objects (obiekty zewnętrzne)?",a:["Dają dostęp do danych w zewnętrznym systemie bez przechowywania ich kopii w Salesforce","Obiektami kopiowanymi nocą z systemu zewnętrznego","Obiektami widocznymi tylko dla użytkowników Experience Cloud","Obiektami tworzonymi w Sandboxie"],e:"External Objects to dostęp do danych przechowywanych w zewnętrznym systemie, bez konieczności przechowywania ich kopii w Salesforce."},{id:"w03-22",s:"e",q:"Do czego służy Salesforce Data 360?",a:["Integracja, harmonizacja i ujednolicanie danych z różnych źródeł oraz udostępnianie danych innym systemom","Tworzenie komponentów UI","Pisanie triggerów","Zarządzanie wersjami API"],e:"Data 360 służy do integracji, harmonizacji i ujednolicania danych z różnych źródeł oraz udostępniania danych wewnętrznych innym systemom."},{id:"w03-23",s:"e",q:"Jak integracja ma się do modelu danych (perspektywa integracyjna)?",a:["Model opisuje strukturę informacji, integracja określa sposób ich wymiany; mechanizmy integracyjne zwykle wpływają na kształt modelu","Integracja nie ma związku z modelem danych","Integracja zastępuje model danych","Model danych definiuje protokół sieciowy integracji"],e:"Model danych opisuje strukturę informacji, integracja sposób ich udostępniania i wymiany. Mechanizmy integracyjne zwykle wpływają na kształt modelu."},{id:"w03-24",s:"f",q:"Jaki przykład zastosowania uczenia maszynowego podano na wykładzie?",a:["Prognozowanie prawdopodobieństwa zamknięcia szansy sprzedaży","Generowanie kodu Apex","Projektowanie layoutów stron","Tworzenie Sandboxów"],e:"Uczenie maszynowe: wykorzystanie danych historycznych do prognozowania, np. prawdopodobieństwa zamknięcia szansy sprzedaży."},{id:"w03-25",s:"f",q:"W jakich granicach agenci AI wykonują operacje na danych biznesowych?",a:["W ramach przyznanych uprawnień","Bez żadnych ograniczeń","Tylko na danych testowych","Tylko na danych zewnętrznych"],e:"Agenci AI korzystają z danych biznesowych, by odpowiadać, rekomendować i wykonywać operacje w ramach przyznanych uprawnień."},{id:"w03-26",s:"f",q:"Czego podstawę stanowi model danych wg podsumowania wykładu?",a:["Raportowania, analityki i wykorzystania AI","Wyłącznie kopii zapasowych","Infrastruktury sieciowej","Wyboru przeglądarki"],e:"Model danych stanowi podstawę raportowania, analityki i wykorzystania AI. Wspiera też aplikacje, automatyzację, bezpieczeństwo i integracje."},{id:"w03-27",s:"f",q:"Za pomocą czego model danych organizuje informacje?",a:["Obiektów, pól i relacji","Plików, folderów i dysków","Klas, metod i interfejsów","Stron, sekcji i zakładek"],e:"Model danych organizuje informacje za pomocą obiektów, pól i relacji."}],Uy={id:Fy,title:Ky,sections:Jy,questions:_y},Hy="w04",Vy="W4 · Baza danych Salesforce",Zy=[{id:"a",title:"Czego nie robi deweloper Salesforce",text:"Salesforce ukrywa szczegóły techniczne bazy danych. Deweloper nie wybiera bazy ani nie zarządza infrastrukturą, nie konfiguruje połączeń, nie tworzy kluczy głównych i obcych oraz nie instaluje bibliotek ORM (ORM w Org-u jest już wdrożony i działa). Dane odczytuje się językiem SOQL, a modyfikuje poleceniami DML, a nie SQL."},{id:"b",title:"Tabele, kolumny i obiekty",text:`Nazwy z relacyjnych baz danych mają w Salesforce odpowiedniki: **tabela** to **obiekt**, **kolumna** to **pole** (Field), a **wiersz** to **rekord** (Record). Obiekt jest przede wszystkim definicją typu danych, jak tabela, a nie instancją jak w programowaniu obiektowym.

Baza nowego Org-a nie jest pusta: zawiera obiekty standardowe z polami standardowymi, często wykorzystywane w problemach biznesowych. Salesforce zaleca używanie obiektów standardowych. Obiekty dodane do Org-a nazywa się **Custom** i automatycznie dostają końcówkę **__c**.`},{id:"c",title:"Tworzenie obiektów",text:`Obiekty tworzy się w **Object Managerze** (Setup → Object Manager) oraz w **Schema Builderze**, który dodatkowo służy do wizualizacji schematu bazy. Do obiektów standardowych można dodawać własne pola.

Przy tworzeniu obiektu można wybrać wariant „Custom Object” (tworzy tylko pusty obiekt) albo „Custom Object from Spreadsheet” (pozwala też zaimportować dane). Ważne nazwy:
• **Object Name** – nazwa techniczna, używana w konfiguracji i kodzie,
• **Label** i **Plural Label** – nazwy wyświetlane w interfejsie.`},{id:"d",title:"Record Name",text:"**Record Name** to pole identyfikujące rekord. Tworzy się je automatycznie przy tworzeniu obiektu, a pełni funkcję podobną do klucza głównego. Jego typ danych to Text albo Auto Number."},{id:"e",title:"Opcje obiektu",text:`Przy tworzeniu obiektu ustawia się opcje:
• **Deployment Status** – czy obiekt jest dostępny dla użytkowników,
• **Allow Activities** – możliwość powiązania rekordów z zadaniami i wydarzeniami,
• **Allow Sharing** – mechanizmy współdzielenia rekordów i kontroli dostępu,
• **Track Field History** – śledzenie zmian wartości wybranych pól,
• **Allow Reports** – użycie rekordów w raportach i analizach.`},{id:"f",title:"Sekcje konfiguracji obiektu",text:`Konfiguracja obiektu składa się z sekcji:
• **Details** – nazwa, nazwa API i podstawowe ustawienia,
• **Validation Rules** – sprawdzanie poprawności danych przed zapisem,
• **Triggers** – wykonywanie kodu Apex w odpowiedzi na operacje na rekordach,
• **Object Access** (uprawnienia do operacji na obiekcie) i **Field Access** (odczyt i edycja pól),
• **Page Layouts** – rozmieszczenie pól, sekcji i list powiązanych na stronie rekordu,
• **Compact Layouts** – najważniejsze informacje w skróconym widoku rekordu,
• **Record Types** – różne warianty obsługi rekordów tego samego obiektu, np. różne procesy biznesowe,
• **Search Layouts** – informacje pokazywane w wynikach wyszukiwania (to, czy obiekt jest w ogóle wyszukiwalny, określa Allow Search).`},{id:"g",title:"Tworzenie pól",text:"Na liście Fields & Relationships nie widać pola **RecordID**, choć każdy obiekt je ma. Tworzenie pola przebiega w krokach: najpierw wybiera się **typ danych**, potem nazwę, etykietę, wymagalność i obsługę duplikatów. Następnie ustala się **bezpieczeństwo** (dostęp do pola dla użytkowników Org-a) i interfejs (dodanie pola do formularza)."},{id:"h",title:"Typy pól",text:`Najważniejsze typy pól:
• **Text** – krótkie napisy, **Text Area** – krótkie opisy w wielu wierszach, **Text Area (Long)** – dłuższe opisy,
• **Text Area (Rich)** – tekst z formatowaniem (pogrubienie, listy),
• **Text (Encrypted)** – tekst szyfrowany mechanizmem Salesforce,
• **Formula** – wartość wyliczana na podstawie innych pól,
• **Auto Number** – automatyczne kolejne numery rekordów,
• **Picklist** – wybór jednej wartości z listy,
• **Checkbox** – wartość logiczna,
• **Date** – data bez godziny, **Time** – godzina bez daty, **Date/Time** – data z godziną,
• **Currency, Email, Phone, URL, Geolocation** – typy specjalne.`}],Gy=[{id:"w04-01",s:"a",q:"Czego deweloper Salesforce NIE robi w zakresie bazy danych Org-a?",a:["Nie wybiera bazy danych ani nie tworzy kluczy głównych i obcych","Nie tworzy własnych obiektów","Nie dodaje pól do obiektów","Nie definiuje relacji między obiektami"],e:"Salesforce ukrywa szczegóły techniczne: nie wybiera się bazy, nie zarządza infrastrukturą, nie konfiguruje połączeń ani ORM, nie używa SQL i nie tworzy kluczy głównych i obcych."},{id:"w04-02",s:"a",q:"Jak wygląda kwestia ORM w Org-u Salesforce?",a:["ORM jest już wdrożony i działa, nie trzeba go instalować","Trzeba zainstalować Hibernate","Trzeba skonfigurować własny ORM w Apex","Salesforce nie używa ORM"],e:"Nie instaluje się bibliotek ORM, bo ORM w Org-u jest już wdrożony i działa."},{id:"w04-03",s:"b",q:"Jak w Salesforce nazywa się odpowiednik tabeli z relacyjnej bazy danych?",a:["Obiekt","Pole","Rekord","Lista"],e:"Odpowiednikiem tabeli jest obiekt. Kolumna odpowiada polu, a wiersz rekordowi."},{id:"w04-04",s:"b",q:"Jak w Salesforce nazywa się odpowiednik kolumny tabeli?",a:["Pole","Obiekt","Rekord","Atrybut"],e:"Odpowiednikiem kolumny tabeli jest pole (Field)."},{id:"w04-05",s:"b",q:"Jak w Salesforce nazywa się odpowiednik wiersza tabeli?",a:["Rekord","Pole","Obiekt","Krotka"],e:"Odpowiednikiem wiersza tabeli jest rekord (Record)."},{id:"w04-06",s:"b",q:"Czy baza danych dostarczona z nowym Org-iem jest pusta?",a:["Nie, zawiera obiekty standardowe często wykorzystywane w problemach biznesowych","Tak, jest całkowicie pusta","Zawiera tylko obiekt User","Zawiera tylko dane przykładowe bez obiektów"],e:"Baza nie jest pusta. Są w niej obiekty standardowe z polami standardowymi."},{id:"w04-07",s:"b",q:"Co zaleca Salesforce w kwestii obiektów?",a:["Używanie obiektów standardowych","Tworzenie wyłącznie obiektów Custom","Unikanie obiektów standardowych","Usuwanie nieużywanych obiektów standardowych"],e:"Salesforce zaleca używanie obiektów standardowych."},{id:"w04-08",s:"b",q:"Jaka końcówka jest automatycznie dodawana do nazwy obiektu Custom?",a:["__c","__r","_custom","__x"],e:"Obiekty dodane do Org-a nazywane są Custom i mają automatycznie dodawaną końcówkę __c."},{id:"w04-09",s:"c",q:"Jakie są podstawowe narzędzia tworzenia i edycji obiektów?",a:["Object Manager i Schema Builder","Developer Console i Workbench","App Launcher i AppExchange","Flow Builder i Process Builder"],e:"Podstawowe narzędzia: Object Manager i Schema Builder."},{id:"w04-10",s:"c",q:"Czy można dodawać własne pola do obiektów standardowych?",a:["Tak","Nie, tylko do obiektów Custom","Tylko w Sandboxie","Tylko przez Apex"],e:"Istnieje możliwość dodawania własnych pól do obiektów standardowych."},{id:"w04-11",s:"c",q:"Czym jest 'Object' w Salesforce w porównaniu z obiektem w OOP?",a:["Przede wszystkim definicją typu danych (analogia: tabela), a nie instancją jak w OOP","Tym samym co obiekt w OOP, czyli instancją klasy","Klasą Apex","Pojedynczym rekordem"],e:"Object w Salesforce to definicja typu danych (jak tabela). Record to konkretny element tego typu."},{id:"w04-12",s:"c",q:"Jak dostać się do Object Managera?",a:["Setup → Object Manager","App Launcher → Object Manager","Developer Console → Object Manager","Profil użytkownika → Object Manager"],e:"Do Object Managera wchodzi się z poziomu Setup, wybierając Object Manager."},{id:"w04-13",s:"c",q:"Czym różni się 'Custom Object from Spreadsheet' od 'Custom Object'?",a:["Pozwala również zaimportować dane, a 'Custom Object' tworzy tylko pusty obiekt","Tworzy obiekt tylko do odczytu","Tworzy obiekt zewnętrzny","Nie różni się niczym"],e:"Custom Object tworzy tylko pusty obiekt. Custom Object from Spreadsheet umożliwia również import danych."},{id:"w04-14",s:"c",q:"Które narzędzie służy do wizualizacji schematu bazy danych?",a:["Schema Builder","Object Manager","App Launcher","Lightning App Builder"],e:"Wizualizacja schematu bazy danych to Schema Builder."},{id:"w04-15",s:"c",q:"Co to jest Object Name przy tworzeniu obiektu?",a:["Nazwa techniczna wykorzystywana w konfiguracji i kodzie","Nazwa wyświetlana w interfejsie","Nazwa pola identyfikującego rekord","Liczba mnoga nazwy obiektu"],e:"Object Name to nazwa techniczna. Label i Plural Label to nazwy wyświetlane w interfejsie."},{id:"w04-16",s:"c",q:"Do czego służą Label i Plural Label?",a:["To nazwa obiektu wyświetlana w interfejsie","To nazwa techniczna w kodzie","To nazwa pola klucza","To opis obiektu w raportach"],e:"Label, Plural Label to nazwa obiektu wyświetlana w interfejsie."},{id:"w04-17",s:"d",q:"Czym jest Record Name?",a:["Polem identyfikującym rekord, definiowanym automatycznie przy tworzeniu obiektu (funkcja podobna do klucza głównego)","Technicznym identyfikatorem obiektu","Etykietą obiektu w liczbie mnogiej","Polem relacji do obiektu nadrzędnego"],e:"Record Name to pole identyfikujące rekord, tworzone automatycznie. Pełni funkcję podobną do klucza głównego."},{id:"w04-18",s:"d",q:"Jakie typy danych może mieć pole Record Name?",a:["Text lub Auto Number","Number lub Currency","Date lub Date/Time","Picklist lub Checkbox"],e:"Data Type pola Record Name: Text albo Auto Number."},{id:"w04-19",s:"e",q:"Co określa opcja Deployment Status obiektu?",a:["Czy obiekt jest dostępny dla użytkowników","Czy obiekt można używać w raportach","Czy rekordy można wyszukiwać","Czy śledzona jest historia pól"],e:"Deployment Status określa, czy obiekt jest dostępny dla użytkowników."},{id:"w04-20",s:"e",q:"Która opcja pozwala powiązać rekordy obiektu z zadaniami i wydarzeniami?",a:["Allow Activities","Allow Reports","Allow Sharing","Track Field History"],e:"Allow Activities pozwala powiązać rekordy z aktywnościami, np. zadaniami i wydarzeniami."},{id:"w04-21",s:"e",q:"Która opcja obiektu umożliwia stosowanie mechanizmów współdzielenia rekordów i kontroli dostępu?",a:["Allow Sharing","Allow Search","Allow Activities","Deployment Status"],e:"Allow Sharing umożliwia mechanizmy współdzielenia rekordów i kontroli dostępu."},{id:"w04-22",s:"e",q:"Która opcja pozwala śledzić zmiany wartości wybranych pól?",a:["Track Field History","Allow Reports","Allow Search","Field Access"],e:"Track Field History pozwala śledzić zmiany wartości wybranych pól."},{id:"w04-23",s:"e",q:"Która opcja umożliwia wykorzystanie rekordów obiektu w raportach i analizach?",a:["Allow Reports","Allow Activities","Allow Sharing","Search Layouts"],e:"Allow Reports umożliwia wykorzystanie rekordów w raportach i analizach."},{id:"w04-24",s:"f",q:"Która sekcja konfiguracji obiektu służy do sprawdzania poprawności danych przed zapisem rekordu?",a:["Validation Rules","Triggers","Field Access","Record Types"],e:"Validation Rules sprawdzają poprawność danych przed zapisaniem rekordu."},{id:"w04-25",s:"f",q:"Za co odpowiada sekcja Triggers w konfiguracji obiektu?",a:["Wykonywanie kodu Apex w odpowiedzi na operacje na rekordach","Sprawdzanie poprawności danych deklaratywnie","Rozmieszczenie pól na stronie","Uprawnienia do pól"],e:"Triggers wykonują kod Apex w odpowiedzi na operacje na rekordach."},{id:"w04-26",s:"f",q:"Czym różni się Object Access od Field Access?",a:["Object Access to uprawnienia do operacji na obiekcie, a Field Access do odczytu i edycji poszczególnych pól","To to samo","Object Access dotyczy UI, Field Access bazy danych","Field Access dotyczy rekordów, Object Access pól"],e:"Object Access to uprawnienia do operacji na obiekcie. Field Access to uprawnienia do odczytu i edycji pól."},{id:"w04-27",s:"f",q:"Co definiują Page Layouts?",a:["Rozmieszczenie pól, sekcji i powiązanych list na stronie rekordu","Najważniejsze informacje w skróconym widoku rekordu","Informacje w wynikach wyszukiwania","Warianty procesów biznesowych"],e:"Page Layouts to rozmieszczenie pól, sekcji i powiązanych list na stronie prezentacyjnej rekordu."},{id:"w04-28",s:"f",q:"Co definiują Compact Layouts?",a:["Wybór najważniejszych informacji wyświetlanych w skróconym widoku rekordu","Pełne rozmieszczenie pól na stronie rekordu","Kolumny w wynikach wyszukiwania","Limity obiektu"],e:"Compact Layouts to najważniejsze informacje w skróconym widoku rekordu."},{id:"w04-29",s:"f",q:"Do czego służą Record Types?",a:["Do różnych wariantów obsługi rekordów tego samego obiektu, np. różnych procesów biznesowych","Do określania typu danych pola","Do tworzenia nowych obiektów","Do definiowania relacji"],e:"Record Types to różne warianty obsługi rekordów tego samego obiektu, np. różne procesy biznesowe."},{id:"w04-30",s:"f",q:"Co określają Search Layouts?",a:["Informacje prezentowane w wynikach wyszukiwania","Czy obiekt jest wyszukiwalny","Kolejność pól w formularzu","Uprawnienia do wyszukiwania"],e:"Search Layouts określają informacje prezentowane w wynikach wyszukiwania. To, czy obiekt w ogóle jest wyszukiwalny, określa Allow Search."},{id:"w04-31",s:"g",q:"Które pole jest w obiekcie, ale nie jest wyświetlane na liście Fields & Relationships?",a:["RecordID","Created By","Owner","Last Modified By"],e:"Jest jeszcze pole RecordID, ale nie jest wyświetlane."},{id:"w04-32",s:"g",q:"Jaki jest pierwszy krok tworzenia pola obiektu?",a:["Zdefiniowanie typu danych","Określenie nazwy i etykiety","Zdefiniowanie bezpieczeństwa","Dodanie do formularza"],e:"Krok 1: typ danych. Potem nazwa, etykieta, wymagalność, duplikaty. Następnie bezpieczeństwo i interfejs (dodanie do formularza)."},{id:"w04-33",s:"g",q:"Co ustala się na etapie 'Bezpieczeństwo' przy tworzeniu pola?",a:["Dostęp do pola dla użytkowników Org-a","Szyfrowanie pola","Czy pole jest wymagane","Czy pole pojawi się w formularzu"],e:"Bezpieczeństwo to zdefiniowanie dostępu do pola dla użytkowników Org-a."},{id:"w04-34",s:"h",q:"Który typ pola przechowuje tekst z formatowaniem (pogrubienie, listy)?",a:["Text Area (Rich)","Text Area (Long)","Text Area","Text (Encrypted)"],e:"Text Area (Rich) przechowuje tekst z formatowaniem."},{id:"w04-35",s:"h",q:"Który typ pola używa mechanizmu szyfrowania Salesforce?",a:["Text (Encrypted)","Text Area (Rich)","Formula","Text Area (Long)"],e:"Text (Encrypted) przechowuje tekst z wykorzystaniem szyfrowania Salesforce."},{id:"w04-36",s:"h",q:"Który typ pola oblicza wartość na podstawie innych pól?",a:["Formula","Auto Number","Roll-Up Summary","Percent"],e:"Formula oblicza wartość na podstawie innych pól (tego samego rekordu)."},{id:"w04-37",s:"h",q:"Który typ pola automatycznie nadaje kolejne numery rekordom?",a:["Auto Number","Number","Formula","Picklist"],e:"Auto Number automatycznie nadaje kolejne numery rekordom."},{id:"w04-38",s:"h",q:"Który typ pola pozwala wybrać jedną wartość ze zdefiniowanej listy?",a:["Picklist","Checkbox","Lookup","Text"],e:"Picklist to wybór jednej wartości ze zdefiniowanej listy."},{id:"w04-39",s:"h",q:"Który typ pola przechowuje wartość logiczną (prawda/fałsz)?",a:["Checkbox","Picklist","Number","Percent"],e:"Pole typu Checkbox przechowuje wartość logiczną, czyli prawda lub fałsz."},{id:"w04-40",s:"h",q:"Który typ pola przechowuje godzinę bez daty?",a:["Time","Date","Date/Time","Number"],e:"Date to data bez godziny, Time to godzina bez daty, Date/Time to data z godziną."},{id:"w04-41",s:"h",q:"Który typ pola przechowuje datę bez godziny?",a:["Date","Time","Date/Time","Text"],e:"Pole typu Date przechowuje datę bez godziny."},{id:"w04-42",s:"h",q:"Który z poniższych jest dostępnym typem danych pola w Salesforce?",a:["Geolocation","Blob","JSON","Array"],e:"Typy wymienione na slajdach: Currency, Email, Phone, URL, Geolocation (obok tekstowych, liczbowych i datowych)."},{id:"w04-43",s:"h",q:"Czym różni się Text Area od Text?",a:["Text Area to krótkie opisy w wielu wierszach, a Text to krótkie napisy","Text Area jest szyfrowany","Text Area obsługuje formatowanie","Nie różnią się"],e:"Text to krótkie napisy, Text Area to krótkie opisy w wielu wierszach, Text Area (Long) to dłuższe opisy."},{id:"w04-44",s:"a",q:"Czego deweloper Salesforce nie robi przy obsłudze danych (w odróżnieniu od klasycznych aplikacji)?",a:["Nie obsługuje bazy danych za pomocą SQL","Nie pisze zapytań o dane","Nie definiuje pól","Nie tworzy rekordów"],e:"Na liście rzeczy, których się nie robi, jest 'Obsługa bazy danych za pomocą SQL'. W Salesforce używa się SOQL/DML, a nie SQL."},{id:"w04-45",s:"f",q:"Co znajdziesz w sekcji 'Details' konfiguracji obiektu?",a:["Nazwę, nazwę API i podstawowe ustawienia obiektu","Pola i relacje","Reguły walidacji","Układy stron"],e:"Details zawiera nazwę, nazwę API i podstawowe ustawienia obiektu."}],Qy={id:Hy,title:Vy,sections:Zy,questions:Gy},Xy="w05",$y="W5 · Relacje w modelu danych",Yy=[{id:"a",title:"Rodzaje relacji",text:`Relację między obiektami tworzy się, dodając do obiektu pole odpowiedniego typu relacyjnego. Pole dodaje się w obiekcie **podrzędnym** i wskazuje się w nim obiekt nadrzędny. Rodzaje relacji:
• **Lookup** – relacja luźna między dwoma obiektami w bazie Org-a,
• **Master-Detail** – relacja silna,
• **External Lookup** – relacja luźna między obiektem w Org-u a tabelą w zewnętrznej bazie danych.`},{id:"b",title:"Relacje predefiniowane",text:"Niektóre pola systemowe są polami typu Lookup. **Created By** wskazuje użytkownika, który utworzył rekord, **Last Modified By** użytkownika, który go ostatnio zmienił, a **Owner** użytkownika lub kolejkę odpowiedzialną za rekord (jeśli obiekt obsługuje własność rekordów). Niektórych predefiniowanych relacji nie można usunąć ani dowolnie zmieniać, bo są potrzebne do działania funkcji. Przykłady relacji ze standardowego modelu danych: Contact–Account, Opportunity–Account, Case–Account. Relacje niestandardowe tworzy się typami Lookup lub Master-Detail."},{id:"c",title:"Relacja Master-Detail",text:`**Master-Detail** to relacja silna typu jeden (Master) do wielu (Detail). Przykład: polisa ubezpieczeniowa (Master) i roszczenie (Detail), ponieważ roszczenie nie może istnieć bez polisy.

Cechy tej relacji:
• rekord Master musi istnieć w chwili tworzenia rekordu Detail,
• pole relacji tworzy się tylko w obiekcie Detail, a w Master żadnego pola się nie tworzy, bo przechowuje on automatyczną listę rekordów Detail,
• w polu Master-Detail nie można wstawić wartości null,
• usunięcie rekordu Master kaskadowo usuwa rekordy Detail,
• obiekt Master może mieć pola **Roll-Up Summary**, które automatycznie agregują dane rekordów Detail (to możliwe tylko przy Master-Detail),
• Detail dziedziczy uprawnienia, widoczność i właściciela po Master i nie ma własnego pola Owner,
• jeden obiekt może mieć najwyżej 2 pola Master-Detail.`},{id:"d",title:"Relacja Lookup",text:`W relacji **Lookup** obiekty nazywają się Parent (nadrzędny) i Child (podrzędny). Przykład: kategoria (Parent) i produkt (Child), bo oba obiekty mogą istnieć niezależnie.

Cechy relacji:
• rekord Parent nie musi istnieć w chwili tworzenia rekordu Child,
• pole Lookup może mieć wartość null,
• rekord Parent widzi listę rekordów Child, które na niego wskazują (Related List),
• usunięcie rekordu Parent nie usuwa kaskadowo rekordów Child,
• Child nie dziedziczy uprawnień ani właściciela po Parent,
• relacja jest możliwa w obrębie tego samego obiektu,
• jeden obiekt może mieć do 40 pól Lookup, ale limit obejmuje też pola Master-Detail.`},{id:"e",title:"Relacje w Schema Builderze",text:"Schema Builder pokazuje relacje liniami: **Master-Detail** ma linię czerwoną, a **Lookup** niebieską. Linia łączy nagłówek obiektu Master lub Parent z polem relacji w obiekcie Detail lub Child. Symbol rozwidlenia i otwartego kółka pojawia się dla obu typów relacji."},{id:"f",title:"Relacja wiele do wielu",text:`Relację wiele do wielu realizuje się wyłącznie przez **obiekt pośredniczący (Junction Object)**. Obiekt pośredniczący ma dwa pola relacji w jednym z wariantów: 2× Master-Detail, 2 lub więcej Lookup albo Master-Detail + Lookup. Jedno pole relacji nie tworzy relacji wiele do wielu. Obiekt ten może mieć też pola innych typów.

W obiekcie Master nie tworzy się żadnego pola wskazującego na rekordy Detail, bo przechowuje on ich automatyczną listę.`}],ep=[{id:"w05-01",s:"a",q:"Na czym polega utworzenie relacji między obiektami w Salesforce?",a:["Na dodaniu do obiektu pola o odpowiednim typie","Na utworzeniu klucza obcego w SQL","Na utworzeniu tabeli łączącej w bazie","Na napisaniu triggera"],e:"Utworzenie relacji polega na dodaniu do obiektu pola o odpowiednim typie relacyjnym."},{id:"w05-02",s:"a",q:"W którym obiekcie dodaje się pole relacji?",a:["W obiekcie podrzędnym, wskazując obiekt nadrzędny","W obiekcie nadrzędnym, wskazując obiekt podrzędny","W obu obiektach","W obiekcie pośredniczącym zawsze"],e:"Pole dodaje się w obiekcie podrzędnym i wskazuje się obiekt nadrzędny."},{id:"w05-03",s:"a",q:"Czym jest Lookup Relationship?",a:["Relacją luźną między dwoma obiektami w bazie Org-a","Relacją silną między dwoma obiektami","Relacją z tabelą w zewnętrznej bazie","Relacją wiele do wielu"],e:"Lookup to relacja luźna, Master-Detail to relacja silna, External Lookup to relacja luźna z tabelą zewnętrzną."},{id:"w05-04",s:"a",q:"Czym jest External Lookup Relationship?",a:["Relacją luźną między obiektem w Org-u a tabelą w zewnętrznej bazie danych","Relacją silną z obiektem z innego Org-a","Relacją między dwoma obiektami zewnętrznymi zawsze kaskadową","Relacją Master-Detail do Sandboxa"],e:"External Lookup to relacja luźna między obiektem w bazie Org-a i tabelą w zewnętrznej bazie danych."},{id:"w05-05",s:"b",q:"Co wskazuje systemowe pole Created By?",a:["Użytkownika, który utworzył rekord","Użytkownika, który ostatnio zmodyfikował rekord","Właściciela rekordu","Datę utworzenia rekordu"],e:"Created By (Lookup) to użytkownik, który utworzył rekord."},{id:"w05-06",s:"b",q:"Na co może wskazywać pole Owner?",a:["Na użytkownika lub kolejkę odpowiedzialną za rekord","Tylko na administratora Org-a","Na obiekt Master","Na konto (Account)"],e:"Owner (Lookup) to użytkownik lub kolejka odpowiedzialna za rekord, jeśli obiekt obsługuje własność rekordów."},{id:"w05-07",s:"b",q:"Jakiego typu są pola systemowe Created By, Last Modified By i Owner?",a:["Lookup","Master-Detail","Text","Formula"],e:"Wszystkie są polami typu Lookup do użytkownika (Owner także do kolejki)."},{id:"w05-08",s:"b",q:"Czy predefiniowane relacje Salesforce zawsze można usunąć?",a:["Nie, niektóre są niezbędne do działania funkcji i nie można ich usunąć ani dowolnie modyfikować","Tak, wszystkie można usunąć","Tak, ale tylko w Sandboxie","Nie, ale można je dowolnie modyfikować"],e:"Niektóre predefiniowane relacje są niezbędne do działania określonych funkcji i nie można ich usunąć ani dowolnie modyfikować."},{id:"w05-09",s:"b",q:"Który przykład to relacja standardowego modelu danych?",a:["Opportunity – Account","Coach – Room","Product – Category (custom)","Event__c – Room__c"],e:"Przykłady standardowe: Contact–Account, Opportunity–Account, Case–Account."},{id:"w05-10",s:"c",q:"Jakimi typami relacji tworzy się relacje niestandardowe?",a:["Lookup lub Master-Detail","Tylko External Lookup","Tylko Master-Detail","Hierarchical i Many-to-Many"],e:"Relacje niestandardowe tworzy się za pomocą typów Lookup lub Master-Detail."},{id:"w05-11",s:"c",q:"Jaka jest krotność relacji Master-Detail?",a:["Jeden (Master) do wielu (Detail)","Wiele do wielu","Jeden do jednego","Wiele (Master) do jednego (Detail)"],e:"Master-Detail to relacja jeden (Master) do wielu (Detail)."},{id:"w05-12",s:"c",q:"Który przykład z wykładu ilustruje relację Master-Detail?",a:["Polisa ubezpieczeniowa (Master) i roszczenie (Detail)","Kategoria (Parent) i produkt (Child)","Użytkownik i rekord (Created By)","Firma i kontakt"],e:"Roszczenie (Detail) nie może istnieć bez polisy (Master). Produkt–kategoria to przykład Lookup."},{id:"w05-13",s:"c",q:"Czy rekord Detail może istnieć bez rekordu Master?",a:["Nie, rekord Master musi istnieć w chwili tworzenia Detail","Tak, zawsze","Tak, jeśli pole ma wartość null","Tylko w Sandboxie"],e:"Obiekt Detail nie może istnieć bez obiektu Master. Rekord Master musi istnieć w chwili tworzenia rekordu Detail."},{id:"w05-14",s:"c",q:"Gdzie tworzy się pole przy relacji Master-Detail?",a:["W obiekcie Detail; w Master nie tworzy się żadnego pola","W obiekcie Master","W obu obiektach","W obiekcie pośredniczącym"],e:"W obiekcie Detail tworzymy pole typu Master-Detail. W obiekcie Master nie tworzymy żadnego pola, bo przechowuje on automatyczną listę Detail."},{id:"w05-15",s:"c",q:"Czy można wstawić null w pole typu Master-Detail?",a:["Nie","Tak","Tak, ale tylko przez Apex","Tak, jeśli obiekt Master został usunięty"],e:"Relacja silna oznacza m.in. brak możliwości wstawienia null w pole Master-Detail."},{id:"w05-16",s:"c",q:"Co dzieje się z rekordami Detail po usunięciu rekordu Master?",a:["Są usuwane kaskadowo","Pozostają z pustym polem relacji","Są przenoszone do innego Master","Usunięcie Master jest zablokowane"],e:"Master-Detail daje kaskadowe usuwanie rekordów Detail po usunięciu rekordu Master."},{id:"w05-17",s:"c",q:"Do czego służą pola Roll-Up Summary i gdzie są dostępne?",a:["Do automatycznej agregacji danych rekordów Detail; dostępne w obiekcie Master relacji Master-Detail","Do agregacji w obiekcie Parent relacji Lookup","Do sumowania pól tego samego rekordu","Do agregacji danych zewnętrznych"],e:"Roll-Up Summary jest dostępne w obiekcie Master (tylko przy Master-Detail) i automatycznie agreguje dane rekordów Detail."},{id:"w05-18",s:"c",q:"Skąd obiekt Detail bierze uprawnienia, widoczność i właściciela?",a:["Dziedziczy je po obiekcie Master; Detail nie ma pola Owner","Ma własne pole Owner i własne uprawnienia","Od administratora Org-a","Od użytkownika, który go utworzył"],e:"Detail dziedziczy uprawnienia i widoczność po Master. Nie posiada pola Owner i dziedziczy właściciela po Master."},{id:"w05-19",s:"c",q:"Ile maksymalnie pól Master-Detail może mieć pojedynczy obiekt?",a:["2","1","40","10"],e:"Pojedynczy obiekt może mieć maksymalnie 2 pola typu Master-Detail."},{id:"w05-20",s:"c",q:"Ile pól Lookup może mieć pojedynczy obiekt?",a:["Do 40, ale odlicza się od tego pola Master-Detail","Do 2","Do 40 niezależnie od pól Master-Detail","Bez limitu"],e:"Do 40 pól Lookup, przy czym limit obejmuje także pola Master-Detail."},{id:"w05-21",s:"d",q:"Jak nazywają się obiekty w relacji Lookup?",a:["Parent i Child","Master i Detail","Owner i Record","Source i Target"],e:"Lookup: Parent i Child. Master-Detail: Master i Detail."},{id:"w05-22",s:"d",q:"Który przykład z wykładu ilustruje relację Lookup?",a:["Kategoria (Parent) i produkt (Child)","Polisa (Master) i roszczenie (Detail)","Zamówienie i pozycja zamówienia","Faktura i linia faktury"],e:"Produkt (Child) i kategoria (Parent): oba obiekty mogą istnieć niezależnie."},{id:"w05-23",s:"d",q:"Czy rekord Parent musi istnieć w chwili tworzenia rekordu Child w relacji Lookup?",a:["Nie, może nie istnieć","Tak, zawsze","Tak, chyba że pole jest wymagane","Tylko dla obiektów standardowych"],e:"Przy Lookup rekord Parent może nie istnieć w chwili tworzenia rekordu Child."},{id:"w05-24",s:"d",q:"Jak rekord Parent uzyskuje listę wskazujących na niego rekordów Child?",a:["Przez Related List","Przez pole Roll-Up Summary","Przez dodatkowe pole w Parent","Nie może jej uzyskać"],e:"Rekord Parent może uzyskać listę obiektów Child, które na niego wskazują (Related List)."},{id:"w05-25",s:"d",q:"Co dzieje się z rekordami Child po usunięciu rekordu Parent (Lookup)?",a:["Nie są usuwane kaskadowo","Są usuwane kaskadowo","Usunięcie Parent jest niemożliwe","Child przejmuje rolę Parent"],e:"Lookup to relacja luźna, więc brak kaskadowego usuwania rekordów Child."},{id:"w05-26",s:"d",q:"Czy pole Lookup może mieć wartość null?",a:["Tak","Nie","Tylko w obiektach standardowych","Tylko przy relacji z samym sobą"],e:"W relacji luźnej można wstawić null w pole Lookup."},{id:"w05-27",s:"d",q:"Czy obiekt Child w relacji Lookup dziedziczy uprawnienia i Owner po Parent?",a:["Nie","Tak, zawsze","Tylko uprawnienia, bez Owner","Tylko Owner, bez uprawnień"],e:"Lookup: brak dziedziczenia uprawnień i widoczności (w tym pola Owner)."},{id:"w05-28",s:"d",q:"Czy relacja Lookup jest możliwa w obrębie tego samego obiektu?",a:["Tak","Nie","Tylko dla obiektów standardowych","Tylko jako Master-Detail"],e:"Relacja Lookup jest możliwa w obrębie tego samego obiektu (self-relationship)."},{id:"w05-29",s:"e",q:"Jakim kolorem Schema Builder oznacza relację Master-Detail?",a:["Czerwonym","Niebieskim","Zielonym","Czarnym"],e:"Master-Detail jest oznaczana linią czerwoną, a Lookup linią niebieską."},{id:"w05-30",s:"e",q:"Jakim kolorem Schema Builder oznacza relację Lookup?",a:["Niebieskim","Czerwonym","Pomarańczowym","Szarym"],e:"Relację Lookup Schema Builder oznacza linią niebieską. Relacja Master-Detail ma linię czerwoną."},{id:"w05-31",s:"e",q:"Co łączy linia relacji na diagramie Schema Builder?",a:["Nagłówek obiektu Master/Parent z polem relacji w obiekcie Detail/Child","Dwa nagłówki obiektów","Dwa pola relacji","Pole Owner z obiektem User"],e:"Linia łączy nagłówek obiektu Master lub Parent z polem relacji w obiekcie Detail lub Child."},{id:"w05-32",s:"e",q:"Dla jakich relacji na diagramie pojawia się symbol rozwidlenia i otwartego kółka?",a:["Dla obu typów relacji","Tylko dla Master-Detail","Tylko dla Lookup","Tylko dla relacji wiele do wielu"],e:"Symbol rozwidlenia i otwartego kółka pojawia się dla obu typów relacji."},{id:"w05-33",s:"f",q:"Jak realizuje się relację wiele do wielu w Salesforce?",a:["Wyłącznie za pomocą obiektu pośredniczącego (Junction Object)","Polem typu Many-to-Many","Dwoma polami Lookup w obu obiektach","Nie da się jej zrealizować"],e:"Relacje wiele do wielu realizuje się wyłącznie za pomocą obiektu pośredniczącego (Junction Object)."},{id:"w05-34",s:"f",q:"Który wariant obiektu pośredniczącego NIE jest wymieniony na wykładzie?",a:["1 pole Lookup bez innych pól relacji","2 pola Master-Detail","2 lub więcej pól Lookup","1 pole Master-Detail i 1 pole Lookup"],e:"Warianty: 2× Master-Detail, 2 lub więcej Lookup, albo Master-Detail + Lookup. Jedno pole relacji nie tworzy relacji wiele do wielu."},{id:"w05-35",s:"f",q:"Czy obiekt pośredniczący może zawierać pola innego typu niż relacyjne?",a:["Tak","Nie","Tylko pola Formula","Tylko pola Roll-Up Summary"],e:"Obiekt pośredniczący może zawierać również pola innego typu."},{id:"w05-36",s:"f",q:"Czy obiekt Master musi mieć pole wskazujące na rekordy Detail?",a:["Nie, rekord Master automatycznie przechowuje listę wskazujących na niego Detail","Tak, pole typu Detail List","Tak, pole Roll-Up Summary jest obowiązkowe","Tak, pole Lookup zwrotne"],e:"W obiekcie Master nie tworzymy żadnego pola. Przechowuje on automatyczną listę obiektów Detail."}],ap={id:Xy,title:$y,sections:Yy,questions:ep},ip="w06",op="W6 · Wprowadzenie do Apex",np=[{id:"a",title:"Apex: podstawowe cechy języka",text:"**Apex** to język obiektowy, którego składnia jest wzorowana na Javie. Różni się jednak od niej: **nie rozróżnia wielkości liter**. Klasa może rozszerzać (extends) tylko jedną klasę, ale może implementować wiele interfejsów. Apex jest zintegrowany z językami zapytań **SOQL** i **SOSL**."},{id:"b",title:"Typy danych w Apex",text:`Apex ma **tylko typy obiektowe**, nie ma typów prymitywnych (int, double, boolean). Wszystkie typy dopuszczają więc wartość null. Teksty zapisuje się w **pojedynczych apostrofach**: 'Hello'.

Ważne typy:
• liczbowe: Integer, Long, Double, Decimal (typu „int” nie ma),
• kolekcje: List, Set, Map (nie ma prostych tablic; zapis \`Integer numery []\` oznacza listę, czyli to samo co \`List<Integer>\`),
• **Object** – może przechowywać dowolną wartość,
• **sObject** – rekord bazy danych; jest typem bazowym wszystkich obiektów (Account, Contact, MojaTabela__c),
• **ID** – unikalny identyfikator rekordu, **Blob** – dane binarne, np. pliki,
• **DateTime** uwzględnia strefy czasowe (Date nie). W Apex ma dokładność do milisekund, ale w bazie jest zapisywany z dokładnością do sekund.

Obiekty niestandardowe mają sufiks \`__c\`, a relacje między obiektami sufiks \`__r\`. Klasy można zagnieżdżać tylko na jednym poziomie.`},{id:"c",title:"Wykonywanie kodu i kontekst",text:`Kod Apex jest interpretowany bezpośrednio przez platformę Salesforce. Kodem Apex są np. trigger, kontroler lub batch job, a nie cała aplikacja. W porównaniu z Javą brakuje strumieni (streams) i try-with-resources.

**Kontekst wykonania** to jednostka wykonania kodu Apex. Definiuje większość ograniczeń i czas życia zmiennych statycznych. Każdy kontekst ma własne zmienne statyczne, dane w pamięci, transakcje bazodanowe i limity zasobów. Kontekst wykonuje się w jednym wątku, a różne konteksty mogą działać w różnych wątkach bez współdzielenia stanu, dlatego w Apex nie ma synchronizacji między kontekstami.`},{id:"d",title:"Rodzaje kontekstów i limity",text:"Rodzaje kontekstów:\n• **anonimowy** – kod uruchamiany w Developer Console, np. do debugowania,\n• **batch** – uruchamiany przez system, interfejs `Database.Batchable`,\n• **API** – kod uruchamiany zdalnie, adnotacja `@RestResource`,\n• **asynchroniczny** – działa w tle: Batch Apex, Queueable, metody Future (`@future`) i Scheduled Apex (`Schedulable`),\n• **synchroniczny** – użytkownik czeka na wynik. Cały kod jest w jednej transakcji, a błąd powoduje wycofanie całości (rollback).\n\nKontekst synchroniczny ma mniejsze limity: do **100** zapytań SOQL na transakcję. Asynchroniczny ma do **200**. Według tabeli z wykładu synchroniczne są wywołania Web Service (SOAP lub REST) i Anonymous Apex, a asynchroniczny jest Inbound Email Service."},{id:"e",title:"Zmienne statyczne",text:"Zmienne statyczne są dozwolone tylko w klasach zewnętrznych. Żyją przez czas trwania kontekstu uruchomienia, a po jego zakończeniu ich wartość jest tracona."},{id:"f",title:"Klasy, metody i interfejsy",text:"Domyślnie klasa nie może być klasą bazową innej klasy. Trzeba ją oznaczyć jako:\n• **virtual** – można z niej tworzyć obiekty i po niej dziedziczyć,\n• **abstract** – musi zostać rozszerzona i nie można tworzyć jej obiektów.\n\nMetody mogą mieć najwyżej 32 parametry. Przez wartość przekazywane są typy Integer, Double, Long, Decimal, Boolean, Date, Datetime i String, a pozostałe (np. kolekcje, sObject) przez referencję. Metody domyślnie nie są polimorficzne: metoda `virtual` ma implementację i może być nadpisana, a `abstract` nie ma implementacji i musi być nadpisana. Interfejsy nie mają domyślnych implementacji metod ani pól."},{id:"g",title:"Modyfikatory",text:"Zasięg widoczności: **private** – klasa, **protected** – klasa i jej potomne, **public** – cały Org, **global** – wszystkie Org-i (pakiety managed). Modyfikatory `abstract` i `virtual` dotyczą klas i metod, ale nie pól.\n\nKlasy domyślnie działają **without sharing**, czyli ignorują zasady dostępu. Klasa **with sharing** stosuje zasady dostępu Salesforce. Pozostałe modyfikatory:\n• `transient` – tylko dla pól; wartość nie jest serializowana, np. hasła i tokeny,\n• `synchronized` – tylko dla metod; naraz tylko jeden wątek może ją wykonywać,\n• `override` – tylko dla metod; nadpisuje metodę klasy bazowej."},{id:"h",title:"Instrukcje sterujące",text:"Zamiast `switch-case` Apex ma konstrukcję `switch on zmienna { when 'A' {...} when 'B','C' {...} when else {...} }`. Nie używa się w niej `break`, a gałęzie nie „przechodzą” do następnej. Kilka wartości w jednej gałęzi oddziela się przecinkami. W pętlach działają `break` i `continue`, ale nie ma etykiet skoku. Pętla `do-while` zawsze wykonuje ciało przynajmniej raz, bo warunek sprawdza dopiero po nim."},{id:"i",title:"DML, SOQL, SOSL i wyjątki",text:"**DML** służy do tworzenia, aktualizowania, usuwania i przywracania rekordów. **SOQL** pobiera rekordy (zapytania SELECT) i zazwyczaj zwraca listę rekordów, np. `[SELECT Name, Industry FROM Account]`. **SOSL** (Salesforce Object Search Language) służy do wyszukiwania po tekście, liczbach lub polach wyszukiwania. Wyjątki obsługuje się jak w Javie (try/catch/finally), ale nie ma try-with-resources."}],tp=[{id:"w06-01",s:"a",q:"Na jakim języku wzorowana jest składnia Apex?",a:["Java","C#","JavaScript","Python"],e:"Apex to język obiektowy ze składnią wzorowaną na Javie."},{id:"w06-02",s:"a",q:"Czy Apex rozróżnia wielkość liter?",a:["Nie, inaczej niż Java","Tak, tak jak Java","Tylko w nazwach klas","Tylko w nazwach zmiennych"],e:"Apex nie rozróżnia wielkości liter, w odróżnieniu od Javy. Na to trzeba uważać, bo składnia jest do niej bardzo podobna."},{id:"w06-03",s:"a",q:"Ile klas może rozszerzać (extends) klasa Apex?",a:["Tylko jedną","Dowolnie wiele","Dwie","Żadnej, Apex nie ma dziedziczenia"],e:"Apex pozwala na pojedyncze dziedziczenie: klasa może rozszerzać tylko jedną klasę."},{id:"w06-04",s:"a",q:"Ile interfejsów może implementować jedna klasa Apex?",a:["Wiele","Tylko jeden","Maksymalnie dwa","Żadnego"],e:"Klasa może implementować wiele interfejsów (implements)."},{id:"w06-05",s:"a",q:"Z jakimi językami zapytań zintegrowany jest Apex?",a:["SOQL i SOSL","SQL i PL/SQL","GraphQL i SPARQL","HQL i JPQL"],e:"Apex jest zintegrowany z językami zapytań SOQL i SOSL."},{id:"w06-06",s:"b",q:"Jakie typy danych występują w Apex?",a:["Tylko typy obiektowe; brak typów prymitywnych","Typy prymitywne i obiektowe jak w Javie","Tylko typy prymitywne","Tylko typ sObject"],e:"Apex ma tylko typy obiektowe. Nie ma typów prymitywnych, takich jak int, double czy boolean."},{id:"w06-07",s:"b",q:"Jak zapisuje się literał tekstowy w Apex?",a:["W pojedynczych apostrofach: 'Hello'",'W cudzysłowach: "Hello"',"W backtickach: `Hello`","Dowolnie"],e:"W Apex literały tekstowe zapisuje się w pojedynczych apostrofach, np. 'Hello'. To różnica w stosunku do Javy."},{id:"w06-08",s:"b",q:"Który z poniższych NIE jest typem liczbowym Apex?",a:["int","Integer","Decimal","Long"],e:"Liczbowe: Integer, Long, Double, Decimal. 'int' to typ prymitywny, którego w Apex nie ma."},{id:"w06-09",s:"b",q:"Jakie kolekcje oferuje Apex?",a:["List, Set, Map","Array, Tuple, Dict","Vector, Stack, Queue","Tylko tablice []"],e:"Apex oferuje kolekcje List, Set i Map. Nie ma prostych tablic zapisywanych jako []."},{id:"w06-10",s:"b",q:"Jaki typ może przechowywać dowolną wartość w Apex?",a:["Object","sObject","Any","Variant"],e:"Typ bazowy Object może przechowywać dowolną wartość. sObject przechowuje dowolny rekord bazy."},{id:"w06-11",s:"b",q:"Czym jest typ sObject?",a:["Typem rekordu bazy danych; może wskazywać na dowolny rekord każdej tabeli i jest typem bazowym typów wszystkich obiektów","Typem bazowym dla wszystkich wartości, także liczb","Typem przechowującym pliki binarne","Typem identyfikatora rekordu"],e:"sObject to rekord obiektu bazy danych, typ bazowy dla typów wszystkich obiektów (Account, Contact, MojaTabela__c…)."},{id:"w06-12",s:"b",q:"Jakim sufiksem oznaczone są relacje między obiektami w Apex?",a:["__r","__c","__rel","__x"],e:"Obiekty niestandardowe mają sufiks __c, a relacje między obiektami sufiks __r."},{id:"w06-13",s:"b",q:"Jaki typ reprezentuje unikalny identyfikator rekordu?",a:["ID","String","Integer","Key"],e:"Unikalny identyfikator rekordu obecny w każdym rekordzie ma typ ID."},{id:"w06-14",s:"b",q:"Jaki typ Apex służy do danych binarnych, np. plików?",a:["Blob","Binary","ByteArray","File"],e:"Dane binarne, na przykład pliki, mają w Apex typ Blob."},{id:"w06-15",s:"b",q:"Ile poziomów zagnieżdżenia klas wewnętrznych dopuszcza Apex?",a:["Tylko 1 poziom","Dowolnie wiele","2 poziomy","Apex nie pozwala na klasy wewnętrzne"],e:"Klasy można definiować wewnątrz innych klas, ale tylko na jednym poziomie zagnieżdżenia."},{id:"w06-16",s:"b",q:"Które typy w Apex dopuszczają wartość null?",a:["Wszystkie","Tylko typy obiektowe poza Integer i Boolean","Tylko sObject","Żadne"],e:"Wszystkie typy dopuszczają null, bo w Apex są tylko typy obiektowe."},{id:"w06-17",s:"b",q:"Który typ czasowy w Apex uwzględnia strefy czasowe?",a:["DateTime (Date już nie)","Date (DateTime już nie)","Oba","Żaden"],e:"Typ DateTime uwzględnia strefy czasowe, a typ Date nie."},{id:"w06-18",s:"b",q:"Z jaką dokładnością DateTime jest zapisywany w bazie danych?",a:["Do sekund (choć w Apex uwzględnia milisekundy)","Do milisekund","Do minut","Do dni"],e:"W Apex DateTime uwzględnia milisekundy, ale w bazie danych jest zapisywany z dokładnością do sekund."},{id:"w06-19",s:"b",q:"Czym jest w Apex deklaracja 'Integer numery []'?",a:["Listą (to alternatywny zapis List<Integer>)","Prostą tablicą o stałym rozmiarze","Zbiorem Set<Integer>","Błędem kompilacji"],e:"Listę można definiować na dwa sposoby: List<Integer> numery lub Integer numery []. Zawsze jest to lista."},{id:"w06-20",s:"c",q:"Czego brakuje w Apex w porównaniu z Javą?",a:["Strumieni (streams) i try-with-resources","Pętli for-each","Obsługi wyjątków","Interfejsów"],e:"W porównaniu z Javą w Apex nie ma strumieni (streams) ani try-with-resources."},{id:"w06-21",s:"c",q:"Jak wykonywany jest kod Apex?",a:["Jest interpretowany bezpośrednio przez platformę Salesforce","Kompilowany do pliku .exe","Uruchamiany w przeglądarce użytkownika","Uruchamiany na lokalnej maszynie JVM dewelopera"],e:"Kod jest interpretowany bezpośrednio przez platformę Salesforce. Kod Apex to np. trigger, kontroler, batch job, a nie cała aplikacja."},{id:"w06-22",s:"c",q:"Co ma własne każdy kontekst wykonania Apex?",a:["Zmienne statyczne, dane w pamięci, transakcje bazodanowe, limity zasobów","Własny Org","Własną bazę danych","Własnego użytkownika administracyjnego"],e:"Kontekst wykonania ma własne zmienne statyczne, dane w pamięci, transakcje bazodanowe i limity zasobów."},{id:"w06-23",s:"c",q:"Dlaczego w Apex nie ma synchronizacji między kontekstami?",a:["Kontekst wykonuje się w jednym wątku, a różne konteksty mogą działać w różnych wątkach bez współdzielenia stanu","Bo Apex nie obsługuje wątków","Bo wszystkie konteksty dzielą jedną pamięć","Bo synchronizację zapewnia baza danych"],e:"Kontekst wykonuje się w jednym wątku, a różne konteksty mogą działać w różnych wątkach, bez współdzielenia stanu. Dlatego synchronizacja między kontekstami nie jest potrzebna."},{id:"w06-24",s:"d",q:"Jaki rodzaj kontekstu tworzy uruchomienie kodu w Developer Console w celu debugowania?",a:["Anonimowy","Testowy","Batch","API"],e:"Kod uruchamiany w Developer Console w celu debugowania działa w kontekście anonimowym."},{id:"w06-25",s:"d",q:"Która adnotacja/interfejs jest związana z kontekstem Batch?",a:["Database.Batchable","@isTest","@RestResource","@future"],e:"Batch: uruchamiany przez system, Database.Batchable."},{id:"w06-26",s:"d",q:"Która adnotacja jest związana z kontekstem API (kod uruchamiany zdalnie)?",a:["@RestResource","@isTest","@future","Database.Batchable"],e:"Kod uruchamiany zdalnie działa w kontekście API i jest oznaczany adnotacją @RestResource."},{id:"w06-27",s:"d",q:"Co jest przykładem uruchomienia kontekstu asynchronicznego?",a:["Schedulable lub @future","Naciśnięcie przycisku","@isTest","Developer Console"],e:"Asynchroniczny: kod uruchamiany w tle, np. Schedulable, @future."},{id:"w06-28",s:"d",q:"Jakie są cechy kontekstu synchronicznego?",a:["Użytkownik czeka na wynik, cały kod w jednej transakcji, błąd powoduje rollback całości","Kod w tle, większe limity","Brak transakcji","Kod uruchamiany wyłącznie przez system"],e:"Synchroniczny: wykonanie w odpowiedzi na akcję użytkownika, blokowanie UI, mniejsze limity, jedna transakcja i rollback przy błędzie."},{id:"w06-29",s:"d",q:"Ile maksymalnie zapytań SOQL na transakcję dopuszcza kontekst synchroniczny?",a:["100","200","50","150"],e:"Synchroniczny: maks. 100 zapytań SOQL. Asynchroniczny: maks. 200."},{id:"w06-30",s:"d",q:"Ile maksymalnie zapytań SOQL na transakcję dopuszcza kontekst asynchroniczny?",a:["200","100","150","Bez limitu"],e:"Asynchroniczny ma większe limity: maks. 200 zapytań SOQL na transakcję."},{id:"w06-31",s:"d",q:"Które mechanizmy uruchamiają kod w kontekście asynchronicznym?",a:["Batch Apex, Queueable, Future methods, Scheduled Apex","Anonymous Apex i Web Service","Tylko triggery before","Tylko Visualforce GET"],e:"Operacje asynchroniczne uruchamiają m.in. Batch Apex, Queueable, Future methods i Scheduled Apex."},{id:"w06-32",s:"d",q:"W jakim kontekście wykonuje się wywołanie Web Service (SOAP/REST) wg tabeli z wykładu?",a:["Synchronicznym","Asynchronicznym","Testowym","Batch"],e:"Według tabeli z wykładu wywołanie Web Service (SOAP lub REST) oraz Anonymous Apex wykonują się synchronicznie. Inbound Email Service jest asynchroniczny."},{id:"w06-33",s:"d",q:"W jakim kontekście wykonuje się Inbound Email Service wg tabeli z wykładu?",a:["Asynchronicznym","Synchronicznym","Anonimowym","Testowym"],e:"Według tabeli z wykładu Inbound Email Service wykonuje się w kontekście asynchronicznym."},{id:"w06-34",s:"e",q:"Gdzie dozwolone są zmienne statyczne w Apex?",a:["Tylko w klasach zewnętrznych","Tylko w klasach wewnętrznych","W interfejsach","W triggerach jako pola"],e:"Zmienne statyczne są dozwolone tylko w klasach zewnętrznych."},{id:"w06-35",s:"e",q:"Jaki jest czas życia zmiennej statycznej w Apex?",a:["Czas trwania kontekstu uruchamiania; potem wartość jest tracona","Do restartu Org-a","Bezterminowo, jak w bazie danych","Do wylogowania użytkownika"],e:"Czas życia zmiennej statycznej to czas trwania kontekstu. Po jego zakończeniu wartość jest tracona."},{id:"w06-36",s:"f",q:"Klasa Apex bez modyfikatora virtual ani abstract…",a:["…domyślnie nie może być klasą bazową innej klasy","…może być dowolnie rozszerzana","…nie może mieć konstruktora","…nie może implementować interfejsów"],e:"Domyślnie klasa nie może być klasą bazową. Musi być oznaczona virtual lub abstract."},{id:"w06-37",s:"f",q:"Czym różni się klasa virtual od abstract?",a:["Z virtual można tworzyć obiekty i dziedziczyć; abstract musi być rozszerzona i nie można tworzyć jej obiektów","To synonimy","Abstract pozwala tworzyć obiekty, virtual nie","Virtual nie może być rozszerzona"],e:"virtual może być klasą bazową (można utworzyć obiekt). abstract musi być rozszerzona (nie można utworzyć obiektu)."},{id:"w06-38",s:"f",q:"Ile maksymalnie parametrów może mieć metoda Apex?",a:["32","16","64","255"],e:"Metoda w Apex może mieć najwyżej 32 parametry."},{id:"w06-39",s:"f",q:"Który typ jest przekazywany do metody przez referencję?",a:["List<String>","Integer","String","Date"],e:"Przez wartość przekazywane są Integer, Double, Long, Decimal, Boolean, Date, Datetime i String. Pozostałe typy (np. kolekcje, sObject) przez referencję."},{id:"w06-40",s:"f",q:"Czy metody Apex są domyślnie polimorficzne?",a:["Nie; muszą być oznaczone virtual lub abstract","Tak, jak w Javie","Tak, ale tylko publiczne","Nie, Apex nie wspiera polimorfizmu"],e:"Metody domyślnie nie są polimorficzne. virtual ma implementację i może być nadpisana, abstract nie ma implementacji i musi być nadpisana."},{id:"w06-41",s:"f",q:"Czego NIE mogą zawierać interfejsy w Apex?",a:["Domyślnych implementacji metod ani pól","Deklaracji metod","Metod zwracających Decimal","Metod z parametrami"],e:"W interfejsach brak domyślnych implementacji metod i pól."},{id:"w06-42",s:"g",q:"Jaki zasięg widoczności daje modyfikator global?",a:["Wszystkie Org-i (pakiety managed)","Cały Org","Klasa i klasy potomne","Tylko wnętrze klasy"],e:"private – klasa; protected – klasa i potomne; public – cały Org; global – wszystkie Org-i (pakiety managed)."},{id:"w06-43",s:"g",q:"Jaki zasięg widoczności daje public w Apex?",a:["Cały Org","Wszystkie Org-i","Klasa i potomne","Tylko pakiet"],e:"Modyfikator public daje widoczność w całym Org-u."},{id:"w06-44",s:"g",q:"Do których elementów NIE można zastosować modyfikatora abstract/virtual?",a:["Do pól","Do klas","Do metod","Można do wszystkich"],e:"Modyfikatorów abstract i virtual można używać dla klas i metod, ale nie dla pól."},{id:"w06-45",s:"g",q:"Jakie jest domyślne zachowanie klasy Apex względem zasad dostępu (sharing)?",a:["without sharing – ignoruje zasady dostępu","with sharing – stosuje zasady dostępu","inherited sharing zawsze","Zależy od wersji API"],e:"Wg wykładu without sharing (ignoruje zasady dostępu) to domyślne zachowanie. with sharing stosuje zasady dostępu Salesforce."},{id:"w06-46",s:"g",q:"Do czego może być zastosowany modyfikator transient?",a:["Tylko do pola; jego wartość nie jest serializowana (np. hasła, tokeny)","Tylko do metody","Tylko do klasy","Do klas i metod"],e:"transient (tylko pole) nie jest serializowane, czyli nie jest zapisywane do bazy ani przesyłane między warstwami MVC."},{id:"w06-
