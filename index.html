 powiązać rekordy z aktywnościami, np. zadaniami i wydarzeniami."},{id:"w04-21",q:"Która opcja obiektu umożliwia stosowanie mechanizmów współdzielenia rekordów i kontroli dostępu?",a:["Allow Sharing","Allow Search","Allow Activities","Deployment Status"],e:"Allow Sharing umożliwia mechanizmy współdzielenia rekordów i kontroli dostępu."},{id:"w04-22",q:"Która opcja pozwala śledzić zmiany wartości wybranych pól?",a:["Track Field History","Allow Reports","Allow Search","Field Access"],e:"Track Field History pozwala śledzić zmiany wartości wybranych pól."},{id:"w04-23",q:"Która opcja umożliwia wykorzystanie rekordów obiektu w raportach i analizach?",a:["Allow Reports","Allow Activities","Allow Sharing","Search Layouts"],e:"Allow Reports umożliwia wykorzystanie rekordów w raportach i analizach."},{id:"w04-24",q:"Która sekcja konfiguracji obiektu służy do sprawdzania poprawności danych przed zapisem rekordu?",a:["Validation Rules","Triggers","Field Access","Record Types"],e:"Validation Rules sprawdzają poprawność danych przed zapisaniem rekordu."},{id:"w04-25",q:"Za co odpowiada sekcja Triggers w konfiguracji obiektu?",a:["Wykonywanie kodu Apex w odpowiedzi na operacje na rekordach","Sprawdzanie poprawności danych deklaratywnie","Rozmieszczenie pól na stronie","Uprawnienia do pól"],e:"Triggers wykonują kod Apex w odpowiedzi na operacje na rekordach."},{id:"w04-26",q:"Czym różni się Object Access od Field Access?",a:["Object Access to uprawnienia do operacji na obiekcie, a Field Access do odczytu i edycji poszczególnych pól","To to samo","Object Access dotyczy UI, Field Access bazy danych","Field Access dotyczy rekordów, Object Access pól"],e:"Object Access to uprawnienia do operacji na obiekcie. Field Access to uprawnienia do odczytu i edycji pól."},{id:"w04-27",q:"Co definiują Page Layouts?",a:["Rozmieszczenie pól, sekcji i powiązanych list na stronie rekordu","Najważniejsze informacje w skróconym widoku rekordu","Informacje w wynikach wyszukiwania","Warianty procesów biznesowych"],e:"Page Layouts to rozmieszczenie pól, sekcji i powiązanych list na stronie prezentacyjnej rekordu."},{id:"w04-28",q:"Co definiują Compact Layouts?",a:["Wybór najważniejszych informacji wyświetlanych w skróconym widoku rekordu","Pełne rozmieszczenie pól na stronie rekordu","Kolumny w wynikach wyszukiwania","Limity obiektu"],e:"Compact Layouts to najważniejsze informacje w skróconym widoku rekordu."},{id:"w04-29",q:"Do czego służą Record Types?",a:["Do różnych wariantów obsługi rekordów tego samego obiektu, np. różnych procesów biznesowych","Do określania typu danych pola","Do tworzenia nowych obiektów","Do definiowania relacji"],e:"Record Types to różne warianty obsługi rekordów tego samego obiektu, np. różne procesy biznesowe."},{id:"w04-30",q:"Co określają Search Layouts?",a:["Informacje prezentowane w wynikach wyszukiwania","Czy obiekt jest wyszukiwalny","Kolejność pól w formularzu","Uprawnienia do wyszukiwania"],e:"Search Layouts określają informacje prezentowane w wynikach wyszukiwania. To, czy obiekt w ogóle jest wyszukiwalny, określa Allow Search."},{id:"w04-31",q:"Które pole jest w obiekcie, ale nie jest wyświetlane na liście Fields & Relationships?",a:["RecordID","Created By","Owner","Last Modified By"],e:"Jest jeszcze pole RecordID, ale nie jest wyświetlane."},{id:"w04-32",q:"Jaki jest pierwszy krok tworzenia pola obiektu?",a:["Zdefiniowanie typu danych","Określenie nazwy i etykiety","Zdefiniowanie bezpieczeństwa","Dodanie do formularza"],e:"Krok 1: typ danych. Potem nazwa, etykieta, wymagalność, duplikaty. Następnie bezpieczeństwo i interfejs (dodanie do formularza)."},{id:"w04-33",q:"Co ustala się na etapie 'Bezpieczeństwo' przy tworzeniu pola?",a:["Dostęp do pola dla użytkowników Org-a","Szyfrowanie pola","Czy pole jest wymagane","Czy pole pojawi się w formularzu"],e:"Bezpieczeństwo to zdefiniowanie dostępu do pola dla użytkowników Org-a."},{id:"w04-34",q:"Który typ pola przechowuje tekst z formatowaniem (pogrubienie, listy)?",a:["Text Area (Rich)","Text Area (Long)","Text Area","Text (Encrypted)"],e:"Text Area (Rich) przechowuje tekst z formatowaniem."},{id:"w04-35",q:"Który typ pola używa mechanizmu szyfrowania Salesforce?",a:["Text (Encrypted)","Text Area (Rich)","Formula","Text Area (Long)"],e:"Text (Encrypted) przechowuje tekst z wykorzystaniem szyfrowania Salesforce."},{id:"w04-36",q:"Który typ pola oblicza wartość na podstawie innych pól?",a:["Formula","Auto Number","Roll-Up Summary","Percent"],e:"Formula oblicza wartość na podstawie innych pól (tego samego rekordu)."},{id:"w04-37",q:"Który typ pola automatycznie nadaje kolejne numery rekordom?",a:["Auto Number","Number","Formula","Picklist"],e:"Auto Number automatycznie nadaje kolejne numery rekordom."},{id:"w04-38",q:"Który typ pola pozwala wybrać jedną wartość ze zdefiniowanej listy?",a:["Picklist","Checkbox","Lookup","Text"],e:"Picklist to wybór jednej wartości ze zdefiniowanej listy."},{id:"w04-39",q:"Który typ pola przechowuje wartość logiczną (prawda/fałsz)?",a:["Checkbox","Picklist","Number","Percent"],e:"Checkbox to wartość logiczna."},{id:"w04-40",q:"Który typ pola przechowuje godzinę bez daty?",a:["Time","Date","Date/Time","Number"],e:"Date to data bez godziny, Time to godzina bez daty, Date/Time to data z godziną."},{id:"w04-41",q:"Który typ pola przechowuje datę bez godziny?",a:["Date","Time","Date/Time","Text"],e:"Date to data bez godziny."},{id:"w04-42",q:"Który z poniższych jest dostępnym typem danych pola w Salesforce?",a:["Geolocation","Blob","JSON","Array"],e:"Typy wymienione na slajdach: Currency, Email, Phone, URL, Geolocation (obok tekstowych, liczbowych i datowych)."},{id:"w04-43",q:"Czym różni się Text Area od Text?",a:["Text Area to krótkie opisy w wielu wierszach, a Text to krótkie napisy","Text Area jest szyfrowany","Text Area obsługuje formatowanie","Nie różnią się"],e:"Text to krótkie napisy, Text Area to krótkie opisy w wielu wierszach, Text Area (Long) to dłuższe opisy."},{id:"w04-44",q:"Czego deweloper Salesforce nie robi przy obsłudze danych (w odróżnieniu od klasycznych aplikacji)?",a:["Nie obsługuje bazy danych za pomocą SQL","Nie pisze zapytań o dane","Nie definiuje pól","Nie tworzy rekordów"],e:"Na liście rzeczy, których się nie robi, jest 'Obsługa bazy danych za pomocą SQL'. W Salesforce używa się SOQL/DML, a nie SQL."},{id:"w04-45",q:"Co znajdziesz w sekcji 'Details' konfiguracji obiektu?",a:["Nazwę, nazwę API i podstawowe ustawienia obiektu","Pola i relacje","Reguły walidacji","Układy stron"],e:"Details zawiera nazwę, nazwę API i podstawowe ustawienia obiektu."}],Zy={id:Uy,title:Hy,questions:Vy},Qy="w05",Gy="W5 · Relacje w modelu danych",Xy=[{id:"w05-01",q:"Na czym polega utworzenie relacji między obiektami w Salesforce?",a:["Na dodaniu do obiektu pola o odpowiednim typie","Na utworzeniu klucza obcego w SQL","Na utworzeniu tabeli łączącej w bazie","Na napisaniu triggera"],e:"Utworzenie relacji polega na dodaniu do obiektu pola o odpowiednim typie relacyjnym."},{id:"w05-02",q:"W którym obiekcie dodaje się pole relacji?",a:["W obiekcie podrzędnym, wskazując obiekt nadrzędny","W obiekcie nadrzędnym, wskazując obiekt podrzędny","W obu obiektach","W obiekcie pośredniczącym zawsze"],e:"Pole dodaje się w obiekcie podrzędnym i wskazuje się obiekt nadrzędny."},{id:"w05-03",q:"Czym jest Lookup Relationship?",a:["Relacją luźną między dwoma obiektami w bazie Org-a","Relacją silną między dwoma obiektami","Relacją z tabelą w zewnętrznej bazie","Relacją wiele do wielu"],e:"Lookup to relacja luźna, Master-Detail to relacja silna, External Lookup to relacja luźna z tabelą zewnętrzną."},{id:"w05-04",q:"Czym jest External Lookup Relationship?",a:["Relacją luźną między obiektem w Org-u a tabelą w zewnętrznej bazie danych","Relacją silną z obiektem z innego Org-a","Relacją między dwoma obiektami zewnętrznymi zawsze kaskadową","Relacją Master-Detail do Sandboxa"],e:"External Lookup to relacja luźna między obiektem w bazie Org-a i tabelą w zewnętrznej bazie danych."},{id:"w05-05",q:"Co wskazuje systemowe pole Created By?",a:["Użytkownika, który utworzył rekord","Użytkownika, który ostatnio zmodyfikował rekord","Właściciela rekordu","Datę utworzenia rekordu"],e:"Created By (Lookup) to użytkownik, który utworzył rekord."},{id:"w05-06",q:"Na co może wskazywać pole Owner?",a:["Na użytkownika lub kolejkę odpowiedzialną za rekord","Tylko na administratora Org-a","Na obiekt Master","Na konto (Account)"],e:"Owner (Lookup) to użytkownik lub kolejka odpowiedzialna za rekord, jeśli obiekt obsługuje własność rekordów."},{id:"w05-07",q:"Jakiego typu są pola systemowe Created By, Last Modified By i Owner?",a:["Lookup","Master-Detail","Text","Formula"],e:"Wszystkie są polami typu Lookup do użytkownika (Owner także do kolejki)."},{id:"w05-08",q:"Czy predefiniowane relacje Salesforce zawsze można usunąć?",a:["Nie, niektóre są niezbędne do działania funkcji i nie można ich usunąć ani dowolnie modyfikować","Tak, wszystkie można usunąć","Tak, ale tylko w Sandboxie","Nie, ale można je dowolnie modyfikować"],e:"Niektóre predefiniowane relacje są niezbędne do działania określonych funkcji i nie można ich usunąć ani dowolnie modyfikować."},{id:"w05-09",q:"Który przykład to relacja standardowego modelu danych?",a:["Opportunity – Account","Coach – Room","Product – Category (custom)","Event__c – Room__c"],e:"Przykłady standardowe: Contact–Account, Opportunity–Account, Case–Account."},{id:"w05-10",q:"Jakimi typami relacji tworzy się relacje niestandardowe?",a:["Lookup lub Master-Detail","Tylko External Lookup","Tylko Master-Detail","Hierarchical i Many-to-Many"],e:"Relacje niestandardowe tworzy się za pomocą typów Lookup lub Master-Detail."},{id:"w05-11",q:"Jaka jest krotność relacji Master-Detail?",a:["Jeden (Master) do wielu (Detail)","Wiele do wielu","Jeden do jednego","Wiele (Master) do jednego (Detail)"],e:"Master-Detail to relacja jeden (Master) do wielu (Detail)."},{id:"w05-12",q:"Który przykład z wykładu ilustruje relację Master-Detail?",a:["Polisa ubezpieczeniowa (Master) i roszczenie (Detail)","Kategoria (Parent) i produkt (Child)","Użytkownik i rekord (Created By)","Firma i kontakt"],e:"Roszczenie (Detail) nie może istnieć bez polisy (Master). Produkt–kategoria to przykład Lookup."},{id:"w05-13",q:"Czy rekord Detail może istnieć bez rekordu Master?",a:["Nie, rekord Master musi istnieć w chwili tworzenia Detail","Tak, zawsze","Tak, jeśli pole ma wartość null","Tylko w Sandboxie"],e:"Obiekt Detail nie może istnieć bez obiektu Master. Rekord Master musi istnieć w chwili tworzenia rekordu Detail."},{id:"w05-14",q:"Gdzie tworzy się pole przy relacji Master-Detail?",a:["W obiekcie Detail; w Master nie tworzy się żadnego pola","W obiekcie Master","W obu obiektach","W obiekcie pośredniczącym"],e:"W obiekcie Detail tworzymy pole typu Master-Detail. W obiekcie Master nie tworzymy żadnego pola, bo przechowuje on automatyczną listę Detail."},{id:"w05-15",q:"Czy można wstawić null w pole typu Master-Detail?",a:["Nie","Tak","Tak, ale tylko przez Apex","Tak, jeśli obiekt Master został usunięty"],e:"Relacja silna oznacza m.in. brak możliwości wstawienia null w pole Master-Detail."},{id:"w05-16",q:"Co dzieje się z rekordami Detail po usunięciu rekordu Master?",a:["Są usuwane kaskadowo","Pozostają z pustym polem relacji","Są przenoszone do innego Master","Usunięcie Master jest zablokowane"],e:"Master-Detail daje kaskadowe usuwanie rekordów Detail po usunięciu rekordu Master."},{id:"w05-17",q:"Do czego służą pola Roll-Up Summary i gdzie są dostępne?",a:["Do automatycznej agregacji danych rekordów Detail; dostępne w obiekcie Master relacji Master-Detail","Do agregacji w obiekcie Parent relacji Lookup","Do sumowania pól tego samego rekordu","Do agregacji danych zewnętrznych"],e:"Roll-Up Summary jest dostępne w obiekcie Master (tylko przy Master-Detail) i automatycznie agreguje dane rekordów Detail."},{id:"w05-18",q:"Skąd obiekt Detail bierze uprawnienia, widoczność i właściciela?",a:["Dziedziczy je po obiekcie Master; Detail nie ma pola Owner","Ma własne pole Owner i własne uprawnienia","Od administratora Org-a","Od użytkownika, który go utworzył"],e:"Detail dziedziczy uprawnienia i widoczność po Master. Nie posiada pola Owner i dziedziczy właściciela po Master."},{id:"w05-19",q:"Ile maksymalnie pól Master-Detail może mieć pojedynczy obiekt?",a:["2","1","40","10"],e:"Pojedynczy obiekt może mieć maksymalnie 2 pola typu Master-Detail."},{id:"w05-20",q:"Ile pól Lookup może mieć pojedynczy obiekt?",a:["Do 40, ale odlicza się od tego pola Master-Detail","Do 2","Do 40 niezależnie od pól Master-Detail","Bez limitu"],e:"Do 40 pól Lookup, przy czym limit obejmuje także pola Master-Detail."},{id:"w05-21",q:"Jak nazywają się obiekty w relacji Lookup?",a:["Parent i Child","Master i Detail","Owner i Record","Source i Target"],e:"Lookup: Parent i Child. Master-Detail: Master i Detail."},{id:"w05-22",q:"Który przykład z wykładu ilustruje relację Lookup?",a:["Kategoria (Parent) i produkt (Child)","Polisa (Master) i roszczenie (Detail)","Zamówienie i pozycja zamówienia","Faktura i linia faktury"],e:"Produkt (Child) i kategoria (Parent): oba obiekty mogą istnieć niezależnie."},{id:"w05-23",q:"Czy rekord Parent musi istnieć w chwili tworzenia rekordu Child w relacji Lookup?",a:["Nie, może nie istnieć","Tak, zawsze","Tak, chyba że pole jest wymagane","Tylko dla obiektów standardowych"],e:"Przy Lookup rekord Parent może nie istnieć w chwili tworzenia rekordu Child."},{id:"w05-24",q:"Jak rekord Parent uzyskuje listę wskazujących na niego rekordów Child?",a:["Przez Related List","Przez pole Roll-Up Summary","Przez dodatkowe pole w Parent","Nie może jej uzyskać"],e:"Rekord Parent może uzyskać listę obiektów Child, które na niego wskazują (Related List)."},{id:"w05-25",q:"Co dzieje się z rekordami Child po usunięciu rekordu Parent (Lookup)?",a:["Nie są usuwane kaskadowo","Są usuwane kaskadowo","Usunięcie Parent jest niemożliwe","Child przejmuje rolę Parent"],e:"Lookup to relacja luźna, więc brak kaskadowego usuwania rekordów Child."},{id:"w05-26",q:"Czy pole Lookup może mieć wartość null?",a:["Tak","Nie","Tylko w obiektach standardowych","Tylko przy relacji z samym sobą"],e:"W relacji luźnej można wstawić null w pole Lookup."},{id:"w05-27",q:"Czy obiekt Child w relacji Lookup dziedziczy uprawnienia i Owner po Parent?",a:["Nie","Tak, zawsze","Tylko uprawnienia, bez Owner","Tylko Owner, bez uprawnień"],e:"Lookup: brak dziedziczenia uprawnień i widoczności (w tym pola Owner)."},{id:"w05-28",q:"Czy relacja Lookup jest możliwa w obrębie tego samego obiektu?",a:["Tak","Nie","Tylko dla obiektów standardowych","Tylko jako Master-Detail"],e:"Relacja Lookup jest możliwa w obrębie tego samego obiektu (self-relationship)."},{id:"w05-29",q:"Jakim kolorem Schema Builder oznacza relację Master-Detail?",a:["Czerwonym","Niebieskim","Zielonym","Czarnym"],e:"Master-Detail jest oznaczana linią czerwoną, a Lookup linią niebieską."},{id:"w05-30",q:"Jakim kolorem Schema Builder oznacza relację Lookup?",a:["Niebieskim","Czerwonym","Pomarańczowym","Szarym"],e:"Lookup → linia niebieska."},{id:"w05-31",q:"Co łączy linia relacji na diagramie Schema Builder?",a:["Nagłówek obiektu Master/Parent z polem relacji w obiekcie Detail/Child","Dwa nagłówki obiektów","Dwa pola relacji","Pole Owner z obiektem User"],e:"Linia łączy nagłówek obiektu Master lub Parent z polem relacji w obiekcie Detail lub Child."},{id:"w05-32",q:"Dla jakich relacji na diagramie pojawia się symbol rozwidlenia i otwartego kółka?",a:["Dla obu typów relacji","Tylko dla Master-Detail","Tylko dla Lookup","Tylko dla relacji wiele do wielu"],e:"Symbol rozwidlenia i otwartego kółka pojawia się dla obu typów relacji."},{id:"w05-33",q:"Jak realizuje się relację wiele do wielu w Salesforce?",a:["Wyłącznie za pomocą obiektu pośredniczącego (Junction Object)","Polem typu Many-to-Many","Dwoma polami Lookup w obu obiektach","Nie da się jej zrealizować"],e:"Relacje wiele do wielu realizuje się wyłącznie za pomocą obiektu pośredniczącego (Junction Object)."},{id:"w05-34",q:"Który wariant obiektu pośredniczącego NIE jest wymieniony na wykładzie?",a:["1 pole Lookup bez innych pól relacji","2 pola Master-Detail","2 lub więcej pól Lookup","1 pole Master-Detail i 1 pole Lookup"],e:"Warianty: 2× Master-Detail, 2 lub więcej Lookup, albo Master-Detail + Lookup. Jedno pole relacji nie tworzy relacji wiele do wielu."},{id:"w05-35",q:"Czy obiekt pośredniczący może zawierać pola innego typu niż relacyjne?",a:["Tak","Nie","Tylko pola Formula","Tylko pola Roll-Up Summary"],e:"Obiekt pośredniczący może zawierać również pola innego typu."},{id:"w05-36",q:"Czy obiekt Master musi mieć pole wskazujące na rekordy Detail?",a:["Nie, rekord Master automatycznie przechowuje listę wskazujących na niego Detail","Tak, pole typu Detail List","Tak, pole Roll-Up Summary jest obowiązkowe","Tak, pole Lookup zwrotne"],e:"W obiekcie Master nie tworzymy żadnego pola. Przechowuje on automatyczną listę obiektów Detail."}],$y={id:Qy,title:Gy,questions:Xy},Yy="w06",ez="W6 · Wprowadzenie do Apex",az=[{id:"w06-01",q:"Na jakim języku wzorowana jest składnia Apex?",a:["Java","C#","JavaScript","Python"],e:"Apex to język obiektowy ze składnią wzorowaną na Javie."},{id:"w06-02",q:"Czy Apex rozróżnia wielkość liter?",a:["Nie, inaczej niż Java","Tak, tak jak Java","Tylko w nazwach klas","Tylko w nazwach zmiennych"],e:"‼️ Apex nie rozróżnia wielkości liter, inaczej niż Java."},{id:"w06-03",q:"Ile klas może rozszerzać (extends) klasa Apex?",a:["Tylko jedną","Dowolnie wiele","Dwie","Żadnej, Apex nie ma dziedziczenia"],e:"Apex pozwala na pojedyncze dziedziczenie: klasa może rozszerzać tylko jedną klasę."},{id:"w06-04",q:"Ile interfejsów może implementować jedna klasa Apex?",a:["Wiele","Tylko jeden","Maksymalnie dwa","Żadnego"],e:"Klasa może implementować wiele interfejsów (implements)."},{id:"w06-05",q:"Z jakimi językami zapytań zintegrowany jest Apex?",a:["SOQL i SOSL","SQL i PL/SQL","GraphQL i SPARQL","HQL i JPQL"],e:"Apex jest zintegrowany z SOQL i SOSL."},{id:"w06-06",q:"Jakie typy danych występują w Apex?",a:["Tylko typy obiektowe; brak typów prymitywnych","Typy prymitywne i obiektowe jak w Javie","Tylko typy prymitywne","Tylko typ sObject"],e:"Apex ma tylko typy obiektowe. ‼️ Brak typów prymitywnych, np. int, double, boolean."},{id:"w06-07",q:"Jak zapisuje się literał tekstowy w Apex?",a:["W pojedynczych apostrofach: 'Hello'",'W cudzysłowach: "Hello"',"W backtickach: `Hello`","Dowolnie"],e:"‼️ String w Apex używa pojedynczych apostrofów: 'Hello'."},{id:"w06-08",q:"Który z poniższych NIE jest typem liczbowym Apex?",a:["int","Integer","Decimal","Long"],e:"Liczbowe: Integer, Long, Double, Decimal. 'int' to typ prymitywny, którego w Apex nie ma."},{id:"w06-09",q:"Jakie kolekcje oferuje Apex?",a:["List, Set, Map","Array, Tuple, Dict","Vector, Stack, Queue","Tylko tablice []"],e:"Kolekcje: List, Set, Map. ‼️ Brak tablic prostych typu []."},{id:"w06-10",q:"Jaki typ może przechowywać dowolną wartość w Apex?",a:["Object","sObject","Any","Variant"],e:"Typ bazowy Object może przechowywać dowolną wartość. sObject przechowuje dowolny rekord bazy."},{id:"w06-11",q:"Czym jest typ sObject?",a:["Typem rekordu bazy danych; może wskazywać na dowolny rekord każdej tabeli i jest typem bazowym typów wszystkich obiektów","Typem bazowym dla wszystkich wartości, także liczb","Typem przechowującym pliki binarne","Typem identyfikatora rekordu"],e:"sObject to rekord obiektu bazy danych, typ bazowy dla typów wszystkich obiektów (Account, Contact, MojaTabela__c…)."},{id:"w06-12",q:"Jakim sufiksem oznaczone są relacje między obiektami w Apex?",a:["__r","__c","__rel","__x"],e:"Obiekty niestandardowe mają sufiks __c, a relacje między obiektami sufiks __r."},{id:"w06-13",q:"Jaki typ reprezentuje unikalny identyfikator rekordu?",a:["ID","String","Integer","Key"],e:"Unikalny identyfikator rekordu obecny w każdym rekordzie ma typ ID."},{id:"w06-14",q:"Jaki typ Apex służy do danych binarnych, np. plików?",a:["Blob","Binary","ByteArray","File"],e:"Dane binarne, np. pliki, mają typ Blob."},{id:"w06-15",q:"Ile poziomów zagnieżdżenia klas wewnętrznych dopuszcza Apex?",a:["Tylko 1 poziom","Dowolnie wiele","2 poziomy","Apex nie pozwala na klasy wewnętrzne"],e:"Można definiować klasy wewnątrz innych klas, ale tylko 1 poziom ‼️."},{id:"w06-16",q:"Które typy w Apex dopuszczają wartość null?",a:["Wszystkie","Tylko typy obiektowe poza Integer i Boolean","Tylko sObject","Żadne"],e:"Wszystkie typy dopuszczają null, bo w Apex są tylko typy obiektowe."},{id:"w06-17",q:"Który typ czasowy w Apex uwzględnia strefy czasowe?",a:["DateTime (Date już nie)","Date (DateTime już nie)","Oba","Żaden"],e:"DateTime uwzględnia strefy czasowe, Date już nie ‼️."},{id:"w06-18",q:"Z jaką dokładnością DateTime jest zapisywany w bazie danych?",a:["Do sekund (choć w Apex uwzględnia milisekundy)","Do milisekund","Do minut","Do dni"],e:"DateTime w Apex uwzględnia milisekundy, ale w bazie zapisywany jest z dokładnością do sekund ‼️."},{id:"w06-19",q:"Czym jest w Apex deklaracja 'Integer numery []'?",a:["Listą (to alternatywny zapis List<Integer>)","Prostą tablicą o stałym rozmiarze","Zbiorem Set<Integer>","Błędem kompilacji"],e:"Listę można definiować na dwa sposoby: List<Integer> numery lub Integer numery []. Zawsze jest to lista."},{id:"w06-20",q:"Czego brakuje w Apex w porównaniu z Javą?",a:["Strumieni (streams) i try-with-resources","Pętli for-each","Obsługi wyjątków","Interfejsów"],e:"Brak strumieni 😞 oraz brak try-with-resources 😞."},{id:"w06-21",q:"Jak wykonywany jest kod Apex?",a:["Jest interpretowany bezpośrednio przez platformę Salesforce","Kompilowany do pliku .exe","Uruchamiany w przeglądarce użytkownika","Uruchamiany na lokalnej maszynie JVM dewelopera"],e:"Kod jest interpretowany bezpośrednio przez platformę Salesforce. Kod Apex to np. trigger, kontroler, batch job, a nie cała aplikacja."},{id:"w06-22",q:"Co ma własne każdy kontekst wykonania Apex?",a:["Zmienne statyczne, dane w pamięci, transakcje bazodanowe, limity zasobów","Własny Org","Własną bazę danych","Własnego użytkownika administracyjnego"],e:"Kontekst wykonania ma własne zmienne statyczne, dane w pamięci, transakcje bazodanowe i limity zasobów."},{id:"w06-23",q:"Dlaczego w Apex nie ma synchronizacji między kontekstami?",a:["Kontekst wykonuje się w jednym wątku, a różne konteksty mogą działać w różnych wątkach bez współdzielenia stanu","Bo Apex nie obsługuje wątków","Bo wszystkie konteksty dzielą jedną pamięć","Bo synchronizację zapewnia baza danych"],e:"Kontekst wykonuje się w jednym wątku. Różne konteksty mogą być w różnych wątkach, co oznacza brak synchronizacji ‼️."},{id:"w06-24",q:"Jaki rodzaj kontekstu tworzy uruchomienie kodu w Developer Console w celu debugowania?",a:["Anonimowy","Testowy","Batch","API"],e:"Anonimowy → Developer Console, debugowanie."},{id:"w06-25",q:"Która adnotacja/interfejs jest związana z kontekstem Batch?",a:["Database.Batchable","@isTest","@RestResource","@future"],e:"Batch: uruchamiany przez system, Database.Batchable."},{id:"w06-26",q:"Która adnotacja jest związana z kontekstem API (kod uruchamiany zdalnie)?",a:["@RestResource","@isTest","@future","Database.Batchable"],e:"API → uruchamiany zdalnie, @RestResource."},{id:"w06-27",q:"Co jest przykładem uruchomienia kontekstu asynchronicznego?",a:["Schedulable lub @future","Naciśnięcie przycisku","@isTest","Developer Console"],e:"Asynchroniczny: kod uruchamiany w tle, np. Schedulable, @future."},{id:"w06-28",q:"Jakie są cechy kontekstu synchronicznego?",a:["Użytkownik czeka na wynik, cały kod w jednej transakcji, błąd powoduje rollback całości","Kod w tle, większe limity","Brak transakcji","Kod uruchamiany wyłącznie przez system"],e:"Synchroniczny: wykonanie w odpowiedzi na akcję użytkownika, blokowanie UI, mniejsze limity, jedna transakcja i rollback przy błędzie."},{id:"w06-29",q:"Ile maksymalnie zapytań SOQL na transakcję dopuszcza kontekst synchroniczny?",a:["100","200","50","150"],e:"Synchroniczny: maks. 100 zapytań SOQL. Asynchroniczny: maks. 200."},{id:"w06-30",q:"Ile maksymalnie zapytań SOQL na transakcję dopuszcza kontekst asynchroniczny?",a:["200","100","150","Bez limitu"],e:"Asynchroniczny ma większe limity: maks. 200 zapytań SOQL na transakcję."},{id:"w06-31",q:"Które mechanizmy uruchamiają kod w kontekście asynchronicznym?",a:["Batch Apex, Queueable, Future methods, Scheduled Apex","Anonymous Apex i Web Service","Tylko triggery before","Tylko Visualforce GET"],e:"Operacje asynchroniczne uruchamiają m.in. Batch Apex, Queueable, Future methods i Scheduled Apex."},{id:"w06-32",q:"W jakim kontekście wykonuje się wywołanie Web Service (SOAP/REST) wg tabeli z wykładu?",a:["Synchronicznym","Asynchronicznym","Testowym","Batch"],e:"Web Service (SOAP lub REST) → S. Anonymous Apex → S. Inbound Email Service → A."},{id:"w06-33",q:"W jakim kontekście wykonuje się Inbound Email Service wg tabeli z wykładu?",a:["Asynchronicznym","Synchronicznym","Anonimowym","Testowym"],e:"Inbound Email Service → A (asynchroniczny)."},{id:"w06-34",q:"Gdzie dozwolone są zmienne statyczne w Apex?",a:["Tylko w klasach zewnętrznych","Tylko w klasach wewnętrznych","W interfejsach","W triggerach jako pola"],e:"Zmienne statyczne są dozwolone tylko w klasach zewnętrznych."},{id:"w06-35",q:"Jaki jest czas życia zmiennej statycznej w Apex?",a:["Czas trwania kontekstu uruchamiania; potem wartość jest tracona","Do restartu Org-a","Bezterminowo, jak w bazie danych","Do wylogowania użytkownika"],e:"Czas życia zmiennej statycznej to czas trwania kontekstu. Po jego zakończeniu wartość jest tracona."},{id:"w06-36",q:"Klasa Apex bez modyfikatora virtual ani abstract…",a:["…domyślnie nie może być klasą bazową innej klasy","…może być dowolnie rozszerzana","…nie może mieć konstruktora","…nie może implementować interfejsów"],e:"Domyślnie klasa nie może być klasą bazową. Musi być oznaczona virtual lub abstract."},{id:"w06-37",q:"Czym różni się klasa virtual od abstract?",a:["Z virtual można tworzyć obiekty i dziedziczyć; abstract musi być rozszerzona i nie można tworzyć jej obiektów","To synonimy","Abstract pozwala tworzyć obiekty, virtual nie","Virtual nie może być rozszerzona"],e:"virtual może być klasą bazową (można utworzyć obiekt). abstract musi być rozszerzona (nie można utworzyć obiektu)."},{id:"w06-38",q:"Ile maksymalnie parametrów może mieć metoda Apex?",a:["32","16","64","255"],e:"Metody mogą mieć maksymalnie 32 parametry."},{id:"w06-39",q:"Który typ jest przekazywany do metody przez referencję?",a:["List<String>","Integer","String","Date"],e:"Przez wartość przekazywane są Integer, Double, Long, Decimal, Boolean, Date, Datetime i String. Pozostałe typy (np. kolekcje, sObject) przez referencję."},{id:"w06-40",q:"Czy metody Apex są domyślnie polimorficzne?",a:["Nie; muszą być oznaczone virtual lub abstract","Tak, jak w Javie","Tak, ale tylko publiczne","Nie, Apex nie wspiera polimorfizmu"],e:"Metody domyślnie nie są polimorficzne. virtual ma implementację i może być nadpisana, abstract nie ma implementacji i musi być nadpisana."},{id:"w06-41",q:"Czego NIE mogą zawierać interfejsy w Apex?",a:["Domyślnych implementacji metod ani pól","Deklaracji metod","Metod zwracających Decimal","Metod z parametrami"],e:"W interfejsach brak domyślnych implementacji metod i pól."},{id:"w06-42",q:"Jaki zasięg widoczności daje modyfikator global?",a:["Wszystkie Org-i (pakiety managed)","Cały Org","Klasa i klasy potomne","Tylko wnętrze klasy"],e:"private – klasa; protected – klasa i potomne; public – cały Org; global – wszystkie Org-i (pakiety managed)."},{id:"w06-43",q:"Jaki zasięg widoczności daje public w Apex?",a:["Cały Org","Wszystkie Org-i","Klasa i potomne","Tylko pakiet"],e:"public → cały Org."},{id:"w06-44",q:"Do których elementów NIE można zastosować modyfikatora abstract/virtual?",a:["Do pól","Do klas","Do metod","Można do wszystkich"],e:"abstract i virtual: klasa ✅, metoda ✅, pole ❌."},{id:"w06-45",q:"Jakie jest domyślne zachowanie klasy Apex względem zasad dostępu (sharing)?",a:["without sharing – ignoruje zasady dostępu","with sharing – stosuje zasady dostępu","inherited sharing zawsze","Zależy od wersji API"],e:"Wg wykładu without sharing (ignoruje zasady dostępu) to domyślne zachowanie. with sharing stosuje zasady dostępu Salesforce."},{id:"w06-46",q:"Do czego może być zastosowany modyfikator transient?",a:["Tylko do pola; jego wartość nie jest serializowana (np. hasła, tokeny)","Tylko do metody","Tylko do klasy","Do klas i metod"],e:"transient (tylko pole) nie jest serializowane, czyli nie jest zapisywane do bazy ani przesyłane między warstwami MVC."},{id:"w06-47",q:"Co oznacza modyfikator synchronized dla metody wg wykładu?",a:["Tylko 1 wątek może naraz wykonywać tę metodę","Metoda jest wykonywana asynchronicznie","Metoda nadpisuje metodę bazową","Metoda jest wykonywana w kontekście synchronicznym"],e:"synchronized (tylko metoda): tylko 1 wątek może naraz wykonywać tę metodę."},{id:"w06-48",q:"Który modyfikator stosuje się do metody nadpisującej metodę klasy bazowej?",a:["override","virtual","extends","super"],e:"override (tylko metoda) nadpisuje metodę w klasie bazowej."},{id:"w06-49",q:"Która konstrukcja służy w Apex do wielokrotnego wyboru zamiast switch-case?",a:["switch on … when … when else","switch … case … default","match … with","select … case"],e:"Apex: switch on zmienna { when 'A' {...} when 'B','C' {...} when else {...} }."},{id:"w06-50",q:"Czy w instrukcji switch on w Apex używa się break?",a:["Nie, nie ma break","Tak, obowiązkowo","Tylko w when else","Tylko przy wielu wartościach"],e:"W switch on nie ma break, a gałęzie nie 'przepadają' do następnej."},{id:"w06-51",q:"Jak w switch on obsłużyć kilka wartości w jednej gałęzi?",a:["when 'Intermediate', 'Advanced' { … }","when 'Intermediate' || 'Advanced' { … }","case 'Intermediate': case 'Advanced':","when ('Intermediate' or 'Advanced')"],e:"Wartości oddziela się przecinkami: when 'Intermediate', 'Advanced'."},{id:"w06-52",q:"Co wypisze kod: for (Integer i = 0; i < 5; i++) { if (i == 2) continue; if (i == 4) break; System.debug(i); }",a:["0, 1, 3","0, 1, 2, 3","0, 1","0, 1, 3, 4"],e:"i=2 jest pomijane (continue), a przy i=4 pętla jest przerywana (break). Wynik: 0, 1, 3."},{id:"w06-53",q:"Ile razy wykona się ciało pętli: Integer count = 10; do { count++; } while (count < 5);",a:["1 raz","0 razy","5 razy","Nieskończenie"],e:"do-while zawsze wykonuje ciało przynajmniej raz, potem sprawdza warunek (11 < 5 = false)."},{id:"w06-54",q:"Czy w Apex są etykiety skoku dla break/continue?",a:["Nie","Tak, jak w Javie","Tylko dla pętli for","Tylko dla while"],e:"Brak etykiet skoku."},{id:"w06-55",q:"Do czego służy Apex DML?",a:["Do tworzenia, aktualizacji, usuwania i przywracania rekordów","Do pobierania rekordów zapytaniami","Do wyszukiwania pełnotekstowego","Do definiowania obiektów"],e:"Apex DML to tworzenie, aktualizacja, usuwanie i przywracanie rekordów."},{id:"w06-56",q:"Do czego służy SOSL?",a:["Do wyszukiwania rekordów po tekście, liczbach lub polach wyszukiwania","Do pobierania rekordów jednego obiektu z filtrami (jak SELECT)","Do modyfikacji rekordów","Do definiowania relacji"],e:"SOSL to Salesforce Object Search Language, czyli wyszukiwanie. SOQL służy do pobierania rekordów (SELECT…)."},{id:"w06-57",q:"Co zazwyczaj zwraca zapytanie SOQL?",a:["Listę rekordów","Pojedynczą liczbę","Plik CSV","Obiekt JSON"],e:"SOQL zazwyczaj zwraca listę rekordów, np. [SELECT Name, Industry FROM Account]."},{id:"w06-58",q:"Ile pól definiuje klasa SampleJob z wykładu (counter, isActive, jobName)?",a:["3, w tym 1 statyczne","2","3, wszystkie instancyjne","1"],e:"Pola: public static Integer counter (statyczne), private Boolean isActive, public final String jobName."},{id:"w06-59",q:"Czy obsługa wyjątków (try/catch/finally) w Apex różni się od Javy?",a:["Składnia i działanie takie same, ale brak try-with-resources","Apex nie ma bloku finally","Apex nie obsługuje wyjątków","Apex używa on error goto"],e:"Składnia i działanie takie same jak w Javie, ale brak try-with-resources."},{id:"w06-60",q:"Co to jest kontekst wykonania Apex?",a:["Jednostka wykonania kodu Apex, definiująca większość ograniczeń i czas życia zmiennych statycznych","Sesja użytkownika w przeglądarce","Zbiór klas w jednym pliku","Środowisko Sandbox"],e:"Kontekst to jednostka wykonania kodu. Definiuje większość ograniczeń i czas życia zmiennych statycznych."}],oz={id:Yy,title:ez,questions:az},iz="w07",nz="W7 · Apex DML",tz=[{id:"w07-01",q:"Co oznacza skrót DML?",a:["Data Manipulation Language","Data Model Language","Database Management Layer","Dynamic Metadata Language"],e:"DML = Data Manipulation Language: tworzenie, aktualizacja i usuwanie rekordów z poziomu Apex."},{id:"w07-02",q:"Do czego NIE służy DML w Apex?",a:["Do odczytu rekordów (do tego służy SOQL)","Do tworzenia rekordów","Do aktualizacji rekordów","Do usuwania rekordów"],e:"‼️ Do odczytu służy SOQL, a nie DML."},{id:"w07-03",q:"Jakie są dwa sposoby korzystania z Apex DML?",a:["Instrukcje DML i metody statyczne klasy Database","SQL i PL/SQL","SOQL i SOSL","REST API i SOAP API"],e:"Sposoby: instrukcje DML (insert, update…) oraz metody statyczne klasy Database."},{id:"w07-04",q:"Jak działa instrukcja upsert?",a:["Wstawia rekord, jeśli nie istnieje, lub aktualizuje, jeśli istnieje","Zawsze wstawia nowy rekord","Scala duplikaty","Przywraca usunięty rekord"],e:"upsert = insert (gdy rekordu brak) lub update (gdy istnieje)."},{id:"w07-05",q:"Do czego służy instrukcja merge?",a:["Do scalania rekordów uznanych za duplikaty","Do łączenia dwóch obiektów w jeden","Do łączenia transakcji","Do łączenia wyników SOQL"],e:"merge to scalanie rekordów uznanych za duplikaty."},{id:"w07-06",q:"Jaki jest limit rekordów przetwarzanych przez DML w jednej transakcji?",a:["10 000","150","50 000","200"],e:"Ograniczenia dla transakcji: liczba rekordów ≤ 10 000, liczba wywołań instrukcji DML ≤ 150."},{id:"w07-07",q:"Ile maksymalnie wywołań instrukcji DML dopuszcza jedna transakcja?",a:["150","100","10 000","200"],e:"Liczba wywołań instrukcji DML ≤ 150 na transakcję."},{id:"w07-08",q:"Na czym może operować Apex DML?",a:["Na pojedynczych rekordach i na kolekcjach rekordów","Tylko na pojedynczych rekordach","Tylko na listach","Tylko na mapach"],e:"Apex DML może operować na pojedynczych rekordach i na kolekcjach rekordów."},{id:"w07-09",q:"Co się dzieje, gdy instrukcja DML zakończy się błędem (bez try-catch)?",a:["Wykonanie jest przerywane i następuje automatyczne wycofanie transakcji","Błąd jest ignorowany","Zapisywane są poprawne rekordy","Rekord trafia do Recycle Bin"],e:"Błąd przerywa wykonanie i następuje automatyczne wycofanie transakcji."},{id:"w07-10",q:"Czy samo utworzenie obiektu w Apex (new Account(...)) zapisuje go w bazie?",a:["Nie, dopiero operacja DML powoduje zapis","Tak, natychmiast","Tak, na koniec kontekstu","Tak, jeśli ma wypełnione pole Name"],e:"‼️ Samo utworzenie obiektu nie zapisuje go w bazie. Dopiero DML powoduje zapis."},{id:"w07-11",q:"Kiedy rekord otrzymuje Id?",a:["Po wstawieniu do bazy (insert); Id nadawane jest automatycznie","W konstruktorze","Trzeba je nadać ręcznie","Po pierwszym zapytaniu SOQL"],e:"Rekord po utworzeniu nie ma Id. Wstawienie do bazy automatycznie nadaje Id, które jest potem dostępne w kodzie."},{id:"w07-12",q:"Dlaczego przy tworzeniu Contact powiązanego z Account kolejność operacji ma znaczenie?",a:["Obiekt podrzędny wymaga istnienia obiektu nadrzędnego (jego Id)","Bo Contact musi być wstawiony przed Account","Bo insert działa tylko alfabetycznie","Kolejność nie ma znaczenia"],e:"Najpierw insert Account, a potem Contact z AccountId = acc.Id, bo obiekt podrzędny wymaga istnienia nadrzędnego."},{id:"w07-13",q:"Jaki typ relacji łączy Contact z Account w przykładzie z wykładu?",a:["Lookup (Account – Parent, Contact – Child)","Master-Detail (Account – Master)","Wiele do wielu","External Lookup"],e:"W przykładzie relacja Lookup: Account to Parent, Contact to Child."},{id:"w07-14",q:"Dlaczego po insert można od razu wykonać update na tym samym obiekcie bez SOQL?",a:["Bo po insert obiekt zawiera już Id utworzonego rekordu","Bo update nie wymaga Id","Bo Apex cache'uje wszystkie rekordy","Nie można, trzeba najpierw pobrać rekord SOQL"],e:"Po insert zmienna zawiera Id, więc można zaktualizować rekord bez pobierania go SOQL."},{id:"w07-15",q:"Gdzie trafia rekord po operacji delete?",a:["Do Recycle Bin, a jego Id pozostaje takie samo","Jest trwale usuwany natychmiast","Do Sandboxa","Do archiwum z nowym Id"],e:"Po delete rekord trafia do Recycle Bin, a jego identyfikator pozostaje taki sam."},{id:"w07-16",q:"Jak długo standardowo usunięte rekordy pozostają w Recycle Bin?",a:["15 dni","30 dni","7 dni","90 dni"],e:"Standardowo usunięte rekordy pozostają w Recycle Bin przez 15 dni."},{id:"w07-17",q:"Jaki warunek musi spełnić rekord, aby wykonać undelete?",a:["Musi być wcześniej usunięty i nadal nadawać się do przywrócenia","Musi mieć nowe Id","Musi być w Sandboxie","Musi być zablokowany"],e:"undelete wymaga, aby rekord był wcześniej usunięty i nadal nadawał się do przywrócenia (jest w Recycle Bin)."},{id:"w07-18",q:"Co dzieje się po 'merge primaryAccount duplicateAccount'?",a:["primaryAccount zostaje rekordem głównym, duplicateAccount jest usuwany, a powiązane rekordy są podpinane do głównego","Oba rekordy są usuwane i tworzony jest nowy","duplicateAccount staje się rekordem głównym","Rekordy są tylko oznaczane jako duplikaty"],e:"primaryAccount pozostaje rekordem głównym, duplicateAccount jest usuwany, a powiązane rekordy trafiają do rekordu głównego."},{id:"w07-19",q:"Który wzorzec jest poprawny przy wstawianiu wielu rekordów (bulk DML)?",a:["Dodać rekordy do listy w pętli i wykonać jeden insert listy po pętli","Wykonać insert każdego rekordu wewnątrz pętli","Wstawiać rekordy pojedynczo w osobnych triggerach","Użyć SOQL do wstawienia"],e:"Poprawnie: zbudować List<Account> w pętli i wykonać jeden insert, czyli jedną transakcję z bazą. Insert w pętli to anty-wzorzec."},{id:"w07-20",q:"Dlaczego insert wewnątrz pętli for jest złym wzorcem?",a:["Generuje wiele operacji na bazie i szybko wyczerpuje limit 150 instrukcji DML","Bo Apex nie pozwala na insert w pętli","Bo rekordy nie dostaną Id","Bo pętla for nie działa z sObject"],e:"Każdy insert to osobne wywołanie DML, a limit to 150 na transakcję. Bulk DML wykonuje jedno wywołanie."},{id:"w07-21",q:"Jaki wyjątek jest zgłaszany przy niepowodzeniu instrukcji DML?",a:["DmlException","QueryException","NullPointerException","SaveException"],e:"Niepowodzenie instrukcji DML zgłasza wyjątek, np. DmlException."},{id:"w07-22",q:"Co może być przyczyną błędu DML?",a:["Brak wymaganego pola, reguła walidacji, ograniczenia relacji lub brak uprawnień","Tylko błąd sieci","Tylko przekroczenie limitu SOQL","Tylko błąd składni"],e:"Przyczyny: brak wymaganego pola, reguły walidacji, ograniczenia relacji, brak uprawnień."},{id:"w07-23",q:"Co oferuje klasa Database ponad instrukcje DML?",a:["Kontrolę obsługi błędów, częściowe powodzenie i dostęp do wyników poszczególnych operacji","Szybsze wykonanie zapytań","Brak limitów","Automatyczne tworzenie obiektów Custom"],e:"Database daje kontrolę obsługi błędów, częściowe powodzenie operacji i dostęp do wyników poszczególnych operacji."},{id:"w07-24",q:"Jaka jest domyślna wartość parametru allOrNone w metodach Database?",a:["true","false","null","Zależy od operacji"],e:"Domyślnie allOrNone = true, czyli atomowość analogiczna do instrukcji DML."},{id:"w07-25",q:"Co oznacza Database.insert(records, false)?",a:["Częściowe powodzenie: poprawne rekordy zostaną zapisane, błędne nie","Wszystkie rekordy zostaną wycofane przy jakimkolwiek błędzie","Nie zostanie zapisany żaden rekord","Rekordy zostaną zapisane bez walidacji"],e:"allOrNone = false: poprawne rekordy mogą zostać zapisane, nawet jeśli inne nie zostaną."},{id:"w07-26",q:"Lista: [Account(Name='A'), Account() bez Name, Account(Name='B')]. Ile kont zapisze Database.insert(lista, true)?",a:["0","2","1","3"],e:"Przy allOrNone = true błąd drugiego rekordu powoduje, że żadne z trzech kont nie zostanie zapisane."},{id:"w07-27",q:"Ta sama lista (drugi rekord bez Name), ale Database.insert(lista, false). Co się stanie?",a:["Rekord 1 i 3 zostaną zapisane, rekord 2 nie","Żaden rekord nie zostanie zapisany","Wszystkie trzy zostaną zapisane","Zostanie rzucony DmlException"],e:"Częściowe powodzenie: rekordy 1 i 3 zostaną dodane, 2 nie. Metoda zwraca wyniki zamiast rzucać wyjątek."},{id:"w07-28",q:"Czy allOrNone = false oznacza, że błędy są ignorowane?",a:["Nie, programista musi sprawdzić wyniki i zdecydować, co zrobić z błędnymi rekordami","Tak, błędy są ignorowane","Tak, ale tylko błędy walidacji","Nie, bo i tak rzucany jest wyjątek"],e:"Ważne: allOrNone = false nie oznacza ignorowania błędów. Trzeba je sprawdzić w wynikach."},{id:"w07-29",q:"Jaki typ zwraca Database.insert()?",a:["Database.SaveResult (tablica dla listy)","Database.InsertResult","Database.UpsertResult","Boolean"],e:"insert() i update() zwracają Database.SaveResult."},{id:"w07-30",q:"Jaki typ wyniku zwraca Database.upsert()?",a:["Database.UpsertResult","Database.SaveResult","Database.MergeResult","Database.UpdateResult"],e:"upsert() → Database.UpsertResult."},{id:"w07-31",q:"Jaki typ wyniku zwraca Database.update()?",a:["Database.SaveResult","Database.UpdateResult","Database.UpsertResult","Database.DeleteResult"],e:"Uwaga, pułapka: update() zwraca SaveResult, tak jak insert(). Nie istnieje UpdateResult."},{id:"w07-32",q:"Jaki typ wyniku zwraca Database.delete()?",a:["Database.DeleteResult","Database.SaveResult","Database.UndeleteResult","Boolean"],e:"delete() → DeleteResult, undelete() → UndeleteResult, merge() → MergeResult."},{id:"w07-33",q:"Która metoda SaveResult sprawdza, czy operacja się powiodła?",a:["isSuccess()","getStatus()","hasErrors()","wasSaved()"],e:"isSuccess() sprawdza powodzenie, getId() zwraca Id zapisanego rekordu, getErrors() zwraca informacje o błędach."},{id:"w07-34",q:"Która metoda SaveResult zwraca listę błędów (Database.Error)?",a:["getErrors()","getMessages()","getExceptions()","errors()"],e:"getErrors() zwraca obiekty Database.Error z metodą getMessage()."},{id:"w07-35",q:"Gdzie są dostępne informacje o błędach przy użyciu metod klasy Database?",a:["W obiektach wynikowych, np. Database.SaveResult i Database.Error","Tylko w DmlException","W logu systemowym Org-a","Nie są dostępne"],e:"Instrukcje DML podają błędy w obiekcie wyjątku. Metody Database podają je w obiektach wynikowych (SaveResult, Error)."},{id:"w07-36",q:"Kiedy zaleca się Database z allOrNone = false?",a:["Przy imporcie wielu rekordów, z których część może zawierać błędy","Przy prostym zapisie jednego rekordu","Gdy wszystkie rekordy muszą się powieść","Do dynamicznych zapytań SOQL"],e:"Import wielu rekordów, z których część może być błędna, to Database z allOrNone = false."},{id:"w07-37",q:"Co jest zalecane do prostego zapisu jednego rekordu?",a:["Instrukcja DML (insert, update…)","Database.insert z allOrNone = false","Database.query()","Database.setSavepoint()"],e:"Prosty zapis jednego rekordu: insert, update itp."},{id:"w07-38",q:"Która metoda służy do dynamicznych zapytań SOQL?",a:["Database.query()","Database.insert()","Database.search()","Database.select()"],e:"Dynamiczne zapytania SOQL wykonuje Database.query()."},{id:"w07-39",q:"Jak wycofać zmiany do określonego punktu w transakcji?",a:["Database.setSavepoint() wraz z Database.rollback()","undelete","Database.revert()","Wyrzucić DmlException"],e:"Wycofywanie zmian: Database.setSavepoint() + Database.rollback()."},{id:"w07-40",q:"Jak zachowuje się nieudana instrukcja DML wobec wcześniejszych operacji w transakcji?",a:["Nie zapisuje części rekordów, a wcześniejsze operacje w transakcji są automatycznie wycofywane","Zapisuje poprawne rekordy","Wycofuje tylko bieżący rekord","Nie ma wpływu na wcześniejsze operacje"],e:"Nieudana instrukcja DML nie zapisuje części rekordów, a wcześniejsze operacje są automatycznie wycofywane (jeśli wyjątek nie jest obsłużony)."},{id:"w07-41",q:"Co jest potrzebne, aby kod kontynuował działanie po błędzie instrukcji DML?",a:["Obsłużenie wyjątku w bloku try-catch","Nic, kod zawsze kontynuuje","Użycie undelete","Ustawienie allOrNone = true"],e:"Instrukcje DML wymagają try-catch, jeśli kod ma kontynuować po błędzie."},{id:"w07-42",q:"Co zawiera klasa Database poza metodami DML wg wykładu?",a:["Kontrolę transakcji, wycofanie działań i metody zapytań SOQL","Metody tworzenia obiektów Custom","Metody do budowy UI","Metody do wysyłania e-maili"],e:"Database poszerza DML m.in. o kontrolę transakcji, wycofanie działań i metody zapytań SOQL."}],rz={id:iz,title:nz,questions:tz},sz="w08",lz="W8 · Apex SOQL",cz=[{id:"w08-01",q:"Co oznacza skrót SOQL?",a:["Salesforce Object Query Language","Structured Object Query Language","Salesforce Online Query Logic","Simple Object Query Language"],e:"SOQL = Salesforce Object Query Language."},{id:"w08-02",q:"Jak umieszcza się zapytanie SOQL inline w kodzie Apex?",a:["W nawiasach kwadratowych [ ]","W nawiasach klamrowych { }","W cudzysłowach i metodzie execute()","W znacznikach <soql>"],e:"SOQL jest używany inline w kodzie Apex w blokach [ ]."},{id:"w08-03",q:"Co może być rezultatem zapytania SOQL?",a:["Lista sObject, pojedynczy sObject lub Integer (dla funkcji agregujących jak count)","Tylko lista sObject","Tylko JSON","Tylko pojedynczy rekord"],e:"Wynik SOQL to lista sObject (rekordów), pojedynczy sObject albo Integer dla COUNT()."},{id:"w08-04",q:"Jaki typ zwraca: [SELECT COUNT() FROM Contact WHERE LastName = 'ORLEN']?",a:["Integer","List<Contact>","AggregateResult","Contact"],e:"SELECT COUNT() zwraca wartość typu Integer."},{id:"w08-05",q:"Jakie instrukcje oferuje SOQL?",a:["Tylko SELECT","SELECT, INSERT, UPDATE, DELETE","SELECT i UPDATE","SELECT i MERGE"],e:"SOQL ma tylko SELECT. Modyfikacje wykonuje się przez DML."},{id:"w08-06",q:"Czego NIE ma w SOQL w porównaniu z SQL?",a:["Dowolnego łączenia tabel za pomocą JOIN i symboli wieloznacznych *","Klauzuli WHERE","Klauzuli ORDER BY","Funkcji COUNT"],e:"W SOQL nie ma dowolnego JOIN, symboli wieloznacznych * ? ani zaawansowanych wyrażeń obliczeniowych."},{id:"w08-07",q:"Jak pobrać tylko standardowe pola obiektu Contact?",a:["SELECT FIELDS(STANDARD) FROM Contact","SELECT * FROM Contact","SELECT STANDARD FROM Contact","SELECT ALL FROM Contact"],e:"SELECT FIELDS(STANDARD) FROM Contact. Gwiazdka * nie jest dozwolona."},{id:"w08-08",q:"Jak pobrać imiona kontaktów oraz nazwy powiązanych kont (zapytanie od strony Child)?",a:["SELECT Contact.FirstName, Contact.Account.Name FROM Contact","SELECT FirstName, AccountId.Name FROM Contact JOIN Account","SELECT Name, (SELECT FirstName FROM Contacts) FROM Contact","SELECT FirstName FROM Contact, Account"],e:"Od strony obiektu podrzędnego używa się notacji kropkowej po nazwie relacji: Contact.Account.Name."},{id:"w08-09",q:"Jak pobrać nazwy kont i nazwiska powiązanych kontaktów (zapytanie od strony Parent)?",a:["SELECT Name, (SELECT LastName FROM Contacts) FROM Account","SELECT Name, Contact.LastName FROM Account","SELECT Name, (SELECT LastName FROM Contact) FROM Account","SELECT Account.Name JOIN Contact"],e:"Od strony Parent używa się podzapytania po nazwie relacji w liczbie mnogiej: Contacts."},{id:"w08-10",q:"Jak nazywa się lista rekordów podrzędnych w podzapytaniu od strony Parent (Account → Contact)?",a:["Contacts – nazwa obiektu Child w liczbie mnogiej","Contact","Contact__r","ContactList"],e:"Nazwa listy to nazwa obiektu Child w liczbie mnogiej, tutaj Contacts."},{id:"w08-11",q:"Jak w zapytaniu od strony Child odwołujemy się do obiektu Parent?",a:["Przez nazwę relacji (np. Account), a nie przez klucz (AccountId)","Przez klucz AccountId","Przez JOIN","Przez podzapytanie"],e:"Posługujemy się nazwą relacji (Account.Name), a nie kluczem (AccountId)."},{id:"w08-12",q:"Jaki sufiks mają relacje użytkownika używane w zapytaniach SOQL (np. Mother_of_Child)?",a:["__r","__c","__rel","s (liczba mnoga)"],e:"Obiekty użytkownika mają sufiks __c, relacje użytkownika __r, np. Mother_of_Child__r.FirstName__c."},{id:"w08-13",q:"Kto nadaje nazwę relacji niestandardowej (np. Mother_of_Child)?",a:["Programista","Salesforce automatycznie z nazwy obiektu","Administrator bazy w SQL","Nazwa jest zawsze równa nazwie obiektu Parent"],e:"Nazwa relacji jest nadawana przez programistę, a sufiks __r jest dodawany automatycznie."},{id:"w08-14",q:"Które zapytanie poprawnie pobiera córki, których nazwisko matki zaczyna się na 'C'?",a:["SELECT FirstName__c, Mother_of_Child__r.FirstName__c FROM Daughter__c WHERE Mother_of_Child__r.LastName__c LIKE 'C%'","SELECT FirstName__c FROM Daughter__c WHERE Mother_of_Child__c.LastName__c LIKE 'C*'","SELECT * FROM Daughter__c JOIN Mother__c WHERE LastName LIKE 'C%'","SELECT FirstName__c, Mother__c.FirstName__c FROM Daughter__c WHERE Mother__c.LastName__c = 'C%'"],e:"Przez relację odwołujemy się sufiksem __r. LIKE 'C%' działa jak w SQL, bez * i JOIN."},{id:"w08-15",q:"Jak użyć wartości zmiennej Apex w zapytaniu SOQL?",a:["Poprzedzając ją dwukropkiem, np. WHERE LastName = :nazwisko","Przez konkatenację: 'WHERE LastName = ' + nazwisko","Przez ${nazwisko}","Przez ?nazwisko"],e:"Dwukropek : pozwala wykorzystać zmienną Apex jako parametr zapytania (bind variable)."},{id:"w08-16",q:"Jaka jest korzyść z bind variables (:zmienna) w SOQL?",a:["To samo zapytanie może być wykonywane dla różnych wartości bez modyfikowania jego składni","Zapytanie wykonuje się asynchronicznie","Omijają limity SOQL","Pozwalają używać *"],e:"Dzięki dwukropkowi to samo zapytanie działa dla różnych wartości bez zmiany składni."},{id:"w08-17",q:"Do czego służy TYPEOF w SOQL?",a:["Do warunkowego wyboru pól w zależności od typu rekordu (obiekty polimorficzne)","Do rzutowania typów pól","Do sprawdzania typu danych kolumny","Do tworzenia nowych typów"],e:"TYPEOF warunkowo wybiera pola zależnie od typu rekordu, np. TYPEOF What WHEN Account THEN Name, Industry … END FROM Event."},{id:"w08-18",q:"Do czego służy USING SCOPE w SOQL?",a:["Ogranicza dane do określonego zakresu widoku","Określa transakcję","Ogranicza liczbę rekordów","Blokuje rekordy"],e:"USING SCOPE ogranicza dane do określonego zakresu widoku, np. USING SCOPE My_View."},{id:"w08-19",q:"Do czego służy WITH DATA CATEGORY?",a:["Do filtrowania artykułów Knowledge według kategorii danych","Do grupowania rekordów","Do sortowania wyników","Do filtrowania po typie rekordu"],e:"WITH DATA CATEGORY filtruje artykuły (obiekty Knowledge) według kategorii danych."},{id:"w08-20",q:"Co robi ROLLUP w klauzuli GROUP BY?",a:["Tworzy sumy częściowe i całkowite","Tworzy wszystkie możliwe kombinacje grupowań","Usuwa duplikaty","Sortuje grupy"],e:"ROLLUP to sumy częściowe i całkowite. CUBE to wszystkie możliwe kombinacje grupowań."},{id:"w08-21",q:"Co robi CUBE w klauzuli GROUP BY?",a:["Tworzy wszystkie możliwe kombinacje grupowań","Tworzy sumy częściowe i całkowite","Zwraca dane w formacie 3D","Grupuje po wszystkich polach"],e:"CUBE tworzy wszystkie możliwe kombinacje grupowań."},{id:"w08-22",q:"Do czego służy HAVING?",a:["Do filtrowania grup po agregacji, np. HAVING COUNT(Id) > 10","Do filtrowania rekordów przed grupowaniem","Do sortowania","Do paginacji"],e:"HAVING filtruje wyniki agregacji (grupy). WHERE filtruje rekordy przed grupowaniem."},{id:"w08-23",q:"Co oznacza ORDER BY CreatedDate DESC NULLS LAST?",a:["Sortowanie malejąco po dacie utworzenia, wartości null na końcu","Sortowanie rosnąco, null na początku","Pomija rekordy z null","Sortuje tylko ostatnie rekordy"],e:"DESC = malejąco, NULLS LAST = wartości puste na końcu."},{id:"w08-24",q:"Które klauzule służą do paginacji wyników SOQL?",a:["LIMIT i OFFSET","GROUP BY i HAVING","FOR VIEW i FOR REFERENCE","TYPEOF i USING SCOPE"],e:"Paginacja: OFFSET pomija określoną liczbę rekordów, LIMIT ogranicza liczbę rekordów."},{id:"w08-25",q:"Co robi klauzula OFFSET?",a:["Pomija określoną liczbę rekordów","Ogranicza liczbę zwracanych rekordów","Przesuwa strefę czasową","Blokuje rekordy"],e:"OFFSET pomija rekordy, LIMIT ogranicza ich liczbę."},{id:"w08-26",q:"Co robi klauzula FOR UPDATE?",a:["Blokuje rekordy do edycji w transakcji Apex, aby zapobiec konfliktom","Aktualizuje zwrócone rekordy","Aktualizuje statystyki przeglądania","Oznacza rekordy jako ostatnio używane"],e:"FOR UPDATE blokuje rekordy w transakcji, np. SELECT Id FROM Account WHERE Name = 'Acme' FOR UPDATE."},{id:"w08-27",q:"Czego dotyczą klauzule UPDATE TRACKING i UPDATE VIEWSTAT?",a:["Śledzenia rekordów (np. ostatnio użyte) i statystyk przeglądania","Blokowania rekordów","Aktualizacji wartości pól","Wersjonowania API"],e:"UPDATE TRACKING to śledzenie rekordów, UPDATE VIEWSTAT to statystyki przeglądania."},{id:"w08-28",q:"Co oznaczają FOR VIEW / FOR REFERENCE?",a:["Informację, że dane zostały wyświetlone lub użyte do odniesienia (wpływa na statystyki i współdzielenie)","Blokadę rekordów","Tryb tylko do odczytu","Pobranie danych z widoku listy"],e:"FOR VIEW i FOR REFERENCE informują, że dane zostały wyświetlone lub użyte, co może wpłynąć na statystyki i reguły współdzielenia."},{id:"w08-29",q:"Która funkcja NIE jest funkcją agregującą SOQL?",a:["MEDIAN()","COUNT_DISTINCT()","AVG()","SUM()"],e:"Funkcje agregujące: MIN, MAX, SUM, AVG, COUNT, COUNT_DISTINCT."},{id:"w08-30",q:"Jaki typ zwraca zapytanie z GROUP BY i funkcjami agregującymi (np. COUNT(Id))?",a:["List<AggregateResult>","List<Account>","Integer","Map<String, Integer>"],e:"Zapytania agregujące zwracają List<AggregateResult>, a wartości odczytuje się przez ar.get('alias')."},{id:"w08-31",q:"Jak odczytać wartość z AggregateResult?",a:["ar.get('totalAccounts')","ar.totalAccounts","ar['totalAccounts']","ar.getValue(1)"],e:"Wartości odczytuje się metodą get z nazwą pola/aliasu: ar.get('Industry'), ar.get('totalAccounts')."},{id:"w08-32",q:"Jaka jest maksymalna długość jednego zapytania SOQL?",a:["100 000 znaków","10 000 znaków","1 000 000 znaków","32 768 znaków"],e:"Długość jednego zapytania ≤ 100 000 znaków."},{id:"w08-33",q:"Ile maksymalnie pól można umieścić w SELECT?",a:["200","100","500","50"],e:"Liczba pól w SELECT ≤ 200."},{id:"w08-34",q:"Ile maksymalnie rekordów zwraca SOQL?",a:["50 000","10 000","100 000","2 000"],e:"Liczba zwracanych rekordów ≤ 50 000. (10 000 to limit rekordów DML.)"},{id:"w08-35",q:"Ile maksymalnie zapytań SOQL można wykonać w pojedynczej transakcji (wg slajdu ograniczeń)?",a:["100","150","200","50"],e:"Liczba zapytań w pojedynczej transakcji ≤ 100 (kontekst synchroniczny; asynchroniczny 200)."},{id:"w08-36",q:"Ile poziomów relacji w dół i w górę obsługuje SOQL wg wykładu?",a:["5 w dół i 1 w górę","1 w dół i 5 w górę","5 w obie strony","Bez ograniczeń"],e:"Dostęp do 5 relacji w dół i 1 w górę."},{id:"w08-37",q:"Które stwierdzenie o SOQL jest prawdziwe wg slajdu ograniczeń?",a:["Nie można agregować po podzapytaniu","Można używać wildcards (*)","Brak limitu zwracanych rekordów","Można stosować dowolny JOIN"],e:"Ograniczenia: brak wildcards, brak aliasów, nie można agregować po podzapytaniu."},{id:"w08-38",q:"Który łańcuch obiektów pokazano jako przykład zagnieżdżonych podzapytań na 4 poziomach?",a:["Account → Contact → Asset → WorkOrder → WorkOrderLineItem","Account → Opportunity → Quote → Order → Invoice","User → Role → Profile → Permission → Object","Lead → Contact → Account → Case → Task"],e:"Przykład: Account 1:N Contact 1:N Asset 1:N WorkOrder 1:N WorkOrderLineItem."},{id:"w08-39",q:"Jak brzmi podstawowa struktura zapytania SOQL?",a:["SELECT pola FROM obiekt WHERE warunki (opcjonalnie ORDER BY)","FROM obiekt SELECT pola","GET pola IN obiekt","QUERY obiekt FILTER warunki"],e:"SELECT one or more fields FROM an object WHERE filter statements, opcjonalnie z sortowaniem."},{id:"w08-40",q:"Która klauzula SOQL filtruje rekordy analogicznie do SQL?",a:["WHERE","WITH","USING","HAVING"],e:"WHERE filtruje rekordy analogicznie do SQL, np. WHERE Industry = 'Technology' AND AnnualRevenue > 1000000."}],dz={id:sz,title:lz,questions:cz},wz="w09",uz="W9 · Wyzwalacze (triggery) Apex",yz=[{id:"w09-01",q:"Czym jest trigger (wyzwalacz) Apex?",a:["Kodem Apex uruchamianym przez środowisko pod wpływem zdarzenia na obiektach (w bazie danych)","Przyciskiem w interfejsie użytkownika","Zapytaniem SOQL wykonywanym cyklicznie","Deklaratywną regułą walidacji"],e:"Trigger to kod Apex uruchamiany przez środowisko pod wpływem zdarzenia na obiektach w bazie danych."},{id:"w09-02",q:"Co dzieje się ze zmianami wykonanymi w triggerze w przypadku błędu?",a:["Wszystkie zmiany wykonane w obrębie triggera są wycofywane","Zmiany są zachowywane","Wycofywany jest tylko ostatni rekord","Zmiany trafiają do Recycle Bin"],e:"Przy błędzie wszystkie zmiany wykonane w obrębie triggera są wycofywane."},{id:"w09-03",q:"Jaka jest poprawna składnia definicji triggera?",a:["trigger TriggerName on ObjectName (trigger_events) { … }","trigger ObjectName for TriggerName { … }","on ObjectName trigger TriggerName (events) { … }","public trigger TriggerName extends ObjectName { … }"],e:"Składnia: trigger TriggerName on ObjectName (trigger_events) { //code_block }."},{id:"w09-04",q:"Co robi acc.addError('…') w triggerze?",a:["Zatrzymuje zapis danego rekordu i wyświetla komunikat użytkownikowi","Zapisuje błąd w logu, ale rekord jest zapisywany","Usuwa rekord","Rzuca DmlException, którego nie można obsłużyć"],e:"addError() zatrzymuje zapis danego rekordu i wyświetla komunikat użytkownikowi."},{id:"w09-05",q:"Czym jest Trigger.new?",a:["Kolekcją (List<SObject>) nowych wersji rekordów, na których działa trigger","Mapą starych rekordów","Liczbą rekordów","Flagą operacji insert"],e:"Trigger.new: List<SObject>, czyli nowe wersje rekordów."},{id:"w09-06",q:"Jaki typ ma Trigger.newMap?",a:["Map<Id, SObject>","List<SObject>","Set<Id>","Map<String, Object>"],e:"Trigger.newMap i Trigger.oldMap to Map<Id, SObject>, czyli mapowanie rekordów po Id."},{id:"w09-07",q:"Co zwraca Trigger.size?",a:["Liczbę rekordów w triggerze (Integer)","Rozmiar triggera w bajtach","Liczbę zdarzeń obsługiwanych przez trigger","Liczbę pól obiektu"],e:"Trigger.size: Integer, czyli liczba rekordów w triggerze."},{id:"w09-08",q:"W którym zdarzeniu można modyfikować dane rekordu przed zapisem (bez dodatkowego DML)?",a:["before insert / before update","after insert","after update","after delete"],e:"W before insert i before update można modyfikować dane przed zapisem. W after update dane są już zapisane i nie można zmieniać pól."},{id:"w09-09",q:"Do czego typowo używa się zdarzenia before delete?",a:["Do zablokowania usunięcia, np. przez addError()","Do przywracania rekordu","Do nadawania Id","Do modyfikacji pól przed wstawieniem"],e:"before delete: przed usunięciem, można zablokować usunięcie przez addError()."},{id:"w09-10",q:"Dlaczego after insert stosuje się do tworzenia powiązanych rekordów?",a:["Bo rekord ma już Id, którego można użyć w rekordach powiązanych","Bo w after insert można zmieniać pola rekordu","Bo after insert nie ma limitów","Bo before insert nie widzi Trigger.new"],e:"after insert: rekord ma już Id, używane np. do tworzenia powiązanych rekordów."},{id:"w09-11",q:"Co jest prawdą o after update?",a:["Dane są już zapisane w bazie; nie można zmieniać pól (rekordów z Trigger.new)","Można dowolnie modyfikować Trigger.new","Trigger.old jest niedostępne","Rekord nie ma jeszcze Id"],e:"after update: dane są już zapisane, nie można zmieniać pól."},{id:"w09-12",q:"Która kolekcja jest dostępna w after delete?",a:["Tylko Trigger.old","Tylko Trigger.new","Obie","Żadna"],e:"after delete: dane są już usunięte, dostępne tylko Trigger.old."},{id:"w09-13",q:"Kiedy uruchamia się after undelete?",a:["Po przywróceniu rekordu z kosza","Po trwałym usunięciu rekordu","Przed usunięciem","Po scaleniu rekordów"],e:"after undelete: po przywróceniu rekordu z kosza, używane rzadko (np. do ponownego powiązania danych)."},{id:"w09-14",q:"Czy Trigger.old jest dostępne w before insert?",a:["Nie","Tak","Tylko dla obiektów Custom","Tylko w trybie bulk"],e:"before insert: Trigger.new ✅, Trigger.old ❌, bo nie ma starej wersji nowego rekordu."},{id:"w09-15",q:"W których zdarzeniach dostępne są zarówno Trigger.new, jak i Trigger.old?",a:["before update i after update","before insert i after insert","before delete i after delete","after undelete"],e:"Obie kolekcje są dostępne tylko przy update (before i after)."},{id:"w09-16",q:"Czy Trigger.new jest dostępne w before delete?",a:["Nie, dostępne jest tylko Trigger.old","Tak","Tak, ale jest puste","Tylko w after delete"],e:"before delete: Trigger.new ❌, Trigger.old ✅."},{id:"w09-17",q:"Która kolekcja jest dostępna w after undelete?",a:["Trigger.new","Trigger.old","Obie","Żadna"],e:"after undelete: Trigger.new ✅, Trigger.old ❌."},{id:"w09-18",q:"W jakiej klasie zawarte są zmienne kontekstowe triggera?",a:["System.Trigger","Database.Trigger","Apex.Context","Schema.Trigger"],e:"Zmienne kontekstowe zawarte są w klasie System.Trigger."},{id:"w09-19",q:"Do czego służą zmienne kontekstowe triggera?",a:["Pozwalają sprawdzić kontekst DML, przetwarzane rekordy i czy to before/after, co umożliwia pisanie uniwersalnych triggerów","Do przechowywania danych między transakcjami","Do definiowania pól obiektu","Do konfiguracji uprawnień"],e:"Zmienne kontekstowe pozwalają sprawdzić operację, rekordy, before/after i dodatkowe informacje, co umożliwia uniwersalne triggery."},{id:"w09-20",q:"Która flaga mówi, że trigger działa przed zapisaniem danych?",a:["Trigger.isBefore","Trigger.isInsert","Trigger.isExecuting","Trigger.isAfter"],e:"Trigger.isBefore: przed zapisem. Trigger.isAfter: po zapisie."},{id:"w09-21",q:"Co oznacza flaga Trigger.isExecuting?",a:["Że to trigger wywołał bieżący kod","Że trigger jest w trakcie insert","Że trigger jest wyłączony","Że trigger działa asynchronicznie"],e:"Trigger.isExecuting: czy trigger wywołał ten kod."},{id:"w09-22",q:"Która flaga oznacza, że trigger działa po przywróceniu rekordu z kosza?",a:["Trigger.isUndelete","Trigger.isDelete","Trigger.isRestore","Trigger.isAfter"],e:"Trigger.isUndelete: działa po przywróceniu rekordu z kosza."},{id:"w09-23",q:"Jakiego typu są flagi kontekstowe (isInsert, isBefore…)?",a:["Boolean","Integer","String","Enum"],e:"Wszystkie flagi kontekstowe są typu Boolean."},{id:"w09-24",q:"Trigger ma ustawić Title = 'Nie określono' w nowych kontaktach bez tytułu. Jakie zdarzenie wybrać?",a:["before insert","after insert","before delete","after update"],e:"Modyfikacja pól przed zapisem nowego rekordu to before insert: wystarczy przypisać wartość w Trigger.new, bez DML."},{id:"w09-25",q:"Jak sprawdzić, że pole tekstowe jest puste lub zawiera tylko spacje?",a:["String.isBlank(con.Title)","con.Title == ''","con.Title.isEmpty()","String.isNull(con.Title)"],e:"String.isBlank() zwraca true dla null, pustego i białych znaków. Używane w przykładach z wykładu."},{id:"w09-26",q:"Jak dodać błąd przypisany do konkretnego pola (a nie całego rekordu)?",a:["acc.Name.addError('…')","acc.addFieldError('Name', '…')","Trigger.addError(acc.Name)","throw new FieldException('Name')"],e:"acc.Name.addError('…') przypisuje błąd do pola Name. acc.addError('…') przypisuje go do całego rekordu."},{id:"w09-27",q:"Jaki warunek sprawdza trigger dla Opportunity z wykładu (before update)?",a:["Czy otwarta szansa (IsClosed == false) ma CloseDate w przeszłości","Czy kwota przekracza 1 mld","Czy brak nazwy","Czy Type = 'Customer'"],e:"Jeśli szansa nie jest zamknięta, a CloseDate < Date.today(), to opp.CloseDate.addError(…)."},{id:"w09-28",q:"Jak w triggerze before insert na Lead znormalizować e-mail do małych liter?",a:["leadRecord.Email = leadRecord.Email.trim().toLowerCase();","update leadRecord.Email.toLowerCase();","insert leadRecord.Email.lower();","Trigger.new.Email = lower(Email);"],e:"W before insert wystarczy przypisać wartość: Email = Email.trim().toLowerCase(). Nie potrzeba DML."},{id:"w09-29",q:"Trigger after insert na Account tworzy zadania (Task). Jaki jest poprawny wzorzec?",a:["Zebrać Taski w liście w pętli i wykonać jeden insert po pętli","Wykonać insert Task wewnątrz pętli dla każdego konta","Zmodyfikować Trigger.new, dodając Taski","Użyć before insert, bo konto nie ma jeszcze Id"],e: w DOM (izolacja) i ES6 Modules."},{id:"w10-03",q:"Która technologia zapewnia izolację stylów i logiki komponentu LWC?",a:["Shadow DOM","ES6 Modules","HTML Templates","Locker Service"],e:"Shadow DOM zapewnia izolację stylów i logiki."},{id:"w10-04",q:"Jak wygląda znacznik własnego komponentu LWC w HTML (Custom Element)?",a:["<c-my-component>","<lwc:myComponent>","<myComponent/>","<c:myComponent>"],e:"Custom Elements to własne znaczniki HTML, np. <c-my-component> (camelCase zamieniany na kebab-case z prefiksem c-)."},{id:"w10-05",q:"W jakim katalogu projektu tworzy się komponenty LWC?",a:["force-app/main/default/lwc","src/components","force-app/main/default/classes","force-app/lwc/components"],e:"Komponenty tworzy się w force-app/main/default/lwc/<nazwaKomponentu>/."},{id:"w10-06",q:"Skąd pochodzi nazwa komponentu LWC?",a:["Z nazwy katalogu i plików","Z atrybutu name w pliku .js","Z nazwy klasy Apex","Z pliku package.json"],e:"Nazwa katalogu i plików to nazwa komponentu."},{id:"w10-07",q:"Który plik LWC zawiera metadane komponentu?",a:[".js-meta.xml",".html",".css",".svg"],e:".html to szablon, .js to logika, .js-meta.xml to metadane, .css to styl (opcjonalny), .svg to ikona (opcjonalna)."},{id:"w10-08",q:"Które pliki komponentu LWC są opcjonalne?",a:[".css i .svg",".html i .js",".js-meta.xml i .css",".js i .svg"],e:"Styl (.css) i ikona (.svg) są opcjonalne."},{id:"w10-09",q:"Jakim poleceniem instaluje się komponent w Org-u (VS Code)?",a:["SFDX: Deploy This Source To Org","npm publish","git push origin org","SFDX: Retrieve Source from Org"],e:"Zainstalowanie komponentu: SFDX: Deploy This Source To Org."},{id:"w10-10",q:"Za co odpowiada plik .html komponentu LWC?",a:["Definiuje strukturę (layout) i elementy UI; używa dyrektyw jak for:each, lwc:if","Zawiera logikę biznesową i obsługę zdarzeń","Określa, gdzie komponent może być używany","Definiuje ikonę komponentu"],e:"Szablon .html definiuje strukturę i elementy UI. Używa HTML, Lightning Base Components i dyrektyw (for:e ji działa Roll-Up Summary?",a:["Tylko Master-Detail","Tylko Lookup","Master-Detail i Lookup","External Lookup"],e:"Mechanizm działa tylko dla relacji Master-Detail."},{id:"w14-14",q:"Jakie operacje oferuje Roll-Up Summary?",a:["COUNT, SUM, MIN, MAX","COUNT, SUM, AVG, MEDIAN","SUM, AVG","COUNT_DISTINCT, AVG"],e:"Dostępne operacje: COUNT, SUM, MIN, MAX. AVG nie ma na liście!"},{id:"w14-15",q:"Który mechanizm wybrać, by w Room__c automatycznie zliczać powiązane rezerwacje Event__c?",a:["Roll-Up Summary (COUNT) – Number_of_Events__c","Formula Field","Validation Rule","Duplicate Rule"],e:"Przykład: Room__c.Number_of_Events__c zlicza powiązane rezerwacje Event__c (Roll-Up Summary)."},{id:"w14-16",q:"Z jakich elementów korzysta Duplicate Management?",a:["Matching Rules (kryterium tożsamości) i Duplicate Rules (sposób reakcji)","Validation Rules i Formula Fields","Triggers i Flows","Unique i Required"],e:"Matching Rules to kryterium tożsamości, Duplicate Rules to sposób reakcji."},{id:"w14-17",q:"Co określają Matching Rules?",a:["Kryterium tożsamości (kiedy rekordy uznać za duplikaty)","Sposób reakcji na duplikat","Warunek zapisu rekordu","Formułę wyliczania"],e:"Matching Rules określają kryterium tożsamości. Duplicate Rules określają reakcję."},{id:"w14-18",q:"Które działanie NIE jest dostępną reakcją Duplicate Rules?",a:["Automatyczne scalenie rekordów","Zablokowanie utworzenia duplikatu","Wyświetlenie ostrzeżenia","Dopuszczenie zapisu i zarejestrowanie zdarzenia"],e:"Możliwe działania: blokada, ostrzeżenie, dopuszczenie zapisu z rejestracją zdarzenia."},{id:"w14-19",q:"Gdzie konfiguruje się zarządzanie duplikatami?",a:["Setup → Data → Duplicate Management","Setup → Object Manager → Validation Rules","Setup → Object Manager → Fields & Relationships","Developer Console"],e:"Setup → Data → Duplicate Management."},{id:"w14-20",q:"Który mechanizm wybrać, by system nie pozwalał na dwóch klientów o tym samym NIP?",a:["Duplicate Rules (wykrywanie duplikatów)","Roll-Up Summary","
