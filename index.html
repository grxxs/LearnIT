],e:"Picklist Choice Set udostępnia wartości picklisty z pola, np. statusy rezerwacji."},{id:"w15-53",q:"Który zasób tworzy opcje wyboru na podstawie rekordów modelu danych?",a:["Record Choice Set","Picklist Choice Set","Record Collection","Choice"],e:"Record Choice Set to opcje z rekordów, np. wybór pokoju z istniejących pomieszczeń."},{id:"w15-54",q:"Która zmienna globalna zawiera dane rekordu, który wyzwolił Record-Triggered Flow?",a:["$Record","$Record__Prior","$Flow","$User"],e:"$Record to rekord wyzwalający. $Record__Prior to wartości sprzed aktualizacji."},{id:"w15-55",q:"Co zawiera $Record__Prior?",a:["Wartości rekordu sprzed aktualizacji","Poprzedni Flow","Rekord nadrzędny","Poprzedniego użytkownika"],e:"$Record__Prior zawiera wartości rekordu sprzed aktualizacji."},{id:"w15-56",q:"Która zmienna globalna daje dostęp do etykiet niestandardowych (Custom Labels)?",a:["$Label","$System","$Organization","$Permission"],e:"$Label daje dostęp do Custom Labels."},{id:"w15-57",q:"Co zawiera zmienna globalna $Flow?",a:["Informacje o aktualnie wykonywanym przepływie, np. data uruchomienia, komunikat błędu","Listę wszystkich Flow w Org-u","Dane zalogowanego użytkownika","Dane organizacji"],e:"$Flow zawiera informacje o bieżącym przepływie: data uruchomienia, czas wykonania, komunikat błędu."},{id:"w15-58",q:"Która stała globalna reprezentuje pusty ciąg znaków?",a:["$GlobalConstant.EmptyString","$GlobalConstant.Null","$GlobalConstant.False","$System.Empty"],e:"Stałe globalne: True, False, EmptyString, Null."},{id:"w15-59",q:"Jaki zasób automatycznie udostępnia element Loop?",a:["Bieżący rekord przetwarzany w iteracji","Wybraną ścieżkę (Outcome)","Wartości z formularza","Kolekcję pobranych rekordów"],e:"Loop udostępnia bieżący rekord. Decision udostępnia Outcome, Screen wartości z formularza, a Get Records Record lub Record Collection."},{id:"w15-60",q:"Czy zmienne globalne Flow można zwykle modyfikować?",a:["Zasadniczo są tylko do odczytu; niektóre, np. $Flow.CurrentStage, można modyfikować","Tak, wszystkie","Nie, żadnej nie można ani odczytać","Tylko w Debug"],e:"Zmienne globalne są zasadniczo tylko do odczytu. Niektóre, np. $Flow.CurrentStage, można modyfikować w określony sposób."},{id:"w15-61",q:"Czym różni się Save od Activate w Flow Builder?",a:["Save zapisuje Flow (nie można go uruchomić), Activate uaktywnia go (można uruchomić)","To samo","Activate zapisuje, Save uruchamia","Save uruchamia w trybie debug"],e:"Save zapisuje Flow, ale nie można go uruchomić. Activate go uaktywnia. Run uruchamia, Debug uruchamia w trybie debugowania."},{id:"w15-62",q:"Gdzie NIE wymieniono możliwości osadzenia/uruchomienia Flow?",a:["W triggerze SQL bazy danych","Lightning Record Page","Quick Action","List View"],e:"Flow uruchomisz na Record Page, App Page, przez Quick Action, przyciski i linki, w Experience Cloud, Utility Bar, List View i Navigation Tab."},{id:"w15-63",q:"Czego NIE należy umieszczać wewnątrz elementu Loop wg dobrych praktyk?",a:["Get/Create/Update/Delete Records","Assignment","Decision","Zmiennych"],e:"Nie umieszczaj operacji na danych w pętli. Gromadź dane w kolekcjach i wykonuj operacje zbiorczo poza pętlą."},{id:"w15-64",q:"Jak należy wydzielać powtarzalną logikę we Flow?",a:["Do Autolaunched Flow wywoływanego przez Subflow","Kopiować do każdego Flow","Do Screen Flow","Do Schedule-Triggered Flow"],e:"Powtarzalną logikę wydzielaj do Autolaunched Flow i wywołuj przez Subflow."},{id:"w15-65",q:"Które narzędzie służy do analizy kolejności uruchamiania Record-Triggered Flow dla obiektu?",a:["Flow Trigger Explorer","Developer Console","Schema Builder","Debug Log"],e:"Flow Trigger Explorer analizuje i zarządza kolejnością uruchamiania przepływów."},{id:"w15-66",q:"Jak obsługiwać błędy we Flow wg dobrych praktyk?",a:["Definiować Fault Paths, pokazywać zrozumiałe komunikaty i rejestrować błędy","Ignorować błędy","Zawsze przerywać Flow bez komunikatu","Przekazywać błędy do Apex"],e:"Fault Paths, kontrola danych, walidacja wejścia, zrozumiałe komunikaty, rejestrowanie błędów i powiadomienia administratora."},{id:"w15-67",q:"Jak postępować z aktywną wersją Flow przy zmianach?",a:["Tworzyć nowe wersje zamiast modyfikować bezpośrednio aktywną wersję","Modyfikować aktywną wersję na produkcji","Usuwać starą i tworzyć od nowa","Wyłączyć kontrolę wersji"],e:"Kontrola wersji: twórz nowe wersje Flow zamiast modyfikować aktywną wersję. Testuj w Sandboxie."},{id:"w15-68",q:"Kiedy preferować Flow, a kiedy Apex?",a:["Flow dla standardowych procesów i operacji na rekordach; Apex przy złożonej logice lub precyzyjnej kontroli","Zawsze Apex","Zawsze Flow, nawet kosztem bardzo skomplikowanych konstrukcji","Flow tylko dla UI"],e:"Flow dla standardowych procesów. Apex dla złożonej logiki. Nie buduj rozbudowanego Flow tylko po to, by uniknąć kilku linijek kodu."},{id:"w15-69",q:"Co pozwala łączyć możliwości Flow z kodem Apex?",a:["Invocable Apex","Trigger Apex","Anonymous Apex","Batch Apex"],e:"Invocable Apex łączy Flow z Apex, gdy standardowe możliwości Flow są niewystarczające."},{id:"w15-70",q:"Który przykład nazwy technicznej jest zgodny z dobrymi praktykami?",a:["Create_Room_Flow, varRoomName, Get_Available_Rooms","flow1, x, temp","MÓJ FLOW!!!, zmienna 1","a_b_c, Flow-New"],e:"Czytelne nazwy API: Create_Room_Flow, varRoomName, Get_Available_Rooms."},{id:"w15-71",q:"Co oznacza dobra praktyka 'mechanizm pomijania' (bypass)?",a:["Przewidywanie możliwości czasowego wyłączenia wybranych automatyzacji","Omijanie limitów Governor","Pomijanie walidacji danych","Omijanie uprawnień użytkownika"],e:"Mechanizm pomijania (bypass) to możliwość czasowego wyłączenia wybranych automatyzacji."},{id:"w15-72",q:"Który zasób przechowuje kolekcję rekordów modelu danych?",a:["Record Collection","Record","Collection Choice Set","Variable"],e:"Record to pojedynczy rekord, Record Collection to kolekcja rekordów (np. lista dostępnych pokoi)."}],xz={id:Iz,title:Rz,questions:Oz},Wz="net",Bz="Architektura i programowanie w .NET",Kz=".NET",Fz="C#, platforma .NET, ASP.NET Core MVC i Razor Pages, DI, EF Core, Web API, Identity. Test podchwytliwy!",_z=["w01","w02","w03","w04","w05"],Jz={id:Wz,name:Bz,short:Kz,description:Fz,lectures:_z},Uz="w01",Hz="W1 · C# i platforma .NET",Vz=[{id:"w01-01",q:"W jakiej formie odbywa się zaliczenie przedmiotu wg pierwszego wykładu?",a:["Podchwytliwy test jednokrotnego wyboru","Projekt zaliczeniowy","Egzamin ustny","Test wielokrotnego wyboru z punktami ujemnymi"],e:"Slajd 'Metody oraz kryteria oceny': zaliczenie w postaci podchwytliwego testu jednokrotnego wyboru. Wykładowca uprzedza też o możliwych intencjonalnych „kłamstwach”.",w:["Projektu nie ma – wykładowca zapowiedział test.","Nie ustny – pisemny test jednokrotnego wyboru.","Jednokrotnego, nie wielokrotnego wyboru; o punktach ujemnych nie było mowy."]},{id:"w01-02",q:"Z czego składa się platforma .NET wg wykładu?",a:["CLR, BCL, kompilatory (Roslyn), JIT (RyuJIT), MSBuild, frameworki i narzędzia (np. NuGet)","JVM, JDK i Maven","Tylko z kompilatora C#","CLR i Visual Studio"],e:".NET to „umbrella term”: CLR (runtime), BCL, kompilatory (Roslyn), JIT (RyuJIT), system budowania (MSBuild), frameworki (ASP.NET, ML.NET, WPF) i narzędzia (NuGet).",w:["JVM, JDK i Maven to ekosystem Javy – .NET jest jedynie jego odpowiednikiem.","Kompilator to tylko jeden z wielu składników.","Visual Studio to IDE, nie część platformy; brakuje BCL, JIT, MSBuild."]},{id:"w01-03",q:"Co oznacza skrót CLR?",a:["Common Language Runtime","Common Library Repository","Compiled Language Runtime","Core Language Resolver"],e:"CLR = Common Language Runtime, czyli środowisko uruchomieniowe .NET (odpowiednik JVM).",w:["„Repository” – nie; L oznacza Language.","„Compiled” – nie; to Common Language Runtime.","Takiego rozwinięcia nie ma."]},{id:"w01-04",q:"Jak nazywa się kompilator JIT platformy .NET?",a:["RyuJIT","Roslyn","MSBuild","HotSpot"],e:"RyuJIT to kompilator JIT. Roslyn to kompilator C# do kodu pośredniego, MSBuild to system budowania, HotSpot to JVM Javy.",w:["Roslyn kompiluje C# do IL, a nie JIT-uje do kodu maszynowego.","MSBuild to system budowania.","HotSpot to JIT w JVM (Java)."]},{id:"w01-05",q:"Czym jest Roslyn?",a:["Kompilatorem (C#/VB) platformy .NET","Kompilatorem JIT","Menedżerem pakietów","Środowiskiem uruchomieniowym"],e:"Roslyn to kompilatory platformy. JIT to RyuJIT, pakiety obsługuje NuGet, runtime to CLR.",w:["JIT to RyuJIT.","Menedżer pakietów to NuGet.","Środowisko uruchomieniowe to CLR."]},{id:"w01-06",q:"Do jakiej postaci kompilowany jest kod C#?",a:["Do kodu pośredniego MSIL/CIL, który przy starcie jest kompilowany JIT","Bezpośrednio do kodu maszynowego zawsze","Do bajtkodu JVM","Do JavaScriptu"],e:"Kod jest kompilowany do MSIL/CIL (assembly, zwykle DLL), a przy starcie aplikacji kompiluje go JIT. Do uruchomienia niezbędny jest CLR.",w:["Bezpośrednio do natywnego kodu tylko w AOT – domyślnie przez IL + JIT.","Bajtkod JVM to Java, nie .NET.","C# nie jest kompilowany do JavaScriptu – w przeglądarce .NET działa przez WebAssembly."]},{id:"w01-07",q:"Jakie rozszerzenie mają najczęściej pliki assembly .NET?",a:[".dll",".jar",".so",".class"],e:"Kod jest kompilowany do assembly, najczęściej plików DLL.",w:[".jar to archiwa Javy.",".so to biblioteki natywne Linuksa.",".class to skompilowane klasy Javy."]},{id:"w01-08",q:"Czym jest self-contained deployment?",a:["Dostarczeniem CLR razem z aplikacją (także jako pojedynczy plik wykonywalny)","Wdrożeniem aplikacji wyłącznie na IIS","Kompilacją do WebAssembly","Wdrożeniem bez plików DLL"],e:"CLR może być dostarczony razem z aplikacją (self-contained). Wykładowca uważa to podejście za wskazane.",w:["IIS to sposób hostowania, nie rodzaj wdrożenia CLR.","WebAssembly dotyczy Blazora, nie self-contained.","Pliki DLL nadal są – CLR jest po prostu dołączony."]},{id:"w01-09",q:"Od której wersji .NET kompilacja AOT rozwija się coraz bardziej wg wykładu?",a:[".NET 8",".NET 5",".NET Core 3.1",".NET Framework 4.8"],e:"AOT (ahead-of-time) rozwija się coraz bardziej od .NET 8. Wcześniej istniały m.in. .NET Native (UWP) i IL2CPP (Unity).",w:[".NET 5 to „połączenie” Framework/Core, nie przełom w AOT.",".NET Core 3.1 to koniec linii Core.",".NET Framework nie wspiera nowoczesnego AOT."]},{id:"w01-10",q:"Która implementacja .NET działa tylko na Windows i osiągnęła wersję 4.8.1?",a:[".NET Framework",".NET Core",".NET 5","Mono"],e:".NET Framework jest tylko dla Windows (4.8.1). .NET Core jest wieloplatformowy (do 3.1), a .NET 5 to „połączenie”.",w:[".NET Core jest wieloplatformowy i skończył się na 3.1.",".NET 5 jest wieloplatformowy.","Mono to alternatywna, wieloplatformowa implementacja."]},{id:"w01-11",q:"Do jakiej wersji dotarł .NET Core, zanim zastąpił go .NET 5?",a:["3.1","4.8.1","2.2","4.0"],e:".NET Core osiągnął wersję 3.1. Potem przyszło .NET 5.0 jako „połączenie”, bez numeru 4, żeby nie mylić z .NET Framework 4.x.",w:["4.8.1 to ostatni .NET Framework.","2.2 to wcześniejsza wersja Core.","4.0 to wersja .NET Framework – Core nie miał 4.x (dlatego skok na 5)."]},{id:"w01-12",q:"Które wersje .NET mają wsparcie LTS (long-term support)?",a:["Parzyste","Nieparzyste","Wszystkie","Tylko wersje z końcówką .1"],e:"Parzyste to LTS, nieparzyste to STS (short-term support). Aktualna jest .NET 10 (LTS).",w:["Odwrotnie – nieparzyste to STS.","Nie – STS ma krótsze wsparcie.","O LTS nie decyduje końcówka .1."]},{id:"w01-13",q:"Jaka jest aktualna wersja .NET i C# wg wykładu (2026)?",a:[".NET 10 i C# 14",".NET 9 i C# 13",".NET 8 i C# 12",".NET 11 i C# 15"],e:"Slajd '.NET w roku 2026': .NET 10.0, C# 14.0, .NET Standard 2.1, .NET Framework 4.8.1.",w:["To para z 2024 roku.","To para z 2023 roku.","Takie wersje jeszcze nie istnieją."]},{id:"w01-14",q:"Kto jest twórcą języka C#?",a:["Anders Hejlsberg (autor Delphi i TypeScript)","James Gosling","Bjarne Stroustrup","Guido van Rossum"],e:"Anders Hejlsberg, autor również Delphi oraz TypeScript.",w:["Gosling stworzył Javę.","Stroustrup stworzył C++.","Van Rossum stworzył Pythona."]},{id:"w01-15",q:"Kiedy ukazała się pierwsza publiczna wersja C#?",a:["W styczniu 2002 (język powstał w 2000)","W 1995","W 2005","W 2010"],e:"C# powstał w 2000 roku, ale pierwsza publiczna wersja pojawiła się w styczniu 2002.",w:["1995 to rok Javy.","2005 to C# 2.0.","2010 to C# 4.0."]},{id:"w01-16",q:"Jakim językiem jest C# wg wykładu?",a:["Wieloparadygmatowym o silnej kontroli typów: głównie obiektowym, ze zdarzeniami i elementami funkcyjnymi","Czysto funkcyjnym","Dynamicznie typowanym skryptowym","Proceduralnym bez klas"],e:"C# jest wieloparadygmatowy, silnie typowany, głównie obiektowy, ze zintegrowanym programowaniem zdarzeniowym i dodatkami funkcyjnymi. Ma GC i jest memory safe.",w:["Ma elementy funkcyjne, ale jest głównie obiektowy.","C# jest silnie i statycznie typowany (dynamic to wyjątek).","Klasy są podstawą C#."]},{id:"w01-17",q:"W której wersji C# pojawiły się LINQ, wyrażenia lambda i metody rozszerzające?",a:["3.0","2.0","5.0","7.0"],e:"C# 3.0 (2007): LINQ, lokalna inferencja typów (var), typy anonimowe, lambdy, metody rozszerzające, automatyczne właściwości.",w:["2.0 wprowadził generyki i metody anonimowe – lambdy dopiero w 3.0.","5.0 to async/await.","7.0 to krotki i pattern matching."]},{id:"w01-18",q:"W której wersji C# pojawiły się typy generyczne?",a:["2.0","3.0","1.0","4.0"],e:"C# 2.0 (2005): klasy statyczne, typy generyczne, metody anonimowe.",w:["3.0 to LINQ i lambdy.","1.0 nie miał generyków.","4.0 to dynamic i wariancja generyków."]},{id:"w01-19",q:"W której wersji C# wprowadzono async/await?",a:["5.0","4.0","6.0","7.0"],e:"C# 5.0 (2012): async/await. W 4.0 był typ dynamic, w 6.0 nameof i interpolacja.",w:["4.0 to dynamic.","6.0 to nameof i interpolacja.","7.0 to krotki; Task<T> z async to rozszerzenie, nie początek."]},{id:"w01-20",q:"W której wersji C# pojawił się typ dynamic?",a:["4.0","3.0","5.0","2.0"],e:"C# 4.0 (2010): dynamic, generyczna ko- i kontrawariancja, argumenty opcjonalne.",w:["3.0 to LINQ.","5.0 to async/await.","2.0 to generyki."]},{id:"w01-21",q: # 8."]},{id:"w01-27",q:"Co wprowadził C# 14 (2025)?",a:["Extension members i słowo kluczowe field","Rekordy","Partial properties","Collection expressions"],e:"C# 14: extension members, słowo kluczowe field, niejawne konwersje dla Span<T>. Partial properties i indeksatory to C# 13.",w:["Rekordy to C# 9.","Partial properties to C# 13.","Collection expressions to C# 12."]},{id:"w01-28",q:"Co robią top-level statements (C# 9+)?",a:["Automatycznie generują klasę Program i metodę Main(), ograniczając „ceremonię”","Wymuszają statyczne klasy","Pozwalają pisać kod poza assembly","Usuwają potrzebę CLR"],e:"Top-level statements generują klasę Program i Main(). Spotkasz je w Minimal APIs i punktach wejścia dużych aplikacji.",w:["Nie wymuszają klas statycznych.","Kod nadal trafia do assembly.","CLR jest zawsze potrzebny."]},{id:"w01-29",q:"Co jest prawdą o typach wartościowych w C# (np. int)?",a:["Są przekazywane przez wartość, ale nadal są obiektami – dziedziczą po System.ValueType","Nie są obiektami, jak prymitywy w Javie","Są przekazywane przez referencję","Zawsze są przechowywane na stercie"],e:"Typy wartościowe są przekazywane przez wartość, ale to nadal obiekty, bo dziedziczą po System.ValueType.",w:["Pułapka z Javy: w C# int to obiekt (System.Int32 : ValueType).","Typy wartościowe są kopiowane, nie przekazywane przez referencję (chyba że ref).","Zwykle na stosie (lokalne) – nie zawsze na stercie."]},{id:"w01-30",q:"Czym jest struct w C#?",a:["Złożoną strukturą podobną do klasy, ale typem wartościowym (na stosie)","Typem referencyjnym jak klasa","Aliasem dla record","Typem wskaźnikowym"],e:"struct jest podobny do klasy, ale jest typem wartościowym przechowywanym na stosie.",w:["struct jest typem wartościowym, nie referencyjnym.","record to osobny typ (a record struct to jeszcze coś innego).","Wskaźniki to osobna kategoria (unsafe)."]},{id:"w01-31",q:"Jaki zakres ma typ byte w C#?",a:["0 do 255","–128 do 127","–32 768 do 32 767","0 do 65 535"],e:"byte: 0..255 (bez znaku). s ajduje się pełny layout aplikacji Razor Pages?",a:["Pages/Shared/_Layout.cshtml","Views/Shared/_Layout.cshtml","wwwroot/_Layout.cshtml","Pages/_Layout.cs"],e:"W Razor Pages layout jest w Pages/Shared/_Layout.cshtml, a w MVC w Views/Shared/.",w:["Views/Shared to MVC.","wwwroot to statyczne pliki.","Layout to .cshtml, nie .cs."]},{id:"w03-11",q:"Jak strona .cshtml odwołuje się do publicznych właściwości code-behind?",a:["Przez obiekt Model (np. Model.People)","Przez ViewBag","Przez this.Page","Przez @inject"],e:"Typowa konwencja to publiczne właściwości w PageModel, do których strona odwołuje się przez Model.",w:["ViewBag to inna droga (MVC).","Nie ma this.Page.","@inject wstrzykuje serwisy."]},{id:"w03-12",q:'Strona ma @page "{id:int}" i OnGet(int id = 0). Co oznacza {id:int}?',a:["Segment routingu id z ograniczeniem do liczby całkowitej","Query string ?id=","Pole formularza","Nagłówek HTTP"],e:"Dyrektywą @page można sterować routingiem i definiować zmienne trafiające do OnGet(). :int to ograniczenie typu.",w:["Query string to ?id=.","To nie pole formularza.","To nie nagłówek."]},{id:"w03-13",q:"Kod Index2: OnGet(int id = 0) { Current = People.FirstOrDefault(x => x.Id == id); }. Co jest w Current, gdy nie ma osoby o danym id?",a:["null","Pierwsza osoba z listy","Wyjątek InvalidOperationException","Nowy obiekt Person"],e:"FirstOrDefault zwraca wartość domyślną (null dla klas), gdy brak dopasowania. First() rzuciłby wyjątek.",w:["FirstOrDefault nie zwraca pierwszego elementu przy braku dopasowania.","Wyjątek rzuciłby First().","Nie tworzy nowego obiektu."]},{id:"w03-14",q:"Jak wygenerować w Razor Pages link do strony Index z parametrem id=2?",a:['<a asp-page="Index" asp-route-id="2">','<a asp-action="Index" id="2">','<a href="@Index(2)">','<a asp-controller="Index" asp-id="2">'],e:"Tag helpers: asp-page oraz asp-route-{parametr}.",w:["asp-action to MVC.","@Index(2) to zła składnia.","asp-controller to MVC."]},{id:"w03-15",q:"Do czego służy [BindProperty] na właściwości iedziczenie to coś innego.","To nie SQL injection.","JIT to kompilacja."]},{id:"w03-20",q:"Gdzie rejestruje się typy dla mechanizmu DI w ASP.NET Core?",a:["W Program.cs (builder.Services)","W appsettings.json","W _ViewImports.cshtml","W pliku .csproj"],e:"Typy rejestruje się w Program.cs, a potem w konstruktorze podaje się typ do wstrzyknięcia.",w:["appsettings to konfiguracja wartości.","_ViewImports to widoki.",".csproj to zależności NuGet, nie DI."]},{id:"w03-21",q:"Gdzie najczęściej deklaruje się zależność do wstrzyknięcia w kontrolerze lub PageModel?",a:["W konstruktorze","W metodzie OnGet jako zmienną lokalną z new","W atrybucie klasy","W pliku .cshtml.cs jako statyczne pole"],e:"W konstruktorze kontrolera, modelu strony lub usługi podaje się typ, który ma zostać wstrzyknięty.",w:["new w metodzie łamie ideę DI.","Atrybut [Inject] to Blazor, nie kontrolery.","Statyczne pole to nie DI."]},{id:"w03-22",q:"Czym charakteryzują się obiekty zarejestrowane jako Transient?",a:["Są tworzone od nowa przy każdym wstrzyknięciu","Są wspólne dla jednego żądania HTTP","Są tworzone raz na cały cykl życia aplikacji","Są tworzone raz na sesję użytkownika"],e:"Transient tworzy nowy obiekt przy każdym wstrzyknięciu, Scoped jeden na żądanie HTTP, Singleton jeden na aplikację.",w:["Wspólne w żądaniu to Scoped.","Raz na aplikację to Singleton.","Sesji użytkownika DI nie zna."]},{id:"w03-23",q:"Czym charakteryzują się obiekty zarejestrowane jako Scoped?",a:["Są takie same w obrębie pojedynczego żądania HTTP","Są zawsze różne","Są tworzone raz na aplikację","Są tworzone raz na wątek"],e:"Scoped to te same obiekty dla pojedynczego żądania HTTP.",w:["Zawsze różne to Transient.","Raz na aplikację to Singleton.","Na wątek – nie ma takiego cyklu."]},{id:"w03-24",q:"Czym charakteryzują się obiekty zarejestrowane jako Singleton?",a:["Są tworzone tylko raz podczas całego cyklu życia aplikacji","Są tworzone na każde żądanie","Są tworzone przy każdym wstrzyknięciu","Są tworzone raz na użytkownik >()","Nie można go wstrzykiwać"],e:"ILogger jest wstrzykiwany przez DI, a jego konfiguracja w Program.cs jest niejawna.",w:["Nie ma AddLogger<T>.","Nie trzeba – logowanie jest domyślnie skonfigurowane.","Można go wstrzykiwać."]},{id:"w03-29",q:"Jak wygląda wstrzyknięcie loggera z użyciem primary constructor (C# 12)?",a:["public class DiPrimaryModel(ILogger<DiPrimaryModel> logger) : PageModel { … logger.LogInformation(…) }","public class DiPrimaryModel : PageModel(ILogger logger)","[Inject] ILogger logger;","public DiPrimaryModel() => logger = new Logger();"],e:"Primary constructor: parametr w nagłówku klasy jest dostępny w całej klasie, bez jawnego pola.",w:["Parametr idzie w nagłówku klasy, nie przy klasie bazowej.","[Inject] to Blazor.","new Logger() to nie DI."]},{id:"w03-30",q:"Czym jest builder.Services.AddRazorPages()?",a:["Metodą rozszerzającą rejestrującą biblioteki Razor Pages","Wbudowaną metodą klasy WebApplication","Middleware obsługującym routing","Metodą generującą strony"],e:"Builder może posiadać metody rozszerzające (np. AddRazorPages()) dodawane przez zaimportowane biblioteki.",w:["To metoda rozszerzająca, a nie wbudowana.","To nie middleware.","Niczego nie generuje."]},{id:"w03-31",q:"Która linia mapuje strony Razor Pages w potoku aplikacji?",a:["app.MapRazorPages();","builder.Services.AddRazorPages();","app.UseRouting();","app.MapControllerRoute(...);"],e:"AddRazorPages() rejestruje serwisy (DI), a app.MapRazorPages() mapuje endpointy stron.",w:["To rejestracja w DI, nie mapowanie.","UseRouting to middleware routingu.","MapControllerRoute to MVC."]},{id:"w03-32",q:"Co oznacza skrót ORM?",a:["Object-Relational Mapping – mapowanie encji/relacji bazy na obiekty","Object Resource Manager","Online Relational Model","Ordered Record Mapping"],e:"ORM mapuje encje i relacje bazodanowe na obiekty języka obiektowego.",w:["To nie menedżer zasobów.","Nie Online, tylko Object.","Nie Ordered Record."]},{id:"w03-33",q:"Który ORM to „oficjalna” (1st party) bibliot
