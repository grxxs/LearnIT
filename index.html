formaty binarne/graficzne.","Stare formaty Office były binarne.","To proste formaty tekstowe."],e:"Formaty oparte na XML to ODT, ODS i ODP (od 2005) oraz DOCX, XLSX i PPTX (od 2007)."},{id:"w03-04",s:"a",q:"Czym różni się walidacja w XML i HTML?",a:["XML – rygorystyczna, HTML – luźna","XML – luźna, HTML – rygorystyczna","Obie są luźne","Obie są rygorystyczne"],w:["Odwrotnie.","XML jest rygorystyczny.","HTML jest luźny."],e:"XML: rygorystyczna walidacja, własne przestrzenie nazw, język danych. HTML: luźna, predefiniowane znaczniki, język stron."},{id:"w03-05",s:"a",q:"Czym był XHTML (2000 r.)?",a:["Próbą ujednolicenia HTML z narzuceniem ścisłej składni (XML)","Nową wersją XML","Formatem konfiguracji","Następcą JSON"],w:["To nie wersja XML.","To nie format konfiguracji.","Nie ma związku z JSON."],e:"XHTML – próba ujednolicenia HTML z narzuceniem ścisłej składni."},{id:"w03-06",s:"a",q:"Która alternatywa dla XML jest typowa przy przesyłaniu danych (np. web API)?",a:["JSON","YAML","TOML","SVG"],w:["YAML – typowo konfiguracja.","TOML – typowo konfiguracja.","SVG to język oparty na XML."],e:"Do zapisu i przesyłania danych typowy jest JSON. Do definiowania konfiguracji używa się YAML i TOML."},{id:"w03-07",s:"a",q:"Który z języków jest oparty na XML?",a:["SVG","JSON","YAML","Markdown"],w:["JSON nie jest XML.","YAML nie jest XML.","Markdown nie jest XML."],e:"Oparte na XML: SVG, RSS, GPX, MathML, CML, DocBook."},{id:"w03-08",s:"a",q:"Do czego służy format GPX oparty na XML?",a:["Do danych GPS","Do grafiki wektorowej","Do wzorów matematycznych","Do danych chemicznych"],w:["Grafika wektorowa to SVG.","Wzory to MathML.","Chemia to CML."],e:"GPX to format oparty na XML, służący do zapisu danych GPS."},{id:"w03-09",s:"b",q:"Jakie jest domyślne kodowanie dokumentu XML?",a:["UTF-8","UTF-16","ISO-8859-2","ASCII"],w:["UTF-16 jest dozwolone, ale nie domyślne.","Nie jest domyślne.","Nie jest domyślne."],e:"Domyślne kodowanie dokumentu XML to UTF-8. Możliwe jest też UTF-16."},{id:"w03-10",s:"b",q:"Ile elementów głównych (root) może mieć poprawny dokument XML?",a:["Dokładnie jeden","Dowolnie wiele","Zero lub jeden","Dwa: head i body"],w:["Jeden root jest wymagany.","Root jest obowiązkowy.","To struktura HTML."],e:"Dokument XML zawsze posiada root element; reszta tworzy drzewo."},{id:"w03-11",s:"b",q:"Czy standard XML narzuca nazwy elementów?",a:["Nie","Tak – jak HTML","Tak, tylko dla root","Tak, przez deklarację <?xml?>"],w:["W HTML znaczniki są zdefiniowane, w XML nie.","Root też może się nazywać dowolnie.","Deklaracja określa wersję i kodowanie."],e:"Standard XML nie narzuca nazw elementów – definiuje je np. schemat XSD."},{id:"w03-12",s:"c",q:"Do czego służy plik XSD (XML Schema)?",a:["Do definiowania struktury i typów elementów dokumentu XML","Do stylowania XML","Do kompresji XML","Do przesyłania XML przez sieć"],w:["Stylowanie to XSLT/CSS.","Nie kompresuje.","Nie służy do transmisji."],e:"Schemat definiuje nazwy elementów, typy (xs:string, xs:double), kolejność (xs:sequence) i krotności (minOccurs)."},{id:"w03-13",s:"c",q:'Co oznacza w XSD minOccurs="0" przy elemencie comment?',a:["Element jest opcjonalny","Element jest wymagany","Element musi być pusty","Element może wystąpić dokładnie 0 razy"],w:["Wymagany oznacza minOccurs ≥ 1 (domyślnie 1).","Nie dotyczy zawartości.","maxOccurs domyślnie 1 – może wystąpić."],e:'minOccurs="0" oznacza, że element jest opcjonalny.'},{id:"w03-14",s:"f",q:"Co oznacza Marshalling w kontekście XML w Javie?",a:["Konwersję obiektu Java do XML","Konwersję XML do obiektu Java","Walidację XML","Parsowanie zdarzeniowe"],w:["To Unmarshalling.","Walidacja to Validator.","To StAX/SAX."],e:"Marshalling to konwersja obiektu Javy do XML (robi to Marshaller). Konwersję odwrotną, z XML na obiekt, robi Unmarshaller."},{id:"w03-15",s:"d",q:"Który parser JDK ładuje cały dokument XML do pamięci jako drzewo?",a:["DOM","StAX","SAX","JAXB"],w:["StAX przetwarza strumieniowo.","SAX przetwarza zdarzeniowo, bez drzewa.","JAXB to mapowanie na obiekty (biblioteka zewnętrzna)."],e:"DOM – cały dokument jako drzewo węzłów (Document)."},{id:"w03-16",s:"d",q:"Która biblioteka NIE jest częścią JDK wg wykładu?",a:["JAXB","DOM","SAX","StAX"],w:["DOM jest w JDK.","SAX jest w JDK.","StAX jest w JDK."],e:"JDK: DOM, SAX, StAX. Zewnętrzne: JAXB, Simple XML, Jackson XML Module."},{id:"w03-17",s:"d",q:"Która klasa w DOM wczytuje plik XML i zwraca obiekt Document?",a:["DocumentBuilder","DocumentBuilderFactory","Transformer","XMLStreamReader"],w:["Factory tworzy parser (DocumentBuilder).","Transformer zapisuje dokument do pliku.","To StAX."],e:"Wczytanie pliku w DOM wygląda tak: DocumentBuilderFactory tworzy DocumentBuilder (newDocumentBuilder()), a jego metoda parse(file) zwraca obiekt Document."},{id:"w03-18",s:"d",q:"Do czego służy Transformer (javax.xml.transform) w DOM?",a:["Do zapisu dokumentu XML do pliku","Do parsowania XML","Do walidacji XSD","Do mapowania na obiekty"],w:["Parsowanie to DocumentBuilder.","Walidacja to Validator.","Mapowanie to JAXB."],e:"Transformer umożliwia zapis dokumentu XML do pliku; tworzy go TransformerFactory."},{id:"w03-19",s:"d",q:"Jak w DOM pobrać tekst pierwszego elementu <unit>?",a:['root.getElementsByTagName("unit").item(0).getTextContent()',"root.getUnit()",'root.get("unit").text',"doc.unit.value"],w:["DOM nie generuje getterów dla elementów.","Nie ma metody get(String).","To nie JavaScript."],e:"getElementsByTagName zwraca NodeList; item(0) – pierwszy węzeł; getTextContent – tekst."},{id:"w03-20",s:"e",q:"Jaka jest główna cecha parsera StAX?",a:["Nie ładuje całego pliku – przetwarza strumieniowo, reagując na zdarzenia","Ładuje cały dokument do drzewa","Mapuje XML na obiekty adnotacjami","Wymaga schematu XSD"],w:["To DOM.","To JAXB.","Schemat nie jest wymagany."],e:"StAX (javax.xml.stream) – strumieniowo, zdarzenia: start dokumentu/elementu, znaki, koniec elementu…"},{id:"w03-21",s:"e",q:"Która klasa StAX odczytuje zdarzenia XML w strumieniu?",a:["XMLStreamReader","XMLStreamWriter","XMLOutputFactory","DocumentBuilder"],w:["Writer zapisuje.","OutputFactory tworzy generator.","DocumentBuilder to DOM."],e:"XMLInputFactory tworzy XMLStreamReader (createXMLStreamReader), a jego metoda next() zwraca typ kolejnego zdarzenia."},{id:"w03-22",s:"e",q:"Które zdarzenie StAX oznacza tekst między znacznikami?",a:["CHARACTERS","START_ELEMENT","CDATA","SPACE"],w:["START_ELEMENT to znacznik otwierający.","CDATA to sekcja nieinterpretowana.","SPACE to białe znaki."],e:"CHARACTERS – zawartość tekstowa między znacznikami."},{id:"w03-23",s:"e",q:"Co oznacza zdarzenie CDATA?",a:["Sekcję nieinterpretowaną przez parser","Komentarz XML","Odwołanie do encji","Instrukcję przetwarzania"],w:["Komentarz to COMMENT.","Encja to ENTITY_REFERENCE.","To PROCESSING_INSTRUCTION."],e:"CDATA – sekcja, której zawartość nie jest interpretowana jako znaczniki."},{id:"w03-24",s:"e",q:"W przykładzie StAX: dlaczego zapamiętywana jest zmienna currentElement przy START_ELEMENT?",a:["Bo zdarzenie CHARACTERS nie zawiera nazwy elementu – trzeba wiedzieć, do którego należy tekst","Bo StAX tego wymaga do zamknięcia pliku","Bo inaczej reader.next() nie działa","Dla walidacji XSD"],w:["Zamknięcie robi reader.close().","next() działa niezależnie.","To nie walidacja."],e:"Parser strumieniowy nie ma drzewa – kontekst (bieżący element) trzeba śledzić samemu."},{id:"w03-25",s:"f",q:"W jakim pakiecie są JAXBContext, Marshaller, Unmarshaller (nowsze wersje)?",a:["jakarta.xml.bind","javax.xml.parsers","javax.xml.stream","org.w3c.dom"],w:["To DOM (parsery).","To StAX.","To model DOM."],e:"JAXB (JAXBContext, Marshaller, Unmarshaller) znajduje się w nowszych wersjach w pakiecie jakarta.xml.bind."},{id:"w03-26",s:"f",q:"Która adnotacja JAXB oznacza klasę będącą głównym elementem XML?",a:["@XmlRootElement","@XmlElement","@XmlAttribute","@XmlType"],w:["@XmlElement – pole ⇄ element.","@XmlAttribute – pole ⇄ atrybut.","@XmlType – kolejność elementów."],e:'Klasę będącą głównym elementem XML oznacza się adnotacją @XmlRootElement, np. @XmlRootElement(name = "observation").'},{id:"w03-27",s:"f",q:"Która adnotacja JAXB mapuje pole na atrybut XML (a nie element)?",a:["@XmlAttribute","@XmlElement","@XmlRootElement","@XmlType"],w:["@XmlElement mapuje na element.","Root to klasa.","@XmlType – kolejność."],e:"Adnotacja @XmlAttribute mapuje pole klasy na atrybut XML, a nie na element."},{id:"w03-28",s:"f",q:"Czego wymaga JAXB od klasy mapowanej (Observation)?",a:["Konstruktora bezparametrowego","Implementacji Serializable","Metody toXml()","Publicznych pól"],w:["Serializable nie jest wymagane.","Nie ma takiej metody.","Pola mogą być prywatne (adnotowane)."],e:"public Observation() { } – konstruktor bezparametrowy wymagany przez JAXB."},{id:"w03-29",s:"f",q:"Co daje adnotowanie getterów/setterów zamiast pól w JAXB?",a:["JAXB wywołuje gettery/settery – można dodać w nich logikę (np. kodowanie)","Szybsze działanie","Brak potrzeby konstruktora","Pominięcie mapowania"],w:["Nie chodzi o wydajność.","Konstruktor nadal wymagany.","Mapowanie nadal działa."],e:"Wówczas uruchamiane są gettery i settery – można dodać do nich dodatkową logikę."},{id:"w03-30",s:"f",q:"Jak odczytać obiekt z pliku XML przez JAXB?",a:["JAXBContext.newInstance(Observation.class).createUnmarshaller().unmarshal(file)","new Observation(file)","Marshaller.marshal(file)","DocumentBuilder.parse(file) zwraca Observation"],w:["Konstruktor nie czyta XML.","Marshaller zapisuje obiekt do XML.","DOM zwraca Document, nie obiekt domeny."],e:"Obiekt odczytuje się przez Unmarshaller: unmarshal(file) zwraca Object, więc trzeba go rzutować na typ Observation."},{id:"w03-31",s:"c",q:"Jaki wyjątek w przykładzie walidacji XSD oznacza, że plik NIE jest zgodny ze schematem?",a:["SAXException","IOException","JAXBException","NullPointerException"],w:["IOException to błąd odczytu pliku.","JAXB nie jest używany w walidacji.","To nie wynik walidacji."],e:"validator.validate(...) rzuca SAXException przy niezgodności; IOException obsługiwany osobno (separacja wyjątków)."},{id:"w03-32",s:"c",q:"W jakim pakiecie są Schema, SchemaFactory i Validator?",a:["javax.xml.validation","javax.xml.parsers","jakarta.xml.bind","javax.xml.stream"],w:["To parsery DOM.","To JAXB.","To StAX."],e:"Klasy Schema, SchemaFactory i Validator znajdują się w pakiecie javax.xml.validation."},{id:"w03-33",s:"b",q:"Jak określa się element w XML względem pozycji w drzewie (np. bez dzieci)?",a:["leaf (liść)","root zawsze","sibling","parent"],w:["Root to element główny.","Sibling to rodzeństwo.","Parent ma dzieci."],e:"Elementy: parent, child, sibling, leaf, empty."}],ny={id:ey,title:ay,sections:iy,questions:oy},ty="w04",ry="W4 · Aplikacje sieciowe – TCP/IP",sy=[{id:"a",title:"Klasy sieciowe w java.net",text:"Pakiet **java.net** zawiera klasy niskiego poziomu do klasycznych aplikacji klient-serwer (TCP, UDP, HTTP, DNS, URL):\n• `Socket` i `ServerSocket` – połączenia TCP,\n• `DatagramSocket` i `DatagramPacket` – UDP (w NIO `DatagramChannel`),\n• `MulticastSocket` – komunikacja multicastowa,\n• `InetAddress` i `InetSocketAddress` – adresy IP i porty,\n• `NetworkInterface` – informacje o interfejsach sieciowych lokalnej maszyny.\n\nInne pakiety: `javax.net.ssl` (`SSLSocketFactory` – gniazda klienckie SSL/TLS, `SSLServerSocketFactory` – serwery SSL/TLS), `java.net.http` (`HttpClient` obsługujący HTTP/2 i 1.1, `HttpRequest`, `HttpResponse`, klient WebSocket) oraz `javax.websocket` (serwer WebSocket, działa w serwerach aplikacji, np. Tomcat)."},{id:"b",title:"Java NIO",text:"**java.nio** nie jest pakietem sieciowym, ale służy do wydajnego, nieblokującego wejścia i wyjścia i jest podstawą wydajnych serwerów. Podpakiet `java.nio.charset` odpowiada za konwersje znaków i bajtów.\n\nElementy NIO:\n• **Channel** (kanał) – dwukierunkowy odpowiednik strumienia, może działać nieblokująco,\n• **Selector** – obsługuje wiele kanałów jednym wątkiem (multiplexing); `SelectionKey` łączy kanał z selektorem,\n• `ServerSocketChannel` – serwer TCP, `SocketChannel` – klient TCP (może działać blokująco lub nieblokująco),\n• `FileChannel` – przesyłanie dużych plików (`transferTo`, `transferFrom`),\n• **Pipe** – komunikacja lokalna między wątkami,\n• **ByteBuffer** – bufor danych dla kanałów (klasa bazowa `Buffer` ma pozycję, limit i pojemność). Bufor 1-bajtowy: `ByteBuffer.allocate(1)`. Po odczycie wywołuje się `flip()`, żeby przełączyć bufor z zapisu na odczyt (limit = pozycja, pozycja = 0), a `clear()` przygotowuje go do ponownego zapisu."},{id:"c",title:"Gniazda i przykładowe serwery",text:"**Gniazdo** (socket) zawiera lokalny i zdalny adres IP i port, strumienie danych, konfigurację (bufory, timeouty) i stan połączenia. Port `ServerSocket` ustala programista, a gniazdo klienckie dostaje port automatycznie od systemu z zakresu 1024–65535. `new ServerSocket(12345)` już nasłuchuje, a `accept()` akceptuje połączenie i zwraca gniazdo `Socket` dla klienta.\n\nPrzykład `SimpleDoubleServer`: `InputStream.read()` zwraca `int`, więc przypisanie do `byte` wymaga rzutowania `(byte)`. W listingu jest pułapka: `response = (byte)(2 * number)`, ale potem `out.write(2 * response)`, więc dla wysłanego 7 serwer odpowie 28. W wersji NIO (`NioDoubleServer`) odpowiedź to 14. Kanał serwera wiąże z portem `serverChannel.bind(new InetSocketAddress(12345))`."},{id:"d",title:"Stany połączenia TCP",text:`• **LISTEN** – tylko serwer oczekujący na połączenia,
• **SYN_SENT** – tylko klient: wysłał żądanie i czeka na akceptację,
• **SYN_RECEIVED** – serwer wysłał akceptację,
• **FIN_WAIT_1** – jednostronne żądanie zakończenia połączenia,
• **CLOSING** – obie strony wysłały żądanie zakończenia.`}],ly=[{id:"w04-01",s:"a",q:"Który pakiet zawiera klasy niskiego poziomu do TCP, UDP, HTTP, DNS, URL?",a:["java.net","java.net.http","javax.net.ssl","java.nio.file"],w:["java.net.http to wyższy poziom – HttpClient.","javax.net.ssl to SSL/TLS i fabryki gniazd.","java.nio.file to obsługa plików."],e:"java.net – niski poziom; klasyczne aplikacje klient-serwer."},{id:"w04-02",s:"a",q:"Które klasy służą do połączeń TCP klient-serwer w java.net?",a:["Socket i ServerSocket","DatagramSocket i DatagramPacket","URL i URLConnection","InetAddress i URI"],w:["To UDP.","To zasoby sieciowe (HTTP, FTP).","To adresy i identyfikatory."],e:"Socket/ServerSocket – TCP; DatagramSocket/DatagramPacket – UDP."},{id:"w04-03",s:"a",q:"Które klasy służą do komunikacji UDP?",a:["DatagramSocket i DatagramPacket","Socket i ServerSocket","HttpClient i HttpRequest","SocketChannel"],w:["To TCP.","To HTTP.","SocketChannel to TCP (NIO); UDP w NIO to DatagramChannel."],e:"UDP – DatagramSocket, DatagramPacket (NIO: DatagramChannel)."},{id:"w04-04",s:"a",q:"Do czego służy MulticastSocket?",a:["Do komunikacji multicastowej","Do wielu połączeń TCP","Do SSL","Do HTTP/2"],w:["Wiele połączeń TCP to Selector/wątki.","SSL to SSLSocketFactory.","HTTP/2 to HttpClient."],e:"MulticastSocket – wsparcie dla komunikacji multicastowej."},{id:"w04-05",s:"a",q:"Które klasy reprezentują adresy IP i porty?",a:["InetAddress i InetSocketAddress","URL i URI","NetworkInterface","Proxy"],w:["URL/URI to identyfikatory zasobów.","NetworkInterface to interfejsy sieciowe maszyny.","Proxy to serwery pośredniczące."],e:"InetAddress, InetSocketAddress – adresy IP i porty."},{id:"w04-06",s:"a",q:"Która fabryka tworzy bezpieczne gniazda klienckie SSL/TLS?",a:["SSLSocketFactory","SocketFactory","ServerSocketFactory","SSLServerSocketFactory"],w:["SocketFactory tworzy zwykłe gniazda TCP.","To fabryka gniazd serwera (bez SSL).","To fabryka serwerów SSL, nie klientów."],e:"javax.net.ssl: SSLSocketFactory – gniazda SSL/TLS; SSLServerSocketFactory – serwery SSL/TLS."},{id:"w04-07",s:"a",q:"Który pakiet zawiera HttpClient obsługujący HTTP/2?",a:["java.net.http","java.net","javax.websocket","java.nio"],w:["java.net ma HttpURLConnection (starsze).","To serwer WebSocket.","NIO to I/O nieblokujące."],e:"java.net.http: HttpClient (HTTP/2 i 1.1), HttpRequest, HttpResponse, WebSocket (klient)."},{id:"w04-08",s:"a",q:"Gdzie działa serwer z pakietu javax.websocket?",a:["W serwerach aplikacji (np. Tomcat)","W przeglądarce","W każdym zwykłym programie bez kontenera","Tylko na Androidzie"],w:["Przeglądarka to klient.","Wymaga kontenera/serwera.","Nie tylko Android."],e:"javax.websocket – serwer WebSocket, działa w serwerach aplikacji, np. Tomcat."},{id:"w04-09",s:"b",q:"Do czego służy java.nio wg wykładu?",a:["Do wydajnego, nieblokującego wejścia/wyjścia (podstawa wydajnych serwerów)","Do obsługi XML","Do grafiki","Do HTTP/2"],w:["XML to javax.xml.","Grafika to inne pakiety.","HTTP/2 to java.net.http."],e:"Nie jest to pakiet sieciowy, ale jest używany w komunikacji – nieblokujące I/O."},{id:"w04-10",s:"b",q:"Który podpakiet NIO dotyczy konwersji znaków i bajtów?",a:["java.nio.charset","java.nio.channels","java.nio.file","java.nio"],w:["channels – nieblokujące I/O.","file – pliki i katalogi.","java.nio – bufory, kanały."],e:"java.nio.charset – konwersje znaków i bajtów."},{id:"w04-11",s:"b",q:"Czym jest kanał (Channel) w NIO?",a:["Dwukierunkowym odpowiednikiem strumienia, działającym w trybie nieblokującym","Jednokierunkowym strumieniem jak InputStream","Wątkiem sieciowym","Buforem danych"],w:["Strumienie są jednokierunkowe, kanały dwukierunkowe.","To nie wątek.","Bufor to ByteBuffer."],e:"Kanał – dwukierunkowy odpowiednik strumienia; w jednym wątku może być wiele kanałów (Selector)."},{id:"w04-12",s:"b",q:"Co umożliwia Selector?",a:["Obsługę wielu kanałów sieciowych jednym wątkiem (multiplexing)","Wybór najszybszego serwera","Szyfrowanie kanału","Wybór portu"],w:["Nie wybiera serwerów.","Szyfrowanie to SSL.","Port wskazuje bind()."],e:"Selector – multiplexing; SelectionKey – związek kanału z selektorem."},{id:"w04-13",s:"b",q:"Który kanał NIO nasłuchuje połączeń TCP (odpowiednik ServerSocket)?",a:["ServerSocketChannel","SocketChannel","DatagramChannel","FileChannel"],w:["To klient TCP.","To UDP.","To pliki."],e:"ServerSocketChannel – serwer TCP; SocketChannel – klient TCP."},{id:"w04-14",s:"b",q:"Do czego służy Pipe w NIO?",a:["Do komunikacji lokalnej między wątkami","Do UDP","Do przesyłania plików przez sieć","Do HTTP"],w:["UDP to DatagramChannel.","To FileChannel (transferTo/transferFrom).","HTTP to HttpClient."],e:"Pipe służy do komunikacji lokalnej między wątkami."},{id:"w04-15",s:"b",q:"Jaka klasa jest podstawowym buforem danych dla kanałów sieciowych?",a:["ByteBuffer","StringBuilder","BufferedReader","byte[] bez opakowania"],w:["To nie bufor NIO.","To java.io.","Kanały pracują na Bufferach."],e:"ByteBuffer przechowuje dane odczytywane/zapisywane przez kanały; Buffer – klasa bazowa (pozycja, limit, pojemność)."},{id:"w04-16",s:"b",q:"Po co wywołuje się buffer.flip() po odczycie z kanału do bufora?",a:["Aby przełączyć bufor z trybu zapisu do trybu odczytu (limit = pozycja, pozycja = 0)","Aby wyczyścić bufor","Aby odwrócić kolejność bajtów","Aby zamknąć kanał"],w:["Czyszczenie to clear().","Nie odwraca bajtów.","Kanał zamyka close()."],e:"flip() – przełączenie bufora; clear() – przygotowanie do ponownego zapisu."},{id:"w04-17",s:"c",q:"Jaki port otrzymuje gniazdo połączeniowe (Socket) po stronie klienta?",a:["Nadawany automatycznie przez system z zakresu 1024–65535","Taki sam jak port nasłuchujący serwera","Zawsze 80","Nadany przez programistę"],w:["Port serwera nadaje programista; port efemeryczny jest inny.","80 to HTTP.","Port nasłuchujący ustala programista, nie gniazdo połączeniowe."],e:"ServerSocket – port nadany przez programistę; Socket – port nadawany automatycznie przez OS (1024–65535)."},{id:"w04-18",s:"c",q:"Co robi server.accept() na ServerSocket?",a:["Akceptuje połączenie i zwraca gniazdo połączeniowe (Socket) dla klienta","Otwiera port do nasłuchu","Wysyła dane do klienta","Zamyka serwer"],w:["Nasłuch zaczyna już konstruktor ServerSocket(port).","Do wysyłania służy OutputStream.","Zamyka close()."],e:"new ServerSocket(12345) – już nasłuchuje; accept() – zgoda na połączenie i przyjęcie klienta."},{id:"w04-19",s:"d",q:"W jakim stanie TCP jest wyłącznie serwer oczekujący na połączenia?",a:["LISTEN","SYN_SENT","ESTABLISHED","CLOSED"],w:["SYN_SENT – tylko klient czekający na akceptację.","ESTABLISHED – połączenie nawiązane.","CLOSED – przed i po połączeniu."],e:"W stanie LISTEN jest wyłącznie serwer. Stan SYN_SENT występuje tylko u klienta."},{id:"w04-20",s:"d",q:"Co oznacza stan SYN_SENT?",a:["Klient wysłał żądanie i czeka na akceptację","Serwer wysłał akceptację","Połączenie jest nawiązane","Obie strony zamykają połączenie"],w:["To SYN_RECEIVED.","To ESTABLISHED.","To CLOSING."],e:"SYN_SENT to stan klienta, który wysłał żądanie i czeka na akceptację. SYN_RECEIVED oznacza, że serwer wysłał akceptację."},{id:"w04-21",s:"d",q:"Co oznacza stan CLOSING?",a:["Obie strony wysłały żądanie zakończenia","Jednostronne żądanie zakończenia","Połączenie przed nawiązaniem","Serwer nasłuchuje"],w:["To FIN_WAIT_1.","To CLOSED.","To LISTEN."],e:"Stan CLOSING oznacza, że obie strony wysłały żądanie zakończenia połączenia. FIN_WAIT_1 oznacza żądanie wysłane tylko przez jedną stronę."},{id:"w04-22",s:"c",q:"Klasa SimpleDoubleServer: byte number = in.read(); Co jest nie tak z tą linią?",a:["read() zwraca int – bez rzutowania (byte) to błąd kompilacji","read() zwraca String","read() nie istnieje w InputStream","Nic – działa poprawnie"],w:["read() zwraca int (0–255 lub -1).","Metoda istnieje.","int → byte wymaga jawnego rzutowania."],e:"InputStream.read() zwraca int; przypisanie do byte wymaga (byte). Uważnie czytaj listingi!"},{id:"w04-23",s:"c",q:"SimpleDoubleServer: response = (byte)(2 * number); out.write(2 * response); Klient wysłał 7. Jaką wartość wyśle serwer (zakładając, że kod się kompiluje)?",a:["28","14","7","49"],w:["14 to response – ale wysyłane jest 2 * response.","Wartość jest podwajana dwukrotnie.","To mnożenie przez 2, nie kwadrat."],e:"Pułapka w listingu: response = 14, a write(2 * response) = 28 (w opisie miało być podwojenie)."},{id:"w04-24",s:"c",q:"Wersja NIO (NioDoubleServer) dla wysłanej wartości 7 – co zwróci serwer?",a:["14","28","7","0"],w:["NIO podwaja raz: put(response).","Wysyła wynik, nie wejście.","Bufor zawiera wynik."],e:"Serwer oblicza response = (byte)(number * 2), czyli 14, wkłada wynik do bufora (buffer.put) i zapisuje go do kanału."},{id:"w04-25",s:"c",q:"Jak serwer NIO wiąże kanał z portem?",a:["serverChannel.bind(new InetSocketAddress(12345))","new ServerSocketChannel(12345)","serverChannel.listen(12345)","serverChannel.port = 12345"],w:["Kanał tworzy ServerSocketChannel.open(), nie konstruktor.","Nie ma listen().","Nie ma takiego pola."],e:"Kanał serwera otwiera się przez ServerSocketChannel.open(), a z portem wiąże metodą bind(new InetSocketAddress(12345))."},{id:"w04-26",s:"b",q:"Jak alokuje się bufor 1-bajtowy w NIO?",a:["ByteBuffer.allocate(1)","new ByteBuffer(1)","ByteBuffer.of(1)","Buffer.create(1)"],w:["Konstruktor nie jest publiczny.","Nie ma of().","Nie ma create()."],e:"Bufor jednobajtowy alokuje się przez ByteBuffer.allocate(1)."},{id:"w04-27",s:"c",q:"Co zawiera gniazdo (socket) wg wykładu?",a:["Lokalny i zdalny adres IP i port, strumienie danych, konfigurację i stan połączenia","Tylko adres IP serwera","Tylko numer portu","Treść żądania HTTP"],w:["Także port, strumienie, stan.","Także adresy.","To nie poziom HTTP."],e:"Gniazdo: lokalny/zdalny IP i port, Input/OutputStream, konfiguracja (bufory, timeouty), stan."},{id:"w04-28",s:"a",q:"Do czego służy NetworkInterface?",a:["Do informacji o interfejsach sieciowych lokalnej maszyny","Do tworzenia połączeń TCP","Do obsługi proxy","Do DNS"],w:["TCP to Socket.","Proxy to Proxy/Authenticator.","DNS obsługuje InetAddress."],e:"NetworkInterface – informacje o interfejsach sieciowych lokalnej maszyny."},{id:"w04-29",s:"b",q:"Który kanał umożliwia przesyłanie dużych plików z mapowaniem pamięci (transferTo/transferFrom)?",a:["FileChannel","SocketChannel","Pipe","DatagramChannel"],w:["SocketChannel to TCP.","Pipe to komunikacja między wątkami.","DatagramChannel to UDP."],e:"FileChannel – przesyłanie plików (transferTo, transferFrom)."},{id:"w04-30",s:"b",q:"Czy SocketChannel może działać w trybie blokującym?",a:["Tak – w trybie blokującym lub nieblokującym","Nie, tylko nieblokującym","Nie, tylko blokującym","Tylko z Selectorem"],w:["Może też blokować.","Może też nie blokować.","Selector jest opcjonalny."],e:"SocketChannel umożliwia komunikację TCP w trybie blokującym lub nieblokującym."}],cy={id:ty,title:ry,sections:sy,questions:ly},dy="w05",wy="W5 · Hibernate i JPA",uy=[{id:"a",title:"Mapowanie, JPA i Hibernate",text:"Obiekty Javy istnieją tylko w pamięci JVM. Ich powiązanie z inną reprezentacją danych (plik, baza, API) to **mapowanie**. Biblioteki: CSV – OpenCSV, XML – JAXB, YAML – SnakeYAML, JSON – Jackson, relacyjne bazy – Hibernate.\n\n**JPA** to specyfikacja (standard): zestaw adnotacji i interfejsów, które musi zaimplementować framework ORM. Nie jest frameworkiem, nie zawiera kodu wykonawczego i sama nie łączy się z bazą. Nie należy do JDK, trzeba dodać zależność `jakarta.persistence-api` (pakiet `jakarta.persistence`). Implementacje JPA to Hibernate, EclipseLink i OpenJPA, a JDBC to niskopoziomowe API do baz, a nie implementacja JPA. Hibernate (2001) jest starszy niż JPA (2006) i był dla niego inspiracją."},{id:"b",title:"Adnotacje JPA",text:"• `@Entity` – klasa encji (domyślnie nazwa klasy to nazwa tabeli, a pola to kolumny),\n• `@Transient` – pole niezapisywane w bazie,\n• `@GeneratedValue(strategy = ...)` – sposób generowania klucza głównego (AUTO, SEQUENCE, IDENTITY),\n• `@ManyToOne` – wiele rekordów wskazuje na jeden nadrzędny (N:1),\n• `@JoinTable` – tabela pośrednicząca w relacji wiele-do-wielu, `@JoinColumn` – kolumna klucza obcego,\n• callbacki: `@PrePersist` (przed zapisem nowej encji), `@PostPersist`, `@PreUpdate`, `@PostUpdate`, `@PreRemove`, `@PostRemove`, `@PostLoad` (po załadowaniu z bazy),\n• `@Embeddable` + `@Embedded` – pola klasy trafiają do tabeli innej encji,\n• `@MappedSuperclass` – klasa bazowa przekazująca pola, ale sama nie jest encją,\n• `@Inheritance(strategy = ...)` – strategia dziedziczenia: SINGLE_TABLE, JOINED, TABLE_PER_CLASS, a `@DiscriminatorColumn` wskazuje kolumnę typu w SINGLE_TABLE,\n• `@Enumerated(EnumType.STRING)` – enum jako tekst (domyślnie liczbowo, ORDINAL),\n• `@Lob` – duże dane (BLOB i CLOB)."},{id:"c",title:"Adnotacje specyficzne dla Hibernate",text:"Poza standardem JPA Hibernate ma własne adnotacje: `@CreationTimestamp`, `@UpdateTimestamp`, `@DynamicInsert`, `@DynamicUpdate`, `@Immutable`, `@Cache`. `@DynamicUpdate` powoduje, że `UPDATE` obejmuje tylko zmienione kolumny."},{id:"d",title:"Session i SessionFactory",text:`**Session** to pojedyncze połączenie (jednostka pracy) z bazą. Nie jest thread-safe, to obiekt chwilowy. Ma cache L1, dlatego trzeba ją zamknąć. W jednej sesji aktywna jest tylko jedna transakcja naraz, choć sesja może obsłużyć wiele kolejnych.

**SessionFactory** jest kosztowna, więc tworzy się ją raz przy starcie, jedną na bazę danych (singleton). Jest thread-safe i ma cache L2 współdzielony między sesjami.`},{id:"e",title:"Konfiguracja i przykład użycia Hibernate",text:"Konfiguracja jest w `hibernate.cfg.xml` lub `hibernate.properties` w katalogu `src/main/resources` albo w kodzie. Zawiera połączenie z bazą, dialekt, encje i opcje (`show_sql`, `hbm2ddl.auto`), ale nie zawiera logiki biznesowej. Encję można zarejestrować automatycznie (`@Entity`), w plikach `.hbm.xml` lub `configuration.addAnnotatedClass(MyEntity.class)`. Klasa encji musi mieć konstruktor bezparametrowy.\n\nPrzebieg: `beginTransaction` → `save` → `commit` (dopiero wtedy dane trafiają do bazy) → `close`. Jeśli w bazie brak tabeli (np. `users`), Hibernate ją utworzy (`CREATE TABLE`), przy odpowiedniej konfiguracji `hbm2ddl`."},{id:"f",title:"HQL, zalety i wady",text:"**HQL** (Hibernate Query Language) to język zapytań podobny do SQL. JPA definiuje własny odpowiednik, JPQL. Zaleta Hibernate: niezależność od bazy, więc można zmienić bazę (np. MySQL na PostgreSQL) bez zmiany logiki biznesowej, zmieniając tylko dialekt w konfiguracji. Wady: trudniejsze debugowanie, narzut wydajnościowy przy operacjach masowych i możliwe nieoptymalne zapytania."}],zy=[{id:"w05-01",s:"a",q:"Czym jest mapowanie w kontekście obiektów Java?",a:["Powiązaniem obiektu w pamięci procesu z inną reprezentacją danych (plik, baza, API)","Tworzeniem kolekcji Map","Kompilacją do bytecode","Przypisaniem adresu pamięci"],w:["Map to struktura danych – nie o to chodzi.","To nie kompilacja.","To nie adresy pamięci."],e:"Obiekty Java istnieją tylko w JVM; ich powiązanie z innym formatem to mapowanie."},{id:"w05-02",s:"a",q:"Która biblioteka mapuje obiekty Java na JSON wg wykładu?",a:["Jackson","OpenCSV","SnakeYAML","JAXB"],w:["OpenCSV – CSV.","SnakeYAML – YAML.","JAXB – XML."],e:"Mapowanie na JSON (i BSON) robi Jackson. Dla CSV jest OpenCSV, dla XML JAXB, dla YAML SnakeYAML, a dla relacyjnych baz Hibernate."},{id:"w05-03",s:"a",q:"Czym jest JPA?",a:["Specyfikacją (standardem) opisującą przechowywanie obiektów Java w relacyjnej bazie","Frameworkiem ORM z kodem wykonawczym","Sterownikiem JDBC","Bazą danych"],w:["JPA nie jest frameworkiem i nie zawiera kodu wykonawczego.","Nie łączy się z bazą samodzielnie.","To nie baza danych."],e:"JPA – specyfikacja: adnotacje i interfejsy, które musi implementować framework ORM."},{id:"w05-04",s:"a",q:"Czy JPA jest częścią JDK?",a:["Nie – trzeba dodać zależność jakarta.persistence-api","Tak, od Java 8","Tak, w pakiecie java.sql","Tak, w javax.xml"],w:["Nie ma w JDK.","java.sql to JDBC.","javax.xml to XML."],e:"Nie ma w JDK; zależność jakarta.persistence-api, pakiet jakarta.persistence."},{id:"w05-05",s:"a",q:"Które z poniższych NIE jest implementacją JPA?",a:["JDBC","Hibernate","EclipseLink","OpenJPA"],w:["Hibernate to implementacja JPA.","EclipseLink to implementacja JPA.","OpenJPA to implementacja JPA."],e:"Implementacje JPA: Hibernate, EclipseLink, OpenJPA. JDBC to niskopoziomowe API dostępu do baz."},{id:"w05-06",s:"a",q:"Co jest prawdą o relacji Hibernate i JPA?",a:["Hibernate (2001) jest starszy niż JPA (2006) i był inspiracją dla JPA","JPA jest starsze i Hibernate je skopiował","Powstały w tym samym roku","Hibernate nie implementuje JPA"],w:["Odwrotnie – Hibernate był pierwszy.","Różnią się o 5 lat.","Hibernate jest implementacją JPA."],e:"Hibernate 2001, JPA 2006; Hibernate jest implementacją JPA."},{id:"w05-07",s:"a",q:"Czego JPA NIE robi?",a:["Nie łączy się z bazą danych samodzielnie (nie ma kodu wykonawczego)","Nie definiuje adnotacji encji","Nie definiuje JPQL","Nie definiuje EntityManager"],w:["Definiuje @Entity, @Id itd.","Definiuje JPQL.","Definiuje EntityManager/EntityTransaction."],e:"JPA nie jest frameworkiem, nie zawiera kodu wykonawczego, nie łączy się z bazą sam."},{id:"w05-08",s:"b",q:"Co robi adnotacja @Entity?",a:["Oznacza klasę jako encję – nazwa klasy to nazwa tabeli, pola to kolumny","Zmienia nazwę tabeli","Oznacza klucz główny","Wyłącza zapis pola"],w:["To @Table(name=...).","To @Id.","To @Transient."],e:"@Entity – klasa encji; domyślnie nazwa tabeli = nazwa klasy."},{id:"w05-09",s:"b",q:"Która adnotacja oznacza pole niezapisywane w bazie danych?",a:["@Transient","@Column(nullable = true)","@Lob","@Embedded"],w:["To ustawienie kolumny, nadal zapisywanej.","@Lob mapuje duże dane.","@Embedded wstawia klasę do encji."],e:"@Transient – pole nie jest zapisywane w bazie."},{id:"w05-10",s:"b",q:"Do czego służy @GeneratedValue(strategy = GenerationType.IDENTITY)?",a:["Określa sposób generowania klucza głównego (autoinkrementacja)","Generuje gettery i settery","Generuje nazwę tabeli","Generuje cały schemat bazy"],w:["To Lombok, nie JPA.","Nazwę tabeli ustala @Table.","Schemat generuje hbm2ddl.auto."],e:"@GeneratedValue określa sposób generowania klucza głównego (np. AUTO, SEQUENCE, IDENTITY)."},{id:"w05-11",s:"b",q:"Która adnotacja oznacza relację: wiele rekordów wskazuje na jeden nadrzędny?",a:["@ManyToOne","@OneToMany","@OneToOne","@ManyToMany"],w:["To 1:N – jeden obiekt ma wiele powiązanych.","To 1:1.","To N:M."],e:"Relację N:1 (wiele rekordów wskazuje na jeden nadrzędny) oznacza adnotacja @ManyToOne."},{id:"w05-12",s:"b",q:"Do czego służy @JoinTable?",a:["Tworzy tabelę pośredniczącą w relacjach wiele-do-wielu","Określa nazwę kolumny klucza obcego","Łączy dwie bazy danych","Wykonuje JOIN w zapytaniu"],w:["To @JoinColumn.","Nie łączy baz.","To adnotacja mapowania, nie zapytanie."],e:"@JoinTable – tabela pośrednicząca w N:M; @JoinColumn – kolumna klucza obcego."},{id:"w05-13",s:"b",q:"Kiedy wywoływana jest metoda z @PrePersist?",a:["Przed zapisaniem nowej encji do bazy","Po zapisaniu encji","Przed aktualizacją","Po załadowaniu encji (SELECT)"],w:["To @PostPersist.","To @PreUpdate.","To @PostLoad."],e:"Callbacki: @PrePersist/@PostPersist, @PreUpdate/@PostUpdate, @PreRemove/@PostRemove, @PostLoad."},{id:"w05-14",s:"b",q:"Kiedy wywoływana jest metoda z @PostLoad?",a:["Po załadowaniu encji z bazy (po SELECT)","Przed zapisaniem","Po usunięciu","Przy starcie aplikacji"],w:["To @PrePersist.","To @PostRemove.","Nie ma takiego callbacku encji."],e:"Metoda z adnotacją @PostLoad jest wywoływana po załadowaniu encji z bazy."},{id:"w05-15",s:"b",q:"Czym jest klasa oznaczona @Embeddable?",a:["Klasą, której pola są wstawiane do tabeli innej encji (nie ma własnej tabeli)","Encją z własną tabelą","Klasą bazową bez encji","Klasą tylko do odczytu"],w:["Nie ma własnej tabeli.","To @MappedSuperclass.","To @Immutable."],e:"@Embeddable + @Embedded – wstawienie pól do tabeli encji."},{id:"w05-16",s:"b",q:"Czym jest @MappedSuperclass?",a:["Klasą bazową przekazującą pola klasom dziedziczącym, ale niebędącą encją","Encją bazową z własną tabelą","Klasą wstawianą do tabeli","Strategią dziedziczenia SINGLE_TABLE"],w:["Sama nie jest encją.","To @Embeddable.","To @Inheritance."],e:"@MappedSuperclass – klasa bazowa, przekazuje pola, sama nie jest encją."},{id:"w05-17",s:"b",q:"Które strategie dziedziczenia definiuje @Inheritance?",a:["SINGLE_TABLE, JOINED, TABLE_PER_CLASS","IDENTITY, SEQUENCE, AUTO","EAGER, LAZY","ONE, MANY"],w:["To strategie generowania kluczy.","To strategie ładowania.","To nie strategie."],e:"@Inheritance(strategy = SINGLE_TABLE | JOINED | TABLE_PER_CLASS); @DiscriminatorColumn dla SINGLE_TABLE."},{id:"w05-18",s:"b",q:"Do czego służy @DiscriminatorColumn?",a:["Określa kolumnę identyfikującą typ w strategii SINGLE_TABLE","Określa klucz obcy","Wymusza unikalność","Mapuje enum na tekst"],w:["Klucz obcy to @JoinColumn.","Unikalność to @UniqueConstraint.","Enum to @Enumerated."],e:"W SINGLE_TABLE wszystkie podklasy są w jednej tabeli – typ rozróżnia kolumna dyskryminatora."},{id:"w05-19",s:"b",q:"Jak zmapować enum jako tekst w bazie?",a:["@Enumerated(EnumType.STRING)","@Lob",'@Column(type = "enum")',"@Enum(TEXT)"],w:["@Lob – duże dane.","Nie ma takiego atrybutu type.","Nie ma @Enum."],e:"@Enumerated(EnumType.STRING) – enum jako tekst (domyślnie liczbowo – ORDINAL)."},{id:"w05-20",s:"c",q:"Która adnotacja jest specyficzna dla Hibernate (nie JPA)?",a:["@CreationTimestamp","@Entity","@Id","@OneToMany"],w:["@Entity jest z JPA.","@Id jest z JPA.","@OneToMany jest z JPA."],e:"Hibernate: @CreationTimestamp, @UpdateTimestamp, @DynamicInsert/@DynamicUpdate, @Immutable, @Cache."},{id:"w05-21",s:"c",q:"Co robi @DynamicUpdate (Hibernate)?",a:["Generuje UPDATE tylko dla kolumn, które się zmieniły","Automatycznie ustawia datę aktualizacji","Oznacza encję jako tylko do odczytu","Włącza cache L2"],w:["To @UpdateTimestamp.","To @Immutable.","To @Cache."],e:"@DynamicInsert/@DynamicUpdate – tylko zmienione kolumny."},{id:"w05-22",s:"d",q:"Który element Hibernate reprezentuje pojedyncze połączenie (jednostkę pracy) z bazą?",a:["Session","SessionFactory","Configuration","Query"],w:["SessionFactory tworzy sesje.","Configuration to konfiguracja.","Query to zapytanie."],e:"Session – pojedyncze połączenie/jednostka pracy z bazą."},{id:"w05-23",s:"d",q:"Ile obiektów SessionFactory tworzy się zwykle w aplikacji?",a:["Jeden na bazę danych – jest kosztowny, tworzony raz przy starcie","Jeden na każde zapytanie","Jeden na każdą sesję","Jeden na wątek"],w:["Byłoby to bardzo kosztowne.","To SessionFactory tworzy wiele sesji.","Jest thread-safe – współdzielony."],e:"SessionFactory – singleton wielokrotnego użytku, kosztowny, tworzony raz (dla każdej bazy)."},{id:"w05-24",s:"d",q:"Czy SessionFactory jest thread-safe?",a:["Tak – może być współdzielony między wątkami","Nie","Tylko w trybie read-only","Tylko z cache L2"],w:["Jest thread-safe.","Zawsze thread-safe.","Niezależnie od cache."],e:"SessionFactory jest thread-safe; Session nie jest – to obiekt chwilowy."},{id:"w05-25",s:"d",q:"Który cache należy do Session, a który do SessionFactory?",a:["Session – L1, SessionFactory – L2","Session – L2, SessionFactory – L1","Oba mają tylko L1","Hibernate nie ma cache"],w:["Odwrotnie.","SessionFactory ma L2 (współdzielony).","Hibernate ma cache."],e:"Session posiada cache L1 (stąd konieczność zamknięcia); SessionFactory – L2 współdzielony między sesjami."},{id:"w05-26",s:"d",q:"Ile transakcji może być aktywnych jednocześnie w jednej sesji?",a:["Jedna (sesja może obsłużyć wiele kolejnych transakcji)","Dowolnie wiele równolegle","Zero – sesja nie ma transakcji","Dwie"],w:["Tylko jedna aktywna naraz.","Session obsługuje transakcje.","Jedna."],e:"Jedna sesja może obsłużyć wiele kolejnych transakcji, ale tylko jedna jest aktywna w danym momencie."},{id:"w05-27",s:"e",q:"Gdzie domyślnie szukany jest plik hibernate.properties / hibernate.cfg.xml?",a:["src/main/resources","src/main/java","katalog domowy użytkownika","/etc/hibernate"],w:["Tam jest kod źródłowy.","Nie w katalogu domowym.","Nie systemowo."],e:"Konfiguracja: hibernate.cfg.xml lub hibernate.properties w src/main/resources, albo w kodzie."},{id:"w05-28",s:"e",q:"Co NIE jest typową zawartością konfiguracji Hibernate?",a:["Kod logiki biznesowej","Dane połączenia (driver, URL, user, password)","Dialekt SQL","Wskazanie klas encji"],w:["Dane połączenia są w konfiguracji.","Dialekt jest w konfiguracji.","Mapowane klasy są w konfiguracji."],e:"Konfiguracja: połączenie, dialekt, encje, opcje (show_sql, hbm2ddl.auto)."},{id:"w05-29",s:"e",q:"Jak ręcznie zarejestrować encję w Configuration?",a:["configuration.addAnnotatedClass(MyEntity.class)","configuration.register(MyEntity)","@Register na klasie","sessionFactory.add(MyEntity.class)"],w:["Nie ma register().","Nie ma @Register.","SessionFactory nie rejestruje encji."],e:"Rejestracja: automatycznie (@Entity), pliki .hbm.xml lub addAnnotatedClass."},{id:"w05-30",s:"e",q:"Co jest wymagane w klasie encji User przez Hibernate?",a:["Konstruktor domyślny (bezparametrowy)","Implementacja Serializable","Metoda toString()","Pole statyczne id"],w:["Nie jest wymagane.","Nie jest wymagane.","Id nie może być statyczne."],e:"public User() { } – konstruktor domyślny wymagany przez Hibernate."},{id:"w05-31",s:"e",q:"W przykładzie HibernateExample – kiedy dane faktycznie trafiają do bazy?",a:["Po session.getTransaction().commit()","Po new User(...)","Po session.save(user) natychmiast","Po sessionFactory.close()"],w:["Konstruktor tylko tworzy obiekt.","save rejestruje obiekt – zapis następuje przy commit.","Zamknięcie fabryki nie zapisuje."],e:"Dane trafiają do bazy dopiero po zatwierdzeniu transakcji, czyli session.getTransaction().commit(). Kolejność to: beginTransaction, save, commit, close."},{id:"w05-32",s:"e",q:"Co zrobi Hibernate, jeśli w bazie nie ma tabeli users dla encji User?",a:["Utworzy ją (CREATE TABLE) – przy odpowiedniej konfiguracji hbm2ddl","Rzuci wyjątek zawsze","Zapisze dane do pliku","Użyje innej tabeli"],w:["Wykład pokazuje automatyczne utworzenie.","Nie zapisuje do plików.","Nie zgaduje innej tabeli."],e:"Jeżeli tabeli nie ma, Hibernate ją utworzy (CREATE TABLE users …)."},{id:"w05-33",s:"f",q:"Czym jest HQL?",a:["Hibernate Query Language – język zapytań podobny do SQL","Konfiguracją XML Hibernate","Sterownikiem bazy","Plikiem mapującym"],w:["To hibernate.cfg.xml.","To driver JDBC.","To .hbm.xml."],e:"HQL – Hibernate Query Language; JPA definiuje JPQL."},{id:"w05-34",s:"f",q:"Która cecha jest WADĄ Hibernate wg wykładu?",a:["Narzut wydajnościowy przy dużych operacjach masowych","Eliminacja kodu JDBC","Niezależność od bazy danych","Wsparcie relacji obiektowych"],w:["To zaleta.","To zaleta.","To zaleta."],e:"Wady: trudniejsze debugowanie, narzut przy operacjach masowych, możliwe nieoptymalne zapytania."},{id:"w05-35",s:"f",q:"Co pozwala zrobić Hibernate bez zmiany logiki biznesowej?",a:["Zmienić bazę danych (np. MySQL → PostgreSQL)","Zmienić język na Kotlin","Zrezygnować z encji","Pominąć transakcje"],w:["Język nie jest tematem.","Encje są potrzebne.","Transakcje są potrzebne."],e:"Niezależność od bazy danych – zmiana dialektu w konfiguracji."},{id:"w05-36",s:"b",q:"Do czego służy @Lob?",a:["Do mapowania dużych danych (BLOB/CLOB)","Do kluczy złożonych","Do enumów","Do pól tymczasowych"],w:["To @EmbeddedId/@IdClass.","To @Enumerated.","To @Transient."],e:"Adnotacja @Lob służy do mapowania dużych danych (BLOB i CLOB)."}],yy={id:dy,title:wy,sections:uy,questions:zy},py="w06",ky="W6 · Spring Framework (1/2) – IoC, DI, beany",my=[{id:"a",title:"Framework i jego mechanizmy",text:`**Framework** to szkielet aplikacji, który narzuca strukturę i sam wywołuje „osadzony” kod programisty. **Biblioteka** dostarcza gotowe elementy, które programista wywołuje sam.

Spring opiera się na trzech mechanizmach: **IoC** (Inversion of Control, zarządzanie obiektami), **DI** (Dependency Injection, tworzenie zależności) i **AOP** (Aspect-Oriented Programming, wydzielanie bloków logiki). Korzyść dla testów: IoC określa wyraźne granice między komponentami, co ułatwia testy jednostkowe. Bez IoC programista sam tworzy i łączy obiekty, a z IoC przygotowuje klasy, przekazuje je kontenerowi, tworzy konfigurację i uruchamia kontener.`},{id:"b",title:"IoC, DI i rodzaje powiązań",text:`**Inversion of Control** to przeniesienie odpowiedzialności za tworzenie i zarządzanie obiektami z kodu aplikacji do zewnętrznego kontenera (np. Spring IoC Container). Programista nie decyduje, kiedy obiekty zostaną utworzone. **Dependency Injection** to wzorzec, w którym obiekt dostaje zależności z zewnątrz zamiast tworzyć je sam.

Sposoby wstrzykiwania:
• przez **konstruktor** – zalecany dla zależności obowiązkowych i niezmiennych,
• przez **setter** – dla zależności opcjonalnych i zmiennych,
• przez **pole** (Field Injection) – bezpośrednie podstawienie wartości, niezalecane.

Powiązania między obiektami: dziedziczenie tworzy powiązanie silne (obiekty nie mogą istnieć niezależnie), a agregacja i kompozycja tworzą powiązanie luźne. W agregacji obiekty mogą istnieć niezależnie, a w kompozycji odrębne istnienie nie ma sensu.`},{id:"c",title:"Beany i kontenery",text:"**Bean** to obiekt zarządzany przez kontener Spring IoC, tworzony na podstawie przekazanych klas. Zakresy (scope): **Singleton** (domyślny, jeden egzemplarz), **Prototype** (nowy egzemplarz przy każdym użyciu), Request, Session i Application (w aplikacjach webowych).\n\nKontenery: `BeanFactory` to interfejs bazowy i prosty kontener. `ApplicationContext` rozszerza go o zaawansowane funkcje (i18n, profile, integracja ze Spring Boot). W aplikacji standalone konfigurowanej adnotacjami używa się `AnnotationConfigApplicationContext` (w aplikacji webowej jest ukryty kontekst serwletowy). `XmlBeanFactory` jest przestarzała, a zalecana jest `DefaultListableBeanFactory`.\n\nCykl życia beana: utworzenie → skompletowanie (wstrzyknięcie) → inicjalizacja → udostępnienie → zniszczenie."},{id:"d",title:"Sposoby konfiguracji",text:"Standardem w Spring Boot jest konfiguracja adnotacjami w kodzie (`@Component`, `@Service`, `@Controller`). Pliki `.properties` są ograniczone do nadawania wartości polom (`@Value`). Aby Spring Boot automatycznie przeszukiwał podpakiety w poszukiwaniu beanów, potrzebna jest klasa startowa w głównym pakiecie z adnotacją `@SpringBootApplication`."},{id:"e",title:"Adnotacje w Spring",text:'• `@Component` – ogólny komponent; `@Service` – logika biznesowa; `@Repository` – dane; `@Controller` – MVC; `@RestController` – REST,\n• `@Autowired` – automatycznie wstrzykuje zależność według typu,\n• `@Qualifier` – wskazuje konkretny bean, gdy jest wielu kandydatów; `@Primary` – wskazuje domyślną implementację,\n• `@Value` – wartość z pliku properties,\n• `@PostConstruct` – metoda po wstrzyknięciu zależności; `@PreDestroy` – przed zniszczeniem,\n• `@Lazy` – bean tworzony dopiero przy pierwszym użyciu,\n• `@Profile("dev")` – bean aktywny tylko w danym profilu (np. dev, prod),\n• `@ComponentScan("com.example")` – wskazuje pakiet, w którym szukać klas beanów,\n• `@Bean` – na metodzie w klasie konfiguracyjnej (`@Configuration`); metoda zwraca obiekt będący beanem.'}],jy=[{id:"w06-01",s:"a",q:"Czym różni się framework od biblioteki wg wykładu?",a:["Framework narzuca strukturę i sam wywołuje „osadzony” kod; biblioteka dostarcza elementy, które programista wywołuje","Biblioteka narzuca strukturę aplikacji","Framework nie wymaga konfiguracji","Nie ma różnicy"],w:["Biblioteka nie narzuca struktury.","Framework wymaga globalnej konfiguracji.","Różnica jest zasadnicza – kto kontroluje przepływ."],e:"Framework – szkielet aplikacji, kontroluje przepływ programu; biblioteka – gotowe elementy wywoływane przez programistę."},{id:"w06-02",s:"a",q:"Które trzy mechanizmy Springa wymieniono na wykładzie?",a:["Inversion of Control, Dependency Injection, Aspect-Oriented Programming","MVC, REST, SOAP","JPA, JDBC, JTA","Streams, Lambdas, Records"],w:["To architektury i protokoły.","To API dostępu do danych.","To elementy języka Java."],e:"Trzy mechanizmy Springa to IoC (zarządzanie obiektami), DI (tworzenie zależności) i AOP (wydzielanie bloków logiki)."},{id:"w06-03",s:"b",q:"Czym jest Inversion of Control (IoC)?",a:["Przeniesieniem odpowiedzialności za tworzenie i zarządzanie obiektami z kodu aplikacji do zewnętrznego kontenera","Odwróceniem kolejności wywołań metod","Dziedziczeniem odwrotnym","Zamianą pętli na rekurencję"],w:["Nie chodzi o kolejność wywołań.","To nie dziedziczenie.","Nie dotyczy pętli."],e:"IoC – paradygmat; programista nie decyduje, kiedy obiekty zostaną utworzone – robi to kontener (np. Spring IoC Container)."},{id:"w06-04",s:"b",q:"Czym jest Dependency Injection?",a:["Wzorcem, w którym obiekt otrzymuje zależności od zewnętrznego kontenera zamiast tworzyć je sam","Dziedziczeniem po wielu klasach","Wstrzykiwaniem kodu SQL","Kopiowaniem obiektów"],w:["Java nie ma wielodziedziczenia klas.","To nie SQL injection.","To nie klonowanie."],e:"DI – wykonanie agregacji przy pomocy zewnętrznego dostawcy."},{id:"w06-05",s:"b",q:"Który sposób wstrzykiwania jest zalecany dla zależności obowiązkowych i niezmiennych?",a:["Przez konstruktor (Constructor Injection)","Przez setter","Przez pole (Field Injection)","Przez metodę statyczną"],w:["Setter – zależności opcjonalne lub zmienne.","Pole – niezalecane.","Nie ma takiego sposobu DI."],e:"Zależności obowiązkowe i niezmienne najlepiej wstrzykiwać przez konstruktor. Setter jest dla zależności opcjonalnych i zmiennych, a wstrzykiwanie przez pole jest niezalecane."},{id:"w06-06",s:"b",q:"Który sposób wstrzykiwania wykład określa jako niezalecany?",a:["Przez pole (Field Injection)","Przez konstruktor","Przez setter","Żaden"],w:["Konstruktor jest zalecany.","Setter jest OK dla opcjonalnych.","Jeden jest niezalecany."],e:"Field Injection – bezpośrednie podstawienie wartości do pola, niezalecane."},{id:"w06-07",s:"b",q:"Jaki rodzaj powiązania tworzy dziedziczenie wg wykładu?",a:["Silne (nadbudowywanie) – obiekty nie mogą istnieć niezależnie","Luźne (zawieranie)","Brak powiązania","Dynamiczne"],w:["Luźne to agregacja/kompozycja.","Powiązanie istnieje.","To nie kategoria z wykładu."],e:"Dziedziczenie tworzy powiązanie silne. Agregacja i kompozycja tworzą powiązanie luźne."},{id:"w06-08",s:"b",q:"Czym różni się agregacja od kompozycji?",a:["W agregacji obiekty mogą istnieć niezależnie; w kompozycji odrębne istnienie nie ma sensu","Kompozycja to dziedziczenie","Agregacja to dziedziczenie","Nie ma różnicy"],w:["Kompozycja to zawieranie, nie dziedziczenie.","Agregacja to zawieranie.","Różnią się niezależnością istnienia."],e:"W agregacji obiekty mogą istnieć niezależnie. W kompozycji odrębne istnienie obiektów nie ma sensu."},{id:"w06-09",s:"c",q:"Czym jest bean w Spring?",a:["Obiektem Java zarządzanym przez kontener Spring IoC","Dowolną klasą Java","Plikiem konfiguracyjnym","Adnotacją"],w:["Tylko obiekty zarządzane przez kontener.","Konfiguracja opisuje beany.","@Bean to adnotacja, ale bean to obiekt."],e:"Bean – obiekt zarządzany przez kontener, tworzony na podstawie przekazanych klas."},{id:"w06-10",s:"c",q:"Jaki jest domyślny scope beana w Spring?",a:["Singleton – 1 egzemplarz","Prototype – nowy przy każdym użyciu","Request","Session"],w:["Prototype trzeba ustawić jawnie.","Request to zakres web.","Session to zakres web."],e:"Singleton (domyślnie); Prototype – nowy egzemplarz za każdym użyciem; Request/Session/Application – web."},{id:"w06-11",s:"c",q:"Co oznacza scope Prototype?",a:["Nowy egzemplarz beana przy każdym użyciu (pobraniu)","Jeden egzemplarz na aplikację","Jeden egzemplarz na żądanie HTTP","Bean tworzony leniwie"],w:["To Singleton.","To Request.","Leniwość to @Lazy."],e:"Scope Prototype oznacza, że przy każdym użyciu powstaje nowy egzemplarz beana."},{id:"w06-12",s:"c",q:"Czym różni się BeanFactory od ApplicationContext?",a:["ApplicationContext to zaawansowany kontener (i18n, profile, integracja ze Spring Boot); BeanFactory to prosty kontener","BeanFactory jest bardziej zaawansowany","ApplicationContext nie wstrzykuje zależności","Nie ma różnicy"],w:["Odwrotnie.","Oba wstrzykują zależności.","Kontekst ma dodatkowe funkcje."],e:"Fabryka – prosty kontener, rzadko używana; kontekst – zaawansowany, rozszerza BeanFactory."},{id:"w06-13",s:"c",q:"Jaki interfejs jest bazowy dla wszystkich kontenerów Spring?",a:["BeanFactory","ApplicationContext","Configuration","Component"],w:["ApplicationContext rozszerza BeanFactory.","To adnotacja.","To adnotacja."],e:"BeanFactory – interfejs bazowy; ApplicationContext – bazowy dla kontekstów, rozszerza BeanFactory."},{id:"w06-14",s:"c",q:"Którego kontekstu używa się w aplikacji standalone konfigurowanej adnotacjami?",a:["AnnotationConfigApplicationContext","ClassPathXmlApplicationContext","XmlBeanFactory","WebApplicationContext"],w:["Raczej przestarzały (XML).","Przestarzała fabryka.","Dla aplikacji web."],e:"AnnotationConfigApplicationContext – standalone; AnnotationConfigServletWebServerApplicationContext – web (ukryty)."},{id:"w06-15",s:"c",q:"Która klasa fabryki jest określona jako przestarzała?",a:["XmlBeanFactory","DefaultListableBeanFactory","BeanFactory","AbstractBeanFactory"],w:["Zalecana w nowych projektach.","To interfejs bazowy.","To klasa bazowa fabryk."],e:"XmlBeanFactory – obecnie przestarzała; DefaultListableBeanFactory – zalecana."},{id:"w06-16",s:"c",q:"Jaki jest typowy cykl życia beana w kontenerze?",a:["Utworzenie → skompletowanie → inicjalizacja → udostępnienie → zniszczenie","Inicjalizacja → utworzenie → zniszczenie","Udostępnienie → utworzenie","Zniszczenie → utworzenie"],w:["Inicjalizacja następuje po skompletowaniu.","Udostępnienie na końcu.","Odwrotna kolejność."],e:"Kontener: utworzenie, skompletowanie (wstrzyknięcie), inicjalizacja, udostępnienie, zniszczenie."},{id:"w06-17",s:"d",q:"Która metoda konfiguracji jest standardem w Spring Boot?",a:["Poprzez adnotacje w kodzie (annotation based)","Pliki XML","Konfiguracja programistyczna","Tylko pliki .properties"],w:["XML – klasyczny, dziś rzadko używany.","Programistyczna – prototypowanie.","Properties – tylko wartości pól."],e:"Adnotacje (@Component @Service @Controller) – bardzo często używane, standard w Spring Boot."},{id:"w06-18",s:"d",q:"Do czego ograniczone jest zastosowanie plików .properties w konfiguracji?",a:["Do nadawania wartości polom","Do definiowania beanów","Do wstrzykiwania zależności","Do skanowania pakietów"],w:["Beany definiuje się adnotacjami/klasami konfiguracyjnymi.","DI robi kontener.","Skanowanie to @ComponentScan."],e:"Pliki własności – zastosowanie ograniczone do nadawania wartości polom (@Value)."},{id:"w06-19",s:"d",q:"Co jest potrzebne w Spring Boot, aby automatycznie skanować podpakiety w poszukiwaniu beanów?",a:["Klasa startowa w głównym pakiecie z @SpringBootApplication","Plik beans.xml","Klasa konfiguracyjna z @Configuration (obowiązkowo)","Ręczne addBean dla każdej klasy"],w:["XML nie jest potrzebny.","W Boot klasa konfiguracyjna jest opcjonalna.","Rejestracja jest automatyczna."],e:"Potrzebna jest klasa startowa w głównym pakiecie, oznaczona @SpringBootApplication. Wtedy podpakiety są skanowane automatycznie."},{id:"w06-20",s:"e",q:"Do jakiej warstwy służy adnotacja @Service?",a:["Logiki biznesowej","Dostępu do danych","Kontrolera MVC","Konfiguracji"],w:["To @Repository.","To @Controller.","To @Configuration."],e:"@Component – ogólny; @Service – biznes; @Repository – dane; @Controller – MVC; @RestController – REST."},{id:"w06-21",s:"e",q:"Co robi @Autowired?",a:["Automatycznie wstrzykuje zależność według typu","Wstrzykuje wartość z application.properties","Wybiera bean, gdy jest wielu kandydatów","Tworzy bean leniwie"],w:["To @Value.","To @Qualifier.","To @Lazy."],e:"@Autowired – wg typu; @Qualifier – który bean; @Value – wartość z properties."},{id:"w06-22",s:"e",q:"Dwie implementacje interfejsu PaymentService są beanami. Co pozwala wskazać konkretną w miejscu wstrzyknięcia?",a:["@Qualifier","@Value","@Lazy","@DependsOn"],w:["@Value wstrzykuje wartości.","@Lazy dotyczy czasu tworzenia.","@DependsOn wymusza kolejność inicjalizacji."],e:"@Qualifier wskazuje bean przy wielu kandydatach; @Primary określa domyślny."},{id:"w06-23",s:"e",q:"Co robi @Primary?",a:["Określa domyślną implementację, gdy istnieje wiele","Tworzy bean jako pierwszy","Oznacza bean jako singleton","Ustawia profil prod"],w:["Kolejność to @DependsOn.","Scope to @Scope.","Profil to @Profile."],e:"@Primary – domyślny typ przy wielu implementacjach."},{id:"w06-24",s:"e",q:"Kiedy wywoływana jest metoda z @PostConstruct?",a:["Po wstrzyknięciu zależności","Przed utworzeniem obiektu","Przed zniszczeniem beana","Przy każdym użyciu beana"],w:["Obiekt musi już istnieć.","To @PreDestroy.","Wywoływana raz."],e:"@PostConstruct – po wstrzyknięciu zależności; @PreDestroy – przed zniszczeniem."},{id:"w06-25",s:"e",q:"Co robi @Lazy na beanie?",a:["Bean jest tworzony dopiero przy pierwszym użyciu","Bean jest tworzony przy starcie","Bean nie jest nigdy niszczony","Bean jest prototypem"],w:["To domyślne zachowanie singletona.","Nie dotyczy niszczenia.","Scope to @Scope."],e:"@Lazy – bean tworzony dopiero przy pierwszym użyciu."},{id:"w06-26",s:"e",q:'Do czego służy @Profile("dev")?',a:["Bean jest aktywny tylko w profilu dev","Mierzy wydajność beana","Nadaje nazwę beanowi","Ustawia scope"],w:["To nie profiler.",'Nazwę nadaje wartość @Component("…").',"To @Scope."],e:"@Profile – definiuje profil środowiskowy (dev, prod) dla beana."},{id:"w06-27",s:"e",q:'Do czego służy @ComponentScan("com.example")?',a:["Wskazuje pakiet, w którym szukać klas beanów","Skanuje bazę danych","Skanuje pliki properties","Tworzy bean typu Component"],w:["Nie dotyczy bazy.","Properties to @PropertySource/@Value.","Nie tworzy beana."],e:"@ComponentScan – wskazanie miejsca klas beanów."},{id:"w06-28",s:"e",q:"Gdzie używa się adnotacji @Bean?",a:["Na metodzie w klasie konfiguracyjnej (@Configuration)","Na klasie komponentu","Na polu do wstrzyknięcia","Na pakiecie"],w:["Na klasie używa się @Component.","Do pola – @Autowired.","Nie na pakiecie."],e:"@Bean – definicja pojedynczego beana w klasie konfiguracyjnej (metoda zwraca obiekt)."},{id:"w06-29",s:"a",q:"Która korzyść IoC dotyczy testów?",a:["IoC określa wyraźne granice między komponentami, co ułatwia testy jednostkowe","IoC eliminuje potrzebę testów","IoC generuje testy automatycznie","IoC przyspiesza kompilację testów"],w:["Testy nadal są potrzebne.","Nie generuje testów.","Nie dotyczy kompilacji."],e:"Testy jednostkowe komponentów – IoC określa wyraźne granice między komponentami."},{id:"w06-30",s:"a",q:"Co robi programista przy pracy z IoC (w odróżnieniu od programowania „ręcznego”)?",a:["Przygotowuje klasy, przekazuje je kontenerowi, tworzy konfigurację i uruchamia kontener","Tworzy i łączy wszystkie obiekty ręcznie","Pisze własny kontener","Nie pisze żadnych klas"],w:["To programowanie bez IoC.","Kontener jest gotowy (np. Spring).","Klasy nadal pisze programista."],e:"Bez IoC programista tworzy i łączy obiekty; z IoC robi to kontener na podstawie konfiguracji."}],gy={id:py,title:ky,sections:my,questions:jy},by="w07",fy="W7 · Spring Framework (2/2) – Spring Boot i stereotypy",hy=[{id:"a",title:"Spring Boot",text:'**Spring Boot** to automatyzacja Spring Framework: auto-konfiguracja, **startery** (zależności `spring-boot-starter-...` włączające konfigurację danego obszaru) i wbudowane serwery. Zwykły Spring nie ma wbudowanego serwera HTTP, a Spring Boot uruchamia go, jeśli projekt tego wymaga. Projekt startuje się przez **Spring Initializr**. Klasa konfiguracyjna `@Configuration` jest w Spring wymagana, a w Boot opcjonalna (auto-konfigurację można nią nadpisać lub rozszerzyć).\n\n`@SpringBootApplication` to złożenie `@Configuration` + `@EnableAutoConfiguration` + `@ComponentScan`. `SpringApplication.run(App.class, args)` przyjmuje klasę konfiguracyjną, tworzy kontekst, inicjalizuje beany, opakowuje argumenty w `ApplicationArguments` i uruchamia serwer HTTP (jeśli jest w projekcie; ze startera bez web aplikacja kończy się po wykonaniu). Klasa startowa musi leżeć w głównym pakiecie, bo domyślny skan obejmuje jej pakiet i podpakiety. Serwis z równoległego pakietu (np. `com.example.service` przy klasie w `com.example.app`) nie zostanie znaleziony.\n\nGdy nie ustawiono profilu, log informuje: `No active profile set, falling back to 1 default profile: "default"`.'},{id:"b",title:"Stereotypy",text:'`@Repository`, `@Service` i `@Controller` są specjalizacjami `@Component` (w definicji same mają tę adnotację). Różnice są głównie semantyczne: oznaczają rolę komponentu w architekturze. `@Repository` dodatkowo tłumaczy wyjątki bazodanowe (`SQLException`) na `DataAccessException`.\n\n`@RestController` = `@Controller` + `@ResponseBody`. `@ResponseBody` oznacza, że wartość zwracana z metody jest ciałem odpowiedzi HTTP (np. JSON), a nie nazwą widoku. W klasie `@Controller` bez `@ResponseBody` zwrócony `String` `"home"` oznacza nazwę widoku, więc klient zobaczy wyrenderowany widok `home`.'},{id:"c",title:"ControllerAdvice i Spring Data REST",text:"`@ControllerAdvice` centralizuje logikę wspólną dla wielu kontrolerów: obsługę wyjątków (`@ExceptionHandler`), atrybuty modelu (`@ModelAttribute`) i binding (`@InitBinder`). Odpowiednik dla REST to `@RestControllerAdvice`.\n\n`@RepositoryRestResource` na interfejsie repozytorium (np. `UserRepository extends CrudRepository<User, Long>`) udostępnia go jako zasób REST z automatycznymi endpointami CRUD: `GET /users`, `GET /users/{id}`, `POST`, `PUT /users/{id}`, `DELETE /users/{id}`. Własne endpointy (np. `GET /users/top10`) trzeba zdefiniować samemu. Dane są zwracane w formacie HATEOAS JSON, z linkami do powiązanych zasobów, więc klient nie musi znać całej struktury API."},{id:"d",title:"Beany z @Bean, @Component i inne projekty Spring",text:'Klasa bez adnotacji może być beanem, jeśli w klasie `@Configuration` jest metoda `@Bean` zwracająca jej obiekt. Definicja `@Component` ma `@Target(ElementType.TYPE)` (stosuje się do typów: klas, interfejsów, enumów) oraz `@Retention(RetentionPolicy.RUNTIME)` (widoczna przez refleksję). Własną nazwę beana nadaje się przez `@Component("myBean")`, a bez niej nazwa jest generowana z nazwy klasy.\n\nInne projekty Spring: **Spring Security** (uwierzytelnianie i autoryzacja), **Spring Data** (dostęp do danych: JPA, MongoDB, Redis...), **Spring Web** z MVC (REST i MVC) oraz **WebFlux** (programowanie reaktywne). Hierarchia adnotacji: `@Component` → `@Repository`, `@Service`, `@Controller` → `@RestController` → `@RestControllerAdvice`.'}],Sy=[{id:"w07-01",s:"a",q:"Czym jest Spring Boot wg wykładu?",a:["Automatyzacją Spring Framework (auto-konfiguracja, startery, wbudowane serwery)","Osobnym frameworkiem niezwiązanym ze Springiem","Biblioteką do testów","Serwerem aplikacji"],w:["Opiera się na Spring Framework.","Testy to Spring Test.","Zawiera wbudowany serwer, ale nim nie jest."],e:"Spring Framework pozwala budować aplikacje z komponentów. Spring Boot to automatyzacja Spring Framework: auto-konfiguracja, startery i wbudowane serwery."},{id:"w07-02",s:"a",q:"Jak startuje się projekt Spring Boot wg wykładu?",a:["Za pomocą Spring Initializr","Tylko ręcznie przez Gradle","Przez kopiowanie plików JAR","Przez Maven Archetype EJB"],w:["To tradycyjna procedura dla Spring bez Boot.","Nie kopiuje się JAR-ów.","EJB to inna technologia."],e:"Spring: procedura tradycyjna (np. Gradle Initializer); Spring Boot: Spring Initializr."},{id:"w07-03",s:"a",q:"Czy zwykły Spring Framework (bez Boot) ma wbudowany serwer HTTP?",a:["Nie","Tak, Tomcat zawsze","Tak, Jetty","Tak, Netty"],w:["Wbudowany serwer daje Spring Boot (jeśli rozwiązanie tego wymaga).","To nie Spring Framework.","To nie Spring Framework."],e:"Spring: brak serwera; Spring Boot: wbudowany, jeżeli rozwiązanie tego wymaga."},{id:"w07-04",s:"a",q:"Z jakich adnotacji składa się @SpringBootApplication?",a:["@Configuration, @EnableAutoConfiguration, @ComponentScan","@Component, @Service, @Repository","@Bean, @Autowired, @Value","@Controller, @ResponseBody"],w:["To stereotypy komponentów.","To definicja i wstrzykiwanie.","To @RestController."],e:"@SpringBootApplication = @Configuration + @EnableAutoConfiguration + @ComponentScan."},{id:"w07-05",s:"a",q:"Co robi SpringApplication.run(App.class, args)?",a:["Tworzy kontekst, inicjalizuje beany, opakowuje args w ApplicationArguments i uruchamia serwer HTTP (jeśli jest)","Tylko kompiluje aplikację","Tylko uruchamia serwer HTTP","Tworzy plik JAR"],w:["Kompilacja to zadanie narzędzi budowania.","Robi znacznie więcej.","To zadanie Mavena/Gradle."],e:"run tworzy kontekst na podstawie klasy konfiguracyjnej (App), inicjalizuje beany, ApplicationArguments, serwer."},{id:"w07-06",s:"a",q:"Gdzie powinna znajdować się klasa startowa z @SpringBootApplication?",a:["W głównym pakiecie projektu (komponenty w podpakietach)","W dowolnym podpakiecie","W pakiecie test","W katalogu resources"],w:["@ComponentScan skanuje pakiet klasy i podpakiety – w podpakiecie pominęłaby resztę.","To nie kod produkcyjny.","Resources to nie kod."],e:"@ComponentScan szuka komponentów w podpakietach pakietu klasy startowej."},{id:"w07-07",s:"a",q:"Klasa startowa jest w com.example.app, a serwis w com.example.service. Co się stanie (domyślny skan)?",a:["Serwis nie zostanie znaleziony – nie jest w podpakiecie com.example.app","Serwis zostanie znaleziony","Spring przeskanuje cały classpath","Błąd kompilacji"],w:["com.example.service nie jest podpakietem com.example.app.","Skan obejmuje tylko pakiet klasy startowej i podpakiety.","To błąd w czasie działania (brak beana), nie kompilacji."],e:"Domyślny @ComponentScan – pakiet klasy startowej i jego podpakiety."},{id:"w07-08",s:"b",q:"Jaka jest relacja @Repository, @Service, @Controller do @Component?",a:["Są specjalizacjami @Component (same są nią oznaczone)","Są od niej niezależne","@Component jest specjalizacją @Service","Zastępują @Bean"],w:["W ich definicji jest @Component.","Odwrotnie.","@Bean to inny mechanizm (metoda w konfiguracji)."],e:"Każda z nich ma w definicji @Component – różnice są semantyczne (rola w architekturze)."},{id:"w07-09",s:"b",q:"Na czym polegają różnice między @Component, @Service, @Repository, @Controller?",a:["Głównie semantyczne – oznaczają rolę komponentu; @Repository dodaje tłumaczenie wyjątków","Każda tworzy inny rodzaj kontenera","Tylko @Service tworzy beany","Różnią się scope"],w:["Kontener jest jeden.","Wszystkie tworzą beany.","Scope domyślnie singleton dla wszystkich."],e:"Różnice między tymi adnotacjami są głównie semantyczne, bo wskazują rolę komponentu. @Repository dodatkowo zamienia wyjątek SQLException na DataAccessException."},{id:"w07-10",s:"b",q:"Jaką dodatkową możliwość daje @Repository?",a:["Automatyczne tłumaczenie wyjątków bazodanowych na DataAccessException","Automatyczne generowanie zapytań SQL","Tworzenie tabel","Cache drugiego poziomu"],w:["Generowanie zapytań to Spring Data (interfejsy repozytoriów).","Tabele tworzy ORM.","Cache to Hibernate/@Cacheable."],e:"@Repository automatycznie tłumaczy wyjątki bazodanowe (SQLException) na DataAccessException."},{id:"w07-11",s:"b",q:"Czym jest @RestController?",a:["@Controller + @ResponseBody – zwracana wartość to ciało odpowiedzi HTTP","@Service dla REST","@Repository dla REST","Kontrolerem zwracającym tylko widoki HTML"],w:["Nie jest serwisem.","To nie repozytorium.","Właśnie nie zwraca widoków."],e:"@RestController = @Controller + @ResponseBody (na wszystkich metodach)."},{id:"w07-12",s:"b",q:"Co oznacza @ResponseBody?",a:["Wartość zwracana z metody jest ciałem odpowiedzi HTTP, a nie nazwą widoku","Odczyt ciała żądania","Ustawienie statusu HTTP","Walidację odpowiedzi"],w:["To @RequestBody.","To @ResponseStatus.","To @Valid."],e:"@ResponseBody oznacza, że wartość zwrócona z metody jest treścią odpowiedzi HTTP (np. JSON), a nie nazwą widoku."},{id:"w07-13",s:"b",q:'Metoda w klasie @Controller zwraca String "home" bez @ResponseBody. Co zobaczy klient?',a:["Wyrenderowany widok o nazwie home",'Tekst "home"','JSON {"home"}',"Błąd 500"],w:["Tekst byłby przy @RestController/@ResponseBody.","To nie JSON.","To normalne zachowanie MVC."],e:"W @Controller String to nazwa widoku; w @RestController – ciało odpowiedzi."},{id:"w07-14",s:"c",q:"Do czego służy @ControllerAdvice?",a:["Do centralizacji logiki wspólnej dla wielu kontrolerów (np. @ExceptionHandler)","Do definiowania endpointów","Do konfiguracji bazy","Do testów kontrolerów"],w:["Endpointy definiują kontrolery.","Baza to konfiguracja danych.","Testy to Spring Test."],e:"@ControllerAdvice – obsługa wyjątków (@ExceptionHandler), atrybuty modelu (@ModelAttribute), binding (@InitBinder)."},{id:"w07-15",s:"c",q:"Jaki jest odpowiednik @ControllerAdvice dla @RestController?",a:["@RestControllerAdvice","@RestAdvice","@ExceptionAdvice","@ApiAdvice"],w:["Nie istnieje.","Nie istnieje.","Nie istnieje."],e:"@RestControllerAdvice – odpowiednik dla komponentów REST."},{id:"w07-16",s:"c",q:"Co robi @RepositoryRestResource na interfejsie UserRepository extends CrudRepository<User, Long>?",a:["Eksponuje repozytorium jako zasób REST z automatycznymi endpointami CRUD","Tworzy tabelę users","Generuje kontroler MVC z widokami","Wymaga ręcznej implementacji metod"],w:["Tabele to sprawa ORM.","Generuje REST, nie widoki.","Metody CRUD są generowane automatycznie."],e:"Spring Data REST – GET/POST/PUT/DELETE /users generowane automatycznie."},{id:"w07-17",s:"c",q:"W jakim formacie Spring Data REST zwraca dane?",a:["HATEOAS JSON (z linkami do powiązanych zasobów)","XML","CSV","HTML"],w:["Domyślnie JSON.","Nie CSV.","Nie HTML."],e:"HATEOAS – Hypermedia As The Engine Of Application State; klient nie musi znać całej struktury API."},{id:"w07-18",s:"c",q:'Który endpoint NIE jest generowany automatycznie przez @RepositoryRestResource(path="users")?',a:["GET /users/top10 – własny, niezdefiniowany endpoint","GET /users","GET /users/{id}","DELETE /users/{id}"],w:["Lista jest generowana.","Szczegóły są generowane.","Usuwanie jest generowane."],e:"Generowane: GET /users, GET /users/{id}, POST, PUT /users/{id}, DELETE /users/{id}."},{id:"w07-19",s:"a",q:"Czy w Spring Boot klasa z @Configuration jest wymagana?",a:["Nie – istnieje auto-konfiguracja, ale można nią nadpisać lub rozszerzyć ustawienia","Tak, zawsze","Tak, ale tylko jedna","Nie można jej używać w Boot"],w:["W Spring bez Boot jest wymagana.","Nie jest wymagana w Boot.","Można jej używać."],e:"W Spring (bez Boot) klasa konfiguracyjna jest wymagana; w Boot – opcjonalna."},{id:"w07-20",s:"d",q:"Klasa Greeter bez adnotacji, a w @Configuration jest metoda @Bean public Greeter greeter(). Czy Greeter będzie beanem?",a:["Tak – bean definiuje metoda @Bean w klasie konfiguracyjnej","Nie – Greeter musi mieć @Component","Tylko w trybie prototype","Nie – @Bean działa tylko na klasach"],w:["@Component nie jest potrzebne przy @Bean.","Domyślnie singleton.","@Bean jest na metodach."],e:"Brak konieczności oznaczania klas adnotacjami – bean powstaje z metody @Bean."},{id:"w07-21",s:"d",q:"Definicja @Component ma @Target(ElementType.TYPE) i @Retention(RetentionPolicy.RUNTIME). Co to oznacza?",a:["Stosuje się ją do typów (klasy, interfejsy, enumy) i jest widoczna w runtime przez refleksję","Jest widoczna tylko w kodzie źródłowym","Stosuje się ją tylko do metod","Jest widoczna tylko w bytecode"],w:["Gdyby była SOURCE, Spring nie mógłby jej odczytać w runtime.","TYPE to klasy/interfejsy/enumy, nie metody.","CLASS nie byłoby widoczne przez refleksję."],e:"Definicja @Component: @Target(ElementType.TYPE), @Retention(RetentionPolicy.RUNTIME), @Documented."},{id:"w07-22",s:"d",q:"Jak nadać własną nazwę beanowi komponentu?",a:['@Component("myBean")','@Component(name = "myBean") jako obowiązkowe','@Name("myBean")',"Nie można – nazwa zawsze z klasy"],w:['Wartość podaje się jako value (domyślnie "").',"Nie ma @Name.","Można – jest to opcjonalne."],e:'String value() default ""; – opcjonalna nazwa; bez niej nazwa generowana z nazwy klasy.'},{id:"w07-23",s:"d",q:"Który projekt Spring służy do uwierzytelniania i autoryzacji?",a:["Spring Security","Spring Data","Spring Batch","Spring Cloud"],w:["Data – dostęp do danych.","Batch – przetwarzanie wsadowe.","Cloud – mikroserwisy."],e:"Do uwierzytelniania i autoryzacji służy projekt Spring Security."},{id:"w07-24",s:"d",q:"Który projekt Spring służy do programowania reaktywnego?",a:["Spring WebFlux","Spring MVC","Spring Batch","Spring Test"],w:["MVC – klasyczne (blokujące) aplikacje web/REST.","Batch – wsadowo.","Test – testy."],e:"Spring Web: MVC (REST/MVC) i WebFlux (reaktywnie)."},{id:"w07-25",s:"a",q:"Jak nazywają się zależności Spring Boot włączające auto-konfigurację danego obszaru?",a:["Startery spring-boot-starter-...","Pluginy spring-plugin-...","Moduły spring-module-...","Rozszerzenia spring-ext-..."],w:["Nie istnieją takie nazwy.","Nie istnieją takie nazwy.","Nie istnieją takie nazwy."],e:"Zależności Spring Boot włączające auto-konfigurację danego obszaru to startery, nazywane spring-boot-starter-..."},{id:"w07-26",s:"d",q:"Do czego służy Spring Data?",a:["Do dostępu do danych (JPA, MongoDB, Redis…)","Do mikroserwisów","Do AI","Do przetwarzania wsadowego"],w:["To Spring Cloud.","To Spring AI.","To Spring Batch."],e:"Spring Data służy do dostępu do danych (JPA, MongoDB, Redis i innych)."},{id:"w07-27",s:"a",q:"Jaki komunikat wyświetla Spring Boot, gdy nie ustawiono profilu?",a:['No active profile set, falling back to 1 default profile: "default"',"Profile error – application stopped","Using profile prod","No beans found"],w:["Aplikacja się nie zatrzymuje.","Domyślny profil to default, nie prod.","To nie ten komunikat."],e:'Gdy nie ustawiono profilu, w logu startowym pojawia się informacja o użyciu profilu domyślnego: No active profile set, falling back to 1 default profile: "default".'},{id:"w07-28",s:"a",q:"Co dzieje się przy starcie aplikacji ze spring-boot-starter (bez web)?",a:["Kontekst startuje bez serwera HTTP i aplikacja się kończy po wykonaniu","Uruchamia się Tomcat na porcie 8080","Aplikacja nie startuje bez web","Wymagany jest plik XML"],w:["Serwer jest tylko, jeśli projekt go zawiera (np. starter-web).","Startuje poprawnie.","XML nie jest wymagany."],e:"Serwer HTTP uruchamia się, jeżeli jest częścią projektu."},{id:"w07-29",s:"a",q:"Co przyjmuje SpringApplication.run jako pierwszy argument?",a:["Klasę konfiguracyjną (np. App.class)","Ścieżkę do pliku XML","Nazwę pakietu jako String","Instancję kontrolera"],w:["W przykładzie nie ma XML.","Nie String pakietu.","Nie instancję."],e:"SpringApplication.run(App.class, args) – kontekst tworzony na podstawie przekazanej klasy konfiguracyjnej."},{id:"w07-30",s:"d",q:"Które stwierdzenie o hierarchii adnotacji Spring jest prawdziwe?",a:["@RestControllerAdvice wywodzi się z @RestController, a ta z @Controller i @Component","@Component wywodzi się z @Service","@Configuration nie jest komponentem","@Repository wywodzi się z @Service"],w:["Odwrotnie.","@Configuration też jest pod @Component.","Oba są bezpośrednio pod @Component."],e:"Hierarchia adnotacji: @Component jest bazą dla @Repository, @Service i @Controller. Z @Controller wywodzi się @RestController, a z niego @RestControllerAdvice. Osobno są @ControllerAdvice i @Configuration."}],Cy={id:by,title:fy,sections:hy,questions:Sy},Ty="kpwa",Py="Komponentowe podejście do wytwarzania aplikacji",Ay="KPWA",Dy="Salesforce: platforma, model danych, Apex, LWC, automatyzacja.",vy=["w01","w02","w03","w04","w05","w06","w07","w08","w09","w10","w11","w12","w13","w14","w15"],Ny={id:Ty,name:Py,short:Ay,description:Dy,lectures:vy},My="w01",Ry="W1 · Platforma Salesforce",Ly=[{id:"a",title:"Salesforce: od SaaS do PaaS",text:"Salesforce zaczynał w 2000 roku jako **CRM w modelu SaaS**, czyli gotowa aplikacja używana przez internet. CRM to skrót od Customer Relationship Management, czyli zarządzanie relacjami z klientami. W 2008 roku pojawiła się Force.com, czyli **platforma PaaS** do tworzenia własnych aplikacji biznesowych."},{id:"b",title:"Org i jego rodzaje",text:`**Org** (Organization) to wydzielone środowisko Salesforce typu PaaS, które działa w chmurze Salesforce. Przechowuje dane (także użytkowników i ich uprawnienia), kod oraz konfiguracje. Serwerami i systemem operacyjnym zajmuje się Salesforce, na tym polega istota PaaS.

Rodzaje Org-ów:
• **Sandbox** (testowy) – kopia innego Org-a, zwykle produkcyjnego,
• **Scratch Org** – Org tymczasowy, tworzony z innego Org-a (Dev Hub), więc nie jest samodzielny,
• **Trailhead Playground** – do celów edukacyjnych,
• **Developer Edition** – darmowy Org developerski.`},{id:"c",title:"AppExchange",text:"**AppExchange** to sklep (marketplace) z komercyjnymi aplikacjami dla Salesforce."},{id:"d",title:"Customer 360 – gotowe aplikacje SaaS",text:`**Customer 360** to zestaw usług SaaS dla biznesu, czyli gotowych aplikacji. Przykłady:
• **Sales** – organizacja i zarządzanie sprzedażą,
• **Marketing** – kampanie marketingowe i pozyskiwanie klientów,
• **Commerce** – handel elektroniczny,
• **Field Service** – obsługa usług realizowanych w terenie,
• **Revenue Management** – zarządzanie ofertami, cenami, umowami i przychodami.

Dopisek „360” w nazwie (np. Sales 360) to nazwa technologii oferowanej w postaci aplikacji. Ozdobnikami marketingowymi są natomiast „Cloud” i „Agentforce” (Sales Cloud, Agentforce Sales).`},{id:"e",title:"Aplikacje w Org-u",text:"Aplikacje w Org-u uruchamia się za pomocą **App Launchera**. To, które aplikacje SaaS są dostępne, zależy od wykupionej licencji. W Org-ach edukacyjnych i developerskich dostępny jest szeroki wybór aplikacji. Aplikacje utworzone przez dewelopera są automatycznie dodawane do zbioru aplikacji Org-a. Spójność danych zapewnia to, że wszystkie aplikacje działają na tym samym modelu danych."},{id:"f",title:"Experience Cloud i Lightning Experience",text:"**Experience Cloud** służy do budowy aplikacji internetowych dla użytkowników zewnętrznych, czyli klientów i partnerów (logowanie, samoobsługa, spersonalizowane serwisy). Standardowe aplikacje Salesforce są natomiast dla użytkowników wewnętrznych, czyli pracowników firmy. Standardowy wygląd aplikacji Salesforce to styl **Lightning Experience**."},{id:"g",title:"Narzędzia dewelopera Salesforce",text:`Narzędzia dewelopera dzielą się na grupy:
• **low-code**: Object Manager, Flow, Lightning App Builder,
• **pro-code**: Apex, LWC, SOQL/SOSL, API,
• **integracja**: Platform Events, API (REST, GraphQL), MuleSoft,
• **AI**: prompt engineering, generatywna AI, agenci AI.

Developer Salesforce analizuje i rozumie wymagania biznesowe, a następnie dobiera najlepsze rozwiązanie spośród tych technologii.`},{id:"h",title:"Wydania platformy i wersje API",text:`Salesforce wydaje trzy główne wydania rocznie: **Spring** (luty), **Summer** (czerwiec) i **Winter** (październik). Każde wydanie podnosi numer wersji API o 1: Spring'26 to 66.0, Summer'26 to 67.0, a Winter'27 to 68.0.

Nowe wersje API zachowują zgodność ze starszymi przez co najmniej 3 lata. Wersja API jest zapisywana w metadanych komponentu lub projektu. Określa kontrakt i zachowanie platformy dostępne dla danego klienta, komponentu lub żądania, a więc wpływa na dostępne możliwości i zachowanie kodu.`},{id:"i",title:"Inne platformy aplikacyjne",text:"Alternatywy dla Salesforce: **Microsoft Power Platform** (low-code i no-code, mocno zintegrowana z Microsoft 365, Azure i Dynamics 365) oraz **Oracle APEX** (low-code PaaS związany z bazą Oracle; nie mylić z językiem Apex w Salesforce). Wspólną cechą współczesnych platform aplikacyjnych jest integracja z AI i możliwość tworzenia agentów AI."},{id:"j",title:"Zakres informatyki biznesowej",text:"W zakresie informatyki biznesowej są między innymi: analiza wymagań, modelowanie procesów, automatyzacja, architektura systemów przedsiębiorstwa, AI w biznesie i adaptacja gotowych rozwiązań. Poza zakresem są: budowanie i utrzymywanie infrastruktury, administracja serwerami, tworzenie aplikacji od podstaw i podstawowe problemy informatyki."}],Iy=[{id:"w01-01",s:"a",q:"W jakim modelu Salesforce zaczynał w 2000 roku?",a:["CRM w modelu SaaS","Platforma aplikacyjna w modelu PaaS","Infrastruktura w modelu IaaS","Oprogramowanie instalowane lokalnie (on-premise)"],e:"Salesforce zaczynał w 2000 roku jako CRM w modelu SaaS. Platforma Force.com (PaaS) pojawiła się dopiero w 2008 roku."},{id:"w01-02",s:"a",q:"Co pojawiło się w Salesforce w 2008 roku?",a:["Force.com – platforma PaaS do tworzenia aplikacji biznesowych","Pierwszy CRM w modelu SaaS","Lightning Web Components","Agentforce 360"],e:"W 2008 roku pojawiła się Force.com, czyli platforma w modelu PaaS do tworzenia aplikacji biznesowych."},{id:"w01-03",s:"a",q:"Co oznacza skrót CRM?",a:["Customer Relationship Management","Cloud Resource Manager","Customer Record Model","Component Runtime Module"],e:"CRM = Customer Relationship Management – zarządzanie relacjami z klientami."},{id:"w01-04",s:"b",q:"Cz
