r query = _context.Quotes.Where(x => x.Id > 0); (bez ToList). Czy zapytanie SQL zostało już wykonane?",a:["Nie – zostanie wykonane dopiero przy materializacji/iteracji","Tak, natychmiast","Tak, ale bez WHERE","Nie, nigdy nie zostanie wykonane"],e:"Notatka wykładowcy: nie ma ToList(), więc zapytanie nie zostanie zmaterializowane. Wykona się przy iteracji (np. w widoku).",w:["Nie natychmiast – jest leniwe.","WHERE zostanie przetłumaczone na SQL.","Wykona się przy iteracji."]},{id:"w03-62",q:"Która metoda materializuje zapytanie LINQ?",a:["ToList()","Where()","Select()","OrderBy()"],e:"Konwersje materializujące: ToArray(), ToList(). Wymienione są też AsEnumerable() i AsQueryable().",w:["Where nie materializuje.","Select nie materializuje.","OrderBy nie materializuje."]},{id:"w03-63",q:"Gdzie obliczane są wyrażenia LINQ dla SZBD w EF Core?",a:["Na serwerze bazodanowym; jeśli operacji nie da się przetłumaczyć – wyjątek","Zawsze w pamięci aplikacji","W przeglądarce","Losowo"],e:"Wyrażenia są ewaluowane na serwerze bazy. Gdyby operacja miała być wykonana po stronie aplikacji, EF rzuci wyjątek (wydajność).",w:["Nie w pamięci – na serwerze bazy.","Nie w przeglądarce.","Nie losowo."]},{id:"w03-64",q:"Gdzie konfiguruje się mapowanie za pomocą Fluent API?",a:["W metodzie OnModelCreating(ModelBuilder) DbContextu","W Program.cs w AddDbContext","W atrybutach klasy","W appsettings.json"],e:"Fluent API to wzorzec builder w OnModelCreating, np. modelBuilder.Entity<Quote>().HasKey(…).",w:["AddDbContext to rejestracja.","Atrybuty to alternatywa dla fluent.","appsettings nie konfiguruje mapowania."]},{id:"w03-65",q:"Co robi modelBuilder.Entity<Quote>().HasKey(c => new { c.Id, c.Date });?",a:["Definiuje złożony klucz główny z Id i Date","Tworzy indeks na Date","Definiuje relację 1:n","Tworzy dwie tabele"],e:"HasKey z typem anonimowym definiuje klucz złożony.",w:["To nie indeks.","Relację opisują HasOne/WithMany.","Tworzy jedną tabelę."]},{id:"w03-66",q:"Co robi mechanizm migracji EF Core?",a:["Porównuje bieżący stan modelu z poprzednim i generuje operacje CREATE/ALTER/DROP","Przenosi dane między serwerami","Kopiuje bazę do chmury","Generuje klasy z bazy"],e:"Migracje porównują stan modelu z poprzednim i przygotowują operacje na schemacie. Pozwalają też zasiać dane.",w:["Nie przenosi danych między serwerami.","Nie kopiuje do chmury.","Generowanie klas z bazy to scaffold."]},{id:"w03-67",q:"Które polecenie aplikuje migracje do bazy danych?",a:["dotnet ef database update","dotnet ef migrations add","dotnet ef scaffold","dotnet build"],e:"dotnet ef migrations add tworzy migrację, a dotnet ef database update aplikuje ją do bazy.",w:["migrations add tylko tworzy migrację.","scaffold to Database First.","build nie dotyka bazy."]},{id:"w03-68",q:"Jaką pułapkę migracji z SQLite zanotował wykładowca?",a:["SQLite nie ma ALTER TABLE DROP COLUMN","SQLite nie obsługuje kluczy głównych","SQLite nie wspiera migracji w ogóle","SQLite wymaga hasła"],e:"Notatka: SQLite nie ma ALTER TABLE DROP COLUMN (wymaga przebudowy tabeli).",w:["Ma klucze główne.","Migracje są wspierane.","SQLite nie wymaga hasła."]},{id:"w03-69",q:"Czym jest navigation property w EF Core?",a:["Właściwością wskazującą na powiązaną encję/kolekcję (nie typ skalarny)","Kluczem głównym","Właściwością [NotMapped]","Właściwością typu string"],e:"Navigation property to właściwość, której nie da się zmapować na typ skalarny (np. Author Author, List<Quote> Quotes). Na jej podstawie powstają relacje.",w:["Klucz główny to Id.","[NotMapped] wyłącza mapowanie.","String to typ skalarny."]},{id:"w03-70",q:"Jakie domyślne zachowanie usuwania tworzą konwencje dla wymaganej relacji 1:n?",a:["Usuwanie kaskadowe","Ustawianie null","Brak akcji","Blokada usunięcia"],e:"Konwencje aktywują usuwanie kaskadowe dla wymaganych połączeń oraz ustawianie null dla niewymaganych.",w:["Ustawianie null dotyczy niewymaganych relacji.","Domyślnie jest kaskada.","Blokada nie jest domyślna."]},{id:"w03-71",q:"Jak wyrazić relację 1:n Quote → Author w Fluent API?",a:["modelBuilder.Entity<Quote>().HasOne(p => p.Author).WithMany(b => b.Quotes);","modelBuilder.Entity<Quote>().HasMany(p => p.Author).WithOne();","modelBuilder.Relation<Quote, Author>(1, n);","modelBuilder.Entity<Author>().HasKey(a => a.Quotes);"],e:"Quote ma jednego Author (HasOne), a Author ma wiele Quotes (WithMany).",w:["Odwrotnie – HasOne z perspektywy Quote.","Nie ma takiej metody.","Kolekcja to nie klucz."]},{id:"w03-72",q:"Czego wymaga relacja wiele-do-wielu w EF Core (konwencja)?",a:["Kolekcji po obydwu stronach relacji (np. ICollection<Tag> i ICollection<Quote>)","Jawnej klasy tabeli łączącej zawsze","Atrybutu [ManyToMany]","Klucza złożonego w obu tabelach"],e:"Relacje n:n wymagają kolekcji po obu stronach. Często używa się ICollection<T> zamiast List<T>.",w:["Od EF Core 5 nie trzeba jawnej klasy łączącej.","Nie ma [ManyToMany].","Klucz złożony nie jest wymagany."]},{id:"w03-73",q:"Czy EF Core domyślnie ładuje dane z tabel powiązanych (np. Author dla Quote)?",a:["Nie – trzeba je włączyć przez Include()/ThenInclude()","Tak, zawsze","Tak, ale tylko dla relacji n:n","Tylko w trybie InMemory"],e:"Dane z tabel podrzędnych nie są wybierane automatycznie. Włącza się je przez Include() i ThenInclude().",w:["Nie zawsze – tylko z Include.","Dotyczy wszystkich relacji.","Nie zależy od providera."]},{id:"w03-74",q:'Kod: _context.Authors.Where(x => x.Name == "Otto").Include(x => x.Quotes).ThenInclude(x => x.Tags). Co zostanie załadowane?',a:["Autorzy o imieniu Otto z ich cytatami i tagami tych cytatów","Tylko autorzy","Wszystkie cytaty i tagi niezależnie od autora","Tylko tagi"],e:"Include ładuje kolekcję Quotes, a ThenInclude kolejny poziom, czyli Tags każdego cytatu.",w:["Include ładuje też cytaty.","Filtr Where zawęża autorów.","Ładuje autorów, cytaty i tagi."]},{id:"w03-75",q:"Kod: var q = _context.Quotes.First(x => x.Id == 1); return View(q); a widok wyświetla @Model.Author.Name. Co się stanie (bez lazy loading)?",a:["Author będzie null → NullReferenceException","Author zostanie automatycznie doczytany","Wyświetli pusty napis bez błędu","Błąd kompilacji"],e:"Bez Include(n => n.Author) navigation property nie jest ładowana i ma wartość null. W przykładzie z kodu użyto _context.Quotes.Include(n => n.Author).",w:["Bez lazy loading nic nie jest doczytywane.","Dereferencja null rzuca wyjątek.","Kompiluje się poprawnie."]},{id:"w03-76",q:"Kiedy zmiany w śledzonych encjach zostaną zapisane do bazy?",a:["Dopiero po wywołaniu SaveChanges()/SaveChangesAsync()","Natychmiast po zmianie właściwości","Po zakończeniu żądania HTTP automatycznie","Po wywołaniu ToList()"],e:"Encje są śledzone (tracked), ale zmiany nie zostaną zapisane, dopóki nie zostanie wywołane SaveChanges().",w:["Zmiana właściwości jest tylko śledzona.","Nie ma automatycznego zapisu na koniec żądania.","ToList odczytuje, nie zapisuje."]},{id:"w03-77",q:'Kod Update(): var e = _context.Authors.First(x => x.AuthorId == 1); e.Name = "Otto Apocalypse"; _context.SaveChanges(); Czy potrzebne jest wywołanie _context.Update(e)?',a:["Nie – encja jest śledzona, SaveChanges wykryje zmianę","Tak, inaczej zmiana nie zostanie zapisana","Tak, oraz Attach(e)","Trzeba usunąć i dodać encję ponownie"],e:"Encja pobrana z kontekstu jest śledzona, więc zmiana właściwości i SaveChanges() wystarczą.",w:["Update() nie jest potrzebne dla śledzonej encji.","Attach nie jest potrzebne.","Usuwanie i dodawanie jest zbędne."]},{id:"w03-78",q:"Do czego służą „zaślepki” (stub) z _context.Attach(new Author { AuthorId = 1 })?",a:["Do dodawania obiektów powiązanych bez pełnego wyszukiwania ich w bazie","Do usuwania rekordów","Do testów jednostkowych","Do migracji"],e:"Zaślepki pozwalają powiązać nowy Quote z istniejącym Author bez jego pobierania. Attach oznacza encję jako istniejącą.",w:["Nie służą do usuwania.","To nie mocki testowe.","To nie migracje."]},{id:"w03-79",q:"Jak w EF Core pobrać dane zwykłym poleceniem SQL mapowanym na obiekty?",a:["FromSqlRaw()","ExecuteSql() bez mapowania","RawQuery()","Sql()"],e:'FromSqlRaw(), np. _context.Quotes.FromSqlRaw("SELECT * FROM Quotes WHERE quote_id = 3 LIMIT 1").',w:["ExecuteSql nie mapuje wyników na encje.","Nie ma RawQuery.","Nie ma Sql()."]},{id:"w03-80",q:"Czym jest Dapper?",a:["Prostym mapperem obiektów (mikro-ORM) bez śledzenia obiektów","Oficjalnym ORM Microsoftu","Bazą dokumentową","Narzędziem migracji"],e:"Dapper mapuje wyniki „zwykłych” zapytań SQL na typy .NET i nie ma mechanizmu śledzenia.",w:["Nie jest oficjalny.","To nie baza danych.","To nie narzędzie migracji."]},{id:"w03-81",q:"Jaką bazą jest LiteDB?",a:["Embedded (jak SQLite), ale dokumentową (jak Mongo), napisaną w C#","Bazą time-series","Bazą wektorową","Bazą klucz-wartość w chmurze"],e:"LiteDB to embedded, dokumentowa baza w jednej bibliotece (~450 KB), w pełni w C#.",w:["Time-series to InfluxDB.","Wektorowa to Qdrant.","Nie K-V w chmurze."]},{id:"w03-82",q:"Jakim typem bazy jest InfluxDB?",a:["Time-series (szeregi czasowe)","Wektorowa","Dokumentowa z dostępem HTTP","Klucz-wartość"],e:"InfluxDB to time-series, Qdrant to baza wektorowa, a CouchDB to baza dokumentowa z dostępem przez HTTP.",w:["Wektorowa to Qdrant.","Dokumentowa z dostępem HTTP to CouchDB.","K-V to Redis."]},{id:"w03-83",q:"Jakim typem bazy jest Qdrant?",a:["Wektorowa","Time-series","Relacyjna","Grafowa"],e:"Qdrant to baza wektorowa z oficjalnym SDK do .NET.",w:["Time-series to InfluxDB.","Nie relacyjna.","Nie grafowa."]},{id:"w03-84",q:"Który z poniższych przykładów to baza typu klucz-wartość wymieniona na wykładzie?",a:["Redis","InfluxDB","Qdrant","LiteDB"],e:"K-V: Redis, Azure Cosmos DB, RocksDB, FASTER, ZoneTree.",w:["InfluxDB to time-series.","Qdrant to baza wektorowa.","LiteDB to dokumentowa embedded."]},{id:"w03-85",q:"Kod: p.Select(x => x.Age).Sum() dla osób o wieku 19 i 40019. Jaki wynik?",a:["40038","40019","19","2"],e:"Select wybiera wiek, a Sum sumuje: 19 + 40019 = 40038.",w:["To tylko jeden wiek.","To tylko drugi wiek.","2 to liczba osób (Count), nie suma."]}],op={id:Yz,title:ep,questions:ap},ip="w04",np="W4 · Web API i Minimal APIs (na podstawie kodu)",tp=[{id:"w04-01",q:"Po jakiej klasie dziedziczą kontrolery Web API w przykładach (bez obsługi widoków)?",a:["ControllerBase","Controller","PageModel","ApiController"],e:"Kontrolery API dziedziczą po ControllerBase (bez widoków). Controller dodaje obsługę widoków (MVC). [ApiController] to atrybut, nie klasa bazowa.",w:["Controller dodaje obsługę widoków (MVC).","PageModel to Razor Pages.","[ApiController] to atrybut, a nie klasa bazowa."]},{id:"w04-02",q:'Co oznacza [Route("[controller]")] na klasie ProviderController?',a:["Ścieżka bazowa to nazwa kontrolera bez przyrostka: /Provider","Ścieżka to dosłownie /[controller]","Ścieżka to /ProviderController","Kontroler nie ma ścieżki"],e:"Token [controller] zostaje zastąpiony nazwą kontrolera bez „Controller”, więc /Provider.",w:["Token [controller] jest podmieniany na nazwę.","Przyrostek Controller jest obcinany.","Ścieżka jest – /Provider."]},{id:"w04-03",q:'ForecastController ma [Route("[controller]")], a akcja [HttpGet("/forecast/{city}")]. Pod jakim adresem jest akcja?',a:["/forecast/{city} – szablon zaczynający się od / jest bezwzględny","/Forecast/forecast/{city}","/Forecast/{city}","/api/forecast/{city}"],e:"Szablon akcji zaczynający się od '/' ignoruje trasę kontrolera.",w:["Szablon z wiodącym / ignoruje trasę kontrolera.","Segment „forecast” jest częścią szablonu.","Prefiksu api nie ma."]},{id:"w04-04",q:"CitiesProvider z miastami Warsaw, Paris, Beijing. Co zwróci GET /Provider/Rome (GetById: FirstOrDefault, null → NotFound())?",a:["404 Not Found","200 z null","400 Bad Request","500"],e:"FirstOrDefault zwraca null dla braku dopasowania, więc NotFound(), czyli 404.",w:["Kod jawnie zwraca NotFound przy null.","Nie 400 – żądanie jest poprawne.","Nie ma błędu serwera."]},{id:"w04-05",q:"Co zwróci GET /Provider w przykładzie (metoda zwraca IEnumerable<string>)?",a:['200 z tablicą JSON ["Warsaw","Paris","Beijing"]',"Widok HTML z listą","204 No Content","XML z listą zawsze"],e:"Web API serializuje zwracany obiekt domyślnie do JSON z kodem 200.",w:["To API – nie zwraca widoku.","Lista nie jest pusta – 3 miasta.","Domyślny format to JSON."]},{id:"w04-06",q:"Akcja Post ma [HttpPost][Authorize]. Co zwróci POST /Provider bez tokenu JWT?",a:["401 Unauthorized","201 Created","400 Bad Request","403 Forbidden"],e:"[Authorize] wymaga uwierzytelnienia. Brak tokenu przy schemacie JwtBearer daje challenge, czyli 401.",w:["Bez tokenu nie przejdzie do akcji.","Do walidacji modelu nawet nie dojdzie.","403 jest, gdy tożsamość znana, ale brak uprawnień."]},{id:"w04-07",q:"Jaki kod HTTP zwraca CreatedAtAction(...) w akcji Post?",a:["201 Created","200 OK","202 Accepted","204 No Content"],e:"CreatedAtAction zwraca 201 z nagłówkiem Location wskazującym na podaną akcję.",w:["200 to Ok().","202 to Accepted().","204 to NoContent()."]},{id:"w04-08",q:"CitiesProvider jest zarejestrowany przez AddSingleton(_ => new CitiesProvider { … }). Po udanym POST z nowym miastem, czy kolejne GET /Provider je zwróci?",a:["Tak – singleton żyje przez cały czas działania aplikacji (do restartu)","Nie – każde żądanie dostaje nową instancję","Tak, ale tylko dla tego samego użytkownika","Nie – dane są zapisywane dopiero w bazie"],e:"Singleton to jedna instancja na aplikację, więc lista w pamięci jest współdzielona do restartu. Przy Transient lub Scoped zmiana by przepadła.",w:["Singleton nie daje nowej instancji na żądanie.","Nie zależy od użytkownika.","Bazy tu nie ma – lista w pamięci."]},{id:"w04-09",q:"Jaka byłaby konsekwencja zarejestrowania CitiesProvider jako AddScoped zamiast AddSingleton?",a:["Dodane miasto zniknęłoby po zakończeniu żądania (nowa lista dla każdego żądania)","Brak różnicy","Aplikacja by się nie uruchomiła","Miasta byłyby współdzielone między wszystkimi"],e:"Scoped to jedna instancja na żądanie HTTP, więc zmiany w liście w pamięci nie przetrwałyby.",w:["Różnica jest – czas życia instancji.","Aplikacja uruchomi się normalnie.","Scoped to nie współdzielenie globalne."]},{id:"w04-10",q:"Model City ma public required string Name { get; set; }. Co oznacza required?",a:["Właściwość musi być ustawiona przy tworzeniu obiektu (inicjalizator/deserializacja)","To atrybut walidacji [Required] z data annotations","Właściwość nie może być zmieniona","Właściwość jest kluczem głównym"],e:"required (C# 11) to składnik obowiązkowy przy inicjalizacji. To słowo kluczowe języka, nie atrybut [Required].",w:["[Required] to atrybut walidacji – required to słowo kluczowe C# 11.","To nie readonly/init.","Kluczem jest Id, nie Name."]},{id:"w04-11",q:"Co robi atrybut [ApiController]?",a:["Włącza zachowania API, m.in. automatyczną odpowiedź 400 przy niepoprawnym modelu i wiązanie z body","Rejestruje kontroler w DI","Generuje dokumentację Swagger","Wymaga uwierzytelnienia"],e:"[ApiController] włącza automatyczną walidację modelu (400 ValidationProblem) i inferencję źródeł wiązania. Uwierzytelnienia nie wymusza.",w:["Rejestrację robi AddControllers.","Dokumentację generuje Swagger.","Uwierzytelnianie to [Authorize]."]},{id:"w04-12",q:"Do czego służy [ProducesResponseType(StatusCodes.Status404NotFound)] na akcji?",a:["Do opisania możliwych odpowiedzi w dokumentacji OpenAPI/Swagger","Wymusza zwrócenie 404","Zmienia domyślny kod błędu","Włącza cache odpowiedzi"],e:"ProducesResponseType dokumentuje możliwe kody i typy odpowiedzi dla OpenAPI. Samo nie zmienia działania akcji.",w:["Nie wymusza – tylko dokumentuje.","Nie zmienia kodu błędu.","Cache to [ResponseCache]."]},{id:"w04-13",q:"Jak włączyć komentarze XML (///) w dokumentacji Swaggera w przykładzie?",a:["options.IncludeXmlComments(ścieżka do pliku .xml assembly) w AddSwaggerGen","app.UseXmlComments()","Atrybut [XmlDoc] na kontrolerze","Działa automatycznie bez konfiguracji"],e:'AddSwaggerGen(o => o.IncludeXmlComments(Path.Combine(AppContext.BaseDirectory, "<Assembly>.xml"))). Trzeba też generować plik XML przy kompilacji.',w:["Nie ma UseXmlComments.","Nie ma [XmlDoc].","Wymaga konfiguracji i wygenerowania pliku XML."]},{id:"w04-14",q:"Które middleware w przykładzie udostępniają Swaggera (Swashbuckle) w trybie Development?",a:["app.UseSwagger(); app.UseSwaggerUI();","app.MapControllers();","app.UseRouting();","app.UseOpenApiDocs();"],e:"UseSwagger() generuje dokument JSON, a UseSwaggerUI() interfejs. W przykładzie są włączane tylko w Development.",w:["MapControllers mapuje endpointy.","UseRouting to routing.","UseOpenApiDocs nie istnieje."]},{id:"w04-15",q:"W nowszym przykładzie użyto builder.Services.AddOpenApi() i app.MapOpenApi(). Pod jakim adresem jest dokument OpenAPI?",a:["/openapi/v1.json","/swagger/v1/swagger.json","/api/docs","/openapi.yaml"],e:'MapOpenApi() wystawia /openapi/v1.json. Dlatego UseSwaggerUI wskazuje SwaggerEndpoint("/openapi/v1.json", …).',w:["/swagger/v1/swagger.json to domyślna ścieżka Swashbuckle (UseSwagger).","/api/docs nie jest zdefiniowane.","Format to JSON, nie YAML."]},{id:"w04-16",q:"Co dodaje app.MapScalarApiReference() w przykładzie OpenAPI?",a:["Alternatywny interfejs (Scalar) do przeglądania dokumentacji API","Ograniczanie liczby żądań","Wersjonowanie API","Uwierzytelnianie JWT"],e:"Scalar to alternatywny UI dla dokumentacji OpenAPI, obok Swagger UI.",w:["Rate limiting to AddRateLimiter.","Wersjonowanie to AddApiVersioning.","JWT to AddJwtBearer."]},{id:"w04-17",q:"Czym są Minimal APIs?",a:["Definiowaniem endpointów bezpośrednio w Program.cs (app.MapGet/MapPost) bez kontrolerów","Kontrolerami bez atrybutów","Razor Pages bez widoków","Bibliotekami do kompresji odpowiedzi"],e:'Minimal APIs to endpointy definiowane lambdami: app.MapGet("/…", () => …), zwykle z top-level statements.',w:["Kontrolery bez atrybutów to nadal kontrolery.","Razor Pages to strony.","To nie kompresja."]},{id:"w04-18",q:'Kod: app.MapPost("/test", () => new { status = 3 }); Co zwróci POST /test?',a:['200 z JSON {"status":3}',"201 Created","204 No Content","405 Method Not Allowed"],e:"Zwrócony obiekt jest serializowany do JSON z kodem 200.",w:["201 wymaga Created/CreatedAtAction.","Zwraca treść – nie 204.","POST jest zmapowany."]},{id:"w04-19",q:'Kod: app.MapPost("/test", …). Co zwróci GET /test?',a:["405 Method Not Allowed","200 OK","404 zawsze","500"],e:"Endpoint istnieje tylko dla POST, więc GET pod tym adresem daje 405 (ścieżka pasuje, czasownik nie).",w:["Endpoint obsługuje tylko POST.","Ścieżka istnieje – zły jest czasownik (405).","To nie błąd serwera."]},{id:"w04-20",q:'Kod: app.MapPost("/test-body", ([FromBody] WeatherForecast f) => f.TemperatureC > 0 ? Results.Accepted() : Results.BadRequest()); Co zwróci body z TemperatureC = 0?',a:["400 Bad Request","202 Accepted","200 OK","201 Created"],e:"0 > 0 to fałsz, więc Results.BadRequest() (400). Dla wartości dodatnich Accepted() (202).",w:["Accepted tylko dla > 0.","200 nie jest zwracane.","201 nie jest zwracane."]},{id:"w04-21",q:"Jaki kod HTTP zwraca Results.Accepted()?",a:["202","200","201","204"],e:"Accepted to 202: żądanie przyjęte do przetworzenia.",w:["200 to Ok.","201 to Created.","204 to NoContent."]},{id:"w04-22",q:"Co robi [FromServices] przy parametrze lambdy Minimal API, np. ([FromServices] ILogger<Program> logger) => …?",a:["Wstrzykuje parametr z kontenera DI","Pobiera parametr z body","Pobiera parametr z nagłówka","Rejestruje serwis w DI"],e:"[FromServices] wiąże parametr z kontenerem DI, czyli wstrzykuje go do handlera.",w:["Body to [FromBody].","Nagłówek to [FromHeader].","Rejestracja jest w builder.Services."]},{id:"w04-23",q:"Rekord: public int TemperatureF => 32 + (int)(TemperatureC / 0.5556); Ile wynosi TemperatureF dla TemperatureC = 0?",a:["32","0","-17","33"],e:"0 / 0.5556 = 0, więc 32 + 0 = 32.",w:["To °C, a wzór dodaje 32.","Nie ma wartości ujemnej przy 0 °C.","(int)0 = 0, więc 32."]},{id:"w04-24",q:"Ten sam wzór TemperatureF = 32 + (int)(TemperatureC / 0.5556). Ile wynosi dla TemperatureC = 10?",a:["49","50","42","18"],e:"10 / 0.5556 ≈ 17,998, a rzutowanie (int) obcina do 17, więc 32 + 17 = 49 (nie 50!).",w:["Pułapka: (int) obcina 17,998 do 17.","42 to błędny rachunek.","18 to wynik dzielenia przed dodaniem 32."]},{id:"w04-25",q:"Ile elementów zwróci Enumerable.Range(1, 5).Select(…).ToArray() w endpoincie /weatherforecast?",a:["5","4","6","1"],e:"Range(start: 1, count: 5) daje 1,2,3,4,5, czyli 5 prognoz.",w:["Range(1, 5) to 5 liczb, a nie 1..4.","Nie 6 – drugi parametr to liczba elementów.","Select nie zmienia liczby elementów."]},{id:"w04-26",q:"Jaki zakres wartości zwraca Random.Shared.Next(-20, 55)?",a:["Od -20 do 54 (górna granica wyłączna)","Od -20 do 55 włącznie","Od -19 do 55","Od 0 do 55"],e:"Next(min, max): min włącznie, max wyłącznie.",w:["Górna granica jest wyłączna.","-20 jest włączone.","Dolna granica to -20."]},{id:"w04-27",q:'Co robi .WithName("GetWeatherForecast") na endpoincie Minimal API?',a:["Nadaje endpointowi nazwę (np. do generowania linków / operationId w OpenAPI)","Zmienia adres URL","Wymaga uwierzytelnienia","Ustawia nazwę pliku odpowiedzi"],e:"WithName nadaje nazwę endpointu, używaną m.in. jako operationId w OpenAPI. WithDescription dodaje opis.",w:["URL się nie zmienia.","Nie dotyczy uwierzytelniania.","Nie dotyczy plików."]},{id:"w04-28",q:"Jaki typ daty używa nowszy przykład OpenAPI zamiast DateTime w WeatherForecast?",a:["DateOnly","TimeOnly","DateTimeOffset","string"],e:"DateOnly.FromDateTime(DateTime.Now.AddDays(index)) przechowuje samą datę, bez godziny.",w:["TimeOnly to sama godzina.","DateTimeOffset ma strefę czasową.","string to nie typ daty."]},{id:"w04-29",q:'Rate limiter: AddFixedWindowLimiter("fixed", PermitLimit = 4, Window = 12 s, QueueLimit = 0). Co stanie się z 5. żądaniem w tym samym oknie 12 s?',a:["Zostanie odrzucone z kodem 429","Trafi do kolejki","Zostanie obsłużone normalnie","Zwróci 503"],e:"Limit to 4 żądania na okno, a kolejka ma 0 miejsc, więc 5. żądanie jest odrzucane. Ustawiono RejectionStatusCode = 429.",w:["QueueLimit = 0, więc kolejka jest pusta.","Limit 4 jest już wyczerpany.","Kod ustawiono na 429, nie 503."]},{id:"w04-30",q:"Co oznacza kod HTTP 429?",a:["Too Many Requests","Unauthorized","Forbidden","Service Unavailable"],e:"429 = Too Many Requests, typowy kod dla rate limitingu.",w:["Unauthorized to 401.","Forbidden to 403.","Service Unavailable to 503."]},{id:"w04-31",q:'Jak przypisać politykę rate limitingu "fixed" do endpointu?',a:['app.MapGet("/", …).RequireRateLimiting("fixed")','[RateLimit("fixed")] na Program','app.UseRateLimiter("fixed") wystarczy','builder.Services.AddRateLimit("/")'],e:'Polityka jest definiowana w AddRateLimiter, middleware włącza app.UseRateLimiter(), a endpoint wybiera politykę przez RequireRateLimiting("fixed").',w:["Nie ma atrybutu [RateLimit] na Program.","UseRateLimiter nie przypisuje polityki.","Nie ma AddRateLimit."]},{id:"w04-32",q:"Co jest wymagane oprócz AddRateLimiter, aby limiter działał?",a:["app.UseRateLimiter() w potoku","app.UseCors()","app.UseAuthentication()","Nic więcej"],e:"Serwis trzeba dodać i włączyć middleware app.UseRateLimiter().",w:["CORS nie jest powiązany.","Uwierzytelnianie nie jest powiązane.","Middleware jest wymagany."]},{id:"w04-33",q:"Co oznacza AutoReplenishment = true w FixedWindowLimiter?",a:["Limit odnawia się automatycznie po upływie okna","Kolejka rośnie automatycznie","Limit rośnie z każdym żądaniem","Odrzucone żądania są ponawiane"],e:"Okno automatycznie się odnawia co Window (12 s) i przywraca PermitLimit.",w:["Kolejka się nie powiększa.","Limit jest stały.","Odrzucone żądania nie są ponawiane."]},{id:"w04-34",q:'Wersjonowanie: AddApiVersioning(o => { o.AssumeDefaultVersionWhenUnspecified = true; o.ApiVersionReader = new HeaderApiVersionReader("x-api-version"); }). Skąd odczytywana jest wersja API?',a:["Z nagłówka HTTP x-api-version","Z query string ?api-version=","Z segmentu URL","Z ciasteczka"],e:'HeaderApiVersionReader("x-api-version") odczytuje wersję z nagłówka.',w:["Query string wymaga QueryStringApiVersionReader.","Segment URL wymaga UrlSegmentApiVersionReader.","Ciasteczka nie są czytane."]},{id:"w04-35",q:'Ta sama konfiguracja wersjonowania. GET /Hello bez nagłówka wersji, kontrolery v1.0 ("Hello world v1") i v2.0 ("Hello world v2") pod tą samą trasą. Co zostanie zwrócone?',a:["Hello world v1 – przyjęta zostanie wersja domyślna","Hello world v2 – najnowsza","400 – brak wersji","Błąd niejednoznaczności tras"],e:"AssumeDefaultVersionWhenUnspecified = true, a domyślna wersja to 1.0, więc odpowiada kontroler v1.",w:["Najnowsza wersja nie jest wybierana domyślnie.","AssumeDefault… zapobiega błędowi 400.","Wersjonowanie rozdziela trasy."]},{id:"w04-36",q:"Jak w przykładzie oznacza się, którą wersję API obsługuje kontroler?",a:['Atrybutem [ApiVersion("1.0")] (można kilka)',"Nazwą klasy z sufiksem V1","Osobnym projektem",'Atrybutem [Route("v1")] obowiązkowo'],e:'[ApiVersion("1.0")] / [ApiVersion(2.0)]. Jeden kontroler może obsługiwać kilka wersji.',w:["Nazwa klasy nie decyduje.","Osobny projekt nie jest potrzebny.",'[Route("v1")] nie jest obowiązkowy.']},{id:"w04-37",q:"Ile minut jest ważny token wystawiany przez TokenController (expires: DateTime.UtcNow.AddMinutes(30))?",a:["30","60","5","Bezterminowo"],e:"expires: AddMinutes(30). Przy ClockSkew = TimeSpan.Zero token wygasa dokładnie po 30 min.",w:["To nie 60.","To nie 5.","Ma ustawione expires."]},{id:"w04-38",q:"Co oznacza ClockSkew = TimeSpan.Zero w TokenValidationParameters?",a:["Brak tolerancji czasowej – token przestaje być ważny dokładnie w chwili wygaśnięcia","Token nigdy nie wygasa","Wyłączenie walidacji podpisu","Synchronizację zegara z serwerem NTP"],e:"Domyślnie jest kilkuminutowa tolerancja. Zero oznacza ścisłe sprawdzanie czasu wygaśnięcia.",w:["Token wygasa normalnie.","Podpis nadal jest walidowany.","To nie synchronizacja NTP."]},{id:"w04-39",q:"Których elementów tokenu NIE weryfikuje konfiguracja JWT z przykładu?",a:["Wystawcy (issuer) i odbiorcy (audience)","Czasu ważności","Klucza podpisu","Podpisu tokenu"],e:"ValidateIssuer = false i ValidateAudience = false. Walidowane są czas (ValidateLifetime) oraz klucz podpisu (ValidateIssuerSigningKey).",w:["Czas ważności jest walidowany.","Klucz podpisu jest walidowany.","Podpis jest walidowany."]},{id:"w04-40",q:"Jakiego algorytmu podpisu używa TokenController?",a:["HMAC SHA-256 z kluczem symetrycznym","RSA z kluczem publicznym","ECDSA","Brak podpisu"],e:"SymmetricSecurityKey + SecurityAlgorithms.HmacSha256, czyli ten sam sekret do podpisu i weryfikacji.",w:["RSA to klucz asymetryczny – tu jest symetryczny.","ECDSA nie jest użyte.","Podpis jest."]},{id:"w04-41",q:"Co jest problemem bezpieczeństwa w przykładzie JWT (zgodnie z wykładem o sekretach)?",a:["Sekret klucza jest zapisany na sztywno w kodzie źródłowym","Token ma 30 minut ważności","Użyto HMAC","Token zawiera claim Jti"],e:'Klucz "to jest bardzo, bardzo tajny sekret" jest w kodzie. Sekrety powinny być w user secrets, zmiennych środowiskowych lub Key Vault.',w:["30 min to rozsądny czas.","HMAC jest w porządku.","Jti to dobra praktyka."]},{id:"w04-42",q:"Do czego służy claim Jti w tokenie (new Claim(JwtRegisteredClaimNames.Jti, Guid.NewGuid().ToString()))?",a:["Unikalny identyfikator tokenu","Identyfikator użytkownika","Czas wygaśnięcia","Adres e-mail"],e:"jti (JWT ID) to unikalny identyfikator tokenu. sub to podmiot (użytkownik), email to e-mail.",w:["Użytkownik to sub.","Czas wygaśnięcia to exp.","E-mail to email."]},{id:"w04-43",q:"Jak klient przesyła token JWT do API chronionego schematem JwtBearer?",a:["Nagłówek Authorization: Bearer <token>","W query string ?token=","W ciasteczku .AspNetCore.Identity","W body każdego żądania"],e:"Schemat Bearer oczekuje nagłówka Authorization: Bearer <token>.",w:["Nie w query string.","Ciasteczko to Identity, nie JWT Bearer.","Nie w body."]},{id:"w04-44",q:"W jakiej kolejności muszą być w potoku middleware uwierzytelniania i autoryzacji?",a:["app.UseAuthentication(); potem app.UseAuthorization();","Najpierw UseAuthorization, potem UseAuthentication","Kolejność nie ma znaczenia","Wystarczy UseAuthorization"],e:"Najpierw ustala się tożsamość (uwierzytelnienie), dopiero potem sprawdza uprawnienia (autoryzacja).",w:["Najpierw tożsamość, potem uprawnienia.","Kolejność ma znaczenie.","Bez UseAuthentication nie ma tożsamości."]},{id:"w04-45",q:"Czym różni się uwierzytelnianie (authentication) od autoryzacji (authorization)?",a:["Uwierzytelnianie ustala, kim jest użytkownik; autoryzacja – do czego ma dostęp","To synonimy","Autoryzacja ustala tożsamość, uwierzytelnianie uprawnienia","Uwierzytelnianie dotyczy tylko API"],e:"Authentication to kto, authorization to co mu wolno. Błędy to odpowiednio 401 i 403.",w:["To nie synonimy.","Odwrotnie.","Dotyczy wszystkich aplikacji."]},{id:"w04-46",q:'W projekcie -cors: builder.Services.AddCors(o => o.AddPolicy("MyCORS", p => p.WithOrigins("http://localhost:5252"))), ale linia //app.UseCors("MyCORS"); jest zakomentowana. Jaki jest skutek?',a:["Polityka CORS nie jest stosowana – przeglądarka zablokuje odczyt odpowiedzi z innych originów","Wszystkie originy są dozwolone","Dozwolony jest tylko localhost:5252","Aplikacja się nie uruchomi"],e:"AddCors tylko definiuje politykę, a działa ona dopiero z middleware UseCors. Bez nagłówków CORS przeglądarka blokuje żądania cross-origin.",w:["Bez UseCors nie ma nagłówków zezwalających.","Polityka nie jest stosowana.","Aplikacja startuje normalnie."]},{id:"w04-47",q:"Kto egzekwuje ograniczenia CORS?",a:["Przeglądarka – na podstawie nagłówków odpowiedzi serwera","Serwer, odrzucając żądania z innych originów","Firewall","Kestrel w każdym przypadku, także dla curl"],e:"CORS to mechanizm przeglądarki. Narzędzia jak curl czy Postman nie podlegają CORS.",w:["Serwer nie blokuje – wysyła nagłówki.","Firewall nie ma z tym związku.","curl ignoruje CORS."]},{id:"w04-48",q:"Co robi builder.Services.AddEndpointsApiExplorer()?",a:["Udostępnia metadane endpointów (m.in. Minimal APIs) dla generatora OpenAPI/Swagger","Wyświetla listę endpointów w przeglądarce","Włącza wersjonowanie","Włącza CORS"],e:"API Explorer zbiera metadane endpointów, z których korzysta Swashbuckle (AddSwaggerGen).",w:["Nie wyświetla listy.","Wersjonowanie to AddApiVersioning.","CORS to AddCors."]},{id:"w04-49",q:"Która linia w Program.cs Web API mapuje kontrolery z routingiem atrybutowym?",a:["app.MapControllers();",'app.MapControllerRoute("default", …);',"app.MapRazorPages();","app.UseEndpoints();"],e:"W API z [Route] używa się app.MapControllers(), a MapControllerRoute to routing konwencyjny MVC.",w:["MapControllerRoute to routing konwencyjny MVC.","MapRazorPages to strony.","UseEndpoints to starszy sposób."]},{id:"w04-50",q:'W TokenController: [Route("[controller]")] i [HttpPost("/token")]. Pod jakim adresem wystawiany jest token?',a:["POST /token","POST /Token/token","GET /token","POST /api/token"],e:`Szablon "/token" zaczyna się od '/', więc jest bezwzględny. Akcja ma [HttpPost], więc tylko POST.`,w:["Wiodący / ignoruje [controller].","Metoda to POST, nie GET.","Prefiksu api nie ma."]}],rp={id:ip,title:np,questions:tp},sp="w05",lp="W5 · Identity, role, polityki i uwierzytelnianie (na podstawie kodu)",cp=[{id:"w05-01",q:"Co rejestruje builder.Services.AddDefaultIdentity<ApplicationUser>(…).AddEntityFrameworkStores<ApplicationDbContext>()?",a:["System ASP.NET Core Identity z domyślnym UI, przechowujący użytkowników w bazie przez EF Core","Uwierzytelnianie JWT","Tylko tabelę ról","Polityki autoryzacji"],e:"AddDefaultIdentity dodaje Identity (z UI w Razor Pages, Areas/Identity), a AddEntityFrameworkStores zapisuje dane w bazie przez DbContext.",w:["JWT to AddJwtBearer.","Role to dopiero AddRoles.","Polityki to AddAuthorization."]},{id:"w05-02",q:"Co oznacza options.SignIn.RequireConfirmedAccount = true?",a:["Użytkownik musi potwierdzić konto (np. e-mail), zanim się zaloguje","Każde logowanie wymaga 2FA","Hasło musi mieć min. 8 znaków","Konto jest blokowane po 3 próbach"],e:"RequireConfirmedAccount wymaga potwierdzenia konta przed zalogowaniem.",w:["2FA to inna opcja.","Długość hasła to Password options.","Blokada to Lockout options."]},{id:"w05-03",q:"Co trzeba dodać do konfiguracji Identity, aby korzystać z ról (np. Admin)?",a:[".AddRoles<IdentityRole>()",".AddClaims()",".AddPolicies()","Nic, role są zawsze włączone"],e:"W przykładzie -roles: AddDefaultIdentity<…>(…).AddRoles<IdentityRole>().AddEntityFrameworkStores<…>(). W przykładzie -birthdate tego brak.",w:["AddClaims nie istnieje.","AddPolicies nie istnieje.","Role nie są domyślnie włączone."]},{id:"w05-04",q:'Co oznacza [Authorize(Roles = "Admin")] na akcji AdminOnly?',a:["Dostęp mają tylko uwierzytelnieni użytkownicy z rolą Admin","Dostęp ma każdy zalogowany","Akcja jest dostępna anonimowo","Tylko pierwszy użytkownik w bazie"],e:'Roles = "Admin" to autoryzacja oparta o role. Zalogowany bez roli dostanie odmowę (403 / Access Denied).',w:["Każdy zalogowany to samo [Authorize].","Anonimowy dostęp to [AllowAnonymous].","Nie ma takiej zasady."]},{id:"w05-05",q:'Zalogowany użytkownik BEZ roli Admin wchodzi na akcję z [Authorize(Roles = "Admin")] (cookie Identity). Jaki będzie efekt?',a:["Odmowa dostępu – przekierowanie na stronę Access Denied (403)","Przekierowanie na stronę logowania (401)","Akcja się wykona","Błąd 500"],e:"Użytkownik jest uwierzytelniony, ale nie ma uprawnień, więc forbid (Access Denied). Niezalogowany zostałby przekierowany na login (challenge).",w:["Login pojawia się dla niezalogowanych (401).","Akcja się nie wykona.","Nie ma błędu serwera."]},{id:"w05-06",q:'Jak w przykładzie zdefiniowano politykę "IsAdult"?',a:['options.AddPolicy("IsAdult", p => p.AddRequirements(new MinimumAgeRequirement(18)))','options.AddPolicy("IsAdult", p => p.RequireRole("Adult"))',"[Authorize(Age = 18)]",'options.AddPolicy("IsAdult", p => p.RequireClaim("age", "18"))'],e:"Polityka używa własnego wymagania MinimumAgeRequirement(18), które sprawdza handler MinimumAgeHandler.",w:["Nie ma roli Adult.","Nie ma atrybutu z wiekiem.","Claim age nie istnieje."]},{id:"w05-07",q:"Jaki interfejs implementuje MinimumAgeRequirement?",a:["IAuthorizationRequirement","IAuthorizationHandler","IAuthenticationHandler","IPolicyProvider"],e:"Wymaganie (dane, np. MinimumAge) implementuje IAuthorizationRequirement, a logikę zawiera handler: AuthorizationHandler<MinimumAgeRequirement>.",w:["Handler implementuje AuthorizationHandler.","To uwierzytelnianie, nie autoryzacja.","IPolicyProvider nie jest użyty."]},{id:"w05-08",q:"Jak zarejestrowano MinimumAgeHandler w przykładzie?",a:["builder.Services.AddTransient<IAuthorizationHandler, MinimumAgeHandler>();","options.AddHandler<MinimumAgeHandler>();","[Handler] na klasie","Nie trzeba go rejestrować"],e:"Handler rejestruje się w DI jako IAuthorizationHandler. Bez rejestracji wymaganie nigdy nie zostanie spełnione.",w:["AddHandler nie istnieje w opcjach.","Nie ma atrybutu [Handler].","Bez rejestracji handler nie działa."]},{id:"w05-09",q:"Jak handler sygnalizuje spełnienie wymagania?",a:["context.Succeed(requirement)","return true","context.Fail() odwrotnie","throw new AuthorizedException()"],e:"context.Succeed(requirement) oznacza spełnienie. Zwrócenie bez Succeed oznacza brak spełnienia, czyli odmowę dostępu.",w:["Handler nie zwraca bool.","Fail oznacza jawną porażkę.","Wyjątki nie są mechanizmem autoryzacji."]},{id:"w05-10",q:"MinimumAgeHandler: age = Today.Year − dob.Year; if (dob > Today.AddYears(−age)) age−−; Dzisiaj 13.11.2026, data urodzenia 1.12.2008. Czy użytkownik przejdzie politykę IsAdult (≥18)?",a:["Nie – wiek wyniesie 17 (urodziny jeszcze nie minęły)","Tak – 2026 − 2008 = 18","Tak – handler liczy tylko lata","Wyjątek – brak daty"],e:"18 lat minus 1, bo 1.12.2008 > 13.11.2008 (urodziny w tym roku jeszcze nie minęły), więc 17 < 18.",w:["Pułapka: urodziny jeszcze nie minęły, więc 17.","Handler odejmuje 1, gdy urodziny nie minęły.","Data jest ustawiona."]},{id:"w05-11",q:"Ten sam handler. Dzisiaj 13.11.2026, data urodzenia 13.11.2008. Czy użytkownik przejdzie IsAdult?",a:["Tak – wiek 18","Nie – wiek 17","Nie – wiek 19","Zależy od strefy czasowej"],e:"dob == Today.AddYears(-18), więc warunek > jest fałszywy, wiek = 18 ≥ 18 i Succeed.",w:["Urodziny są dziś, więc odejmowania nie ma.","Nie 19.","Strefa nie ma znaczenia (Today)."]},{id:"w05-12",q:"Co robi MinimumAgeHandler, gdy _manager.GetUserAsync(context.User) zwróci null?",a:["Kończy bez Succeed – wymaganie niespełnione, dostęp zabroniony","Spełnia wymaganie","Rzuca wyjątek","Tworzy nowego użytkownika"],e:"if (user == null) return Task.CompletedTask; kończy bez context.Succeed, więc odmowa.",w:["Bez Succeed wymaganie nie jest spełnione.","Nie rzuca wyjątku.","Nie tworzy użytkownika."]},{id:"w05-13",q:'Polityka: policy.RequireAssertion(_ => DateTime.Now.DayOfWeek == DayOfWeek.Saturday || … == DayOfWeek.Sunday). Kiedy akcja [Authorize(Policy = "IsItWeekend")] będzie dostępna?',a:["Tylko w sobotę i niedzielę (dla zalogowanego)","Tylko w dni robocze","Zawsze","Tylko w niedzielę"],e:"RequireAssertion pozwala zapisać warunek lambdą bez osobnego handlera.",w:["Odwrotnie.","Tylko weekend.","Sobota też."]},{id:"w05-14",q:'W HomeController jest WeekendOnly z [Authorize(Policy = "IsItWeekend")] oraz WeekendOnly2 bez atrybutu, zwracające View("WeekendOnly"). Co z tego wynika?',a:["Ten sam widok jest dostępny zawsze przez WeekendOnly2 – autoryzacja dotyczy akcji, nie widoku","WeekendOnly2 też wymaga weekendu","WeekendOnly2 nie zadziała bez atrybutu","Widok nie może być użyty przez dwie akcje"],e:"Atrybut [Authorize] chroni akcję (endpoint). Ten sam plik widoku zwrócony z niechronionej akcji jest dostępny dla każdego.",w:["Atrybut chroni akcję, nie widok.","Zadziała – widok istnieje.","Widok może być użyty przez wiele akcji."]},{id:"w05-15",q:"Jak oznaczyć akcję wymagającą konkretnej polityki autoryzacji?",a:['[Authorize(Policy = "IsAdult")]','[Policy("IsAdult")]','[Authorize("IsAdult") ] w Program.cs',"[RequirePolicy(IsAdult)]"],e:'Polityki wskazuje się przez [Authorize(Policy = "nazwa")], a definiuje w AddAuthorization(o => o.AddPolicy(…)).',w:["Nie ma atrybutu [Policy].","Polityki nie wskazuje się w Program.cs.","Nie ma [RequirePolicy]."]},{id:"w05-16",q:"TokenController (Identity): użytkownik o podanym e-mailu nie istnieje. Co zwraca akcja?",a:["404 Not Found","401 Unauthorized","400 Bad Request","200 z pustym tokenem"],e:"if (user == null) return NotFound(). To ujawnia, czy e-mail istnieje w systemie (enumeracja użytkowników).",w:["401 jest przy złym haśle.","Żądanie jest poprawne – nie 400.","Tokenu nie ma."]},{id:"w05-17",q:"TokenController: użytkownik istnieje, ale hasło jest błędne. Co zwraca akcja?",a:["401 Unauthorized","404 Not Found","403 Forbidden","200 bez tokenu"],e:"CheckPasswordAsync zwraca false, więc Unauthorized() (401).",w:["404 jest, gdy brak użytkownika.","403 to brak uprawnień.","Kod jawnie zwraca Unauthorized."]},{id:"w05-18",q:"Która klasa Identity służy w przykładzie do wyszukania użytkownika i sprawdzenia hasła?",a:["UserManager<ApplicationUser> (FindByEmailAsync, CheckPasswordAsync)","SignInManager<IdentityRole>","DbContext bezpośrednio","IdentityRole"],e:"UserManager<T> jest wstrzykiwany przez DI. Metody: FindByEmailAsync, CheckPasswordAsync, GetRolesAsync.",w:["SignInManager to logowanie cookie, a IdentityRole to rola.","DbContext bezpośrednio to nie API Identity.","IdentityRole to klasa roli."]},{id:"w05-19",q:'TokenController dodaje rolę: claims.Add(new Claim(ClaimTypes.Role, string.Join("+", roles))). Użytkownik ma role Admin i User. Czy token przejdzie [Authorize(Roles = "Admin")]?',a:['Nie – powstaje jeden claim "Admin+User", który nie równa się "Admin"',"Tak – Admin jest w treści claimu","Tak – role są dzielone po '+'","Tylko jeśli Admin jest pierwszy"],e:"Pułapka: wiele ról złączonych w jeden claim. Poprawnie byłby osobny claim Role dla każdej roli. Działa tylko, gdy użytkownik ma dokładnie jedną rolę.",w:["Porównanie jest dokładne, nie „zawiera”.","Nikt nie dzieli po '+'.","Kolejność nic nie zmienia."]},{id:"w05-20",q:"Na czym oparta jest domyślna autentykacja aplikacji MVC z Identity (logowanie przez stronę)?",a:["Na ciasteczku (cookie) uwierzytelniającym","Na tokenie JWT w nagłówku","Na Basic Auth","Na kluczu API"],e:"AddDefaultIdentity konfiguruje uwierzytelnianie ciasteczkiem. JWT w przykładzie to dodatkowy endpoint do API.",w:["JWT to osobny endpoint API.","Basic to inny przykład.","Klucz API to inny przykład."]},{id:"w05-21",q:"W jakiej technologii zbudowane są strony logowania/rejestracji Identity w przykładach (Areas/Identity/Pages/Account/Login.cshtml)?",a:["Razor Pages","MVC z kontrolerem AccountController","Blazor","Minimal APIs"],e:"Identity UI jest w Razor Pages (Areas/Identity/Pages). Dlatego w Program.cs jest też app.MapRazorPages().",w:["Nie ma AccountController.","To nie Blazor.","To nie Minimal APIs."]},{id:"w05-22",q:"Dlaczego aplikacja MVC z Identity ma w Program.cs app.MapRazorPages()?",a:["Bo strony Identity (logowanie, rejestracja) to Razor Pages","Bo kontrolery tego wymagają","Bo inaczej nie działa routing MVC","Dla Swaggera"],e:"Identity UI to Razor Pages w Areas/Identity, więc bez MapRazorPages strony logowania nie byłyby dostępne.",w:["Kontrolery tego nie wymagają.","Routing MVC działa bez tego.","Swagger nie jest tu używany."]},{id:"w05-23",q:"Co robi app.UseMigrationsEndPoint() w trybie Development?",a:["Pozwala zastosować brakujące migracje EF z poziomu strony błędu","Automatycznie usuwa bazę","Wyświetla listę endpointów","Włącza Swagger"],e:"Razem z AddDatabaseDeveloperPageExceptionFilter pokazuje błędy bazy i pozwala zaaplikować migracje w Development.",w:["Nie usuwa bazy.","Nie wyświetla endpointów.","Nie dotyczy Swaggera."]},{id:"w05-24",q:"Jak w przykładzie -birthdate dodano datę urodzenia do użytkownika?",a:["Rozszerzając klasę użytkownika (ApplicationUser : IdentityUser) o właściwość i dodając migrację","Dodając claim do ciasteczka","W appsettings.json","W tabeli ról"],e:"Własny ApplicationUser z BirthDate oraz migracja (…_BirthDate) rozszerzają schemat Identity. Handler wieku czyta user.BirthDate.",w:["Nie claim w cookie.","Nie w appsettings.","Nie w tabeli ról."]},{id:"w05-25",q:"Przykład basicdefault: OnValidateCredentials sukces, gdy context.Username == context.Password. Które dane logowania przejdą?",a:["user: alice, hasło: alice","user: alice, hasło: secret","user: admin, hasło: admin123","Żadne – brak bazy"],e:"Uwierzytelnienie udaje się, gdy login równa się hasłu. To przykład demonstracyjny.",w:["Login ≠ hasło.","admin ≠ admin123.","Dane nie pochodzą z bazy – warunek to login == hasło."]},{id:"w05-26",q:"Co oznacza options.AllowInsecureProtocol = true w Basic Auth?",a:["Zezwala na Basic Auth przez niezaszyfrowane HTTP (dane logowania jawnym tekstem w Base64)","Wyłącza sprawdzanie hasła","Pozwala na anonimowy dostęp","Wymusza HTTPS"],e:"Basic Auth przesyła login:hasło zakodowane Base64, czyli bez szyfrowania. Bez HTTPS jest to niebezpieczne, dlatego domyślnie jest blokowane.",w:["Hasło jest sprawdzane.","Anonimowy dostęp to nie to.","Odwrotnie – zezwala na HTTP."]},{id:"w05-27",q:"Jak przesyłane są dane uwierzytelniające w Basic Authentication?",a:["W nagłówku Authorization: Basic base64(login:hasło)","W nagłówku Authorization: Bearer <JWT>","W query string","W ciasteczku sesji"],e:"Basic to Base64 z login:hasło. Base64 to kodowanie, nie szyfrowanie.",w:["Bearer to JWT.","Nie w query string.","Nie w ciasteczku."]},{id:"w05-28",q:"basicdefault: AddAuthentication(BasicAuthenticationDefaults.AuthenticationScheme) + AddApiKeyHeaderAuthentication(…) + AddBasic(…); AddAuthorization() bez polityk. Żądanie z poprawnym kluczem API (bez Basic) do akcji [Authorize]. Wynik?",a:["401 – domyślna polityka używa tylko domyślnego schematu (Basic)","200 – oba schematy są sprawdzane","403","500"],e:"[Authorize] bez wskazania schematu korzysta z domyślnego schematu (Basic), więc klucz API nie jest sprawdzany.",w:["Domyślna polityka nie sprawdza klucza API.","Nie 403 – brak tożsamości.","Brak błędu serwera."]},{id:"w05-29",q:"Jak przykład multiauth pozwala uwierzytelnić się kluczem API LUB Basic?",a:["Ustawia DefaultPolicy = new AuthorizationPolicyBuilder(ApiKeyScheme, BasicScheme).RequireAuthenticatedUser().Build()","Dodaje dwa atrybuty [Authorize] do każdej akcji","Wywołuje AddAuthentication dwa razy","Usuwa schemat domyślny"],e:"Domyślna polityka z dwoma schematami sprawdza oba, więc wystarczy uwierzytelnienie którymkolwiek.",w:["Dwa [Authorize] nie łączą schematów.","AddAuthentication jest wywołane raz.","Schemat domyślny jest nadal ustawiony."]},{id:"w05-30",q:"Co oznacza RequireAuthenticatedUser() w polityce?",a:["Wymaga, by użytkownik był uwierzytelniony (bez dodatkowych ról/claimów)","Wymaga roli Admin","Wymaga potwierdzonego e-maila","Wymaga 2FA"],e:"Polityka przepuszcza każdego uwierzytelnionego użytkownika.",w:["Roli nie wymaga.","Potwierdzenia e-maila nie wymaga.","2FA nie wymaga."]},{id:"w05-31",q:"Gdzie w przykładzie Basic Auth tworzona jest tożsamość użytkownika po poprawnej walidacji?",a:["context.Principal = new ClaimsPrincipal(new ClaimsIdentity(claims, context.Scheme.Name)); context.Success();","W bazie danych Identity","W ciasteczku przez SignInAsync","W TokenController"],e:"W OnValidateCredentials budowany jest ClaimsPrincipal z claimami (NameIdentifier, Name) i wywoływane context.Success().",w:["Nie w bazie Identity.","Nie SignInAsync.","To nie TokenController."]},{id:"w05-32",q:"Czym jest claim?",a:["Stwierdzeniem o użytkowniku (para typ–wartość), np. e-mail, rola, imię","Rodzajem hasła","Kluczem API","Tabelą w bazie Identity"],e:"Claim to para typ–wartość opisująca podmiot. ClaimsIdentity grupuje claimy, a ClaimsPrincipal reprezentuje użytkownika.",w:["To nie hasło.","To nie klucz API.","To nie tabela."]},{id:"w05-33",q:"Czego wymaga autoryzacja oparta o polityki z własnym wymaganiem (jak IsAdult)?",a:["Klasy wymagania (IAuthorizationRequirement), handlera (AuthorizationHandler<T>) zarejestrowanego w DI i polityki w AddAuthorization","Tylko atrybutu [Authorize(Roles)]","Tylko claimu w tokenie","Osobnej bazy danych"],e:"Pełny łańcuch: requirement, handler (DI), AddPolicy oraz [Authorize(Policy = …)].",w:["Role to inny mechanizm.","Claim nie wystarczy dla własnego wymagania.","Osobna baza nie jest potrzebna."]},{id:"w05-34",q:'Akcja z [Authorize] w LeaderboardController ma [HttpGet("/leaderboard")]. Co zwróci żądanie bez uwierzytelnienia?',a:["401 Unauthorized (challenge schematu)","200 z pustą listą","404","403"],e:"Brak uwierzytelnienia to 401 (dla Basic z nagłówkiem WWW-Authenticate). 403 jest wtedy, gdy użytkownik jest znany, ale nie ma uprawnień.",w:["Brak tożsamości daje 401.","Akcja się nie wykona.","Endpoint istnieje."]},{id:"w05-35",q:"Kod: summaries.OrderByDescending(x => Random.Shared.Next()).Select(x => new PointsDto(x, Random.Shared.Next(100))).OrderByDescending(x => x.Points). Jak posortowany jest wynik?",a:["Malejąco po losowych punktach (0–99)","Alfabetycznie","Losowo bez sortowania","Rosnąco po punktach"],e:"Ostatni OrderByDescending(x => x.Points) decyduje o kolejności: malejąco po punktach. Punkty z Next(100) mają wartości 0..99.",w:["Sortowanie nie jest alfabetyczne.","Ostatnie OrderBy sortuje.","Malejąco, nie rosnąco."]},{id:"w05-36",q:"Który kod odpowiedzi oznacza „uwierzytelniony, ale brak uprawnień”?",a:["403 Forbidden","401 Unauthorized","404 Not Found","429 Too Many Requests"],e:"401 to brak lub niepoprawne uwierzytelnienie, 403 to brak uprawnień przy znanej tożsamości.",w:["401 to brak uwierzytelnienia.","404 to brak zasobu.","429 to rate limit."]}],dp={id:sp,title:lp,questions:cp},wp="zpwo",up="Zarządzanie projektami wytwarzania oprogramowania",yp="ZPWO",zp="Zarządzanie projektami, PMBOK i PRINCE2, XP, FDD, Lean, DSDM, jakość, TDD i refaktoryzacja.",pp=["w01","w02","w03"],kp={id:wp,name:up,short:yp,description:zp,lectures:pp},mp="w01",jp="W0–W1 · Zarządzanie projektami, PMI i PRINCE2",gp=[{id:"w01-01",q:"Jaki próg jest wymagany do zaliczenia wykładu?",a:["51%","50%","60%","75%"],w:["Pułapka – 50% nie wystarcza, trzeba 51%.","Za wysoko.","Za wysoko."],e:"Metody i kryteria oceny: zaliczenie z wykładów 51%, z laboratorium 51%."},{id:"w01-02",q:"Jak definiuje się projekt (przedsięwzięcie) wg wykładu?",a:["Tymczasowe przedsięwzięcie podjęte w celu wytworzenia unikalnego produktu, usługi lub rezultatu","Powtarzalny proces o ustalonej technologii","Stały dział w organizacji","Ciągła działalność operacyjna firmy"],w:["To opis działań procesowych.","Projekt jest tymczasowy.","To procesy, nie projekt."],e:"Projekt – nierutynowy proces realizacji celów w określonym czasie i określonymi środkami; cel: wprowadzenie zmiany."},{id:"w01-03",q:"Co jest celem projektu wg wykładu?",a:["Wprowadzenie zmiany","Utrzymanie stabilizacji","Powtarzanie sprawdzonych czynności","Obsługa klienta"],w:["Stabilizacja to cel procesów.","To działania procesowe.","To przykład procesu."],e:"Cel projektu: wprowadzenie zmiany; nowość sytuacji → proces nierutynowy."},{id:"w01-04",q:"Który przykład to działanie procesowe, a nie projektowe?",a:["Taśmowa produkcja silnika","Wdrożenie nowego systemu ERP","Budowa nowej siedziby","Opracowanie nowego produktu"],w:["Wdrożenie to jednorazowa zmiana – projekt.","Budowa to projekt.","Nowy produkt to projekt."],e:"Procesowe – powtarzalne, sprzyjające stabilizacji (np. produkcja taśmowa, obsługa klienta w banku)."},{id:"w01-05",q:"Która organizacja jest zorientowana na projekty wg wykładu?",a:["Przedsiębiorstwo budowlane","Bank","Zakład produkcyjny","Uczelnia dydaktyczna"],w:["Bank – orientacja procesowa.","Zakład produkcyjny – procesowa.","Uczelnia dydaktyczna – procesowa (naukowa – projektowa)."],e:"Projektowe: uczelnia naukowa, zakład B+R, firma budowlana, konsultingowa/marketingowa."},{id:"w01-06",q:"Dlaczego projekt w organizacji procesowej bywa w konflikcie z jej działaniem?",a:["Bo modyfikuje i zaburza istniejące procesy","Bo zawsze przekracza budżet","Bo nie ma kierownika","Bo jest tańszy"],w:["Nie zawsze przekracza budżet.","Projekt ma kierownika.","Cena nie jest przyczyną konfliktu."],e:"Projekt modyfikuje procesy, zaburza je i zmienia."},{id:"w01-07",q:"Która cecha dotyczy PROCESU, a nie projektu?",a:["Zmiany wprowadzane są w sposób ewolucyjny, kierownictwo sporadycznie ingeruje","Wywołuje gruntowne zmiany","Kierownictwo aktywnie uczestniczy","Nowość sytuacji"],w:["To projekt.","To projekt.","To projekt."],e:"Proces: stabilizacja, rutyna, ewolucyjne zmiany, sporadyczna ingerencja kierownictwa."},{id:"w01-08",q:"Które trzy kluczowe parametry projektu tworzą „trójkąt”?",a:["Zakres, czas, koszt","Jakość, ryzyko, zespół","Sponsor, kierownik, klient","Plan, wykonanie, kontrola"],w:["To ważne, ale nie trzy kluczowe parametry.","To role.","To etapy/funkcje."],e:"Rezultat (zakres), czas realizacji (deadline), budżet (koszt)."},{id:"w01-09",q:"Który z problemów projektu wynika z faktu, że projekt jest „systemem wewnątrz istniejącego systemu”?",a:["Nieporozumienia","Presja czasu","Ryzyko","Opór otoczenia"],w:["Presja czasu wynika z terminu.","Ryzyko z nowości i niepewności.","Opór – niechęć do zmian."],e:"Problemy: opór, konflikt z normalnym działaniem, presja czasu, nieporozumienia (system w systemie), ryzyko."},{id:"w01-10",q:"Co oznacza M w akronimie SMART?",a:["Measurable – mierzalny","Manageable – zarządzalny","Motivating – motywujący","Minimal – minimalny"],w:["Nie w tej definicji.","Nie w tej definicji.","Nie w tej definicji."],e:"Specific, Measurable, Achievable, Relevant, Time-bound."},{id:"w01-11",q:"Co oznacza R w SMART wg wykładu?",a:["Relevant – istotny (zgodny z celami biznesowymi)","Realistic – realistyczny","Responsible – odpowiedzialny","Reviewed – zweryfikowany"],w:["Pułapka: realistyczność to A (Achievable).","Nie w tej definicji.","Nie w tej definicji."],e:"R = Relevant (istotny); A = Achievable (osiągalny, realistyczny)."},{id:"w01-12",q:"W przykładzie SMART („powieść 60 000 słów w 6 miesięcy”), który element odpowiada za Achievable?",a:["Będę pisać 2500 słów tygodniowo","Zawsze marzyłem o byciu pisarzem","Zacznę 1 stycznia, skończę 30 czerwca","Powieść science-fiction na 60 000 słów"],w:["To Relevant.","To Time-bound.","To Specific."],e:"Osiągalnie: 2500 słów tygodniowo; mierzalnie: 60 000 słów w 6 miesięcy."},{id:"w01-13",q:"Która metodyka to uniwersalny standard z Wielkiej Brytanii?",a:["PRINCE2","PMI","PM²","RUP"],w:["PMI – USA.","PM² – Unia Europejska.","RUP – firmowa (IBM/Rational)."],e:"Uniwersalne: USA – PMI; UK – PRINCE2; EU – PM2."},{id:"w01-14",q:"Do jakiej kategorii metodyk należy SAP Activate?",a:["Wdrożeniowe","Zwinne","Uniwersalne","Inżynierii oprogramowania (kaskadowe)"],w:["Zwinne: XP, FDD, Scrum.","Uniwersalne: PMI, PRINCE2, PM2.","IO: kaskadowe, punktów węzłowych."],e:"Wdrożeniowe: SAP Activate, BASIS; firmowe: PMM (IBM), RUP, MSF (Microsoft)."},{id:"w01-15",q:"Kto realizuje zarządzanie strategiczne projektem?",a:["Komitet Sterujący","Zarząd firmy","Kierownik projektu","Kierownik zespołu"],w:["Zarząd – generalny nadzór.","KP – zarządzanie bieżące.","Kierownik zespołu – zarządzanie zespołem."],e:"Warstwy: zarząd (nadzór) → Komitet Sterujący (strategiczne) → KP (bieżące) → kierownik zespołu (zespół)."},{id:"w01-16",q:"Jaka jest kolejność etapów klasycznego projektu wg wykładu?",a:["Identyfikacja → Planowanie/Projektowanie → Realizacja → Ukończenie","Realizacja → Planowanie → Identyfikacja → Ukończenie","Planowanie → Identyfikacja → Ukończenie → Realizacja","Identyfikacja → Realizacja → Planowanie → Ukończenie"],w:["Realizacja nie może być pierwsza.","Identyfikacja jest pierwsza.","Planowanie przed realizacją."],e:"Identyfikacja (cele, studium wykonalności), planowanie, realizacja (prace, ryzyko, postęp), ukończenie (zwolnienie zasobów, wnioski)."},{id:"w01-17",q:"W którym etapie wykonuje się studium wykonalności?",a:["Identyfikacja","Realizacja","Ukończenie","Planowanie szczegółowe"],w:["Realizacja to praca i kontrola.","Ukończenie to zamknięcie.","Szczegółowe planowanie to harmonogram i kontrakt."],e:"Identyfikacja: definiowanie celów, studium wykonalności, planowanie wstępne."},{id:"w01-18",q:"Co jest stałe w planowaniu klasycznym (w odróżnieniu od zwinnego)?",a:["Zakres – a czas i budżet się dostosowują","Czas i budżet – a zakres się negocjuje","Wszystko jest elastyczne","Tylko jakość"],w:["To podejście zwinne / PRINCE2 Agile.","W klasycznym zakres jest stały.","Nie tylko jakość."],e:"Klasycznie: stały zakres → przesuwają się termin i koszt."},{id:"w01-19",q:"Kim jest sponsor projektu?",a:["Osobą silnie zainteresowaną sukcesem, wspierającą KP autorytetem i rozwiązującą problemy (też finansowe)","Osobą zarządzającą bieżącą pracą zespołu","Członkiem biura projektu","Zewnętrznym audytorem"],w:["To kierownik projektu/zespołu.","Biuro prowadzi dokumentację.","Audyt to zespół zapewnienia jakości."],e:"Sponsor dba o klimat „na górze”, wspierany przez Komitet Sterujący."},{id:"w01-20",q:"Co wg wykładu kierownik projektu może delegować?",a:["Zadania – ale nie odpowiedzialność","Odpowiedzialność za projekt","Zadania i odpowiedzialność","Nic"],w:["Odpowiedzialność pozostaje na nim.","Odpowiedzialności nie przenosi.","Zleca realizację zadań."],e:"KP jak kapitan – zleca zadania, ale odpowiedzialność ciąży na nim (delegacja zadań, nie odpowiedzialności)."},{id:"w01-21",q:"Kto zatwierdza rezultaty etapów realizacji projektu?",a:["Komitet Sterujący","Biuro projektu","Zespół wykonawczy","Podwykonawca"],w:["Biuro prowadzi dokumentację.","Zespół wykonuje.","Podwykonawca wykonuje zlecone prace."],e:"Komitet Sterujący – nadzór, wspiera sponsora, zatwierdza rezultaty etapów, zleca kontrolę."},{id:"w01-22",q:"Czym zajmuje się biuro projektu?",a:["Dokumentacją, korespondencją, administrowaniem i organizacją komunikacji","Podejmowaniem decyzji strategicznych","Audytem wewnętrznym","Finansowaniem projektu"],w:["To Komitet Sterujący.","To zespół zapewnienia jakości.","To sponsor."],e:"Biuro projektu wspomaga KP i zespoły w działaniach biurowych."},{id:"w01-23",q:"Czym zajmuje się zespół zapewnienia jakości?",a:["Kontrolą prac, audytem procesu, przestrzeganiem procedur, zarządzaniem ryzykiem","Prowadzeniem korespondencji","Zatwierdzaniem budżetu","Pisaniem kodu"],w:["To biuro projektu.","To sponsor/komitet.","To zespół wykonawczy."],e:"ZZJ: kontrola, audyt wewnętrzny, kontrole na zlecenie sponsora/KP, projekty zagrożone (STOP)."},{id:"w01-24",q:"Od kiedy istnieje Project Management Institute (PMI)?",a:["Od 1969 r. (USA)","Od 1989 r. (UK)","Od 2001 r.","Od 1996 r."],w:["1989 to PRINCE (UK).","To rok Agile Manifesto.","1996 to PRINCE2."],e:"PMI – międzynarodowe stowarzyszenie (USA, od 1969)."},{id:"w01-25",q:"Co opisuje PMBOK® Guide?",a:["Co należy wiedzieć i robić – zbiór dobrych praktyk, nie narzuca jednej metody","Ścisłą metodykę z rolami i procesami","Wyłącznie metody zwinne","Kod etyki programistów"],w:["To PRINCE2 (kto, co i kiedy).","Nie tylko agile.","To nie kodeks etyki."],e:"PMBOK – zbiór wiedzy i dobrych praktyk; PRINCE2 – metodyka (role, procesy, produkty)."},{id:"w01-26",q:"Które wydanie PMBOK® jest aktualne wg wykładu?",a:["8. (listopad 2025)","6. (2017)","7. (2021)","5. (2013)"],w:["6. jest podstawą slajdów, ale nie aktualne.","Poprzednie.","Starsze."],e:"Aktualne: 8. wydanie (XI 2025). Literatura przedmiotu – 6. wydanie (2017)."},{id:"w01-27",q:"Ile procesów, grup procesów i obszarów wiedzy ma PMBOK® 6 (2017)?",a:["49 procesów, 5 grup, 10 obszarów","40 procesów, 5 obszarów, 7 domen","12 zasad, 8 domen","7 zasad, 7 praktyk, 7 procesów"],w:["To PMBOK 8.","To PMBOK 7.","To PRINCE2."],e:"PMBOK 6 – podejście procesowe: 49 procesów, 5 grup, 10 obszarów wiedzy, ITTO."},{id:"w01-28",q:"Czym charakteryzuje się PMBOK® 7 (2021)?",a:["Podejście oparte na zasadach: 12 zasad, 8 domen wydajności, rezygnacja z opisu procesów","49 procesów i 10 obszarów","6 zasad i 40 procesów","7 zasad i 7 procesów"],w:["To PMBOK 6.","To PMBOK 8.","To PRINCE2."],e:"PMBOK 7 – zasady, wartość, tailoring; bez opisu procesów."},{id:"w01-29",q:"Czym charakteryzuje się PMBOK® 8 (2025)?",a:["6 zasad, 7 domen wydajności, 40 procesów w 5 obszarach; nowe: AI, PMO, zamówienia","12 zasad i 8 domen","49 procesów i 10 obszarów","Tylko metody zwinne"],w:["To PMBOK 7.","To PMBOK 6.","Nie tylko agile."],e:"PMBOK 8 łączy zasady z wyd. 7 z procesami z wyd. 6."},{id:"w01-30",q:"Które z poniższych NIE jest grupą procesów PMI?",a:["Procesy testowania","Procesy inicjowania","Procesy monitorowania i kontroli","Procesy zamknięcia"],w:["To grupa procesów.","To grupa procesów.","To grupa procesów."],e:"Grupy: inicjowanie, planowanie, wykonawcze (realizacja), monitorowanie i kontrola, zamknięcie."},{id:"w01-31",q:"Który z obszarów wiedzy PMBOK® 6 ma najwięcej (7) procesów obok integracji?",a:["Ryzyko","Jakość","Komunikacja","Koszty"],w:["Jakość – 3 procesy.","Komunikacja – 3.","Koszty – 4."],e:"Integracja 7, zakres 6, harmonogram 6, koszty 4, jakość 3, zasoby 6, komunikacja 3, ryzyko 7, zamówienia 3, interesariusze 4 = 49."},{id:"w01-32",q:"Ile procesów ma obszar Zarządzanie kosztami w PMBOK® 6?",a:["4","6","7","3"],w:["6 mają zakres, harmonogram, zasoby.","7 mają integracja i ryzyko.","3 mają jakość, komunikacja, zamówienia."],e:"Koszty – 4 procesy."},{id:"w01-33",q:"Do ilu obszarów wiedzy i grup procesów należy każdy proces w PMBOK® 6?",a:["Do jednego obszaru wiedzy i jednej grupy procesów","Do kilku obszarów","Tylko do obszaru, bez grupy","Do wszystkich grup"],w:["Dokładnie jeden obszar.","Należy też do grupy.","Do jednej grupy."],e:"Każdy proces należy jednocześnie do jednego obszaru wiedzy i jednej grupy procesów."},{id:"w01-34",q:"Który dokument formalnie uruchamia projekt i daje kierownikowi uprawnienia do zasobów?",a:["Karta projektu","Rejestr założeń","Plan zarządzania projektem","Harmonogram"],w:["Rejestr założeń to drugie wyjście procesu 4.1.","Plan powstaje w procesie 4.2 (planowanie).","Harmonogram to obszar 6."],e:"Proces 4.1 – opracowanie karty projektu (inicjowanie); wyjścia: karta projektu, rejestr założeń."},{id:"w01-35",q:"Do której grupy procesów należy 4.6 Zintegrowana kontrola zmian?",a:["Monitorowanie i kontrola","Planowanie","Realizacja","Zamknięcie"],w:["Planowanie – 4.2.","Realizacja – 4.3 i 4.4.","Zamknięcie – 4.7."],e:"Integracja: 4.1 inicjowanie, 4.2 planowanie, 4.3–4.4 realizacja, 4.5–4.6 monitorowanie i kontrola, 4.7 zamknięcie."},{id:"w01-36",q:"Do której grupy procesów należy 4.4 Zarządzanie wiedzą o projekcie?",a:["Realizacja","Planowanie","Monitorowanie i kontrola","Inicjowanie"],w:["Planowanie – 4.2.","Monitorowanie – 4.5 i 4.6.","Inicjowanie – 4.1."],e:"4.3 i 4.4 – realizacja."},{id:"w01-37",q:"Jaka jest kolejność w procesie zintegrowanej kontroli zmian (przykład z wykładu)?",a:["Zgłoszenie → ocena wpływu na zakres, termin i koszt → decyzja komitetu ds. zmian → aktualizacja planu","Zgłoszenie → natychmiastowa implementacja","Decyzja komitetu → zgłoszenie → ocena","Aktualizacja planu → ocena → zgłoszenie"],w:["Najpierw ocena i decyzja.","Zła kolejność.","Zła kolejność."],e:"Klient zgłasza funkcję → ocena wpływu → decyzja → aktualizacja planu i harmonogramu."},{id:"w01-38",q:"Jaką metodę harmonogramowania podano jako przykład?",a:["Metoda ścieżki krytycznej (CPM)","MoSCoW","Planning Poker","Story Points"],w:["MoSCoW to priorytetyzacja.","To technika szacowania zwinnego.","To jednostka szacowania."],e:"Tworzenie harmonogramu: metoda (CPM) + narzędzie (MS Project, GanttProject) → wykres Gantta, diagram sieciowy, kamienie milowe."},{id:"w01-39",q:"Które z poniższych jest jedną z 12 zasad PMBOK® 7?",a:["Dostosowanie (tailoring)","Zrównoważony rozwój","Koncentracja na produktach","Ciągła zasadność biznesowa"],w:["To zasada PMBOK 8 (i aspekt PRINCE2 7).","To zasada PRINCE2.","To zasada PRINCE2."],e:"12 zasad PMBOK 7: stewardship, zespół, interesariusze, wartość, myślenie systemowe, przywództwo, tailoring, jakość, złożoność, ryzyko, adaptacja/odporność, zmiana."},{id:"w01-40",q:"Która z poniższych jest jedną z 6 zasad PMBOK® 8?",a:["Zrównoważony rozwój (Integrate sustainability)","Myślenie systemowe","Złożoność","Zarządzanie etapowe"],w:["To PMBOK 7.","To PMBOK 7.","To PRINCE2."],e:"PMBOK 8: holistic view, focus on value, embed quality, lead accountably, integrate sustainability, empowered teams."},{id:"w01-41",q:"Ile domen wydajności ma PMBOK® 8?",a:["7","8","10","12"],w:["8 to PMBOK 7.","10 to obszary wiedzy PMBOK 6.","12 to zasady PMBOK 7."],e:"PMBOK 8 – 7 domen: nadzór, interesariusze, zakres, zasoby, harmonogram, ryzyko, finanse."},{id:"w01-42",q:"Na macierzy zaangażowania interesariuszy co oznacza litera D?",a:["Pożądany poziom zaangażowania (desired)","Obecny poziom (current)","Decydent","Dostawca"],w:["C = current.","Nie ma takiego oznaczenia.","Nie ma takiego oznaczenia."],e:"C – zaangażowanie bieżące; D – pożądane do osiągnięcia sukcesu."},{id:"w01-43",q:"Które poziomy zaangażowania interesariuszy wymieniono?",a:["Nieświadomy, opierający się, neutralny, wspierający, wiodący","Niski, średni, wysoki","Pasywny, aktywny","Klient, dostawca, użytkownik"],w:["To nie te poziomy.","To nie te poziomy.","To role, nie poziomy."],e:"PMBOK 6, rozdz. 13."},{id:"w01-44",q:"Co oznacza skrót PRINCE2?",a:["PRojects IN Controlled Environments","PRoject INitiation and Control Engine","PRocess INtegrated Change Evaluation","PRofessional INternational Certification"],w:["Nie.","Nie.","Nie."],e:"PRINCE2 – projekty w kontrolowanym środowisku; standard administracji publicznej UK."},{id:"w01-45",q:"Kto wydaje 7. wydanie PRINCE2?",a:["PeopleCert","AXELOS","CCTA","PMI"],w:["AXELOS – 6. wydanie (i PRINCE2 Agile 2015).","CCTA – PRINCE (pierwotny).","PMI wydaje PMBOK."],e:"PROMPT (Simpact) → PRINCE (CCTA) → PRINCE2 → 6. wyd. AXELOS → 7. wyd. PeopleCert."},{id:"w01-46",q:"Jaką metodykę rozwija Komisja Europejska?",a:["PM²","PRINCE2","PMBOK","Scrum"],w:["To UK.","To PMI (USA).","To framework zwinny."],e:"Komisja Europejska rozwija własną, otwartą metodykę PM²."},{id:"w01-47",q:"Który aspekt wydajności jest NOWY w PRINCE2 7?",a:["Zrównoważony rozwój","Czas","Ryzyko","Jakość"],w:["Był wcześniej.","Był wcześniej.","Był wcześniej."],e:"7 aspektów: czas, koszt, zakres, jakość, korzyści, ryzyko, zrównoważony rozwój (nowy)."},{id:"w01-48",q:"Czym jest tolerancja w PRINCE2?",a:["Dopuszczalnym odchyleniem od celu aspektu (np. termin ±2 tygodnie)","Tolerancją na błędy w kodzie","Liczbą dopuszczalnych zmian zakresu","Czasem na naprawę defektu"],w:["Nie dotyczy kodu.","To nie liczba zmian.","To nie SLA."],e:"Dla każdego aspektu ustala się cel i tolerancję; KP działa samodzielnie w jej granicach."},{id:"w01-49",q:"Na czym polega zarządzanie przez wyjątki w PRINCE2?",a:["KP działa samodzielnie w granicach tolerancji, a ich przekroczenie eskaluje do Komitetu Sterującego","Komitet codziennie zatwierdza decyzje KP","Zespół omija KP przy problemach","Obsługa wyjątków w kodzie"],w:["Komitet nie ingeruje w bieżącą pracę.","Eskalacja idzie przez KP.","To nie programowanie."],e:"Komitet ustala tolerancje i nie ingeruje, dopóki KP mieści się w granicach."},{id:"w01-50",q:"Która zasada PRINCE2 mówi, że projekt trwa, dopóki ma uzasadnienie biznesowe?",a:["Ciągła zasadność biznesowa","Zarządzanie etapowe","Koncentracja na produktach","Korzystanie z doświadczeń"],w:["Etapowe – decyzje etap po etapie.","Produkty – planowanie od produktów.","Doświadczenia – wnioski z projektów."],e:"7 zasad PRINCE2: zasadność biznesowa, doświadczenia, role, etapy, tolerancje, produkty, dostosowanie."},{id:"w01-51",q:"Na jakie pytanie odpowiada praktyka „Uzasadnienie biznesowe” (Business case) w PRINCE2?",a:["Dlaczego?","Kto?","Gdzie jesteśmy?","Co, jeśli…?"],w:["Kto? – Organizowanie.","Gdzie jesteśmy? – Postępy.","Co, jeśli…? – Ryzyko."],e:"Praktyki: Business case – Dlaczego?; Organizing – Kto?; Plans – Jak? Ile? Kiedy?; Quality – Co?; Risk – Co, jeśli?; Issues – Jaki wpływ?; Progress – Gdzie jesteśmy? Czy kontynuować?"},{id:"w01-52",q:"Jak nazywały się praktyki PRINCE2 we wcześniejszych wydaniach?",a:["Tematy","Procesy","Zasady","Domeny"],w:["Procesy to osobny element.","Zasady to osobny element.","Domeny to PMBOK."],e:"PRINCE2 7: praktyki (dawniej tematy); praktyka „Zagadnienia” – dawniej „Zmiana”."},{id:"w01-53",q:"Kto odpowiada za proces Strategiczne zarządzanie projektem (Directing a project, DP) w PRINCE2?",a:["Komitet Sterujący","Kierownik projektu","Kierownik zespołu","Biuro projektu"],w:["KP odpowiada za SU, IP, CS, SB, CP.","Kierownik zespołu – MP.","Biuro nie odpowiada za procesy."],e:"DP – Komitet Sterujący; MP – kierownik zespołu; pozostałe – kierownik projektu."},{id:"w01-54",q:"Kto odpowiada za proces Zarządzanie wytwarzaniem produktów (MP) w PRINCE2?",a:["Kierownik zespołu","Kierownik projektu","Komitet Sterujący","Sponsor"],w:["KP odpowiada za inne procesy.","Komitet – DP.","Sponsor nie ma procesu."],e:"MP – Managing product delivery – kierownik zespołu (poziom dostarczania)."},{id:"w01-55",q:"Kto przewodniczy Komitetowi Sterującemu w strukturze PRINCE2?",a:["Executive (Przewodniczący)","Senior User","Senior Supplier","Project Support"],w:["Główny użytkownik – członek komitetu.","Główny dostawca – członek komitetu.","Wsparcie – poza komitetem."],e:"Komitet: Executive (przewodniczący), Senior User, Senior Supplier; Project Assurance – nadzór."},{id:"w01-56",q:"Który element jest nowy w PRINCE2 7 (pięć elementów)?",a:["Ludzie","Zasady","Praktyki","Procesy"],w:["Zasady były wcześniej.","Praktyki (tematy) były wcześniej.","Procesy były wcześniej."],e:"Pięć elementów: kontekst projektu, ludzie (nowy), praktyki, procesy, zasady."},{id:"w01-57",q:"Co jest stałe w PRINCE2 Agile?",a:["Czas i koszt (zerowa tolerancja)","Zakres","Wszystkie funkcje","Ryzyko"],w:["Zakres jest elastyczny (MoSCoW).","Funkcje dostarcza się wg priorytetów.","Ryzyko może się zmieniać w granicach."],e:"PRINCE2 Agile: stały termin i koszt → negocjuje się zakres; krytyczne kryteria jakości stałe."},{id:"w01-58",q:"Która technika jest wymieniona w PRINCE2 Agile?",a:["MoSCoW","Metoda ścieżki krytycznej","Diagram Ishikawy","Analiza SWOT"],w:["CPM to klasyczne harmonogramowanie.","Nie wymieniona.","Nie wymieniona."],e:"Techniki: historyjki użytkownika, MoSCoW, wykres spalania, retrospektywa."},{id:"w01-59",q:"Które certyfikaty są przypisane do PMI?",a:["CAPM, PMP, PMI-ACP","PRINCE2 Foundation, Practitioner","PSM, CSM","ITIL Foundation"],w:["To PRINCE2.","To certyfikaty Scrum.","To ITIL."],e:"PMI: CAPM, PMP, PMI-ACP; PRINCE2: Foundation, Practitioner."},{id:"w01-60",q:"Które stwierdzenie o PMBOK i PRINCE2 jest prawdziwe?",a:["Uzupełniają się: PMBOK – źródło wiedzy i technik, PRINCE2 – ramy zarządzania","Wzajemnie się wykluczają","PRINCE2 jest słabiej sformalizowany niż PMBOK","PMBOK pochodzi z UK"],w:["Nie wykluczają się.","Odwrotnie – PMBOK jest słabiej sformalizowany.","PMBOK – USA."],e:"W praktyce oba podejścia się uzupełniają."}],fp={id:mp,title:jp,questions:gp},hp="w02",bp="W2a · Podejścia zwinne: XP, historyjki, FDD, Lean, DSDM",Sp=[{id:"w02-01",q:"Co jest ustalone, a co szacowane w podejściu zwinnym (value-driven)?",a:["Czas i zasoby ustalone → szacujemy zakres","Zakres ustalony → szacujemy czas i zasoby","Wszystko szacowane","Jakość szacowana, reszta ustalona"],w:["To podejście klasyczne (plan-driven).","Zawsze coś jest ustalone.","Jakość jest stała w obu podejściach."],e:"Klasyczne: zakres ustalony; zwinne: czas i zasoby ustalone. Jakość – stała w obu."},{id:"w02-02",q:"Co jest stałe zarówno w podejściu klasycznym, jak i zwinnym?",a:["Jakość","Zakres","Czas","Zasoby"],w:["Zakres stały tylko w klasycznym.","Czas stały tylko w zwinnym.","Zasoby stałe tylko w zwinnym."],e:"Jakość – stała w obu podejściach."},{id:"w02-03",q:"Do jakiego poziomu (wartości / zasady / ramy / praktyki) wykład przypisuje XP?",a:["Praktyki – jak wytwarzamy (TDD, pary, refaktoryzacja, CI)","Wartości – Manifest Agile","Zasady – jak Lean","Ramy – jak Scrum"],w:["Wartości to Manifest Agile.","Zasady to Lean.","Ramy to Scrum, DSDM, Kanban, FDD…"],e:"Wartości (Manifest), zasady (Lean), ramy i metodyki (Scrum, DSDM…), praktyki (XP)."},{id:"w02-04",q:"Ile wartości i zasad ma Manifest Agile (2001)?",a:["4 wartości, 12 zasad","12
